name: Weekly Sanitise

on:
  schedule:
    # Sunday 04:23 UTC — off the :00 herd, clear of the daily 03:00 run
    - cron: '23 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: "weekly-sanitise"
  cancel-in-progress: false

jobs:
  sanitise:
    runs-on: ubuntu-latest
    outputs:
      changes-applied: ${{ steps.check-changes.outputs.changes-applied }}
      branch-name: ${{ steps.create-branch.outputs.branch-name }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "Game Sanitise Bot"

      - name: Create sanitise branch off main
        id: create-branch
        run: |
          BRANCH_NAME="sanitise/$(date +'%Y-%m-%d')"
          echo "branch-name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          git checkout -b "$BRANCH_NAME"
          git push origin "$BRANCH_NAME"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache agent-browser Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: agent-browser-chromium-${{ runner.os }}

      - name: Install agent-browser
        run: |
          npm install -g agent-browser http-server
          agent-browser install --with-deps

      - name: Install Claude Code skills (agent-browser + caveman)
        run: |
          npx skills add vercel-labs/agent-browser --skill agent-browser -a claude-code -y
          # caveman: ultra-terse output — pipeline chat is never read by humans
          npx skills add JuliusBrussee/caveman --skill caveman -a claude-code -y || echo "caveman skill unavailable, prompt fallback applies"

      - name: Start local HTTP server
        run: |
          http-server . -p 8080 --cors -c-1 &
          echo "HTTP_SERVER_PID=$!" >> $GITHUB_ENV
          sleep 2
          curl -sf http://localhost:8080/ > /dev/null && echo "HTTP server up"

      - name: Run weekly sanitise with Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-sonnet-5
            --dangerously-skip-permissions
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            OUTPUT STYLE: caveman ultra mode. Nobody reads this pipeline's chat
            output — keep every text response to the absolute minimum tokens
            (terse fragments, no pleasantries, no narration, no summaries).
            Spend tokens on files and tool calls, not prose. Code and committed
            files must remain normal, high-quality, and complete.

            TASK: Weekly sanitisation pass on this games codebase. Read CLAUDE.md
            first. Environment: full codebase in cwd, HTTP server at
            http://localhost:8080, agent-browser CLI via bash
            (open <url> | snapshot | screenshot <path> | wait <ms>).
            Relative paths only.

            Steps:
            1. CLEANUP: run `node scripts/validate-registry.mjs`. Fix any schema
               or missing-file problems it reports. Remove any committed runtime
               artifacts (playwright-report/, test-results/, stray screenshots
               or logs outside game folders). Ensure every registry entry's
               preview.png exists and is non-trivial (>10KB); regenerate missing
               or placeholder previews via agent-browser screenshot into the
               game's folder.
            2. DUPLICATE CHECK: read games-registry.json in full. Find true
               duplicates — same core mechanic with no mechanical innovation,
               or same input method + near-identical gameplay. For each
               duplicate pair, keep the higher-rated entry; mark the other
               "broken": true in the registry (hides from gallery, files stay
               on disk). If unsure whether a pair is a true duplicate, leave
               both alone — false positives are worse than none.
            3. RE-RATE: only adjust a game's "rating" when CONFIDENT it is
               misrated. Spot-check suspects with agent-browser (open, wait
               3000, screenshot, interact). Confident cases: rating 4.8+ but
               the game is bland/broken/unresponsive; rating <= 3.8 but the
               game is clearly polished and fun. New rating must stay in
               3.5-5.0. Never churn ratings by ±0.2 for taste. If nothing is
               confidently misrated, change nothing.
            4. DEAD-GAME SWEEP (bounded): sample up to 15 games — prioritize
               the oldest and any already suspicious. For each, use
               agent-browser: open, wait 3000, screenshot (must not be blank),
               interact, confirm the game visibly responds. Mark non-responders
               "broken": true in the registry. Do not attempt fixes — that is
               the fix workflow's job.
            5. Commit per logical change with descriptive messages. NEVER
               commit runtime artifacts (playwright-report/, test-results/,
               screenshots outside game folders, logs, .claude/skills).
            6. Finish by running `node scripts/validate-registry.mjs` — it
               must pass.

      - name: Stop HTTP server
        if: always()
        run: kill $HTTP_SERVER_PID 2>/dev/null || true

      - name: Check for changes
        id: check-changes
        run: |
          # Never let runtime artifacts sneak into the commit
          rm -rf playwright-report test-results .claude/skills .agents skills-lock.json output.txt
          git add -A

          STAGED_COUNT=$(git diff --staged --name-only | wc -l | tr -d ' ')
          COMMITS_AHEAD=$(git rev-list --count origin/main..HEAD 2>/dev/null || echo "0")

          if [ "$STAGED_COUNT" -gt 0 ]; then
            git commit -m "🧹 Weekly sanitise pass - $(date +'%Y-%m-%d')"
            echo "changes-applied=true" >> $GITHUB_OUTPUT
          elif [ "$COMMITS_AHEAD" -gt 0 ]; then
            echo "changes-applied=true" >> $GITHUB_OUTPUT
          else
            echo "No changes — arcade is clean"
            echo "changes-applied=false" >> $GITHUB_OUTPUT
          fi

      - name: Push sanitise branch
        if: steps.check-changes.outputs.changes-applied == 'true'
        run: git push origin "${{ steps.create-branch.outputs.branch-name }}"

      - name: Delete branch if no changes
        if: steps.check-changes.outputs.changes-applied == 'false'
        run: git push origin --delete "${{ steps.create-branch.outputs.branch-name }}" || true

  regression-tests:
    needs: sanitise
    if: needs.sanitise.outputs.changes-applied == 'true'
    runs-on: ubuntu-latest
    outputs:
      tests-passed: ${{ steps.run-tests.outputs.tests-passed }}

    steps:
      - name: Checkout sanitise branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sanitise.outputs.branch-name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Validate registry
        run: node scripts/validate-registry.mjs

      - name: Run regression tests
        id: run-tests
        run: |
          git fetch origin main
          # Sanitise usually touches registry only; test any games it changed.
          # Full suite is slow and CDN-flaky — unchanged games were gated on
          # their own merge day.
          TEST_FILES=$(git diff --name-only origin/main...HEAD -- 'games/**' \
            | cut -d/ -f1-2 | sort -u \
            | while read -r d; do [ -f "$d/game.test.js" ] && echo "$d/game.test.js"; done)

          if [ -z "$TEST_FILES" ]; then
            echo "No game files changed — registry-only sanitise, validator already passed"
            echo "tests-passed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Testing: $(echo "$TEST_FILES" | wc -l) suite(s)"
          if npx playwright test $TEST_FILES; then
            echo "tests-passed=true" >> $GITHUB_OUTPUT
          else
            echo "tests-passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sanitise-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  merge-to-main:
    needs: [sanitise, regression-tests]
    if: needs.regression-tests.outputs.tests-passed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "Game Sanitise Bot"

      - name: Merge sanitise branch to main
        run: |
          git fetch origin
          git checkout main
          git merge --no-ff origin/${{ needs.sanitise.outputs.branch-name }} \
            -m "🧹 Merge weekly sanitise from ${{ needs.sanitise.outputs.branch-name }}"
          git push origin main

      - name: Delete sanitise branch
        run: git push origin --delete ${{ needs.sanitise.outputs.branch-name }}

  deploy:
    needs: merge-to-main
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
