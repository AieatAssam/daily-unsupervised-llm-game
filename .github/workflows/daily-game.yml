name: Daily Game

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Shared with weekly-maintenance: both push to main, so they must not overlap.
  # Not "pages" — the called deploy workflow holds that group.
  group: arcade-writes
  cancel-in-progress: false

env:
  AUTHOR_MODEL: claude-haiku-5-5
  CRITIC_MODEL: claude-haiku-5-5

jobs:
  # One job, no pushed work branch: the game only ever reaches the remote as a
  # commit on main after the final gate passes, so failed runs leave nothing behind.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      shipped: ${{ steps.ship.outputs.shipped }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Pick the date
        id: date
        run: |
          DATE=$(date -u +%F)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          if [ -d "games/$DATE" ]; then
            echo "games/$DATE already exists — nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.date.outputs.skip != 'true'
        with:
          node-version: '22'
          cache: npm

      - name: Install test + browser tooling
        if: steps.date.outputs.skip != 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm install -g agent-browser
          agent-browser install --with-deps
          npx skills add vercel-labs/agent-browser --skill agent-browser -a claude-code -y

      - name: Start local server
        if: steps.date.outputs.skip != 'true'
        run: |
          npx http-server . -p 8080 -c-1 -s &
          curl -sf --retry 10 --retry-connrefused --retry-delay 1 http://localhost:8080/ > /dev/null

      - name: Author — design and build the game
        if: steps.date.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --model ${{ env.AUTHOR_MODEL }}
            --dangerously-skip-permissions
          prompt: |
            Read AGENTS.md in full first; it is the spec. Reply in terse fragments —
            nobody reads this output.

            TASK: build the daily game for ${{ steps.date.outputs.date }} by following
            "Building the daily game" in AGENTS.md, steps 1–6, in order.

            - Start with `node scripts/idea-brief.mjs --date ${{ steps.date.outputs.date }}`
              and do the three-concept comparison before writing any code.
            - Server: http://localhost:8080. Playwright and agent-browser are installed.
            - You may only create/modify games/${{ steps.date.outputs.date }}/{index.html,game.test.js,preview.png}
              and append one entry to games-registry.json. Any other change fails the run.
            - Done means: `npx playwright test games/${{ steps.date.outputs.date }}` and
              `node scripts/validate-registry.mjs` both pass, and you have looked at the
              frames in playtest/${{ steps.date.outputs.date }}/.
            - Do not commit or push.

      - name: Gate (first pass — feeds the critic)
        if: steps.date.outputs.skip != 'true'
        id: gate1
        continue-on-error: true
        run: scripts/gate.sh "${{ steps.date.outputs.date }}" 2>&1 | tee gate.log

      - name: Critic — play it, judge it, fix it
        if: steps.date.outputs.skip != 'true' && hashFiles(format('games/{0}/index.html', steps.date.outputs.date)) != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --model ${{ env.CRITIC_MODEL }}
            --dangerously-skip-permissions
          prompt: |
            Read AGENTS.md in full first. Reply in terse fragments.

            TASK: you are the critic for games/${{ steps.date.outputs.date }}/, written by
            another agent. Follow "Reviewing a game (critic pass)" in AGENTS.md.

            - The automated gate result is in gate.log (status: ${{ steps.gate1.outcome }}).
              If it failed, fix those failures first — in the game, not the suite.
            - Then play the game yourself at
              http://localhost:8080/games/${{ steps.date.outputs.date }}/index.html
              with agent-browser, read the screenshots, look at
              playtest/${{ steps.date.outputs.date }}/, and score the rubric.
            - Fix anything scoring ≤ 2, re-run
              `npx playwright test games/${{ steps.date.outputs.date }}`, refresh
              preview.png if the look changed, and set an honest registry rating.
            - Same file limits as the author: only games/${{ steps.date.outputs.date }}/
              and that game's entry in games-registry.json. Do not commit or push.

      - name: Gate (final)
        if: steps.date.outputs.skip != 'true'
        run: scripts/gate.sh "${{ steps.date.outputs.date }}"

      - name: Ship to main
        if: steps.date.outputs.skip != 'true'
        id: ship
        env:
          DATE: ${{ steps.date.outputs.date }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME=$(jq -r --arg d "$DATE" '.[] | select(.id == $d) | .name' games-registry.json)
          git config user.name "Daily Game Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "games/$DATE" games-registry.json
          git commit -m "🎮 Daily Game: $NAME - $DATE"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase "$REMOTE" main
          git push "$REMOTE" HEAD:main
          echo "shipped=true" >> "$GITHUB_OUTPUT"

      - name: Upload play-test evidence
        if: always() && steps.date.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playtest-${{ steps.date.outputs.date }}
          path: |
            playtest/
            playwright-report/
            gate.log
            games/${{ steps.date.outputs.date }}/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    needs: build
    if: needs.build.outputs.shipped == 'true'
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
