<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Socket Shift</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05030a; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }
  #root { width: 100%; height: 100%; }

  .app {
    width: 100%; height: 100%; position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; overflow: hidden; gap: 6px; padding: 6px 0;
    background: radial-gradient(circle at 50% 20%, #0a1a24 0%, #080a14 55%, #030308 100%);
  }

  .hud {
    position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-around;
    padding: 10px 12px; z-index: 15; pointer-events: none;
  }
  .hudBox { text-align: center; }
  .hudLabel { font-size: 10px; letter-spacing: 2px; color: #5eeaff; text-transform: uppercase; }
  .hudValue {
    font-size: 22px; font-weight: 800; color: #fff;
    text-shadow: 0 0 10px #5eeaff, 0 0 20px #5eeaff;
  }
  .hudValue.combo { color: #ffd23d; text-shadow: 0 0 10px #ffd23d, 0 0 22px #b3860a; }
  .hudValue.lives { color: #ff5ec4; text-shadow: 0 0 10px #ff5ec4, 0 0 22px #c9007f; }
  .hudValue.hurt { animation: hurtPulse 0.4s ease; }
  @keyframes hurtPulse { 0%,100% { opacity:1; transform: scale(1);} 50% { opacity:0.4; transform: scale(1.25);} }

  .title {
    font-size: clamp(18px, 5vw, 30px); font-weight: 900; letter-spacing: 3px; margin-top: 34px;
    background: linear-gradient(90deg, #5eeaff, #ffd23d, #ff5ec4);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(94,234,255,0.6));
    animation: titlePulse 2.4s ease-in-out infinite;
    text-align: center;
  }
  @keyframes titlePulse { 0%,100% { filter: drop-shadow(0 0 12px rgba(94,234,255,0.6)); } 50% { filter: drop-shadow(0 0 26px rgba(255,210,61,0.85)); } }

  .subtitle { color: #c8bcd8; font-size: 13px; letter-spacing: 0.5px; text-align: center; max-width: 460px; line-height: 1.55; }

  .btn {
    padding: 15px 40px; font-size: 19px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(135deg, #5eeaff, #ffd23d);
    border: none; border-radius: 50px; color: #001820; cursor: pointer;
    box-shadow: 0 0 20px rgba(94,234,255,0.7), 0 0 50px rgba(255,210,61,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(94,234,255,0.9), 0 0 70px rgba(255,210,61,0.5); }
  .btn:active { transform: scale(0.96); }

  .highscoreLine { color: #ffd23d; font-size: 14px; text-shadow: 0 0 8px rgba(255,210,61,0.6); }

  .arenaOuter {
    position: relative; width: min(94vw, 460px); height: min(58vh, 400px); z-index: 5;
    border-radius: 18px; overflow: hidden; border: 2px solid rgba(94,234,255,0.25);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 0 30px rgba(94,234,255,0.12);
    background: #060812; touch-action: none;
  }
  .arenaOuter.shakeIt { animation: shakeKf 0.3s ease; }
  @keyframes shakeKf {
    0%, 100% { transform: translate(0,0); }
    20% { transform: translate(-6px, 3px); }
    40% { transform: translate(6px, -3px); }
    60% { transform: translate(-5px, -2px); }
    80% { transform: translate(5px, 2px); }
  }

  canvas.gameCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .flashOverlay {
    position: absolute; inset: 0; z-index: 9; pointer-events: none; background: rgba(255,46,79,0);
  }
  .flashOverlay.on { animation: flashKf 0.3s ease; }
  @keyframes flashKf { 0% { background: rgba(255,46,79,0.35); } 100% { background: rgba(255,46,79,0); } }

  .overlay {
    position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 18px;
    background: rgba(6, 8, 18, 0.92); backdrop-filter: blur(4px);
  }

  .controlsRow {
    position: relative; z-index: 6; display: flex; align-items: center; justify-content: center;
    gap: 28px; margin-top: 4px;
  }
  .rotBtn {
    width: 58px; height: 58px; border-radius: 50%; border: 2px solid rgba(94,234,255,0.5);
    background: radial-gradient(circle at 40% 35%, rgba(94,234,255,0.25), rgba(10,10,20,0.9));
    color: #5eeaff; font-size: 26px; font-weight: 900; cursor: pointer;
    box-shadow: 0 0 16px rgba(94,234,255,0.35); -webkit-appearance: none; appearance: none;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  .rotBtn:active { transform: scale(0.9); box-shadow: 0 0 24px rgba(94,234,255,0.7); }

  .status { color: #a898b8; font-size: 12px; letter-spacing: 0.5px; height: 15px; z-index: 10; text-align: center; }
  .footer { position: relative; text-align: center; color: #241f30; font-size: 10px; z-index: 10; padding-bottom: 2px; }

  @media (max-width: 480px) {
    .hudValue { font-size: 17px; }
    .btn { padding: 13px 30px; font-size: 16px; }
    .subtitle { font-size: 12px; }
    .arenaOuter { height: min(50vh, 360px); }
    .rotBtn { width: 52px; height: 52px; font-size: 22px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const HS_KEY = 'socketShift_highScore';
const LIVES_START = 3;
const CATCHES_PER_LEVEL = 6;
const ROT_SPEED = 170; // degrees per second while held
const DRAG_SENS = 0.55; // degrees per pixel dragged
const NUDGE_DEG = 20; // instant tap nudge

const PLUG_COLORS = ['#5eeaff', '#ff5ec4', '#b967ff'];
const GOLD_COLOR = '#ffd23d';

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function normAngle(a) { return ((a % 360) + 360) % 360; }
function angleDiff(a, b) { return (((a - b + 540) % 360) - 180); }

const fallDuration = (level) => clamp(3400 - (level - 1) * 220, 1500, 3400);
const tolerance = (level) => clamp(26 - (level - 1) * 1.6, 9, 26);
const spawnGap = (level) => clamp(1900 - (level - 1) * 90, 700, 1900);
const maxConcurrent = (level) => (level >= 8 ? 3 : level >= 4 ? 2 : 1);
const goldChance = (level) => clamp(0.1 + (level - 1) * 0.01, 0.1, 0.26);

function useAudio() {
  const ctxRef = useRef(null);
  const getCtx = () => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  };

  const tone = useCallback((freq, duration, type, gainScale, freqEnd) => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + duration);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(gainScale, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.05);
    } catch (e) {}
  }, []);

  const catchSound = useCallback((combo) => tone(480 + combo * 14, 0.1, 'triangle', 0.16, 900 + combo * 18), [tone]);
  const goldSound = useCallback(() => { tone(680, 0.1, 'sine', 0.18, 1080); setTimeout(() => tone(980, 0.14, 'sine', 0.16, 1400), 90); }, [tone]);
  const missSound = useCallback(() => tone(190, 0.28, 'sawtooth', 0.2, 70), [tone]);
  const nudgeSound = useCallback(() => tone(340, 0.03, 'sine', 0.035, 400), [tone]);
  const levelUpSound = useCallback(() => { tone(520, 0.12, 'sine', 0.18, 820); setTimeout(() => tone(760, 0.16, 'sine', 0.18, 1150), 110); }, [tone]);
  const overSound = useCallback(() => { tone(300, 0.25, 'sawtooth', 0.2, 200); setTimeout(() => tone(180, 0.35, 'sawtooth', 0.2, 80), 150); }, [tone]);

  return { catchSound, goldSound, missSound, nudgeSound, levelUpSound, overSound };
}

function spawnBurst(arr, x, y, color, count, speedMin, speedMax, sizeMin, sizeMax, lifeMs) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = speedMin + Math.random() * (speedMax - speedMin);
    arr.push({
      x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      life: lifeMs, maxLife: lifeMs, color,
      size: sizeMin + Math.random() * (sizeMax - sizeMin),
    });
  }
}

function drawNotchRing(ctx, cx, cy, r, angleDeg, color, lineWidth, notchLen) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = lineWidth;
  ctx.shadowColor = color;
  ctx.shadowBlur = 14;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();

  const rad = (angleDeg - 90) * Math.PI / 180;
  const x1 = cx + Math.cos(rad) * (r - notchLen);
  const y1 = cy + Math.sin(rad) * (r - notchLen);
  const x2 = cx + Math.cos(rad) * (r + notchLen * 0.6);
  const y2 = cy + Math.sin(rad) * (r + notchLen * 0.6);
  ctx.lineWidth = lineWidth + 2;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.restore();
}

function App() {
  const [phase, setPhase] = useState('start'); // start | playing | over
  const [score, setScore] = useState(0);
  const [lives, setLives] = useState(LIVES_START);
  const [combo, setCombo] = useState(0);
  const [level, setLevel] = useState(1);
  const [hurt, setHurt] = useState(false);
  const [shakeIt, setShakeIt] = useState(false);
  const [flashOn, setFlashOn] = useState(false);
  const [highScore, setHighScore] = useState(() => parseInt(localStorage.getItem(HS_KEY) || '0', 10));
  const [statusMsg, setStatusMsg] = useState('Rotate the socket to match each falling key before it lands.');

  const canvasRef = useRef(null);
  const arenaRef = useRef(null);
  const angleRef = useRef(0);
  const plugsRef = useRef([]);
  const particlesRef = useRef([]);
  const keysHeldRef = useRef({ left: false, right: false });
  const buttonHeldRef = useRef({ left: false, right: false });
  const dragRef = useRef({ active: false, startX: 0, startAngle: 0, moved: false });
  const scoreRef = useRef(0);
  const comboRef = useRef(0);
  const livesRef = useRef(LIVES_START);
  const levelRef = useRef(1);
  const catchesRef = useRef(0);
  const idCounterRef = useRef(0);
  const highScoreRef = useRef(highScore);
  const phaseRef = useRef('start');
  const spawnTimeoutRef = useRef(null);
  const rafRef = useRef(null);
  const lastTsRef = useRef(null);

  const { catchSound, goldSound, missSound, nudgeSound, levelUpSound, overSound } = useAudio();

  useEffect(() => { phaseRef.current = phase; }, [phase]);

  const resizeCanvas = useCallback(() => {
    const canvas = canvasRef.current;
    const arena = arenaRef.current;
    if (!canvas || !arena) return;
    const rect = arena.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }, []);

  useEffect(() => {
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    return () => window.removeEventListener('resize', resizeCanvas);
  }, [resizeCanvas]);

  const clearAllTimers = useCallback(() => {
    clearTimeout(spawnTimeoutRef.current);
  }, []);

  const endGame = useCallback(() => {
    phaseRef.current = 'over';
    clearAllTimers();
    setPhase('over');
    overSound();
    setStatusMsg('Lock jammed.');
  }, [overSound, clearAllTimers]);

  const doSpawn = useCallback(() => {
    if (phaseRef.current !== 'playing') return;
    const activeCount = plugsRef.current.length;
    if (activeCount >= maxConcurrent(levelRef.current)) return;
    const gold = Math.random() < goldChance(levelRef.current);
    const id = ++idCounterRef.current;
    plugsRef.current.push({
      id,
      angle: Math.floor(Math.random() * 360),
      color: gold ? GOLD_COLOR : PLUG_COLORS[Math.floor(Math.random() * PLUG_COLORS.length)],
      gold,
      startTs: performance.now(),
      duration: fallDuration(levelRef.current),
      laneOffset: (activeCount % 3 - 1) * 38,
      processed: false,
    });
  }, []);

  const scheduleSpawn = useCallback(() => {
    spawnTimeoutRef.current = setTimeout(() => {
      if (phaseRef.current === 'playing') doSpawn();
      if (phaseRef.current === 'playing') scheduleSpawn();
    }, spawnGap(levelRef.current));
  }, [doSpawn]);

  const processCatch = useCallback((plug, cx, cy) => {
    const diff = Math.abs(angleDiff(plug.angle, angleRef.current));
    const tol = tolerance(levelRef.current);
    const hit = diff <= tol;

    if (hit) {
      comboRef.current += 1;
      setCombo(comboRef.current);
      const precisionBonus = Math.round((1 - diff / tol) * 20);
      const base = plug.gold ? 60 : 15;
      const gained = base + comboRef.current * 3 + precisionBonus;
      scoreRef.current += gained;
      setScore(scoreRef.current);
      if (scoreRef.current > highScoreRef.current) {
        highScoreRef.current = scoreRef.current;
        localStorage.setItem(HS_KEY, String(scoreRef.current));
        setHighScore(scoreRef.current);
      }
      if (plug.gold) goldSound(); else catchSound(comboRef.current);
      spawnBurst(particlesRef.current, cx, cy, plug.color, plug.gold ? 20 : 12, 50, 220, 2, 5, 480);
      catchesRef.current += 1;
      if (catchesRef.current % CATCHES_PER_LEVEL === 0) {
        levelRef.current += 1;
        setLevel(levelRef.current);
        levelUpSound();
        setStatusMsg(`Level ${levelRef.current}! Keys fall faster, tolerance tightens.`);
      } else {
        setStatusMsg(diff < tol * 0.3 ? 'Perfect lock!' : 'Locked in.');
      }
    } else {
      comboRef.current = 0;
      setCombo(0);
      livesRef.current -= 1;
      setLives(livesRef.current);
      setHurt(true);
      setTimeout(() => setHurt(false), 400);
      setShakeIt(true);
      setTimeout(() => setShakeIt(false), 300);
      setFlashOn(true);
      setTimeout(() => setFlashOn(false), 300);
      missSound();
      spawnBurst(particlesRef.current, cx, cy, '#ff2e4f', 16, 60, 220, 2, 5, 480);
      setStatusMsg('Misaligned! Match the notch before it lands.');
      if (livesRef.current <= 0) { endGame(); return; }
    }
  }, [catchSound, goldSound, missSound, levelUpSound, endGame]);

  const rotateBy = useCallback((deg) => {
    angleRef.current = normAngle(angleRef.current + deg);
  }, []);

  const nudge = useCallback((dir) => {
    if (phaseRef.current !== 'playing') return;
    rotateBy(dir * NUDGE_DEG);
    nudgeSound();
  }, [rotateBy, nudgeSound]);

  useEffect(() => {
    const onKeyDown = (e) => {
      if (phaseRef.current !== 'playing') {
        if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); startGameRef.current && startGameRef.current(); }
        return;
      }
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); keysHeldRef.current.left = true; }
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); keysHeldRef.current.right = true; }
      else if (e.code === 'Space') { e.preventDefault(); }
    };
    const onKeyUp = (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keysHeldRef.current.left = false;
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') keysHeldRef.current.right = false;
    };
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    return () => {
      window.removeEventListener('keydown', onKeyDown);
      window.removeEventListener('keyup', onKeyUp);
    };
  }, []);

  const onArenaPointerDown = useCallback((e) => {
    if (phaseRef.current !== 'playing') return;
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    dragRef.current = { active: true, startX: x, startAngle: angleRef.current, moved: false };
  }, []);
  const onArenaPointerMove = useCallback((e) => {
    if (!dragRef.current.active) return;
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    const delta = x - dragRef.current.startX;
    if (Math.abs(delta) > 2) dragRef.current.moved = true;
    angleRef.current = normAngle(dragRef.current.startAngle + delta * DRAG_SENS);
  }, []);
  const onArenaPointerUp = useCallback(() => {
    dragRef.current.active = false;
  }, []);

  const tick = useCallback((ts) => {
    if (lastTsRef.current == null) lastTsRef.current = ts;
    const dt = Math.min((ts - lastTsRef.current) / 1000, 0.05);
    lastTsRef.current = ts;

    if (phaseRef.current === 'playing') {
      if (keysHeldRef.current.left || buttonHeldRef.current.left) rotateBy(-ROT_SPEED * dt);
      if (keysHeldRef.current.right || buttonHeldRef.current.right) rotateBy(ROT_SPEED * dt);
    }

    const canvas = canvasRef.current;
    if (canvas) {
      const ctx = canvas.getContext('2d');
      const rect = canvas.getBoundingClientRect();
      const w = rect.width, h = rect.height;
      ctx.clearRect(0, 0, w, h);

      const cx = w / 2;
      const socketY = h * 0.8;
      const socketR = Math.min(w, h) * 0.15;

      // ambient background wash (also keeps the whole canvas non-transparent)
      const grad = ctx.createRadialGradient(cx, h * 0.35, 10, cx, h * 0.35, Math.max(w, h) * 0.75);
      grad.addColorStop(0, 'rgba(20,26,44,0.9)');
      grad.addColorStop(1, 'rgba(4,5,10,0.95)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      // mini compass HUD (top-left) — always mirrors current socket angle
      drawNotchRing(ctx, 30, 30, 16, angleRef.current, '#5eeaff', 2, 8);

      // capture line
      ctx.save();
      ctx.strokeStyle = 'rgba(94,234,255,0.18)';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 8]);
      ctx.beginPath();
      ctx.moveTo(0, socketY);
      ctx.lineTo(w, socketY);
      ctx.stroke();
      ctx.restore();

      // tolerance arc
      const tol = tolerance(levelRef.current);
      ctx.save();
      ctx.strokeStyle = 'rgba(94,234,255,0.28)';
      ctx.lineWidth = socketR * 0.5;
      ctx.beginPath();
      const a0 = (angleRef.current - tol - 90) * Math.PI / 180;
      const a1 = (angleRef.current + tol - 90) * Math.PI / 180;
      ctx.arc(cx, socketY, socketR, a0, a1);
      ctx.stroke();
      ctx.restore();

      // socket
      drawNotchRing(ctx, cx, socketY, socketR, angleRef.current, '#5eeaff', 4, 16);

      // plugs
      if (phaseRef.current === 'playing') {
        const plugs = plugsRef.current;
        for (let i = plugs.length - 1; i >= 0; i--) {
          const plug = plugs[i];
          const elapsed = ts - plug.startTs;
          const t = clamp(elapsed / plug.duration, 0, 1);
          const y = t * socketY;
          const x = cx + plug.laneOffset * (1 - t * 0.6);
          const r = socketR * 0.55;

          if (!plug.processed && t >= 1) {
            plug.processed = true;
            processCatch(plug, x, socketY);
            plugs.splice(i, 1);
            continue;
          }
          drawNotchRing(ctx, x, y, r, plug.angle, plug.color, 3, 10);
          if (plug.gold) {
            ctx.save();
            ctx.strokeStyle = 'rgba(255,210,61,0.5)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(x, y, r + 6 + Math.sin(ts / 120) * 2, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          }
        }
      }

      // particles
      const particles = particlesRef.current;
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx * dt; pt.y += pt.vy * dt;
        pt.vx *= 0.93; pt.vy *= 0.93;
        pt.life -= dt * 1000;
        if (pt.life <= 0) { particles.splice(i, 1); continue; }
        ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    rafRef.current = requestAnimationFrame(tick);
  }, [rotateBy, processCatch]);

  useEffect(() => {
    rafRef.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(rafRef.current);
  }, [tick]);

  const startGameRef = useRef(null);

  const startGame = useCallback(() => {
    clearAllTimers();
    plugsRef.current = [];
    particlesRef.current = [];
    angleRef.current = 0;
    scoreRef.current = 0;
    comboRef.current = 0;
    livesRef.current = LIVES_START;
    levelRef.current = 1;
    catchesRef.current = 0;
    keysHeldRef.current = { left: false, right: false };
    buttonHeldRef.current = { left: false, right: false };
    setScore(0);
    setCombo(0);
    setLives(LIVES_START);
    setLevel(1);
    setStatusMsg('Hold ←/→, drag, or tap the rotate buttons to align the notch.');
    setPhase('playing');
    phaseRef.current = 'playing';
    resizeCanvas();
    scheduleSpawn();
  }, [clearAllTimers, scheduleSpawn, resizeCanvas]);

  useEffect(() => { startGameRef.current = startGame; }, [startGame]);
  useEffect(() => () => clearAllTimers(), [clearAllTimers]);

  const holdStart = (dir) => (e) => {
    e.preventDefault();
    if (phaseRef.current !== 'playing') return;
    if (dir < 0) buttonHeldRef.current.left = true; else buttonHeldRef.current.right = true;
  };
  const holdEnd = (dir) => () => {
    if (dir < 0) buttonHeldRef.current.left = false; else buttonHeldRef.current.right = false;
  };

  return (
    <div className="app" data-testid="game-canvas">
      <div className="hud">
        <div className="hudBox">
          <div className="hudLabel">Score</div>
          <div className="hudValue" data-testid="score">{score}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Lives</div>
          <div className={`hudValue lives ${hurt ? 'hurt' : ''}`} data-testid="lives">{'❤'.repeat(Math.max(0, lives))}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Combo</div>
          <div className="hudValue combo" data-testid="combo">x{combo}</div>
        </div>
      </div>

      <div className="title">SOCKET SHIFT</div>

      <div
        className={`arenaOuter ${shakeIt ? 'shakeIt' : ''}`}
        ref={arenaRef}
        data-testid="play-field"
        onMouseDown={onArenaPointerDown}
        onMouseMove={onArenaPointerMove}
        onMouseUp={onArenaPointerUp}
        onMouseLeave={onArenaPointerUp}
        onTouchStart={onArenaPointerDown}
        onTouchMove={onArenaPointerMove}
        onTouchEnd={onArenaPointerUp}
      >
        <canvas ref={canvasRef} className="gameCanvas" data-testid="canvas" />
        <div className={`flashOverlay ${flashOn ? 'on' : ''}`} />

        {phase === 'start' && (
          <div className="overlay">
            <div className="subtitle">Neon keys drift down toward the socket ring, each stamped with a notch at its own angle — rotate the socket to match before the key reaches the capture line. Hold Left/Right or A/D, drag anywhere in the field, or tap the rotate buttons to swing the notch into place. A clean lock chains a rising combo and score, with a precision bonus for a dead-center match; a misaligned key costs one of three lives and resets your streak. Gold keys pay out big. Every six locks levels you up, dropping keys faster and tightening the tolerance window.</div>
            <div className="highscoreLine" data-testid="high-score">Best: {highScore}</div>
            <button className="btn" data-testid="start-btn" onClick={() => startGame()}>START</button>
          </div>
        )}

        {phase === 'over' && (
          <div className="overlay">
            <div className="title" style={{ fontSize: 'clamp(20px, 6vw, 30px)', marginTop: 0 }}>LOCK JAMMED</div>
            <div className="hudValue" data-testid="final-score">Score: {score}</div>
            <div className="highscoreLine" data-testid="high-score-final">Best: {highScore}</div>
            <button className="btn" data-testid="restart-btn" onClick={() => startGame()}>PLAY AGAIN</button>
          </div>
        )}
      </div>

      {phase === 'playing' && (
        <div className="controlsRow">
          <button
            type="button"
            className="rotBtn"
            data-testid="rotate-left"
            onClick={() => nudge(-1)}
            onMouseDown={holdStart(-1)}
            onMouseUp={holdEnd(-1)}
            onMouseLeave={holdEnd(-1)}
            onTouchStart={holdStart(-1)}
            onTouchEnd={holdEnd(-1)}
          >&#8634;</button>
          <button
            type="button"
            className="rotBtn"
            data-testid="rotate-right"
            onClick={() => nudge(1)}
            onMouseDown={holdStart(1)}
            onMouseUp={holdEnd(1)}
            onMouseLeave={holdEnd(1)}
            onTouchStart={holdStart(1)}
            onTouchEnd={holdEnd(1)}
          >&#8635;</button>
        </div>
      )}

      <div className="status">{statusMsg}</div>
      <div className="footer">Socket Shift — Level {level} — align the notch, lock the key</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
