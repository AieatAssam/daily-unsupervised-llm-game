<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Pulse Strike</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05030d; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }
  #root { width: 100%; height: 100%; }

  .app {
    width: 100%; height: 100%; position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: center; overflow: hidden; gap: 8px;
    background: radial-gradient(circle at 50% 25%, #13092b 0%, #0a0518 55%, #030109 100%);
  }

  .bgAnim {
    position: absolute; inset: 0; pointer-events: none; opacity: 0.5;
    background: repeating-radial-gradient(circle at 50% 50%, rgba(120,0,255,0.06) 0, rgba(120,0,255,0.06) 2px, transparent 2px, transparent 40px);
    animation: bgspin 70s linear infinite;
  }
  @keyframes bgspin { from { transform: rotate(0deg) scale(1.4); } to { transform: rotate(360deg) scale(1.4); } }

  .hud {
    position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-around;
    padding: 10px 12px; z-index: 15; pointer-events: none;
  }
  .hudBox { text-align: center; }
  .hudLabel { font-size: 10px; letter-spacing: 2px; color: #7d6bd0; text-transform: uppercase; }
  .hudValue {
    font-size: 21px; font-weight: 800; color: #fff;
    text-shadow: 0 0 10px #b967ff, 0 0 20px #b967ff;
  }
  .hudValue.combo { color: #ffe45e; text-shadow: 0 0 10px #ffe45e, 0 0 22px #ff9d00; }
  .hudValue.urgent { color: #ff4d4d; text-shadow: 0 0 10px #ff4d4d, 0 0 22px #ff0000; animation: urgentPulse 0.5s infinite; }
  .hudValue.lives { color: #ff5e7d; text-shadow: 0 0 10px #ff5e7d, 0 0 22px #ff0033; }
  .hudValue.hurt { animation: hurtPulse 0.4s ease; }
  @keyframes urgentPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  @keyframes hurtPulse { 0%,100% { opacity:1; transform: scale(1);} 50% { opacity:0.4; transform: scale(1.25);} }

  .title {
    font-size: clamp(24px, 6vw, 38px); font-weight: 900; letter-spacing: 3px;
    background: linear-gradient(90deg, #ff2bd6, #7c4dff, #2be9ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(190,80,255,0.6));
    animation: titlePulse 2.4s ease-in-out infinite;
    text-align: center; margin-top: 38px;
  }
  @keyframes titlePulse { 0%,100% { filter: drop-shadow(0 0 12px rgba(190,80,255,0.6)); } 50% { filter: drop-shadow(0 0 26px rgba(190,80,255,0.95)); } }

  .subtitle { color: #a297d6; font-size: 14px; letter-spacing: 0.5px; text-align: center; max-width: 340px; line-height: 1.5; }

  .btn {
    padding: 15px 40px; font-size: 19px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(135deg, #b845ff, #4d5bff);
    border: none; border-radius: 50px; color: #fff; cursor: pointer;
    box-shadow: 0 0 20px rgba(150,70,255,0.7), 0 0 50px rgba(80,60,255,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(150,70,255,0.9), 0 0 70px rgba(80,60,255,0.5); }
  .btn:active { transform: scale(0.96); }

  .highscoreLine { color: #ffd35e; font-size: 14px; text-shadow: 0 0 8px rgba(255,200,50,0.6); }

  .gridOuter {
    position: relative; width: min(88vmin, 420px); height: min(88vmin, 420px); z-index: 5;
  }

  .padGrid {
    position: absolute; inset: 0; display: grid;
    grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr);
    gap: 10px; padding: 10px; border-radius: 22px;
    background: rgba(10, 5, 24, 0.55); border: 2px solid rgba(180,120,255,0.25);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.55), 0 0 30px rgba(120,60,255,0.15);
  }

  .pad {
    position: relative; border-radius: 16px; cursor: pointer; overflow: hidden;
    background: rgba(255,255,255,0.04); border: 1.5px solid rgba(255,255,255,0.07);
    transition: transform 0.1s ease, background 0.15s ease, box-shadow 0.15s ease;
  }
  .pad:active { transform: scale(0.92); }

  .pad.good { background: radial-gradient(circle at 35% 30%, #6df5ff, #0080b3); box-shadow: 0 0 18px #5ef0ff, inset 0 0 10px rgba(0,0,0,0.3); animation: padPulse 0.5s ease-in-out infinite alternate; }
  .pad.gold { background: radial-gradient(circle at 35% 30%, #ffe98f, #b37f00); box-shadow: 0 0 22px #ffd15e, inset 0 0 10px rgba(0,0,0,0.3); animation: padPulseBig 0.4s ease-in-out infinite alternate; }
  .pad.bad { background: radial-gradient(circle at 35% 30%, #ff8f9d, #b3003f); box-shadow: 0 0 18px #ff5e7d, inset 0 0 10px rgba(0,0,0,0.3); animation: padPulse 0.35s ease-in-out infinite alternate; }
  @keyframes padPulse { from { opacity: 0.82; } to { opacity: 1; } }
  @keyframes padPulseBig { from { opacity: 0.85; transform: scale(1); } to { opacity: 1; transform: scale(1.04); } }

  .pad.wrongFlash { animation: denyFlash 0.22s ease; }
  @keyframes denyFlash {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.9); }
  }

  .fuse {
    position: absolute; left: 0; right: 0; bottom: 0; height: 5px;
    background: rgba(255,255,255,0.85); transform-origin: left center;
    animation-name: fuseShrink; animation-timing-function: linear; animation-fill-mode: forwards;
  }
  @keyframes fuseShrink { from { transform: scaleX(1); } to { transform: scaleX(0); } }

  .icon { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: clamp(18px, 6vw, 28px); font-weight: 900; color: rgba(255,255,255,0.9); text-shadow: 0 0 10px rgba(0,0,0,0.5); pointer-events: none; }

  .particle { position: absolute; border-radius: 50%; pointer-events: none; z-index: 12; will-change: transform, opacity; }
  .ripple { position: absolute; border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; pointer-events: none; z-index: 11; will-change: transform, opacity; }

  .overlay {
    position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 20px;
    background: rgba(5, 3, 13, 0.87); backdrop-filter: blur(4px); border-radius: 22px;
  }

  .status { color: #cfc4ff; font-size: 13px; letter-spacing: 0.5px; height: 17px; z-index: 10; text-align: center; }

  .footer { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; color: #55488a; font-size: 11px; z-index: 10; }

  @media (max-width: 480px) {
    .hudValue { font-size: 17px; }
    .btn { padding: 13px 30px; font-size: 16px; }
    .subtitle { font-size: 13px; }
    .title { margin-top: 30px; }
    .gridOuter { width: min(90vmin, 380px); height: min(90vmin, 380px); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const HS_KEY = 'pulseStrike_highScore';
const SIZE = 4;
const CELLS = SIZE * SIZE;
const GAME_TIME = 45;
const LIVES_START = 3;

function pickType(level) {
  const badChance = Math.min(0.32, 0.13 + level * 0.025);
  const goldChance = 0.12;
  const r = Math.random();
  if (r < badChance) return 'bad';
  if (r < badChance + goldChance) return 'gold';
  return 'good';
}

function maxActiveForLevel(level) { return Math.min(4, 1 + Math.floor((level - 1) / 1.4)); }
function spawnIntervalForLevel(level) { return Math.max(360, 920 - level * 85 + (Math.random() * 160 - 80)); }
function durationForLevel(level) { return Math.max(560, 1320 - level * 110); }

function useAudio() {
  const ctxRef = useRef(null);
  const getCtx = () => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  };

  const tone = useCallback((freq, duration = 0.2, type = 'triangle', gainScale = 0.18, freqEnd) => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + duration);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(gainScale, ctx.currentTime + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.05);
    } catch (e) {}
  }, []);

  const tapSound = useCallback(() => tone(500, 0.05, 'sine', 0.05), [tone]);
  const hitSound = useCallback((combo) => tone(420 + Math.min(combo, 12) * 24, 0.16, 'triangle', 0.18, 700), [tone]);
  const goldSound = useCallback(() => { tone(660, 0.14, 'square', 0.18, 1100); setTimeout(() => tone(880, 0.18, 'sine', 0.14), 70); }, [tone]);
  const badSound = useCallback(() => tone(160, 0.22, 'sawtooth', 0.2, 60), [tone]);
  const missSound = useCallback(() => tone(220, 0.14, 'sawtooth', 0.1, 140), [tone]);
  const overSound = useCallback(() => { tone(320, 0.25, 'sawtooth', 0.2, 220); setTimeout(() => tone(200, 0.35, 'sawtooth', 0.2, 90), 150); }, [tone]);

  return { tapSound, hitSound, goldSound, badSound, missSound, overSound };
}

function Particle({ x, y, color, onDone }) {
  const angle = Math.random() * Math.PI * 2;
  const dist = 25 + Math.random() * 50;
  const dx = Math.cos(angle) * dist;
  const dy = Math.sin(angle) * dist;
  const size = 3 + Math.random() * 5;
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const anim = el.animate([
      { transform: 'translate(0,0) scale(1)', opacity: 1 },
      { transform: `translate(${dx}px, ${dy}px) scale(0)`, opacity: 0 }
    ], { duration: 450 + Math.random() * 300, easing: 'cubic-bezier(.2,.8,.3,1)' });
    anim.onfinish = onDone;
  }, []);
  return (
    <div ref={ref} className="particle" style={{ left: x, top: y, width: size, height: size, background: color }} />
  );
}

function Ripple({ x, y, onDone }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const anim = el.animate([
      { transform: 'translate(-50%,-50%) scale(0.2)', opacity: 0.7 },
      { transform: 'translate(-50%,-50%) scale(2.2)', opacity: 0 }
    ], { duration: 380, easing: 'ease-out' });
    anim.onfinish = onDone;
  }, []);
  return <div ref={ref} className="ripple" style={{ left: x, top: y, width: 46, height: 46 }} />;
}

function App() {
  const [phase, setPhase] = useState('start'); // start | playing | over
  const [pads, setPads] = useState(() => Array(CELLS).fill(null));
  const [flashCells, setFlashCells] = useState(new Set());
  const [score, setScore] = useState(0);
  const [combo, setCombo] = useState(0);
  const [lives, setLives] = useState(LIVES_START);
  const [level, setLevel] = useState(1);
  const [timeLeft, setTimeLeft] = useState(GAME_TIME);
  const [hurt, setHurt] = useState(false);
  const [highScore, setHighScore] = useState(() => parseInt(localStorage.getItem(HS_KEY) || '0', 10));
  const [statusMsg, setStatusMsg] = useState('Strike glowing pads before they fade. Avoid the red ones!');
  const [particles, setParticles] = useState([]);
  const [ripples, setRipples] = useState([]);

  const gridRef = useRef(null);
  const padsRef = useRef(pads);
  const padTimersRef = useRef({});
  const spawnTimerRef = useRef(null);
  const scoreRef = useRef(0);
  const comboRef = useRef(0);
  const livesRef = useRef(LIVES_START);
  const levelRef = useRef(1);
  const highScoreRef = useRef(highScore);
  const phaseRef = useRef('start');
  const particleId = useRef(0);
  const activationId = useRef(0);
  const timeoutsRef = useRef([]);
  const { tapSound, hitSound, goldSound, badSound, missSound, overSound } = useAudio();

  useEffect(() => { phaseRef.current = phase; }, [phase]);
  useEffect(() => { padsRef.current = pads; }, [pads]);

  const addTimer = (fn, ms) => {
    const id = setTimeout(fn, ms);
    timeoutsRef.current.push(id);
    return id;
  };
  const clearAllTimers = () => {
    timeoutsRef.current.forEach(clearTimeout);
    timeoutsRef.current = [];
    if (spawnTimerRef.current) clearTimeout(spawnTimerRef.current);
    padTimersRef.current = {};
  };
  useEffect(() => () => clearAllTimers(), []);

  // countdown clock
  useEffect(() => {
    if (phase !== 'playing') return;
    const id = setInterval(() => {
      setTimeLeft(t => (t <= 1 ? 0 : t - 1));
    }, 1000);
    return () => clearInterval(id);
  }, [phase]);

  useEffect(() => {
    if (phase === 'playing' && timeLeft === 0) {
      endGame("Time's up!");
    }
  }, [timeLeft, phase]);

  // difficulty level tracks elapsed time
  useEffect(() => {
    if (phase !== 'playing') return;
    const elapsed = GAME_TIME - timeLeft;
    const lvl = Math.min(8, Math.floor(elapsed / 8) + 1);
    if (lvl !== levelRef.current) {
      levelRef.current = lvl;
      setLevel(lvl);
      setStatusMsg(`Level ${lvl} — pads move faster!`);
    }
  }, [timeLeft, phase]);

  const spawnParticles = useCallback((idx, glow, count) => {
    const grid = gridRef.current;
    if (!grid) return;
    const rect = grid.getBoundingClientRect();
    const cellW = rect.width / SIZE;
    const cellH = rect.height / SIZE;
    const r = Math.floor(idx / SIZE), c = idx % SIZE;
    const x = (c + 0.5) * cellW;
    const y = (r + 0.5) * cellH;
    const newParticles = [];
    for (let i = 0; i < count; i++) newParticles.push({ id: particleId.current++, x, y, color: glow });
    setParticles(prev => [...prev, ...newParticles]);
  }, []);

  const spawnRipple = useCallback((idx) => {
    const grid = gridRef.current;
    if (!grid) return;
    const rect = grid.getBoundingClientRect();
    const cellW = rect.width / SIZE;
    const cellH = rect.height / SIZE;
    const r = Math.floor(idx / SIZE), c = idx % SIZE;
    const x = (c + 0.5) * cellW;
    const y = (r + 0.5) * cellH;
    setRipples(prev => [...prev, { id: particleId.current++, x, y }]);
  }, []);

  const removeParticle = (id) => setParticles(prev => prev.filter(p => p.id !== id));
  const removeRipple = (id) => setRipples(prev => prev.filter(p => p.id !== id));

  const deactivatePad = (idx) => {
    setPads(prev => {
      const next = prev.slice();
      next[idx] = null;
      return next;
    });
    delete padTimersRef.current[idx];
  };

  const resolveMiss = (idx, actId) => {
    const pad = padsRef.current[idx];
    if (!pad || pad.actId !== actId) return;
    if (pad.type !== 'bad') {
      comboRef.current = 0;
      setCombo(0);
      setStatusMsg('Missed!');
      missSound();
    }
    deactivatePad(idx);
  };

  const spawnWave = useCallback(() => {
    if (phaseRef.current !== 'playing') return;
    const empty = [];
    padsRef.current.forEach((p, i) => { if (!p) empty.push(i); });
    if (!empty.length) return;
    const max = maxActiveForLevel(levelRef.current);
    const currentActive = CELLS - empty.length;
    const room = Math.max(0, max - currentActive);
    if (room === 0) return;
    const count = Math.min(empty.length, room, 1 + Math.floor(Math.random() * 2));
    const chosen = [];
    const pool = empty.slice();
    for (let i = 0; i < count; i++) {
      const j = Math.floor(Math.random() * pool.length);
      chosen.push(pool.splice(j, 1)[0]);
    }
    const duration = durationForLevel(levelRef.current);
    const assignments = chosen.map(idx => ({ idx, type: pickType(levelRef.current), actId: activationId.current++, duration }));
    setPads(prev => {
      const next = prev.slice();
      assignments.forEach(a => { next[a.idx] = { type: a.type, actId: a.actId, duration: a.duration }; });
      return next;
    });
    assignments.forEach(a => {
      padTimersRef.current[a.idx] = addTimer(() => resolveMiss(a.idx, a.actId), a.duration);
    });
  }, []);

  const scheduleSpawn = useCallback(() => {
    if (phaseRef.current !== 'playing') return;
    const interval = spawnIntervalForLevel(levelRef.current);
    spawnTimerRef.current = setTimeout(() => {
      spawnWave();
      scheduleSpawn();
    }, interval);
  }, [spawnWave]);

  const endGame = useCallback((msg) => {
    clearAllTimers();
    phaseRef.current = 'over';
    setPhase('over');
    setStatusMsg(msg || 'Game over!');
    overSound();
  }, [overSound]);

  const handlePadTap = (idx) => {
    spawnRipple(idx);
    tapSound();
    if (phaseRef.current !== 'playing') return;
    const pad = padsRef.current[idx];
    if (!pad) return;
    if (padTimersRef.current[idx]) { clearTimeout(padTimersRef.current[idx]); delete padTimersRef.current[idx]; }
    deactivatePad(idx);

    if (pad.type === 'bad') {
      comboRef.current = 0;
      setCombo(0);
      livesRef.current -= 1;
      setLives(livesRef.current);
      setHurt(true);
      addTimer(() => setHurt(false), 350);
      setFlashCells(prev => new Set(prev).add(idx));
      addTimer(() => setFlashCells(prev => { const n = new Set(prev); n.delete(idx); return n; }), 220);
      badSound();
      spawnParticles(idx, '#ff5e7d', 8);
      setStatusMsg('Ouch! That was a decoy.');
      if (livesRef.current <= 0) {
        if (scoreRef.current > highScoreRef.current) {
          highScoreRef.current = scoreRef.current;
          localStorage.setItem(HS_KEY, String(scoreRef.current));
          setHighScore(scoreRef.current);
        }
        endGame('Out of lives!');
        return;
      }
    } else {
      comboRef.current += 1;
      setCombo(comboRef.current);
      const base = pad.type === 'gold' ? 40 : 10;
      const gained = Math.round(base * (1 + comboRef.current * 0.12));
      scoreRef.current += gained;
      if (scoreRef.current > highScoreRef.current) {
        highScoreRef.current = scoreRef.current;
        localStorage.setItem(HS_KEY, String(scoreRef.current));
        setHighScore(scoreRef.current);
      }
      setScore(scoreRef.current);
      if (pad.type === 'gold') {
        goldSound();
        spawnParticles(idx, '#ffd15e', 10);
        setTimeLeft(t => Math.min(GAME_TIME + 30, t + 3));
        setStatusMsg(`+${gained} Gold strike! Combo x${comboRef.current}`);
      } else {
        hitSound(comboRef.current);
        spawnParticles(idx, '#5ef0ff', 6);
        setStatusMsg(`+${gained} — Combo x${comboRef.current}`);
      }
    }
  };

  const startGame = () => {
    clearAllTimers();
    setPads(Array(CELLS).fill(null));
    padsRef.current = Array(CELLS).fill(null);
    setFlashCells(new Set());
    setParticles([]);
    setRipples([]);
    scoreRef.current = 0;
    comboRef.current = 0;
    livesRef.current = LIVES_START;
    levelRef.current = 1;
    activationId.current = 0;
    setScore(0);
    setCombo(0);
    setLives(LIVES_START);
    setLevel(1);
    setTimeLeft(GAME_TIME);
    setStatusMsg('Strike glowing pads before they fade. Avoid the red ones!');
    setPhase('playing');
    phaseRef.current = 'playing';
    addTimer(() => scheduleSpawn(), 300);
  };

  return (
    <div className="app" data-testid="game-canvas">
      <div className="bgAnim" />

      <div className="hud">
        <div className="hudBox">
          <div className="hudLabel">Score</div>
          <div className="hudValue" data-testid="score">{score}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Time</div>
          <div className={`hudValue ${timeLeft <= 10 ? 'urgent' : ''}`} data-testid="time-left">{timeLeft}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Lives</div>
          <div className={`hudValue lives ${hurt ? 'hurt' : ''}`} data-testid="lives">{'❤'.repeat(Math.max(0, lives))}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Combo</div>
          <div className="hudValue combo" data-testid="combo">x{combo}</div>
        </div>
      </div>

      <div className="title">PULSE STRIKE</div>

      <div className="gridOuter">
        <div className="padGrid" ref={gridRef} data-testid="grid">
          {pads.map((pad, i) => {
            const r = Math.floor(i / SIZE), c = i % SIZE;
            const isFlash = flashCells.has(i);
            const cls = pad ? `pad ${pad.type} ${isFlash ? 'wrongFlash' : ''}` : `pad ${isFlash ? 'wrongFlash' : ''}`;
            return (
              <div
                key={i}
                data-testid={`pad-${r}-${c}`}
                className={cls}
                onClick={() => handlePadTap(i)}
              >
                {pad && (
                  <React.Fragment key={pad.actId}>
                    <div className="fuse" style={{ animationDuration: `${pad.duration}ms` }} />
                    <div className="icon">{pad.type === 'gold' ? '★' : pad.type === 'bad' ? '✕' : '●'}</div>
                  </React.Fragment>
                )}
              </div>
            );
          })}
        </div>

        {particles.map(p => (
          <Particle key={p.id} x={p.x} y={p.y} color={p.color} onDone={() => removeParticle(p.id)} />
        ))}
        {ripples.map(p => (
          <Ripple key={p.id} x={p.x} y={p.y} onDone={() => removeRipple(p.id)} />
        ))}

        {phase === 'start' && (
          <div className="overlay">
            <div className="subtitle">Tap cyan and gold pads the instant they light up — the longer you wait, the faster they fade. Gold pads are big points and bonus time. Red pads are decoys: leave them alone or lose a life!</div>
            <div className="highscoreLine" data-testid="high-score">Best: {highScore}</div>
            <button className="btn" data-testid="start-btn" onClick={startGame}>START</button>
          </div>
        )}

        {phase === 'over' && (
          <div className="overlay">
            <div className="title" style={{ fontSize: 'clamp(22px, 6vw, 32px)', marginTop: 0 }}>PULSE LOST</div>
            <div className="hudValue" data-testid="final-score">Score: {score}</div>
            <div className="highscoreLine" data-testid="high-score-final">Best: {highScore}</div>
            <button className="btn" data-testid="restart-btn" onClick={startGame}>PLAY AGAIN</button>
          </div>
        )}
      </div>

      <div className="status">{statusMsg}</div>
      <div className="footer">Pulse Strike — tap pads before they fade, dodge the decoys</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
