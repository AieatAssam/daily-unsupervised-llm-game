<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Neon Cluster</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05030d; font-family: 'Segoe UI', system-ui, sans-serif; }
  #root { width: 100%; height: 100%; }

  .app {
    width: 100%; height: 100%; position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: center; overflow: hidden; gap: 10px;
    background: radial-gradient(circle at 50% 25%, #13092b 0%, #0a0518 55%, #030109 100%);
  }

  .bgAnim {
    position: absolute; inset: 0; pointer-events: none; opacity: 0.5;
    background: repeating-radial-gradient(circle at 50% 50%, rgba(120,0,255,0.06) 0, rgba(120,0,255,0.06) 2px, transparent 2px, transparent 40px);
    animation: bgspin 70s linear infinite;
  }
  @keyframes bgspin { from { transform: rotate(0deg) scale(1.4); } to { transform: rotate(360deg) scale(1.4); } }

  .hud {
    position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-around;
    padding: 12px 16px; z-index: 15; pointer-events: none;
  }
  .hudBox { text-align: center; }
  .hudLabel { font-size: 11px; letter-spacing: 2px; color: #7d6bd0; text-transform: uppercase; }
  .hudValue {
    font-size: 24px; font-weight: 800; color: #fff;
    text-shadow: 0 0 10px #b967ff, 0 0 20px #b967ff;
  }
  .hudValue.combo { color: #ffe45e; text-shadow: 0 0 10px #ffe45e, 0 0 22px #ff9d00; }
  .hudValue.urgent { color: #ff4d4d; text-shadow: 0 0 10px #ff4d4d, 0 0 22px #ff0000; animation: urgentPulse 0.5s infinite; }
  @keyframes urgentPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  .title {
    font-size: clamp(28px, 7vw, 48px); font-weight: 900; letter-spacing: 3px;
    background: linear-gradient(90deg, #ff2bd6, #7c4dff, #2be9ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 40px rgba(180,80,255,0.5);
    filter: drop-shadow(0 0 12px rgba(190,80,255,0.6));
    animation: titlePulse 2.4s ease-in-out infinite;
    text-align: center;
  }
  @keyframes titlePulse { 0%,100% { filter: drop-shadow(0 0 12px rgba(190,80,255,0.6)); } 50% { filter: drop-shadow(0 0 26px rgba(190,80,255,0.95)); } }

  .subtitle { color: #a297d6; font-size: 14px; letter-spacing: 0.5px; text-align: center; max-width: 320px; line-height: 1.5; }

  .btn {
    padding: 15px 40px; font-size: 19px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(135deg, #b845ff, #4d5bff);
    border: none; border-radius: 50px; color: #fff; cursor: pointer;
    box-shadow: 0 0 20px rgba(150,70,255,0.7), 0 0 50px rgba(80,60,255,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(150,70,255,0.9), 0 0 70px rgba(80,60,255,0.5); }
  .btn:active { transform: scale(0.96); }

  .highscoreLine { color: #ffd35e; font-size: 14px; text-shadow: 0 0 8px rgba(255,200,50,0.6); }

  .boardOuter {
    position: relative; width: min(90vmin, 500px); height: min(90vmin, 500px); z-index: 5;
  }

  .board {
    position: absolute; inset: 0; display: grid;
    grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
    gap: 4px; padding: 8px; border-radius: 22px;
    background: rgba(10, 5, 24, 0.55); border: 2px solid rgba(180,120,255,0.25);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.55), 0 0 30px rgba(120,60,255,0.15);
  }

  .tile {
    border-radius: 8px; cursor: pointer; position: relative;
    transition: transform 0.12s ease, opacity 0.18s ease, filter 0.12s ease;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .tile:active { transform: scale(0.88); }
  .tile.popping { transform: scale(0.1) rotate(30deg); opacity: 0; }
  .tile.denied { animation: denyFlash 0.22s ease; }
  @keyframes denyFlash {
    0%, 100% { filter: none; transform: scale(1); }
    50% { filter: brightness(0.45) saturate(3) hue-rotate(180deg); transform: scale(0.92); }
  }

  .particle { position: absolute; border-radius: 50%; pointer-events: none; z-index: 12; }

  .overlay {
    position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 20px;
    background: rgba(5, 3, 13, 0.85); backdrop-filter: blur(4px); border-radius: 22px;
  }

  .status { color: #cfc4ff; font-size: 14px; letter-spacing: 0.5px; height: 18px; z-index: 10; text-align: center; }

  .footer { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; color: #55488a; font-size: 11px; z-index: 10; }

  @media (max-width: 480px) {
    .hudValue { font-size: 19px; }
    .btn { padding: 13px 30px; font-size: 16px; }
    .subtitle { font-size: 13px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const HS_KEY = 'neonCluster_highScore';
const ROWS = 8;
const COLS = 8;
const GAME_TIME = 60;

const COLORS = [
  { bg: 'radial-gradient(circle at 30% 30%, #ff6df5, #b3007f)', glow: '#ff5ee0', freq: 329.63 },
  { bg: 'radial-gradient(circle at 30% 30%, #6df5ff, #0080b3)', glow: '#5ef0ff', freq: 392.0 },
  { bg: 'radial-gradient(circle at 30% 30%, #ffe98f, #b37f00)', glow: '#ffd15e', freq: 440.0 },
  { bg: 'radial-gradient(circle at 30% 30%, #c8ff8f, #4f9900)', glow: '#b3ff5e', freq: 523.25 },
  { bg: 'radial-gradient(circle at 30% 30%, #cf9dff, #6b00b3)', glow: '#b967ff', freq: 587.33 },
];

function randColorIdx() { return Math.floor(Math.random() * COLORS.length); }

function getGroup(grid, r0, c0) {
  const color = grid[r0][c0];
  if (color == null) return [];
  const seen = new Set();
  const key = (r, c) => r * COLS + c;
  seen.add(key(r0, c0));
  const group = [[r0, c0]];
  const stack = [[r0, c0]];
  while (stack.length) {
    const [cr, cc] = stack.pop();
    const neighbors = [[cr - 1, cc], [cr + 1, cc], [cr, cc - 1], [cr, cc + 1]];
    for (const [nr, nc] of neighbors) {
      if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
      const k = key(nr, nc);
      if (seen.has(k)) continue;
      if (grid[nr][nc] === color) {
        seen.add(k);
        stack.push([nr, nc]);
        group.push([nr, nc]);
      }
    }
  }
  return group;
}

function hasMoves(grid) {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (getGroup(grid, r, c).length >= 2) return true;
    }
  }
  return false;
}

function generateGrid() {
  let g;
  let attempts = 0;
  do {
    g = Array.from({ length: ROWS }, () => Array.from({ length: COLS }, () => randColorIdx()));
    attempts++;
  } while (!hasMoves(g) && attempts < 30);
  return g;
}

function applyGravity(grid) {
  const ng = grid.map(row => row.slice());
  for (let c = 0; c < COLS; c++) {
    const colVals = [];
    for (let r = 0; r < ROWS; r++) { if (ng[r][c] != null) colVals.push(ng[r][c]); }
    const emptyCount = ROWS - colVals.length;
    for (let r = 0; r < ROWS; r++) {
      ng[r][c] = r < emptyCount ? randColorIdx() : colVals[r - emptyCount];
    }
  }
  return ng;
}

function useAudio() {
  const ctxRef = useRef(null);
  const getCtx = () => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  };

  const tone = useCallback((freq, duration = 0.25, type = 'triangle', gainScale = 0.2) => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(gainScale, ctx.currentTime + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.05);
    } catch (e) {}
  }, []);

  const popSound = useCallback((size) => {
    const base = 220 + Math.min(size, 24) * 16;
    tone(base, 0.22, 'triangle', 0.22);
    if (size >= 6) setTimeout(() => tone(base * 1.5, 0.3, 'sine', 0.15), 60);
    if (size >= 10) setTimeout(() => tone(base * 2, 0.35, 'sine', 0.12), 130);
  }, [tone]);

  const denySound = useCallback(() => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(140, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.18);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.2);
    } catch (e) {}
  }, []);

  return { tone, popSound, denySound };
}

function Particle({ x, y, color, onDone }) {
  const angle = Math.random() * Math.PI * 2;
  const dist = 30 + Math.random() * 55;
  const dx = Math.cos(angle) * dist;
  const dy = Math.sin(angle) * dist;
  const size = 3 + Math.random() * 5;
  const ref = useRef(null);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const anim = el.animate([
      { transform: 'translate(0,0) scale(1)', opacity: 1 },
      { transform: `translate(${dx}px, ${dy}px) scale(0)`, opacity: 0 }
    ], { duration: 500 + Math.random() * 300, easing: 'cubic-bezier(.2,.8,.3,1)' });
    anim.onfinish = onDone;
  }, []);

  return (
    <div ref={ref} className="particle" style={{
      left: x, top: y, width: size, height: size, background: color,
      boxShadow: `0 0 8px ${color}`
    }} />
  );
}

function App() {
  const [phase, setPhase] = useState('start'); // start | playing | over
  const [grid, setGrid] = useState(() => generateGrid());
  const [poppingSet, setPoppingSet] = useState(new Set());
  const [deniedCell, setDeniedCell] = useState(null);
  const [score, setScore] = useState(0);
  const [combo, setCombo] = useState(0);
  const [timeLeft, setTimeLeft] = useState(GAME_TIME);
  const [highScore, setHighScore] = useState(() => parseInt(localStorage.getItem(HS_KEY) || '0', 10));
  const [statusMsg, setStatusMsg] = useState('Tap groups of 2+ matching tiles to pop them.');
  const [particles, setParticles] = useState([]);
  const boardRef = useRef(null);
  const lastPopTime = useRef(0);
  const particleId = useRef(0);
  const timeoutsRef = useRef([]);
  const { popSound, denySound } = useAudio();

  const addTimer = (fn, ms) => {
    const id = setTimeout(fn, ms);
    timeoutsRef.current.push(id);
    return id;
  };
  useEffect(() => () => timeoutsRef.current.forEach(clearTimeout), []);

  useEffect(() => {
    if (phase !== 'playing') return;
    const id = setInterval(() => {
      setTimeLeft(t => (t <= 1 ? 0 : t - 1));
    }, 1000);
    return () => clearInterval(id);
  }, [phase]);

  useEffect(() => {
    if (phase === 'playing' && timeLeft === 0) {
      setPhase('over');
      setStatusMsg('Time\'s up!');
    }
  }, [timeLeft, phase]);

  const removeParticle = (id) => setParticles(prev => prev.filter(p => p.id !== id));

  const spawnParticles = useCallback((group, glow) => {
    const board = boardRef.current;
    if (!board) return;
    const rect = board.getBoundingClientRect();
    const cellW = rect.width / COLS;
    const cellH = rect.height / ROWS;
    const newParticles = [];
    group.slice(0, 24).forEach(([r, c]) => {
      const x = (c + 0.5) * cellW;
      const y = (r + 0.5) * cellH;
      for (let i = 0; i < 3; i++) newParticles.push({ id: particleId.current++, x, y, color: glow });
    });
    setParticles(prev => [...prev, ...newParticles]);
  }, []);

  const startGame = () => {
    timeoutsRef.current.forEach(clearTimeout);
    timeoutsRef.current = [];
    setGrid(generateGrid());
    setScore(0);
    setCombo(0);
    setTimeLeft(GAME_TIME);
    setPoppingSet(new Set());
    setDeniedCell(null);
    setParticles([]);
    lastPopTime.current = 0;
    setStatusMsg('Tap groups of 2+ matching tiles to pop them.');
    setPhase('playing');
  };

  const handleTileClick = (r, c) => {
    if (phase !== 'playing' || poppingSet.size > 0) return;
    const group = getGroup(grid, r, c);
    if (group.length < 2) {
      denySound();
      const key = `${r}-${c}`;
      setDeniedCell(key);
      addTimer(() => setDeniedCell(null), 220);
      return;
    }

    const now = Date.now();
    const newCombo = (now - lastPopTime.current < 2500) ? combo + 1 : 1;
    lastPopTime.current = now;
    setCombo(newCombo);

    const colorDef = COLORS[grid[r][c]];
    spawnParticles(group, colorDef.glow);
    popSound(group.length);

    const gained = Math.round(group.length * group.length * 4 * (1 + (newCombo - 1) * 0.2));
    setScore(s => {
      const ns = s + gained;
      if (ns > highScore) {
        setHighScore(ns);
        localStorage.setItem(HS_KEY, String(ns));
      }
      return ns;
    });
    setTimeLeft(t => Math.min(t + Math.min(4, Math.floor(group.length / 3)), GAME_TIME + 30));
    setStatusMsg(`+${gained} — ${group.length} tiles${newCombo > 1 ? ` — combo x${newCombo}!` : '!'}`);

    setPoppingSet(new Set(group.map(([rr, cc]) => `${rr}-${cc}`)));

    addTimer(() => {
      setGrid(prevGrid => {
        let ng = prevGrid.map(row => row.slice());
        group.forEach(([rr, cc]) => { ng[rr][cc] = null; });
        ng = applyGravity(ng);
        if (!hasMoves(ng)) {
          ng = generateGrid();
          setStatusMsg('No moves left — reshuffled!');
        }
        return ng;
      });
      setPoppingSet(new Set());
    }, 200);
  };

  return (
    <div className="app" data-testid="game-canvas">
      <div className="bgAnim" />

      <div className="hud">
        <div className="hudBox">
          <div className="hudLabel">Score</div>
          <div className="hudValue" data-testid="score">{score}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Time</div>
          <div className={`hudValue ${timeLeft <= 10 ? 'urgent' : ''}`} data-testid="time-left">{timeLeft}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Combo</div>
          <div className="hudValue combo" data-testid="combo">x{combo}</div>
        </div>
      </div>

      <div className="title" style={{ fontSize: 'clamp(24px, 6vw, 38px)', marginTop: 40 }}>NEON CLUSTER</div>

      <div className="boardOuter">
        <div className="board" ref={boardRef} data-testid="cluster-board">
          {grid.map((row, r) => row.map((color, c) => {
            const key = `${r}-${c}`;
            const isPopping = poppingSet.has(key);
            const isDenied = deniedCell === key;
            const colorDef = COLORS[color];
            return (
              <div
                key={key}
                data-testid={`tile-${r}-${c}`}
                className={`tile ${isPopping ? 'popping' : ''} ${isDenied ? 'denied' : ''}`}
                style={{ background: colorDef.bg, boxShadow: `0 0 10px ${colorDef.glow}, inset 0 0 8px rgba(0,0,0,0.3)` }}
                onClick={() => handleTileClick(r, c)}
              />
            );
          }))}
        </div>

        {particles.map(p => (
          <Particle key={p.id} x={p.x} y={p.y} color={p.color} onDone={() => removeParticle(p.id)} />
        ))}

        {phase === 'start' && (
          <div className="overlay">
            <div className="subtitle">Tap a group of 2 or more touching same-color tiles to pop them.<br />Bigger clusters score more and add time. Chain pops fast for combo bonuses!</div>
            <div className="highscoreLine" data-testid="high-score">Best: {highScore}</div>
            <button className="btn" data-testid="start-btn" onClick={startGame}>START</button>
          </div>
        )}

        {phase === 'over' && (
          <div className="overlay">
            <div className="title" style={{ fontSize: 'clamp(24px, 6vw, 36px)' }}>TIME'S UP</div>
            <div className="hudValue" data-testid="final-score">Score: {score}</div>
            <div className="highscoreLine" data-testid="high-score-final">Best: {highScore}</div>
            <button className="btn" data-testid="restart-btn" onClick={startGame}>PLAY AGAIN</button>
          </div>
        )}
      </div>

      <div className="status">{statusMsg}</div>
      <div className="footer">Neon Cluster — tap matching color groups to pop them</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
