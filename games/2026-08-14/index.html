<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Signal Sort</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05030d; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }
  #root { width: 100%; height: 100%; }

  .app {
    width: 100%; height: 100%; position: relative; display: flex; flex-direction: column;
    align-items: center; overflow: hidden;
    background: radial-gradient(circle at 50% 20%, #0f1830 0%, #080c1c 55%, #030308 100%);
  }

  .bgAnim {
    position: absolute; inset: 0; pointer-events: none; opacity: 0.45;
    background: repeating-linear-gradient(0deg, rgba(0,220,255,0.05) 0, rgba(0,220,255,0.05) 2px, transparent 2px, transparent 44px);
    animation: bgscroll 12s linear infinite;
  }
  @keyframes bgscroll { from { transform: translateY(-44px); } to { transform: translateY(0); } }

  .hud {
    position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-around;
    padding: 10px 12px; z-index: 20; pointer-events: none;
  }
  .hudBox { text-align: center; }
  .hudLabel { font-size: 10px; letter-spacing: 2px; color: #6bb0d0; text-transform: uppercase; }
  .hudValue {
    font-size: 21px; font-weight: 800; color: #fff;
    text-shadow: 0 0 10px #29e0ff, 0 0 20px #29e0ff;
  }
  .hudValue.combo { color: #ffe45e; text-shadow: 0 0 10px #ffe45e, 0 0 22px #ff9d00; }
  .hudValue.lives { color: #ff5e7d; text-shadow: 0 0 10px #ff5e7d, 0 0 22px #ff0033; }
  .hudValue.hurt { animation: hurtPulse 0.4s ease; }
  @keyframes hurtPulse { 0%,100% { opacity:1; transform: scale(1);} 50% { opacity:0.4; transform: scale(1.25);} }

  .title {
    font-size: clamp(22px, 6vw, 34px); font-weight: 900; letter-spacing: 3px;
    background: linear-gradient(90deg, #29e0ff, #7c4dff, #ff2bd6);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(80,190,255,0.6));
    text-align: center; margin-top: 40px; z-index: 5;
  }

  .subtitle { color: #8fb3d6; font-size: 13.5px; letter-spacing: 0.4px; text-align: center; max-width: 360px; line-height: 1.5; }

  .btn {
    padding: 15px 40px; font-size: 19px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(135deg, #21c9ff, #7c4dff);
    border: none; border-radius: 50px; color: #fff; cursor: pointer;
    box-shadow: 0 0 20px rgba(40,200,255,0.7), 0 0 50px rgba(120,80,255,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: scale(1.06); }
  .btn:active { transform: scale(0.96); }

  .highscoreLine { color: #ffd35e; font-size: 14px; text-shadow: 0 0 8px rgba(255,200,50,0.6); }

  .playAreaOuter {
    position: relative; width: min(94vw, 480px); flex: 1; margin: 6px 0 10px; z-index: 4;
    display: flex; align-items: stretch;
  }
  .playArea {
    position: relative; width: 100%; height: 100%; border-radius: 18px; overflow: hidden;
    background: rgba(8, 12, 26, 0.5); border: 2px solid rgba(90,170,255,0.18);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
    touch-action: none;
  }

  .packet {
    position: absolute; top: 0; left: 0; width: 50px; height: 50px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 900; color: rgba(10,10,20,0.75);
    cursor: grab; will-change: transform; z-index: 8;
    transition: box-shadow 0.15s ease;
  }
  .packet.dragging { cursor: grabbing; z-index: 15; filter: brightness(1.2); }
  .packet.bonus { box-shadow: 0 0 0 3px rgba(255,255,255,0.85), 0 0 22px currentColor; }

  .chuteRow {
    position: absolute; left: 0; right: 0; bottom: 0; display: flex; z-index: 6;
    height: 78px; gap: 6px; padding: 0 6px 6px;
  }
  .chute {
    flex: 1; border-radius: 10px 10px 4px 4px; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end; padding-bottom: 8px;
    border: 2px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.03);
    box-shadow: inset 0 8px 16px rgba(0,0,0,0.5);
    font-size: 11px; font-weight: 800; letter-spacing: 1px; color: rgba(255,255,255,0.85);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .chute.glowHit { transform: scale(1.05); }

  .particle { position: absolute; border-radius: 50%; pointer-events: none; z-index: 12; will-change: transform, opacity; }

  .overlay {
    position: absolute; inset: 0; z-index: 25; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 20px;
    background: rgba(4, 6, 14, 0.9); backdrop-filter: blur(4px); border-radius: 18px;
  }

  .status { color: #a9c7e6; font-size: 13px; letter-spacing: 0.4px; height: 17px; z-index: 10; text-align: center; margin-bottom: 6px; }
  .footer { color: #45608a; font-size: 11px; padding-bottom: 6px; z-index: 10; text-align: center; }

  @media (max-width: 480px) {
    .hudValue { font-size: 17px; }
    .btn { padding: 13px 30px; font-size: 16px; }
    .subtitle { font-size: 12.5px; }
    .title { margin-top: 32px; }
    .packet { width: 44px; height: 44px; font-size: 15px; }
    .chuteRow { height: 66px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const HS_KEY = 'signalSort_highScore';
const LIVES_START = 3;
const GRAB_RADIUS = 46;
const BASE_COLORS = [
  { id: 'cyan', hex: '#29e0ff', icon: '◆' },
  { id: 'magenta', hex: '#ff4de3', icon: '▲' },
  { id: 'gold', hex: '#ffd75e', icon: '●' },
  { id: 'green', hex: '#5effa3', icon: '■' },
];
const UNLOCK_4TH_SCORE = 150;

function useAudio() {
  const ctxRef = useRef(null);
  const getCtx = () => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  };

  const tone = useCallback((freq, duration = 0.2, type = 'triangle', gainScale = 0.16, freqEnd) => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + duration);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(gainScale, ctx.currentTime + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.05);
    } catch (e) {}
  }, []);

  const sortSound = useCallback((combo) => tone(420 + Math.min(combo, 14) * 26, 0.14, 'triangle', 0.16, 760), [tone]);
  const bonusSound = useCallback(() => { tone(660, 0.12, 'square', 0.16, 1100); setTimeout(() => tone(920, 0.16, 'sine', 0.12), 60); }, [tone]);
  const wrongSound = useCallback(() => tone(180, 0.2, 'sawtooth', 0.18, 70), [tone]);
  const missSound = useCallback(() => tone(140, 0.22, 'sawtooth', 0.14, 60), [tone]);
  const levelSound = useCallback(() => { tone(500, 0.1, 'sine', 0.12, 900); }, [tone]);
  const overSound = useCallback(() => { tone(320, 0.25, 'sawtooth', 0.2, 220); setTimeout(() => tone(200, 0.35, 'sawtooth', 0.2, 90), 150); }, [tone]);

  return { sortSound, bonusSound, wrongSound, missSound, levelSound, overSound };
}

function Particle({ x, y, color, onDone }) {
  const angle = Math.random() * Math.PI * 2;
  const dist = 25 + Math.random() * 50;
  const dx = Math.cos(angle) * dist;
  const dy = Math.sin(angle) * dist;
  const size = 3 + Math.random() * 5;
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const anim = el.animate([
      { transform: 'translate(0,0) scale(1)', opacity: 1 },
      { transform: `translate(${dx}px, ${dy}px) scale(0)`, opacity: 0 }
    ], { duration: 420 + Math.random() * 280, easing: 'cubic-bezier(.2,.8,.3,1)' });
    anim.onfinish = onDone;
  }, []);
  return <div ref={ref} className="particle" style={{ left: x, top: y, width: size, height: size, background: color }} />;
}

function levelForElapsed(elapsedSec) { return Math.min(7, Math.floor(elapsedSec / 9) + 1); }
function fallSpeedForLevel(level) { return 52 + level * 13; }
function spawnIntervalForLevel(level) { return Math.max(560, 1350 - level * 130); }

function App() {
  const [phase, setPhase] = useState('start'); // start | playing | over
  const [packetIds, setPacketIds] = useState([]);
  const [score, setScore] = useState(0);
  const [combo, setCombo] = useState(0);
  const [lives, setLives] = useState(LIVES_START);
  const [level, setLevel] = useState(1);
  const [chuteCount, setChuteCount] = useState(3);
  const [hurt, setHurt] = useState(false);
  const [highScore, setHighScore] = useState(() => parseInt(localStorage.getItem(HS_KEY) || '0', 10));
  const [statusMsg, setStatusMsg] = useState('Drag each glowing signal into its matching chute.');
  const [particles, setParticles] = useState([]);
  const [chuteFlash, setChuteFlash] = useState(null);

  const areaRef = useRef(null);
  const nodeRefs = useRef(new Map());
  const chuteNodeRefs = useRef(new Map());
  const hintRef = useRef(null);
  const packetsRef = useRef(new Map()); // id -> {x,y,color,bonus,dragging}
  const nextId = useRef(1);
  const draggingIdRef = useRef(null);
  const dragOffset = useRef({ x: 0, y: 0 });
  const rafRef = useRef(null);
  const lastTsRef = useRef(0);
  const spawnTimerRef = useRef(null);
  const startTsRef = useRef(0);
  const areaHRef = useRef(400);
  const particleId = useRef(0);
  const timeoutsRef = useRef([]);

  const scoreRef = useRef(0);
  const comboRef = useRef(0);
  const livesRef = useRef(LIVES_START);
  const levelRef = useRef(1);
  const chuteCountRef = useRef(3);
  const highScoreRef = useRef(highScore);
  const phaseRef = useRef('start');

  const { sortSound, bonusSound, wrongSound, missSound, levelSound, overSound } = useAudio();

  useEffect(() => { phaseRef.current = phase; }, [phase]);

  const addTimer = (fn, ms) => {
    const id = setTimeout(fn, ms);
    timeoutsRef.current.push(id);
    return id;
  };
  const clearAllTimers = () => {
    timeoutsRef.current.forEach(clearTimeout);
    timeoutsRef.current = [];
    if (spawnTimerRef.current) clearTimeout(spawnTimerRef.current);
  };
  useEffect(() => () => { clearAllTimers(); if (rafRef.current) cancelAnimationFrame(rafRef.current); }, []);

  useEffect(() => {
    const onResize = () => { if (areaRef.current) areaHRef.current = areaRef.current.getBoundingClientRect().height; };
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);

  const spawnParticles = useCallback((x, y, color, count) => {
    const newParticles = [];
    for (let i = 0; i < count; i++) newParticles.push({ id: particleId.current++, x, y, color });
    setParticles(prev => [...prev, ...newParticles]);
  }, []);
  const removeParticle = (id) => setParticles(prev => prev.filter(p => p.id !== id));

  const saveHighScore = () => {
    if (scoreRef.current > highScoreRef.current) {
      highScoreRef.current = scoreRef.current;
      localStorage.setItem(HS_KEY, String(scoreRef.current));
      setHighScore(scoreRef.current);
    }
  };

  const removePacket = (id) => {
    packetsRef.current.delete(id);
    nodeRefs.current.delete(id);
    setPacketIds(prev => prev.filter(p => p !== id));
  };

  const updateHint = () => {
    const hint = hintRef.current;
    if (!hint) return;
    let oldest = null;
    for (const [id, p] of packetsRef.current) {
      if (p.dragging) continue;
      oldest = { id, ...p };
      break;
    }
    if (oldest) {
      hint.setAttribute('data-x', String(oldest.x));
      hint.setAttribute('data-y', String(oldest.y));
      hint.setAttribute('data-color', oldest.color);
      hint.setAttribute('data-id', String(oldest.id));
    } else {
      hint.removeAttribute('data-id');
    }
  };

  const resolveMiss = (id) => {
    const p = packetsRef.current.get(id);
    if (!p) return;
    comboRef.current = 0;
    setCombo(0);
    livesRef.current -= 1;
    setLives(livesRef.current);
    setHurt(true);
    addTimer(() => setHurt(false), 350);
    missSound();
    setStatusMsg('Missed! Signal lost.');
    removePacket(id);
    if (livesRef.current <= 0) endGame('Signals overloaded!');
  };

  const spawnPacket = useCallback(() => {
    if (phaseRef.current !== 'playing') return;
    const area = areaRef.current;
    if (!area) return;
    const rect = area.getBoundingClientRect();
    const palette = BASE_COLORS.slice(0, chuteCountRef.current);
    const color = palette[Math.floor(Math.random() * palette.length)].id;
    const bonus = Math.random() < 0.16;
    const id = nextId.current++;
    const x = 40 + Math.random() * Math.max(10, rect.width - 80);
    packetsRef.current.set(id, { x, y: -30, color, bonus, dragging: false });
    setPacketIds(prev => [...prev, id]);
  }, []);

  const scheduleSpawn = useCallback(() => {
    if (phaseRef.current !== 'playing') return;
    const interval = spawnIntervalForLevel(levelRef.current);
    spawnTimerRef.current = setTimeout(() => {
      spawnPacket();
      scheduleSpawn();
    }, interval);
  }, [spawnPacket]);

  const tick = useCallback((ts) => {
    if (phaseRef.current !== 'playing') return;
    if (!lastTsRef.current) lastTsRef.current = ts;
    const dt = Math.min(0.05, (ts - lastTsRef.current) / 1000);
    lastTsRef.current = ts;

    const elapsed = (ts - startTsRef.current) / 1000;
    const lvl = levelForElapsed(elapsed);
    if (lvl !== levelRef.current) {
      levelRef.current = lvl;
      setLevel(lvl);
      levelSound();
      setStatusMsg(`Level ${lvl} — signals fall faster!`);
    }

    const areaH = areaHRef.current;
    const speed = fallSpeedForLevel(levelRef.current);
    const toMiss = [];

    for (const [id, p] of packetsRef.current) {
      if (p.dragging) continue;
      p.y += speed * dt;
      const node = nodeRefs.current.get(id);
      if (node) node.style.transform = `translate(${p.x}px, ${p.y}px)`;
      if (p.y > areaH - 6) toMiss.push(id);
    }
    toMiss.forEach(resolveMiss);
    updateHint();

    rafRef.current = requestAnimationFrame(tick);
  }, [levelSound]);

  const endGame = useCallback((msg) => {
    clearAllTimers();
    phaseRef.current = 'over';
    setPhase('over');
    setStatusMsg(msg || 'Game over!');
    saveHighScore();
    overSound();
  }, [overSound]);

  const resolveDrop = (id, clientX, clientY) => {
    const p = packetsRef.current.get(id);
    if (!p) return;
    let hitChute = null;
    for (const [ci, node] of chuteNodeRefs.current) {
      const r = node.getBoundingClientRect();
      if (clientX >= r.left && clientX <= r.right && clientY >= r.top && clientY <= r.bottom) {
        hitChute = ci;
        break;
      }
    }
    if (hitChute === null) {
      p.dragging = false;
      return;
    }
    const chuteColor = BASE_COLORS[hitChute].id;
    const areaRect = areaRef.current.getBoundingClientRect();
    const flashX = clientX - areaRect.left;
    const flashY = clientY - areaRect.top;

    if (chuteColor === p.color) {
      comboRef.current += 1;
      setCombo(comboRef.current);
      const base = p.bonus ? 30 : 10;
      const gained = Math.round(base * (1 + comboRef.current * 0.12));
      scoreRef.current += gained;
      setScore(scoreRef.current);
      saveHighScore();
      if (p.bonus) bonusSound(); else sortSound(comboRef.current);
      spawnParticles(flashX, flashY, BASE_COLORS[hitChute].hex, p.bonus ? 12 : 7);
      setStatusMsg(`+${gained} sorted! Combo x${comboRef.current}`);
      setChuteFlash(hitChute);
      addTimer(() => setChuteFlash(null), 200);
      if (chuteCountRef.current < 4 && scoreRef.current >= UNLOCK_4TH_SCORE) {
        chuteCountRef.current = 4;
        setChuteCount(4);
        setStatusMsg('New signal color unlocked!');
      }
      removePacket(id);
    } else {
      comboRef.current = 0;
      setCombo(0);
      livesRef.current -= 1;
      setLives(livesRef.current);
      setHurt(true);
      addTimer(() => setHurt(false), 350);
      wrongSound();
      spawnParticles(flashX, flashY, '#ff5e7d', 8);
      setStatusMsg('Wrong chute!');
      removePacket(id);
      if (livesRef.current <= 0) { endGame('Signals overloaded!'); return; }
    }
  };

  const onPointerDown = (e) => {
    if (phaseRef.current !== 'playing') return;
    const area = areaRef.current;
    if (!area) return;
    const rect = area.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;
    let bestId = null, bestDist = GRAB_RADIUS;
    for (const [id, p] of packetsRef.current) {
      if (p.dragging) continue;
      const d = Math.hypot(p.x + 25 - px, p.y + 25 - py);
      if (d < bestDist) { bestDist = d; bestId = id; }
    }
    if (bestId === null) return;
    const p = packetsRef.current.get(bestId);
    p.dragging = true;
    draggingIdRef.current = bestId;
    dragOffset.current = { x: p.x - px, y: p.y - py };
    area.setPointerCapture && e.pointerId != null && area.setPointerCapture(e.pointerId);
    const node = nodeRefs.current.get(bestId);
    if (node) node.classList.add('dragging');
  };

  const onPointerMove = (e) => {
    const id = draggingIdRef.current;
    if (id === null) return;
    const area = areaRef.current;
    if (!area) return;
    const rect = area.getBoundingClientRect();
    const p = packetsRef.current.get(id);
    if (!p) return;
    let nx = e.clientX - rect.left + dragOffset.current.x;
    let ny = e.clientY - rect.top + dragOffset.current.y;
    nx = Math.max(-10, Math.min(rect.width - 40, nx));
    ny = Math.max(-30, Math.min(rect.height + 30, ny));
    p.x = nx; p.y = ny;
    const node = nodeRefs.current.get(id);
    if (node) node.style.transform = `translate(${nx}px, ${ny}px)`;
  };

  const onPointerUp = (e) => {
    const id = draggingIdRef.current;
    draggingIdRef.current = null;
    if (id === null) return;
    const node = nodeRefs.current.get(id);
    if (node) node.classList.remove('dragging');
    resolveDrop(id, e.clientX, e.clientY);
  };

  const startGame = () => {
    clearAllTimers();
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    packetsRef.current.clear();
    nodeRefs.current.clear();
    setPacketIds([]);
    setParticles([]);
    scoreRef.current = 0;
    comboRef.current = 0;
    livesRef.current = LIVES_START;
    levelRef.current = 1;
    chuteCountRef.current = 3;
    setScore(0);
    setCombo(0);
    setLives(LIVES_START);
    setLevel(1);
    setChuteCount(3);
    setStatusMsg('Drag each glowing signal into its matching chute.');
    setPhase('playing');
    phaseRef.current = 'playing';
    lastTsRef.current = 0;
    startTsRef.current = performance.now();
    if (areaRef.current) areaHRef.current = areaRef.current.getBoundingClientRect().height;
    addTimer(() => spawnPacket(), 250);
    addTimer(() => scheduleSpawn(), 900);
    rafRef.current = requestAnimationFrame(tick);
  };

  return (
    <div
      className="app"
      data-testid="game-canvas"
      onPointerDown={onPointerDown}
      onPointerMove={onPointerMove}
      onPointerUp={onPointerUp}
      onPointerCancel={onPointerUp}
    >
      <div className="bgAnim" />

      <div className="hud">
        <div className="hudBox">
          <div className="hudLabel">Score</div>
          <div className="hudValue" data-testid="score">{score}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Level</div>
          <div className="hudValue" data-testid="level">{level}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Lives</div>
          <div className={`hudValue lives ${hurt ? 'hurt' : ''}`} data-testid="lives">{'❤'.repeat(Math.max(0, lives))}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Combo</div>
          <div className="hudValue combo" data-testid="combo">x{combo}</div>
        </div>
      </div>

      <div className="title">SIGNAL SORT</div>
      <div className="status">{statusMsg}</div>

      <div className="playAreaOuter">
        <div className="playArea" ref={areaRef} data-testid="play-area">
          <div data-testid="active-packet" ref={hintRef} style={{ position: 'absolute', width: 1, height: 1, opacity: 0 }} />

          {packetIds.map(id => {
            const p = packetsRef.current.get(id);
            if (!p) return null;
            const colorDef = BASE_COLORS.find(c => c.id === p.color);
            return (
              <div
                key={id}
                data-testid={`packet-${id}`}
                data-color={p.color}
                className={`packet ${p.bonus ? 'bonus' : ''}`}
                ref={el => { if (el) nodeRefs.current.set(id, el); }}
                style={{ background: colorDef.hex, color: colorDef.hex, transform: `translate(${p.x}px, ${p.y}px)` }}
              >
                {colorDef.icon}
              </div>
            );
          })}

          {particles.map(p => (
            <Particle key={p.id} x={p.x} y={p.y} color={p.color} onDone={() => removeParticle(p.id)} />
          ))}

          <div className="chuteRow" data-testid="chute-row">
            {BASE_COLORS.slice(0, chuteCount).map((c, i) => (
              <div
                key={c.id}
                data-testid={`chute-${i}`}
                data-color={c.id}
                className={`chute ${chuteFlash === i ? 'glowHit' : ''}`}
                ref={el => { if (el) chuteNodeRefs.current.set(i, el); }}
                style={{ borderColor: c.hex, boxShadow: `inset 0 8px 16px rgba(0,0,0,0.5), 0 0 16px ${c.hex}55`, color: c.hex }}
              >
                <span style={{ fontSize: 16 }}>{c.icon}</span>
              </div>
            ))}
          </div>

          {phase === 'start' && (
            <div className="overlay">
              <div className="subtitle">Neon signal packets fall from above. Grab one and drag it into the chute with the matching color and icon before it hits bottom. Build combos, watch for bright bonus signals, and don't drop three!</div>
              <div className="highscoreLine" data-testid="high-score">Best: {highScore}</div>
              <button className="btn" data-testid="start-btn" onClick={startGame}>START</button>
            </div>
          )}

          {phase === 'over' && (
            <div className="overlay">
              <div className="title" style={{ fontSize: 'clamp(20px, 6vw, 30px)', marginTop: 0 }}>LINE DOWN</div>
              <div className="hudValue" data-testid="final-score">Score: {score}</div>
              <div className="highscoreLine" data-testid="high-score-final">Best: {highScore}</div>
              <button className="btn" data-testid="restart-btn" onClick={startGame}>PLAY AGAIN</button>
            </div>
          )}
        </div>
      </div>

      <div className="footer">Signal Sort — drag falling signals into their matching chute</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
