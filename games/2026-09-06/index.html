<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Redline Rush</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #050307; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }
  #root { width: 100%; height: 100%; }

  .app {
    width: 100%; height: 100%; position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; overflow: hidden; gap: 6px; padding: 6px 0;
    background: radial-gradient(circle at 50% 30%, #1a0a12 0%, #0a0610 55%, #030308 100%);
  }

  .hud {
    position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-around;
    padding: 10px 12px; z-index: 15; pointer-events: none;
  }
  .hudBox { text-align: center; }
  .hudLabel { font-size: 10px; letter-spacing: 2px; color: #ff5e3a; text-transform: uppercase; }
  .hudValue {
    font-size: 22px; font-weight: 800; color: #fff;
    text-shadow: 0 0 10px #ff5e3a, 0 0 20px #ff5e3a;
  }
  .hudValue.combo { color: #ffd35e; text-shadow: 0 0 10px #ffd35e, 0 0 22px #e8a800; }
  .hudValue.lives { color: #ff5e8a; text-shadow: 0 0 10px #ff5e8a, 0 0 22px #c9005a; }
  .hudValue.hurt { animation: hurtPulse 0.4s ease; }
  @keyframes hurtPulse { 0%,100% { opacity:1; transform: scale(1);} 50% { opacity:0.4; transform: scale(1.25);} }

  .title {
    font-size: clamp(18px, 5vw, 30px); font-weight: 900; letter-spacing: 3px; margin-top: 34px;
    background: linear-gradient(90deg, #ff5e3a, #ffd35e, #ff2e6d);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(255,94,58,0.6));
    animation: titlePulse 2.4s ease-in-out infinite;
    text-align: center;
  }
  @keyframes titlePulse { 0%,100% { filter: drop-shadow(0 0 12px rgba(255,94,58,0.6)); } 50% { filter: drop-shadow(0 0 26px rgba(255,45,109,0.85)); } }

  .subtitle { color: #d8c0c8; font-size: 13px; letter-spacing: 0.5px; text-align: center; max-width: 420px; line-height: 1.55; }

  .btn {
    padding: 15px 40px; font-size: 19px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(135deg, #ff5e3a, #ffd35e);
    border: none; border-radius: 50px; color: #180500; cursor: pointer;
    box-shadow: 0 0 20px rgba(255,94,58,0.7), 0 0 50px rgba(255,211,94,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(255,94,58,0.9), 0 0 70px rgba(255,211,94,0.5); }
  .btn:active { transform: scale(0.96); }

  .highscoreLine { color: #ffd35e; font-size: 14px; text-shadow: 0 0 8px rgba(255,211,94,0.6); }

  .arenaOuter {
    position: relative; width: min(94vw, 520px); height: min(50vh, 520px); z-index: 5;
    border-radius: 18px; overflow: hidden; border: 2px solid rgba(255,94,58,0.25);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 0 30px rgba(255,94,58,0.12);
    background: #0a0509; cursor: pointer;
  }

  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .lockBtn {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 12;
    padding: 14px 46px; font-size: 17px; font-weight: 900; letter-spacing: 3px;
    background: linear-gradient(135deg, #ff2e6d, #ff5e3a); border: none; border-radius: 50px;
    color: #1a0004; box-shadow: 0 0 18px rgba(255,45,109,0.7), 0 0 44px rgba(255,94,58,0.35);
    min-height: 48px; min-width: 120px;
  }
  .lockBtn:active { transform: translateX(-50%) scale(0.94); }

  .overlay {
    position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 18px;
    background: rgba(10, 5, 8, 0.9); backdrop-filter: blur(4px);
  }

  .status { color: #c0a8b4; font-size: 12px; letter-spacing: 0.5px; height: 15px; z-index: 10; text-align: center; }

  .footer { position: relative; text-align: center; color: #302030; font-size: 10px; z-index: 10; padding-bottom: 2px; }

  @media (max-width: 480px) {
    .hudValue { font-size: 17px; }
    .btn { padding: 13px 30px; font-size: 16px; }
    .subtitle { font-size: 12px; }
    .arenaOuter { height: min(48vh, 480px); }
    .lockBtn { padding: 12px 34px; font-size: 15px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const HS_KEY = 'redlineRush_highScore';
const LIVES_START = 3;
const PI = Math.PI;

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function randRange(lo, hi) { return lo + Math.random() * (hi - lo); }

function useAudio() {
  const ctxRef = useRef(null);
  const getCtx = () => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  };

  const tone = useCallback((freq, duration, type, gainScale, freqEnd) => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + duration);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(gainScale, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.05);
    } catch (e) {}
  }, []);

  const lockSound = useCallback((combo) => tone(360 + combo * 26, 0.14, 'triangle', 0.18, 980 + combo * 30), [tone]);
  const missSound = useCallback(() => tone(180, 0.3, 'sawtooth', 0.2, 60), [tone]);
  const levelUpSound = useCallback(() => {
    tone(500, 0.12, 'sine', 0.18, 800);
    setTimeout(() => tone(700, 0.16, 'sine', 0.18, 1100), 110);
  }, [tone]);
  const overSound = useCallback(() => {
    tone(300, 0.25, 'sawtooth', 0.2, 200);
    setTimeout(() => tone(180, 0.35, 'sawtooth', 0.2, 80), 150);
  }, [tone]);

  return { lockSound, missSound, levelUpSound, overSound };
}

function makeGameState() {
  return {
    bounds: { w: 400, h: 400 },
    pivot: { x: 200, y: 340 },
    radius: 160,
    pos: 0,
    vel: 0.5,
    zoneCenter: 0.5,
    zoneHalf: 0.14,
    particles: [],
    shake: 0,
    flash: 0,
    level: 1,
    running: false,
  };
}

function spawnBurst(arr, x, y, color, count, speedMin, speedMax, sizeMin, sizeMax, lifeMs) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * PI * 2;
    const spd = speedMin + Math.random() * (speedMax - speedMin);
    arr.push({
      x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      life: lifeMs, maxLife: lifeMs, color,
      size: sizeMin + Math.random() * (sizeMax - sizeMin),
    });
  }
}

function repositionZone(state) {
  state.zoneCenter = randRange(0.14, 0.86);
}

function App() {
  const [phase, setPhase] = useState('start'); // start | playing | over
  const [score, setScore] = useState(0);
  const [lives, setLives] = useState(LIVES_START);
  const [combo, setCombo] = useState(0);
  const [level, setLevel] = useState(1);
  const [hurt, setHurt] = useState(false);
  const [highScore, setHighScore] = useState(() => parseInt(localStorage.getItem(HS_KEY) || '0', 10));
  const [statusMsg, setStatusMsg] = useState('Tap LOCK or press Space the instant the needle crosses the gold zone.');

  const canvasRef = useRef(null);
  const arenaRef = useRef(null);
  const gs = useRef(makeGameState());
  const rafRef = useRef(null);
  const lastTsRef = useRef(0);
  const scoreRef = useRef(0);
  const comboRef = useRef(0);
  const livesRef = useRef(LIVES_START);
  const levelRef = useRef(1);
  const locksRef = useRef(0);
  const highScoreRef = useRef(highScore);
  const phaseRef = useRef('start');
  const { lockSound, missSound, levelUpSound, overSound } = useAudio();

  useEffect(() => { phaseRef.current = phase; }, [phase]);

  const resizeCanvas = useCallback(() => {
    const canvas = canvasRef.current;
    const arena = arenaRef.current;
    if (!canvas || !arena) return;
    const rect = arena.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const w = rect.width, h = rect.height;
    gs.current.bounds = { w, h };
    gs.current.pivot = { x: w / 2, y: h * 0.86 };
    gs.current.radius = Math.min(w, h) * 0.62;
  }, []);

  useEffect(() => {
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    return () => window.removeEventListener('resize', resizeCanvas);
  }, [resizeCanvas]);

  const endGame = useCallback(() => {
    gs.current.running = false;
    phaseRef.current = 'over';
    setPhase('over');
    overSound();
    setStatusMsg('Redline exceeded.');
  }, [overSound]);

  const maybeLevelUp = useCallback(() => {
    locksRef.current += 1;
    if (locksRef.current % 5 === 0) {
      levelRef.current += 1;
      setLevel(levelRef.current);
      levelUpSound();
      setStatusMsg(`Level ${levelRef.current}! Needle speeds up, zone narrows.`);
    }
  }, [levelUpSound]);

  const registerLock = useCallback((success) => {
    const state = gs.current;
    const tipAngle = PI - state.pos * PI;
    const x = state.pivot.x + Math.cos(tipAngle) * state.radius;
    const y = state.pivot.y - Math.sin(tipAngle) * state.radius;

    if (success) {
      comboRef.current += 1;
      setCombo(comboRef.current);
      const gained = 15 + (comboRef.current - 1) * 6;
      scoreRef.current += gained;
      setScore(scoreRef.current);
      if (scoreRef.current > highScoreRef.current) {
        highScoreRef.current = scoreRef.current;
        localStorage.setItem(HS_KEY, String(scoreRef.current));
        setHighScore(scoreRef.current);
      }
      lockSound(comboRef.current);
      spawnBurst(state.particles, x, y, '#ffd35e', 12, 40, 180, 2, 5, 450);
      maybeLevelUp();
      repositionZone(state);
    } else {
      comboRef.current = 0;
      setCombo(0);
      livesRef.current -= 1;
      setLives(livesRef.current);
      setHurt(true);
      setTimeout(() => setHurt(false), 400);
      state.shake = 9;
      state.flash = 1;
      missSound();
      spawnBurst(state.particles, x, y, '#ff2e6d', 9, 30, 140, 2, 4, 400);
      repositionZone(state);
      if (livesRef.current <= 0) { endGame(); return; }
      setStatusMsg('Missed the zone! Watch the sweep and try again.');
    }
  }, [lockSound, missSound, maybeLevelUp, endGame]);

  const startGameRef = useRef(() => {});

  const attemptLock = useCallback(() => {
    if (phaseRef.current === 'over') { startGameRef.current(); return; }
    if (phaseRef.current !== 'playing') return;
    const state = gs.current;
    const diff = Math.abs(state.pos - state.zoneCenter);
    registerLock(diff <= state.zoneHalf);
  }, [registerLock]);

  // --- Input: tap/click the field, the LOCK button, or press Space ---
  useEffect(() => {
    const onKeyDown = (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        attemptLock();
      }
    };
    window.addEventListener('keydown', onKeyDown);
    return () => window.removeEventListener('keydown', onKeyDown);
  }, [attemptLock]);

  const tick = useCallback((ts) => {
    const state = gs.current;
    if (!lastTsRef.current) lastTsRef.current = ts;
    let dt = (ts - lastTsRef.current) / 1000;
    dt = Math.min(dt, 0.05);
    lastTsRef.current = ts;

    if (phaseRef.current === 'playing') {
      state.level = levelRef.current;
      const speed = clamp(0.55 + state.level * 0.09, 0.55, 1.85);
      state.pos += state.vel * speed * dt;
      if (state.pos >= 1) { state.pos = 1; state.vel = -1; }
      else if (state.pos <= 0) { state.pos = 0; state.vel = 1; }

      state.zoneHalf = clamp(0.15 - state.level * 0.009, 0.055, 0.15);
    }

    for (let i = state.particles.length - 1; i >= 0; i--) {
      const pt = state.particles[i];
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.vx *= 0.94; pt.vy *= 0.94;
      pt.life -= dt * 1000;
      if (pt.life <= 0) state.particles.splice(i, 1);
    }
    if (state.particles.length > 140) state.particles.splice(0, state.particles.length - 140);

    if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 40);
    if (state.flash > 0) state.flash = Math.max(0, state.flash - dt * 3);

    draw(state, ts);
    rafRef.current = requestAnimationFrame(tick);
  }, []);

  const draw = (state, ts) => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const { w, h } = state.bounds;
    const { x: px, y: py } = state.pivot;
    const R = state.radius;

    ctx.save();
    if (state.shake > 0) {
      ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
    }

    ctx.fillStyle = 'rgba(10,5,9,0.35)';
    ctx.fillRect(-20, -20, w + 40, h + 40);

    if (!state.bgGradient || state.bgGradientKey !== `${w}x${h}`) {
      const grad = ctx.createRadialGradient(px, py, 10, px, py, Math.max(w, h) * 0.8);
      grad.addColorStop(0, 'hsla(14, 70%, 16%, 1)');
      grad.addColorStop(1, 'rgba(5,3,6,0)');
      state.bgGradient = grad;
      state.bgGradientKey = `${w}x${h}`;
    }
    ctx.globalAlpha = 0.3 + Math.sin(ts / 3000) * 0.06;
    ctx.fillStyle = state.bgGradient;
    ctx.fillRect(0, 0, w, h);
    ctx.globalAlpha = 1;

    if (state.flash > 0) {
      ctx.fillStyle = `rgba(255,45,109,${state.flash * 0.18})`;
      ctx.fillRect(0, 0, w, h);
    }

    // outer dial track
    ctx.strokeStyle = 'rgba(200,140,150,0.16)';
    ctx.lineWidth = 14;
    ctx.beginPath();
    ctx.arc(px, py, R, PI, 0, false);
    ctx.stroke();

    // tick marks
    ctx.strokeStyle = 'rgba(255,200,180,0.25)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i <= 10; i++) {
      const t = i / 10;
      const ang = PI - t * PI;
      const inner = R - 14;
      const outer = R + 10;
      ctx.moveTo(px + Math.cos(ang) * inner, py - Math.sin(ang) * inner);
      ctx.lineTo(px + Math.cos(ang) * outer, py - Math.sin(ang) * outer);
    }
    ctx.stroke();

    // gold target zone
    const zStart = PI - clamp(state.zoneCenter - state.zoneHalf, 0, 1) * PI;
    const zEnd = PI - clamp(state.zoneCenter + state.zoneHalf, 0, 1) * PI;
    ctx.save();
    ctx.strokeStyle = '#ffd35e';
    ctx.shadowColor = '#ffd35e';
    ctx.shadowBlur = 10;
    ctx.lineWidth = 14;
    ctx.beginPath();
    ctx.arc(px, py, R, -zStart, -zEnd, false);
    ctx.stroke();
    ctx.restore();

    // pivot base
    ctx.fillStyle = 'rgba(20,10,14,0.9)';
    ctx.beginPath();
    ctx.arc(px, py, 20, 0, PI * 2);
    ctx.fill();

    // needle
    const tipAngle = PI - state.pos * PI;
    const tipX = px + Math.cos(tipAngle) * R;
    const tipY = py - Math.sin(tipAngle) * R;
    const nearZone = Math.abs(state.pos - state.zoneCenter) <= state.zoneHalf;
    ctx.save();
    ctx.strokeStyle = nearZone ? '#7dffb0' : '#ff5e3a';
    ctx.shadowColor = nearZone ? '#7dffb0' : '#ff5e3a';
    ctx.shadowBlur = 12;
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(tipX, tipY);
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle = '#ffd35e';
    ctx.shadowColor = '#ffd35e';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(px, py, 9, 0, PI * 2);
    ctx.fill();

    // particles
    for (const pt of state.particles) {
      ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.restore();
  };

  const startGame = () => {
    resizeCanvas();
    const state = makeGameState();
    state.bounds = gs.current.bounds;
    state.pivot = gs.current.pivot;
    state.radius = gs.current.radius;
    state.running = true;
    repositionZone(state);
    gs.current = state;
    scoreRef.current = 0;
    comboRef.current = 0;
    livesRef.current = LIVES_START;
    levelRef.current = 1;
    locksRef.current = 0;
    lastTsRef.current = 0;
    setScore(0);
    setCombo(0);
    setLives(LIVES_START);
    setLevel(1);
    setStatusMsg('Watch the needle sweep — lock it inside the gold zone.');
    setPhase('playing');
    phaseRef.current = 'playing';
    cancelAnimationFrame(rafRef.current);
    rafRef.current = requestAnimationFrame(tick);
  };

  useEffect(() => { startGameRef.current = startGame; });

  useEffect(() => () => cancelAnimationFrame(rafRef.current), []);

  return (
    <div className="app" data-testid="game-canvas">
      <div className="hud">
        <div className="hudBox">
          <div className="hudLabel">Score</div>
          <div className="hudValue" data-testid="score">{score}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Lives</div>
          <div className={`hudValue lives ${hurt ? 'hurt' : ''}`} data-testid="lives">{'❤'.repeat(Math.max(0, lives))}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Combo</div>
          <div className="hudValue combo" data-testid="combo">x{combo}</div>
        </div>
      </div>

      <div className="title">REDLINE RUSH</div>

      <div
        className="arenaOuter"
        ref={arenaRef}
        data-testid="play-field"
        onClick={attemptLock}
        onTouchStart={(e) => { e.preventDefault(); attemptLock(); }}
      >
        <canvas ref={canvasRef} data-testid="arena" />

        {phase === 'playing' && (
          <button
            className="lockBtn"
            data-testid="lock-btn"
            onClick={(e) => { e.stopPropagation(); attemptLock(); }}
            onTouchStart={(e) => { e.stopPropagation(); e.preventDefault(); attemptLock(); }}
          >
            LOCK
          </button>
        )}

        {phase === 'start' && (
          <div className="overlay">
            <div className="subtitle">A needle sweeps back and forth across the dial. Tap anywhere on the dial, hit LOCK, or press Space the instant it crosses the gold zone.<br />Lock inside the zone for a rising combo and score; miss and you lose one of three lives. The needle speeds up and the zone narrows as your level climbs.</div>
            <div className="highscoreLine" data-testid="high-score">Best: {highScore}</div>
            <button className="btn" data-testid="start-btn" onClick={(e) => { e.stopPropagation(); startGame(); }}>START</button>
          </div>
        )}

        {phase === 'over' && (
          <div className="overlay">
            <div className="title" style={{ fontSize: 'clamp(20px, 6vw, 30px)', marginTop: 0 }}>REDLINED</div>
            <div className="hudValue" data-testid="final-score">Score: {score}</div>
            <div className="highscoreLine" data-testid="high-score-final">Best: {highScore}</div>
            <button className="btn" data-testid="restart-btn" onClick={(e) => { e.stopPropagation(); startGame(); }}>PLAY AGAIN</button>
          </div>
        )}
      </div>

      <div className="status">{statusMsg}</div>
      <div className="footer">Redline Rush — Level {level} — time your lock to catch the sweeping needle in the zone</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
