<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Grid Sentinel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05030d; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }
  #root { width: 100%; height: 100%; }

  .app {
    width: 100%; height: 100%; position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: center; overflow: hidden; gap: 8px;
    background: radial-gradient(circle at 50% 10%, #101d33 0%, #0a0a18 55%, #030109 100%);
  }

  .hud {
    position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-around;
    padding: 10px 8px; z-index: 15; pointer-events: none; flex-wrap: wrap;
  }
  .hudBox { text-align: center; min-width: 56px; }
  .hudLabel { font-size: 9px; letter-spacing: 2px; color: #5ecfff; text-transform: uppercase; }
  .hudValue {
    font-size: 20px; font-weight: 800; color: #fff;
    text-shadow: 0 0 10px #5ecfff, 0 0 20px #5ecfff;
  }
  .hudValue.energy { color: #6dffb0; text-shadow: 0 0 10px #6dffb0, 0 0 22px #24c47a; }
  .hudValue.combo { color: #ffe45e; text-shadow: 0 0 10px #ffe45e, 0 0 22px #ff9d00; }
  .hudValue.lives { color: #ff5ee0; text-shadow: 0 0 10px #ff5ee0, 0 0 22px #c300a0; }
  .hudValue.hurt { animation: hurtPulse 0.4s ease; }
  @keyframes hurtPulse { 0%,100% { opacity:1; transform: scale(1);} 50% { opacity:0.4; transform: scale(1.25);} }

  .title {
    font-size: clamp(18px, 5.5vw, 30px); font-weight: 900; letter-spacing: 3px;
    background: linear-gradient(90deg, #5ecfff, #6dffb0, #ffd35e);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(94,207,255,0.6));
    animation: titlePulse 2.4s ease-in-out infinite;
    text-align: center;
  }
  @keyframes titlePulse { 0%,100% { filter: drop-shadow(0 0 12px rgba(94,207,255,0.6)); } 50% { filter: drop-shadow(0 0 26px rgba(94,207,255,0.95)); } }

  .subtitle { color: #cabde8; font-size: 13px; letter-spacing: 0.5px; text-align: center; max-width: 420px; line-height: 1.5; }

  .btn {
    padding: 15px 40px; font-size: 19px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(135deg, #2f7cff, #24c47a);
    border: none; border-radius: 50px; color: #fff; cursor: pointer;
    box-shadow: 0 0 20px rgba(47,124,255,0.7), 0 0 50px rgba(36,196,122,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(47,124,255,0.9), 0 0 70px rgba(36,196,122,0.5); }
  .btn:active { transform: scale(0.96); }

  .highscoreLine { color: #ffd35e; font-size: 14px; text-shadow: 0 0 8px rgba(255,200,50,0.6); }

  .arenaOuter {
    position: relative; width: min(94vw, 640px); height: min(60vh, 460px); z-index: 5;
    border-radius: 20px; overflow: hidden; border: 2px solid rgba(94,207,255,0.25);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 0 30px rgba(94,207,255,0.15);
    background: #08061a; cursor: pointer;
  }

  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .overlay {
    position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 20px;
    background: rgba(4, 6, 15, 0.88); backdrop-filter: blur(4px);
  }

  .status { color: #beb0e0; font-size: 13px; letter-spacing: 0.5px; height: 16px; z-index: 10; text-align: center; }

  .footer { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; color: #4a5a6a; font-size: 11px; z-index: 10; }

  @media (max-width: 480px) {
    .hudValue { font-size: 15px; }
    .hudLabel { font-size: 8px; }
    .btn { padding: 13px 30px; font-size: 16px; }
    .subtitle { font-size: 12px; }
    .arenaOuter { height: min(56vh, 460px); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const HS_KEY = 'gridSentinel_highScore';
const COLS = 8;
const ROWS = 7;
const LIVES_START = 10;
const ENERGY_START = 140;
const ENERGY_TICK_MS = 1800;
const ENERGY_TICK_AMOUNT = 3;
const COMBO_WINDOW_MS = 2200;
const INTERMISSION_MS = 3000;

const TURRET_LEVELS = {
  1: { cost: 25, dmg: 9, rangeCells: 1.55, cooldownMs: 620, color: '#5ecfff', glow: 'rgba(94,207,255,0.8)' },
  2: { cost: 30, dmg: 16, rangeCells: 1.9, cooldownMs: 500, color: '#9d6bff', glow: 'rgba(157,107,255,0.85)' },
  3: { cost: 45, dmg: 27, rangeCells: 2.25, cooldownMs: 380, color: '#ffd35e', glow: 'rgba(255,211,94,0.9)' },
};

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function dist(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); }

function buildGridPath() {
  const pts = [];
  for (let c = 0; c < COLS; c++) pts.push([c, 0]);
  pts.push([COLS - 1, 1]);
  for (let c = COLS - 1; c >= 0; c--) pts.push([c, 2]);
  pts.push([0, 3]);
  for (let c = 0; c < COLS; c++) pts.push([c, 4]);
  pts.push([COLS - 1, 5]);
  for (let c = COLS - 1; c >= 0; c--) pts.push([c, 6]);
  return pts;
}

function buildBuildableSet() {
  const set = new Set();
  for (const row of [1, 3, 5]) {
    for (let c = 0; c < COLS; c++) {
      if (row === 1 && c === COLS - 1) continue;
      if (row === 3 && c === 0) continue;
      if (row === 5 && c === COLS - 1) continue;
      set.add(c + ',' + row);
    }
  }
  return set;
}

function buildPathSet(pathNodes) {
  const set = new Set();
  for (const [c, r] of pathNodes) set.add(c + ',' + r);
  return set;
}

const PATH_NODES = buildGridPath();
const BUILD_SET = buildBuildableSet();
const PATH_SET = buildPathSet(PATH_NODES);
const CORE_NODE = PATH_NODES[PATH_NODES.length - 1];

function waveConfig(n) {
  return {
    count: Math.min(22, 5 + Math.floor(n * 1.8)),
    hp: 15 + n * 6,
    speedCells: Math.min(2.1, 1.05 + n * 0.045),
    spawnGapMs: Math.max(260, 750 - n * 18),
    tankChance: n >= 3 ? Math.min(0.4, 0.08 + n * 0.02) : 0,
  };
}

function useAudio() {
  const ctxRef = useRef(null);
  const lastShotRef = useRef(0);
  const getCtx = () => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  };

  const tone = useCallback((freq, duration, type, gainScale, freqEnd) => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + duration);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(gainScale, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.05);
    } catch (e) {}
  }, []);

  const placeSound = useCallback(() => tone(420, 0.12, 'square', 0.12, 620), [tone]);
  const upgradeSound = useCallback(() => { tone(500, 0.1, 'square', 0.12, 700); setTimeout(() => tone(760, 0.12, 'square', 0.1, 980), 70); }, [tone]);
  const denySound = useCallback(() => tone(160, 0.15, 'sawtooth', 0.1, 90), [tone]);
  const shootSound = useCallback(() => {
    const now = performance.now();
    if (now - lastShotRef.current < 55) return;
    lastShotRef.current = now;
    tone(920, 0.05, 'square', 0.045, 640);
  }, [tone]);
  const killSound = useCallback(() => tone(300, 0.14, 'sawtooth', 0.15, 90), [tone]);
  const leakSound = useCallback(() => tone(140, 0.3, 'sawtooth', 0.2, 55), [tone]);
  const waveSound = useCallback(() => { tone(440, 0.16, 'triangle', 0.14, 600); setTimeout(() => tone(660, 0.18, 'triangle', 0.12, 880), 120); }, [tone]);
  const overSound = useCallback(() => { tone(320, 0.25, 'sawtooth', 0.2, 220); setTimeout(() => tone(200, 0.35, 'sawtooth', 0.2, 90), 150); }, [tone]);

  return { placeSound, upgradeSound, denySound, shootSound, killSound, leakSound, waveSound, overSound };
}

function makeGameState() {
  return {
    bounds: { w: 640, h: 460 },
    cellSize: 40, offsetX: 0, offsetY: 0,
    turrets: {},
    enemies: [],
    projectiles: [],
    particles: [],
    nextEnemyId: 1,
    elapsed: 0,
    energyTimer: ENERGY_TICK_MS,
    waveState: 'active',
    waveSpawnRemaining: waveConfig(1).count,
    waveSpawnTimer: 400,
    waveCfg: waveConfig(1),
    intermissionUntil: 0,
    hoverKey: null,
    shake: 0,
    running: false,
  };
}

function spawnBurst(arr, x, y, color, count, speedMin, speedMax, sizeMin, sizeMax, lifeMs) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = speedMin + Math.random() * (speedMax - speedMin);
    arr.push({
      x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      life: lifeMs, maxLife: lifeMs, color,
      size: sizeMin + Math.random() * (sizeMax - sizeMin),
    });
  }
}

function App() {
  const [phase, setPhase] = useState('start'); // start | playing | over
  const [score, setScore] = useState(0);
  const [lives, setLives] = useState(LIVES_START);
  const [energy, setEnergy] = useState(ENERGY_START);
  const [wave, setWave] = useState(1);
  const [combo, setCombo] = useState(0);
  const [hurt, setHurt] = useState(false);
  const [highScore, setHighScore] = useState(() => parseInt(localStorage.getItem(HS_KEY) || '0', 10));
  const [statusMsg, setStatusMsg] = useState('Tap a highlighted lane tile to build a turret.');

  const canvasRef = useRef(null);
  const arenaRef = useRef(null);
  const gs = useRef(makeGameState());
  const rafRef = useRef(null);
  const lastTsRef = useRef(0);
  const scoreRef = useRef(0);
  const comboRef = useRef(0);
  const comboExpireRef = useRef(0);
  const livesRef = useRef(LIVES_START);
  const energyRef = useRef(ENERGY_START);
  const waveRef = useRef(1);
  const highScoreRef = useRef(highScore);
  const phaseRef = useRef('start');
  const { placeSound, upgradeSound, denySound, shootSound, killSound, leakSound, waveSound, overSound } = useAudio();

  useEffect(() => { phaseRef.current = phase; }, [phase]);

  const gridLayerRef = useRef(document.createElement('canvas'));

  const rebuildGridLayer = (state) => {
    const layer = gridLayerRef.current;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    layer.width = Math.round(state.bounds.w * dpr);
    layer.height = Math.round(state.bounds.h * dpr);
    const ctx = layer.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, state.bounds.w, state.bounds.h);
    const cs = state.cellSize;
    for (let row = 0; row < ROWS; row++) {
      for (let col = 0; col < COLS; col++) {
        const key = col + ',' + row;
        const x = state.offsetX + col * cs, y = state.offsetY + row * cs;
        if (PATH_SET.has(key)) {
          ctx.fillStyle = 'rgba(94,207,255,0.10)';
          ctx.fillRect(x + 1, y + 1, cs - 2, cs - 2);
          ctx.strokeStyle = 'rgba(94,207,255,0.35)';
          ctx.lineWidth = 1;
          ctx.strokeRect(x + 1, y + 1, cs - 2, cs - 2);
        } else if (BUILD_SET.has(key)) {
          ctx.fillStyle = 'rgba(255,255,255,0.02)';
          ctx.fillRect(x + 2, y + 2, cs - 4, cs - 4);
          ctx.strokeStyle = 'rgba(109,255,176,0.18)';
          ctx.setLineDash([4, 3]);
          ctx.lineWidth = 1;
          ctx.strokeRect(x + 3, y + 3, cs - 6, cs - 6);
          ctx.setLineDash([]);
        }
      }
    }
  };

  const resizeCanvas = useCallback(() => {
    const canvas = canvasRef.current;
    const arena = arenaRef.current;
    if (!canvas || !arena) return;
    const rect = arena.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const state = gs.current;
    state.bounds = { w: rect.width, h: rect.height };
    const cellSize = Math.min(rect.width / COLS, rect.height / ROWS);
    state.cellSize = cellSize;
    state.offsetX = (rect.width - cellSize * COLS) / 2;
    state.offsetY = (rect.height - cellSize * ROWS) / 2;
    rebuildGridLayer(state);
  }, []);

  useEffect(() => {
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    return () => window.removeEventListener('resize', resizeCanvas);
  }, [resizeCanvas]);

  const cellCenter = (state, col, row) => ({
    x: state.offsetX + col * state.cellSize + state.cellSize / 2,
    y: state.offsetY + row * state.cellSize + state.cellSize / 2,
  });

  const spawnEnemy = useCallback((state) => {
    const cfg = state.waveCfg;
    const isTank = Math.random() < cfg.tankChance;
    const start = cellCenter(state, PATH_NODES[0][0], PATH_NODES[0][1]);
    state.enemies.push({
      id: state.nextEnemyId++,
      segIndex: 0, segT: 0,
      x: start.x - state.cellSize, y: start.y,
      hp: isTank ? cfg.hp * 1.9 : cfg.hp,
      maxHp: isTank ? cfg.hp * 1.9 : cfg.hp,
      speedCells: isTank ? cfg.speedCells * 0.65 : cfg.speedCells,
      tier: isTank ? 'tank' : 'drone',
      radius: isTank ? state.cellSize * 0.32 : state.cellSize * 0.22,
    });
  }, []);

  const startNextWave = useCallback((state, n) => {
    state.waveCfg = waveConfig(n);
    state.waveSpawnRemaining = state.waveCfg.count;
    state.waveSpawnTimer = 300;
    state.waveState = 'active';
    waveRef.current = n;
    setWave(n);
    setStatusMsg(`Wave ${n} incoming — ${state.waveCfg.count} drones inbound.`);
    waveSound();
  }, [waveSound]);

  const endGame = useCallback(() => {
    gs.current.running = false;
    phaseRef.current = 'over';
    setPhase('over');
    overSound();
    setStatusMsg('The core has been overrun.');
  }, [overSound]);

  const tick = useCallback((ts) => {
    const state = gs.current;
    if (!state.running) return;
    if (!lastTsRef.current) lastTsRef.current = ts;
    let dt = (ts - lastTsRef.current) / 1000;
    dt = Math.min(dt, 0.05);
    lastTsRef.current = ts;
    state.elapsed += dt * 1000;

    if (comboRef.current > 0 && ts > comboExpireRef.current) {
      comboRef.current = 0;
      setCombo(0);
    }

    // passive energy regen
    state.energyTimer -= dt * 1000;
    if (state.energyTimer <= 0) {
      state.energyTimer = ENERGY_TICK_MS;
      energyRef.current += ENERGY_TICK_AMOUNT;
      setEnergy(energyRef.current);
    }

    // wave spawn / intermission logic
    if (state.waveState === 'active') {
      state.waveSpawnTimer -= dt * 1000;
      if (state.waveSpawnTimer <= 0 && state.waveSpawnRemaining > 0) {
        spawnEnemy(state);
        state.waveSpawnRemaining--;
        state.waveSpawnTimer = state.waveCfg.spawnGapMs;
      }
      if (state.waveSpawnRemaining <= 0 && state.enemies.length === 0) {
        state.waveState = 'intermission';
        state.intermissionUntil = ts + INTERMISSION_MS;
        setStatusMsg('Wave cleared! Reinforce your lanes before the next wave.');
      }
    } else if (state.waveState === 'intermission') {
      if (ts >= state.intermissionUntil) {
        startNextWave(state, waveRef.current + 1);
      }
    }

    // move enemies along path
    let scoreDelta = 0;
    for (let i = state.enemies.length - 1; i >= 0; i--) {
      const e = state.enemies[i];
      e.segT += dt * e.speedCells;
      while (e.segT >= 1 && e.segIndex < PATH_NODES.length - 2) {
        e.segT -= 1;
        e.segIndex++;
      }
      const reachedCore = e.segIndex >= PATH_NODES.length - 2 && e.segT >= 1;
      const a = cellCenter(state, PATH_NODES[e.segIndex][0], PATH_NODES[e.segIndex][1]);
      const b = cellCenter(state, PATH_NODES[e.segIndex + 1][0], PATH_NODES[e.segIndex + 1][1]);
      const t = clamp(e.segT, 0, 1);
      e.x = a.x + (b.x - a.x) * t;
      e.y = a.y + (b.y - a.y) * t;

      if (reachedCore) {
        state.enemies.splice(i, 1);
        livesRef.current -= 1;
        setLives(livesRef.current);
        comboRef.current = 0;
        setCombo(0);
        setHurt(true);
        setTimeout(() => setHurt(false), 400);
        state.shake = 10;
        leakSound();
        spawnBurst(state.particles, e.x, e.y, '#ff4d6d', 14, 50, 180, 2, 5, 500);
        if (livesRef.current <= 0) {
          if (scoreDelta) { scoreRef.current += scoreDelta; scoreDelta = 0; setScore(scoreRef.current); }
          endGame();
          return;
        }
      }
    }

    // turret targeting + firing
    for (const key in state.turrets) {
      const t = state.turrets[key];
      const stats = TURRET_LEVELS[t.level];
      const rangePx = stats.rangeCells * state.cellSize;
      let best = null, bestD = Infinity;
      for (const e of state.enemies) {
        const d = dist(t.x, t.y, e.x, e.y);
        if (d <= rangePx && d < bestD) { best = e; bestD = d; }
      }
      if (best && ts >= t.cooldownUntil) {
        t.cooldownUntil = ts + stats.cooldownMs;
        state.projectiles.push({ x: t.x, y: t.y, targetId: best.id, speed: 460, dmg: stats.dmg, color: stats.color });
        shootSound();
      }
    }

    // move projectiles + resolve hits
    for (let i = state.projectiles.length - 1; i >= 0; i--) {
      const p = state.projectiles[i];
      const target = state.enemies.find(e => e.id === p.targetId);
      if (!target) { state.projectiles.splice(i, 1); continue; }
      const dx = target.x - p.x, dy = target.y - p.y;
      const d = Math.hypot(dx, dy);
      const step = p.speed * dt;
      if (d <= step + target.radius) {
        target.hp -= p.dmg;
        spawnBurst(state.particles, target.x, target.y, p.color, 5, 30, 90, 1, 3, 260);
        state.projectiles.splice(i, 1);
        if (target.hp <= 0) {
          const idx = state.enemies.indexOf(target);
          if (idx >= 0) state.enemies.splice(idx, 1);
          comboRef.current += 1;
          comboExpireRef.current = ts + COMBO_WINDOW_MS;
          setCombo(comboRef.current);
          const base = (10 + waveRef.current * 1.5) * (target.tier === 'tank' ? 1.8 : 1);
          scoreDelta += Math.round(base * (1 + comboRef.current * 0.12));
          energyRef.current += target.tier === 'tank' ? 6 : 3;
          killSound();
          spawnBurst(state.particles, target.x, target.y, target.tier === 'tank' ? '#ffd35e' : '#6dffb0', 16, 40, 170, 2, 5, 480);
        }
      } else {
        p.x += (dx / d) * step;
        p.y += (dy / d) * step;
      }
    }

    if (scoreDelta) {
      scoreRef.current += scoreDelta;
      if (scoreRef.current > highScoreRef.current) {
        highScoreRef.current = scoreRef.current;
        localStorage.setItem(HS_KEY, String(scoreRef.current));
        setHighScore(scoreRef.current);
      }
      setScore(scoreRef.current);
    }
    setEnergy(energyRef.current);

    for (let i = state.particles.length - 1; i >= 0; i--) {
      const pt = state.particles[i];
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.vx *= 0.94; pt.vy *= 0.94;
      pt.life -= dt * 1000;
      if (pt.life <= 0) state.particles.splice(i, 1);
    }
    if (state.particles.length > 300) state.particles.splice(0, state.particles.length - 300);
    if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 40);

    draw(state, ts);
    rafRef.current = requestAnimationFrame(tick);
  }, [endGame, leakSound, shootSound, killSound, spawnEnemy, startNextWave]);

  const draw = (state, ts) => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const { w, h } = state.bounds;
    const cs = state.cellSize;

    ctx.save();
    if (state.shake > 0) {
      ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
    }

    ctx.fillStyle = '#08061a';
    ctx.fillRect(-10, -10, w + 20, h + 20);

    // grid cells (static layer cached off-screen; only the hovered tile redraws live)
    ctx.drawImage(gridLayerRef.current, 0, 0, w, h);
    if (state.hoverKey && BUILD_SET.has(state.hoverKey)) {
      const [hc, hr] = state.hoverKey.split(',').map(Number);
      const x = state.offsetX + hc * cs, y = state.offsetY + hr * cs;
      ctx.fillStyle = 'rgba(109,255,176,0.14)';
      ctx.fillRect(x + 2, y + 2, cs - 4, cs - 4);
      ctx.strokeStyle = 'rgba(109,255,176,0.6)';
      ctx.setLineDash([4, 3]);
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 3, y + 3, cs - 6, cs - 6);
      ctx.setLineDash([]);
    }

    // core
    const core = cellCenter(state, CORE_NODE[0], CORE_NODE[1]);
    const pulse = 0.75 + Math.sin(state.elapsed / 260) * 0.25;
    ctx.beginPath();
    ctx.arc(core.x, core.y, cs * 0.34 * pulse, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,94,224,0.85)';
    ctx.shadowColor = '#ff5ee0';
    ctx.shadowBlur = 18;
    ctx.fill();
    ctx.shadowBlur = 0;

    // turrets
    for (const key in state.turrets) {
      const t = state.turrets[key];
      const stats = TURRET_LEVELS[t.level];
      ctx.beginPath();
      ctx.arc(t.x, t.y, cs * 0.28, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(10,14,30,0.9)';
      ctx.fill();
      ctx.strokeStyle = stats.color;
      ctx.lineWidth = 2.5;
      ctx.stroke();
      for (let lv = 1; lv <= t.level; lv++) {
        ctx.beginPath();
        ctx.arc(t.x, t.y, cs * (0.08 + lv * 0.055), 0, Math.PI * 2);
        ctx.fillStyle = stats.color;
        ctx.fill();
      }
    }

    // projectiles
    ctx.fillStyle = '#fff59d';
    ctx.shadowColor = '#fff59d';
    ctx.shadowBlur = 8;
    for (const p of state.projectiles) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.6, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // enemies
    for (const e of state.enemies) {
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
      ctx.fillStyle = e.tier === 'tank' ? 'rgba(255,211,94,0.25)' : 'rgba(255,94,224,0.2)';
      ctx.fill();
      ctx.strokeStyle = e.tier === 'tank' ? '#ffd35e' : '#ff5ee0';
      ctx.lineWidth = 2;
      ctx.stroke();
      const barW = e.radius * 2;
      const hpFrac = clamp(e.hp / e.maxHp, 0, 1);
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(e.x - barW / 2, e.y - e.radius - 8, barW, 3);
      ctx.fillStyle = hpFrac > 0.4 ? '#6dffb0' : '#ff4d6d';
      ctx.fillRect(e.x - barW / 2, e.y - e.radius - 8, barW * hpFrac, 3);
    }

    // particles
    for (const pt of state.particles) {
      ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.restore();
  };

  const startGame = () => {
    resizeCanvas();
    const state = makeGameState();
    state.bounds = gs.current.bounds;
    state.cellSize = gs.current.cellSize;
    state.offsetX = gs.current.offsetX;
    state.offsetY = gs.current.offsetY;
    state.running = true;
    gs.current = state;
    scoreRef.current = 0;
    comboRef.current = 0;
    comboExpireRef.current = 0;
    livesRef.current = LIVES_START;
    energyRef.current = ENERGY_START;
    waveRef.current = 1;
    lastTsRef.current = 0;
    setScore(0);
    setCombo(0);
    setLives(LIVES_START);
    setEnergy(ENERGY_START);
    setWave(1);
    setStatusMsg('Wave 1 incoming — build turrets on the highlighted lanes.');
    setPhase('playing');
    phaseRef.current = 'playing';
    cancelAnimationFrame(rafRef.current);
    rafRef.current = requestAnimationFrame(tick);
  };

  useEffect(() => () => cancelAnimationFrame(rafRef.current), []);

  const posToCell = (clientX, clientY) => {
    const rect = arenaRef.current.getBoundingClientRect();
    const state = gs.current;
    const px = clientX - rect.left, py = clientY - rect.top;
    const col = Math.floor((px - state.offsetX) / state.cellSize);
    const row = Math.floor((py - state.offsetY) / state.cellSize);
    if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return null;
    return { col, row };
  };

  const handlePointerDown = (e) => {
    if (phaseRef.current !== 'playing') return;
    const cell = posToCell(e.clientX, e.clientY);
    if (!cell) return;
    const key = cell.col + ',' + cell.row;
    if (!BUILD_SET.has(key)) return;
    const state = gs.current;
    const center = cellCenter(state, cell.col, cell.row);
    const existing = state.turrets[key];

    if (!existing) {
      const cost = TURRET_LEVELS[1].cost;
      if (energyRef.current < cost) { denySound(); setStatusMsg('Not enough energy to build here.'); return; }
      energyRef.current -= cost;
      state.turrets[key] = { col: cell.col, row: cell.row, x: center.x, y: center.y, level: 1, cooldownUntil: 0 };
      setEnergy(energyRef.current);
      placeSound();
      setStatusMsg('Turret online. Tap it again to upgrade.');
      spawnBurst(state.particles, center.x, center.y, '#5ecfff', 14, 30, 120, 2, 4, 380);
    } else if (existing.level < 3) {
      const nextLevel = existing.level + 1;
      const cost = TURRET_LEVELS[nextLevel].cost;
      if (energyRef.current < cost) { denySound(); setStatusMsg('Not enough energy to upgrade.'); return; }
      energyRef.current -= cost;
      existing.level = nextLevel;
      setEnergy(energyRef.current);
      upgradeSound();
      setStatusMsg(`Turret upgraded to level ${nextLevel}.`);
      spawnBurst(state.particles, center.x, center.y, TURRET_LEVELS[nextLevel].color, 18, 40, 150, 2, 5, 420);
    } else {
      setStatusMsg('That turret is already fully upgraded.');
    }
  };

  const handlePointerMove = (e) => {
    if (phaseRef.current !== 'playing') return;
    const cell = posToCell(e.clientX, e.clientY);
    gs.current.hoverKey = cell ? cell.col + ',' + cell.row : null;
  };

  return (
    <div className="app" data-testid="game-canvas">
      <div className="hud">
        <div className="hudBox">
          <div className="hudLabel">Score</div>
          <div className="hudValue" data-testid="score">{score}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Energy</div>
          <div className="hudValue energy" data-testid="energy">{energy}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Wave</div>
          <div className="hudValue" data-testid="wave">{wave}</div>
        </div>
        <div className="hudBox">
          <div className={`hudValue lives ${hurt ? 'hurt' : ''}`} data-testid="lives">♥{Math.max(0, lives)}</div>
          <div className="hudLabel">Core HP</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Combo</div>
          <div className="hudValue combo" data-testid="combo">x{combo}</div>
        </div>
      </div>

      <div className="title" style={{ marginTop: 40 }}>GRID SENTINEL</div>

      <div
        className="arenaOuter"
        ref={arenaRef}
        data-testid="play-field"
        onPointerDown={handlePointerDown}
        onPointerMove={handlePointerMove}
      >
        <canvas ref={canvasRef} data-testid="arena" />

        {phase === 'start' && (
          <div className="overlay">
            <div className="subtitle">Drones march along the glowing lane from the edge to your core. Tap a highlighted side tile to build a turret (25 energy), tap it again to upgrade. Turrets auto-fire at the nearest drone in range.<br />Energy trickles in over time and from every kill — spend it wisely as waves grow tougher!</div>
            <div className="highscoreLine" data-testid="high-score">Best: {highScore}</div>
            <button className="btn" data-testid="start-btn" onClick={startGame}>START</button>
          </div>
        )}

        {phase === 'over' && (
          <div className="overlay">
            <div className="title" style={{ fontSize: 'clamp(20px, 6vw, 30px)' }}>CORE BREACHED</div>
            <div className="hudValue" data-testid="final-score">Score: {score}</div>
            <div className="status">Survived {wave} wave{wave === 1 ? '' : 's'}</div>
            <div className="highscoreLine" data-testid="high-score-final">Best: {highScore}</div>
            <button className="btn" data-testid="restart-btn" onClick={startGame}>PLAY AGAIN</button>
          </div>
        )}
      </div>

      <div className="status">{statusMsg}</div>
      <div className="footer">Grid Sentinel — build and upgrade turrets to defend the core</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
