<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Neon Slash</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05030d; font-family: 'Segoe UI', system-ui, sans-serif; }
  #root { width: 100%; height: 100%; }

  .app {
    width: 100%; height: 100%; position: relative; overflow: hidden;
    background: radial-gradient(circle at 50% 20%, #1a0a2e 0%, #0a0518 55%, #030109 100%);
  }

  canvas#gameCanvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }

  .hud {
    position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start;
    padding: 14px 20px; z-index: 10; pointer-events: none;
  }
  .hudBox { text-align: center; }
  .hudLabel { font-size: 11px; letter-spacing: 2px; color: #7d6bd0; text-transform: uppercase; }
  .hudValue {
    font-size: 26px; font-weight: 800; color: #fff;
    text-shadow: 0 0 10px #2be9ff, 0 0 20px #2be9ff;
  }
  .hudValue.combo { color: #ffe45e; text-shadow: 0 0 10px #ffe45e, 0 0 22px #ff9d00; }
  .lives { font-size: 22px; letter-spacing: 4px; text-shadow: 0 0 10px #ff2b6d; }

  .title {
    font-size: clamp(32px, 8vw, 56px); font-weight: 900; letter-spacing: 4px;
    background: linear-gradient(90deg, #ff2bd6, #7c4dff, #2be9ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 40px rgba(180,80,255,0.5);
    filter: drop-shadow(0 0 12px rgba(190,80,255,0.6));
    animation: titlePulse 2.4s ease-in-out infinite;
    text-align: center;
  }
  @keyframes titlePulse { 0%,100% { filter: drop-shadow(0 0 12px rgba(190,80,255,0.6)); } 50% { filter: drop-shadow(0 0 26px rgba(190,80,255,0.95)); } }

  .subtitle { color: #a297d6; margin-top: 8px; font-size: 15px; letter-spacing: 1px; text-align: center; max-width: 420px; }

  .startScreen, .overScreen {
    position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    padding: 20px; text-align: center;
  }

  .btn {
    padding: 16px 42px; font-size: 20px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(135deg, #b845ff, #4d5bff);
    border: none; border-radius: 50px; color: #fff; cursor: pointer;
    box-shadow: 0 0 20px rgba(150,70,255,0.7), 0 0 50px rgba(80,60,255,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(150,70,255,0.9), 0 0 70px rgba(80,60,255,0.5); }
  .btn:active { transform: scale(0.96); }

  .highscoreLine { color: #ffd35e; font-size: 15px; text-shadow: 0 0 8px rgba(255,200,50,0.6); }

  .shake { animation: shakeAnim 0.4s ease; }
  @keyframes shakeAnim {
    0%,100% { transform: translate(0,0); }
    20% { transform: translate(-10px, 4px); }
    40% { transform: translate(10px, -4px); }
    60% { transform: translate(-8px, -2px); }
    80% { transform: translate(8px, 2px); }
  }

  .footer { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; color: #55488a; font-size: 12px; z-index: 10; pointer-events: none; }

  @media (max-width: 480px) {
    .hudValue { font-size: 20px; }
    .btn { padding: 14px 32px; font-size: 17px; }
    .lives { font-size: 18px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const HS_KEY = 'neonSlash_highScore';
const ORB_COLORS = [
  { core: '#ff5ee0', glow: '#ff5ee0', ring: '#ffb3f2' },
  { core: '#5ef0ff', glow: '#5ef0ff', ring: '#b3f7ff' },
  { core: '#b3ff5e', glow: '#b3ff5e', ring: '#dcffb3' },
  { core: '#ffd15e', glow: '#ffd15e', ring: '#ffe8b3' },
];

function useAudio() {
  const ctxRef = useRef(null);
  const getCtx = () => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  };

  const swish = useCallback(() => {
    try {
      const ctx = getCtx();
      const bufferSize = ctx.sampleRate * 0.15;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(2200, ctx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.15);
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.18, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      noise.start();
      noise.stop(ctx.currentTime + 0.16);
    } catch (e) {}
  }, []);

  const tone = useCallback((freq, duration = 0.2, type = 'sine', gainScale = 0.2) => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(gainScale, ctx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.05);
    } catch (e) {}
  }, []);

  const boom = useCallback(() => {
    try {
      const ctx = getCtx();
      const bufferSize = ctx.sampleRate * 0.6;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1200, ctx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.6);
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.5, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      noise.start();
      noise.stop(ctx.currentTime + 0.62);
      const osc = ctx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(120, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.5);
      const g2 = ctx.createGain();
      g2.gain.setValueAtTime(0.3, ctx.currentTime);
      g2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
      osc.connect(g2);
      g2.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.5);
    } catch (e) {}
  }, []);

  const missSound = useCallback(() => tone(140, 0.25, 'sawtooth', 0.15), [tone]);
  const comboChime = useCallback((n) => tone(440 + n * 60, 0.18, 'triangle', 0.16), [tone]);

  return { swish, boom, missSound, comboChime };
}

function App() {
  const [phase, setPhase] = useState('start'); // start | playing | over
  const [score, setScore] = useState(0);
  const [combo, setCombo] = useState(0);
  const [lives, setLives] = useState(3);
  const [highScore, setHighScore] = useState(() => parseInt(localStorage.getItem(HS_KEY) || '0', 10));
  const [shake, setShake] = useState(false);

  const canvasRef = useRef(null);
  const rafRef = useRef(null);
  const stateRef = useRef({
    orbs: [], particles: [], trail: [], lastSpawn: 0, elapsed: 0,
    lives: 3, score: 0, combo: 0, comboTimer: 0, over: false, w: 0, h: 0, dpr: 1,
  });
  const { swish, boom, missSound, comboChime } = useAudio();
  const isPointerDown = useRef(false);
  const lastPoint = useRef(null);

  const endGame = useCallback(() => {
    const st = stateRef.current;
    if (st.over) return;
    st.over = true;
    setScore(st.score);
    setHighScore(hs => {
      if (st.score > hs) {
        localStorage.setItem(HS_KEY, String(st.score));
        return st.score;
      }
      return hs;
    });
    setShake(true);
    setTimeout(() => setShake(false), 400);
    setTimeout(() => setPhase('over'), 350);
  }, []);

  const resizeCanvas = useCallback(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth, h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    stateRef.current.w = w;
    stateRef.current.h = h;
    stateRef.current.dpr = dpr;
  }, []);

  useEffect(() => {
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    return () => window.removeEventListener('resize', resizeCanvas);
  }, [resizeCanvas]);

  const spawnOrb = useCallback(() => {
    const st = stateRef.current;
    const isBomb = Math.random() < Math.min(0.12 + st.elapsed / 90000, 0.28);
    const x = 60 + Math.random() * (st.w - 120);
    const speedMul = 1 + Math.min(st.elapsed / 40000, 1.1);
    const vy = -(9 + Math.random() * 3.5) * speedMul;
    const vx = (Math.random() - 0.5) * 3.2;
    const radius = isBomb ? 26 : 30 + Math.random() * 10;
    const colorIdx = Math.floor(Math.random() * ORB_COLORS.length);
    st.orbs.push({
      x, y: st.h + radius, vx, vy, radius, isBomb,
      color: ORB_COLORS[colorIdx], sliced: false, rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.08, id: Math.random(),
    });
  }, []);

  const spawnParticles = useCallback((x, y, color, count = 18) => {
    const st = stateRef.current;
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 6;
      st.particles.push({
        x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        life: 1, decay: 0.02 + Math.random() * 0.02, size: 2 + Math.random() * 4, color,
      });
    }
  }, []);

  const sliceOrb = useCallback((orb) => {
    const st = stateRef.current;
    orb.sliced = true;
    if (orb.isBomb) {
      spawnParticles(orb.x, orb.y, '#ff4444', 36);
      boom();
      st.lives = 0;
      setLives(0);
      endGame();
      return;
    }
    st.comboTimer = 45;
    st.combo += 1;
    const gained = 10 + st.combo * 3;
    st.score += gained;
    setScore(st.score);
    setCombo(st.combo);
    spawnParticles(orb.x, orb.y, orb.color.core, 22);
    swish();
    if (st.combo > 1 && st.combo % 3 === 0) comboChime(st.combo);
  }, [boom, comboChime, endGame, spawnParticles, swish]);

  const pointFromEvent = (e) => {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  };

  const handlePointerDown = (e) => {
    if (stateRef.current.over) return;
    isPointerDown.current = true;
    lastPoint.current = pointFromEvent(e);
    stateRef.current.trail.push({ ...lastPoint.current, life: 1 });
  };

  const handlePointerMove = (e) => {
    if (!isPointerDown.current || stateRef.current.over) return;
    const pt = pointFromEvent(e);
    const st = stateRef.current;
    st.trail.push({ ...pt, life: 1 });
    if (st.trail.length > 18) st.trail.shift();
    const prev = lastPoint.current;
    if (prev) {
      for (const orb of st.orbs) {
        if (orb.sliced) continue;
        const d = distToSegment(orb.x, orb.y, prev.x, prev.y, pt.x, pt.y);
        if (d < orb.radius + 6) sliceOrb(orb);
      }
    }
    lastPoint.current = pt;
  };

  const handlePointerUp = () => {
    isPointerDown.current = false;
    lastPoint.current = null;
  };

  function distToSegment(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const lenSq = dx * dx + dy * dy;
    let t = lenSq === 0 ? 0 : ((px - x1) * dx + (py - y1) * dy) / lenSq;
    t = Math.max(0, Math.min(1, t));
    const cx = x1 + t * dx, cy = y1 + t * dy;
    return Math.hypot(px - cx, py - cy);
  }

  const startGame = () => {
    const st = stateRef.current;
    st.orbs = [];
    st.particles = [];
    st.trail = [];
    st.lastSpawn = 0;
    st.elapsed = 0;
    st.lives = 3;
    st.score = 0;
    st.combo = 0;
    st.comboTimer = 0;
    st.over = false;
    setScore(0);
    setCombo(0);
    setLives(3);
    setPhase('playing');
  };

  useEffect(() => {
    if (phase !== 'playing') return;
    let last = performance.now();

    const loop = (now) => {
      const dt = Math.min(now - last, 40);
      last = now;
      const st = stateRef.current;
      const canvas = canvasRef.current;
      if (!canvas || st.over) { rafRef.current = requestAnimationFrame(loop); return; }
      const ctx = canvas.getContext('2d');
      const w = st.w, h = st.h;

      const balanceOrb = st.orbs.find((orb) => !orb.isBomb && !orb.sliced);
      const probe = document.querySelector('[data-testid="balance-orb"]');
      if (probe && balanceOrb) {
        probe.dataset.x = String(balanceOrb.x);
        probe.dataset.y = String(balanceOrb.y);
        probe.dataset.radius = String(balanceOrb.radius);
      }

      st.elapsed += dt;
      st.lastSpawn += dt;
      const spawnInterval = Math.max(420, 950 - st.elapsed / 90);
      if (st.lastSpawn > spawnInterval) {
        st.lastSpawn = 0;
        spawnOrb();
        if (st.elapsed > 15000 && Math.random() < 0.3) spawnOrb();
      }

      if (st.comboTimer > 0) {
        st.comboTimer -= 1;
        if (st.comboTimer <= 0) { st.combo = 0; setCombo(0); }
      }

      ctx.clearRect(0, 0, w, h);

      // background grid glow
      ctx.save();
      ctx.globalAlpha = 0.06;
      ctx.strokeStyle = '#8a5cff';
      ctx.lineWidth = 1;
      const gridSize = 60;
      for (let gx = (st.elapsed / 20) % gridSize; gx < w; gx += gridSize) {
        ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, h); ctx.stroke();
      }
      ctx.restore();

      // update + draw orbs
      for (let i = st.orbs.length - 1; i >= 0; i--) {
        const orb = st.orbs[i];
        orb.vy += 0.24 * (dt / 16.6);
        orb.x += orb.vx * (dt / 16.6);
        orb.y += orb.vy * (dt / 16.6);
        orb.rot += orb.vr;

        if (orb.sliced) { st.orbs.splice(i, 1); continue; }

        if (orb.y - orb.radius > h + 40) {
          st.orbs.splice(i, 1);
          if (!orb.isBomb) {
            st.lives -= 1;
            setLives(st.lives);
            missSound();
            st.combo = 0;
            setCombo(0);
            if (st.lives <= 0) { endGame(); }
          }
          continue;
        }

        ctx.save();
        ctx.translate(orb.x, orb.y);
        ctx.rotate(orb.rot);
        const grad = ctx.createRadialGradient(0, 0, orb.radius * 0.1, 0, 0, orb.radius);
        if (orb.isBomb) {
          grad.addColorStop(0, '#ff8080');
          grad.addColorStop(0.6, '#ff1a1a');
          grad.addColorStop(1, '#4a0000');
          ctx.shadowColor = '#ff2222';
        } else {
          grad.addColorStop(0, '#ffffff');
          grad.addColorStop(0.35, orb.color.core);
          grad.addColorStop(1, orb.color.glow);
          ctx.shadowColor = orb.color.glow;
        }
        ctx.shadowBlur = 25;
        ctx.beginPath();
        ctx.arc(0, 0, orb.radius, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();
        if (orb.isBomb) {
          ctx.shadowBlur = 0;
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-8, -8); ctx.lineTo(8, 8);
          ctx.moveTo(8, -8); ctx.lineTo(-8, 8);
          ctx.stroke();
        } else {
          ctx.shadowBlur = 0;
          ctx.strokeStyle = 'rgba(255,255,255,0.5)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 0, orb.radius * 0.6, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      }

      // particles
      for (let i = st.particles.length - 1; i >= 0; i--) {
        const p = st.particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.18;
        p.life -= p.decay;
        if (p.life <= 0) { st.particles.splice(i, 1); continue; }
        ctx.save();
        ctx.globalAlpha = Math.max(p.life, 0);
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // trail
      if (st.trail.length > 1) {
        for (let i = st.trail.length - 1; i >= 0; i--) {
          st.trail[i].life -= 0.06;
          if (st.trail[i].life <= 0) st.trail.splice(i, 1);
        }
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.shadowColor = '#2be9ff';
        ctx.shadowBlur = 18;
        for (let i = 1; i < st.trail.length; i++) {
          const a = st.trail[i - 1], b = st.trail[i];
          ctx.globalAlpha = Math.max(b.life, 0);
          ctx.strokeStyle = '#8ff5ff';
          ctx.lineWidth = 6 * Math.max(b.life, 0.2);
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
        ctx.restore();
      }

      rafRef.current = requestAnimationFrame(loop);
    };

    rafRef.current = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(rafRef.current);
  }, [phase, spawnOrb, sliceOrb, missSound, endGame]);

  return (
    <div className={`app ${shake ? 'shake' : ''}`} data-testid="game-canvas">
      <div data-testid="balance-orb" aria-label="Current target orb position" style={{ position: 'absolute', width: 1, height: 1, overflow: 'hidden' }}></div>
      <canvas
        ref={canvasRef}
        id="gameCanvas"
        onPointerDown={handlePointerDown}
        onPointerMove={handlePointerMove}
        onPointerUp={handlePointerUp}
        onPointerLeave={handlePointerUp}
        data-testid="slash-canvas"
      />

      {phase === 'playing' && (
        <div className="hud">
          <div className="hudBox">
            <div className="hudLabel">Score</div>
            <div className="hudValue" data-testid="score">{score}</div>
          </div>
          <div className="hudBox">
            <div className="hudLabel">Lives</div>
            <div className="lives" data-testid="lives">{'♥'.repeat(Math.max(lives, 0)) + '♡'.repeat(Math.max(3 - lives, 0))}</div>
          </div>
          <div className="hudBox">
            <div className="hudLabel">Combo</div>
            <div className="hudValue combo">x{combo}</div>
          </div>
        </div>
      )}

      {phase === 'start' && (
        <div className="startScreen">
          <div className="title">NEON SLASH</div>
          <div className="subtitle">Drag your finger or mouse through the glowing orbs to slice them. Avoid the spiked red bombs. Don't let orbs fall past you.</div>
          <div className="highscoreLine" data-testid="high-score">Best: {highScore}</div>
          <button className="btn" data-testid="start-btn" onClick={startGame}>START</button>
        </div>
      )}

      {phase === 'over' && (
        <div className="overScreen">
          <div className="title" style={{ fontSize: 'clamp(26px, 6vw, 40px)' }}>SLICED OUT</div>
          <div className="hudValue" data-testid="final-score">Score: {score}</div>
          <div className="highscoreLine" data-testid="high-score-final">Best: {highScore}</div>
          <button className="btn" data-testid="restart-btn" onClick={startGame}>TRY AGAIN</button>
        </div>
      )}

      <div className="footer">Neon Slash — drag through orbs to slice, avoid bombs</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
