<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Sync Ring</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05030d; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }
  #root { width: 100%; height: 100%; }

  .app {
    width: 100%; height: 100%; position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: center; overflow: hidden; gap: 8px;
    background: radial-gradient(circle at 50% 12%, #16112f 0%, #0a0a18 55%, #030109 100%);
  }

  .hud {
    position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-around;
    padding: 10px 8px; z-index: 15; pointer-events: none; flex-wrap: wrap;
  }
  .hudBox { text-align: center; min-width: 56px; }
  .hudLabel { font-size: 9px; letter-spacing: 2px; color: #5ecfff; text-transform: uppercase; }
  .hudValue {
    font-size: 20px; font-weight: 800; color: #fff;
    text-shadow: 0 0 10px #5ecfff, 0 0 20px #5ecfff;
  }
  .hudValue.combo { color: #ffe45e; text-shadow: 0 0 10px #ffe45e, 0 0 22px #ff9d00; }
  .hudValue.lives { color: #ff5ee0; text-shadow: 0 0 10px #ff5ee0, 0 0 22px #c300a0; }
  .hudValue.hurt { animation: hurtPulse 0.4s ease; }
  @keyframes hurtPulse { 0%,100% { opacity:1; transform: scale(1);} 50% { opacity:0.4; transform: scale(1.25);} }

  .title {
    font-size: clamp(18px, 5.5vw, 30px); font-weight: 900; letter-spacing: 3px;
    background: linear-gradient(90deg, #5ecfff, #c86dff, #ffd35e);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(94,207,255,0.6));
    animation: titlePulse 2.4s ease-in-out infinite;
    text-align: center;
  }
  @keyframes titlePulse { 0%,100% { filter: drop-shadow(0 0 12px rgba(94,207,255,0.6)); } 50% { filter: drop-shadow(0 0 26px rgba(94,207,255,0.95)); } }

  .subtitle { color: #cabde8; font-size: 13px; letter-spacing: 0.5px; text-align: center; max-width: 420px; line-height: 1.5; }

  .btn {
    padding: 15px 40px; font-size: 19px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(135deg, #c86dff, #5ecfff);
    border: none; border-radius: 50px; color: #fff; cursor: pointer;
    box-shadow: 0 0 20px rgba(200,109,255,0.7), 0 0 50px rgba(94,207,255,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(200,109,255,0.9), 0 0 70px rgba(94,207,255,0.5); }
  .btn:active { transform: scale(0.96); }

  .highscoreLine { color: #ffd35e; font-size: 14px; text-shadow: 0 0 8px rgba(255,200,50,0.6); }

  .arenaOuter {
    position: relative; width: min(94vw, 380px); height: min(60vh, 380px); z-index: 5;
    border-radius: 20px; overflow: hidden; border: 2px solid rgba(94,207,255,0.25);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 0 30px rgba(94,207,255,0.15);
    background: #08061a; cursor: pointer;
  }

  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .overlay {
    position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 20px;
    background: rgba(4, 6, 15, 0.88); backdrop-filter: blur(4px);
  }

  .status { color: #beb0e0; font-size: 13px; letter-spacing: 0.5px; height: 16px; z-index: 10; text-align: center; }

  .footer { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; color: #4a5a6a; font-size: 11px; z-index: 10; }

  @media (max-width: 480px) {
    .hudValue { font-size: 15px; }
    .hudLabel { font-size: 8px; }
    .btn { padding: 13px 30px; font-size: 16px; }
    .subtitle { font-size: 12px; }
    .arenaOuter { height: min(52vh, 380px); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const HS_KEY = 'syncRing_highScore';
const LIVES_START = 3;
const TWO_PI = Math.PI * 2;

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// Normalize an angle into [0, TWO_PI)
function norm(a) { a = a % TWO_PI; return a < 0 ? a + TWO_PI : a; }

// Signed shortest distance between two angles, result in (-PI, PI]
function angleDelta(a, b) {
  let d = norm(a - b);
  if (d > Math.PI) d -= TWO_PI;
  return d;
}

function levelConfig(level) {
  return {
    speed: clamp(1.1 + level * 0.18, 1.1, 5.2), // rad/sec
    zoneWidth: clamp(0.85 - level * 0.045, 0.24, 0.85), // radians
    perfectWidth: clamp(0.16 - level * 0.006, 0.055, 0.16),
  };
}

function spawnBurst(arr, x, y, color, count, speedMin, speedMax, sizeMin, sizeMax, lifeMs) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * TWO_PI;
    const spd = speedMin + Math.random() * (speedMax - speedMin);
    arr.push({
      x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      life: lifeMs, maxLife: lifeMs, color,
      size: sizeMin + Math.random() * (sizeMax - sizeMin),
    });
  }
}

function useAudio() {
  const ctxRef = useRef(null);
  const getCtx = () => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  };

  const tone = useCallback((freq, duration, type, gainScale, freqEnd) => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + duration);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(gainScale, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.05);
    } catch (e) {}
  }, []);

  const perfectSound = useCallback(() => { tone(700, 0.09, 'square', 0.13, 1100); setTimeout(() => tone(1100, 0.1, 'square', 0.11, 1500), 55); }, [tone]);
  const goodSound = useCallback(() => tone(520, 0.11, 'square', 0.1, 760), [tone]);
  const missSound = useCallback(() => tone(160, 0.22, 'sawtooth', 0.16, 70), [tone]);
  const levelSound = useCallback(() => { tone(440, 0.14, 'triangle', 0.12, 620); setTimeout(() => tone(660, 0.16, 'triangle', 0.1, 900), 100); }, [tone]);
  const overSound = useCallback(() => { tone(320, 0.25, 'sawtooth', 0.2, 220); setTimeout(() => tone(200, 0.35, 'sawtooth', 0.2, 90), 150); }, [tone]);

  return { perfectSound, goodSound, missSound, levelSound, overSound };
}

function makeGameState() {
  return {
    bounds: { w: 480, h: 480 },
    cx: 240, cy: 240, radius: 180,
    pointerAngle: -Math.PI / 2,
    zoneCenter: Math.random() * TWO_PI,
    level: 1,
    hitsThisLevel: 0,
    particles: [],
    callouts: [],
    shake: 0,
    running: false,
    flashUntil: 0,
    flashColor: '#5ecfff',
    lastResult: null,
  };
}

function pickNewZone(state) {
  // keep zone away from the pointer's current position so it's not a freebie
  let ang;
  do {
    ang = Math.random() * TWO_PI;
  } while (Math.abs(angleDelta(ang, state.pointerAngle)) < 0.6);
  state.zoneCenter = ang;
}

function App() {
  const [phase, setPhase] = useState('start'); // start | playing | over
  const [score, setScore] = useState(0);
  const [lives, setLives] = useState(LIVES_START);
  const [level, setLevel] = useState(1);
  const [combo, setCombo] = useState(0);
  const [hurt, setHurt] = useState(false);
  const [highScore, setHighScore] = useState(() => parseInt(localStorage.getItem(HS_KEY) || '0', 10));
  const [statusMsg, setStatusMsg] = useState('Tap or press SPACE when the arm crosses the glowing zone.');

  const canvasRef = useRef(null);
  const arenaRef = useRef(null);
  const ringLayerRef = useRef(document.createElement('canvas'));
  const gs = useRef(makeGameState());
  const rafRef = useRef(null);
  const lastTsRef = useRef(0);
  const lastDrawTsRef = useRef(0);
  const scoreRef = useRef(0);
  const comboRef = useRef(0);
  const livesRef = useRef(LIVES_START);
  const levelRef = useRef(1);
  const highScoreRef = useRef(highScore);
  const phaseRef = useRef('start');
  const { perfectSound, goodSound, missSound, levelSound, overSound } = useAudio();

  useEffect(() => { phaseRef.current = phase; }, [phase]);

  // The outer ring + target arcs only change when the zone/level changes, not every
  // frame — pre-render them to an offscreen layer so per-frame draw skips the
  // expensive shadowBlur arc strokes (this is what keeps fps stable under load).
  const rebuildRingLayer = (state) => {
    const layer = ringLayerRef.current;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    layer.width = Math.round(state.bounds.w * dpr);
    layer.height = Math.round(state.bounds.h * dpr);
    const ctx = layer.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, state.bounds.w, state.bounds.h);

    const cfg = levelConfig(levelRef.current);
    const { cx, cy, radius } = state;

    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, TWO_PI);
    ctx.strokeStyle = 'rgba(94,207,255,0.18)';
    ctx.lineWidth = 14;
    ctx.stroke();

    const zStart = state.zoneCenter - cfg.zoneWidth / 2;
    const zEnd = state.zoneCenter + cfg.zoneWidth / 2;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, zStart, zEnd);
    ctx.strokeStyle = 'rgba(109,255,176,0.85)';
    ctx.shadowColor = '#6dffb0';
    ctx.shadowBlur = 16;
    ctx.lineWidth = 14;
    ctx.stroke();
    ctx.shadowBlur = 0;

    const pStart = state.zoneCenter - cfg.perfectWidth / 2;
    const pEnd = state.zoneCenter + cfg.perfectWidth / 2;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, pStart, pEnd);
    ctx.strokeStyle = 'rgba(255,211,94,0.95)';
    ctx.shadowColor = '#ffd35e';
    ctx.shadowBlur = 14;
    ctx.lineWidth = 14;
    ctx.stroke();
    ctx.shadowBlur = 0;
  };

  const resizeCanvas = useCallback(() => {
    const canvas = canvasRef.current;
    const arena = arenaRef.current;
    if (!canvas || !arena) return;
    const rect = arena.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const state = gs.current;
    state.bounds = { w: rect.width, h: rect.height };
    state.cx = rect.width / 2;
    state.cy = rect.height / 2;
    state.radius = Math.min(rect.width, rect.height) * 0.38;
    rebuildRingLayer(state);
  }, []);

  useEffect(() => {
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    return () => window.removeEventListener('resize', resizeCanvas);
  }, [resizeCanvas]);

  const addCallout = (state, x, y, text, color) => {
    state.callouts.push({ x, y, text, color, life: 620, maxLife: 620 });
  };

  const endGame = useCallback(() => {
    gs.current.running = false;
    phaseRef.current = 'over';
    setPhase('over');
    overSound();
    setStatusMsg('Sync lost.');
  }, [overSound]);

  const tick = useCallback((ts) => {
    const state = gs.current;
    if (!state.running) return;
    if (!lastTsRef.current) lastTsRef.current = ts;
    let dt = (ts - lastTsRef.current) / 1000;
    dt = Math.min(dt, 0.05);
    lastTsRef.current = ts;

    const cfg = levelConfig(levelRef.current);
    state.pointerAngle = norm(state.pointerAngle + cfg.speed * dt);

    for (let i = state.particles.length - 1; i >= 0; i--) {
      const pt = state.particles[i];
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.vx *= 0.94; pt.vy *= 0.94;
      pt.life -= dt * 1000;
      if (pt.life <= 0) state.particles.splice(i, 1);
    }
    if (state.particles.length > 140) state.particles.splice(0, state.particles.length - 140);
    if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 40);

    for (let i = state.callouts.length - 1; i >= 0; i--) {
      const c = state.callouts[i];
      c.life -= dt * 1000;
      if (c.life <= 0) state.callouts.splice(i, 1);
    }

    // Cap the actual canvas repaint to ~45fps — the dial's motion reads just as smooth,
    // and it roughly halves compositor/paint work per second under load.
    if (ts - lastDrawTsRef.current >= 22) {
      draw(state, ts);
      lastDrawTsRef.current = ts;
    }
    rafRef.current = requestAnimationFrame(tick);
  }, []);

  const draw = (state, ts) => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const { w, h } = state.bounds;

    ctx.save();
    if (state.shake > 0) {
      ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
    }

    ctx.fillStyle = '#08061a';
    ctx.fillRect(-10, -10, w + 20, h + 20);

    const { cx, cy, radius } = state;

    // outer ring + target arcs are pre-rendered (they only change on hit/level-up)
    ctx.drawImage(ringLayerRef.current, 0, 0, w, h);

    // center hub — layered strokes fake a glow without the per-frame shadowBlur cost
    const pulse = 0.75 + Math.sin((ts || 0) / 260) * 0.2;
    const hubR = radius * 0.14 * pulse;
    ctx.beginPath();
    ctx.arc(cx, cy, hubR, 0, TWO_PI);
    ctx.fillStyle = 'rgba(200,109,255,0.9)';
    ctx.fill();

    // sweeping arm
    const ax = cx + Math.cos(state.pointerAngle) * radius;
    const ay = cy + Math.sin(state.pointerAngle) * radius;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(ax, ay);
    ctx.strokeStyle = '#cfeaff';
    ctx.lineWidth = 4;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(ax, ay, 7, 0, TWO_PI);
    ctx.fillStyle = '#fff';
    ctx.fill();

    // flash ring on hit/miss
    if (ts < state.flashUntil) {
      const frac = clamp((state.flashUntil - ts) / 260, 0, 1);
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, TWO_PI);
      ctx.strokeStyle = state.flashColor;
      ctx.globalAlpha = frac * 0.6;
      ctx.lineWidth = 14 + (1 - frac) * 30;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // particles
    for (const pt of state.particles) {
      ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, TWO_PI);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // hit/miss callouts
    if (state.callouts.length) {
      ctx.font = '800 22px system-ui, sans-serif';
      ctx.textAlign = 'center';
      for (const c of state.callouts) {
        const frac = c.life / c.maxLife;
        ctx.globalAlpha = Math.max(0, frac);
        ctx.fillStyle = c.color;
        ctx.fillText(c.text, c.x, c.y - (1 - frac) * 40);
      }
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  };

  const registerHit = useCallback(() => {
    const state = gs.current;
    const cfg = levelConfig(levelRef.current);
    const d = Math.abs(angleDelta(state.pointerAngle, state.zoneCenter));
    const cx = state.cx, cy = state.cy;
    const hitX = cx + Math.cos(state.pointerAngle) * state.radius;
    const hitY = cy + Math.sin(state.pointerAngle) * state.radius;

    if (d <= cfg.perfectWidth / 2) {
      comboRef.current += 1;
      const mult = 1 + Math.min(2, comboRef.current * 0.1);
      const gained = Math.round(150 * mult);
      scoreRef.current += gained;
      setScore(scoreRef.current);
      setCombo(comboRef.current);
      perfectSound();
      addCallout(state, hitX, hitY, 'PERFECT +' + gained, '#ffd35e');
      spawnBurst(state.particles, hitX, hitY, '#ffd35e', 9, 60, 190, 2, 4, 340);
      state.flashUntil = performance.now() + 260;
      state.flashColor = '#ffd35e';
      state.hitsThisLevel += 1;
      pickNewZone(state);
    } else if (d <= cfg.zoneWidth / 2) {
      comboRef.current += 1;
      const mult = 1 + Math.min(2, comboRef.current * 0.1);
      const gained = Math.round(70 * mult);
      scoreRef.current += gained;
      setScore(scoreRef.current);
      setCombo(comboRef.current);
      goodSound();
      addCallout(state, hitX, hitY, 'GOOD +' + gained, '#6dffb0');
      spawnBurst(state.particles, hitX, hitY, '#6dffb0', 6, 40, 140, 2, 4, 300);
      state.flashUntil = performance.now() + 200;
      state.flashColor = '#6dffb0';
      state.hitsThisLevel += 1;
      pickNewZone(state);
    } else {
      comboRef.current = 0;
      setCombo(0);
      livesRef.current -= 1;
      setLives(livesRef.current);
      setHurt(true);
      setTimeout(() => setHurt(false), 400);
      missSound();
      addCallout(state, hitX, hitY, 'MISS', '#ff4d6d');
      spawnBurst(state.particles, hitX, hitY, '#ff4d6d', 8, 50, 170, 2, 4, 340);
      state.shake = 9;
      state.flashUntil = performance.now() + 240;
      state.flashColor = '#ff4d6d';
      pickNewZone(state);
      if (livesRef.current <= 0) {
        if (scoreRef.current > highScoreRef.current) {
          highScoreRef.current = scoreRef.current;
          localStorage.setItem(HS_KEY, String(scoreRef.current));
          setHighScore(scoreRef.current);
        }
        endGame();
        return;
      }
    }

    if (state.hitsThisLevel >= 5) {
      state.hitsThisLevel = 0;
      levelRef.current += 1;
      setLevel(levelRef.current);
      levelSound();
      setStatusMsg(`Level ${levelRef.current} — the arm speeds up.`);
    }

    if (scoreRef.current > highScoreRef.current) {
      highScoreRef.current = scoreRef.current;
      localStorage.setItem(HS_KEY, String(scoreRef.current));
      setHighScore(scoreRef.current);
    }

    rebuildRingLayer(state);
  }, [perfectSound, goodSound, missSound, levelSound, endGame]);

  const startGame = () => {
    resizeCanvas();
    const state = makeGameState();
    state.bounds = gs.current.bounds;
    state.cx = gs.current.cx;
    state.cy = gs.current.cy;
    state.radius = gs.current.radius;
    state.running = true;
    gs.current = state;
    scoreRef.current = 0;
    comboRef.current = 0;
    livesRef.current = LIVES_START;
    levelRef.current = 1;
    lastTsRef.current = 0;
    rebuildRingLayer(state);
    setScore(0);
    setCombo(0);
    setLives(LIVES_START);
    setLevel(1);
    setStatusMsg('Tap or press SPACE when the arm crosses the glowing zone.');
    setPhase('playing');
    phaseRef.current = 'playing';
    cancelAnimationFrame(rafRef.current);
    rafRef.current = requestAnimationFrame(tick);
  };

  useEffect(() => () => cancelAnimationFrame(rafRef.current), []);

  useEffect(() => {
    const onKey = (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        if (phaseRef.current === 'playing') registerHit();
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [registerHit]);

  const handlePointerDown = () => {
    if (phaseRef.current !== 'playing') return;
    registerHit();
  };

  return (
    <div className="app" data-testid="game-canvas">
      <div className="hud">
        <div className="hudBox">
          <div className="hudLabel">Score</div>
          <div className="hudValue" data-testid="score">{score}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Level</div>
          <div className="hudValue" data-testid="level">{level}</div>
        </div>
        <div className="hudBox">
          <div className={`hudValue lives ${hurt ? 'hurt' : ''}`} data-testid="lives">♥{Math.max(0, lives)}</div>
          <div className="hudLabel">Lives</div>
        </div>
        <div className="hudBox">
          <div className="hudValue combo" data-testid="combo">x{combo}</div>
          <div className="hudLabel">Combo</div>
        </div>
      </div>

      <div className="title" style={{ marginTop: 40 }}>SYNC RING</div>

      <div
        className="arenaOuter"
        ref={arenaRef}
        data-testid="play-field"
        onPointerDown={handlePointerDown}
      >
        <canvas ref={canvasRef} data-testid="arena" />

        {phase === 'start' && (
          <div className="overlay">
            <div className="subtitle">A glowing arm sweeps around the ring. Tap, click, or press SPACE the instant it crosses the green zone — hit the gold sliver for a PERFECT bonus. Miss and you lose a life. The arm speeds up and the zone narrows every 5 hits.</div>
            <div className="highscoreLine" data-testid="high-score">Best: {highScore}</div>
            <button className="btn" data-testid="start-btn" onClick={startGame}>START</button>
          </div>
        )}

        {phase === 'over' && (
          <div className="overlay">
            <div className="title" style={{ fontSize: 'clamp(20px, 6vw, 30px)' }}>SYNC LOST</div>
            <div className="hudValue" data-testid="final-score">Score: {score}</div>
            <div className="status">Reached level {level}</div>
            <div className="highscoreLine" data-testid="high-score-final">Best: {highScore}</div>
            <button className="btn" data-testid="restart-btn" onClick={startGame}>PLAY AGAIN</button>
          </div>
        )}
      </div>

      <div className="status">{statusMsg}</div>
      <div className="footer">Sync Ring — time your tap to the pulse</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
