<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Tether Clash</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #05040d; overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
    touch-action: none;
    user-select: none;
  }
  #root { width: 100%; height: 100%; }
  .app {
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center;
    justify-content: flex-start;
    position: relative;
    background: radial-gradient(circle at 50% 4%, #101a2c 0%, #0a0e20 55%, #040308 100%);
    overflow: hidden;
  }
  .bg-grad {
    position: absolute; inset: 0;
    background: linear-gradient(120deg, rgba(79,168,255,0.07), rgba(255,108,196,0.08), rgba(79,255,214,0.06));
    background-size: 400% 400%;
    animation: drift 20s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes drift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .hud {
    position: relative;
    width: 100%;
    max-width: 480px;
    display: flex;
    justify-content: space-around;
    padding: 8px 8px 0;
    z-index: 5;
    gap: 4px;
  }
  .hud-item {
    flex: 1;
    text-align: center;
    color: #e4ecff;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity: 0.85;
  }
  .hud-value {
    font-size: 18px;
    font-weight: 700;
    display: block;
    margin-top: 2px;
  }
  .score-val { color: #4fffd6; text-shadow: 0 0 10px #4fffd6; }
  .combo-val { color: #ff6cc4; text-shadow: 0 0 10px #ff6cc4; }
  .lives-val { color: #ffd84f; text-shadow: 0 0 10px #ffd84f; }
  .level-val { color: #4fa8ff; text-shadow: 0 0 10px #4fa8ff; }
  .field-wrap {
    position: relative;
    flex: 1;
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 2;
    min-height: 0;
    padding: 6px 10px;
    gap: 12px;
  }
  .tether-stage {
    position: relative;
    width: min(92vw, 420px);
    aspect-ratio: 3 / 2;
    max-height: 60%;
    border-radius: 18px;
    border: 1px solid rgba(79,168,255,0.25);
    box-shadow: inset 0 0 40px rgba(79,168,255,0.1), 0 0 30px rgba(142,79,255,0.12);
    overflow: hidden;
    touch-action: none;
    background: rgba(8,10,22,0.6);
  }
  canvas.game-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .banner {
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    color: #ffd84f;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1px;
    text-shadow: 0 0 10px #ffd84f;
    z-index: 6;
    pointer-events: none;
    white-space: nowrap;
  }
  .controls-row {
    position: relative;
    z-index: 5;
    display: flex;
    gap: 12px;
    justify-content: center;
    width: 100%;
    max-width: 380px;
  }
  .ctrl-btn {
    flex: 1;
    min-height: 52px;
    max-width: 180px;
    border-radius: 12px;
    border: 1px solid rgba(79,168,255,0.35);
    background: rgba(12,16,34,0.7);
    color: #e4ecff;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 1px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .ctrl-btn:active { transform: scale(0.95); }
  .left-btn {
    background: linear-gradient(135deg, rgba(79,168,255,0.28), rgba(79,168,255,0.1));
    border-color: rgba(79,168,255,0.55);
    color: #bfe0ff;
  }
  .right-btn {
    background: linear-gradient(135deg, rgba(255,108,196,0.28), rgba(255,108,196,0.1));
    border-color: rgba(255,108,196,0.55);
    color: #ffd3ee;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(5,4,12,0.94);
    border-radius: 18px;
    z-index: 10;
    text-align: center;
    padding: 14px 18px;
    overflow-y: auto;
  }
  .title {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #fff;
    text-shadow: 0 0 20px #4fa8ff, 0 0 40px #ff6cc4;
    margin: 0;
  }
  .subtitle {
    color: #c7d6ff;
    font-size: 12px;
    max-width: 300px;
    line-height: 1.5;
    margin: 0;
  }
  button.start-btn {
    background: linear-gradient(135deg, #4fa8ff, #ff6cc4);
    border: none;
    color: #05040c;
    font-weight: 800;
    font-size: 17px;
    letter-spacing: 1px;
    padding: 14px 34px;
    border-radius: 999px;
    cursor: pointer;
    min-height: 48px;
    min-width: 130px;
    box-shadow: 0 0 25px rgba(79,168,255,0.6), 0 0 45px rgba(255,108,196,0.4);
    transition: transform 0.12s ease;
  }
  button.start-btn:active { transform: scale(0.94); }
  .finalscore { color: #fff; font-size: 15px; }
  .finalscore b { color: #4fffd6; font-size: 20px; }
  .highscore-line { color: #ffd84f; font-size: 13px; }
  .hint {
    position: relative;
    z-index: 5;
    color: #b7c8e8;
    font-size: 10px;
    text-align: center;
    padding: 2px 10px 10px;
    opacity: 0.75;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useRef, useEffect, useState, useCallback, useMemo } = React;

const HIGH_SCORE_KEY = 'tetherClashHighScore';
const START_LIVES = 3;
const POS_START = 50;
const POS_MIN = 0;
const POS_MAX = 100;
const HEAVE_BASE = 6;
const HEAVE_COMBO_STEP = 0.6;
const SLIP_FACTOR = 0.35;

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function rivalPullForLevel(level) { return clamp(9 + level * 2.4, 9, 46); }

function useAudio() {
  const ctxRef = useRef(null);
  const getCtx = useCallback(() => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  }, []);

  const beep = useCallback((freq, dur, type, vol, slideTo) => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      const now = ctx.currentTime;
      if (slideTo != null) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), now + dur);
      gain.gain.value = vol == null ? 0.08 : vol;
      osc.connect(gain);
      gain.connect(ctx.destination);
      gain.gain.setValueAtTime(gain.gain.value, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
      osc.start(now);
      osc.stop(now + dur);
    } catch (e) { /* audio unavailable */ }
  }, [getCtx]);

  return useMemo(() => ({
    pull: () => beep(480 + Math.random() * 80, 0.07, 'triangle', 0.09, 760),
    slip: () => beep(220, 0.1, 'sawtooth', 0.06, 140),
    win: () => {
      beep(500, 0.1, 'triangle', 0.09);
      setTimeout(() => beep(680, 0.14, 'triangle', 0.09), 90);
      setTimeout(() => beep(860, 0.18, 'triangle', 0.09), 180);
    },
    lose: () => beep(160, 0.3, 'sawtooth', 0.12, 50),
    gameover: () => beep(90, 0.55, 'sawtooth', 0.12, 40),
  }), [beep]);
}

function buildInitialGame() {
  return {
    dims: { w: 320, h: 140 },
    pos: POS_START,
    lastSide: null,
    resolvedBout: false,
    particles: [],
    flashColor: null, flashUntil: 0,
    bannerClearAt: 0,
    ropeY: 60,
    knotX: 160,
  };
}

function App() {
  const wrapRef = useRef(null);
  const canvasRef = useRef(null);

  const initialHigh = (() => {
    const v = parseInt(localStorage.getItem(HIGH_SCORE_KEY) || '0', 10);
    return isNaN(v) ? 0 : v;
  })();

  const [ui, setUi] = useState({
    phase: 'idle', score: 0, combo: 0, lives: START_LIVES, level: 1,
    highScore: initialHigh, banner: '',
  });
  const uiRef = useRef(ui);
  useEffect(() => { uiRef.current = ui; }, [ui]);

  const audio = useAudio();
  const gameRef = useRef(buildInitialGame());

  const spawnParticles = useCallback((cx, cy, color, count, spread) => {
    const parts = gameRef.current.particles;
    if (parts.length > 160) return;
    for (let i = 0; i < (count || 10); i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = (spread || 50) + Math.random() * (spread || 50);
      parts.push({
        x: cx, y: cy, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
        life: 320 + Math.random() * 240, maxLife: 560, color, size: 2 + Math.random() * 3,
      });
    }
  }, []);

  const showBanner = useCallback((text) => {
    const g = gameRef.current;
    g.bannerClearAt = performance.now() + 900;
    setUi(prev => ({ ...prev, banner: text }));
  }, []);

  const startBout = useCallback(() => {
    const g = gameRef.current;
    g.pos = POS_START;
    g.lastSide = null;
    g.resolvedBout = false;
  }, []);

  const endGame = useCallback(() => {
    const cur = uiRef.current;
    const newHigh = Math.max(cur.score, cur.highScore);
    localStorage.setItem(HIGH_SCORE_KEY, String(newHigh));
    audio.gameover();
    setUi(prev => ({ ...prev, phase: 'over', highScore: newHigh }));
  }, [audio]);

  const loseLife = useCallback(() => {
    const g = gameRef.current;
    audio.lose();
    g.flashColor = '#ff4f6f';
    g.flashUntil = performance.now() + 240;
    showBanner('SNAPPED!');
    setUi(prev => {
      const lives = prev.lives - 1;
      if (lives <= 0) {
        setTimeout(() => endGame(), 0);
        return { ...prev, lives: 0, combo: 0 };
      }
      setTimeout(() => startBout(), 0);
      return { ...prev, lives, combo: 0 };
    });
  }, [audio, showBanner, endGame, startBout]);

  const winRound = useCallback(() => {
    audio.win();
    showBanner('ROUND WON!');
    setUi(prev => {
      const level = prev.level + 1;
      const bonus = Math.round(70 + prev.combo * 6);
      setTimeout(() => startBout(), 0);
      return { ...prev, level, score: prev.score + bonus };
    });
  }, [audio, showBanner, startBout]);

  const resolveBout = useCallback(() => {
    const g = gameRef.current;
    if (g.resolvedBout) return;
    if (g.pos <= POS_MIN) {
      g.resolvedBout = true;
      setTimeout(() => winRound(), 0);
    } else if (g.pos >= POS_MAX) {
      g.resolvedBout = true;
      setTimeout(() => loseLife(), 0);
    }
  }, [winRound, loseLife]);

  const handlePull = useCallback((side) => {
    const cur = uiRef.current;
    if (cur.phase !== 'playing') return;
    const g = gameRef.current;
    if (g.resolvedBout) return;
    const alternate = g.lastSide === null || g.lastSide !== side;
    const nextCombo = alternate ? cur.combo + 1 : 0;
    const heave = alternate
      ? HEAVE_BASE + Math.min(nextCombo, 10) * HEAVE_COMBO_STEP
      : HEAVE_BASE * SLIP_FACTOR;
    g.pos = clamp(g.pos - heave, POS_MIN, POS_MAX);
    g.lastSide = side;
    const w = g.dims.w || 320;
    const margin = 28;
    const knotX = margin + (w - margin * 2) * (g.pos / 100);
    spawnParticles(
      knotX, (g.dims.h || 140) / 2,
      alternate ? '#4fffd6' : '#ff9d4f',
      alternate ? 14 : 5, alternate ? 80 : 30
    );
    (alternate ? audio.pull : audio.slip)();
    const gained = Math.round(8 * (1 + nextCombo * 0.12));
    setUi(prev => ({ ...prev, combo: nextCombo, score: prev.score + gained }));
    resolveBout();
  }, [audio, spawnParticles, resolveBout]);

  const startGame = useCallback(() => {
    const g = gameRef.current;
    g.pos = POS_START;
    g.lastSide = null;
    g.resolvedBout = false;
    g.particles = [];
    const dims = wrapRef.current ? wrapRef.current.getBoundingClientRect() : { width: 320, height: 140 };
    g.dims = { w: dims.width, h: dims.height };
    setUi(prev => ({
      ...prev, phase: 'playing', score: 0, combo: 0, lives: START_LIVES, level: 1, banner: '',
    }));
  }, []);

  const press = useCallback(() => {
    const cur = uiRef.current;
    if (cur.phase === 'idle' || cur.phase === 'over') startGame();
  }, [startGame]);

  useEffect(() => {
    function onKeyDown(e) {
      const cur = uiRef.current;
      if (cur.phase === 'idle' || cur.phase === 'over') {
        if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); startGame(); }
        return;
      }
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); handlePull('L'); }
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); handlePull('R'); }
    }
    window.addEventListener('keydown', onKeyDown);
    return () => window.removeEventListener('keydown', onKeyDown);
  }, [startGame, handlePull]);

  useEffect(() => {
    function updateDims() {
      if (wrapRef.current) {
        const r = wrapRef.current.getBoundingClientRect();
        gameRef.current.dims = { w: r.width, h: r.height };
      }
    }
    updateDims();
    window.addEventListener('resize', updateDims);
    return () => window.removeEventListener('resize', updateDims);
  }, []);

  useEffect(() => {
    let raf;
    let last = performance.now();
    const loop = (t) => {
      const dt = Math.min(0.033, (t - last) / 1000);
      last = t;
      const cur = uiRef.current;
      const g = gameRef.current;
      const w = g.dims.w, h = g.dims.h;
      const now = performance.now();

      if (cur.phase === 'playing' && w > 0 && h > 0) {
        if (!g.resolvedBout) {
          g.pos = clamp(g.pos + rivalPullForLevel(cur.level) * dt, POS_MIN, POS_MAX);
          resolveBout();
        }
        if (g.bannerClearAt && now > g.bannerClearAt) {
          g.bannerClearAt = 0;
          setUi(prev => (prev.banner ? { ...prev, banner: '' } : prev));
        }
      }

      const parts = g.particles;
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.life -= dt * 1000;
        if (p.life <= 0) { parts.splice(i, 1); continue; }
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.vx *= 0.94; p.vy *= 0.94;
      }

      const canvas = canvasRef.current;
      if (canvas && w > 0 && h > 0) {
        const cw = Math.max(1, Math.round(w));
        const ch = Math.max(1, Math.round(h));
        if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, w, h);

        const marginPx = 28;
        const trackW = Math.max(1, w - marginPx * 2);
        const ropeY = h / 2;
        g.ropeY = ropeY;

        const dangerFrac = clamp((g.pos - 65) / 35, 0, 1);
        const winFrac = clamp((35 - g.pos) / 35, 0, 1);
        ctx.fillStyle = 'rgba(255,79,111,' + (0.06 + 0.26 * dangerFrac) + ')';
        ctx.fillRect(w - marginPx - 10, 0, marginPx + 10, h);
        ctx.fillStyle = 'rgba(79,255,214,' + (0.06 + 0.26 * winFrac) + ')';
        ctx.fillRect(0, 0, marginPx + 10, h);

        ctx.strokeStyle = 'rgba(200,210,255,0.55)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(marginPx, ropeY);
        ctx.lineTo(w - marginPx, ropeY);
        ctx.stroke();

        ctx.beginPath(); ctx.arc(marginPx, ropeY, 17, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(79,168,255,0.22)'; ctx.fill();
        ctx.beginPath(); ctx.arc(marginPx, ropeY, 11, 0, Math.PI * 2);
        ctx.fillStyle = '#4fa8ff'; ctx.fill();

        ctx.beginPath(); ctx.arc(w - marginPx, ropeY, 17, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,108,196,0.22)'; ctx.fill();
        ctx.beginPath(); ctx.arc(w - marginPx, ropeY, 11, 0, Math.PI * 2);
        ctx.fillStyle = '#ff6cc4'; ctx.fill();

        const knotX = marginPx + trackW * (clamp(g.pos, 0, 100) / 100);
        g.knotX = knotX;
        const pulse = 0.5 + 0.5 * Math.sin(now / 150);
        if (cur.phase === 'playing') {
          ctx.beginPath(); ctx.arc(knotX, ropeY, 15 + pulse * 3, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,216,79,0.2)'; ctx.fill();
        }
        ctx.beginPath(); ctx.arc(knotX, ropeY, 9 + pulse * 2, 0, Math.PI * 2);
        ctx.fillStyle = cur.phase === 'playing' ? '#ffd84f' : '#8892b8';
        ctx.fill();
        ctx.beginPath(); ctx.arc(knotX, ropeY, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#fff'; ctx.fill();

        if (cur.phase === 'playing') {
          const frac = clamp(g.pos / 100, 0, 1);
          const barColor = frac < 0.35 ? '#4fffd6' : frac < 0.65 ? '#ffd84f' : '#ff4f6f';
          ctx.fillStyle = 'rgba(255,255,255,0.08)';
          ctx.fillRect(10, 8, w - 20, 6);
          ctx.fillStyle = barColor;
          ctx.fillRect(10, 8, (w - 20) * frac, 6);
        }

        for (let i = parts.length - 1; i >= 0; i--) {
          const p = parts[i];
          const alpha = Math.max(0, p.life / p.maxLife);
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        if (g.flashColor && now < g.flashUntil) {
          ctx.fillStyle = g.flashColor;
          ctx.globalAlpha = 0.16;
          ctx.fillRect(0, 0, w, h);
          ctx.globalAlpha = 1;
        } else if (g.flashColor && now >= g.flashUntil) {
          g.flashColor = null;
        }
      }

      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, [resolveBout, spawnParticles]);

  return (
    <div className="app">
      <div className="bg-grad"></div>
      <div className="hud">
        <div className="hud-item">Score<span className="hud-value score-val" data-testid="score">{ui.score}</span></div>
        <div className="hud-item">Combo<span className="hud-value combo-val" data-testid="combo">{ui.combo}</span></div>
        <div className="hud-item">Lives<span className="hud-value lives-val" data-testid="lives">{ui.lives}</span></div>
        <div className="hud-item">Level<span className="hud-value level-val" data-testid="level">{ui.level}</span></div>
      </div>

      <div className="field-wrap" data-testid="play-field">
        <div className="tether-stage" ref={wrapRef} data-testid="arena-stage">
          <canvas className="game-canvas" ref={canvasRef} data-testid="canvas"></canvas>
          <div className="banner" data-testid="banner">{ui.banner || ' '}</div>

          {ui.phase !== 'playing' && (
            <div className="overlay">
              {ui.phase === 'idle' && (
                <React.Fragment>
                  <h1 className="title">TETHER CLASH</h1>
                  <p className="subtitle">Alternate hands to haul the rival into the pit before they haul you. Press Left/Right Arrows (or A/D) alternately, or tap the grips — pulling the same hand twice slips and barely moves the rope, so keep the rhythm alternating to build heave. Win rounds to face a stronger, faster rival. Lose three and the rope snaps.</p>
                  <button className="start-btn" data-testid="start-btn" onClick={press}>START</button>
                  <p className="highscore-line">High Score: {ui.highScore}</p>
                </React.Fragment>
              )}
              {ui.phase === 'over' && (
                <React.Fragment>
                  <h1 className="title">ROPE SNAPPED</h1>
                  <p className="finalscore">Score: <b>{ui.score}</b></p>
                  <p className="highscore-line">High Score: {ui.highScore}</p>
                  <button className="start-btn" data-testid="start-btn" onClick={press}>REMATCH</button>
                </React.Fragment>
              )}
            </div>
          )}
        </div>

        <div className="controls-row">
          <button
            className="ctrl-btn left-btn"
            data-testid="left-btn"
            onPointerDown={(e) => { e.preventDefault(); handlePull('L'); }}
          >◄ PULL</button>
          <button
            className="ctrl-btn right-btn"
            data-testid="right-btn"
            onPointerDown={(e) => { e.preventDefault(); handlePull('R'); }}
          >PULL ►</button>
        </div>
      </div>

      <div className="hint">Alternate Left/Right arrows (or A/D), or tap the grips, to out-pull the rival.</div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
