<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Parcel Rail</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: #05040d; overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif; color: #e8f6ff;
    touch-action: none; user-select: none;
  }
  #root { height: 100%; }
  .app {
    --fw: min(calc(100vw - 32px), calc((100vh - 190px) * 0.6667));
    height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; position: relative; overflow: hidden;
    background: radial-gradient(circle at 50% 0%, #15193d 0%, #0a0a1f 55%, #040308 100%);
  }
  .drift {
    position: absolute; inset: 0; pointer-events: none; opacity: .6;
    background: linear-gradient(120deg, rgba(56,248,255,.08), rgba(255,95,210,.09), rgba(157,255,74,.06));
    background-size: 400% 400%; animation: drift 18s ease-in-out infinite;
  }
  @keyframes drift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .hud, .sub, .field, .hint { width: var(--fw); position: relative; }
  .hud { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
  .cell { background: rgba(10,12,30,.7); border: 1px solid rgba(56,248,255,.2); border-radius: 10px; padding: 6px 4px; }
  .cell span { display: block; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: #7f8fb0; }
  .cell b { font-size: 18px; color: #e8f6ff; text-shadow: 0 0 8px rgba(56,248,255,.6); }
  .sub { display: flex; align-items: center; gap: 10px; }
  .parcel {
    padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: 1.5px;
    color: #05040d; background: var(--c); box-shadow: 0 0 14px var(--c); white-space: nowrap;
  }
  .ink-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
  .ink {
    height: 100%; background: linear-gradient(90deg, #38f8ff, #ff5fd2);
    transform-origin: left center; transform: scaleX(1);
  }
  .lvl { font-size: 12px; font-weight: 800; letter-spacing: 1px; color: #ffc23d; text-shadow: 0 0 8px rgba(255,194,61,.6); }
  .field {
    aspect-ratio: 2 / 3; border-radius: 16px; overflow: hidden;
    border: 1px solid rgba(56,248,255,.3);
    box-shadow: 0 0 30px rgba(56,248,255,.15), inset 0 0 40px rgba(255,95,210,.08);
    background-color: #0a0c20;
    background-image:
      linear-gradient(rgba(56,248,255,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(56,248,255,.07) 1px, transparent 1px);
    background-size: 10% 6.6667%;
    touch-action: none; cursor: crosshair;
  }
  .field canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stop-hit {
    position: absolute; width: 15%; aspect-ratio: 1 / 1; transform: translate(-50%, -50%);
    border-radius: 50%; cursor: pointer; touch-action: none;
  }
  .nib {
    position: absolute; width: 24px; height: 24px; transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .hint { font-size: 12px; color: #7f8fb0; text-align: center; margin: 0; }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 20px; text-align: center;
    background: rgba(5,4,13,.74); backdrop-filter: blur(3px);
  }
  .title {
    font-size: 36px; font-weight: 900; letter-spacing: 3px;
    background: linear-gradient(90deg, #38f8ff, #ff5fd2, #ffc23d);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(56,248,255,.5));
  }
  .overlay p { margin: 0; max-width: 300px; line-height: 1.45; font-size: 15px; color: #cfe9ff; }
  .over-reason { font-size: 20px !important; font-weight: 800; color: #ff5fd2 !important; }
  .stat { font-size: 16px; color: #cfe9ff; }
  .stat b { color: #ffc23d; }
  .start-btn {
    min-height: 48px; min-width: 180px; padding: 12px 28px; border: none; border-radius: 999px;
    font-size: 18px; font-weight: 800; color: #05040d; cursor: pointer; touch-action: manipulation;
    background: linear-gradient(90deg, #38f8ff, #7df9ff); box-shadow: 0 0 22px rgba(56,248,255,.6);
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useRef, useEffect, useState } = React;

// Logical field is 400x600; CSS scales it. All game maths uses these units.
const FW = 400, FH = 600;
const START = { x: 200, y: 540 };
const COLORS = { cyan: '#38f8ff', magenta: '#ff5fd2', lime: '#9dff4a', amber: '#ffc23d' };
const KEYS = Object.keys(COLORS);
const BEST_KEY = 'arcade.2026-11-15.best';
const LIVES = 3;
const HIT_R = 26;        // cart-to-stop distance that counts as a visit
const STALL_LIMIT = 1.5; // seconds with nothing ahead of the cart before it derails
const HEAD_GRAB = 70;    // how close a press must be to the nib to start drawing
const RED = '#ff3d6e';

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const clamp01 = v => Math.max(0, Math.min(1, v));
const inkCap = lv => Math.max(560, 760 - (lv - 1) * 40);   // rail ahead of the cart, logical px
const speedAt = lv => Math.min(180, 90 + (lv - 1) * 12);
const stopsAt = lv => Math.min(6, 2 + lv);

function readBest() {
  try { return parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; } catch (e) { return 0; }
}
function writeBest(v) {
  try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) {}
}
function segDist(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const t = clamp01(((p.x - a.x) * dx + (p.y - a.y) * dy) / ((dx * dx + dy * dy) || 1));
  return dist(p, { x: a.x + dx * t, y: a.y + dy * t });
}
// Random spot clear of the start, other stops and the current rail.
function freeSpot(S, others) {
  let p;
  for (let i = 0; i < 80; i++) {
    p = { x: 48 + Math.random() * (FW - 96), y: 80 + Math.random() * (FH - 170) };
    if (dist(p, START) < 130 || others.some(o => dist(p, o) < 110)) continue;
    let near = false;
    for (let j = 0; j + 1 < S.pts.length && !near; j++) near = segDist(p, S.pts[j], S.pts[j + 1]) < 60;
    if (!near) break;
  }
  return p;
}
function spriteFor(hex) {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, hex);
  g.addColorStop(0.35, hex + '66');
  g.addColorStop(1, hex + '00');
  x.fillStyle = g;
  x.fillRect(0, 0, 64, 64);
  return c;
}

function ParcelRail() {
  const [ui, setUi] = useState({ phase: 'menu', score: 0, combo: 0, lives: LIVES, level: 1, parcel: 'cyan', best: readBest(), reason: '', stops: [] });
  const G = useRef(null);
  if (!G.current) {
    G.current = {
      phase: 'menu', best: readBest(), score: 0, combo: 0, lives: LIVES, level: 1, delivered: 0,
      parcel: 'cyan', reason: '', nextId: 1, stops: [],
      pts: [START, { x: 200, y: 260 }], cum: [0, 280], cartS: 0, cart: START, stall: 0, drawing: false,
      parts: [], pops: [], shake: 0, banner: null, inkFlash: 0, sprites: {},
    };
    window.__game = { phase: 'menu', score: 0 };
  }
  const S = G.current;
  const fieldRef = useRef(null), canvasRef = useRef(null), nibRef = useRef(null), inkRef = useRef(null);

  const head = () => S.pts[S.pts.length - 1];
  const total = () => S.cum[S.cum.length - 1];
  const inkAhead = () => total() - S.cartS;

  const addPoint = p => {
    const seg = dist(head(), p);
    if (seg < 0.5) return true;
    if (inkAhead() + seg > inkCap(S.level)) { S.inkFlash = 0.35; return false; }
    S.cum.push(total() + seg);
    S.pts.push(p);
    return true;
  };
  // Drop rail the cart has already passed so the array stays short.
  const trim = () => {
    while (S.pts.length > 2 && S.cum[1] <= S.cartS) {
      const d = S.cum[1];
      S.pts.shift();
      S.cum = S.cum.slice(1).map(c => c - d);
      S.cartS -= d;
    }
  };
  const cartAt = () => {
    const a = S.pts[0], b = S.pts[1];
    const len = (S.cum[1] - S.cum[0]) || 1;
    const t = clamp01((S.cartS - S.cum[0]) / len);
    return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, ang: Math.atan2(b.y - a.y, b.x - a.x) };
  };
  const sprite = hex => S.sprites[hex] || (S.sprites[hex] = spriteFor(hex));

  const burst = (x, y, color, n) => {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 180, life = 0.6 + Math.random() * 0.4;
      S.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life, max: life, c: color, r: 1.5 + Math.random() * 2.5 });
    }
  };
  const pop = (text, x, y, color) => S.pops.push({ text, x, y, c: color, life: 1 });

  const sync = () => {
    window.__game = { phase: S.phase, score: S.score };
    setUi({
      phase: S.phase, score: S.score, combo: S.combo, lives: S.lives, level: S.level, parcel: S.parcel,
      best: S.best, reason: S.reason, stops: S.stops.map(s => ({ id: s.id, x: s.x, y: s.y, color: s.color })),
    });
  };
  const endRun = reason => {
    S.phase = 'over';
    S.reason = reason;
    S.drawing = false;
    if (S.score > S.best) S.best = S.score;
    writeBest(S.best);
    sync();
  };
  const levelUp = () => {
    S.level += 1;
    if (S.stops.length < stopsAt(S.level)) {
      const p = freeSpot(S, S.stops);
      S.stops.push({ id: S.nextId++, x: p.x, y: p.y, color: KEYS[Math.floor(Math.random() * KEYS.length)], cool: 0, flash: 0 });
    }
    S.banner = { text: `LEVEL ${S.level}`, t: 1.6 };
  };
  const deliver = st => {
    S.combo += 1;
    const pts = 10 * Math.min(S.combo, 10);
    S.score += pts;
    S.delivered += 1;
    burst(st.x, st.y, COLORS[st.color], 22);
    pop(`+${pts}${S.combo > 1 ? ' x' + S.combo : ''}`, st.x, st.y - 24, COLORS[st.color]);
    const colors = [...new Set(S.stops.map(s => s.color))];
    const pool = colors.filter(c => c !== S.parcel);
    const choices = pool.length ? pool : colors;
    S.parcel = choices[Math.floor(Math.random() * choices.length)];
    const p = freeSpot(S, S.stops.filter(s => s !== st));
    st.x = p.x;
    st.y = p.y;
    if (S.delivered % 6 === 0) levelUp();
    S.shake = 0.12;
    sync();
  };
  const wrong = st => {
    S.lives -= 1;
    S.combo = 0;
    st.flash = 0.5;
    S.shake = 0.3;
    burst(st.x, st.y, RED, 16);
    pop('MISS', st.x, st.y - 24, RED);
    if (S.lives <= 0) endRun('lives'); else sync();
  };

  const step = dt => {
    if (S.phase !== 'playing') return;
    const tot = total();
    if (S.cartS < tot) S.cartS = Math.min(tot, S.cartS + speedAt(S.level) * dt);
    trim();
    S.stall = S.cartS >= total() - 0.5 ? S.stall + dt : 0;
    if (S.stall > STALL_LIMIT) return endRun('derail');
    const c = cartAt();
    S.cart = c;
    for (const st of S.stops) {
      st.cool = Math.max(0, st.cool - dt);
      st.flash = Math.max(0, st.flash - dt);
      if (st.cool === 0 && dist(c, st) <= HIT_R) {
        st.cool = 1.2;
        if (st.color === S.parcel) deliver(st); else wrong(st);
        if (S.phase !== 'playing') return;
      }
    }
  };
  const decay = dt => {
    for (const p of S.parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; }
    S.parts = S.parts.filter(p => p.life > 0);
    for (const q of S.pops) { q.life -= dt; q.y -= 36 * dt; }
    S.pops = S.pops.filter(q => q.life > 0);
    if (S.banner) { S.banner.t -= dt; if (S.banner.t <= 0) S.banner = null; }
    S.shake = Math.max(0, S.shake - dt);
    S.inkFlash = Math.max(0, S.inkFlash - dt);
  };
  const draw = now => {
    const cv = canvasRef.current;
    if (!cv) return;
    const ctx = cv.getContext('2d');
    ctx.clearRect(0, 0, FW, FH);
    ctx.save();
    if (S.shake > 0) ctx.translate((Math.random() - 0.5) * S.shake * 40, (Math.random() - 0.5) * S.shake * 40);

    // rail
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(S.pts[0].x, S.pts[0].y);
    for (let i = 1; i < S.pts.length; i++) ctx.lineTo(S.pts[i].x, S.pts[i].y);
    ctx.strokeStyle = 'rgba(56,248,255,0.22)';
    ctx.lineWidth = 16;
    ctx.stroke();
    ctx.strokeStyle = '#7ff9ff';
    ctx.lineWidth = 4;
    ctx.stroke();

    // stops: matching colour pulses so the target is readable at a glance
    const pulse = 1 + Math.sin(now / 180) * 0.12;
    ctx.globalCompositeOperation = 'lighter';
    for (const st of S.stops) ctx.drawImage(sprite(COLORS[st.color]), st.x - 34, st.y - 34, 68, 68);
    ctx.globalCompositeOperation = 'source-over';
    for (const st of S.stops) {
      const col = COLORS[st.color];
      ctx.beginPath();
      ctx.arc(st.x, st.y, 15, 0, Math.PI * 2);
      ctx.strokeStyle = st.flash > 0 ? RED : col;
      ctx.lineWidth = 3.5;
      ctx.stroke();
      if (S.parcel === st.color) {
        ctx.beginPath();
        ctx.arc(st.x, st.y, 22 * pulse, 0, Math.PI * 2);
        ctx.strokeStyle = col;
        ctx.globalAlpha = 0.5;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.beginPath();
      ctx.arc(st.x, st.y, 4.5, 0, Math.PI * 2);
      ctx.fillStyle = col;
      ctx.fill();
    }

    if (S.phase === 'playing') {
      const c = S.cart, col = COLORS[S.parcel];
      ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(sprite(col), c.x - 26, c.y - 26, 52, 52);
      ctx.globalCompositeOperation = 'source-over';
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate(c.ang);
      ctx.fillStyle = col;
      ctx.fillRect(-8, -6, 16, 12);
      ctx.fillStyle = '#05040d';
      ctx.fillRect(-2, -2, 4, 4);
      ctx.restore();
      const h = head();
      ctx.beginPath();
      ctx.arc(h.x, h.y, 5 + Math.sin(now / 120) * 1.2, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
    }

    // particles and popups
    ctx.globalCompositeOperation = 'lighter';
    for (const p of S.parts) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.c;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.font = '800 16px "Segoe UI", Arial, sans-serif';
    ctx.textAlign = 'center';
    for (const q of S.pops) {
      ctx.globalAlpha = Math.min(1, q.life * 1.5);
      ctx.fillStyle = q.c;
      ctx.fillText(q.text, q.x, q.y);
    }
    ctx.globalAlpha = 1;
    if (S.banner) {
      ctx.globalAlpha = Math.min(1, S.banner.t * 2);
      ctx.font = '900 40px "Segoe UI", Arial, sans-serif';
      ctx.fillStyle = '#ffc23d';
      ctx.shadowColor = '#ffc23d';
      ctx.shadowBlur = 16;
      ctx.fillText(S.banner.text, FW / 2, FH / 2);
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  };
  const updateDom = () => {
    if (S.phase !== 'playing') return;
    const h = head();
    const nib = nibRef.current;
    if (nib) { nib.style.left = `${h.x / FW * 100}%`; nib.style.top = `${h.y / FH * 100}%`; }
    const ink = inkRef.current;
    if (ink) {
      ink.style.transform = `scaleX(${clamp01(1 - inkAhead() / inkCap(S.level))})`;
      ink.style.background = S.inkFlash > 0 ? RED : '';
    }
  };

  useEffect(() => {
    const cv = canvasRef.current;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = FW * dpr;
    cv.height = FH * dpr;
    cv.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
    let raf, last = performance.now();
    const tick = now => {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      step(dt);
      decay(dt);
      draw(now);
      updateDom();
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, []);

  const start = () => {
    S.pts = [START, { x: 200, y: 260 }];
    S.cum = [0, 280];
    S.cartS = 0;
    S.cart = START;
    S.stall = 0;
    S.drawing = false;
    S.score = 0; S.combo = 0; S.lives = LIVES; S.level = 1; S.delivered = 0; S.reason = '';
    S.parts = []; S.pops = []; S.shake = 0; S.inkFlash = 0;
    S.stops = [];
    for (let i = 0; i < stopsAt(1); i++) {
      const p = freeSpot(S, S.stops);
      S.stops.push({ id: S.nextId++, x: p.x, y: p.y, color: KEYS[Math.floor(Math.random() * KEYS.length)], cool: 0, flash: 0 });
    }
    S.parcel = S.stops[Math.floor(Math.random() * S.stops.length)].color;
    S.banner = { text: 'DELIVER', t: 1.4 };
    S.phase = 'playing';
    sync();
  };

  const pointFrom = e => {
    const r = fieldRef.current.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * FW, y: (e.clientY - r.top) / r.height * FH };
  };
  const onDown = e => {
    if (S.phase !== 'playing') return;
    const p = pointFrom(e);
    if (dist(p, head()) > HEAD_GRAB) return;
    S.drawing = true;
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
    addPoint(p);
  };
  const onMove = e => {
    if (!S.drawing || S.phase !== 'playing') return;
    const p = pointFrom(e);
    if (dist(p, head()) >= 5) addPoint(p);
  };
  const onUp = () => { S.drawing = false; };
  // Tapping a stop lays a straight rail from the nib to it.
  const onStop = (e, id) => {
    e.stopPropagation();
    if (S.phase !== 'playing') return;
    const st = S.stops.find(s => s.id === id);
    if (st) addPoint({ x: st.x, y: st.y });
  };

  const phase = ui.phase;
  return (
    <div className="app">
      <div className="drift" />
      <div className="hud">
        <div className="cell"><span>Score</span><b data-testid="score">{ui.score}</b></div>
        <div className="cell"><span>Best</span><b data-testid="best">{ui.best}</b></div>
        <div className="cell"><span>Combo</span><b data-testid="combo">x{Math.max(1, Math.min(ui.combo, 10))}</b></div>
        <div className="cell"><span>Lives</span><b data-testid="lives">{'♥'.repeat(Math.max(0, ui.lives))}</b></div>
      </div>
      <div className="sub">
        <div className="parcel" data-testid="parcel" data-color={ui.parcel} style={{ '--c': COLORS[ui.parcel] }}>PARCEL</div>
        <div className="ink-track"><div className="ink" ref={inkRef} /></div>
        <div className="lvl" data-testid="level">LV {ui.level}</div>
      </div>
      <div
        className="field"
        ref={fieldRef}
        onPointerDown={onDown}
        onPointerMove={onMove}
        onPointerUp={onUp}
        onPointerCancel={onUp}
        onPointerLeave={onUp}
      >
        <canvas ref={canvasRef} />
        <div className="nib" ref={nibRef} data-testid="nib" style={{ display: phase === 'playing' ? 'block' : 'none' }} />
        {ui.stops.map(s => (
          <div
            key={s.id}
            className="stop-hit"
            data-testid="station"
            data-color={s.color}
            style={{ left: `${s.x / FW * 100}%`, top: `${s.y / FH * 100}%` }}
            onPointerDown={e => onStop(e, s.id)}
          />
        ))}
        {phase !== 'playing' && (
          <div className="overlay">
            <div className="title">PARCEL RAIL</div>
            {phase === 'menu' ? (
              <p>Drag from the glowing nib to draw track ahead of the cart. Tap a stop to lay a straight rail to it. Deliver matching colours. Wrong stop costs a life.</p>
            ) : (
              <React.Fragment>
                <p className="over-reason">{ui.reason === 'lives' ? 'Out of lives' : 'Derailed'}</p>
                <div className="stat">Score <b>{ui.score}</b> &middot; Best <b>{ui.best}</b></div>
              </React.Fragment>
            )}
            <button className="start-btn" data-testid="start-btn" onClick={start}>
              {phase === 'menu' ? 'START' : 'RUN AGAIN'}
            </button>
          </div>
        )}
      </div>
      <p className="hint">Draw ahead of the cart or it runs dry and derails.</p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ParcelRail />);
</script>
</body>
</html>
