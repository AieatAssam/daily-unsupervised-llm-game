<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Twin Guard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #030509; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }
  #root { width: 100%; height: 100%; }

  .app {
    width: 100%; height: 100%; position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; overflow: hidden; gap: 6px; padding: 6px 0;
    background: radial-gradient(circle at 50% 40%, #0a1a2e 0%, #060a16 55%, #030308 100%);
  }

  .hud {
    position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-around;
    padding: 10px 12px; z-index: 15; pointer-events: none;
  }
  .hudBox { text-align: center; }
  .hudLabel { font-size: 10px; letter-spacing: 2px; color: #4de8ff; text-transform: uppercase; }
  .hudValue {
    font-size: 22px; font-weight: 800; color: #fff;
    text-shadow: 0 0 10px #4de8ff, 0 0 20px #4de8ff;
  }
  .hudValue.combo { color: #ffd35e; text-shadow: 0 0 10px #ffd35e, 0 0 22px #e8a800; }
  .hudValue.lives { color: #ff5e8a; text-shadow: 0 0 10px #ff5e8a, 0 0 22px #c9005a; }
  .hudValue.hurt { animation: hurtPulse 0.4s ease; }
  @keyframes hurtPulse { 0%,100% { opacity:1; transform: scale(1);} 50% { opacity:0.4; transform: scale(1.25);} }

  .title {
    font-size: clamp(18px, 5vw, 30px); font-weight: 900; letter-spacing: 3px; margin-top: 34px;
    background: linear-gradient(90deg, #4de8ff, #ff5ec4, #ffd35e);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(77,232,255,0.6));
    animation: titlePulse 2.4s ease-in-out infinite;
    text-align: center;
  }
  @keyframes titlePulse { 0%,100% { filter: drop-shadow(0 0 12px rgba(77,232,255,0.6)); } 50% { filter: drop-shadow(0 0 26px rgba(255,94,196,0.85)); } }

  .subtitle { color: #b8c8e0; font-size: 13px; letter-spacing: 0.5px; text-align: center; max-width: 420px; line-height: 1.55; }

  .btn {
    padding: 15px 40px; font-size: 19px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(135deg, #4de8ff, #ff5ec4);
    border: none; border-radius: 50px; color: #051018; cursor: pointer;
    box-shadow: 0 0 20px rgba(77,232,255,0.7), 0 0 50px rgba(255,94,196,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(77,232,255,0.9), 0 0 70px rgba(255,94,196,0.5); }
  .btn:active { transform: scale(0.96); }

  .highscoreLine { color: #ffd35e; font-size: 14px; text-shadow: 0 0 8px rgba(255,211,94,0.6); }

  .arenaOuter {
    position: relative; width: min(94vw, 520px); height: min(50vh, 520px); z-index: 5;
    border-radius: 18px; overflow: hidden; border: 2px solid rgba(77,232,255,0.25);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 0 30px rgba(77,232,255,0.12);
    background: #05070f;
  }

  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .zoneHint {
    position: absolute; top: 0; bottom: 0; width: 50%; z-index: 6; pointer-events: none;
    display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px;
    font-size: 10px; letter-spacing: 2px; opacity: 0.35; text-transform: uppercase;
  }
  .zoneHint.left { left: 0; color: #4de8ff; }
  .zoneHint.right { right: 0; color: #ff5ec4; }

  .overlay {
    position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 18px;
    background: rgba(6, 10, 22, 0.9); backdrop-filter: blur(4px);
  }

  .status { color: #9fb0c4; font-size: 12px; letter-spacing: 0.5px; height: 15px; z-index: 10; text-align: center; }

  .footer { position: relative; text-align: center; color: #303a50; font-size: 10px; z-index: 10; padding-bottom: 2px; }

  @media (max-width: 480px) {
    .hudValue { font-size: 17px; }
    .btn { padding: 13px 30px; font-size: 16px; }
    .subtitle { font-size: 12px; }
    .arenaOuter { height: min(48vh, 480px); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const HS_KEY = 'twinGuard_highScore';
const LIVES_START = 3;
const TWO_PI = Math.PI * 2;

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function lerpAngle(a, b, t) {
  let diff = ((b - a + Math.PI) % TWO_PI + TWO_PI) % TWO_PI - Math.PI;
  return a + diff * t;
}
function angleDiff(a, b) {
  let d = Math.abs(a - b) % TWO_PI;
  return d > Math.PI ? TWO_PI - d : d;
}
function normalizeAngle(a) {
  a = a % TWO_PI;
  if (a < 0) a += TWO_PI;
  return a;
}
function isLeftSide(theta) {
  const n = normalizeAngle(theta);
  return n > Math.PI / 2 && n < Math.PI * 1.5;
}

function useAudio() {
  const ctxRef = useRef(null);
  const getCtx = () => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  };

  const tone = useCallback((freq, duration, type, gainScale, freqEnd) => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + duration);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(gainScale, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.05);
    } catch (e) {}
  }, []);

  const blockSound = useCallback((combo) => tone(420 + combo * 22, 0.12, 'triangle', 0.16, 900 + combo * 30), [tone]);
  const breachSound = useCallback(() => tone(200, 0.32, 'sawtooth', 0.2, 50), [tone]);
  const levelUpSound = useCallback(() => {
    tone(500, 0.12, 'sine', 0.18, 800);
    setTimeout(() => tone(700, 0.16, 'sine', 0.18, 1100), 110);
  }, [tone]);
  const overSound = useCallback(() => {
    tone(320, 0.25, 'sawtooth', 0.2, 220);
    setTimeout(() => tone(200, 0.35, 'sawtooth', 0.2, 90), 150);
  }, [tone]);

  return { blockSound, breachSound, levelUpSound, overSound };
}

function makeGameState() {
  return {
    bounds: { w: 400, h: 400 },
    center: { x: 200, y: 200 },
    guardRadius: 120,
    coreRadius: 30,
    spawnRadius: 220,
    guardHalfWidth: 0.5,
    leftAngle: Math.PI,
    rightAngle: 0,
    leftTarget: Math.PI,
    rightTarget: 0,
    shards: [],
    particles: [],
    spawnTimer: 900,
    shake: 0,
    running: false,
    nextId: 1,
    level: 1,
  };
}

function spawnBurst(arr, x, y, color, count, speedMin, speedMax, sizeMin, sizeMax, lifeMs) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * TWO_PI;
    const spd = speedMin + Math.random() * (speedMax - speedMin);
    arr.push({
      x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      life: lifeMs, maxLife: lifeMs, color,
      size: sizeMin + Math.random() * (sizeMax - sizeMin),
    });
  }
}

function spawnShard(state) {
  let theta;
  const wantLeft = Math.random() < 0.5;
  if (wantLeft) {
    theta = Math.PI / 2 + 0.12 + Math.random() * (Math.PI - 0.24);
  } else {
    theta = -Math.PI / 2 + 0.12 + Math.random() * (Math.PI - 0.24);
  }
  theta = normalizeAngle(theta);
  const speedBase = 46 + Math.min(90, state.level * 8);
  state.shards.push({
    id: state.nextId++,
    theta,
    dist: state.spawnRadius,
    speed: speedBase + Math.random() * 14,
    resolved: false,
  });
}

function App() {
  const [phase, setPhase] = useState('start'); // start | playing | over
  const [score, setScore] = useState(0);
  const [lives, setLives] = useState(LIVES_START);
  const [combo, setCombo] = useState(0);
  const [level, setLevel] = useState(1);
  const [hurt, setHurt] = useState(false);
  const [highScore, setHighScore] = useState(() => parseInt(localStorage.getItem(HS_KEY) || '0', 10));
  const [statusMsg, setStatusMsg] = useState('Drag or press keys to rotate both shields around the core.');

  const canvasRef = useRef(null);
  const arenaRef = useRef(null);
  const gs = useRef(makeGameState());
  const rafRef = useRef(null);
  const lastTsRef = useRef(0);
  const scoreRef = useRef(0);
  const comboRef = useRef(0);
  const livesRef = useRef(LIVES_START);
  const levelRef = useRef(1);
  const blocksRef = useRef(0);
  const highScoreRef = useRef(highScore);
  const phaseRef = useRef('start');
  const activeTouches = useRef({});
  const { blockSound, breachSound, levelUpSound, overSound } = useAudio();

  useEffect(() => { phaseRef.current = phase; }, [phase]);

  const resizeCanvas = useCallback(() => {
    const canvas = canvasRef.current;
    const arena = arenaRef.current;
    if (!canvas || !arena) return;
    const rect = arena.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const w = rect.width, h = rect.height;
    gs.current.bounds = { w, h };
    gs.current.center = { x: w / 2, y: h / 2 };
    const minDim = Math.min(w, h);
    gs.current.guardRadius = minDim * 0.34;
    gs.current.coreRadius = minDim * 0.1;
    gs.current.spawnRadius = minDim * 0.56;
  }, []);

  useEffect(() => {
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    return () => window.removeEventListener('resize', resizeCanvas);
  }, [resizeCanvas]);

  const endGame = useCallback(() => {
    gs.current.running = false;
    phaseRef.current = 'over';
    setPhase('over');
    overSound();
    setStatusMsg('Both shields overrun.');
  }, [overSound]);

  const registerBreach = useCallback((side) => {
    comboRef.current = 0;
    setCombo(0);
    livesRef.current -= 1;
    setLives(livesRef.current);
    setHurt(true);
    setTimeout(() => setHurt(false), 400);
    gs.current.shake = 9;
    breachSound();
    if (livesRef.current <= 0) { endGame(); return; }
    setStatusMsg(`${side} shield breached! Realign fast.`);
  }, [breachSound, endGame]);

  const maybeLevelUp = useCallback(() => {
    blocksRef.current += 1;
    if (blocksRef.current % 6 === 0) {
      levelRef.current += 1;
      setLevel(levelRef.current);
      levelUpSound();
      setStatusMsg(`Level ${levelRef.current}! Shards move faster.`);
    }
  }, [levelUpSound]);

  const registerBlock = useCallback((x, y) => {
    comboRef.current += 1;
    setCombo(comboRef.current);
    const gained = 10 + (comboRef.current - 1) * 4;
    scoreRef.current += gained;
    setScore(scoreRef.current);
    if (scoreRef.current > highScoreRef.current) {
      highScoreRef.current = scoreRef.current;
      localStorage.setItem(HS_KEY, String(scoreRef.current));
      setHighScore(scoreRef.current);
    }
    blockSound(comboRef.current);
    spawnBurst(gs.current.particles, x, y, '#4de8ff', 18, 40, 170, 2, 5, 500);
    maybeLevelUp();
  }, [blockSound, maybeLevelUp]);

  // --- Input: pointer / touch drives whichever guard is on that half ---
  const setAngleFromPoint = useCallback((clientX, clientY) => {
    const arena = arenaRef.current;
    if (!arena) return;
    const rect = arena.getBoundingClientRect();
    const x = clientX - rect.left - gs.current.center.x;
    const y = clientY - rect.top - gs.current.center.y;
    const theta = normalizeAngle(Math.atan2(y, x));
    const state = gs.current;
    if (isLeftSide(theta)) {
      state.leftTarget = clamp(theta, Math.PI / 2 + 0.05, Math.PI * 1.5 - 0.05);
    } else {
      let t = theta;
      if (t > Math.PI) t -= TWO_PI; // map to [-PI, PI/2] range around 0
      t = clamp(t, -Math.PI / 2 + 0.05, Math.PI / 2 - 0.05);
      state.rightTarget = normalizeAngle(t);
    }
  }, []);

  const onPointerMove = useCallback((e) => {
    if (phaseRef.current !== 'playing') return;
    setAngleFromPoint(e.clientX, e.clientY);
  }, [setAngleFromPoint]);

  const onTouchMove = useCallback((e) => {
    if (phaseRef.current !== 'playing') return;
    e.preventDefault();
    for (const t of e.changedTouches) setAngleFromPoint(t.clientX, t.clientY);
  }, [setAngleFromPoint]);

  // --- Input: keyboard, WASD for left shield, arrows for right shield ---
  useEffect(() => {
    const STEP = 0.11;
    const onKeyDown = (e) => {
      if (phaseRef.current !== 'playing') return;
      const state = gs.current;
      const lo = Math.PI / 2 + 0.05, hi = Math.PI * 1.5 - 0.05;
      const rlo = -Math.PI / 2 + 0.05, rhi = Math.PI / 2 - 0.05;
      let rt = state.rightTarget > Math.PI ? state.rightTarget - TWO_PI : state.rightTarget;
      switch (e.code) {
        case 'KeyA':
          state.leftTarget = clamp(state.leftTarget - STEP, lo, hi); e.preventDefault(); break;
        case 'KeyD':
          state.leftTarget = clamp(state.leftTarget + STEP, lo, hi); e.preventDefault(); break;
        case 'ArrowLeft':
          rt = clamp(rt - STEP, rlo, rhi); state.rightTarget = normalizeAngle(rt); e.preventDefault(); break;
        case 'ArrowRight':
          rt = clamp(rt + STEP, rlo, rhi); state.rightTarget = normalizeAngle(rt); e.preventDefault(); break;
        case 'ArrowUp':
          rt = clamp(rt - STEP, rlo, rhi); state.rightTarget = normalizeAngle(rt); e.preventDefault(); break;
        case 'ArrowDown':
          rt = clamp(rt + STEP, rlo, rhi); state.rightTarget = normalizeAngle(rt); e.preventDefault(); break;
      }
    };
    window.addEventListener('keydown', onKeyDown);
    return () => window.removeEventListener('keydown', onKeyDown);
  }, []);

  const tick = useCallback((ts) => {
    const state = gs.current;
    if (!lastTsRef.current) lastTsRef.current = ts;
    let dt = (ts - lastTsRef.current) / 1000;
    dt = Math.min(dt, 0.05);
    lastTsRef.current = ts;

    if (phaseRef.current === 'playing') {
      state.level = levelRef.current;
      const ease = 1 - Math.pow(0.001, dt);
      state.leftAngle = lerpAngle(state.leftAngle, state.leftTarget, ease);
      state.rightAngle = lerpAngle(state.rightAngle, state.rightTarget, ease);

      state.guardHalfWidth = clamp(0.5 - state.level * 0.02, 0.24, 0.5);

      state.spawnTimer -= dt * 1000;
      const interval = Math.max(950 - state.level * 55, 320);
      if (state.spawnTimer <= 0) {
        spawnShard(state);
        state.spawnTimer = interval + Math.random() * 200;
      }

      const survivors = [];
      for (const s of state.shards) {
        s.dist -= s.speed * dt;
        if (!s.resolved && s.dist <= state.guardRadius) {
          s.resolved = true;
          const guardAngle = isLeftSide(s.theta) ? state.leftAngle : state.rightAngle;
          const diff = angleDiff(s.theta, guardAngle);
          const x = state.center.x + Math.cos(s.theta) * state.guardRadius;
          const y = state.center.y + Math.sin(s.theta) * state.guardRadius;
          if (diff <= state.guardHalfWidth) {
            registerBlock(x, y);
            continue;
          }
        }
        if (s.dist <= state.coreRadius) {
          const side = isLeftSide(s.theta) ? 'Left' : 'Right';
          registerBreach(side);
          continue;
        }
        survivors.push(s);
      }
      state.shards = survivors;
    }

    for (let i = state.particles.length - 1; i >= 0; i--) {
      const pt = state.particles[i];
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.vx *= 0.94; pt.vy *= 0.94;
      pt.life -= dt * 1000;
      if (pt.life <= 0) state.particles.splice(i, 1);
    }
    if (state.particles.length > 260) state.particles.splice(0, state.particles.length - 260);

    if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 40);

    draw(state, ts);
    rafRef.current = requestAnimationFrame(tick);
  }, [registerBlock, registerBreach]);

  const draw = (state, ts) => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const { w, h } = state.bounds;
    const { x: cx, y: cy } = state.center;

    ctx.save();
    if (state.shake > 0) {
      ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
    }

    ctx.fillStyle = 'rgba(5,7,15,0.35)';
    ctx.fillRect(-20, -20, w + 40, h + 40);

    const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, Math.max(w, h) * 0.7);
    grad.addColorStop(0, `hsla(${200 + Math.sin(ts / 3000) * 30}, 70%, 16%, 0.35)`);
    grad.addColorStop(1, 'rgba(3,3,8,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    // starfield
    ctx.fillStyle = 'rgba(120,180,255,0.25)';
    for (let i = 0; i < 26; i++) {
      const sx = (i * 83.3) % w;
      const sy = (i * 61.1 + (ts * 0.02)) % h;
      ctx.globalAlpha = 0.06 + 0.08 * Math.sin(ts / 600 + i);
      ctx.fillRect(sx, sy, 1.5, 1.5);
    }
    ctx.globalAlpha = 1;

    // spawn ring hint
    ctx.strokeStyle = 'rgba(120,150,200,0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy, state.spawnRadius, 0, TWO_PI);
    ctx.stroke();

    // core
    const pulse = 1 + Math.sin(ts / 260) * 0.06;
    ctx.save();
    ctx.shadowColor = '#ffd35e';
    ctx.shadowBlur = 26;
    ctx.fillStyle = '#ffd35e';
    ctx.beginPath();
    ctx.arc(cx, cy, state.coreRadius * pulse, 0, TWO_PI);
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'rgba(6,8,16,0.9)';
    ctx.beginPath();
    ctx.arc(cx, cy, state.coreRadius * 0.55, 0, TWO_PI);
    ctx.fill();

    // guard ring track
    ctx.strokeStyle = 'rgba(140,170,220,0.14)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(cx, cy, state.guardRadius, 0, TWO_PI);
    ctx.stroke();

    // guards (arcs)
    const drawGuard = (angle, color) => {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 16;
      ctx.lineWidth = 9;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(cx, cy, state.guardRadius, angle - state.guardHalfWidth, angle + state.guardHalfWidth);
      ctx.stroke();
      ctx.restore();
    };
    drawGuard(state.leftAngle, '#4de8ff');
    drawGuard(state.rightAngle, '#ff5ec4');

    // shards
    for (const s of state.shards) {
      const x = cx + Math.cos(s.theta) * s.dist;
      const y = cy + Math.sin(s.theta) * s.dist;
      const color = isLeftSide(s.theta) ? '#8fe8ff' : '#ff9fdd';
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(s.theta);
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(9, 0);
      ctx.lineTo(-6, 5);
      ctx.lineTo(-6, -5);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // particles
    for (const pt of state.particles) {
      ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, TWO_PI);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.restore();
  };

  const startGame = () => {
    resizeCanvas();
    const state = makeGameState();
    state.bounds = gs.current.bounds;
    state.center = gs.current.center;
    state.guardRadius = gs.current.guardRadius;
    state.coreRadius = gs.current.coreRadius;
    state.spawnRadius = gs.current.spawnRadius;
    state.running = true;
    gs.current = state;
    scoreRef.current = 0;
    comboRef.current = 0;
    livesRef.current = LIVES_START;
    levelRef.current = 1;
    blocksRef.current = 0;
    lastTsRef.current = 0;
    setScore(0);
    setCombo(0);
    setLives(LIVES_START);
    setLevel(1);
    setStatusMsg('Keep both shields between the core and incoming shards.');
    setPhase('playing');
    phaseRef.current = 'playing';
    cancelAnimationFrame(rafRef.current);
    rafRef.current = requestAnimationFrame(tick);
  };

  useEffect(() => () => cancelAnimationFrame(rafRef.current), []);

  return (
    <div className="app" data-testid="game-canvas">
      <div className="hud">
        <div className="hudBox">
          <div className="hudLabel">Score</div>
          <div className="hudValue" data-testid="score">{score}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Lives</div>
          <div className={`hudValue lives ${hurt ? 'hurt' : ''}`} data-testid="lives">{'❤'.repeat(Math.max(0, lives))}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Combo</div>
          <div className="hudValue combo" data-testid="combo">x{combo}</div>
        </div>
      </div>

      <div className="title">TWIN GUARD</div>

      <div
        className="arenaOuter"
        ref={arenaRef}
        data-testid="play-field"
        onMouseMove={onPointerMove}
        onTouchMove={onTouchMove}
        onTouchStart={onTouchMove}
      >
        <canvas ref={canvasRef} data-testid="arena" />
        <div className="zoneHint left">Cyan · A / D</div>
        <div className="zoneHint right">Magenta · ◀ / ▶</div>

        {phase === 'start' && (
          <div className="overlay">
            <div className="subtitle">Two shields orbit the core, one per side. Drag the left half of the field or press A/D to aim the cyan shield; drag the right half or press the arrow keys to aim the magenta one.<br />Intercept shards before they reach the core &mdash; miss with either shield and you lose one of three lives. Chain blocks for a rising combo.</div>
            <div className="highscoreLine" data-testid="high-score">Best: {highScore}</div>
            <button className="btn" data-testid="start-btn" onClick={startGame}>START</button>
          </div>
        )}

        {phase === 'over' && (
          <div className="overlay">
            <div className="title" style={{ fontSize: 'clamp(20px, 6vw, 30px)', marginTop: 0 }}>CORE BREACHED</div>
            <div className="hudValue" data-testid="final-score">Score: {score}</div>
            <div className="highscoreLine" data-testid="high-score-final">Best: {highScore}</div>
            <button className="btn" data-testid="restart-btn" onClick={startGame}>PLAY AGAIN</button>
          </div>
        )}
      </div>

      <div className="status">{statusMsg}</div>
      <div className="footer">Twin Guard — Level {level} — steer both shields to defend the core from both sides at once</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
