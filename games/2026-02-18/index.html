<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Neon Orbit</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box}html,body,#root{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:system-ui,sans-serif;color:#e9fbff;background:radial-gradient(circle at 50% 35%,#182b62,#070916 70%);user-select:none;touch-action:none}.app{height:100%;display:flex;flex-direction:column;padding:12px}.hud{display:flex;justify-content:space-around;text-align:center;gap:8px;padding:6px;color:#79eaff}.label{font-size:10px;letter-spacing:2px;opacity:.7}.value{font-size:22px;font-weight:800;text-shadow:0 0 12px #00eaff}.arena{position:relative;flex:1;min-height:0;border:1px solid #214f75;border-radius:18px;overflow:hidden;box-shadow:0 0 30px #00d9ff33}.arena canvas{width:100%;height:100%;display:block}.overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;background:#050713cc}.title{font-size:clamp(38px,10vw,72px);margin:0;color:#00eaff;text-shadow:0 0 20px #00eaff;letter-spacing:5px}.copy{max-width:520px;line-height:1.6;color:#b9d9ff}.btn{min-height:52px;padding:12px 38px;border:2px solid #00eaff;border-radius:30px;background:#00eaff18;color:#fff;font-size:20px;font-weight:800;letter-spacing:3px;cursor:pointer;box-shadow:0 0 20px #00eaff66}.hint{font-size:12px;color:#8bb3d0}.announce{position:absolute;top:14%;left:50%;transform:translateX(-50%);font-size:28px;font-weight:900;color:#ffd34d;text-shadow:0 0 18px #ffd34d;pointer-events:none}
</style></head><body><div id="root"></div><script type="text/babel">
const {useState,useEffect,useRef}=React; const KEY='neonOrbitHighScore';
function App(){const ref=useRef(null), game=useRef(null), [screen,setScreen]=useState('start'),[score,setScore]=useState(0),[best,setBest]=useState(()=>+localStorage.getItem(KEY)||0),[lives,setLives]=useState(3),[msg,setMsg]=useState('');
 useEffect(()=>{localStorage.setItem(KEY,String(best))},[best]);
 useEffect(()=>{const c=ref.current,ctx=c.getContext('2d');let raf,active=true,last=0;function resize(){c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}resize();addEventListener('resize',resize);function loop(t){if(!active)return;const dt=Math.min(40,t-last);last=t;const w=c.clientWidth,h=c.clientHeight,g=game.current;if(g){g.t+=dt/1000;g.target=(g.target+dt*(.0008+Math.min(.0007,g.score*.00001)))%(Math.PI*2);g.pulse=Math.max(0,g.pulse-dt/500);if(g.t-g.lastMiss>Math.max(2.2,3.8-g.score*.015)){g.lastMiss=g.t;g.lives--;setLives(g.lives);setMsg('MISSED');setTimeout(()=>setMsg(''),400);if(g.lives<=0){g.over=true;setScreen('over')}}}ctx.clearRect(0,0,w,h);const cx=w/2,cy=h/2,r=Math.min(w,h)*.24;ctx.strokeStyle='#1c6688';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.stroke();if(g){ctx.save();ctx.translate(cx,cy);ctx.rotate(g.angle);ctx.strokeStyle='#00eaff';ctx.shadowColor='#00eaff';ctx.shadowBlur=18;ctx.lineWidth=12;ctx.beginPath();ctx.arc(0,0,r,-.35,.35);ctx.stroke();ctx.restore();const tx=cx+Math.cos(g.target)*r,ty=cy+Math.sin(g.target)*r;ctx.fillStyle='#ffd34d';ctx.shadowColor='#ffd34d';ctx.shadowBlur=22;ctx.beginPath();ctx.arc(tx,ty,10+g.pulse*10,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText('ROTATE TO CATCH',cx,cy+r+48)}raf=requestAnimationFrame(loop)}raf=requestAnimationFrame(loop);return()=>{active=false;cancelAnimationFrame(raf);removeEventListener('resize',resize)}},[]);
 function start(){game.current={angle:0,target:0,t:0,lastMiss:0,lives:3,pulse:0,over:false};setScore(0);setLives(3);setMsg('');setScreen('play')}
 function rotate(){const g=game.current;if(!g||g.over)return;g.angle=(g.angle+Math.PI/4)%(Math.PI*2);g.pulse=1;const d=Math.abs(Math.atan2(Math.sin(g.angle-g.target),Math.cos(g.angle-g.target)));if(d<.48){const n=score+10;g.score=n;setScore(n);setBest(b=>Math.max(b,n));g.lastMiss=g.t;setMsg('NICE!');setTimeout(()=>setMsg(''),350)}}
 useEffect(()=>{const f=e=>{if([' ','ArrowUp','ArrowRight'].includes(e.key)){e.preventDefault();rotate()}};addEventListener('keydown',f);return()=>removeEventListener('keydown',f)},[score]);return <div className="app"><div className="hud"><div><div className="label">SCORE</div><div className="value">{score}</div></div><div><div className="label">LIVES</div><div className="value">{'♥'.repeat(lives)}{'♡'.repeat(3-lives)}</div></div><div><div className="label">BEST</div><div className="value">{best}</div></div></div><div className="arena"><canvas ref={ref} onClick={rotate} onTouchStart={e=>{e.preventDefault();rotate()}}/>{msg&&<div className="announce">{msg}</div>}{screen==='start'&&<div className="overlay"><h1 className="title">NEON ORBIT</h1><p className="copy">Rotate the shield into the golden pulse before it slips away. Every catch resets the pressure and builds your score.</p><button className="btn" data-testid="start-btn" onClick={start}>START</button><p className="hint">Tap, click, SPACE, or ↑ to rotate</p></div>}{screen==='over'&&<div className="overlay"><h1 className="title" style={{fontSize:42}}>ORBIT LOST</h1><p className="copy">Final score: <b>{score}</b></p><button className="btn" data-testid="start-btn" onClick={start}>TRY AGAIN</button></div>}</div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script><script>document.addEventListener('click',()=>document.body.dataset.lastAction=Date.now());document.addEventListener('touchstart',()=>document.body.dataset.lastAction=Date.now());</script></body></html>
