<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Volt Serpent</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05030a; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }
  #root { width: 100%; height: 100%; }

  .app {
    width: 100%; height: 100%; position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; overflow: hidden; gap: 6px; padding: 6px 0;
    background: radial-gradient(circle at 50% 30%, #0a1f18 0%, #061014 55%, #030308 100%);
  }

  .hud {
    position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-around;
    padding: 10px 12px; z-index: 15; pointer-events: none;
  }
  .hudBox { text-align: center; }
  .hudLabel { font-size: 10px; letter-spacing: 2px; color: #3dffb0; text-transform: uppercase; }
  .hudValue {
    font-size: 22px; font-weight: 800; color: #fff;
    text-shadow: 0 0 10px #3dffb0, 0 0 20px #3dffb0;
  }
  .hudValue.combo { color: #5eeaff; text-shadow: 0 0 10px #5eeaff, 0 0 22px #00b3c9; }
  .hudValue.lives { color: #ff5ec4; text-shadow: 0 0 10px #ff5ec4, 0 0 22px #c9007f; }
  .hudValue.hurt { animation: hurtPulse 0.4s ease; }
  @keyframes hurtPulse { 0%,100% { opacity:1; transform: scale(1);} 50% { opacity:0.4; transform: scale(1.25);} }

  .title {
    font-size: clamp(18px, 5vw, 30px); font-weight: 900; letter-spacing: 3px; margin-top: 34px;
    background: linear-gradient(90deg, #3dffb0, #5eeaff, #ff5ec4);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(61,255,176,0.6));
    animation: titlePulse 2.4s ease-in-out infinite;
    text-align: center;
  }
  @keyframes titlePulse { 0%,100% { filter: drop-shadow(0 0 12px rgba(61,255,176,0.6)); } 50% { filter: drop-shadow(0 0 26px rgba(94,234,255,0.85)); } }

  .subtitle { color: #c8bcd8; font-size: 13px; letter-spacing: 0.5px; text-align: center; max-width: 420px; line-height: 1.55; }

  .btn {
    padding: 15px 40px; font-size: 19px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(135deg, #3dffb0, #5eeaff);
    border: none; border-radius: 50px; color: #001a12; cursor: pointer;
    box-shadow: 0 0 20px rgba(61,255,176,0.7), 0 0 50px rgba(94,234,255,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(61,255,176,0.9), 0 0 70px rgba(94,234,255,0.5); }
  .btn:active { transform: scale(0.96); }

  .highscoreLine { color: #5eeaff; font-size: 14px; text-shadow: 0 0 8px rgba(94,234,255,0.6); }

  .arenaOuter {
    position: relative; width: min(94vw, 480px); height: min(50vh, 480px); z-index: 5;
    border-radius: 18px; overflow: hidden; border: 2px solid rgba(61,255,176,0.25);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 0 30px rgba(61,255,176,0.12);
    background: #060a10; cursor: pointer;
  }

  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .dpad {
    position: relative; z-index: 12; margin-top: 2px;
    display: grid; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 46px); gap: 4px;
  }
  .dpadBtn {
    font-size: 18px; font-weight: 900; border: none; border-radius: 12px;
    background: linear-gradient(135deg, #ff5ec4, #3dffb0); color: #04140e;
    box-shadow: 0 0 14px rgba(61,255,176,0.6), 0 0 30px rgba(255,94,196,0.3);
    min-height: 44px; min-width: 44px;
  }
  .dpadBtn:active { transform: scale(0.92); }
  .dpadUp { grid-column: 2; grid-row: 1; }
  .dpadLeft { grid-column: 1; grid-row: 2; }
  .dpadRight { grid-column: 3; grid-row: 2; }
  .dpadDown { grid-column: 2; grid-row: 3; }

  .overlay {
    position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 18px;
    background: rgba(6, 10, 8, 0.9); backdrop-filter: blur(4px);
  }

  .status { color: #a898b8; font-size: 12px; letter-spacing: 0.5px; height: 15px; z-index: 10; text-align: center; }

  .footer { position: relative; text-align: center; color: #241f30; font-size: 10px; z-index: 10; padding-bottom: 2px; }

  @media (max-width: 480px) {
    .hudValue { font-size: 17px; }
    .btn { padding: 13px 30px; font-size: 16px; }
    .subtitle { font-size: 12px; }
    .arenaOuter { height: min(46vh, 440px); }
    .dpad { grid-template-columns: repeat(3, 42px); grid-template-rows: repeat(3, 42px); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const HS_KEY = 'voltSerpent_highScore';
const LIVES_START = 3;
const GRID = 16;
const START_LEN = 3;

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function useAudio() {
  const ctxRef = useRef(null);
  const getCtx = () => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  };

  const tone = useCallback((freq, duration, type, gainScale, freqEnd) => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + duration);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(gainScale, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.05);
    } catch (e) {}
  }, []);

  const eatSound = useCallback((combo) => tone(420 + combo * 18, 0.1, 'triangle', 0.15, 760 + combo * 22), [tone]);
  const surgeSound = useCallback(() => { tone(600, 0.1, 'sine', 0.18, 1000); setTimeout(() => tone(900, 0.14, 'sine', 0.16, 1300), 90); }, [tone]);
  const turnSound = useCallback(() => tone(300, 0.04, 'sine', 0.05, 380), [tone]);
  const pulseSound = useCallback(() => tone(220, 0.18, 'sawtooth', 0.1, 500), [tone]);
  const hitSound = useCallback(() => tone(180, 0.3, 'sawtooth', 0.2, 60), [tone]);
  const levelUpSound = useCallback(() => {
    tone(500, 0.12, 'sine', 0.18, 800);
    setTimeout(() => tone(700, 0.16, 'sine', 0.18, 1100), 110);
  }, [tone]);
  const overSound = useCallback(() => {
    tone(300, 0.25, 'sawtooth', 0.2, 200);
    setTimeout(() => tone(180, 0.35, 'sawtooth', 0.2, 80), 150);
  }, [tone]);

  return { eatSound, surgeSound, turnSound, pulseSound, hitSound, levelUpSound, overSound };
}

const DIRS = {
  up: { x: 0, y: -1 },
  down: { x: 0, y: 1 },
  left: { x: -1, y: 0 },
  right: { x: 1, y: 0 },
};

function spawnBurst(arr, x, y, color, count, speedMin, speedMax, sizeMin, sizeMax, lifeMs) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = speedMin + Math.random() * (speedMax - speedMin);
    arr.push({
      x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      life: lifeMs, maxLife: lifeMs, color,
      size: sizeMin + Math.random() * (sizeMax - sizeMin),
    });
  }
}

function makeSnake() {
  const cy = Math.floor(GRID / 2);
  const cx = Math.floor(GRID / 2) - 2;
  const snake = [];
  for (let i = 0; i < START_LEN; i++) snake.push({ x: cx - i, y: cy });
  return snake;
}

function cellFree(x, y, snake, hazards, exclude) {
  if (snake.some(s => s.x === x && s.y === y)) return false;
  if (hazards.some(h => h.x === x && h.y === y)) return false;
  if (exclude && exclude.x === x && exclude.y === y) return false;
  return true;
}

function randomFreeCell(snake, hazards, exclude) {
  for (let tries = 0; tries < 200; tries++) {
    const x = Math.floor(Math.random() * GRID);
    const y = Math.floor(Math.random() * GRID);
    if (cellFree(x, y, snake, hazards, exclude)) return { x, y };
  }
  return { x: 0, y: 0 };
}

function makeGameState() {
  return {
    bounds: { w: 400, h: 400 },
    cell: 20,
    offX: 0,
    offY: 0,
    snake: makeSnake(),
    hazards: [],
    food: { x: GRID - 3, y: Math.floor(GRID / 2), kind: 'normal' },
    particles: [],
    shake: 0,
    flash: 0,
    level: 1,
    time: 0,
    moveAccum: 0,
    running: false,
  };
}

function App() {
  const [phase, setPhase] = useState('start'); // start | playing | over
  const [score, setScore] = useState(0);
  const [lives, setLives] = useState(LIVES_START);
  const [combo, setCombo] = useState(0);
  const [level, setLevel] = useState(1);
  const [hurt, setHurt] = useState(false);
  const [highScore, setHighScore] = useState(() => parseInt(localStorage.getItem(HS_KEY) || '0', 10));
  const [statusMsg, setStatusMsg] = useState('Steer the serpent to devour glowing orbs. Don\'t hit walls or your own tail.');

  const canvasRef = useRef(null);
  const arenaRef = useRef(null);
  const gs = useRef(makeGameState());
  const rafRef = useRef(null);
  const lastTsRef = useRef(0);
  const scoreRef = useRef(0);
  const comboRef = useRef(0);
  const livesRef = useRef(LIVES_START);
  const levelRef = useRef(1);
  const eatenRef = useRef(0);
  const highScoreRef = useRef(highScore);
  const phaseRef = useRef('start');
  const directionRef = useRef(DIRS.right);
  const nextDirectionRef = useRef(DIRS.right);
  const touchStartRef = useRef(null);
  const { eatSound, surgeSound, turnSound, pulseSound, hitSound, levelUpSound, overSound } = useAudio();

  useEffect(() => { phaseRef.current = phase; }, [phase]);

  const resizeCanvas = useCallback(() => {
    const canvas = canvasRef.current;
    const arena = arenaRef.current;
    if (!canvas || !arena) return;
    const rect = arena.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const w = rect.width, h = rect.height;
    const R = Math.min(w, h);
    gs.current.bounds = { w, h };
    gs.current.cell = R / GRID;
    gs.current.offX = (w - R) / 2;
    gs.current.offY = (h - R) / 2;
  }, []);

  useEffect(() => {
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    return () => window.removeEventListener('resize', resizeCanvas);
  }, [resizeCanvas]);

  const endGame = useCallback(() => {
    gs.current.running = false;
    phaseRef.current = 'over';
    setPhase('over');
    overSound();
    setStatusMsg('The serpent falls.');
  }, [overSound]);

  const cellCenter = (state, gx, gy) => ({
    x: state.offX + (gx + 0.5) * state.cell,
    y: state.offY + (gy + 0.5) * state.cell,
  });

  const spawnHazards = (state) => {
    const count = clamp(levelRef.current - 2, 0, 6);
    const hazards = [];
    for (let i = 0; i < count; i++) {
      hazards.push(randomFreeCell(state.snake, hazards, state.food));
    }
    state.hazards = hazards;
  };

  const spawnFood = (state) => {
    const kind = Math.random() < 0.18 ? 'surge' : 'normal';
    state.food = { ...randomFreeCell(state.snake, state.hazards, null), kind };
  };

  const resolveHit = useCallback(() => {
    const state = gs.current;
    const head = state.snake[0] || { x: GRID / 2, y: GRID / 2 };
    const { x, y } = cellCenter(state, head.x, head.y);
    comboRef.current = 0;
    setCombo(0);
    livesRef.current -= 1;
    setLives(livesRef.current);
    setHurt(true);
    setTimeout(() => setHurt(false), 400);
    state.shake = 9;
    state.flash = 1;
    hitSound();
    spawnBurst(state.particles, x, y, '#ff5ec4', 16, 40, 200, 2, 5, 500);
    if (livesRef.current <= 0) { endGame(); return; }
    state.snake = makeSnake();
    directionRef.current = DIRS.right;
    nextDirectionRef.current = DIRS.right;
    spawnFood(state);
    setStatusMsg('Hit! Serpent reset — chase the orb again.');
  }, [hitSound, endGame]);

  const resolveEat = useCallback((state, kind) => {
    const head = state.snake[0];
    const { x, y } = cellCenter(state, head.x, head.y);
    comboRef.current += 1;
    setCombo(comboRef.current);
    if (kind === 'surge') {
      const gained = 30 + comboRef.current * 3;
      scoreRef.current += gained;
      surgeSound();
      spawnBurst(state.particles, x, y, '#ffd23d', 14, 40, 180, 2, 5, 450);
      state.snake.push({ ...state.snake[state.snake.length - 1] });
    } else {
      const gained = 10 + comboRef.current * 2;
      scoreRef.current += gained;
      eatSound(comboRef.current);
      spawnBurst(state.particles, x, y, '#3dffb0', 10, 30, 140, 2, 4, 400);
    }
    setScore(scoreRef.current);
    if (scoreRef.current > highScoreRef.current) {
      highScoreRef.current = scoreRef.current;
      localStorage.setItem(HS_KEY, String(scoreRef.current));
      setHighScore(scoreRef.current);
    }
    eatenRef.current += 1;
    if (eatenRef.current % 5 === 0) {
      levelRef.current += 1;
      setLevel(levelRef.current);
      levelUpSound();
      spawnHazards(state);
      setStatusMsg(`Level ${levelRef.current}! Faster serpent, watch for hazard cells.`);
    }
  }, [eatSound, surgeSound, levelUpSound]);

  const stepSnake = useCallback((state) => {
    directionRef.current = nextDirectionRef.current;
    const dir = directionRef.current;
    const head = state.snake[0];
    const nx = head.x + dir.x;
    const ny = head.y + dir.y;

    if (nx < 0 || nx >= GRID || ny < 0 || ny >= GRID) { resolveHit(); return; }
    if (state.hazards.some(h => h.x === nx && h.y === ny)) { resolveHit(); return; }

    const willGrow = nx === state.food.x && ny === state.food.y;
    const bodyToCheck = willGrow ? state.snake : state.snake.slice(0, -1);
    if (bodyToCheck.some(s => s.x === nx && s.y === ny)) { resolveHit(); return; }

    state.snake.unshift({ x: nx, y: ny });
    if (willGrow) {
      const kind = state.food.kind;
      resolveEat(state, kind);
      spawnFood(state);
    } else {
      state.snake.pop();
    }
  }, [resolveHit, resolveEat]);

  const setDirection = useCallback((key) => {
    if (phaseRef.current !== 'playing') return;
    const d = DIRS[key];
    if (!d) return;
    const cur = directionRef.current;
    if (d.x === -cur.x && d.y === -cur.y) return; // no instant reverse
    nextDirectionRef.current = d;
    turnSound();
  }, [turnSound]);

  const doPulse = useCallback(() => {
    if (phaseRef.current !== 'playing') return;
    const state = gs.current;
    const head = state.snake[0];
    if (!head) return;
    const { x, y } = cellCenter(state, head.x, head.y);
    pulseSound();
    spawnBurst(state.particles, x, y, '#5eeaff', 20, 60, 220, 2, 6, 550);
  }, [pulseSound]);

  useEffect(() => {
    const onKeyDown = (e) => {
      if (e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); setDirection('up'); }
      else if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); setDirection('down'); }
      else if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); setDirection('left'); }
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); setDirection('right'); }
      else if (e.code === 'Space') { e.preventDefault(); doPulse(); }
    };
    window.addEventListener('keydown', onKeyDown);
    return () => window.removeEventListener('keydown', onKeyDown);
  }, [setDirection, doPulse]);

  const handleTouchStart = useCallback((clientX, clientY) => {
    touchStartRef.current = { x: clientX, y: clientY };
  }, []);

  const handleTouchEnd = useCallback((clientX, clientY) => {
    const start = touchStartRef.current;
    touchStartRef.current = null;
    if (!start) return;
    const dx = clientX - start.x;
    const dy = clientY - start.y;
    if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
    if (Math.abs(dx) > Math.abs(dy)) setDirection(dx > 0 ? 'right' : 'left');
    else setDirection(dy > 0 ? 'down' : 'up');
  }, [setDirection]);

  const tick = useCallback((ts) => {
    const state = gs.current;
    if (!lastTsRef.current) lastTsRef.current = ts;
    let dt = (ts - lastTsRef.current) / 1000;
    dt = Math.min(dt, 0.05);
    lastTsRef.current = ts;

    if (phaseRef.current === 'playing') {
      state.level = levelRef.current;
      state.time += dt;
      const moveInterval = clamp(0.17 - (levelRef.current - 1) * 0.01, 0.075, 0.17);
      state.moveAccum += dt;
      let guard = 0;
      while (state.moveAccum >= moveInterval && guard < 5) {
        state.moveAccum -= moveInterval;
        stepSnake(state);
        guard++;
        if (phaseRef.current !== 'playing') break;
      }
    }

    for (let i = state.particles.length - 1; i >= 0; i--) {
      const pt = state.particles[i];
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.vx *= 0.94; pt.vy *= 0.94;
      pt.life -= dt * 1000;
      if (pt.life <= 0) state.particles.splice(i, 1);
    }
    if (state.particles.length > 160) state.particles.splice(0, state.particles.length - 160);

    if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 40);
    if (state.flash > 0) state.flash = Math.max(0, state.flash - dt * 3);

    draw(state, ts);
    rafRef.current = requestAnimationFrame(tick);
  }, [stepSnake]);

  const draw = (state, ts) => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const { w, h } = state.bounds;

    ctx.save();
    if (state.shake > 0) {
      ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
    }

    ctx.fillStyle = 'rgba(6,10,8,0.4)';
    ctx.fillRect(-20, -20, w + 40, h + 40);

    if (!state.bgGradient || state.bgGradientKey !== `${w}x${h}`) {
      const grad = ctx.createRadialGradient(w / 2, h / 2, 10, w / 2, h / 2, Math.max(w, h) * 0.8);
      grad.addColorStop(0, 'hsla(160, 55%, 14%, 1)');
      grad.addColorStop(1, 'rgba(5,8,7,0)');
      state.bgGradient = grad;
      state.bgGradientKey = `${w}x${h}`;
    }
    ctx.globalAlpha = 0.3 + Math.sin(ts / 3000) * 0.06;
    ctx.fillStyle = state.bgGradient;
    ctx.fillRect(0, 0, w, h);
    ctx.globalAlpha = 1;

    if (state.flash > 0) {
      ctx.fillStyle = `rgba(255,94,196,${state.flash * 0.18})`;
      ctx.fillRect(0, 0, w, h);
    }

    const { cell, offX, offY } = state;
    const R = cell * GRID;

    ctx.strokeStyle = 'rgba(61,255,176,0.06)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i <= GRID; i++) {
      ctx.moveTo(offX + i * cell, offY);
      ctx.lineTo(offX + i * cell, offY + R);
      ctx.moveTo(offX, offY + i * cell);
      ctx.lineTo(offX + R, offY + i * cell);
    }
    ctx.stroke();

    // hazards
    for (const hz of state.hazards) {
      const { x, y } = cellCenter(state, hz.x, hz.y);
      ctx.save();
      ctx.strokeStyle = '#ff2e4f';
      ctx.shadowColor = '#ff2e4f';
      ctx.shadowBlur = 10;
      ctx.lineWidth = 3;
      const s = cell * 0.28;
      ctx.beginPath();
      ctx.moveTo(x - s, y - s); ctx.lineTo(x + s, y + s);
      ctx.moveTo(x + s, y - s); ctx.lineTo(x - s, y + s);
      ctx.stroke();
      ctx.restore();
    }

    // food
    const food = state.food;
    if (food) {
      const { x, y } = cellCenter(state, food.x, food.y);
      const pulse = 0.75 + Math.sin(ts / 160) * 0.2;
      const color = food.kind === 'surge' ? '#ffd23d' : '#3dffb0';
      ctx.save();
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.arc(x, y, cell * 0.32 * pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // snake
    const snake = state.snake;
    for (let i = snake.length - 1; i >= 0; i--) {
      const seg = snake[i];
      const { x, y } = cellCenter(state, seg.x, seg.y);
      const isHead = i === 0;
      const t = 1 - i / Math.max(1, snake.length - 1);
      const color = isHead ? '#eafcff' : `rgba(61,255,176,${0.55 + t * 0.4})`;
      ctx.save();
      ctx.fillStyle = color;
      ctx.shadowColor = isHead ? '#5eeaff' : '#3dffb0';
      ctx.shadowBlur = isHead ? 14 : 6;
      const size = cell * (isHead ? 0.42 : 0.36);
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x - size, y - size, size * 2, size * 2, 5) : ctx.rect(x - size, y - size, size * 2, size * 2);
      ctx.fill();
      ctx.restore();
    }

    // particles
    for (const pt of state.particles) {
      ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.restore();
  };

  const startGame = () => {
    resizeCanvas();
    const state = makeGameState();
    state.bounds = gs.current.bounds;
    state.cell = gs.current.cell;
    state.offX = gs.current.offX;
    state.offY = gs.current.offY;
    state.running = true;
    gs.current = state;
    directionRef.current = DIRS.right;
    nextDirectionRef.current = DIRS.right;
    scoreRef.current = 0;
    comboRef.current = 0;
    livesRef.current = LIVES_START;
    levelRef.current = 1;
    eatenRef.current = 0;
    lastTsRef.current = 0;
    setScore(0);
    setCombo(0);
    setLives(LIVES_START);
    setLevel(1);
    setStatusMsg('Steer with arrows / WASD / D-pad / swipe. Space pulses a shockwave.');
    setPhase('playing');
    phaseRef.current = 'playing';
    cancelAnimationFrame(rafRef.current);
    rafRef.current = requestAnimationFrame(tick);
  };

  const startGameRef = useRef(startGame);
  useEffect(() => { startGameRef.current = startGame; });

  useEffect(() => () => cancelAnimationFrame(rafRef.current), []);

  return (
    <div className="app" data-testid="game-canvas">
      <div className="hud">
        <div className="hudBox">
          <div className="hudLabel">Score</div>
          <div className="hudValue" data-testid="score">{score}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Lives</div>
          <div className={`hudValue lives ${hurt ? 'hurt' : ''}`} data-testid="lives">{'❤'.repeat(Math.max(0, lives))}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Combo</div>
          <div className="hudValue combo" data-testid="combo">x{combo}</div>
        </div>
      </div>

      <div className="title">VOLT SERPENT</div>

      <div
        className="arenaOuter"
        ref={arenaRef}
        data-testid="play-field"
        onClick={() => { if (phaseRef.current === 'over') startGameRef.current(); }}
        onTouchStart={(e) => {
          if (phaseRef.current !== 'playing') return;
          e.preventDefault();
          const t = e.touches[0]; if (t) handleTouchStart(t.clientX, t.clientY);
        }}
        onTouchEnd={(e) => {
          if (phaseRef.current !== 'playing') return;
          e.preventDefault();
          const t = e.changedTouches[0];
          if (t) handleTouchEnd(t.clientX, t.clientY);
        }}
      >
        <canvas ref={canvasRef} data-testid="arena" />

        {phase === 'start' && (
          <div className="overlay">
            <div className="subtitle">Guide your neon serpent across the grid to devour glowing orbs and grow longer. Gold orbs are worth extra and add two segments. Chain eats for a rising combo, but hit a wall, a red hazard, or your own tail and you lose one of three lives — the serpent resets to size but your score and level survive.<br />Steer with arrow keys, WASD, the on-screen pad, or swipe. Space triggers a cosmetic shockwave pulse. Every 5 orbs eaten speeds up the serpent and adds hazard cells.</div>
            <div className="highscoreLine" data-testid="high-score">Best: {highScore}</div>
            <button className="btn" data-testid="start-btn" onClick={(e) => { e.stopPropagation(); startGame(); }}>START</button>
          </div>
        )}

        {phase === 'over' && (
          <div className="overlay">
            <div className="title" style={{ fontSize: 'clamp(20px, 6vw, 30px)', marginTop: 0 }}>SERPENT DOWN</div>
            <div className="hudValue" data-testid="final-score">Score: {score}</div>
            <div className="highscoreLine" data-testid="high-score-final">Best: {highScore}</div>
            <button className="btn" data-testid="restart-btn" onClick={(e) => { e.stopPropagation(); startGame(); }}>PLAY AGAIN</button>
          </div>
        )}
      </div>

      {phase === 'playing' && (
        <div className="dpad">
          <button className="dpadBtn dpadUp" data-testid="dir-up-btn"
            onClick={(e) => { e.stopPropagation(); setDirection('up'); }}
            onTouchStart={(e) => { e.stopPropagation(); e.preventDefault(); setDirection('up'); }}>▲</button>
          <button className="dpadBtn dpadLeft" data-testid="dir-left-btn"
            onClick={(e) => { e.stopPropagation(); setDirection('left'); }}
            onTouchStart={(e) => { e.stopPropagation(); e.preventDefault(); setDirection('left'); }}>◀</button>
          <button className="dpadBtn dpadRight" data-testid="dir-right-btn"
            onClick={(e) => { e.stopPropagation(); setDirection('right'); }}
            onTouchStart={(e) => { e.stopPropagation(); e.preventDefault(); setDirection('right'); }}>▶</button>
          <button className="dpadBtn dpadDown" data-testid="dir-down-btn"
            onClick={(e) => { e.stopPropagation(); setDirection('down'); }}
            onTouchStart={(e) => { e.stopPropagation(); e.preventDefault(); setDirection('down'); }}>▼</button>
        </div>
      )}

      <div className="status">{statusMsg}</div>
      <div className="footer">Volt Serpent — Level {level} — grow long, don't bite the grid or yourself</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
