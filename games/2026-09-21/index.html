<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Halo Snap</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05030c; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }
  #root { width: 100%; height: 100%; }

  .app {
    width: 100%; height: 100%; position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; overflow: hidden; gap: 6px; padding: 6px 0;
    background: radial-gradient(circle at 50% 6%, #0a1a24 0%, #070a14 55%, #030208 100%);
  }

  .hud {
    position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-around;
    padding: 10px 12px; z-index: 15; pointer-events: none;
  }
  .hudBox { text-align: center; }
  .hudLabel { font-size: 10px; letter-spacing: 2px; color: #4de8ff; text-transform: uppercase; }
  .hudValue {
    font-size: 22px; font-weight: 800; color: #fff;
    text-shadow: 0 0 10px #4de8ff, 0 0 20px #4de8ff;
  }
  .hudValue.combo { color: #ffd23d; text-shadow: 0 0 10px #ffd23d, 0 0 22px #b3860a; }
  .hudValue.lives { color: #ff5e6c; text-shadow: 0 0 10px #ff5e6c, 0 0 22px #c90022; }
  .hudValue.hurt { animation: hurtPulse 0.4s ease; }
  @keyframes hurtPulse { 0%,100% { opacity:1; transform: scale(1);} 50% { opacity:0.4; transform: scale(1.25);} }

  .title {
    font-size: clamp(18px, 5vw, 30px); font-weight: 900; letter-spacing: 3px; margin-top: 34px;
    background: linear-gradient(90deg, #4de8ff, #b76dff, #ffd23d);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(77,232,255,0.6));
    animation: titlePulse 2.4s ease-in-out infinite;
    text-align: center;
  }
  @keyframes titlePulse { 0%,100% { filter: drop-shadow(0 0 12px rgba(77,232,255,0.6)); } 50% { filter: drop-shadow(0 0 26px rgba(183,109,255,0.85)); } }

  .subtitle { color: #b8c8d0; font-size: 13px; letter-spacing: 0.5px; text-align: center; max-width: 460px; line-height: 1.55; }

  .btn {
    padding: 15px 40px; font-size: 19px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(135deg, #4de8ff, #b76dff);
    border: none; border-radius: 50px; color: #06121a; cursor: pointer;
    box-shadow: 0 0 20px rgba(77,232,255,0.7), 0 0 50px rgba(183,109,255,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(77,232,255,0.9), 0 0 70px rgba(183,109,255,0.5); }
  .btn:active { transform: scale(0.96); }

  .highscoreLine { color: #ffd23d; font-size: 14px; text-shadow: 0 0 8px rgba(255,210,61,0.6); }

  .instructionBar {
    display: flex; align-items: center; justify-content: center; z-index: 12;
    margin-top: 46px; min-height: 26px; padding: 0 12px;
  }
  .instructionLabel {
    font-size: 10px; letter-spacing: 2px; color: #7a8a9a; text-transform: uppercase; margin-right: 6px;
  }
  .instructionText {
    font-size: 15px; font-weight: 800; letter-spacing: 1px; color: #fff;
    text-shadow: 0 0 8px #4de8ff, 0 0 16px rgba(77,232,255,0.5);
  }
  .instructionText.pulseWarn { color: #ffd23d; text-shadow: 0 0 8px #ffd23d, 0 0 18px rgba(255,210,61,0.6); }

  .fieldOuter {
    position: relative; width: min(90vw, 460px); height: min(46vh, 340px); z-index: 5;
    border-radius: 18px; overflow: hidden; border: 2px solid rgba(77,232,255,0.25);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 0 30px rgba(77,232,255,0.12);
    background: #060a0f; touch-action: none; margin-top: 4px;
  }
  .fieldOuter.shakeIt { animation: shakeKf 0.3s ease; }
  @keyframes shakeKf {
    0%, 100% { transform: translate(0,0); }
    20% { transform: translate(-6px, 3px); }
    40% { transform: translate(6px, -3px); }
    60% { transform: translate(-5px, -2px); }
    80% { transform: translate(5px, 2px); }
  }

  canvas.gameCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .flashOverlay {
    position: absolute; inset: 0; z-index: 9; pointer-events: none; background: rgba(255,46,79,0);
  }
  .flashOverlay.bad { animation: flashBadKf 0.3s ease; }
  @keyframes flashBadKf { 0% { background: rgba(255,46,79,0.32); } 100% { background: rgba(255,46,79,0); } }
  .flashOverlay.good { animation: flashGoodKf 0.35s ease; }
  @keyframes flashGoodKf { 0% { background: rgba(77,232,255,0.28); } 100% { background: rgba(77,232,255,0); } }
  .flashOverlay.perfect { animation: flashPerfectKf 0.4s ease; }
  @keyframes flashPerfectKf { 0% { background: rgba(255,210,61,0.34); } 100% { background: rgba(255,210,61,0); } }

  .overlay {
    position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 18px;
    background: rgba(6, 10, 15, 0.92); backdrop-filter: blur(4px);
  }

  .controlsRow {
    display: flex; gap: 12px; z-index: 10; margin-top: 2px; width: min(90vw, 380px); justify-content: center;
  }
  .snapBtn {
    height: 54px; min-width: 140px; border-radius: 14px; cursor: pointer;
    background: linear-gradient(135deg, rgba(77,232,255,0.22), rgba(183,109,255,0.14));
    border: 2px solid rgba(77,232,255,0.45); color: #d7f6ff; font-size: 17px; font-weight: 900;
    letter-spacing: 1.5px;
    box-shadow: 0 0 14px rgba(77,232,255,0.3);
    transition: transform 0.12s ease, background 0.12s ease;
  }
  .snapBtn:active { transform: scale(0.94); background: rgba(77,232,255,0.34); }

  .status { color: #9aa8b3; font-size: 12px; letter-spacing: 0.5px; height: 15px; z-index: 10; text-align: center; }
  .footer { position: relative; text-align: center; color: #171d20; font-size: 10px; z-index: 10; padding-bottom: 2px; }

  @media (max-width: 480px) {
    .hudValue { font-size: 17px; }
    .btn { padding: 13px 30px; font-size: 16px; }
    .subtitle { font-size: 12px; }
    .fieldOuter { height: min(38vh, 280px); }
    .instructionBar { margin-top: 40px; }
    .instructionText { font-size: 13px; }
    .snapBtn { height: 48px; font-size: 15px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const HS_KEY = 'haloSnapHighScore';
const LIVES_START = 3;

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function useAudio() {
  const ctxRef = useRef(null);
  const getCtx = () => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  };

  const tone = useCallback((freq, duration, type, gainScale, freqEnd) => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + duration);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(gainScale, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.05);
    } catch (e) {}
  }, []);

  const perfectSound = useCallback(() => { tone(760, 0.1, 'sine', 0.18, 1200); setTimeout(() => tone(1200, 0.12, 'sine', 0.14, 1600), 60); }, [tone]);
  const goodSound = useCallback(() => { tone(560, 0.09, 'sine', 0.15, 780); }, [tone]);
  const goldSound = useCallback(() => { tone(700, 0.1, 'sine', 0.18, 1100); setTimeout(() => tone(1100, 0.1, 'sine', 0.16, 1500), 70); setTimeout(() => tone(1500, 0.16, 'sine', 0.14, 2000), 140); }, [tone]);
  const buzzSound = useCallback(() => tone(160, 0.12, 'sawtooth', 0.12, 90), [tone]);
  const missSound = useCallback(() => tone(140, 0.35, 'sawtooth', 0.22, 40), [tone]);
  const overSound = useCallback(() => { tone(300, 0.25, 'sawtooth', 0.2, 200); setTimeout(() => tone(180, 0.35, 'sawtooth', 0.2, 80), 150); }, [tone]);
  const levelSound = useCallback(() => { tone(500, 0.1, 'square', 0.1, 900); setTimeout(() => tone(750, 0.12, 'square', 0.1, 1200), 90); }, [tone]);

  return { perfectSound, goodSound, goldSound, buzzSound, missSound, overSound, levelSound };
}

function spawnBurst(arr, x, y, color, count, speedMin, speedMax, sizeMin, sizeMax, lifeMs) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = speedMin + Math.random() * (speedMax - speedMin);
    arr.push({
      x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      life: lifeMs, maxLife: lifeMs, color,
      size: sizeMin + Math.random() * (sizeMax - sizeMin),
    });
  }
}

function simultaneousForLevel(level) { return clamp(1 + Math.floor(level / 2), 1, 4); }
function durationForLevel(level) { return clamp(2200 - level * 130, 950, 2200); }
function perfectTolForLevel(level) { return clamp(18 - level * 1, 8, 18); }
function coreRForLevel(level) { return clamp(22 - level * 0.4, 14, 22); }

let haloIdSeq = 1;

function App() {
  const [phase, setPhase] = useState('start'); // start | playing | over
  const [score, setScore] = useState(0);
  const [lives, setLives] = useState(LIVES_START);
  const [combo, setCombo] = useState(0);
  const [level, setLevel] = useState(1);
  const [hurt, setHurt] = useState(false);
  const [shakeIt, setShakeIt] = useState(false);
  const [flashKind, setFlashKind] = useState(null);
  const [instructionText, setInstructionText] = useState('SNAP THE HALOS AT THEIR CORE');
  const [highScore, setHighScore] = useState(() => parseInt(localStorage.getItem(HS_KEY) || '0', 10));
  const [statusMsg, setStatusMsg] = useState('Click or tap a halo the instant its ring reaches the core.');

  const canvasRef = useRef(null);
  const fieldRef = useRef(null);
  const particlesRef = useRef([]);
  const halosRef = useRef([]);
  const scoreRef = useRef(0);
  const comboRef = useRef(0);
  const livesRef = useRef(LIVES_START);
  const levelRef = useRef(1);
  const perfectStreakRef = useRef(0);
  const highScoreRef = useRef(highScore);
  const phaseRef = useRef('start');
  const dimsRef = useRef({ w: 300, h: 300 });
  const spawnTimerRef = useRef(0);

  const rafRef = useRef(null);
  const lastTsRef = useRef(null);
  const ambientTimeRef = useRef(0);
  const hurtTimeoutRef = useRef(null);
  const shakeTimeoutRef = useRef(null);
  const flashTimeoutRef = useRef(null);

  const { perfectSound, goodSound, goldSound, buzzSound, missSound, overSound, levelSound } = useAudio();

  useEffect(() => { phaseRef.current = phase; }, [phase]);

  const checkHighScore = useCallback(() => {
    if (scoreRef.current > highScoreRef.current) {
      highScoreRef.current = scoreRef.current;
      localStorage.setItem(HS_KEY, String(scoreRef.current));
      setHighScore(scoreRef.current);
    }
  }, []);

  const resizeCanvas = useCallback(() => {
    const canvas = canvasRef.current;
    const field = fieldRef.current;
    if (!canvas || !field) return;
    const rect = field.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dimsRef.current = { w: rect.width, h: rect.height };
  }, []);

  useEffect(() => {
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    return () => window.removeEventListener('resize', resizeCanvas);
  }, [resizeCanvas]);

  const endGame = useCallback(() => {
    phaseRef.current = 'over';
    setPhase('over');
    overSound();
    setStatusMsg('Signal lost.');
  }, [overSound]);

  const triggerHit = useCallback(() => {
    setHurt(true);
    clearTimeout(hurtTimeoutRef.current);
    hurtTimeoutRef.current = setTimeout(() => setHurt(false), 400);
    setShakeIt(true);
    clearTimeout(shakeTimeoutRef.current);
    shakeTimeoutRef.current = setTimeout(() => setShakeIt(false), 300);
    setFlashKind('bad');
    clearTimeout(flashTimeoutRef.current);
    flashTimeoutRef.current = setTimeout(() => setFlashKind(null), 300);
  }, []);

  const triggerFlash = useCallback((kind, ms) => {
    setFlashKind(kind);
    clearTimeout(flashTimeoutRef.current);
    flashTimeoutRef.current = setTimeout(() => setFlashKind(null), ms);
  }, []);

  const spawnHalo = useCallback(() => {
    const { w, h } = dimsRef.current;
    const coreR = coreRForLevel(levelRef.current);
    const maxR = coreR + 60 + Math.random() * 20;
    const pad = maxR + 14;
    if (w <= pad * 2 || h <= pad * 2) return;
    const gold = Math.random() < 0.14;
    halosRef.current.push({
      id: haloIdSeq++,
      x: pad + Math.random() * (w - pad * 2),
      y: pad + Math.random() * (h - pad * 2),
      coreR, maxR,
      duration: durationForLevel(levelRef.current),
      elapsed: 0,
      gold,
      grace: 380,
    });
  }, []);

  const resolveHaloHit = useCallback((halo) => {
    const p = clamp(halo.elapsed / halo.duration, 0, 1.6);
    const curR = halo.maxR - (halo.maxR - halo.coreR) * Math.min(p, 1) - (p > 1 ? (halo.coreR * (p - 1)) : 0);
    const diff = Math.abs(curR - halo.coreR);
    const perfectTol = perfectTolForLevel(levelRef.current);
    const goodTol = perfectTol * 2.4;
    const { w, h } = dimsRef.current;

    if (diff <= perfectTol) {
      comboRef.current += 1;
      setCombo(comboRef.current);
      const base = halo.gold ? 220 : 100;
      const gained = base + comboRef.current * 6;
      scoreRef.current += gained;
      setScore(scoreRef.current);
      if (halo.gold) goldSound(); else perfectSound();
      triggerFlash('perfect', 380);
      spawnBurst(particlesRef.current, halo.x, halo.y, halo.gold ? '#ffd23d' : '#4de8ff', 22, 50, 190, 1.8, 5.5, 480);
      checkHighScore();
      perfectStreakRef.current += 1;
      setStatusMsg('PERFECT!');
      const newLevel = Math.floor(perfectStreakRef.current / 6) + 1;
      if (newLevel !== levelRef.current) {
        levelRef.current = newLevel;
        setLevel(newLevel);
        levelSound();
        setStatusMsg(`Level ${newLevel}! Faster, tighter halos.`);
      }
      return true;
    } else if (diff <= goodTol) {
      comboRef.current += 1;
      setCombo(comboRef.current);
      const base = halo.gold ? 110 : 50;
      const gained = base + comboRef.current * 3;
      scoreRef.current += gained;
      setScore(scoreRef.current);
      goodSound();
      triggerFlash('good', 320);
      spawnBurst(particlesRef.current, halo.x, halo.y, '#7fe6ff', 12, 40, 140, 1.5, 4, 400);
      checkHighScore();
      setStatusMsg('Good snap.');
      return true;
    }
    return false;
  }, [perfectSound, goodSound, goldSound, triggerFlash, checkHighScore, levelSound]);

  const attemptClick = useCallback((px, py) => {
    if (phaseRef.current !== 'playing') return;
    const halos = halosRef.current;
    let bestIdx = -1;
    let bestDist = Infinity;
    for (let i = 0; i < halos.length; i++) {
      const h = halos[i];
      const dist = Math.hypot(px - h.x, py - h.y);
      const tapPad = Math.max(h.maxR, h.coreR) + 14;
      if (dist <= tapPad && dist < bestDist) { bestDist = dist; bestIdx = i; }
    }
    if (bestIdx === -1) {
      comboRef.current = 0;
      setCombo(0);
      buzzSound();
      triggerFlash('bad', 180);
      setStatusMsg('No halo there.');
      return;
    }
    const halo = halos[bestIdx];
    const hit = resolveHaloHit(halo);
    if (hit) halos.splice(bestIdx, 1);
    else {
      comboRef.current = 0;
      setCombo(0);
      buzzSound();
      triggerFlash('bad', 180);
      setStatusMsg('Off-beat.');
    }
  }, [buzzSound, triggerFlash, resolveHaloHit]);

  const attemptSnapUrgent = useCallback(() => {
    if (phaseRef.current !== 'playing') return;
    const halos = halosRef.current;
    if (!halos.length) return;
    let bestIdx = 0;
    let bestScore = Infinity;
    for (let i = 0; i < halos.length; i++) {
      const h = halos[i];
      const p = h.elapsed / h.duration;
      const curR = h.maxR - (h.maxR - h.coreR) * Math.min(p, 1);
      const diff = Math.abs(curR - h.coreR);
      if (diff < bestScore) { bestScore = diff; bestIdx = i; }
    }
    const halo = halos[bestIdx];
    const hit = resolveHaloHit(halo);
    if (hit) halos.splice(bestIdx, 1);
    else {
      comboRef.current = 0;
      setCombo(0);
      buzzSound();
      triggerFlash('bad', 180);
      setStatusMsg('Off-beat.');
    }
  }, [buzzSound, triggerFlash, resolveHaloHit]);

  const attemptClickRef = useRef(attemptClick);
  useEffect(() => { attemptClickRef.current = attemptClick; }, [attemptClick]);
  const attemptSnapUrgentRef = useRef(attemptSnapUrgent);
  useEffect(() => { attemptSnapUrgentRef.current = attemptSnapUrgent; }, [attemptSnapUrgent]);

  const handleCanvasPointer = useCallback((e) => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const x = clientX - rect.left;
    const y = clientY - rect.top;
    attemptClickRef.current(x, y);
  }, []);

  const resetGame = useCallback(() => {
    scoreRef.current = 0; setScore(0);
    comboRef.current = 0; setCombo(0);
    livesRef.current = LIVES_START; setLives(LIVES_START);
    levelRef.current = 1; setLevel(1);
    perfectStreakRef.current = 0;
    halosRef.current = [];
    particlesRef.current = [];
    spawnTimerRef.current = 0;
  }, []);

  const startGame = useCallback(() => {
    resizeCanvas();
    resetGame();
    setStatusMsg('Click or tap a halo the instant its ring reaches the core.');
    phaseRef.current = 'playing';
    setPhase('playing');
  }, [resizeCanvas, resetGame]);

  const startGameRef = useRef(null);
  useEffect(() => { startGameRef.current = startGame; }, [startGame]);

  useEffect(() => {
    const onKeyDown = (e) => {
      if (phaseRef.current !== 'playing') {
        if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); startGameRef.current && startGameRef.current(); }
        return;
      }
      if (['Space', 'Enter', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyA', 'KeyD', 'KeyW', 'KeyS'].includes(e.code)) {
        e.preventDefault();
        attemptSnapUrgentRef.current();
      }
    };
    window.addEventListener('keydown', onKeyDown);
    return () => window.removeEventListener('keydown', onKeyDown);
  }, []);

  useEffect(() => () => {
    clearTimeout(hurtTimeoutRef.current);
    clearTimeout(shakeTimeoutRef.current);
    clearTimeout(flashTimeoutRef.current);
  }, []);

  // Main loop: spawn, shrink, timeout detection, particles, drawing
  useEffect(() => {
    const loop = (ts) => {
      const canvas = canvasRef.current;
      if (canvas) {
        const ctx = canvas.getContext('2d');
        const { w, h } = dimsRef.current;

        if (lastTsRef.current == null) lastTsRef.current = ts;
        let dt = (ts - lastTsRef.current) / 1000;
        lastTsRef.current = ts;
        dt = clamp(dt, 0, 0.033);

        ambientTimeRef.current += dt * 1000;

        if (w > 10 && h > 10) {
          if (phaseRef.current === 'playing') {
            const halos = halosRef.current;
            for (let i = halos.length - 1; i >= 0; i--) {
              const halo = halos[i];
              halo.elapsed += dt * 1000;
              if (halo.elapsed >= halo.duration + halo.grace) {
                halos.splice(i, 1);
                comboRef.current = 0;
                setCombo(0);
                livesRef.current -= 1;
                setLives(livesRef.current);
                triggerHit();
                missSound();
                spawnBurst(particlesRef.current, halo.x, halo.y, '#ff3a5e', 16, 40, 160, 2, 5, 420);
                setInstructionText('MISSED HALO');
                if (livesRef.current <= 0) {
                  setStatusMsg('Too many misses!');
                  endGame();
                } else {
                  setStatusMsg('A halo collapsed!');
                }
              }
            }

            const cap = simultaneousForLevel(levelRef.current);
            spawnTimerRef.current -= dt * 1000;
            if (spawnTimerRef.current <= 0 && halosRef.current.length < cap) {
              spawnHalo();
              spawnTimerRef.current = 260 + Math.random() * 240;
            }

            setInstructionText((prev) => (prev === 'MISSED HALO' ? prev : 'SNAP THE HALOS AT THEIR CORE'));
          }

          particlesRef.current = particlesRef.current.filter((p) => p.life > 0);
          for (const p of particlesRef.current) {
            p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; p.life -= dt * 1000;
          }

          ctx.clearRect(0, 0, w, h);
          ctx.fillStyle = '#060a0f';
          ctx.fillRect(0, 0, w, h);

          const sweepY = ((ambientTimeRef.current / 9) % (h + 60)) - 30;
          const sweepGrad = ctx.createLinearGradient(0, sweepY - 30, 0, sweepY + 30);
          sweepGrad.addColorStop(0, 'rgba(77,232,255,0)');
          sweepGrad.addColorStop(0.5, 'rgba(77,232,255,0.05)');
          sweepGrad.addColorStop(1, 'rgba(77,232,255,0)');
          ctx.fillStyle = sweepGrad;
          ctx.fillRect(0, sweepY - 30, w, 60);

          // halos
          for (const halo of halosRef.current) {
            const p = clamp(halo.elapsed / halo.duration, 0, 1);
            const curR = halo.maxR - (halo.maxR - halo.coreR) * p;
            const color = halo.gold ? '#ffd23d' : '#4de8ff';
            const closeIn = 1 - Math.abs(curR - halo.coreR) / (halo.maxR - halo.coreR);

            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.shadowColor = color;
            ctx.shadowBlur = 8 + closeIn * 14;
            ctx.globalAlpha = 0.9;
            ctx.beginPath();
            ctx.arc(halo.x, halo.y, Math.max(curR, 2), 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();

            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.55;
            ctx.beginPath();
            ctx.arc(halo.x, halo.y, halo.coreR, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();

            ctx.save();
            ctx.fillStyle = color;
            ctx.globalAlpha = 0.85;
            ctx.beginPath();
            ctx.arc(halo.x, halo.y, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          for (const p of particlesRef.current) {
            const a = clamp(p.life / p.maxLife, 0, 1);
            ctx.save();
            ctx.globalAlpha = a;
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
          }
        }
      }
      rafRef.current = requestAnimationFrame(loop);
    };
    rafRef.current = requestAnimationFrame(loop);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [endGame, missSound, spawnHalo, triggerHit]);

  return (
    <div className="app">
      <div className="hud">
        <div className="hudBox">
          <div className="hudLabel">Score</div>
          <div className="hudValue" data-testid="score">{score}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Combo</div>
          <div className="hudValue combo" data-testid="combo">x{combo}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Level</div>
          <div className="hudValue" data-testid="level">{level}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Lives</div>
          <div className={"hudValue lives" + (hurt ? " hurt" : "")} data-testid="lives">{'♥'.repeat(Math.max(0, lives))}</div>
        </div>
      </div>

      {phase === 'playing' && (
        <div className="instructionBar" data-testid="instruction">
          <div className="instructionLabel">Halo</div>
          <div className="instructionText">{instructionText}</div>
        </div>
      )}

      {phase !== 'playing' && (
        <div style={{ marginTop: 34, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 14 }}>
          <div className="title">HALO SNAP</div>
          <div className="subtitle">
            Glowing halos bloom across the field, each ring shrinking down toward its core. Click or tap the instant the ring lands on the core for a PERFECT, or catch it a little early or late for a GOOD. Gold halos pay out big, missing the timing window entirely costs a life, and every 6 perfects levels you up with faster, tighter, more crowded halos. No keyboard or mouse handy for precise aiming? Press Space, Enter, or any arrow key to auto-snap whichever halo is closest to its core.
          </div>
        </div>
      )}

      <div
        className={"fieldOuter" + (shakeIt ? " shakeIt" : "")}
        data-testid="play-field"
        ref={fieldRef}
      >
        <canvas
          className="gameCanvas"
          data-testid="canvas"
          ref={canvasRef}
          onMouseDown={handleCanvasPointer}
          onTouchStart={(e) => { e.preventDefault(); handleCanvasPointer(e); }}
        ></canvas>
        <div className={"flashOverlay" + (flashKind ? " " + flashKind : "")}></div>

        {phase === 'start' && (
          <div className="overlay">
            <div className="highscoreLine">High Score: {highScore}</div>
            <button className="btn" data-testid="start-btn" onClick={startGame}>START</button>
          </div>
        )}

        {phase === 'over' && (
          <div className="overlay">
            <div className="title" style={{ marginTop: 0, fontSize: 26 }}>SIGNAL LOST</div>
            <div className="hudValue" style={{ fontSize: 30 }}>{score}</div>
            <div className="highscoreLine">High Score: {highScore}</div>
            <button className="btn" data-testid="start-btn" onClick={startGame}>RETRY</button>
          </div>
        )}
      </div>

      {phase === 'playing' && (
        <div className="controlsRow">
          <button
            className="snapBtn"
            data-testid="snap-btn"
            onClick={attemptSnapUrgent}
            onTouchStart={(e) => { e.preventDefault(); attemptSnapUrgent(); }}
          >SNAP NEAREST</button>
        </div>
      )}

      <div className="status">{statusMsg}</div>
      <div className="footer">Neon Game Arcade</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
