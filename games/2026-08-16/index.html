<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Polarity Dash</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05030d; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }
  #root { width: 100%; height: 100%; }

  .app {
    width: 100%; height: 100%; position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: center; overflow: hidden; gap: 8px;
    background: radial-gradient(circle at 50% 20%, #1a1030 0%, #0a0a18 55%, #030109 100%);
  }

  .hud {
    position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-around;
    padding: 10px 12px; z-index: 15; pointer-events: none;
  }
  .hudBox { text-align: center; }
  .hudLabel { font-size: 10px; letter-spacing: 2px; color: #c07cff; text-transform: uppercase; }
  .hudValue {
    font-size: 22px; font-weight: 800; color: #fff;
    text-shadow: 0 0 10px #ff5ee0, 0 0 20px #ff5ee0;
  }
  .hudValue.combo { color: #ffe45e; text-shadow: 0 0 10px #ffe45e, 0 0 22px #ff9d00; }
  .hudValue.lives { color: #5ef0ff; text-shadow: 0 0 10px #5ef0ff, 0 0 22px #00c3ff; }
  .hudValue.hurt { animation: hurtPulse 0.4s ease; }
  @keyframes hurtPulse { 0%,100% { opacity:1; transform: scale(1);} 50% { opacity:0.4; transform: scale(1.25);} }

  .title {
    font-size: clamp(22px, 6vw, 34px); font-weight: 900; letter-spacing: 3px;
    background: linear-gradient(90deg, #ff5ee0, #b26bff, #5ef0ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(200,110,255,0.6));
    animation: titlePulse 2.4s ease-in-out infinite;
    text-align: center;
  }
  @keyframes titlePulse { 0%,100% { filter: drop-shadow(0 0 12px rgba(200,110,255,0.6)); } 50% { filter: drop-shadow(0 0 26px rgba(200,110,255,0.95)); } }

  .subtitle { color: #cbb8e8; font-size: 14px; letter-spacing: 0.5px; text-align: center; max-width: 360px; line-height: 1.5; }

  .btn {
    padding: 15px 40px; font-size: 19px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(135deg, #b040ff, #ff4ecb);
    border: none; border-radius: 50px; color: #fff; cursor: pointer;
    box-shadow: 0 0 20px rgba(190,60,255,0.7), 0 0 50px rgba(255,80,200,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(190,60,255,0.9), 0 0 70px rgba(255,80,200,0.5); }
  .btn:active { transform: scale(0.96); }

  .highscoreLine { color: #ffd35e; font-size: 14px; text-shadow: 0 0 8px rgba(255,200,50,0.6); }

  .arenaOuter {
    position: relative; width: min(94vw, 640px); height: min(64vh, 440px); z-index: 5;
    border-radius: 20px; overflow: hidden; border: 2px solid rgba(180,100,255,0.25);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 0 30px rgba(180,80,255,0.15);
    background: #08061a; cursor: pointer;
  }

  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .overlay {
    position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 20px;
    background: rgba(6, 4, 15, 0.85); backdrop-filter: blur(4px);
  }

  .status { color: #cbaee8; font-size: 13px; letter-spacing: 0.5px; height: 16px; z-index: 10; text-align: center; }

  .footer { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; color: #5a4a6a; font-size: 11px; z-index: 10; }

  @media (max-width: 480px) {
    .hudValue { font-size: 17px; }
    .btn { padding: 13px 30px; font-size: 16px; }
    .subtitle { font-size: 13px; }
    .arenaOuter { height: min(58vh, 440px); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const HS_KEY = 'polarityDash_highScore';
const ORB_RADIUS = 14;
const LIVES_START = 3;
const INVULN_MS = 1000;
const FLIP_MS = 140;
const LANE_MARGIN = 46;

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function useAudio() {
  const ctxRef = useRef(null);
  const getCtx = () => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  };

  const tone = useCallback((freq, duration, type, gainScale, freqEnd) => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + duration);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(gainScale, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.05);
    } catch (e) {}
  }, []);

  const flipSound = useCallback(() => tone(520, 0.1, 'square', 0.08, 900), [tone]);
  const shardSound = useCallback(() => tone(700, 0.12, 'triangle', 0.16, 1100), [tone]);
  const hitSound = useCallback(() => tone(150, 0.3, 'sawtooth', 0.22, 60), [tone]);
  const overSound = useCallback(() => {
    tone(320, 0.25, 'sawtooth', 0.2, 220);
    setTimeout(() => tone(200, 0.35, 'sawtooth', 0.2, 90), 150);
  }, [tone]);

  return { flipSound, shardSound, hitSound, overSound };
}

function makeGameState() {
  return {
    bounds: { w: 640, h: 440 },
    player: { x: 110, pole: 1, poleAnim: 1, spin: 0 }, // pole: 1 = floor, -1 = ceiling
    obstacles: [],
    shards: [],
    particles: [],
    spawnTimer: 900,
    shardTimer: 1400,
    elapsed: 0,
    distance: 0,
    invulnUntil: 0,
    shake: 0,
    speed: 210,
    running: false,
  };
}

function App() {
  const [phase, setPhase] = useState('start'); // start | playing | over
  const [score, setScore] = useState(0);
  const [lives, setLives] = useState(LIVES_START);
  const [combo, setCombo] = useState(0);
  const [hurt, setHurt] = useState(false);
  const [highScore, setHighScore] = useState(() => parseInt(localStorage.getItem(HS_KEY) || '0', 10));
  const [statusMsg, setStatusMsg] = useState('Tap, click, or press Space to flip gravity.');

  const canvasRef = useRef(null);
  const arenaRef = useRef(null);
  const gs = useRef(makeGameState());
  const rafRef = useRef(null);
  const lastTsRef = useRef(0);
  const scoreRef = useRef(0);
  const comboRef = useRef(0);
  const livesRef = useRef(LIVES_START);
  const highScoreRef = useRef(highScore);
  const phaseRef = useRef('start');
  const { flipSound, shardSound, hitSound, overSound } = useAudio();

  useEffect(() => { phaseRef.current = phase; }, [phase]);

  const resizeCanvas = useCallback(() => {
    const canvas = canvasRef.current;
    const arena = arenaRef.current;
    if (!canvas || !arena) return;
    const rect = arena.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    gs.current.bounds = { w: rect.width, h: rect.height };
  }, []);

  useEffect(() => {
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    return () => window.removeEventListener('resize', resizeCanvas);
  }, [resizeCanvas]);

  const doFlip = useCallback(() => {
    if (phaseRef.current !== 'playing') return;
    const p = gs.current.player;
    p.pole *= -1;
    p.spin += Math.PI;
    flipSound();
  }, [flipSound]);

  // Keyboard input
  useEffect(() => {
    const down = (e) => {
      if (['Space', 'ArrowUp', 'ArrowDown', 'KeyW', 'KeyS'].includes(e.code)) e.preventDefault();
      if (['Space', 'ArrowUp', 'ArrowDown', 'KeyW', 'KeyS'].includes(e.code) && !e.repeat) doFlip();
    };
    window.addEventListener('keydown', down, { passive: false });
    return () => window.removeEventListener('keydown', down);
  }, [doFlip]);

  // Pointer (mouse+touch) flip
  useEffect(() => {
    const arena = arenaRef.current;
    if (!arena) return;
    const onDown = (e) => { e.preventDefault(); doFlip(); };
    arena.addEventListener('pointerdown', onDown);
    return () => arena.removeEventListener('pointerdown', onDown);
  }, [doFlip]);

  const spawnBurst = (arr, x, y, color, count, speedMin, speedMax, sizeMin, sizeMax, lifeMs) => {
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = speedMin + Math.random() * (speedMax - speedMin);
      arr.push({
        x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
        life: lifeMs, maxLife: lifeMs, color,
        size: sizeMin + Math.random() * (sizeMax - sizeMin),
      });
    }
  };

  const spawnObstacle = (state) => {
    const { w, h } = state.bounds;
    const pole = Math.random() < 0.5 ? 1 : -1;
    const tall = 34 + Math.random() * 26;
    state.obstacles.push({ x: w + 30, pole, height: tall, hue: pole === 1 ? 340 : 200, scored: false });
  };

  const spawnShard = (state) => {
    const { w } = state.bounds;
    const pole = Math.random() < 0.5 ? 1 : -1;
    state.shards.push({ x: w + 30, pole, life: true, pulse: Math.random() * 10 });
  };

  const endGame = useCallback(() => {
    gs.current.running = false;
    phaseRef.current = 'over';
    setPhase('over');
    overSound();
    setStatusMsg('Field collapsed.');
  }, [overSound]);

  const railY = (state, pole) => {
    const { h } = state.bounds;
    return pole === 1 ? h - LANE_MARGIN : LANE_MARGIN;
  };

  const tick = useCallback((ts) => {
    const state = gs.current;
    if (!state.running) return;
    if (!lastTsRef.current) lastTsRef.current = ts;
    let dt = (ts - lastTsRef.current) / 1000;
    dt = Math.min(dt, 0.05);
    lastTsRef.current = ts;
    state.elapsed += dt * 1000;

    const { w, h } = state.bounds;
    const player = state.player;

    // smooth pole animation
    const target = player.pole;
    player.poleAnim += (target - player.poleAnim) * Math.min(1, dt * (1000 / FLIP_MS));
    player.spin *= Math.exp(-dt * 6);

    // difficulty ramp
    state.speed = 210 + Math.min(230, (state.elapsed / 1000) * 6);

    // spawn obstacles
    state.spawnTimer -= dt * 1000;
    if (state.spawnTimer <= 0) {
      spawnObstacle(state);
      const interval = Math.max(700, 1450 - (state.elapsed / 1000) * 10);
      state.spawnTimer = interval * (0.75 + Math.random() * 0.5);
    }

    // spawn shards
    state.shardTimer -= dt * 1000;
    if (state.shardTimer <= 0) {
      spawnShard(state);
      state.shardTimer = 1100 + Math.random() * 900;
    }

    // update obstacles
    const playerY = h / 2 + (railY(state, 1) - h / 2) * Math.max(0, player.poleAnim) + (railY(state, -1) - h / 2) * Math.max(0, -player.poleAnim);
    let scoreDelta = 0;
    for (let i = state.obstacles.length - 1; i >= 0; i--) {
      const ob = state.obstacles[i];
      ob.x -= state.speed * dt;
      if (ob.x < -40) {
        state.obstacles.splice(i, 1);
        continue;
      }
      if (!ob.scored && ob.x < player.x) {
        ob.scored = true;
        scoreDelta += 5;
      }
      const obY = railY(state, ob.pole);
      const closeX = Math.abs(ob.x - player.x) < ORB_RADIUS + 10;
      const samePole = ob.pole === player.pole && Math.abs(player.poleAnim - player.pole) < 0.35;
      if (ts >= state.invulnUntil && closeX && samePole) {
        state.obstacles.splice(i, 1);
        state.invulnUntil = ts + INVULN_MS;
        state.shake = 12;
        comboRef.current = 0;
        setCombo(0);
        livesRef.current -= 1;
        setLives(livesRef.current);
        setHurt(true);
        setTimeout(() => setHurt(false), 400);
        hitSound();
        spawnBurst(state.particles, player.x, obY, '#ff4d6d', 18, 60, 220, 2, 6, 550);
        if (livesRef.current <= 0) {
          if (scoreDelta) { scoreRef.current += scoreDelta; scoreDelta = 0; setScore(scoreRef.current); }
          endGame();
          return;
        }
      }
    }

    // update shards
    for (let i = state.shards.length - 1; i >= 0; i--) {
      const sh = state.shards[i];
      sh.x -= state.speed * dt;
      sh.pulse += dt * 6;
      if (sh.x < -40) { state.shards.splice(i, 1); continue; }
      const closeX = Math.abs(sh.x - player.x) < ORB_RADIUS + 12;
      const samePole = sh.pole === player.pole && Math.abs(player.poleAnim - player.pole) < 0.35;
      if (closeX && samePole) {
        state.shards.splice(i, 1);
        comboRef.current += 1;
        setCombo(comboRef.current);
        const gained = 10 + comboRef.current * 2;
        scoreDelta += gained;
        shardSound();
        spawnBurst(state.particles, sh.x, railY(state, sh.pole), '#ffe45e', 14, 40, 160, 2, 5, 500);
      }
    }

    if (scoreDelta) {
      scoreRef.current += scoreDelta;
      if (scoreRef.current > highScoreRef.current) {
        highScoreRef.current = scoreRef.current;
        localStorage.setItem(HS_KEY, String(scoreRef.current));
        setHighScore(scoreRef.current);
      }
      setScore(scoreRef.current);
    }

    // particles
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const pt = state.particles[i];
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.vx *= 0.94; pt.vy *= 0.94;
      pt.life -= dt * 1000;
      if (pt.life <= 0) state.particles.splice(i, 1);
    }
    if (state.particles.length > 300) state.particles.splice(0, state.particles.length - 300);

    if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 40);

    draw(state, ts, playerY);
    rafRef.current = requestAnimationFrame(tick);
  }, [endGame, shardSound, hitSound]);

  const draw = (state, ts, playerY) => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const { w, h } = state.bounds;
    const player = state.player;

    ctx.save();
    if (state.shake > 0) {
      ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
    }

    ctx.fillStyle = 'rgba(8,6,26,0.35)';
    ctx.fillRect(-20, -20, w + 40, h + 40);

    // rails
    ctx.strokeStyle = 'rgba(180,100,255,0.35)';
    ctx.lineWidth = 3;
    ctx.shadowColor = 'rgba(180,100,255,0.6)';
    ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.moveTo(0, railY(state, 1) + ORB_RADIUS + 6); ctx.lineTo(w, railY(state, 1) + ORB_RADIUS + 6); ctx.stroke();
    ctx.strokeStyle = 'rgba(90,220,255,0.35)';
    ctx.beginPath(); ctx.moveTo(0, railY(state, -1) - ORB_RADIUS - 6); ctx.lineTo(w, railY(state, -1) - ORB_RADIUS - 6); ctx.stroke();
    ctx.shadowBlur = 0;

    // scrolling grid
    ctx.strokeStyle = 'rgba(150,90,255,0.05)';
    ctx.lineWidth = 1;
    const gridSize = 40;
    const offset = (state.elapsed * state.speed / 1000) % gridSize;
    for (let x = -offset; x < w; x += gridSize) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }

    // obstacles (spikes)
    for (const ob of state.obstacles) {
      const isFloor = ob.pole === 1;
      const baseY = isFloor ? h : 0;
      const dir = isFloor ? -1 : 1;
      ctx.fillStyle = `hsl(${ob.hue},100%,60%)`;
      ctx.shadowColor = `hsl(${ob.hue},100%,60%)`;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(ob.x - 16, baseY);
      ctx.lineTo(ob.x + 16, baseY);
      ctx.lineTo(ob.x, baseY + dir * ob.height);
      ctx.closePath();
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // shards
    for (const sh of state.shards) {
      const y = railY(state, sh.pole);
      const pulse = 1 + Math.sin(sh.pulse) * 0.25;
      ctx.save();
      ctx.translate(sh.x, y);
      ctx.rotate(sh.pulse * 0.5);
      ctx.fillStyle = '#ffe45e';
      ctx.shadowColor = '#ffe45e';
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.moveTo(0, -9 * pulse);
      ctx.lineTo(7 * pulse, 0);
      ctx.lineTo(0, 9 * pulse);
      ctx.lineTo(-7 * pulse, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.shadowBlur = 0;

    // particles
    for (const pt of state.particles) {
      ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // player orb
    const invuln = ts < state.invulnUntil;
    ctx.save();
    ctx.translate(player.x, playerY);
    ctx.rotate(player.spin);
    if (invuln && Math.floor(ts / 90) % 2 === 0) ctx.globalAlpha = 0.4;
    const grad = ctx.createRadialGradient(0, 0, 2, 0, 0, ORB_RADIUS + 6);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.4, '#ff5ee0');
    grad.addColorStop(1, '#7c2bff');
    ctx.fillStyle = grad;
    ctx.shadowColor = '#ff5ee0';
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.arc(0, 0, ORB_RADIUS, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-ORB_RADIUS * 0.6, 0); ctx.lineTo(ORB_RADIUS * 0.6, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -ORB_RADIUS * 0.6); ctx.lineTo(0, ORB_RADIUS * 0.6); ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    ctx.restore();
  };

  const startGame = () => {
    resizeCanvas();
    const state = makeGameState();
    state.bounds = gs.current.bounds;
    state.player.x = Math.max(90, state.bounds.w * 0.18);
    state.running = true;
    gs.current = state;
    scoreRef.current = 0;
    comboRef.current = 0;
    livesRef.current = LIVES_START;
    lastTsRef.current = 0;
    setScore(0);
    setCombo(0);
    setLives(LIVES_START);
    setStatusMsg('Tap, click, or press Space to flip gravity.');
    setPhase('playing');
    phaseRef.current = 'playing';
    cancelAnimationFrame(rafRef.current);
    rafRef.current = requestAnimationFrame(tick);
  };

  useEffect(() => () => cancelAnimationFrame(rafRef.current), []);

  return (
    <div className="app" data-testid="game-canvas">
      <div className="hud">
        <div className="hudBox">
          <div className="hudLabel">Score</div>
          <div className="hudValue" data-testid="score">{score}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Lives</div>
          <div className={`hudValue lives ${hurt ? 'hurt' : ''}`} data-testid="lives">{'❤'.repeat(Math.max(0, lives))}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Combo</div>
          <div className="hudValue combo" data-testid="combo">x{combo}</div>
        </div>
      </div>

      <div className="title" style={{ marginTop: 36 }}>POLARITY DASH</div>

      <div className="arenaOuter" ref={arenaRef} data-testid="flip-zone">
        <canvas ref={canvasRef} data-testid="arena" />

        {phase === 'start' && (
          <div className="overlay">
            <div className="subtitle">Your orb auto-runs forward, clinging to the floor or ceiling rail.<br />Tap, click, or press Space to flip gravity and dodge spikes.<br />Grab yellow shards on your current rail for a rising combo!</div>
            <div className="highscoreLine" data-testid="high-score">Best: {highScore}</div>
            <button className="btn" data-testid="start-btn" onClick={startGame}>START</button>
          </div>
        )}

        {phase === 'over' && (
          <div className="overlay">
            <div className="title" style={{ fontSize: 'clamp(20px, 6vw, 30px)' }}>FIELD COLLAPSED</div>
            <div className="hudValue" data-testid="final-score">Score: {score}</div>
            <div className="highscoreLine" data-testid="high-score-final">Best: {highScore}</div>
            <button className="btn" data-testid="restart-btn" onClick={startGame}>PLAY AGAIN</button>
          </div>
        )}
      </div>

      <div className="status">{statusMsg}</div>
      <div className="footer">Polarity Dash — flip gravity to survive, chain shards for combo</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
