<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Neon Coil</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #05010f;
    font-family: 'Courier New', monospace;
    touch-action: none;
    user-select: none;
  }
  #root { width: 100%; height: 100%; position: relative; }
  canvas { display: block; touch-action: none; }
  .hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 14px 18px; pointer-events: none; z-index: 5;
  }
  .hud-block {
    color: #eafcff;
    text-shadow: 0 0 8px #0ff, 0 0 16px #0ff;
    font-size: 18px; font-weight: bold; letter-spacing: 1px;
  }
  .hud-sub { font-size: 12px; color: #ff2fd6; text-shadow: 0 0 8px #ff2fd6; margin-top: 4px; }
  .combo-badge {
    position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
    color: #ffe600; text-shadow: 0 0 10px #ffe600, 0 0 20px #ff8800;
    font-size: 22px; font-weight: bold; opacity: 0; transition: opacity 0.15s;
    pointer-events: none; z-index: 5;
  }
  .combo-badge.show { opacity: 1; }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 10;
    background: radial-gradient(circle at 50% 40%, rgba(20,0,40,0.85), rgba(2,0,10,0.96));
    text-align: center; padding: 20px;
  }
  .title {
    font-size: clamp(32px, 8vw, 64px); font-weight: 900; letter-spacing: 4px;
    background: linear-gradient(90deg, #0ff, #ff2fd6, #ffe600, #0ff);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 3s linear infinite;
    text-shadow: 0 0 30px rgba(0,255,255,0.4);
    margin: 0;
  }
  @keyframes shimmer { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }
  .subtitle { color: #9fe8ff; margin-top: 10px; font-size: clamp(13px, 3vw, 16px); letter-spacing: 1px; }
  .btn {
    margin-top: 26px; padding: 14px 36px; font-size: 18px; font-weight: bold;
    background: linear-gradient(135deg, #ff2fd6, #7b2fff);
    border: none; border-radius: 30px; color: #fff; cursor: pointer;
    box-shadow: 0 0 20px rgba(255, 47, 214, 0.7), 0 0 40px rgba(123, 47, 255, 0.4);
    letter-spacing: 2px; text-transform: uppercase;
    transition: transform 0.12s ease;
  }
  .btn:active { transform: scale(0.94); }
  .score-line { color: #fff; font-size: 20px; margin-top: 14px; text-shadow: 0 0 10px #0ff; }
  .hi-line { color: #ffe600; font-size: 15px; margin-top: 6px; text-shadow: 0 0 8px #ffe600; }
  .hint { color: #6ad; font-size: 12px; margin-top: 20px; opacity: 0.8; }

  .dpad {
    position: absolute; left: 0; right: 0; bottom: 18px;
    display: flex; justify-content: center; align-items: center;
    z-index: 6; pointer-events: none;
  }
  .dpad-grid {
    display: grid; grid-template-columns: 56px 56px 56px; grid-template-rows: 56px 56px 56px;
    gap: 4px; pointer-events: auto;
  }
  .dpad-btn {
    background: rgba(0, 255, 255, 0.08); border: 1px solid rgba(0,255,255,0.5);
    color: #0ff; font-size: 22px; border-radius: 10px; cursor: pointer;
    box-shadow: 0 0 10px rgba(0,255,255,0.35);
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .dpad-btn:active { background: rgba(0,255,255,0.3); }
  .dpad-empty { visibility: hidden; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-type="module">
const { useState, useEffect, useRef, useCallback } = React;

const HS_KEY = 'neonCoil_highScore';
const CELL = 22;

function rand(min, max) { return Math.random() * (max - min) + min; }
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }

const HEAD_COLOR = '#ffe600';
const BODY_COLORS = ['#0ff', '#2fd6ff', '#7b2fff', '#ff2fd6'];

function useAudio() {
  const ctxRef = useRef(null);
  const getCtx = useCallback(() => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  }, []);

  const beep = useCallback((freq, dur, type, gainVal) => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(gainVal || 0.08, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + dur);
    } catch (e) {}
  }, [getCtx]);

  return {
    eat: (combo) => beep(420 + Math.min(combo, 20) * 25, 0.12, 'square', 0.08),
    power: () => beep(700, 0.2, 'sawtooth', 0.09),
    combo: (n) => beep(600 + n * 20, 0.1, 'sine', 0.06),
    death: () => beep(90, 0.5, 'sawtooth', 0.12),
  };
}

function Game() {
  const canvasRef = useRef(null);
  const rafRef = useRef(null);

  const [hud, setHud] = useState({ score: 0, combo: 0, highScore: 0, length: 4 });
  const [phase, setPhase] = useState('start'); // start | playing | gameover
  const [comboFlash, setComboFlash] = useState(false);

  const audio = useAudio();

  const stateRef = useRef({
    cols: 20,
    rows: 20,
    offsetX: 0,
    offsetY: 0,
    snake: [],
    dir: { x: 1, y: 0 },
    queuedDirs: [],
    food: null,
    powerFood: null,
    particles: [],
    score: 0,
    combo: 0,
    lastEatTime: 0,
    moveTimer: 0,
    moveInterval: 160,
    running: false,
    shake: 0,
    dims: { w: window.innerWidth, h: window.innerHeight },
  });

  const flashCombo = useCallback(() => {
    setComboFlash(true);
    setTimeout(() => setComboFlash(false), 300);
  }, []);

  const computeGrid = useCallback(() => {
    const s = stateRef.current;
    const w = s.dims.w;
    const h = s.dims.h;
    const cols = Math.max(10, Math.floor(w / CELL));
    const rows = Math.max(10, Math.floor(h / CELL));
    s.cols = cols;
    s.rows = rows;
    s.offsetX = (w - cols * CELL) / 2;
    s.offsetY = (h - rows * CELL) / 2;
  }, []);

  const cellFree = useCallback((x, y, snake) => {
    return !snake.some(seg => seg.x === x && seg.y === y);
  }, []);

  const placeFood = useCallback(() => {
    const s = stateRef.current;
    let x, y, tries = 0;
    do {
      x = randInt(0, s.cols - 1);
      y = randInt(0, s.rows - 1);
      tries++;
    } while (!cellFree(x, y, s.snake) && tries < 200);
    s.food = { x, y, pulse: 0 };
  }, [cellFree]);

  const maybeSpawnPower = useCallback(() => {
    const s = stateRef.current;
    if (s.powerFood || Math.random() > 0.16) return;
    let x, y, tries = 0;
    do {
      x = randInt(0, s.cols - 1);
      y = randInt(0, s.rows - 1);
      tries++;
    } while ((!cellFree(x, y, s.snake) || (s.food && s.food.x === x && s.food.y === y)) && tries < 200);
    s.powerFood = { x, y, life: 6000 };
  }, [cellFree]);

  const spawnParticles = useCallback((cx, cy, color, count) => {
    const s = stateRef.current;
    for (let i = 0; i < count; i++) {
      s.particles.push({
        x: cx, y: cy,
        vx: rand(-140, 140),
        vy: rand(-140, 140),
        life: 1,
        color,
        size: rand(2, 4),
      });
    }
  }, []);

  const endGame = useCallback(() => {
    const s = stateRef.current;
    s.running = false;
    audio.death();
    s.shake = 16;
    const hi = Math.max(s.score, parseInt(localStorage.getItem(HS_KEY) || '0', 10));
    localStorage.setItem(HS_KEY, String(hi));
    setHud({ score: s.score, combo: s.combo, highScore: hi, length: s.snake.length });
    setPhase('gameover');
  }, [audio]);

  const startGame = useCallback(() => {
    const s = stateRef.current;
    computeGrid();
    const cx = Math.floor(s.cols / 2);
    const cy = Math.floor(s.rows / 2);
    s.snake = [
      { x: cx - 1, y: cy },
      { x: cx - 2, y: cy },
      { x: cx - 3, y: cy },
      { x: cx - 4, y: cy },
    ];
    s.dir = { x: 1, y: 0 };
    s.queuedDirs = [];
    s.particles = [];
    s.score = 0;
    s.combo = 0;
    s.lastEatTime = 0;
    s.moveTimer = 0;
    s.moveInterval = 160;
    s.shake = 0;
    s.powerFood = null;
    placeFood();
    s.running = true;
    const hi = parseInt(localStorage.getItem(HS_KEY) || '0', 10);
    setHud({ score: 0, combo: 0, highScore: hi, length: s.snake.length });
    setPhase('playing');
  }, [computeGrid, placeFood]);

  const queueDirection = useCallback((dx, dy) => {
    const s = stateRef.current;
    if (!s.running) return;
    const last = s.queuedDirs.length > 0 ? s.queuedDirs[s.queuedDirs.length - 1] : s.dir;
    if (dx === -last.x && dy === -last.y) return; // no reversing
    if (dx === last.x && dy === last.y) return;
    if (s.queuedDirs.length < 2) {
      s.queuedDirs.push({ x: dx, y: dy });
    }
  }, []);

  // resize
  useEffect(() => {
    function resize() {
      const canvas = canvasRef.current;
      if (!canvas) return;
      const w = window.innerWidth;
      const h = window.innerHeight;
      canvas.width = w;
      canvas.height = h;
      stateRef.current.dims = { w, h };
      computeGrid();
    }
    resize();
    window.addEventListener('resize', resize);
    return () => window.removeEventListener('resize', resize);
  }, [computeGrid]);

  // main loop
  useEffect(() => {
    let last = performance.now();

    function frame(now) {
      const dt = Math.min(now - last, 60);
      last = now;
      const s = stateRef.current;
      const canvas = canvasRef.current;

      if (s.running) {
        update(s, dt);
      }
      if (canvas) {
        draw(canvas.getContext('2d'), s);
      }
      rafRef.current = requestAnimationFrame(frame);
    }

    function tryEat(head) {
      const s = stateRef.current;
      let ate = false;
      if (s.food && head.x === s.food.x && head.y === s.food.y) {
        const now = performance.now();
        if (now - s.lastEatTime < 4000) {
          s.combo += 1;
        } else {
          s.combo = 1;
        }
        s.lastEatTime = now;
        const mult = 1 + Math.floor((s.combo - 1) / 3) * 0.5;
        const gained = Math.round(10 * mult);
        s.score += gained;
        const px = s.offsetX + head.x * CELL + CELL / 2;
        const py = s.offsetY + head.y * CELL + CELL / 2;
        spawnParticles(px, py, '#0ff', 14);
        audio.eat(s.combo);
        if (s.combo > 0 && s.combo % 3 === 0) {
          audio.combo(s.combo);
          flashCombo();
        }
        placeFood();
        maybeSpawnPower();
        s.moveInterval = Math.max(70, 160 - s.score / 8);
        ate = true;
      } else if (s.powerFood && head.x === s.powerFood.x && head.y === s.powerFood.y) {
        const mult = 1 + Math.floor(s.combo / 3) * 0.5;
        const gained = Math.round(40 * mult);
        s.score += gained;
        const px = s.offsetX + head.x * CELL + CELL / 2;
        const py = s.offsetY + head.y * CELL + CELL / 2;
        spawnParticles(px, py, '#ffe600', 26);
        audio.power();
        s.powerFood = null;
        ate = true;
      }
      return ate;
    }

    function update(s, dt) {
      if (s.powerFood) {
        s.powerFood.life -= dt;
        if (s.powerFood.life <= 0) s.powerFood = null;
      }

      s.moveTimer += dt;
      if (s.moveTimer >= s.moveInterval) {
        s.moveTimer = 0;

        if (s.queuedDirs.length > 0) {
          s.dir = s.queuedDirs.shift();
        }

        const head = s.snake[0];
        const nx = head.x + s.dir.x;
        const ny = head.y + s.dir.y;

        if (nx < 0 || ny < 0 || nx >= s.cols || ny >= s.rows) {
          endGame();
          return;
        }
        const bodyToCheck = s.snake.slice(0, s.snake.length - 1);
        if (bodyToCheck.some(seg => seg.x === nx && seg.y === ny)) {
          endGame();
          return;
        }

        const newHead = { x: nx, y: ny };
        s.snake.unshift(newHead);
        const grew = tryEat(newHead);
        if (!grew) {
          s.snake.pop();
        }

        setHud(h => ({ ...h, score: s.score, combo: s.combo, length: s.snake.length }));
      }

      for (let i = s.particles.length - 1; i >= 0; i--) {
        const p = s.particles[i];
        p.x += (p.vx * dt) / 1000;
        p.y += (p.vy * dt) / 1000;
        p.life -= dt / 600;
        if (p.life <= 0) s.particles.splice(i, 1);
      }

      if (s.shake > 0) s.shake = Math.max(0, s.shake - dt / 20);
    }

    function draw(ctx, s) {
      const { w, h } = s.dims;
      ctx.save();
      if (s.shake > 0) {
        ctx.translate(rand(-s.shake, s.shake), rand(-s.shake, s.shake));
      }

      const grad = ctx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, '#0a0420');
      grad.addColorStop(1, '#160030');
      ctx.fillStyle = grad;
      ctx.fillRect(-20, -20, w + 40, h + 40);

      ctx.strokeStyle = 'rgba(0,255,255,0.06)';
      ctx.lineWidth = 1;
      for (let x = 0; x <= s.cols; x++) {
        const px = s.offsetX + x * CELL;
        ctx.beginPath();
        ctx.moveTo(px, s.offsetY);
        ctx.lineTo(px, s.offsetY + s.rows * CELL);
        ctx.stroke();
      }
      for (let y = 0; y <= s.rows; y++) {
        const py = s.offsetY + y * CELL;
        ctx.beginPath();
        ctx.moveTo(s.offsetX, py);
        ctx.lineTo(s.offsetX + s.cols * CELL, py);
        ctx.stroke();
      }

      // border glow
      ctx.strokeStyle = 'rgba(255,47,214,0.5)';
      ctx.shadowColor = '#ff2fd6';
      ctx.shadowBlur = 14;
      ctx.strokeRect(s.offsetX, s.offsetY, s.cols * CELL, s.rows * CELL);
      ctx.shadowBlur = 0;

      // food
      if (s.food) {
        s.food.pulse += 0.12;
        const r = CELL * 0.32 + Math.sin(s.food.pulse) * 2;
        const fx = s.offsetX + s.food.x * CELL + CELL / 2;
        const fy = s.offsetY + s.food.y * CELL + CELL / 2;
        ctx.fillStyle = '#ff2fd6';
        ctx.shadowColor = '#ff2fd6';
        ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.arc(fx, fy, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      // power food
      if (s.powerFood) {
        const fx = s.offsetX + s.powerFood.x * CELL + CELL / 2;
        const fy = s.offsetY + s.powerFood.y * CELL + CELL / 2;
        ctx.fillStyle = '#ffe600';
        ctx.shadowColor = '#ffe600';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.arc(fx, fy, CELL * 0.36, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        // life ring
        const frac = Math.max(0, s.powerFood.life / 6000);
        ctx.strokeStyle = 'rgba(255,230,0,0.7)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(fx, fy, CELL * 0.55, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2);
        ctx.stroke();
      }

      // particles
      for (const p of s.particles) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;

      // snake
      for (let i = s.snake.length - 1; i >= 0; i--) {
        const seg = s.snake[i];
        const px = s.offsetX + seg.x * CELL;
        const py = s.offsetY + seg.y * CELL;
        const isHead = i === 0;
        const color = isHead ? HEAD_COLOR : BODY_COLORS[i % BODY_COLORS.length];
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = isHead ? 18 : 10;
        const pad = 2;
        const size = CELL - pad * 2;
        ctx.beginPath();
        ctx.roundRect(px + pad, py + pad, size, size, isHead ? 6 : 4);
        ctx.fill();
      }
      ctx.shadowBlur = 0;

      ctx.restore();
    }

    rafRef.current = requestAnimationFrame(frame);
    return () => cancelAnimationFrame(rafRef.current);
  }, [placeFood, maybeSpawnPower, spawnParticles, audio, flashCombo, endGame]);

  // keyboard
  useEffect(() => {
    function onKeyDown(e) {
      if (phase !== 'playing') {
        if (e.code === 'Space' || e.key === 'Enter') {
          e.preventDefault();
          startGame();
        }
        return;
      }
      switch (e.key) {
        case 'ArrowUp': case 'w': case 'W':
          e.preventDefault(); queueDirection(0, -1); break;
        case 'ArrowDown': case 's': case 'S':
          e.preventDefault(); queueDirection(0, 1); break;
        case 'ArrowLeft': case 'a': case 'A':
          e.preventDefault(); queueDirection(-1, 0); break;
        case 'ArrowRight': case 'd': case 'D':
          e.preventDefault(); queueDirection(1, 0); break;
        default: break;
      }
    }
    window.addEventListener('keydown', onKeyDown);
    return () => window.removeEventListener('keydown', onKeyDown);
  }, [phase, queueDirection, startGame]);

  // swipe on canvas
  const touchStartRef = useRef(null);
  const onTouchStart = useCallback((e) => {
    if (phase !== 'playing') {
      startGame();
      return;
    }
    const t = e.touches[0];
    touchStartRef.current = { x: t.clientX, y: t.clientY };
  }, [phase, startGame]);

  const onTouchEnd = useCallback((e) => {
    const start = touchStartRef.current;
    if (!start) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - start.x;
    const dy = t.clientY - start.y;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      queueDirection(dx > 0 ? 1 : -1, 0);
    } else {
      queueDirection(0, dy > 0 ? 1 : -1);
    }
    touchStartRef.current = null;
  }, [queueDirection]);

  const onCanvasClick = useCallback(() => {
    if (phase !== 'playing') startGame();
  }, [phase, startGame]);

  return (
    <div style={{ width: '100%', height: '100%', position: 'relative' }}>
      <canvas
        ref={canvasRef}
        data-testid="game-canvas"
        onMouseDown={onCanvasClick}
        onTouchStart={onTouchStart}
        onTouchEnd={onTouchEnd}
      />

      <div className="hud">
        <div className="hud-block">
          SCORE: {hud.score}
          <div className="hud-sub">HIGH: {hud.highScore}</div>
        </div>
        <div className="hud-block" style={{ textAlign: 'right' }}>
          LEN: {hud.length}
          <div className="hud-sub">COMBO x{hud.combo}</div>
        </div>
      </div>

      <div className={'combo-badge' + (comboFlash ? ' show' : '')}>
        COMBO x{hud.combo}!
      </div>

      {phase === 'playing' && (
        <div className="dpad">
          <div className="dpad-grid">
            <div className="dpad-empty" />
            <button
              className="dpad-btn"
              data-testid="dpad-up"
              onClick={() => queueDirection(0, -1)}
              onTouchStart={(e) => { e.preventDefault(); e.stopPropagation(); queueDirection(0, -1); }}
            >&#9650;</button>
            <div className="dpad-empty" />
            <button
              className="dpad-btn"
              data-testid="dpad-left"
              onClick={() => queueDirection(-1, 0)}
              onTouchStart={(e) => { e.preventDefault(); e.stopPropagation(); queueDirection(-1, 0); }}
            >&#9664;</button>
            <div className="dpad-empty" />
            <button
              className="dpad-btn"
              data-testid="dpad-right"
              onClick={() => queueDirection(1, 0)}
              onTouchStart={(e) => { e.preventDefault(); e.stopPropagation(); queueDirection(1, 0); }}
            >&#9654;</button>
            <div className="dpad-empty" />
            <button
              className="dpad-btn"
              data-testid="dpad-down"
              onClick={() => queueDirection(0, 1)}
              onTouchStart={(e) => { e.preventDefault(); e.stopPropagation(); queueDirection(0, 1); }}
            >&#9660;</button>
            <div className="dpad-empty" />
          </div>
        </div>
      )}

      {phase !== 'playing' && (
        <div className="overlay" onMouseDown={onCanvasClick} onTouchStart={onTouchStart}>
          <h1 className="title">NEON COIL</h1>
          <div className="subtitle">Guide the glowing coil — eat orbs, avoid the walls and your own tail</div>
          {phase === 'gameover' && (
            <React.Fragment>
              <div className="score-line">SCORE: {hud.score}</div>
              <div className="hi-line">HIGH SCORE: {hud.highScore}</div>
            </React.Fragment>
          )}
          <button
            className="btn"
            onClick={(e) => { e.stopPropagation(); startGame(); }}
            onTouchEnd={(e) => { e.stopPropagation(); e.preventDefault(); startGame(); }}
          >
            {phase === 'gameover' ? 'Retry' : 'Start'}
          </button>
          <div className="hint">Arrow keys / WASD to steer &middot; Swipe or on-screen D-pad on mobile</div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Game />);
</script>
