<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Photon Bounce</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05030a; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }
  #root { width: 100%; height: 100%; }

  .app {
    width: 100%; height: 100%; position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; overflow: hidden; gap: 6px; padding: 6px 0;
    background: radial-gradient(circle at 50% 20%, #1a0a24 0%, #0a0814 55%, #030308 100%);
  }

  .hud {
    position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-around;
    padding: 10px 12px; z-index: 15; pointer-events: none;
  }
  .hudBox { text-align: center; }
  .hudLabel { font-size: 10px; letter-spacing: 2px; color: #b967ff; text-transform: uppercase; }
  .hudValue {
    font-size: 22px; font-weight: 800; color: #fff;
    text-shadow: 0 0 10px #b967ff, 0 0 20px #b967ff;
  }
  .hudValue.combo { color: #ffd23d; text-shadow: 0 0 10px #ffd23d, 0 0 22px #b3860a; }
  .hudValue.lives { color: #ff5ec4; text-shadow: 0 0 10px #ff5ec4, 0 0 22px #c9007f; }
  .hudValue.hurt { animation: hurtPulse 0.4s ease; }
  @keyframes hurtPulse { 0%,100% { opacity:1; transform: scale(1);} 50% { opacity:0.4; transform: scale(1.25);} }

  .title {
    font-size: clamp(18px, 5vw, 30px); font-weight: 900; letter-spacing: 3px; margin-top: 34px;
    background: linear-gradient(90deg, #b967ff, #5eeaff, #ffd23d);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(185,103,255,0.6));
    animation: titlePulse 2.4s ease-in-out infinite;
    text-align: center;
  }
  @keyframes titlePulse { 0%,100% { filter: drop-shadow(0 0 12px rgba(185,103,255,0.6)); } 50% { filter: drop-shadow(0 0 26px rgba(94,234,255,0.85)); } }

  .subtitle { color: #c8bcd8; font-size: 13px; letter-spacing: 0.5px; text-align: center; max-width: 460px; line-height: 1.55; }

  .btn {
    padding: 15px 40px; font-size: 19px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(135deg, #b967ff, #5eeaff);
    border: none; border-radius: 50px; color: #0a0016; cursor: pointer;
    box-shadow: 0 0 20px rgba(185,103,255,0.7), 0 0 50px rgba(94,234,255,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(185,103,255,0.9), 0 0 70px rgba(94,234,255,0.5); }
  .btn:active { transform: scale(0.96); }

  .highscoreLine { color: #ffd23d; font-size: 14px; text-shadow: 0 0 8px rgba(255,210,61,0.6); }

  .arenaOuter {
    position: relative; width: min(94vw, 460px); height: min(62vh, 440px); z-index: 5;
    border-radius: 18px; overflow: hidden; border: 2px solid rgba(185,103,255,0.25);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 0 30px rgba(185,103,255,0.12);
    background: #060812; touch-action: none; cursor: crosshair;
  }
  .arenaOuter.shakeIt { animation: shakeKf 0.3s ease; }
  @keyframes shakeKf {
    0%, 100% { transform: translate(0,0); }
    20% { transform: translate(-6px, 3px); }
    40% { transform: translate(6px, -3px); }
    60% { transform: translate(-5px, -2px); }
    80% { transform: translate(5px, 2px); }
  }

  canvas.gameCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .flashOverlay {
    position: absolute; inset: 0; z-index: 9; pointer-events: none; background: rgba(255,46,79,0);
  }
  .flashOverlay.on { animation: flashKf 0.3s ease; }
  @keyframes flashKf { 0% { background: rgba(255,46,79,0.35); } 100% { background: rgba(255,46,79,0); } }

  .overlay {
    position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 18px;
    background: rgba(6, 8, 18, 0.92); backdrop-filter: blur(4px);
  }

  .aimRow {
    position: relative; z-index: 6; display: flex; align-items: center; justify-content: center;
    gap: 28px; margin-top: 4px;
  }
  .aimBtn {
    width: 58px; height: 58px; border-radius: 50%; border: 2px solid rgba(185,103,255,0.5);
    background: radial-gradient(circle at 40% 35%, rgba(185,103,255,0.25), rgba(10,10,20,0.9));
    color: #b967ff; font-size: 26px; font-weight: 900; cursor: pointer;
    box-shadow: 0 0 16px rgba(185,103,255,0.35); -webkit-appearance: none; appearance: none;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  .aimBtn:active { transform: scale(0.9); box-shadow: 0 0 24px rgba(185,103,255,0.7); }
  .fireBtn {
    width: 70px; height: 58px; border-radius: 16px; border: 2px solid rgba(255,210,61,0.6);
    background: radial-gradient(circle at 40% 35%, rgba(255,210,61,0.3), rgba(10,10,20,0.9));
    color: #ffd23d; font-size: 13px; font-weight: 900; letter-spacing: 1px; cursor: pointer;
    box-shadow: 0 0 16px rgba(255,210,61,0.35); -webkit-appearance: none; appearance: none;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  .fireBtn:active { transform: scale(0.92); box-shadow: 0 0 24px rgba(255,210,61,0.7); }

  .status { color: #a898b8; font-size: 12px; letter-spacing: 0.5px; height: 15px; z-index: 10; text-align: center; }
  .footer { position: relative; text-align: center; color: #241f30; font-size: 10px; z-index: 10; padding-bottom: 2px; }

  @media (max-width: 480px) {
    .hudValue { font-size: 17px; }
    .btn { padding: 13px 30px; font-size: 16px; }
    .subtitle { font-size: 12px; }
    .arenaOuter { height: min(52vh, 380px); }
    .aimBtn { width: 52px; height: 52px; font-size: 22px; }
    .fireBtn { width: 62px; height: 52px; font-size: 12px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const HS_KEY = 'photonBounce_highScore';
const LIVES_START = 3;
const HITS_PER_LEVEL = 8;
const AIM_SPEED = 90; // degrees per second while held
const AIM_NUDGE = 12; // instant tap nudge degrees
const MAX_AIM_DEG = 78;
const BALL_RADIUS = 7;

const TARGET_COLORS = ['#5eeaff', '#ff5ec4', '#b967ff'];
const GOLD_COLOR = '#ffd23d';

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

const targetCount = (level) => clamp(3 + Math.floor((level - 1) * 0.7), 3, 7);
const targetRadius = (level) => clamp(23 - (level - 1) * 1.1, 13, 23);
const targetSpeed = (level) => (level >= 2 ? clamp(16 + (level - 2) * 9, 16, 85) : 0);
const ballSpeed = (level) => clamp(430 + (level - 1) * 14, 430, 620);
const maxBounces = (level) => clamp(9 - Math.floor((level - 1) / 2), 5, 9);
const goldChance = (level) => clamp(0.12 + (level - 1) * 0.01, 0.12, 0.28);

function useAudio() {
  const ctxRef = useRef(null);
  const getCtx = () => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  };

  const tone = useCallback((freq, duration, type, gainScale, freqEnd) => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + duration);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(gainScale, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.05);
    } catch (e) {}
  }, []);

  const fireSound = useCallback(() => tone(220, 0.08, 'square', 0.08, 500), [tone]);
  const bounceSound = useCallback(() => tone(340, 0.04, 'triangle', 0.05, 260), [tone]);
  const hitSound = useCallback((combo) => tone(480 + combo * 14, 0.1, 'triangle', 0.16, 940 + combo * 18), [tone]);
  const goldSound = useCallback(() => { tone(680, 0.1, 'sine', 0.18, 1080); setTimeout(() => tone(980, 0.14, 'sine', 0.16, 1400), 90); }, [tone]);
  const missSound = useCallback(() => tone(190, 0.28, 'sawtooth', 0.2, 70), [tone]);
  const aimSound = useCallback(() => tone(300, 0.02, 'sine', 0.03, 340), [tone]);
  const levelUpSound = useCallback(() => { tone(520, 0.12, 'sine', 0.18, 820); setTimeout(() => tone(760, 0.16, 'sine', 0.18, 1150), 110); }, [tone]);
  const overSound = useCallback(() => { tone(300, 0.25, 'sawtooth', 0.2, 200); setTimeout(() => tone(180, 0.35, 'sawtooth', 0.2, 80), 150); }, [tone]);

  return { fireSound, bounceSound, hitSound, goldSound, missSound, aimSound, levelUpSound, overSound };
}

function spawnBurst(arr, x, y, color, count, speedMin, speedMax, sizeMin, sizeMax, lifeMs) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = speedMin + Math.random() * (speedMax - speedMin);
    arr.push({
      x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      life: lifeMs, maxLife: lifeMs, color,
      size: sizeMin + Math.random() * (sizeMax - sizeMin),
    });
  }
}

function makeTarget(id, w, h, level) {
  const r = targetRadius(level);
  const spd = targetSpeed(level);
  const ang = Math.random() * Math.PI * 2;
  return {
    id,
    x: r + Math.random() * (w - r * 2),
    y: h * 0.1 + Math.random() * (h * 0.55),
    r,
    vx: Math.cos(ang) * spd,
    vy: Math.sin(ang) * spd,
    gold: Math.random() < goldChance(level),
    color: TARGET_COLORS[Math.floor(Math.random() * TARGET_COLORS.length)],
    pulse: Math.random() * Math.PI * 2,
  };
}

function App() {
  const [phase, setPhase] = useState('start'); // start | playing | over
  const [score, setScore] = useState(0);
  const [lives, setLives] = useState(LIVES_START);
  const [combo, setCombo] = useState(0);
  const [level, setLevel] = useState(1);
  const [hurt, setHurt] = useState(false);
  const [shakeIt, setShakeIt] = useState(false);
  const [flashOn, setFlashOn] = useState(false);
  const [highScore, setHighScore] = useState(() => parseInt(localStorage.getItem(HS_KEY) || '0', 10));
  const [statusMsg, setStatusMsg] = useState('Click or tap the arena to fire a photon toward that point.');

  const canvasRef = useRef(null);
  const arenaRef = useRef(null);
  const aimRef = useRef(0); // degrees from vertical, negative = left
  const ballRef = useRef(null); // {x,y,vx,vy,bounces,hits}
  const targetsRef = useRef([]);
  const particlesRef = useRef([]);
  const keysHeldRef = useRef({ left: false, right: false });
  const buttonHeldRef = useRef({ left: false, right: false });
  const scoreRef = useRef(0);
  const comboRef = useRef(0);
  const livesRef = useRef(LIVES_START);
  const levelRef = useRef(1);
  const hitsRef = useRef(0);
  const idCounterRef = useRef(0);
  const highScoreRef = useRef(highScore);
  const phaseRef = useRef('start');
  const rafRef = useRef(null);
  const lastTsRef = useRef(null);

  const { fireSound, bounceSound, hitSound, goldSound, missSound, aimSound, levelUpSound, overSound } = useAudio();

  useEffect(() => { phaseRef.current = phase; }, [phase]);

  const resizeCanvas = useCallback(() => {
    const canvas = canvasRef.current;
    const arena = arenaRef.current;
    if (!canvas || !arena) return;
    const rect = arena.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }, []);

  useEffect(() => {
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    return () => window.removeEventListener('resize', resizeCanvas);
  }, [resizeCanvas]);

  const ensureTargets = useCallback((w, h) => {
    const need = targetCount(levelRef.current);
    while (targetsRef.current.length < need) {
      targetsRef.current.push(makeTarget(++idCounterRef.current, w, h * 0.75, levelRef.current));
    }
  }, []);

  const endGame = useCallback(() => {
    phaseRef.current = 'over';
    setPhase('over');
    overSound();
    setStatusMsg('Photon core depleted.');
  }, [overSound]);

  const resolveShot = useCallback((cx, cy) => {
    const ball = ballRef.current;
    if (!ball) return;
    if (ball.hits > 0) {
      setStatusMsg(ball.hits > 1 ? `Chain x${ball.hits}!` : 'Direct hit.');
    } else {
      comboRef.current = 0;
      setCombo(0);
      livesRef.current -= 1;
      setLives(livesRef.current);
      setHurt(true);
      setTimeout(() => setHurt(false), 400);
      setShakeIt(true);
      setTimeout(() => setShakeIt(false), 300);
      setFlashOn(true);
      setTimeout(() => setFlashOn(false), 300);
      missSound();
      spawnBurst(particlesRef.current, cx, cy, '#ff2e4f', 14, 60, 200, 2, 5, 420);
      setStatusMsg('Missed — no targets in the shot path.');
      if (livesRef.current <= 0) { endGame(); }
    }
    ballRef.current = null;
  }, [missSound, endGame]);

  const registerHit = useCallback((target, w, h) => {
    comboRef.current += 1;
    setCombo(comboRef.current);
    const base = target.gold ? 55 : 12;
    const chainBonus = ballRef.current ? ballRef.current.hits * 8 : 0;
    const gained = base + comboRef.current * 3 + chainBonus;
    scoreRef.current += gained;
    setScore(scoreRef.current);
    if (scoreRef.current > highScoreRef.current) {
      highScoreRef.current = scoreRef.current;
      localStorage.setItem(HS_KEY, String(scoreRef.current));
      setHighScore(scoreRef.current);
    }
    if (target.gold) goldSound(); else hitSound(comboRef.current);
    spawnBurst(particlesRef.current, target.x, target.y, target.color, target.gold ? 22 : 13, 50, 220, 2, 5, 480);

    hitsRef.current += 1;
    if (hitsRef.current % HITS_PER_LEVEL === 0) {
      levelRef.current += 1;
      setLevel(levelRef.current);
      levelUpSound();
      setStatusMsg(`Level ${levelRef.current}! Targets move faster and shrink.`);
    }

    targetsRef.current = targetsRef.current.filter((t) => t.id !== target.id);
    ensureTargets(w, h);
  }, [goldSound, hitSound, levelUpSound, ensureTargets]);

  const fireAt = useCallback((clickX, clickY, w, h) => {
    if (phaseRef.current !== 'playing' || ballRef.current) return;
    const cx = w / 2;
    const ly = h - 26;
    let dx = clickX - cx;
    let dy = clickY - ly;
    if (dy > -10) dy = -10;
    let angle = Math.atan2(dx, -dy);
    const maxRad = (MAX_AIM_DEG * Math.PI) / 180;
    angle = clamp(angle, -maxRad, maxRad);
    aimRef.current = (angle * 180) / Math.PI;
    launchBall(angle, cx, ly);
  }, []);

  const launchBall = useCallback((angleRad, cx, ly) => {
    const spd = ballSpeed(levelRef.current);
    ballRef.current = {
      x: cx,
      y: ly,
      vx: Math.sin(angleRad) * spd,
      vy: -Math.cos(angleRad) * spd,
      bounces: 0,
      hits: 0,
      trail: [],
    };
    fireSound();
  }, [fireSound]);

  const fireFromAim = useCallback((w, h) => {
    if (phaseRef.current !== 'playing' || ballRef.current) return;
    const cx = w / 2;
    const ly = h - 26;
    const rad = (aimRef.current * Math.PI) / 180;
    launchBall(rad, cx, ly);
  }, [launchBall]);

  const rotateAimBy = useCallback((deg) => {
    aimRef.current = clamp(aimRef.current + deg, -MAX_AIM_DEG, MAX_AIM_DEG);
  }, []);

  const nudgeAim = useCallback((dir) => {
    if (phaseRef.current !== 'playing') return;
    rotateAimBy(dir * AIM_NUDGE);
    aimSound();
  }, [rotateAimBy, aimSound]);

  const startGameRef = useRef(null);

  useEffect(() => {
    const onKeyDown = (e) => {
      if (phaseRef.current !== 'playing') {
        if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); startGameRef.current && startGameRef.current(); }
        return;
      }
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); keysHeldRef.current.left = true; }
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); keysHeldRef.current.right = true; }
      else if (e.code === 'Space') {
        e.preventDefault();
        const canvas = canvasRef.current;
        if (canvas) {
          const rect = canvas.getBoundingClientRect();
          fireFromAim(rect.width, rect.height);
        }
      }
    };
    const onKeyUp = (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keysHeldRef.current.left = false;
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') keysHeldRef.current.right = false;
    };
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    return () => {
      window.removeEventListener('keydown', onKeyDown);
      window.removeEventListener('keyup', onKeyUp);
    };
  }, [fireFromAim]);

  const onArenaClick = useCallback((e) => {
    if (phaseRef.current !== 'playing') return;
    const canvas = canvasRef.current;
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    const point = e.changedTouches ? e.changedTouches[0] : e;
    const x = point.clientX - rect.left;
    const y = point.clientY - rect.top;
    fireAt(x, y, rect.width, rect.height);
  }, [fireAt]);

  const tick = useCallback((ts) => {
    if (lastTsRef.current == null) lastTsRef.current = ts;
    const dt = Math.min((ts - lastTsRef.current) / 1000, 0.05);
    lastTsRef.current = ts;

    if (phaseRef.current === 'playing') {
      if (keysHeldRef.current.left || buttonHeldRef.current.left) rotateAimBy(-AIM_SPEED * dt);
      if (keysHeldRef.current.right || buttonHeldRef.current.right) rotateAimBy(AIM_SPEED * dt);
    }

    const canvas = canvasRef.current;
    if (canvas) {
      const ctx = canvas.getContext('2d');
      const rect = canvas.getBoundingClientRect();
      const w = rect.width, h = rect.height;
      ctx.clearRect(0, 0, w, h);

      const cx = w / 2;
      const ly = h - 26;

      const grad = ctx.createRadialGradient(cx, h * 0.35, 10, cx, h * 0.35, Math.max(w, h) * 0.8);
      grad.addColorStop(0, 'rgba(28,18,44,0.9)');
      grad.addColorStop(1, 'rgba(4,5,10,0.95)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      // ambient drifting starfield (keeps canvas continuously alive)
      for (let i = 0; i < 18; i++) {
        const sx = (i * 53.7 + ts * 0.006) % w;
        const sy = (i * 91.3) % (h * 0.85);
        ctx.globalAlpha = 0.15 + 0.1 * Math.sin(ts / 500 + i);
        ctx.fillStyle = '#b967ff';
        ctx.fillRect(sx, sy, 2, 2);
      }
      ctx.globalAlpha = 1;

      if (phaseRef.current === 'playing') {
        // move + draw targets
        const targets = targetsRef.current;
        for (const t of targets) {
          t.x += t.vx * dt;
          t.y += t.vy * dt;
          if (t.x - t.r < 0) { t.x = t.r; t.vx *= -1; }
          if (t.x + t.r > w) { t.x = w - t.r; t.vx *= -1; }
          if (t.y - t.r < 0) { t.y = t.r; t.vy *= -1; }
          if (t.y + t.r > h * 0.8) { t.y = h * 0.8 - t.r; t.vy *= -1; }
          t.pulse += dt * 3;

          ctx.save();
          ctx.strokeStyle = t.gold ? GOLD_COLOR : t.color;
          ctx.lineWidth = 3;
          ctx.shadowColor = t.gold ? GOLD_COLOR : t.color;
          ctx.shadowBlur = 16;
          ctx.beginPath();
          ctx.arc(t.x, t.y, t.r + (t.gold ? Math.sin(t.pulse) * 2 : 0), 0, Math.PI * 2);
          ctx.stroke();
          ctx.globalAlpha = 0.25;
          ctx.fillStyle = t.gold ? GOLD_COLOR : t.color;
          ctx.fill();
          ctx.globalAlpha = 1;
          ctx.restore();
        }

        // ball physics
        const ball = ballRef.current;
        if (ball) {
          ball.trail.push({ x: ball.x, y: ball.y });
          if (ball.trail.length > 10) ball.trail.shift();

          ball.x += ball.vx * dt;
          ball.y += ball.vy * dt;

          let bounced = false;
          if (ball.x - BALL_RADIUS < 0) { ball.x = BALL_RADIUS; ball.vx *= -1; bounced = true; }
          else if (ball.x + BALL_RADIUS > w) { ball.x = w - BALL_RADIUS; ball.vx *= -1; bounced = true; }
          if (ball.y - BALL_RADIUS < 0) { ball.y = BALL_RADIUS; ball.vy *= -1; bounced = true; }
          if (bounced) {
            ball.bounces += 1;
            bounceSound();
            spawnBurst(particlesRef.current, ball.x, ball.y, '#5eeaff', 5, 30, 90, 1, 3, 220);
          }

          // target collisions
          for (let i = targetsRef.current.length - 1; i >= 0; i--) {
            const t = targetsRef.current[i];
            const dxT = ball.x - t.x, dyT = ball.y - t.y;
            if (Math.hypot(dxT, dyT) < BALL_RADIUS + t.r) {
              ball.hits += 1;
              const nx = dxT / (Math.hypot(dxT, dyT) || 1);
              const ny = dyT / (Math.hypot(dxT, dyT) || 1);
              ball.vx = nx * ballSpeed(levelRef.current);
              ball.vy = ny * ballSpeed(levelRef.current);
              registerHit(t, w, h);
              break;
            }
          }

          const stillActive = ballRef.current;
          if (stillActive) {
            const wentBelow = stillActive.y - BALL_RADIUS > h;
            const outOfBounces = stillActive.bounces >= maxBounces(levelRef.current);
            if (wentBelow || outOfBounces) {
              resolveShot(stillActive.x, clamp(stillActive.y, 0, h));
            }
          }
        }

        // redraw ball + trail + reticle after physics resolved
        const activeBall = ballRef.current;
        if (activeBall) {
          for (let i = 0; i < activeBall.trail.length; i++) {
            const p = activeBall.trail[i];
            ctx.globalAlpha = (i / activeBall.trail.length) * 0.5;
            ctx.fillStyle = '#5eeaff';
            ctx.beginPath();
            ctx.arc(p.x, p.y, BALL_RADIUS * 0.7, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
          ctx.save();
          ctx.fillStyle = '#fff';
          ctx.shadowColor = '#5eeaff';
          ctx.shadowBlur = 18;
          ctx.beginPath();
          ctx.arc(activeBall.x, activeBall.y, BALL_RADIUS, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        } else {
          // aim reticle line from launcher
          const rad = (aimRef.current * Math.PI) / 180;
          const len = Math.min(w, h) * 0.32;
          const ex = cx + Math.sin(rad) * len;
          const ey = ly - Math.cos(rad) * len;
          ctx.save();
          ctx.strokeStyle = 'rgba(94,234,255,0.5)';
          ctx.lineWidth = 2;
          ctx.setLineDash([5, 7]);
          ctx.beginPath();
          ctx.moveTo(cx, ly);
          ctx.lineTo(ex, ey);
          ctx.stroke();
          ctx.restore();
        }

        // launcher pad
        ctx.save();
        ctx.strokeStyle = '#b967ff';
        ctx.lineWidth = 3;
        ctx.shadowColor = '#b967ff';
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(cx, ly, 12, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // particles
      const particles = particlesRef.current;
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx * dt; pt.y += pt.vy * dt;
        pt.vx *= 0.93; pt.vy *= 0.93;
        pt.life -= dt * 1000;
        if (pt.life <= 0) { particles.splice(i, 1); continue; }
        ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    rafRef.current = requestAnimationFrame(tick);
  }, [rotateAimBy, bounceSound, registerHit, resolveShot]);

  useEffect(() => {
    rafRef.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(rafRef.current);
  }, [tick]);

  const startGame = useCallback(() => {
    targetsRef.current = [];
    particlesRef.current = [];
    ballRef.current = null;
    aimRef.current = 0;
    scoreRef.current = 0;
    comboRef.current = 0;
    livesRef.current = LIVES_START;
    levelRef.current = 1;
    hitsRef.current = 0;
    keysHeldRef.current = { left: false, right: false };
    buttonHeldRef.current = { left: false, right: false };
    setScore(0);
    setCombo(0);
    setLives(LIVES_START);
    setLevel(1);
    setStatusMsg('Click or tap the arena to fire — chain bounces for bigger combos.');
    setPhase('playing');
    phaseRef.current = 'playing';
    resizeCanvas();
    const canvas = canvasRef.current;
    if (canvas) {
      const rect = canvas.getBoundingClientRect();
      ensureTargets(rect.width, rect.height);
    }
  }, [resizeCanvas, ensureTargets]);

  useEffect(() => { startGameRef.current = startGame; }, [startGame]);

  const holdStart = (dir) => (e) => {
    e.preventDefault();
    if (phaseRef.current !== 'playing') return;
    if (dir < 0) buttonHeldRef.current.left = true; else buttonHeldRef.current.right = true;
  };
  const holdEnd = (dir) => () => {
    if (dir < 0) buttonHeldRef.current.left = false; else buttonHeldRef.current.right = false;
  };

  const onFireBtn = useCallback((e) => {
    e.preventDefault();
    const canvas = canvasRef.current;
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    fireFromAim(rect.width, rect.height);
  }, [fireFromAim]);

  return (
    <div className="app" data-testid="game-canvas">
      <div className="hud">
        <div className="hudBox">
          <div className="hudLabel">Score</div>
          <div className="hudValue" data-testid="score">{score}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Lives</div>
          <div className={`hudValue lives ${hurt ? 'hurt' : ''}`} data-testid="lives">{'❤'.repeat(Math.max(0, lives))}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Combo</div>
          <div className="hudValue combo" data-testid="combo">x{combo}</div>
        </div>
      </div>

      <div className="title">PHOTON BOUNCE</div>

      <div
        className={`arenaOuter ${shakeIt ? 'shakeIt' : ''}`}
        ref={arenaRef}
        data-testid="play-field"
        onMouseDown={onArenaClick}
        onTouchStart={onArenaClick}
      >
        <canvas ref={canvasRef} className="gameCanvas" data-testid="canvas" />
        <div className={`flashOverlay ${flashOn ? 'on' : ''}`} />

        {phase === 'start' && (
          <div className="overlay">
            <div className="subtitle">Fire a glowing photon from the launcher and bank it off the arena walls to chain through as many targets as you can in one shot. Click or tap anywhere in the arena to fire toward that point, or hold Left/Right (A/D) to swing the aim reticle and press Space to launch. Each target in the chain raises your combo and score, gold targets pay out big, and a shot that bounces out without hitting anything costs one of three lives and resets your streak. Every eight hits levels you up, speeding and shrinking the targets and shortening how far your photon can travel before it fizzles.</div>
            <div className="highscoreLine" data-testid="high-score">Best: {highScore}</div>
            <button className="btn" data-testid="start-btn" onClick={() => startGame()}>START</button>
          </div>
        )}

        {phase === 'over' && (
          <div className="overlay">
            <div className="title" style={{ fontSize: 'clamp(20px, 6vw, 30px)', marginTop: 0 }}>CORE DEPLETED</div>
            <div className="hudValue" data-testid="final-score">Score: {score}</div>
            <div className="highscoreLine" data-testid="high-score-final">Best: {highScore}</div>
            <button className="btn" data-testid="restart-btn" onClick={() => startGame()}>PLAY AGAIN</button>
          </div>
        )}
      </div>

      {phase === 'playing' && (
        <div className="aimRow">
          <button
            type="button"
            className="aimBtn"
            data-testid="aim-left"
            onClick={() => nudgeAim(-1)}
            onMouseDown={holdStart(-1)}
            onMouseUp={holdEnd(-1)}
            onMouseLeave={holdEnd(-1)}
            onTouchStart={holdStart(-1)}
            onTouchEnd={holdEnd(-1)}
          >&#8630;</button>
          <button type="button" className="fireBtn" data-testid="fire-btn" onClick={onFireBtn}>FIRE</button>
          <button
            type="button"
            className="aimBtn"
            data-testid="aim-right"
            onClick={() => nudgeAim(1)}
            onMouseDown={holdStart(1)}
            onMouseUp={holdEnd(1)}
            onMouseLeave={holdEnd(1)}
            onTouchStart={holdStart(1)}
            onTouchEnd={holdEnd(1)}
          >&#8631;</button>
        </div>
      )}

      <div className="status">{statusMsg}</div>
      <div className="footer">Photon Bounce — Level {level} — bank the bounce, chain the combo</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
