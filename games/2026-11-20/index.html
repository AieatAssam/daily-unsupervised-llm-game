<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Dead Air</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #05040d; overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
    touch-action: none; user-select: none;
  }
  #root { width: 100%; height: 100%; }
  .app {
    position: relative; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center;
    background: radial-gradient(circle at 50% 0%, #1a1030 0%, #0a0818 55%, #040308 100%);
    overflow: hidden;
  }
  .drift {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(120deg, rgba(79,255,214,0.06), rgba(255,79,163,0.07), rgba(79,168,255,0.06));
    background-size: 400% 400%;
    animation: drift 18s ease-in-out infinite;
  }
  @keyframes drift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .hud {
    position: relative; z-index: 5; width: 100%; max-width: 380px;
    display: flex; justify-content: space-around; padding: 10px 6px 4px;
  }
  .hud-item {
    flex: 1; text-align: center; color: #e8eeff;
    font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; opacity: 0.85;
  }
  .hud-val { display: block; font-size: 19px; font-weight: 800; margin-top: 2px; }
  .c-cyan { color: #4fffd6; text-shadow: 0 0 10px #4fffd6; }
  .c-mag { color: #ff4fa3; text-shadow: 0 0 10px #ff4fa3; }
  .c-gold { color: #ffd84f; text-shadow: 0 0 10px #ffd84f; }
  .c-blue { color: #4fa8ff; text-shadow: 0 0 10px #4fa8ff; }
  .stage {
    position: relative; z-index: 2; flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    width: 100%; padding: 4px 0 12px;
  }
  .board-wrap {
    position: relative; height: min(74vh, 600px); aspect-ratio: 360 / 600;
    max-width: 100%;
  }
  canvas.board {
    display: block; width: 100%; height: 100%; touch-action: none;
    cursor: crosshair; border-radius: 14px;
    box-shadow: 0 0 0 1px rgba(79,255,214,0.25), 0 0 30px rgba(79,255,214,0.12);
  }
  .overlay {
    position: absolute; inset: 0; z-index: 4; border-radius: 14px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 18px; color: #e8eeff;
    background: rgba(5,4,13,0.68);
  }
  .title {
    font-size: 40px; font-weight: 900; letter-spacing: 3px; margin: 0; color: #4fffd6;
    text-shadow: 0 0 18px #4fffd6, 0 0 40px #ff4fa3;
  }
  .line { font-size: 15px; line-height: 1.45; max-width: 290px; margin: 14px 0 22px; opacity: 0.92; }
  .stat { font-size: 15px; letter-spacing: 1px; margin: 5px 0; opacity: 0.92; }
  .stat b { font-size: 26px; display: block; }
  .hint { font-size: 11px; opacity: 0.6; margin-top: 16px; letter-spacing: 1px; line-height: 1.5; }
  button.start-btn {
    min-width: 200px; min-height: 52px; padding: 14px 28px;
    font-size: 18px; font-weight: 800; letter-spacing: 2px; color: #05040d;
    background: linear-gradient(90deg, #4fffd6, #ff4fa3);
    border: none; border-radius: 30px; cursor: pointer;
    box-shadow: 0 0 22px rgba(79,255,214,0.55);
    touch-action: manipulation;
  }
  button.start-btn:active { transform: scale(0.94); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useEffect, useRef, useState } = React;

const GAME_ID = '2026-11-20';
const BEST_KEY = `arcade.${GAME_ID}.best`;
const W = 360, H = 600;
const FLOOR = 500;     // a note resolves once its bottom edge crosses this line
const VAULT_Y = 518;   // vault panel below the floor; the hand is safe down here
const HAND_R = 14;
const DPR = Math.min(2, window.devicePixelRatio || 1);

function makeGlow(rgb, size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  grd.addColorStop(0, `rgba(${rgb},0.9)`);
  grd.addColorStop(0.3, `rgba(${rgb},0.45)`);
  grd.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = grd;
  g.fillRect(0, 0, size, size);
  return c;
}
const GLOW_CYAN = makeGlow('79,255,214', 96);
const GLOW_MAG = makeGlow('255,79,163', 96);
const GLOW_WHITE = makeGlow('255,255,255', 64);

// ---- audio (created on first pointer input) ----
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function blip(freq, dur = 0.12, type = 'sine', vol = 0.08, slide = 0) {
  if (!audioCtx || audioCtx.state !== 'running') return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(t);
  o.stop(t + dur + 0.02);
}

function readBest() {
  return parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0;
}

function freshRun(best) {
  return {
    phase: 'menu', t: 0, spawnIn: 0.6, nextId: 1,
    notes: [], parts: [], pops: [],
    pot: 0,        // unbanked SILENCE, lost on a bust or game over
    streak: 0,     // quiet notes let through since the last bust
    combo: 0,      // loud notes caught in a row without a leak
    banked: 0,     // score
    best,
    lives: 3,
    hand: null, handPrev: null, touchDown: false,
    shake: 0, flash: 0, bankFlash: 0, vaultPulse: 0,
  };
}

function distToSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const len2 = dx * dx + dy * dy;
  let t = len2 ? ((px - ax) * dx + (py - ay) * dy) / len2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(ax + dx * t - px, ay + dy * t - py);
}

function burst(s, x, y, rgb, n, speed) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = speed * (0.4 + Math.random() * 0.6);
    s.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, rgb, size: 1.5 + Math.random() * 2.5 });
  }
}
function pop(s, x, y, text, rgb) {
  s.pops.push({ x, y, text, rgb, life: 1 });
}

function gameOver(s) {
  s.phase = 'over';
  s.pot = 0; // unbanked silence is lost with the signal
  if (s.banked > s.best) {
    s.best = s.banked;
    try { localStorage.setItem(BEST_KEY, String(s.best)); } catch (e) {}
  }
  blip(220, 0.6, 'sawtooth', 0.09, 0.2);
}

function bank(s) {
  if (s.pot <= 0) { blip(200, 0.05, 'square', 0.03); return; }
  s.banked += s.pot;
  s.bankFlash = 1;
  burst(s, W / 2, VAULT_Y + 30, '255,216,79', 26, 180);
  pop(s, W / 2, VAULT_Y - 8, `BANKED +${s.pot}`, '255,216,79');
  s.pot = 0;
  blip(523, 0.2, 'triangle', 0.1);
}

function step(s, dt) {
  s.vaultPulse += dt;
  s.bankFlash = Math.max(0, s.bankFlash - dt * 2);
  s.flash = Math.max(0, s.flash - dt * 2.5);
  s.shake = Math.max(0, s.shake - dt * 2);
  for (const p of s.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 120 * dt; p.life -= dt * 1.6; }
  s.parts = s.parts.filter(p => p.life > 0);
  for (const p of s.pops) { p.y -= 30 * dt; p.life -= dt * 1.1; }
  s.pops = s.pops.filter(p => p.life > 0);

  if (s.phase !== 'playing') return;
  s.t += dt;

  // Escalation: faster fall, shorter gaps, more loud cards over time.
  const speed = Math.min(190, 70 + s.t * 3.2);
  const gap = Math.max(0.55, 1.25 - s.t * 0.012);
  const pLoud = Math.min(0.5, 0.25 + s.t * 0.005);

  s.spawnIn -= dt;
  if (s.spawnIn <= 0) {
    s.spawnIn = gap * (0.85 + Math.random() * 0.3);
    const loud = Math.random() < pLoud;
    s.notes.push({
      id: s.nextId++, x: 26 + Math.random() * (W - 52), y: -16,
      r: loud ? 15 : 13, loud, wob: Math.random() * 6.28, speed, dead: false,
    });
  }
  for (const n of s.notes) { n.y += n.speed * dt; n.wob += dt * 4; }

  // Hand contact, swept between last frame and this one so fast moves can't tunnel.
  const h = s.hand;
  if (h) {
    const a = s.handPrev || h;
    for (const n of s.notes) {
      if (n.dead || distToSeg(n.x, n.y, a.x, a.y, h.x, h.y) >= n.r + HAND_R) continue;
      n.dead = true;
      if (n.loud) {
        s.combo++;
        const v = 2 + Math.min(s.combo - 1, 4);
        s.pot += v;
        burst(s, n.x, n.y, '255,79,163', 18, 160);
        pop(s, n.x, n.y, `+${v}`, '255,79,163');
        blip(620 + Math.min(s.combo, 8) * 40, 0.1, 'triangle', 0.09);
      } else {
        // Touching a quiet card mutes it: no points, and the untouched pot resets.
        const had = s.pot > 0 || s.streak > 0;
        s.pot = 0;
        s.streak = 0;
        burst(s, n.x, n.y, '150,160,200', 12, 90);
        if (had) {
          pop(s, n.x, n.y, 'BUST', '#ffffff');
          s.shake = 0.3;
          blip(160, 0.25, 'sawtooth', 0.07, 0.5);
        } else {
          blip(300, 0.05, 'sine', 0.04);
        }
      }
    }
  }
  s.handPrev = h;

  // Resolution at the floor.
  for (const n of s.notes) {
    if (n.dead || n.y + n.r < FLOOR) continue;
    n.dead = true;
    if (n.loud) {
      s.lives -= 1;
      s.combo = 0;
      s.shake = 0.5;
      s.flash = 1;
      burst(s, n.x, FLOOR, '255,79,163', 22, 200);
      pop(s, n.x, FLOOR - 20, 'LEAK', '#ff4fa3');
      blip(110, 0.35, 'sawtooth', 0.12, 0.5);
      if (s.lives <= 0) { gameOver(s); return; }
    } else {
      // Quiet card reached the floor untouched: it joins the pot. Streak multiplies it.
      const v = 1 + Math.min(s.streak, 5);
      s.streak++;
      s.pot += v;
      burst(s, n.x, FLOOR, '79,255,214', 10, 110);
      pop(s, n.x, FLOOR - 18, `+${v}`, '79,255,214');
      blip(880 + Math.min(s.streak, 8) * 30, 0.09, 'sine', 0.06);
    }
  }
  s.notes = s.notes.filter(n => !n.dead && n.y < H + 40);
}

function draw(ctx, s, now) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.save();
  if (s.shake > 0) {
    ctx.translate((Math.random() - 0.5) * 12 * s.shake, (Math.random() - 0.5) * 12 * s.shake);
  }
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0d0a24');
  bg.addColorStop(1, '#05040d');
  ctx.fillStyle = bg;
  ctx.fillRect(-20, -20, W + 40, H + 40);

  // Staff lines drifting in the top band: the "music studio" motif.
  ctx.strokeStyle = 'rgba(79,168,255,0.12)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 5; i++) {
    const y = 70 + i * 12 + Math.sin(now * 0.8 + i) * 1.5;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // Floor: the neon line notes land on.
  const fl = ctx.createLinearGradient(0, 0, W, 0);
  fl.addColorStop(0, 'rgba(79,255,214,0)');
  fl.addColorStop(0.5, 'rgba(79,255,214,0.9)');
  fl.addColorStop(1, 'rgba(255,79,163,0)');
  ctx.strokeStyle = fl;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, FLOOR); ctx.lineTo(W, FLOOR); ctx.stroke();

  // Vault: the only place to bank.
  const pulse = 0.5 + 0.5 * Math.sin(s.vaultPulse * 3);
  const vg = ctx.createLinearGradient(0, VAULT_Y, 0, H);
  vg.addColorStop(0, `rgba(255,216,79,${0.1 + 0.06 * pulse + 0.3 * s.bankFlash})`);
  vg.addColorStop(1, 'rgba(255,216,79,0.02)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, VAULT_Y, W, H - VAULT_Y);
  ctx.strokeStyle = `rgba(255,216,79,${0.35 + 0.3 * pulse})`;
  ctx.setLineDash([6, 6]);
  ctx.strokeRect(10, VAULT_Y + 6, W - 20, H - VAULT_Y - 12);
  ctx.setLineDash([]);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd84f';
  ctx.font = 'bold 12px system-ui, Arial, sans-serif';
  ctx.fillText('VAULT · TAP TO BANK', W / 2, VAULT_Y + 22);
  ctx.font = 'bold 26px system-ui, Arial, sans-serif';
  ctx.fillText(`SILENCE ${s.pot}`, W / 2, VAULT_Y + 52);
  ctx.font = '11px system-ui, Arial, sans-serif';
  ctx.fillStyle = 'rgba(255,216,79,0.7)';
  ctx.fillText(s.pot > 0 ? 'bank it before a bust' : 'untouched quiet cards fill this', W / 2, VAULT_Y + 72);

  // Notes.
  for (const n of s.notes) {
    if (n.loud) {
      ctx.globalAlpha = 0.9;
      ctx.drawImage(GLOW_MAG, n.x - 30, n.y - 30, 60, 60);
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#ff4fa3';
      ctx.beginPath();
      for (let k = 0; k < 10; k++) {
        const rr = k % 2 ? n.r * 0.45 : n.r * 1.1 + Math.sin(n.wob * 2) * 1.5;
        const a = n.wob + k * Math.PI / 5;
        const px = n.x + Math.cos(a) * rr, py = n.y + Math.sin(a) * rr;
        if (k) ctx.lineTo(px, py); else ctx.moveTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(n.x, n.y, 3, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.drawImage(GLOW_CYAN, n.x - 30, n.y - 30, 60, 60);
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(79,255,214,0.22)';
      ctx.fill();
      ctx.strokeStyle = '#4fffd6';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#e9fff9';
      ctx.beginPath(); ctx.arc(n.x, n.y, 3.5, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Hand.
  if (s.phase === 'playing' && s.hand) {
    ctx.drawImage(GLOW_WHITE, s.hand.x - 22, s.hand.y - 22, 44, 44);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(s.hand.x, s.hand.y, HAND_R, 0, Math.PI * 2); ctx.stroke();
  }

  // Particles and pops.
  ctx.globalCompositeOperation = 'lighter';
  for (const p of s.parts) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = `rgb(${p.rgb})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.font = 'bold 14px system-ui, Arial, sans-serif';
  for (const p of s.pops) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = Array.isArray(p.rgb) ? '#fff' : (p.rgb.startsWith('#') ? p.rgb : `rgb(${p.rgb})`);
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;

  if (s.flash > 0) {
    ctx.fillStyle = `rgba(255,79,163,${0.25 * s.flash})`;
    ctx.fillRect(-20, -20, W + 40, H + 40);
  }
  ctx.restore();
}

function App() {
  const canvasRef = useRef(null);
  const sRef = useRef(null);
  if (sRef.current === null) sRef.current = freshRun(readBest());
  const [hud, setHud] = useState({ phase: 'menu', banked: 0, best: sRef.current.best, lives: 3, combo: 0 });

  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    const s = sRef.current;
    let raf;
    let last = performance.now();
    let lastKey = '';

    const publish = () => {
      const r = canvas.getBoundingClientRect();
      window.__game = {
        phase: s.phase,
        score: s.banked,
        pot: s.pot,
        lives: s.lives,
        combo: s.combo,
        floor: FLOOR,
        vault: { x: 0, y: VAULT_Y, w: W, h: H - VAULT_Y },
        // Logical (W×H) coordinates; page px = board.left + x * board.scale.
        board: { left: r.left, top: r.top, scale: r.width / W },
        hand: s.phase === 'playing' && s.hand ? { x: s.hand.x, y: s.hand.y } : null,
        notes: s.notes.filter(n => !n.dead).map(n => ({ x: n.x, y: n.y, r: n.r, loud: n.loud })),
      };
    };

    const frame = now => {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      step(s, dt);
      draw(ctx, s, now / 1000);
      publish();
      const key = `${s.phase}|${s.banked}|${s.best}|${s.lives}|${s.combo}`;
      if (key !== lastKey) {
        lastKey = key;
        setHud({ phase: s.phase, banked: s.banked, best: s.best, lives: s.lives, combo: s.combo });
      }
      raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
    return () => cancelAnimationFrame(raf);
  }, []);

  const start = () => {
    ensureAudio();
    const s = sRef.current;
    Object.assign(s, freshRun(s.best));
    s.phase = 'playing';
    blip(440, 0.12, 'triangle', 0.08);
  };

  const toLogical = e => {
    const r = canvasRef.current.getBoundingClientRect();
    return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
  };

  const onDown = e => {
    ensureAudio();
    const s = sRef.current;
    if (s.phase !== 'playing') return;
    const p = toLogical(e);
    s.touchDown = e.pointerType !== 'mouse';
    if (s.touchDown) e.currentTarget.setPointerCapture(e.pointerId);
    s.hand = p;
    if (p.y >= VAULT_Y) bank(s);
  };
  const onMove = e => {
    const s = sRef.current;
    if (s.phase !== 'playing') return;
    if (e.pointerType === 'mouse' || s.touchDown) s.hand = toLogical(e);
  };
  const onUp = e => {
    const s = sRef.current;
    if (e.pointerType !== 'mouse') { s.hand = null; s.touchDown = false; }
  };
  const onLeave = e => {
    const s = sRef.current;
    if (e.pointerType === 'mouse') s.hand = null;
  };

  const { phase, banked, best, lives, combo } = hud;
  const hearts = '♥'.repeat(Math.max(0, lives)) || '–';

  return (
    <div className="app">
      <div className="drift" />
      <div className="hud">
        <div className="hud-item">Banked<span className="hud-val c-cyan">{banked}</span></div>
        <div className="hud-item">Best<span className="hud-val c-gold">{Math.max(best, banked)}</span></div>
        <div className="hud-item">Combo<span className="hud-val c-mag">×{combo}</span></div>
        <div className="hud-item">Lives<span className="hud-val c-blue">{hearts}</span></div>
      </div>
      <div className="stage">
        <div className="board-wrap">
          <canvas
            ref={canvasRef}
            className="board"
            data-testid="board"
            onPointerDown={onDown}
            onPointerMove={onMove}
            onPointerUp={onUp}
            onPointerCancel={onUp}
            onPointerLeave={onLeave}
          />
          {phase === 'menu' && (
            <div className="overlay">
              <h1 className="title">DEAD AIR</h1>
              <div className="line">Catch the magenta static. Leave the cyan tones untouched. Bank the silence in the vault.</div>
              <button className="start-btn" data-testid="start-btn" onClick={start}>START</button>
              <div className="hint">Move your pointer or drag your finger · tap the VAULT to bank</div>
            </div>
          )}
          {phase === 'over' && (
            <div className="overlay">
              <h2 className="title" style={{ fontSize: 32 }}>SIGNAL LOST</h2>
              <div className="stat">Banked<b className="c-cyan">{banked}</b></div>
              <div className="stat">Best<b className="c-gold">{Math.max(best, banked)}</b></div>
              <div className="hint">Unbanked silence was lost with the signal.</div>
              <button className="start-btn" data-testid="start-btn" onClick={start} style={{ marginTop: 18 }}>PLAY AGAIN</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
