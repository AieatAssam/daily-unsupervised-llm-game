<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Grid Garrison</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --cyan: #3cf3ff;
    --magenta: #ff3cf0;
    --gold: #ffd93c;
    --red: #ff4d6a;
    --green: #5dff9e;
    --bg0: #060414;
    --bg1: #0c0a26;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: var(--bg0);
    overflow-x: hidden;
    font-family: 'Segoe UI', 'Trebuchet MS', system-ui, sans-serif;
    color: #eafcff;
    touch-action: none;
  }
  #root { min-height: 100vh; }
  .app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 10px 18px;
    position: relative;
    background:
      radial-gradient(circle at 20% 10%, rgba(60,243,255,0.16), transparent 55%),
      radial-gradient(circle at 85% 85%, rgba(255,60,240,0.14), transparent 55%),
      linear-gradient(160deg, var(--bg0), var(--bg1) 60%, var(--bg0));
    background-size: 200% 200%;
    animation: drift 18s ease-in-out infinite alternate;
  }
  @keyframes drift {
    0% { background-position: 0% 0%; }
    100% { background-position: 100% 100%; }
  }
  h1.title {
    margin: 2px 0 10px;
    font-size: clamp(22px, 5vw, 32px);
    letter-spacing: 3px;
    text-transform: uppercase;
    background: linear-gradient(90deg, var(--cyan), var(--magenta), var(--gold));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 22px rgba(60,243,255,0.35);
  }
  .hud {
    width: min(540px, 96vw);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .stat {
    flex: 1 1 70px;
    min-width: 58px;
    background: rgba(10, 10, 30, 0.55);
    border: 1px solid rgba(60,243,255,0.35);
    border-radius: 10px;
    padding: 5px 6px;
    text-align: center;
    box-shadow: 0 0 14px rgba(60,243,255,0.08) inset;
  }
  .stat .label {
    font-size: 9px;
    letter-spacing: 1.5px;
    opacity: 0.6;
    text-transform: uppercase;
  }
  .stat .value {
    font-size: 16px;
    font-weight: 700;
    color: var(--cyan);
    text-shadow: 0 0 10px rgba(60,243,255,0.6);
  }
  .stat.lives .value { color: var(--red); text-shadow: 0 0 10px rgba(255,77,106,0.6); }
  .stat.combo .value { color: var(--gold); text-shadow: 0 0 10px rgba(255,217,60,0.6); }
  .stat.wave .value { color: var(--magenta); text-shadow: 0 0 10px rgba(255,60,240,0.6); }
  .stat.energy .value { color: var(--green); text-shadow: 0 0 10px rgba(93,255,158,0.6); }
  .stat.cost .value { color: #eafcff; }

  .play-field {
    position: relative;
    width: min(460px, 94vw);
    height: min(300px, 48vh);
    min-height: 240px;
    border-radius: 16px;
    border: 1px solid rgba(60,243,255,0.4);
    box-shadow: 0 0 30px rgba(60,243,255,0.15), 0 0 60px rgba(255,60,240,0.08) inset;
    overflow: hidden;
    background: #04030c;
    touch-action: none;
    cursor: pointer;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 16px;
    background: rgba(4,3,12,0.78);
    backdrop-filter: blur(2px);
  }
  .overlay h2 {
    margin: 0;
    font-size: clamp(18px, 4vw, 26px);
    color: var(--cyan);
    text-shadow: 0 0 14px rgba(60,243,255,0.6);
    letter-spacing: 2px;
  }
  .overlay p {
    margin: 0;
    max-width: 440px;
    font-size: 13px;
    opacity: 0.85;
    line-height: 1.5;
  }
  .overlay .score-line {
    font-size: 16px;
    color: var(--gold);
  }
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
  }
  .start-btn {
    margin-top: 6px;
    padding: 14px 34px;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #04030c;
    background: linear-gradient(90deg, var(--cyan), var(--gold));
    border-radius: 999px;
    box-shadow: 0 0 24px rgba(60,243,255,0.55);
    min-height: 48px;
    min-width: 160px;
    transition: transform 0.15s ease;
  }
  .start-btn:active { transform: scale(0.95); }

  .hint {
    font-size: 11px;
    opacity: 0.6;
    max-width: 480px;
    line-height: 1.4;
    text-align: center;
    margin-top: 10px;
  }

  @media (max-width: 480px) {
    .hud { gap: 5px; }
    .stat { padding: 4px 5px; min-width: 52px; }
    .stat .value { font-size: 14px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

const HIGH_SCORE_KEY = "gridGarrisonHighScore";
const TAU = Math.PI * 2;
const COLS = 8;
const ROWS = 5;

const PATH = [
  { c: 0, r: 0 }, { c: 1, r: 0 }, { c: 2, r: 0 }, { c: 3, r: 0 },
  { c: 3, r: 1 }, { c: 3, r: 2 }, { c: 2, r: 2 }, { c: 1, r: 2 },
  { c: 1, r: 3 }, { c: 1, r: 4 }, { c: 2, r: 4 }, { c: 3, r: 4 },
  { c: 4, r: 4 }, { c: 4, r: 3 }, { c: 4, r: 2 }, { c: 5, r: 2 },
  { c: 6, r: 2 }, { c: 6, r: 1 }, { c: 6, r: 0 }, { c: 7, r: 0 },
];
const PATH_SET = new Set(PATH.map(p => `${p.c},${p.r}`));
const CORE = PATH[PATH.length - 1];

const LEVELS = [
  null,
  { dmg: 1, rangeF: 1.55, cd: 0.9, color: "60,243,255", hex: "#3cf3ff" },
  { dmg: 2, rangeF: 1.95, cd: 0.7, color: "255,217,60", hex: "#ffd93c" },
  { dmg: 3.5, rangeF: 2.35, cd: 0.55, color: "255,60,240", hex: "#ff3cf0" },
];

const ETYPES = {
  normal: { hp: 4, speed: 1.05, value: 10, color: "60,243,255", r: 8 },
  scout: { hp: 2.2, speed: 1.85, value: 14, color: "255,217,60", r: 6 },
  boss: { hp: 26, speed: 0.65, value: 60, color: "255,60,240", r: 13 },
};

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

function buildCost(placed) { return Math.min(50, 14 + placed * 4); }
function upgradeCost(level) { return level === 1 ? 22 : level === 2 ? 38 : Infinity; }

function waveScaledHp(type, wave) { return ETYPES[type].hp * (1 + (wave - 1) * 0.17); }
function waveScaledSpeed(type, wave) { return ETYPES[type].speed * (1 + Math.min(wave, 12) * 0.02); }

function buildSpawnList(wave) {
  const count = Math.min(14, 5 + wave);
  const list = [];
  for (let i = 0; i < count; i++) {
    list.push(wave >= 4 && Math.random() < 0.25 ? "scout" : "normal");
  }
  if (wave % 5 === 0) list.push("boss");
  return list;
}

function freshStats() {
  return { score: 0, lives: 3, wave: 1, energy: 40, combo: 1, comboCount: 0, turretsPlaced: 0 };
}

function App() {
  const [uiStats, setUiStats] = useState(freshStats());
  const [gameState, setGameState] = useState("idle"); // idle | playing | gameover
  const [highScore, setHighScore] = useState(() => {
    const v = parseInt(localStorage.getItem(HIGH_SCORE_KEY) || "0", 10);
    return Number.isFinite(v) ? v : 0;
  });

  const fieldRef = useRef(null);
  const canvasRef = useRef(null);
  const ctxRef = useRef(null);
  const rafRef = useRef(null);
  const statsRef = useRef(freshStats());
  const gameStateRef = useRef("idle");
  const audioCtxRef = useRef(null);

  const gRef = useRef({
    bounds: { w: 460, h: 300 },
    turrets: [],
    enemies: [],
    beams: [],
    particles: [],
    spawnList: [],
    spawnIdx: 0,
    spawnTimer: 0,
    waveTransitioning: false,
    waveClearTimer: 0,
    energyTimer: 0,
    shake: 0,
    flash: 0,
    flashColor: "60,243,255",
    lastTime: 0,
    pulse: 0,
  });

  const ensureAudio = useCallback(() => {
    if (!audioCtxRef.current) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      audioCtxRef.current = new Ctx();
    }
    if (audioCtxRef.current.state === "suspended") {
      audioCtxRef.current.resume().catch(() => {});
    }
    return audioCtxRef.current;
  }, []);

  const playTone = useCallback((freq, dur = 0.12, type = "sine", vol = 0.15) => {
    try {
      const ctx = ensureAudio();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      const now = ctx.currentTime;
      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + dur + 0.02);
    } catch (e) { /* audio unavailable */ }
  }, [ensureAudio]);

  const spawnParticles = (x, y, color, count = 10, speed = 90) => {
    const g = gRef.current;
    for (let i = 0; i < count; i++) {
      const a = Math.random() * TAU;
      const s = speed * (0.4 + Math.random() * 0.9);
      g.particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s - 30,
        life: 0.45 + Math.random() * 0.35,
        maxLife: 0.8,
        size: 2 + Math.random() * 2.5,
        color,
      });
    }
    if (g.particles.length > 140) g.particles = g.particles.slice(-140);
  };

  const resizeCanvas = useCallback(() => {
    const field = fieldRef.current;
    const canvas = canvasRef.current;
    if (!field || !canvas) return;
    const rect = field.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 1);
    canvas.width = Math.max(1, Math.round(rect.width * dpr));
    canvas.height = Math.max(1, Math.round(rect.height * dpr));
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctxRef.current = ctx;
    gRef.current.bounds = { w: rect.width, h: rect.height };
  }, []);

  useEffect(() => {
    resizeCanvas();
    const onResize = () => resizeCanvas();
    window.addEventListener("resize", onResize);
    let ro;
    if (window.ResizeObserver && fieldRef.current) {
      ro = new ResizeObserver(onResize);
      ro.observe(fieldRef.current);
    }
    return () => {
      window.removeEventListener("resize", onResize);
      if (ro) ro.disconnect();
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const commitStats = (mutator) => {
    mutator(statsRef.current);
    setUiStats({ ...statsRef.current });
  };

  const cellSize = () => {
    const g = gRef.current;
    return { cw: g.bounds.w / COLS, ch: g.bounds.h / ROWS };
  };

  const cellCenter = (c, r) => {
    const { cw, ch } = cellSize();
    return { x: (c + 0.5) * cw, y: (r + 0.5) * ch };
  };

  const enemyPos = (e) => {
    if (e.arrived) return cellCenter(CORE.c, CORE.r);
    const a = PATH[e.pathIndex];
    const b = PATH[Math.min(e.pathIndex + 1, PATH.length - 1)];
    const pa = cellCenter(a.c, a.r);
    const pb = cellCenter(b.c, b.r);
    return { x: pa.x + (pb.x - pa.x) * e.t, y: pa.y + (pb.y - pa.y) * e.t };
  };

  const endGame = () => {
    gameStateRef.current = "gameover";
    setGameState("gameover");
    const finalScore = statsRef.current.score;
    if (finalScore > highScore) {
      localStorage.setItem(HIGH_SCORE_KEY, String(finalScore));
      setHighScore(finalScore);
    } else if (!localStorage.getItem(HIGH_SCORE_KEY)) {
      localStorage.setItem(HIGH_SCORE_KEY, String(highScore));
    }
    playTone(90, 0.4, "triangle", 0.2);
  };

  const spawnEnemy = (type) => {
    const g = gRef.current;
    const start = PATH[0];
    const pos = cellCenter(start.c, start.r);
    g.enemies.push({
      type,
      pathIndex: 0,
      t: 0,
      hp: waveScaledHp(type, statsRef.current.wave),
      maxHp: waveScaledHp(type, statsRef.current.wave),
      speed: waveScaledSpeed(type, statsRef.current.wave),
      value: ETYPES[type].value,
      arrived: false,
      dead: false,
      x: pos.x,
      y: pos.y,
    });
  };

  const initWave = (wave) => {
    const g = gRef.current;
    g.spawnList = buildSpawnList(wave);
    g.spawnIdx = 0;
    g.spawnTimer = 0.3;
    g.waveTransitioning = false;
    commitStats((s) => { s.wave = wave; });
    playTone(330, 0.18, "triangle", 0.14);
  };

  const startGame = useCallback(() => {
    ensureAudio();
    statsRef.current = freshStats();
    setUiStats(freshStats());
    const g = gRef.current;
    g.turrets = [];
    g.enemies = [];
    g.beams = [];
    g.particles = [];
    g.shake = 0;
    g.flash = 0;
    g.energyTimer = 0;
    gameStateRef.current = "playing";
    setGameState("playing");
    initWave(1);
  }, [ensureAudio]);

  const handleArrival = (e) => {
    const g = gRef.current;
    g.shake = 10;
    g.flash = 1;
    g.flashColor = "255,77,106";
    const core = cellCenter(CORE.c, CORE.r);
    spawnParticles(core.x, core.y, "255,77,106", 22, 140);
    playTone(110, 0.25, "sawtooth", 0.2);
    commitStats((s) => {
      s.lives -= 1;
      s.comboCount = 0;
      s.combo = 1;
    });
    if (statsRef.current.lives <= 0) endGame();
  };

  const killEnemy = (e) => {
    const pos = enemyPos(e);
    spawnParticles(pos.x, pos.y, ETYPES[e.type].color, 16, 120);
    playTone(420 + Math.random() * 140, 0.1, "sine", 0.13);
    commitStats((s) => {
      s.score += Math.round(e.value * s.combo);
      s.comboCount += 1;
      s.combo = Math.min(5, 1 + Math.floor(s.comboCount / 4));
      s.energy = Math.min(999, s.energy + Math.round(e.value / 4));
    });
  };

  const invalidFeedback = (x, y) => {
    const g = gRef.current;
    spawnParticles(x, y, "255,77,106", 10, 80);
    playTone(140, 0.12, "square", 0.12);
  };

  const handleCellClick = (x, y) => {
    if (gameStateRef.current !== "playing") return;
    ensureAudio();
    const g = gRef.current;
    const { cw, ch } = cellSize();
    const c = clamp(Math.floor(x / cw), 0, COLS - 1);
    const r = clamp(Math.floor(y / ch), 0, ROWS - 1);
    const center = cellCenter(c, r);

    if (PATH_SET.has(`${c},${r}`)) {
      invalidFeedback(x, y);
      return;
    }

    const existing = g.turrets.find((t) => t.c === c && t.r === r);
    if (existing) {
      const cost = upgradeCost(existing.level);
      if (existing.level >= 3 || statsRef.current.energy < cost) {
        invalidFeedback(x, y);
        return;
      }
      commitStats((s) => { s.energy -= cost; });
      existing.level += 1;
      spawnParticles(center.x, center.y, "255,217,60", 18, 120);
      playTone(560, 0.15, "triangle", 0.16);
      return;
    }

    const cost = buildCost(statsRef.current.turretsPlaced);
    if (statsRef.current.energy < cost) {
      invalidFeedback(x, y);
      return;
    }
    commitStats((s) => { s.energy -= cost; s.turretsPlaced += 1; });
    g.turrets.push({ c, r, level: 1, cooldown: 0 });
    spawnParticles(center.x, center.y, "60,243,255", 16, 120);
    playTone(300, 0.12, "sine", 0.15);
  };

  const onFieldClick = (e) => {
    const rect = fieldRef.current.getBoundingClientRect();
    handleCellClick(e.clientX - rect.left, e.clientY - rect.top);
  };
  const onFieldTouch = (e) => {
    e.preventDefault();
    const t = e.touches[0] || e.changedTouches[0];
    if (!t) return;
    const rect = fieldRef.current.getBoundingClientRect();
    handleCellClick(t.clientX - rect.left, t.clientY - rect.top);
  };

  useEffect(() => {
    const onKeyDown = (e) => {
      if (e.code === "Space" || e.key === "Enter") {
        e.preventDefault();
        if (gameStateRef.current !== "playing") startGame();
      }
    };
    window.addEventListener("keydown", onKeyDown);
    return () => window.removeEventListener("keydown", onKeyDown);
  }, [startGame]);

  // main loop
  useEffect(() => {
    const step = (ts) => {
      const g = gRef.current;
      if (!g.lastTime) g.lastTime = ts;
      let dt = (ts - g.lastTime) / 1000;
      dt = Math.min(dt, 0.05);
      g.lastTime = ts;

      g.shake *= 0.9;
      if (g.shake < 0.05) g.shake = 0;
      g.flash *= 0.92;
      if (g.flash < 0.02) g.flash = 0;
      g.pulse = (g.pulse + dt) % 2;

      if (gameStateRef.current === "playing") {
        // spawn / wave progression
        if (g.spawnIdx < g.spawnList.length) {
          g.spawnTimer -= dt;
          if (g.spawnTimer <= 0) {
            spawnEnemy(g.spawnList[g.spawnIdx]);
            g.spawnIdx++;
            g.spawnTimer = Math.max(0.42, 1.5 - statsRef.current.wave * 0.04);
          }
        } else if (g.enemies.length === 0) {
          if (!g.waveTransitioning) {
            g.waveTransitioning = true;
            g.waveClearTimer = 2.2;
          } else {
            g.waveClearTimer -= dt;
            if (g.waveClearTimer <= 0) initWave(statsRef.current.wave + 1);
          }
        }

        // passive energy regen
        g.energyTimer += dt;
        if (g.energyTimer >= 1) {
          g.energyTimer -= 1;
          commitStats((s) => { s.energy = Math.min(999, s.energy + 2); });
        }

        // enemy movement
        g.enemies.forEach((e) => {
          e.t += e.speed * dt;
          while (e.t >= 1) {
            e.t -= 1;
            e.pathIndex++;
            if (e.pathIndex >= PATH.length - 1) { e.arrived = true; break; }
          }
          const p = enemyPos(e);
          e.x = p.x; e.y = p.y;
        });

        const arrived = g.enemies.filter((e) => e.arrived);
        g.enemies = g.enemies.filter((e) => !e.arrived);
        arrived.forEach(handleArrival);

        // turret firing
        g.turrets.forEach((t) => {
          t.cooldown -= dt;
          if (t.cooldown > 0) return;
          const cfg = LEVELS[t.level];
          const tc = cellCenter(t.c, t.r);
          const { cw, ch } = cellSize();
          const rangePx = cfg.rangeF * Math.min(cw, ch);
          let target = null, bestDist = Infinity;
          for (const e of g.enemies) {
            if (e.dead) continue;
            const d = dist(tc, { x: e.x, y: e.y });
            if (d <= rangePx && d < bestDist) { bestDist = d; target = e; }
          }
          if (target) {
            g.beams.push({ x1: tc.x, y1: tc.y, x2: target.x, y2: target.y, life: 0.12, maxLife: 0.12, color: cfg.color });
            target.hp -= cfg.dmg;
            t.cooldown = cfg.cd;
            if (target.hp <= 0 && !target.dead) {
              target.dead = true;
              killEnemy(target);
            }
          }
        });
        g.enemies = g.enemies.filter((e) => !e.dead);
      }

      g.beams.forEach((b) => { b.life -= dt; });
      g.beams = g.beams.filter((b) => b.life > 0);

      g.particles.forEach((p) => {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= 0.96;
        p.vy *= 0.96;
        p.vy += 60 * dt;
        p.life -= dt;
      });
      g.particles = g.particles.filter((p) => p.life > 0);

      draw();
      rafRef.current = requestAnimationFrame(step);
    };

    const draw = () => {
      const ctx = ctxRef.current;
      const g = gRef.current;
      if (!ctx) return;
      const { w, h } = g.bounds;
      const { cw, ch } = cellSize();

      ctx.fillStyle = "#07051a";
      ctx.fillRect(0, 0, w, h);

      ctx.save();
      const shakeX = g.shake ? (Math.random() - 0.5) * g.shake : 0;
      const shakeY = g.shake ? (Math.random() - 0.5) * g.shake : 0;
      ctx.translate(shakeX, shakeY);

      // grid cells
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const x = c * cw, y = r * ch;
          const isPath = PATH_SET.has(`${c},${r}`);
          if (isPath) {
            ctx.fillStyle = "rgba(255,60,240,0.10)";
            ctx.fillRect(x + 1, y + 1, cw - 2, ch - 2);
            ctx.strokeStyle = "rgba(255,60,240,0.25)";
          } else {
            ctx.fillStyle = "rgba(60,243,255,0.04)";
            ctx.fillRect(x + 1, y + 1, cw - 2, ch - 2);
            ctx.strokeStyle = "rgba(60,243,255,0.12)";
          }
          ctx.lineWidth = 1;
          ctx.strokeRect(x + 1, y + 1, cw - 2, ch - 2);
        }
      }

      // core
      const corePos = cellCenter(CORE.c, CORE.r);
      const corePulse = 1 + Math.sin(g.pulse * Math.PI) * 0.12;
      ctx.beginPath();
      ctx.arc(corePos.x, corePos.y, Math.min(cw, ch) * 0.38 * corePulse, 0, TAU);
      ctx.fillStyle = "rgba(255,60,240,0.3)";
      ctx.fill();
      ctx.strokeStyle = "#ff3cf0";
      ctx.lineWidth = 2;
      ctx.stroke();

      // turrets
      g.turrets.forEach((t) => {
        const cfg = LEVELS[t.level];
        const pos = cellCenter(t.c, t.r);
        const rad = Math.min(cw, ch) * 0.3;
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, rad, 0, TAU);
        ctx.fillStyle = `rgba(${cfg.color},0.25)`;
        ctx.fill();
        ctx.strokeStyle = cfg.hex;
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.font = "bold 10px 'Segoe UI', sans-serif";
        ctx.fillStyle = cfg.hex;
        ctx.textAlign = "center";
        ctx.fillText("L" + t.level, pos.x, pos.y + 3.5);
      });

      // enemies
      g.enemies.forEach((e) => {
        const info = ETYPES[e.type];
        ctx.beginPath();
        ctx.arc(e.x, e.y, info.r, 0, TAU);
        ctx.fillStyle = `rgba(${info.color},0.85)`;
        ctx.fill();
        ctx.strokeStyle = `rgba(${info.color},1)`;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        const frac = clamp(e.hp / e.maxHp, 0, 1);
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(e.x - info.r, e.y - info.r - 7, info.r * 2, 3);
        ctx.fillStyle = frac > 0.4 ? "#5dff9e" : "#ff4d6a";
        ctx.fillRect(e.x - info.r, e.y - info.r - 7, info.r * 2 * frac, 3);
      });

      // beams
      g.beams.forEach((b) => {
        const alpha = Math.max(0, b.life / b.maxLife);
        ctx.strokeStyle = `rgba(${b.color},${alpha})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(b.x1, b.y1);
        ctx.lineTo(b.x2, b.y2);
        ctx.stroke();
      });

      // particles
      g.particles.forEach((p) => {
        const alpha = Math.max(0, p.life / p.maxLife);
        ctx.fillStyle = `rgba(${p.color},${alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, TAU);
        ctx.fill();
      });

      ctx.restore();

      if (g.flash > 0.01) {
        ctx.fillStyle = `rgba(${g.flashColor},${g.flash * 0.3})`;
        ctx.fillRect(0, 0, w, h);
      }
      ctx.textAlign = "left";
    };

    rafRef.current = requestAnimationFrame(step);
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const handleFieldClick = (e) => {
    if (gameStateRef.current !== "playing") { startGame(); return; }
    onFieldClick(e);
  };
  const handleFieldTouch = (e) => {
    if (gameStateRef.current !== "playing") { e.preventDefault(); startGame(); return; }
    onFieldTouch(e);
  };

  return (
    <div className="app">
      <h1 className="title">Grid Garrison</h1>

      <div className="hud">
        <div className="stat">
          <div className="label">Score</div>
          <div className="value" data-testid="score">{uiStats.score}</div>
        </div>
        <div className="stat wave">
          <div className="label">Wave</div>
          <div className="value" data-testid="wave">{uiStats.wave}</div>
        </div>
        <div className="stat lives">
          <div className="label">Lives</div>
          <div className="value" data-testid="lives">{"♥".repeat(Math.max(0, uiStats.lives))}</div>
        </div>
        <div className="stat energy">
          <div className="label">Energy</div>
          <div className="value" data-testid="energy">{uiStats.energy}</div>
        </div>
        <div className="stat combo">
          <div className="label">Combo</div>
          <div className="value" data-testid="combo">x{uiStats.combo}</div>
        </div>
        <div className="stat cost">
          <div className="label">Build</div>
          <div className="value" data-testid="build-cost">{buildCost(uiStats.turretsPlaced)}</div>
        </div>
      </div>

      <div
        className="play-field"
        ref={fieldRef}
        data-testid="play-field"
        onClick={handleFieldClick}
        onTouchStart={handleFieldTouch}
      >
        <canvas ref={canvasRef} data-testid="canvas" />

        {gameState === "idle" && (
          <div className="overlay" data-testid="overlay">
            <h2>GRID GARRISON</h2>
            <p>Tap an empty tile to build a turret, costing energy. Tap a turret again to upgrade it, up to level 3. Defend the glowing core from endless waves of invaders streaming down the neon track — energy regenerates over time and every kill earns a bonus. Lose all 3 lives and the grid goes dark.</p>
            <button className="start-btn" data-testid="start-btn" onClick={(e) => { e.stopPropagation(); startGame(); }}>DEPLOY GRID</button>
          </div>
        )}

        {gameState === "gameover" && (
          <div className="overlay" data-testid="overlay">
            <h2>GRID BREACHED</h2>
            <p className="score-line">Score: {uiStats.score} &nbsp;•&nbsp; Wave: {uiStats.wave} &nbsp;•&nbsp; Best: {highScore}</p>
            <button className="start-btn" data-testid="start-btn" onClick={(e) => { e.stopPropagation(); startGame(); }}>REDEPLOY</button>
          </div>
        )}
      </div>

      <p className="hint">
        Tap an empty tile to build a turret · tap a turret to upgrade it (max L3) · magenta track carries invaders to the core · energy regenerates and kills pay bonus energy · 3 lives, then the grid goes dark.
      </p>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
