<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Cipher Rain</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05030c; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }
  #root { width: 100%; height: 100%; }

  .app {
    width: 100%; height: 100%; position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; overflow: hidden; gap: 6px; padding: 6px 0;
    background: radial-gradient(circle at 50% 6%, #1a0a24 0%, #0a0714 55%, #030208 100%);
  }

  .hud {
    position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-around;
    padding: 10px 12px; z-index: 15; pointer-events: none;
  }
  .hudBox { text-align: center; }
  .hudLabel { font-size: 10px; letter-spacing: 2px; color: #b76dff; text-transform: uppercase; }
  .hudValue {
    font-size: 22px; font-weight: 800; color: #fff;
    text-shadow: 0 0 10px #b76dff, 0 0 20px #b76dff;
  }
  .hudValue.combo { color: #ffd23d; text-shadow: 0 0 10px #ffd23d, 0 0 22px #b3860a; }
  .hudValue.lives { color: #ff5e6c; text-shadow: 0 0 10px #ff5e6c, 0 0 22px #c90022; }
  .hudValue.hurt { animation: hurtPulse 0.4s ease; }
  @keyframes hurtPulse { 0%,100% { opacity:1; transform: scale(1);} 50% { opacity:0.4; transform: scale(1.25);} }

  .title {
    font-size: clamp(18px, 5vw, 30px); font-weight: 900; letter-spacing: 3px; margin-top: 34px;
    background: linear-gradient(90deg, #b76dff, #4de8ff, #ffd23d);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(183,109,255,0.6));
    animation: titlePulse 2.4s ease-in-out infinite;
    text-align: center;
  }
  @keyframes titlePulse { 0%,100% { filter: drop-shadow(0 0 12px rgba(183,109,255,0.6)); } 50% { filter: drop-shadow(0 0 26px rgba(77,232,255,0.85)); } }

  .subtitle { color: #b8c8d0; font-size: 13px; letter-spacing: 0.5px; text-align: center; max-width: 460px; line-height: 1.55; }

  .btn {
    padding: 15px 40px; font-size: 19px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(135deg, #b76dff, #4de8ff);
    border: none; border-radius: 50px; color: #100522; cursor: pointer;
    box-shadow: 0 0 20px rgba(183,109,255,0.7), 0 0 50px rgba(77,232,255,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(183,109,255,0.9), 0 0 70px rgba(77,232,255,0.5); }
  .btn:active { transform: scale(0.96); }

  .highscoreLine { color: #ffd23d; font-size: 14px; text-shadow: 0 0 8px rgba(255,210,61,0.6); }

  .instructionBar {
    display: flex; align-items: center; justify-content: center; z-index: 12;
    margin-top: 46px; min-height: 26px; padding: 0 12px;
  }
  .instructionLabel {
    font-size: 10px; letter-spacing: 2px; color: #8a7a9a; text-transform: uppercase; margin-right: 6px;
  }
  .instructionText {
    font-size: 15px; font-weight: 800; letter-spacing: 1px; color: #fff;
    text-shadow: 0 0 8px #b76dff, 0 0 16px rgba(183,109,255,0.5);
  }
  .instructionText.pulseWarn { color: #ffd23d; text-shadow: 0 0 8px #ffd23d, 0 0 18px rgba(255,210,61,0.6); }

  .fieldOuter {
    position: relative; width: min(90vw, 460px); height: min(46vh, 340px); z-index: 5;
    border-radius: 18px; overflow: hidden; border: 2px solid rgba(183,109,255,0.25);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 0 30px rgba(183,109,255,0.12);
    background: #08060f; touch-action: none; margin-top: 4px;
  }
  .fieldOuter.shakeIt { animation: shakeKf 0.3s ease; }
  @keyframes shakeKf {
    0%, 100% { transform: translate(0,0); }
    20% { transform: translate(-6px, 3px); }
    40% { transform: translate(6px, -3px); }
    60% { transform: translate(-5px, -2px); }
    80% { transform: translate(5px, 2px); }
  }

  canvas.gameCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .flashOverlay {
    position: absolute; inset: 0; z-index: 9; pointer-events: none; background: rgba(255,46,79,0);
  }
  .flashOverlay.bad { animation: flashBadKf 0.3s ease; }
  @keyframes flashBadKf { 0% { background: rgba(255,46,79,0.32); } 100% { background: rgba(255,46,79,0); } }
  .flashOverlay.good { animation: flashGoodKf 0.35s ease; }
  @keyframes flashGoodKf { 0% { background: rgba(183,109,255,0.3); } 100% { background: rgba(183,109,255,0); } }

  .overlay {
    position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 18px;
    background: rgba(8, 6, 15, 0.92); backdrop-filter: blur(4px);
  }

  .keypad {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; z-index: 10; margin-top: 2px;
    width: min(90vw, 380px);
  }
  .keyBtn {
    height: 52px; border-radius: 12px; cursor: pointer;
    background: linear-gradient(135deg, rgba(183,109,255,0.18), rgba(77,232,255,0.1));
    border: 2px solid rgba(183,109,255,0.4); color: #d9b8ff; font-size: 20px; font-weight: 900;
    box-shadow: 0 0 14px rgba(183,109,255,0.25);
    transition: transform 0.12s ease, background 0.12s ease;
  }
  .keyBtn:active { transform: scale(0.9); background: rgba(183,109,255,0.32); }
  .keyBtn.locked { opacity: 0.25; cursor: default; }

  .status { color: #9aa8b3; font-size: 12px; letter-spacing: 0.5px; height: 15px; z-index: 10; text-align: center; }
  .footer { position: relative; text-align: center; color: #171d20; font-size: 10px; z-index: 10; padding-bottom: 2px; }

  @media (max-width: 480px) {
    .hudValue { font-size: 17px; }
    .btn { padding: 13px 30px; font-size: 16px; }
    .subtitle { font-size: 12px; }
    .fieldOuter { height: min(38vh, 280px); }
    .instructionBar { margin-top: 40px; }
    .instructionText { font-size: 13px; }
    .keyBtn { height: 46px; font-size: 17px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const HS_KEY = 'cipherRainHighScore';
const LIVES_START = 3;
const POOL = ['A', 'S', 'D', 'F', 'J', 'K', 'L', 'G'];
const BASELINE_FRAC = 0.86;

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function useAudio() {
  const ctxRef = useRef(null);
  const getCtx = () => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  };

  const tone = useCallback((freq, duration, type, gainScale, freqEnd) => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + duration);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(gainScale, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.05);
    } catch (e) {}
  }, []);

  const zapSound = useCallback(() => { tone(660, 0.09, 'sine', 0.16, 990); }, [tone]);
  const goldSound = useCallback(() => { tone(700, 0.1, 'sine', 0.18, 1100); setTimeout(() => tone(1100, 0.1, 'sine', 0.16, 1500), 70); setTimeout(() => tone(1500, 0.16, 'sine', 0.14, 2000), 140); }, [tone]);
  const buzzSound = useCallback(() => tone(160, 0.12, 'sawtooth', 0.12, 90), [tone]);
  const missSound = useCallback(() => tone(140, 0.35, 'sawtooth', 0.22, 40), [tone]);
  const overSound = useCallback(() => { tone(300, 0.25, 'sawtooth', 0.2, 200); setTimeout(() => tone(180, 0.35, 'sawtooth', 0.2, 80), 150); }, [tone]);
  const levelSound = useCallback(() => { tone(500, 0.1, 'square', 0.1, 900); setTimeout(() => tone(750, 0.12, 'square', 0.1, 1200), 90); }, [tone]);

  return { zapSound, goldSound, buzzSound, missSound, overSound, levelSound };
}

function spawnBurst(arr, x, y, color, count, speedMin, speedMax, sizeMin, sizeMax, lifeMs) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = speedMin + Math.random() * (speedMax - speedMin);
    arr.push({
      x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      life: lifeMs, maxLife: lifeMs, color,
      size: sizeMin + Math.random() * (sizeMax - sizeMin),
    });
  }
}

function fallSpeedForLevel(level) { return clamp(0.13 + level * 0.02, 0.13, 0.42); }
function spawnIntervalForLevel(level) { return clamp(1500 - level * 110, 520, 1500); }
function activeLettersForLevel(level) { return clamp(4 + Math.floor((level - 1)), 4, POOL.length); }
function maxTilesForLevel(level) { return clamp(2 + Math.floor(level / 2), 2, 5); }

let tileIdSeq = 1;

function App() {
  const [phase, setPhase] = useState('start'); // start | playing | over
  const [score, setScore] = useState(0);
  const [lives, setLives] = useState(LIVES_START);
  const [combo, setCombo] = useState(0);
  const [level, setLevel] = useState(1);
  const [hurt, setHurt] = useState(false);
  const [shakeIt, setShakeIt] = useState(false);
  const [flashKind, setFlashKind] = useState(null);
  const [instructionText, setInstructionText] = useState('DECODE THE FALLING KEYS');
  const [activeCount, setActiveCount] = useState(4);
  const [highScore, setHighScore] = useState(() => parseInt(localStorage.getItem(HS_KEY) || '0', 10));
  const [statusMsg, setStatusMsg] = useState('Press the matching key or tap it before it hits the floor.');

  const canvasRef = useRef(null);
  const fieldRef = useRef(null);
  const particlesRef = useRef([]);
  const tilesRef = useRef([]);
  const scoreRef = useRef(0);
  const comboRef = useRef(0);
  const livesRef = useRef(LIVES_START);
  const levelRef = useRef(1);
  const zapStreakRef = useRef(0);
  const highScoreRef = useRef(highScore);
  const phaseRef = useRef('start');
  const dimsRef = useRef({ w: 300, h: 300 });
  const activeCountRef = useRef(4);
  const spawnTimerRef = useRef(0);

  const rafRef = useRef(null);
  const lastTsRef = useRef(null);
  const ambientTimeRef = useRef(0);
  const hurtTimeoutRef = useRef(null);
  const shakeTimeoutRef = useRef(null);
  const flashTimeoutRef = useRef(null);

  const { zapSound, goldSound, buzzSound, missSound, overSound, levelSound } = useAudio();

  useEffect(() => { phaseRef.current = phase; }, [phase]);

  const checkHighScore = useCallback(() => {
    if (scoreRef.current > highScoreRef.current) {
      highScoreRef.current = scoreRef.current;
      localStorage.setItem(HS_KEY, String(scoreRef.current));
      setHighScore(scoreRef.current);
    }
  }, []);

  const resizeCanvas = useCallback(() => {
    const canvas = canvasRef.current;
    const field = fieldRef.current;
    if (!canvas || !field) return;
    const rect = field.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dimsRef.current = { w: rect.width, h: rect.height };
  }, []);

  useEffect(() => {
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    return () => window.removeEventListener('resize', resizeCanvas);
  }, [resizeCanvas]);

  const endGame = useCallback(() => {
    phaseRef.current = 'over';
    setPhase('over');
    overSound();
    setStatusMsg('Signal corrupted.');
  }, [overSound]);

  const triggerHit = useCallback(() => {
    setHurt(true);
    clearTimeout(hurtTimeoutRef.current);
    hurtTimeoutRef.current = setTimeout(() => setHurt(false), 400);
    setShakeIt(true);
    clearTimeout(shakeTimeoutRef.current);
    shakeTimeoutRef.current = setTimeout(() => setShakeIt(false), 300);
    setFlashKind('bad');
    clearTimeout(flashTimeoutRef.current);
    flashTimeoutRef.current = setTimeout(() => setFlashKind(null), 300);
  }, []);

  const triggerGood = useCallback(() => {
    setFlashKind('good');
    clearTimeout(flashTimeoutRef.current);
    flashTimeoutRef.current = setTimeout(() => setFlashKind(null), 350);
  }, []);

  const spawnTile = useCallback(() => {
    const { w } = dimsRef.current;
    const n = activeCountRef.current;
    const letter = POOL[Math.floor(Math.random() * n)];
    const gold = Math.random() < 0.12;
    const pad = 34;
    tilesRef.current.push({
      id: tileIdSeq++,
      letter,
      gold,
      x: pad + Math.random() * Math.max(1, (w - pad * 2)),
      yFrac: -0.06 - Math.random() * 0.08,
    });
  }, []);

  const attemptZap = useCallback((letter) => {
    if (phaseRef.current !== 'playing') return;
    const L = (letter || '').toUpperCase();
    if (!L) return;
    const tiles = tilesRef.current;
    let bestIdx = -1;
    let bestY = -Infinity;
    for (let i = 0; i < tiles.length; i++) {
      if (tiles[i].letter === L && tiles[i].yFrac > bestY) { bestY = tiles[i].yFrac; bestIdx = i; }
    }
    const { w, h } = dimsRef.current;
    if (bestIdx === -1) {
      comboRef.current = 0;
      setCombo(0);
      buzzSound();
      setFlashKind('bad');
      clearTimeout(flashTimeoutRef.current);
      flashTimeoutRef.current = setTimeout(() => setFlashKind(null), 180);
      setStatusMsg(`No "${L}" falling right now.`);
      return;
    }
    const tile = tiles[bestIdx];
    tiles.splice(bestIdx, 1);
    comboRef.current += 1;
    setCombo(comboRef.current);
    const base = tile.gold ? 55 : 15;
    const gained = base + comboRef.current * 4;
    scoreRef.current += gained;
    setScore(scoreRef.current);
    if (tile.gold) goldSound(); else zapSound();
    triggerGood();
    spawnBurst(particlesRef.current, tile.x, tile.yFrac * h, tile.gold ? '#ffd23d' : '#b76dff', 18, 40, 170, 1.6, 5, 460);
    checkHighScore();
    zapStreakRef.current += 1;
    const newLevel = Math.floor(zapStreakRef.current / 8) + 1;
    if (newLevel !== levelRef.current) {
      levelRef.current = newLevel;
      setLevel(newLevel);
      activeCountRef.current = activeLettersForLevel(newLevel);
      setActiveCount(activeCountRef.current);
      levelSound();
      setStatusMsg(`Level ${newLevel}! Faster rain, more keys.`);
    } else {
      setStatusMsg('Decoded.');
    }
  }, [buzzSound, zapSound, goldSound, triggerGood, checkHighScore, levelSound]);

  const attemptZapRef = useRef(attemptZap);
  useEffect(() => { attemptZapRef.current = attemptZap; }, [attemptZap]);

  const resetGame = useCallback(() => {
    scoreRef.current = 0; setScore(0);
    comboRef.current = 0; setCombo(0);
    livesRef.current = LIVES_START; setLives(LIVES_START);
    levelRef.current = 1; setLevel(1);
    zapStreakRef.current = 0;
    activeCountRef.current = activeLettersForLevel(1);
    setActiveCount(activeCountRef.current);
    tilesRef.current = [];
    particlesRef.current = [];
    spawnTimerRef.current = 0;
  }, []);

  const startGame = useCallback(() => {
    resizeCanvas();
    resetGame();
    setStatusMsg('Press the matching key or tap it before it hits the floor.');
    phaseRef.current = 'playing';
    setPhase('playing');
  }, [resizeCanvas, resetGame]);

  const startGameRef = useRef(null);
  useEffect(() => { startGameRef.current = startGame; }, [startGame]);

  useEffect(() => {
    const onKeyDown = (e) => {
      if (phaseRef.current !== 'playing') {
        if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); startGameRef.current && startGameRef.current(); }
        return;
      }
      let letter = null;
      if (e.code && e.code.startsWith('Key') && e.code.length === 4) {
        letter = e.code.slice(3);
      } else if (e.key && e.key.length === 1 && /[a-zA-Z]/.test(e.key)) {
        letter = e.key.toUpperCase();
      }
      if (letter) { e.preventDefault(); attemptZapRef.current(letter); }
    };
    window.addEventListener('keydown', onKeyDown);
    return () => window.removeEventListener('keydown', onKeyDown);
  }, []);

  useEffect(() => () => {
    clearTimeout(hurtTimeoutRef.current);
    clearTimeout(shakeTimeoutRef.current);
    clearTimeout(flashTimeoutRef.current);
  }, []);

  // Main loop: spawn, fall, miss detection, particles, drawing
  useEffect(() => {
    const loop = (ts) => {
      const canvas = canvasRef.current;
      if (canvas) {
        const ctx = canvas.getContext('2d');
        const { w, h } = dimsRef.current;

        if (lastTsRef.current == null) lastTsRef.current = ts;
        let dt = (ts - lastTsRef.current) / 1000;
        lastTsRef.current = ts;
        dt = clamp(dt, 0, 0.033);

        ambientTimeRef.current += dt * 1000;

        if (w > 10 && h > 10) {
          if (phaseRef.current === 'playing') {
            const speed = fallSpeedForLevel(levelRef.current);
            const tiles = tilesRef.current;
            for (let i = tiles.length - 1; i >= 0; i--) {
              tiles[i].yFrac += speed * dt;
              if (tiles[i].yFrac >= BASELINE_FRAC) {
                const missed = tiles[i];
                tiles.splice(i, 1);
                comboRef.current = 0;
                setCombo(0);
                livesRef.current -= 1;
                setLives(livesRef.current);
                triggerHit();
                missSound();
                spawnBurst(particlesRef.current, missed.x, BASELINE_FRAC * h, '#ff3a5e', 16, 40, 160, 2, 5, 420);
                setInstructionText(`MISSED "${missed.letter}"`);
                if (livesRef.current <= 0) {
                  setStatusMsg('Too many leaks!');
                  endGame();
                } else {
                  setStatusMsg('A key hit the floor!');
                }
              }
            }

            spawnTimerRef.current -= dt * 1000;
            if (spawnTimerRef.current <= 0 && tilesRef.current.length < maxTilesForLevel(levelRef.current)) {
              spawnTile();
              spawnTimerRef.current = spawnIntervalForLevel(levelRef.current);
            }

            if (phaseRef.current === 'playing') {
              setInstructionText((prev) => (prev.startsWith('MISSED') ? prev : 'DECODE THE FALLING KEYS'));
            }
          }

          particlesRef.current = particlesRef.current.filter((p) => p.life > 0);
          for (const p of particlesRef.current) {
            p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; p.life -= dt * 1000;
          }

          ctx.clearRect(0, 0, w, h);
          ctx.fillStyle = '#08060f';
          ctx.fillRect(0, 0, w, h);

          const sweepY = ((ambientTimeRef.current / 9) % (h + 60)) - 30;
          const sweepGrad = ctx.createLinearGradient(0, sweepY - 30, 0, sweepY + 30);
          sweepGrad.addColorStop(0, 'rgba(183,109,255,0)');
          sweepGrad.addColorStop(0.5, 'rgba(183,109,255,0.06)');
          sweepGrad.addColorStop(1, 'rgba(183,109,255,0)');
          ctx.fillStyle = sweepGrad;
          ctx.fillRect(0, sweepY - 30, w, 60);

          // baseline
          const baseY = BASELINE_FRAC * h;
          ctx.save();
          ctx.strokeStyle = 'rgba(255,90,110,0.5)';
          ctx.lineWidth = 3;
          ctx.shadowColor = '#ff3a5e';
          ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.moveTo(6, baseY);
          ctx.lineTo(w - 6, baseY);
          ctx.stroke();
          ctx.restore();

          // tiles
          for (const t of tilesRef.current) {
            const ty = t.yFrac * h;
            const color = t.gold ? '#ffd23d' : '#b76dff';
            const r = Math.max(16, Math.min(24, w * 0.07));
            ctx.save();
            ctx.fillStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = 18;
            ctx.globalAlpha = 0.22;
            ctx.beginPath();
            ctx.arc(t.x, ty, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
            ctx.strokeStyle = color;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(t.x, ty, r, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = '#fff';
            ctx.font = `900 ${Math.round(r * 1.05)}px system-ui, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(t.letter, t.x, ty + 1);
            ctx.restore();
          }

          for (const p of particlesRef.current) {
            const a = clamp(p.life / p.maxLife, 0, 1);
            ctx.save();
            ctx.globalAlpha = a;
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
          }
        }
      }
      rafRef.current = requestAnimationFrame(loop);
    };
    rafRef.current = requestAnimationFrame(loop);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [endGame, missSound, spawnTile, triggerHit]);

  const keys = POOL.slice(0, Math.max(activeCount, 4));
  const lockedKeys = POOL.slice(Math.max(activeCount, 4));

  return (
    <div className="app">
      <div className="hud">
        <div className="hudBox">
          <div className="hudLabel">Score</div>
          <div className="hudValue" data-testid="score">{score}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Combo</div>
          <div className="hudValue combo" data-testid="combo">x{combo}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Level</div>
          <div className="hudValue" data-testid="level">{level}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Lives</div>
          <div className={"hudValue lives" + (hurt ? " hurt" : "")} data-testid="lives">{'♥'.repeat(Math.max(0, lives))}</div>
        </div>
      </div>

      {phase === 'playing' && (
        <div className="instructionBar" data-testid="instruction">
          <div className="instructionLabel">Cipher</div>
          <div className="instructionText">{instructionText}</div>
        </div>
      )}

      {phase !== 'playing' && (
        <div style={{ marginTop: 34, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 14 }}>
          <div className="title">CIPHER RAIN</div>
          <div className="subtitle">
            Glowing letter glyphs fall from above. Press the matching key on your keyboard, or tap its glowing button, before it crosses the red floor line. Combos build score fast, gold glyphs pay out big, and hitting an unmatched key just breaks your streak &mdash; but a glyph reaching the floor costs a life. Every 8 decodes levels you up, speeding the rain and unlocking more letters.
          </div>
        </div>
      )}

      <div
        className={"fieldOuter" + (shakeIt ? " shakeIt" : "")}
        data-testid="play-field"
        ref={fieldRef}
      >
        <canvas className="gameCanvas" data-testid="canvas" ref={canvasRef}></canvas>
        <div className={"flashOverlay" + (flashKind ? " " + flashKind : "")}></div>

        {phase === 'start' && (
          <div className="overlay">
            <div className="highscoreLine">High Score: {highScore}</div>
            <button className="btn" data-testid="start-btn" onClick={startGame}>START</button>
          </div>
        )}

        {phase === 'over' && (
          <div className="overlay">
            <div className="title" style={{ marginTop: 0, fontSize: 26 }}>SIGNAL CORRUPTED</div>
            <div className="hudValue" style={{ fontSize: 30 }}>{score}</div>
            <div className="highscoreLine">High Score: {highScore}</div>
            <button className="btn" data-testid="start-btn" onClick={startGame}>RETRY</button>
          </div>
        )}
      </div>

      {phase === 'playing' && (
        <div className="keypad">
          {keys.map((k) => (
            <button
              key={k}
              className="keyBtn"
              data-testid={`key-${k.toLowerCase()}-btn`}
              onClick={() => attemptZap(k)}
              onTouchStart={(e) => { e.preventDefault(); attemptZap(k); }}
            >{k}</button>
          ))}
          {lockedKeys.map((k) => (
            <button key={k} className="keyBtn locked" disabled data-testid={`key-${k.toLowerCase()}-btn`}>{k}</button>
          ))}
        </div>
      )}

      <div className="status">{statusMsg}</div>
      <div className="footer">Neon Game Arcade</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
