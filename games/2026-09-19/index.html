<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Signal Lock</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #04030a; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }
  #root { width: 100%; height: 100%; }

  .app {
    width: 100%; height: 100%; position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; overflow: hidden; gap: 6px; padding: 6px 0;
    background: radial-gradient(circle at 50% 8%, #0a1a1f 0%, #05080f 55%, #020207 100%);
  }

  .hud {
    position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-around;
    padding: 10px 12px; z-index: 15; pointer-events: none;
  }
  .hudBox { text-align: center; }
  .hudLabel { font-size: 10px; letter-spacing: 2px; color: #6dffe0; text-transform: uppercase; }
  .hudValue {
    font-size: 22px; font-weight: 800; color: #fff;
    text-shadow: 0 0 10px #6dffe0, 0 0 20px #6dffe0;
  }
  .hudValue.combo { color: #ffd23d; text-shadow: 0 0 10px #ffd23d, 0 0 22px #b3860a; }
  .hudValue.lives { color: #ff5e6c; text-shadow: 0 0 10px #ff5e6c, 0 0 22px #c90022; }
  .hudValue.hurt { animation: hurtPulse 0.4s ease; }
  @keyframes hurtPulse { 0%,100% { opacity:1; transform: scale(1);} 50% { opacity:0.4; transform: scale(1.25);} }

  .title {
    font-size: clamp(18px, 5vw, 30px); font-weight: 900; letter-spacing: 3px; margin-top: 34px;
    background: linear-gradient(90deg, #6dffe0, #4de8ff, #ffd23d);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(109,255,224,0.6));
    animation: titlePulse 2.4s ease-in-out infinite;
    text-align: center;
  }
  @keyframes titlePulse { 0%,100% { filter: drop-shadow(0 0 12px rgba(109,255,224,0.6)); } 50% { filter: drop-shadow(0 0 26px rgba(77,232,255,0.85)); } }

  .subtitle { color: #b8c8d0; font-size: 13px; letter-spacing: 0.5px; text-align: center; max-width: 460px; line-height: 1.55; }

  .btn {
    padding: 15px 40px; font-size: 19px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(135deg, #6dffe0, #4de8ff);
    border: none; border-radius: 50px; color: #021014; cursor: pointer;
    box-shadow: 0 0 20px rgba(109,255,224,0.7), 0 0 50px rgba(77,232,255,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(109,255,224,0.9), 0 0 70px rgba(77,232,255,0.5); }
  .btn:active { transform: scale(0.96); }

  .highscoreLine { color: #ffd23d; font-size: 14px; text-shadow: 0 0 8px rgba(255,210,61,0.6); }

  .instructionBar {
    display: flex; align-items: center; justify-content: center; z-index: 12;
    margin-top: 46px; min-height: 26px; padding: 0 12px;
  }
  .instructionLabel {
    font-size: 10px; letter-spacing: 2px; color: #7a92a0; text-transform: uppercase; margin-right: 6px;
  }
  .instructionText {
    font-size: 15px; font-weight: 800; letter-spacing: 1px; color: #fff;
    text-shadow: 0 0 8px #6dffe0, 0 0 16px rgba(109,255,224,0.5);
  }
  .instructionText.pulseWarn { color: #ffd23d; text-shadow: 0 0 8px #ffd23d, 0 0 18px rgba(255,210,61,0.6); }

  .trackOuter {
    position: relative; width: min(90vw, 460px); height: min(40vh, 300px); z-index: 5;
    border-radius: 18px; overflow: hidden; border: 2px solid rgba(109,255,224,0.25);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 0 30px rgba(109,255,224,0.12);
    background: #05080d; touch-action: none; margin-top: 4px; cursor: grab;
  }
  .trackOuter.shakeIt { animation: shakeKf 0.3s ease; }
  @keyframes shakeKf {
    0%, 100% { transform: translate(0,0); }
    20% { transform: translate(-6px, 3px); }
    40% { transform: translate(6px, -3px); }
    60% { transform: translate(-5px, -2px); }
    80% { transform: translate(5px, 2px); }
  }

  canvas.gameCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .flashOverlay {
    position: absolute; inset: 0; z-index: 9; pointer-events: none; background: rgba(255,46,79,0);
  }
  .flashOverlay.bad { animation: flashBadKf 0.3s ease; }
  @keyframes flashBadKf { 0% { background: rgba(255,46,79,0.35); } 100% { background: rgba(255,46,79,0); } }
  .flashOverlay.good { animation: flashGoodKf 0.35s ease; }
  @keyframes flashGoodKf { 0% { background: rgba(109,255,224,0.3); } 100% { background: rgba(109,255,224,0); } }

  .overlay {
    position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 18px;
    background: rgba(5, 8, 13, 0.92); backdrop-filter: blur(4px);
  }

  .controlsRow {
    display: flex; align-items: center; justify-content: center; gap: 22px; z-index: 10; margin-top: 2px;
  }
  .nudgeBtn {
    width: 68px; height: 56px; border-radius: 14px; border: none; cursor: pointer;
    background: linear-gradient(135deg, rgba(109,255,224,0.18), rgba(77,232,255,0.1));
    border: 2px solid rgba(109,255,224,0.4); color: #6dffe0; font-size: 24px; font-weight: 900;
    box-shadow: 0 0 14px rgba(109,255,224,0.25);
    transition: transform 0.12s ease, background 0.12s ease;
  }
  .nudgeBtn:active { transform: scale(0.92); background: rgba(109,255,224,0.32); }

  .status { color: #9aa8b3; font-size: 12px; letter-spacing: 0.5px; height: 15px; z-index: 10; text-align: center; }
  .footer { position: relative; text-align: center; color: #171d20; font-size: 10px; z-index: 10; padding-bottom: 2px; }

  @media (max-width: 480px) {
    .hudValue { font-size: 17px; }
    .btn { padding: 13px 30px; font-size: 16px; }
    .subtitle { font-size: 12px; }
    .trackOuter { height: min(34vh, 260px); }
    .instructionBar { margin-top: 40px; }
    .instructionText { font-size: 13px; }
    .nudgeBtn { width: 60px; height: 50px; font-size: 20px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const HS_KEY = 'signalLockHighScore';
const LIVES_START = 3;
const NUDGE_STEP = 0.085;

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function useAudio() {
  const ctxRef = useRef(null);
  const getCtx = () => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  };

  const tone = useCallback((freq, duration, type, gainScale, freqEnd) => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + duration);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(gainScale, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.05);
    } catch (e) {}
  }, []);

  const lockOnSound = useCallback(() => tone(720, 0.06, 'sine', 0.08, 900), [tone]);
  const lockOffSound = useCallback(() => tone(320, 0.05, 'sine', 0.06, 220), [tone]);
  const successSound = useCallback(() => { tone(660, 0.1, 'sine', 0.16, 990); setTimeout(() => tone(990, 0.14, 'sine', 0.14, 1400), 80); }, [tone]);
  const goldSound = useCallback(() => { tone(700, 0.1, 'sine', 0.18, 1100); setTimeout(() => tone(1100, 0.1, 'sine', 0.16, 1500), 70); setTimeout(() => tone(1500, 0.16, 'sine', 0.14, 2000), 140); }, [tone]);
  const zapSound = useCallback(() => tone(140, 0.35, 'sawtooth', 0.22, 40), [tone]);
  const overSound = useCallback(() => { tone(300, 0.25, 'sawtooth', 0.2, 200); setTimeout(() => tone(180, 0.35, 'sawtooth', 0.2, 80), 150); }, [tone]);
  const levelSound = useCallback(() => { tone(500, 0.1, 'square', 0.1, 900); setTimeout(() => tone(750, 0.12, 'square', 0.1, 1200), 90); }, [tone]);

  return { lockOnSound, lockOffSound, successSound, goldSound, zapSound, overSound, levelSound };
}

function spawnBurst(arr, x, y, color, count, speedMin, speedMax, sizeMin, sizeMax, lifeMs) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = speedMin + Math.random() * (speedMax - speedMin);
    arr.push({
      x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      life: lifeMs, maxLife: lifeMs, color,
      size: sizeMin + Math.random() * (sizeMax - sizeMin),
    });
  }
}

function zoneWidthForLevel(level) { return clamp(0.34 - level * 0.02, 0.12, 0.34); }
function driftSpeedForLevel(level) { return clamp(0.55 + level * 0.11, 0.55, 2.3); }
function pulseIntervalForLevel(level) { return clamp(4200 - level * 220, 1900, 4200); }

function App() {
  const [phase, setPhase] = useState('start'); // start | playing | over
  const [score, setScore] = useState(0);
  const [lives, setLives] = useState(LIVES_START);
  const [combo, setCombo] = useState(0);
  const [level, setLevel] = useState(1);
  const [hurt, setHurt] = useState(false);
  const [shakeIt, setShakeIt] = useState(false);
  const [flashKind, setFlashKind] = useState(null); // 'good' | 'bad' | null
  const [instructionText, setInstructionText] = useState('TRACK THE ZONE');
  const [pulseWarn, setPulseWarn] = useState(false);
  const [highScore, setHighScore] = useState(() => parseInt(localStorage.getItem(HS_KEY) || '0', 10));
  const [statusMsg, setStatusMsg] = useState('Hold the needle inside the zone. Survive the pulse.');

  const canvasRef = useRef(null);
  const trackRef = useRef(null);
  const particlesRef = useRef([]);
  const scoreRef = useRef(0);
  const comboRef = useRef(0);
  const livesRef = useRef(LIVES_START);
  const levelRef = useRef(1);
  const streakRef = useRef(0);
  const highScoreRef = useRef(highScore);
  const phaseRef = useRef('start');
  const dimsRef = useRef({ w: 300, h: 300 });

  const playerPosRef = useRef(0.5);
  const draggingRef = useRef(false);
  const zoneCenterRef = useRef(0.5);
  const zoneWidthRef = useRef(zoneWidthForLevel(1));
  const driftPhaseRef = useRef(Math.random() * 10);
  const driftSpeedRef = useRef(driftSpeedForLevel(1));
  const pulseIntervalRef = useRef(pulseIntervalForLevel(1));
  const pulseTimerRef = useRef(pulseIntervalForLevel(1));
  const isGoldPulseRef = useRef(false);
  const lockedRef = useRef(false);
  const lockedPrevRef = useRef(false);
  const lockTickRef = useRef(0);

  const rafRef = useRef(null);
  const lastTsRef = useRef(null);
  const ambientTimeRef = useRef(0);
  const hurtTimeoutRef = useRef(null);
  const shakeTimeoutRef = useRef(null);
  const flashTimeoutRef = useRef(null);
  const warnTimeoutRef = useRef(null);

  const { lockOnSound, lockOffSound, successSound, goldSound, zapSound, overSound, levelSound } = useAudio();

  useEffect(() => { phaseRef.current = phase; }, [phase]);

  const checkHighScore = useCallback(() => {
    if (scoreRef.current > highScoreRef.current) {
      highScoreRef.current = scoreRef.current;
      localStorage.setItem(HS_KEY, String(scoreRef.current));
      setHighScore(scoreRef.current);
    }
  }, []);

  const resizeCanvas = useCallback(() => {
    const canvas = canvasRef.current;
    const track = trackRef.current;
    if (!canvas || !track) return;
    const rect = track.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dimsRef.current = { w: rect.width, h: rect.height };
  }, []);

  useEffect(() => {
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    return () => window.removeEventListener('resize', resizeCanvas);
  }, [resizeCanvas]);

  const endGame = useCallback(() => {
    phaseRef.current = 'over';
    setPhase('over');
    overSound();
    setStatusMsg('Signal lost.');
  }, [overSound]);

  const triggerHit = useCallback(() => {
    setHurt(true);
    clearTimeout(hurtTimeoutRef.current);
    hurtTimeoutRef.current = setTimeout(() => setHurt(false), 400);
    setShakeIt(true);
    clearTimeout(shakeTimeoutRef.current);
    shakeTimeoutRef.current = setTimeout(() => setShakeIt(false), 300);
    setFlashKind('bad');
    clearTimeout(flashTimeoutRef.current);
    flashTimeoutRef.current = setTimeout(() => setFlashKind(null), 300);
  }, []);

  const triggerGood = useCallback(() => {
    setFlashKind('good');
    clearTimeout(flashTimeoutRef.current);
    flashTimeoutRef.current = setTimeout(() => setFlashKind(null), 350);
  }, []);

  const armNextPulse = useCallback(() => {
    pulseIntervalRef.current = pulseIntervalForLevel(levelRef.current);
    pulseTimerRef.current = pulseIntervalRef.current;
    isGoldPulseRef.current = Math.random() < 0.25;
  }, []);

  const resolvePulse = useCallback(() => {
    const { w, h } = dimsRef.current;
    const px = playerPosRef.current * w;
    const py = h * 0.5;

    if (lockedRef.current) {
      comboRef.current += 1;
      setCombo(comboRef.current);
      streakRef.current += 1;
      const base = isGoldPulseRef.current ? 60 : 20;
      const gained = base + comboRef.current * 6;
      scoreRef.current += gained;
      setScore(scoreRef.current);
      if (isGoldPulseRef.current) goldSound(); else successSound();
      triggerGood();
      spawnBurst(particlesRef.current, px, py, isGoldPulseRef.current ? '#ffd23d' : '#6dffe0', 20, 40, 180, 1.8, 5, 500);
      checkHighScore();
      const newLevel = Math.floor(streakRef.current / 4) + 1;
      if (newLevel !== levelRef.current) {
        levelRef.current = newLevel;
        setLevel(newLevel);
        zoneWidthRef.current = zoneWidthForLevel(newLevel);
        driftSpeedRef.current = driftSpeedForLevel(newLevel);
        levelSound();
        setStatusMsg(`Level ${newLevel}! Tighter zone, faster drift.`);
      } else {
        setStatusMsg('Pulse locked.');
      }
    } else {
      comboRef.current = 0;
      setCombo(0);
      livesRef.current -= 1;
      setLives(livesRef.current);
      triggerHit();
      zapSound();
      spawnBurst(particlesRef.current, zoneCenterRef.current * w, py, '#ff3a5e', 20, 50, 200, 2, 5.5, 480);
      if (livesRef.current <= 0) {
        setStatusMsg('Pulse missed!');
        endGame();
        return;
      } else {
        setStatusMsg('Pulse missed! Reset.');
      }
    }
    armNextPulse();
  }, [goldSound, successSound, triggerGood, zapSound, triggerHit, endGame, levelSound, armNextPulse, checkHighScore]);

  const resetGame = useCallback(() => {
    scoreRef.current = 0; setScore(0);
    comboRef.current = 0; setCombo(0);
    livesRef.current = LIVES_START; setLives(LIVES_START);
    levelRef.current = 1; setLevel(1);
    streakRef.current = 0;
    particlesRef.current = [];
    playerPosRef.current = 0.5;
    zoneCenterRef.current = 0.5;
    zoneWidthRef.current = zoneWidthForLevel(1);
    driftPhaseRef.current = Math.random() * 10;
    driftSpeedRef.current = driftSpeedForLevel(1);
    lockedRef.current = false;
    lockedPrevRef.current = false;
    lockTickRef.current = 0;
    armNextPulse();
  }, [armNextPulse]);

  const startGame = useCallback(() => {
    resizeCanvas();
    resetGame();
    setStatusMsg('Hold the needle inside the zone. Survive the pulse.');
    phaseRef.current = 'playing';
    setPhase('playing');
  }, [resizeCanvas, resetGame]);

  const startGameRef = useRef(null);
  useEffect(() => { startGameRef.current = startGame; }, [startGame]);

  const nudge = useCallback((dir) => {
    if (phaseRef.current !== 'playing') return;
    draggingRef.current = false;
    playerPosRef.current = clamp(playerPosRef.current + dir * NUDGE_STEP, 0, 1);
  }, []);

  const setPosFromClientX = useCallback((clientX) => {
    const track = trackRef.current;
    if (!track) return;
    const rect = track.getBoundingClientRect();
    const frac = clamp((clientX - rect.left) / rect.width, 0, 1);
    playerPosRef.current = frac;
  }, []);

  useEffect(() => {
    const track = trackRef.current;
    if (!track) return;

    const onDown = (e) => {
      if (phaseRef.current !== 'playing') return;
      draggingRef.current = true;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      setPosFromClientX(clientX);
    };
    const onMove = (e) => {
      if (!draggingRef.current) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      setPosFromClientX(clientX);
    };
    const onUp = () => { draggingRef.current = false; };

    track.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    track.addEventListener('touchstart', onDown, { passive: true });
    track.addEventListener('touchmove', onMove, { passive: true });
    track.addEventListener('touchend', onUp);

    return () => {
      track.removeEventListener('pointerdown', onDown);
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      track.removeEventListener('touchstart', onDown);
      track.removeEventListener('touchmove', onMove);
      track.removeEventListener('touchend', onUp);
    };
  }, [setPosFromClientX]);

  useEffect(() => {
    const onKeyDown = (e) => {
      if (phaseRef.current !== 'playing') {
        if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); startGameRef.current && startGameRef.current(); }
        return;
      }
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); nudge(-1); }
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); nudge(1); }
    };
    window.addEventListener('keydown', onKeyDown);
    return () => window.removeEventListener('keydown', onKeyDown);
  }, [nudge]);

  useEffect(() => () => {
    clearTimeout(hurtTimeoutRef.current);
    clearTimeout(shakeTimeoutRef.current);
    clearTimeout(flashTimeoutRef.current);
    clearTimeout(warnTimeoutRef.current);
  }, []);

  // Main loop: drift, lock tracking, pulse countdown, particles, drawing
  useEffect(() => {
    const loop = (ts) => {
      const canvas = canvasRef.current;
      if (canvas) {
        const ctx = canvas.getContext('2d');
        const { w, h } = dimsRef.current;

        if (lastTsRef.current == null) lastTsRef.current = ts;
        let dt = (ts - lastTsRef.current) / 1000;
        lastTsRef.current = ts;
        dt = clamp(dt, 0, 0.033);

        ambientTimeRef.current += dt * 1000;

        if (w > 10 && h > 10) {
          if (phaseRef.current === 'playing') {
            driftPhaseRef.current += driftSpeedRef.current * dt;
            const raw = 0.5 + 0.34 * Math.sin(driftPhaseRef.current) + 0.09 * Math.sin(driftPhaseRef.current * 2.3 + 1.3);
            const zw = zoneWidthRef.current;
            zoneCenterRef.current = clamp(raw, zw / 2 + 0.04, 1 - zw / 2 - 0.04);

            const locked = Math.abs(playerPosRef.current - zoneCenterRef.current) <= zoneWidthRef.current / 2;
            lockedRef.current = locked;
            if (locked !== lockedPrevRef.current) {
              if (locked) lockOnSound(); else lockOffSound();
              lockedPrevRef.current = locked;
            }

            if (locked) {
              lockTickRef.current += dt * 1000;
              if (lockTickRef.current >= 160) {
                lockTickRef.current = 0;
                scoreRef.current += 3 + comboRef.current * 2;
                setScore(scoreRef.current);
                checkHighScore();
              }
            } else {
              lockTickRef.current = 0;
            }

            pulseTimerRef.current -= dt * 1000;
            const frac = clamp(pulseTimerRef.current / pulseIntervalRef.current, 0, 1);
            const warning = frac < 0.22;
            if (warning !== pulseWarn) setPulseWarn(warning);
            setInstructionText(warning ? 'PULSE INCOMING' : (locked ? 'LOCKED — HOLD' : 'TRACK THE ZONE'));

            if (pulseTimerRef.current <= 0) {
              resolvePulse();
            }
          }

          particlesRef.current = particlesRef.current.filter((p) => p.life > 0);
          for (const p of particlesRef.current) {
            p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; p.life -= dt * 1000;
          }

          ctx.clearRect(0, 0, w, h);
          ctx.fillStyle = '#05080d';
          ctx.fillRect(0, 0, w, h);

          const sweepY = ((ambientTimeRef.current / 7) % (h + 60)) - 30;
          const sweepGrad = ctx.createLinearGradient(0, sweepY - 30, 0, sweepY + 30);
          sweepGrad.addColorStop(0, 'rgba(109,255,224,0)');
          sweepGrad.addColorStop(0.5, 'rgba(109,255,224,0.06)');
          sweepGrad.addColorStop(1, 'rgba(109,255,224,0)');
          ctx.fillStyle = sweepGrad;
          ctx.fillRect(0, sweepY - 30, w, 60);

          const midY = h * 0.5;
          const trackH = Math.max(10, Math.min(28, h * 0.12));

          // pulse countdown bar (top)
          const pFrac = clamp(pulseTimerRef.current / Math.max(1, pulseIntervalRef.current), 0, 1);
          ctx.save();
          const barH = 8;
          ctx.fillStyle = 'rgba(255,255,255,0.08)';
          ctx.fillRect(0, 0, w, barH);
          const barColor = pFrac < 0.22 ? '#ff3a5e' : (pFrac < 0.5 ? '#ffd23d' : '#6dffe0');
          ctx.fillStyle = barColor;
          ctx.shadowColor = barColor;
          ctx.shadowBlur = 10;
          ctx.fillRect(0, 0, w * (1 - pFrac), barH);
          ctx.restore();

          // base track line
          ctx.save();
          ctx.strokeStyle = 'rgba(255,255,255,0.12)';
          ctx.lineWidth = trackH;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(24, midY);
          ctx.lineTo(w - 24, midY);
          ctx.stroke();
          ctx.restore();

          // target zone
          const zx0 = 24 + (w - 48) * clamp(zoneCenterRef.current - zoneWidthRef.current / 2, 0, 1);
          const zx1 = 24 + (w - 48) * clamp(zoneCenterRef.current + zoneWidthRef.current / 2, 0, 1);
          const zoneColor = isGoldPulseRef.current ? '#ffd23d' : '#6dffe0';
          ctx.save();
          ctx.strokeStyle = zoneColor;
          ctx.lineWidth = trackH;
          ctx.lineCap = 'round';
          ctx.shadowColor = zoneColor;
          ctx.shadowBlur = pulseWarn ? 26 : 16;
          ctx.globalAlpha = pulseWarn ? (0.55 + 0.35 * Math.sin(ambientTimeRef.current / 60)) : 0.55;
          ctx.beginPath();
          ctx.moveTo(zx0, midY);
          ctx.lineTo(zx1, midY);
          ctx.stroke();
          ctx.restore();

          // needle
          const nx = 24 + (w - 48) * playerPosRef.current;
          const locked = lockedRef.current;
          const needleColor = locked ? '#6dffe0' : '#ffffff';
          ctx.save();
          ctx.fillStyle = needleColor;
          ctx.shadowColor = needleColor;
          ctx.shadowBlur = locked ? 22 : 10;
          ctx.beginPath();
          ctx.moveTo(nx, midY - trackH * 1.6);
          ctx.lineTo(nx - 10, midY - trackH * 0.5);
          ctx.lineTo(nx + 10, midY - trackH * 0.5);
          ctx.closePath();
          ctx.fill();
          ctx.beginPath();
          ctx.arc(nx, midY, trackH * 0.32, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          for (const p of particlesRef.current) {
            const a = clamp(p.life / p.maxLife, 0, 1);
            ctx.save();
            ctx.globalAlpha = a;
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
          }
        }
      }
      rafRef.current = requestAnimationFrame(loop);
    };
    rafRef.current = requestAnimationFrame(loop);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [resolvePulse, lockOnSound, lockOffSound, pulseWarn, checkHighScore]);

  return (
    <div className="app">
      <div className="hud">
        <div className="hudBox">
          <div className="hudLabel">Score</div>
          <div className="hudValue" data-testid="score">{score}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Combo</div>
          <div className="hudValue combo" data-testid="combo">x{combo}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Level</div>
          <div className="hudValue" data-testid="level">{level}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Lives</div>
          <div className={"hudValue lives" + (hurt ? " hurt" : "")} data-testid="lives">{'♥'.repeat(Math.max(0, lives))}</div>
        </div>
      </div>

      {phase === 'playing' && (
        <div className="instructionBar" data-testid="instruction">
          <div className="instructionLabel">Signal</div>
          <div className={"instructionText" + (pulseWarn ? " pulseWarn" : "")}>{instructionText}</div>
        </div>
      )}

      {phase !== 'playing' && (
        <div style={{ marginTop: 34, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 14 }}>
          <div className="title">SIGNAL LOCK</div>
          <div className="subtitle">
            Drag the track, hold Arrow keys / A-D, or tap the NUDGE buttons to keep your needle inside the drifting target zone. Score trickles in while you're locked on. A pulse sweeps in on a timer &mdash; be inside the zone when it hits or you lose a life and your combo. Gold pulses pay out big. Every 4 survived pulses levels you up, shrinking the zone and speeding the drift.
          </div>
        </div>
      )}

      <div
        className={"trackOuter" + (shakeIt ? " shakeIt" : "")}
        data-testid="play-field"
        ref={trackRef}
      >
        <canvas className="gameCanvas" data-testid="canvas" ref={canvasRef}></canvas>
        <div className={"flashOverlay" + (flashKind ? " " + flashKind : "")}></div>

        {phase === 'start' && (
          <div className="overlay">
            <div className="highscoreLine">High Score: {highScore}</div>
            <button className="btn" data-testid="start-btn" onClick={startGame}>START</button>
          </div>
        )}

        {phase === 'over' && (
          <div className="overlay">
            <div className="title" style={{ marginTop: 0, fontSize: 26 }}>SIGNAL LOST</div>
            <div className="hudValue" style={{ fontSize: 30 }}>{score}</div>
            <div className="highscoreLine">High Score: {highScore}</div>
            <button className="btn" data-testid="start-btn" onClick={startGame}>RETRY</button>
          </div>
        )}
      </div>

      {phase === 'playing' && (
        <div className="controlsRow">
          <button
            className="nudgeBtn"
            data-testid="nudge-left-btn"
            onClick={() => nudge(-1)}
            onTouchStart={(e) => { e.preventDefault(); nudge(-1); }}
          >&#9664;</button>
          <button
            className="nudgeBtn"
            data-testid="nudge-right-btn"
            onClick={() => nudge(1)}
            onTouchStart={(e) => { e.preventDefault(); nudge(1); }}
          >&#9654;</button>
        </div>
      )}

      <div className="status">{statusMsg}</div>
      <div className="footer">Neon Game Arcade</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
