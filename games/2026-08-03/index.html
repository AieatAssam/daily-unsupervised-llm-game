<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Skyhook</title><script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><style>*{box-sizing:border-box}html,body,#root{margin:0;height:100%;overflow:hidden}body{font:16px system-ui;color:#effcff;background:linear-gradient(#081a35,#12051f);user-select:none;touch-action:none}.app{height:100%;display:flex;flex-direction:column;padding:12px}.hud{display:flex;justify-content:space-around;text-align:center;color:#83ecff}.label{font-size:10px;letter-spacing:2px;opacity:.7}.value{font-size:22px;font-weight:800;text-shadow:0 0 12px #00eaff}.arena{position:relative;flex:1;min-height:0;border:1px solid #225477;border-radius:18px;overflow:hidden;box-shadow:0 0 30px #00eaff33}.arena canvas{width:100%;height:100%;display:block;cursor:crosshair}.overlay{position:absolute;inset:0;background:#050713d9;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}.title{font-size:clamp(42px,12vw,80px);margin:0;color:#ffd34d;text-shadow:0 0 20px #ff9d00;letter-spacing:5px}.copy{max-width:520px;line-height:1.6;color:#c7def2}.btn{min-height:52px;padding:12px 38px;border:2px solid #ffd34d;border-radius:30px;background:#ffd34d18;color:#fff;font-size:20px;font-weight:800;letter-spacing:3px}</style></head><body><div id="root"></div><script type="text/babel">const{useState,useEffect,useRef}=React;const KEY='skyhookHighScore';function App(){const ref=useRef(null),g=useRef(null),[screen,setScreen]=useState('start'),[score,setScore]=useState(0),[best,setBest]=useState(()=>+localStorage.getItem(KEY)||0),[lives,setLives]=useState(3);useEffect(()=>{localStorage.setItem(KEY,String(best))},[best]);useEffect(()=>{const c=ref.current,ctx=c.getContext('2d');let raf,active=true,last=0;function size(){c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}size();addEventListener('resize',size);function loop(t){if(!active)return;const dt=Math.min(45,t-last);last=t;const w=c.clientWidth,h=c.clientHeight,x=g.current?.x??w/2;if(g.current){const q=g.current;q.time+=dt;q.items.forEach(o=>o.y+=o.v*dt/16);for(let i=q.items.length-1;i>=0;i--)if(q.items[i].y>h+35){q.items.splice(i,1);q.lives--;setLives(q.lives);if(q.lives<=0){q.over=true;setScreen('over');break}} if(!q.over&&q.time>q.spawn){q.time=0;q.spawn=Math.max(260,q.spawn-3);q.items.push({x:30+Math.random()*(w-60),y:-20,v:1.5+Math.random()*2,bomb:Math.random()<.16})}if(q.lives<=0){q.over=true;setScreen('over')}}ctx.clearRect(0,0,w,h);ctx.strokeStyle='#2f5874';ctx.setLineDash([8,12]);ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();ctx.setLineDash([]);if(g.current){for(const o of g.current.items){ctx.fillStyle=o.bomb?'#ff477e':'#43f5ff';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=18;ctx.beginPath();ctx.arc(o.x,o.y,o.bomb?14:11,0,7);ctx.fill();if(o.bomb){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(o.x-9,o.y-9);ctx.lineTo(o.x+9,o.y+9);ctx.moveTo(o.x+9,o.y-9);ctx.lineTo(o.x-9,o.y+9);ctx.stroke()}}}raf=requestAnimationFrame(loop)}raf=requestAnimationFrame(loop);return()=>{active=false;cancelAnimationFrame(raf);removeEventListener('resize',size)}},[]);function start(){g.current={x:200,time:0,spawn:500,items:[],lives:3,over:false};setScore(0);setLives(3);setScreen('play')}function aim(e){const b=ref.current.getBoundingClientRect();if(g.current&&!g.current.over)g.current.x=Math.max(20,Math.min(b.width-20,e.clientX-b.left))}function catchIt(e){aim(e);if(!g.current||g.current.over)return;const b=ref.current.getBoundingClientRect(),x=e.clientX-b.left;let hit=false;for(let i=g.current.items.length-1;i>=0;i--){const o=g.current.items[i];if(Math.abs(o.x-x)<35&&o.y>b.height*.62&&o.y<b.height*.9){g.current.items.splice(i,1);if(o.bomb){g.current.lives--;setLives(g.current.lives);if(g.current.lives<=0){g.current.over=true;setScreen('over')}}else{const s=score+10;setScore(s);setBest(v=>Math.max(v,s))}hit=true;break}}}return <div className="app"><div className="hud"><div><div className="label">SCORE</div><div className="value">{score}</div></div><div><div className="label">LIVES</div><div className="value">{'♥'.repeat(lives)}{'♡'.repeat(3-lives)}</div></div><div><div className="label">BEST</div><div className="value">{best}</div></div></div><div className="arena"><canvas ref={ref} onPointerMove={aim} onPointerDown={catchIt}/>{screen==='start'&&<div className="overlay"><h1 className="title">SKYHOOK</h1><p className="copy">Drag the hook beneath falling signal capsules and tap to reel them in. Catch the cyan lights; avoid the spiked red decoys.</p><button className="btn" data-testid="start-btn" onClick={start}>START</button><p>Drag to aim · click/tap to hook</p></div>}{screen==='over'&&<div className="overlay"><h1 className="title" style={{fontSize:44}}>HOOK LOST</h1><p className="copy">Final score: <b>{score}</b></p><button className="btn" data-testid="start-btn" onClick={start}>RETRY</button></div>}</div></div>}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
<script>document.addEventListener('pointerdown',()=>document.body.dataset.lastAction=Date.now());document.addEventListener('pointermove',()=>document.body.dataset.lastAction=Date.now());</script>
