<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Orbit Slinger</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05030a; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }
  #root { width: 100%; height: 100%; }

  .app {
    width: 100%; height: 100%; position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; overflow: hidden; gap: 4px; padding: 6px 0;
    background: radial-gradient(circle at 50% 4%, #14102a 0%, #0a0714 55%, #030208 100%);
  }

  .hud {
    display: flex; justify-content: space-around; width: 100%; max-width: 480px;
    padding: 4px 12px; z-index: 15; gap: 4px;
  }
  .hudBox { text-align: center; }
  .hudLabel { font-size: 9px; letter-spacing: 2px; color: #5ec4ff; text-transform: uppercase; }
  .hudValue {
    font-size: 19px; font-weight: 800; color: #fff;
    text-shadow: 0 0 10px #5ec4ff, 0 0 20px #5ec4ff;
  }
  .hudValue.combo { color: #ffd23d; text-shadow: 0 0 10px #ffd23d, 0 0 22px #b3860a; }
  .hudValue.lives { color: #ff5ec4; text-shadow: 0 0 10px #ff5ec4, 0 0 20px #8a1a5a; }
  .hudValue.pulse { animation: hudPulse 0.4s ease; }
  @keyframes hudPulse { 0%,100% { opacity:1; transform: scale(1);} 50% { opacity:0.5; transform: scale(1.3);} }

  .title {
    font-size: clamp(18px, 5vw, 28px); font-weight: 900; letter-spacing: 3px; margin-top: 20px;
    background: linear-gradient(90deg, #5ec4ff, #ff5ec4, #ffd23d);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(94,196,255,0.6));
    animation: titlePulse 2.4s ease-in-out infinite;
    text-align: center;
  }
  @keyframes titlePulse { 0%,100% { filter: drop-shadow(0 0 12px rgba(94,196,255,0.6)); } 50% { filter: drop-shadow(0 0 26px rgba(255,94,196,0.85)); } }

  .subtitle { color: #b8c8d0; font-size: 12px; letter-spacing: 0.5px; text-align: center; max-width: 440px; line-height: 1.5; padding: 0 12px; }

  .btn {
    padding: 14px 38px; font-size: 18px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(135deg, #5ec4ff, #ff5ec4);
    border: none; border-radius: 50px; color: #0a0614; cursor: pointer;
    box-shadow: 0 0 20px rgba(94,196,255,0.7), 0 0 50px rgba(255,94,196,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(94,196,255,0.9), 0 0 70px rgba(255,94,196,0.5); }
  .btn:active { transform: scale(0.96); }

  .highscoreLine { color: #ffd23d; font-size: 13px; text-shadow: 0 0 8px rgba(255,210,61,0.6); }

  .fieldOuter {
    position: relative; height: min(64vh, 520px); z-index: 5;
    border-radius: 14px; overflow: hidden; border: 2px solid rgba(94,196,255,0.25);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 0 30px rgba(94,196,255,0.12);
    background: #08050c; touch-action: none; cursor: crosshair;
  }
  .fieldOuter.shakeIt { animation: shakeKf 0.3s ease; }
  @keyframes shakeKf {
    0%, 100% { transform: translate(0,0); }
    20% { transform: translate(-5px, 2px); }
    40% { transform: translate(5px, -2px); }
    60% { transform: translate(-4px, -2px); }
    80% { transform: translate(4px, 2px); }
  }

  canvas.gameCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .flashOverlay {
    position: absolute; inset: 0; z-index: 9; pointer-events: none; background: rgba(255,46,79,0);
  }
  .flashOverlay.bad { animation: flashBadKf 0.3s ease; }
  @keyframes flashBadKf { 0% { background: rgba(255,46,79,0.28); } 100% { background: rgba(255,46,79,0); } }
  .flashOverlay.good { animation: flashGoodKf 0.35s ease; }
  @keyframes flashGoodKf { 0% { background: rgba(94,196,255,0.26); } 100% { background: rgba(94,196,255,0); } }
  .flashOverlay.gold { animation: flashGoldKf 0.5s ease; }
  @keyframes flashGoldKf { 0% { background: rgba(255,210,61,0.38); } 100% { background: rgba(255,210,61,0); } }

  .overlay {
    position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 14px;
    background: rgba(8, 5, 12, 0.93); backdrop-filter: blur(4px);
  }

  .controlsRow {
    display: flex; gap: 8px; z-index: 10; margin-top: 4px; width: min(94vw, 420px); justify-content: center;
  }
  .angleBtn {
    height: 56px; flex: 0 0 22%; border-radius: 12px; cursor: pointer;
    background: linear-gradient(135deg, rgba(94,196,255,0.22), rgba(255,94,196,0.14));
    border: 2px solid rgba(94,196,255,0.45); color: #d8f0ff; font-size: 20px; font-weight: 900;
    box-shadow: 0 0 14px rgba(94,196,255,0.3);
    transition: transform 0.1s ease, background 0.1s ease;
  }
  .fireBtn {
    height: 56px; flex: 1; border-radius: 12px; cursor: pointer;
    background: linear-gradient(135deg, rgba(255,94,196,0.25), rgba(255,210,61,0.18));
    border: 2px solid rgba(255,94,196,0.5); color: #ffe3f6; font-size: 15px; font-weight: 900;
    letter-spacing: 1px;
    box-shadow: 0 0 14px rgba(255,94,196,0.3);
    transition: transform 0.1s ease, background 0.1s ease;
  }
  .fireBtn.pressed, .angleBtn.pressed { transform: scale(0.94); background: rgba(255,94,196,0.4); }

  .status { color: #9aa8b3; font-size: 11px; letter-spacing: 0.5px; height: 14px; z-index: 10; text-align: center; }
  .footer { position: relative; text-align: center; color: #171d20; font-size: 10px; z-index: 10; padding-bottom: 2px; }

  @media (max-width: 480px) {
    .hudValue { font-size: 15px; }
    .btn { padding: 12px 28px; font-size: 15px; }
    .subtitle { font-size: 11px; }
    .fieldOuter { height: min(54vh, 440px); }
    .fireBtn, .angleBtn { height: 52px; font-size: 13px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const HS_KEY = 'orbitSlingerHighScore';
const ASPECT = 0.62;
const GRAVITY_BASE = 780;
const MIN_SPEED = 340;
const MAX_SPEED = 980;
const CHARGE_MS = 900;
const ANGLE_STEP = 0.11;
const ANGLE_MAX = 1.15;
const HITS_PER_LEVEL = 5;

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }
function gravityForLevel(level) { return 1 + Math.min(level - 1, 8) * 0.05; }

function useAudio() {
  const ctxRef = useRef(null);
  const getCtx = () => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  };

  const tone = useCallback((freq, duration, type, gainScale, freqEnd) => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + duration);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(gainScale, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.05);
    } catch (e) {}
  }, []);

  const fireSound = useCallback((power) => tone(140 + power * 120, 0.09, 'sawtooth', 0.1, 60), [tone]);
  const hitSound = useCallback((combo) => {
    const base = 380 + Math.min(combo, 14) * 40;
    tone(base, 0.09, 'sine', 0.14, base * 1.7);
  }, [tone]);
  const goldSound = useCallback(() => { tone(600, 0.14, 'triangle', 0.16, 1100); setTimeout(() => tone(900, 0.16, 'triangle', 0.14, 1400), 80); }, [tone]);
  const mineSound = useCallback(() => tone(260, 0.22, 'sawtooth', 0.18, 90), [tone]);
  const levelSound = useCallback(() => { tone(500, 0.1, 'square', 0.1, 900); setTimeout(() => tone(750, 0.12, 'square', 0.1, 1200), 90); }, [tone]);
  const overSound = useCallback(() => { tone(300, 0.25, 'sawtooth', 0.2, 200); setTimeout(() => tone(180, 0.35, 'sawtooth', 0.2, 80), 150); }, [tone]);
  const missSound = useCallback(() => tone(200, 0.12, 'sine', 0.08, 120), [tone]);

  return { fireSound, hitSound, goldSound, mineSound, levelSound, overSound, missSound };
}

function spawnBurst(arr, x, y, color, count, speedMin, speedMax, sizeMin, sizeMax, lifeMs) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = speedMin + Math.random() * (speedMax - speedMin);
    arr.push({
      x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      life: lifeMs, maxLife: lifeMs, color,
      size: sizeMin + Math.random() * (sizeMax - sizeMin),
    });
  }
}

function buildLayout(level) {
  const targetCount = Math.min(4 + Math.floor((level - 1) * 0.7), 9);
  const hazardCount = Math.min(2 + Math.floor((level - 1) * 0.5), 6);
  const rPct = clamp(0.075 - (level - 1) * 0.003, 0.045, 0.075);
  const colors = ['#5ec4ff', '#b76dff', '#3dffa0', '#ff8a5e', '#4de8ff'];
  const goldIdx = Math.floor(Math.random() * targetCount);

  const targets = [];
  for (let i = 0; i < targetCount; i++) {
    const row = i % 3;
    const col = i / targetCount;
    targets.push({
      xPct: 0.15 + col * 0.7 + (Math.random() - 0.5) * 0.06,
      yPct: 0.12 + row * 0.16 + (Math.random() - 0.5) * 0.04,
      rPct: i === goldIdx ? rPct * 0.9 : rPct,
      color: colors[i % colors.length],
      gold: i === goldIdx,
      moving: level >= 3 && i % 2 === 0,
      moveAmp: 0.09 + Math.random() * 0.05,
      moveSpeed: 0.5 + Math.random() * 0.6,
      phase: Math.random() * Math.PI * 2,
      cooldown: 0,
    });
  }

  const hazards = [];
  for (let i = 0; i < hazardCount; i++) {
    hazards.push({
      xPct: 0.2 + (i / Math.max(1, hazardCount - 1)) * 0.6 + (Math.random() - 0.5) * 0.08,
      yPct: 0.32 + (i % 3) * 0.13 + (Math.random() - 0.5) * 0.03,
      rPct: 0.05,
      cooldown: 0,
    });
  }

  return { targets, hazards };
}

function App() {
  const [phase, setPhase] = useState('start'); // start | playing | over
  const [score, setScore] = useState(0);
  const [level, setLevel] = useState(1);
  const [lives, setLives] = useState(3);
  const [combo, setCombo] = useState(0);
  const [comboPulse, setComboPulse] = useState(false);
  const [shakeIt, setShakeIt] = useState(false);
  const [flashKind, setFlashKind] = useState(null);
  const [highScore, setHighScore] = useState(() => parseInt(localStorage.getItem(HS_KEY) || '0', 10));
  const [statusMsg, setStatusMsg] = useState('Drag to pull back, release to launch.');
  const [firePressed, setFirePressed] = useState(false);

  const canvasRef = useRef(null);
  const fieldRef = useRef(null);
  const particlesRef = useRef([]);

  const ballRef = useRef({ x: 100, y: 100, vx: 0, vy: 0, flying: false });
  const layoutRef = useRef({ targets: [], hazards: [] });
  const aimingRef = useRef(false);
  const chargingRef = useRef(false);
  const chargeStartRef = useRef(0);
  const aimPointRef = useRef({ x: 0, y: 0 });
  const keyboardAngleRef = useRef(0);
  const flightHitsRef = useRef(0);
  const timeRef = useRef(0);

  const scoreRef = useRef(0);
  const levelRef = useRef(1);
  const livesRef = useRef(3);
  const comboRef = useRef(0);
  const totalHitsRef = useRef(0);
  const highScoreRef = useRef(highScore);
  const phaseRef = useRef('start');
  const dimsRef = useRef({ w: 260, h: 420 });

  const rafRef = useRef(null);
  const lastTsRef = useRef(null);
  const flashTimeoutRef = useRef(null);
  const shakeTimeoutRef = useRef(null);
  const comboPulseTimeoutRef = useRef(null);

  const { fireSound, hitSound, goldSound, mineSound, levelSound, overSound, missSound } = useAudio();

  useEffect(() => { phaseRef.current = phase; }, [phase]);

  const checkHighScore = useCallback(() => {
    if (scoreRef.current > highScoreRef.current) {
      highScoreRef.current = scoreRef.current;
      localStorage.setItem(HS_KEY, String(scoreRef.current));
      setHighScore(scoreRef.current);
    }
  }, []);

  const resizeCanvas = useCallback(() => {
    const canvas = canvasRef.current;
    const field = fieldRef.current;
    if (!canvas || !field) return;
    const rect = field.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dimsRef.current = { w: rect.width, h: rect.height };
  }, []);

  useEffect(() => {
    resizeCanvas();
    const setFieldWidth = () => {
      const field = fieldRef.current;
      if (!field) return;
      const h = field.getBoundingClientRect().height;
      field.style.width = Math.round(h * ASPECT) + 'px';
      resizeCanvas();
    };
    setFieldWidth();
    window.addEventListener('resize', setFieldWidth);
    return () => window.removeEventListener('resize', setFieldWidth);
  }, [resizeCanvas]);

  const launcherPos = useCallback(() => {
    const { w, h } = dimsRef.current;
    return { x: w / 2, y: h * 0.93 };
  }, []);

  const resetBallToLauncher = useCallback(() => {
    const l = launcherPos();
    ballRef.current = { x: l.x, y: l.y, vx: 0, vy: 0, flying: false };
    aimPointRef.current = { x: l.x, y: l.y };
  }, [launcherPos]);

  const triggerFlash = useCallback((kind, ms) => {
    setFlashKind(kind);
    clearTimeout(flashTimeoutRef.current);
    flashTimeoutRef.current = setTimeout(() => setFlashKind(null), ms);
  }, []);

  const fireBall = useCallback((pullX, pullY) => {
    if (ballRef.current.flying || phaseRef.current !== 'playing') return;
    const l = launcherPos();
    const pullMag = Math.hypot(pullX, pullY);
    const { w, h } = dimsRef.current;
    const maxPull = Math.min(w, h) * 0.34;
    let dirX, dirY;
    if (pullMag < 6) {
      dirX = 0; dirY = -1;
    } else {
      dirX = -pullX / pullMag; dirY = -pullY / pullMag;
    }
    const frac = clamp(pullMag / maxPull, 0, 1);
    const speed = MIN_SPEED + frac * (MAX_SPEED - MIN_SPEED);
    ballRef.current = { x: l.x, y: l.y, vx: dirX * speed, vy: dirY * speed, flying: true };
    flightHitsRef.current = 0;
    fireSound(frac);
    setStatusMsg('Fired!');
  }, [launcherPos, fireSound]);

  const onTargetHit = useCallback((target) => {
    flightHitsRef.current += 1;
    comboRef.current += 1;
    setCombo(comboRef.current);
    setComboPulse(true);
    clearTimeout(comboPulseTimeoutRef.current);
    comboPulseTimeoutRef.current = setTimeout(() => setComboPulse(false), 350);

    const base = target.gold ? 300 : 80;
    const gained = base + (comboRef.current - 1) * 15;
    scoreRef.current += gained;
    setScore(scoreRef.current);
    checkHighScore();
    totalHitsRef.current += 1;

    const { w, h } = dimsRef.current;
    spawnBurst(particlesRef.current, target.xPct * w, target.yPct * h, target.color, target.gold ? 16 : 9, 60, 220, 1.5, 4, 500);

    if (target.gold) {
      goldSound();
      triggerFlash('gold', 450);
      setStatusMsg('JACKPOT ORB!');
    } else {
      hitSound(comboRef.current);
      triggerFlash('good', 250);
      setStatusMsg(comboRef.current > 4 ? `Combo x${comboRef.current}!` : 'Nice shot!');
    }

    const newLevel = Math.floor(totalHitsRef.current / HITS_PER_LEVEL) + 1;
    if (newLevel !== levelRef.current) {
      levelRef.current = newLevel;
      setLevel(newLevel);
      layoutRef.current = buildLayout(newLevel);
      levelSound();
      setStatusMsg(`Level ${newLevel}! Gravity rising.`);
    }
  }, [checkHighScore, hitSound, goldSound, levelSound, triggerFlash]);

  const onMineHit = useCallback((mine) => {
    livesRef.current -= 1;
    setLives(livesRef.current);
    comboRef.current = 0;
    setCombo(0);
    mineSound();
    triggerFlash('bad', 300);
    setShakeIt(true);
    clearTimeout(shakeTimeoutRef.current);
    shakeTimeoutRef.current = setTimeout(() => setShakeIt(false), 200);

    const { w, h } = dimsRef.current;
    spawnBurst(particlesRef.current, mine.xPct * w, mine.yPct * h, '#ff2e4f', 14, 80, 240, 1.5, 4, 500);

    if (livesRef.current <= 0) {
      phaseRef.current = 'over';
      setPhase('over');
      overSound();
      setStatusMsg('Out of orbs!');
      checkHighScore();
    } else {
      setStatusMsg('Hit a mine! Careful.');
    }
  }, [mineSound, triggerFlash, overSound, checkHighScore]);

  const onFlightEnd = useCallback(() => {
    if (flightHitsRef.current === 0) {
      comboRef.current = 0;
      setCombo(0);
      missSound();
      setStatusMsg('Missed! Pull back and try again.');
    }
    resetBallToLauncher();
  }, [missSound, resetBallToLauncher]);

  const resetGame = useCallback(() => {
    scoreRef.current = 0; setScore(0);
    levelRef.current = 1; setLevel(1);
    livesRef.current = 3; setLives(3);
    comboRef.current = 0; setCombo(0);
    totalHitsRef.current = 0;
    particlesRef.current = [];
    keyboardAngleRef.current = 0;
    aimingRef.current = false;
    chargingRef.current = false;
    setFirePressed(false);
    layoutRef.current = buildLayout(1);
    resetBallToLauncher();
  }, [resetBallToLauncher]);

  const startGame = useCallback(() => {
    resizeCanvas();
    resetGame();
    setStatusMsg('Drag to pull back, release to launch.');
    phaseRef.current = 'playing';
    setPhase('playing');
  }, [resizeCanvas, resetGame]);

  const startGameRef = useRef(null);
  useEffect(() => { startGameRef.current = startGame; }, [startGame]);

  const getLocalPoint = useCallback((e) => {
    const field = fieldRef.current;
    const rect = field.getBoundingClientRect();
    const cx = e.touches && e.touches.length ? e.touches[0].clientX : e.clientX;
    const cy = e.touches && e.touches.length ? e.touches[0].clientY : e.clientY;
    return { x: cx - rect.left, y: cy - rect.top };
  }, []);

  const clampAimPoint = useCallback((pt) => {
    const l = launcherPos();
    const { w, h } = dimsRef.current;
    const maxPull = Math.min(w, h) * 0.34;
    const dx = pt.x - l.x, dy = pt.y - l.y;
    const mag = Math.hypot(dx, dy);
    if (mag <= maxPull || mag === 0) return { x: pt.x, y: pt.y };
    return { x: l.x + (dx / mag) * maxPull, y: l.y + (dy / mag) * maxPull };
  }, [launcherPos]);

  const onPointerDownField = useCallback((e) => {
    if (phaseRef.current !== 'playing' || ballRef.current.flying) return;
    e.preventDefault();
    aimingRef.current = true;
    const pt = getLocalPoint(e);
    aimPointRef.current = clampAimPoint(pt);
  }, [getLocalPoint, clampAimPoint]);

  const onPointerMoveField = useCallback((e) => {
    if (!aimingRef.current) return;
    e.preventDefault();
    const pt = getLocalPoint(e);
    aimPointRef.current = clampAimPoint(pt);
  }, [getLocalPoint, clampAimPoint]);

  const onPointerUpField = useCallback((e) => {
    if (!aimingRef.current) return;
    aimingRef.current = false;
    const l = launcherPos();
    const pull = { x: aimPointRef.current.x - l.x, y: aimPointRef.current.y - l.y };
    fireBall(pull.x, pull.y);
  }, [launcherPos, fireBall]);

  const startCharging = useCallback(() => {
    if (phaseRef.current !== 'playing' || ballRef.current.flying || chargingRef.current) return;
    chargingRef.current = true;
    chargeStartRef.current = performance.now();
    setFirePressed(true);
  }, []);

  const releaseCharging = useCallback(() => {
    if (!chargingRef.current) return;
    chargingRef.current = false;
    setFirePressed(false);
    const l = launcherPos();
    const pull = { x: aimPointRef.current.x - l.x, y: aimPointRef.current.y - l.y };
    fireBall(pull.x, pull.y);
  }, [launcherPos, fireBall]);

  const nudgeAngle = useCallback((dir) => {
    keyboardAngleRef.current = clamp(keyboardAngleRef.current + dir * ANGLE_STEP, -ANGLE_MAX, ANGLE_MAX);
  }, []);

  useEffect(() => {
    const onKeyDown = (e) => {
      if (phaseRef.current !== 'playing') {
        if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); startGameRef.current && startGameRef.current(); }
        return;
      }
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); nudgeAngle(-1); }
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); nudgeAngle(1); }
      else if (e.code === 'Space') { if (!e.repeat) { e.preventDefault(); startCharging(); } }
    };
    const onKeyUp = (e) => {
      if (e.code === 'Space') { releaseCharging(); }
    };
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    return () => { window.removeEventListener('keydown', onKeyDown); window.removeEventListener('keyup', onKeyUp); };
  }, [nudgeAngle, startCharging, releaseCharging]);

  useEffect(() => () => {
    clearTimeout(flashTimeoutRef.current);
    clearTimeout(shakeTimeoutRef.current);
    clearTimeout(comboPulseTimeoutRef.current);
  }, []);

  // Main physics + draw loop
  useEffect(() => {
    const onTargetHitRef = onTargetHit;
    const onMineHitRef = onMineHit;
    const onFlightEndRef = onFlightEnd;

    const loop = (ts) => {
      const canvas = canvasRef.current;
      if (canvas) {
        const ctx = canvas.getContext('2d');
        const { w, h } = dimsRef.current;

        if (lastTsRef.current == null) lastTsRef.current = ts;
        let dt = (ts - lastTsRef.current) / 1000;
        lastTsRef.current = ts;
        dt = clamp(dt, 0, 0.033);
        timeRef.current += dt;

        if (w > 10 && h > 10) {
          const l = launcherPos();

          // Charging updates the virtual pulled-back aim point from keyboard/button input.
          if (chargingRef.current) {
            const elapsed = performance.now() - chargeStartRef.current;
            const frac = clamp(elapsed / CHARGE_MS, 0, 1);
            const maxPull = Math.min(w, h) * 0.34;
            const pullMag = frac * maxPull;
            const ang = keyboardAngleRef.current;
            const dirX = Math.sin(ang), dirY = -Math.cos(ang);
            aimPointRef.current = { x: l.x - dirX * pullMag, y: l.y - dirY * pullMag };
          } else if (!aimingRef.current && !ballRef.current.flying) {
            const indicatorLen = Math.min(w, h) * 0.12;
            const ang = keyboardAngleRef.current;
            const dirX = Math.sin(ang), dirY = -Math.cos(ang);
            aimPointRef.current = { x: l.x - dirX * indicatorLen, y: l.y - dirY * indicatorLen };
          }

          if (phaseRef.current === 'playing' && ballRef.current.flying) {
            const ball = ballRef.current;
            const r = w * 0.030;

            ball.vy += GRAVITY_BASE * gravityForLevel(levelRef.current) * dt;
            const speed = Math.hypot(ball.vx, ball.vy);
            if (speed > MAX_SPEED * 1.4) { ball.vx = (ball.vx / speed) * MAX_SPEED * 1.4; ball.vy = (ball.vy / speed) * MAX_SPEED * 1.4; }

            ball.x += ball.vx * dt;
            ball.y += ball.vy * dt;

            if (ball.x - r < 0) { ball.x = r; ball.vx = -ball.vx * 0.82; }
            if (ball.x + r > w) { ball.x = w - r; ball.vx = -ball.vx * 0.82; }
            if (ball.y - r < 0) { ball.y = r; ball.vy = -ball.vy * 0.8; }

            for (const target of layoutRef.current.targets) {
              if (target.cooldown > 0) { target.cooldown -= dt * 1000; continue; }
              const tx = target.moving ? target.xPct + Math.sin(timeRef.current * target.moveSpeed + target.phase) * target.moveAmp : target.xPct;
              const bx = clamp(tx, 0.06, 0.94) * w, by = target.yPct * h, br = target.rPct * w;
              const d = dist(ball.x, ball.y, bx, by);
              if (d < r + br) {
                target.cooldown = 550;
                onTargetHitRef(target);
                const nx = d > 0.001 ? (ball.x - bx) / d : 0, ny = d > 0.001 ? (ball.y - by) / d : -1;
                ball.vx = nx * Math.max(speed, 400) * 0.9;
                ball.vy = ny * Math.max(speed, 400) * 0.9;
              }
            }

            for (const mine of layoutRef.current.hazards) {
              if (mine.cooldown > 0) { mine.cooldown -= dt * 1000; continue; }
              const bx = mine.xPct * w, by = mine.yPct * h, br = mine.rPct * w;
              const d = dist(ball.x, ball.y, bx, by);
              if (d < r + br) {
                mine.cooldown = 900;
                onMineHitRef(mine);
                const nx = d > 0.001 ? (ball.x - bx) / d : 0, ny = d > 0.001 ? (ball.y - by) / d : -1;
                ball.vx = nx * Math.max(speed, 400) * 0.9;
                ball.vy = ny * Math.max(speed, 400) * 0.9;
              }
            }

            if (ball.y - r > h + 6 || ball.y < -h) {
              ball.flying = false;
              onFlightEndRef();
            }
          }

          particlesRef.current = particlesRef.current.filter((p) => p.life > 0);
          for (const p of particlesRef.current) {
            p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; p.life -= dt * 1000;
          }

          ctx.clearRect(0, 0, w, h);
          ctx.fillStyle = '#08050c';
          ctx.fillRect(0, 0, w, h);

          // Targets
          for (const target of layoutRef.current.targets) {
            const tx = target.moving ? target.xPct + Math.sin(timeRef.current * target.moveSpeed + target.phase) * target.moveAmp : target.xPct;
            const bx = clamp(tx, 0.06, 0.94) * w, by = target.yPct * h, br = target.rPct * w;
            const cooling = target.cooldown > 0;
            ctx.save();
            ctx.globalAlpha = cooling ? 0.25 : 1;
            ctx.strokeStyle = target.color;
            ctx.shadowColor = target.color;
            ctx.shadowBlur = target.gold ? 20 : 12;
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.stroke();
            ctx.fillStyle = target.color;
            ctx.globalAlpha = cooling ? 0.1 : 0.35;
            ctx.beginPath(); ctx.arc(bx, by, br * 0.55, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
          }

          // Hazards (mines)
          for (const mine of layoutRef.current.hazards) {
            const bx = mine.xPct * w, by = mine.yPct * h, br = mine.rPct * w;
            const cooling = mine.cooldown > 0;
            ctx.save();
            ctx.globalAlpha = cooling ? 0.3 : 0.95;
            ctx.fillStyle = '#ff2e4f';
            ctx.shadowColor = '#ff2e4f';
            ctx.shadowBlur = 14;
            ctx.beginPath(); ctx.arc(bx, by, br * 0.6, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#ffb0be';
            ctx.lineWidth = 2;
            const spikes = 8;
            for (let i = 0; i < spikes; i++) {
              const a = (i / spikes) * Math.PI * 2 + timeRef.current * 0.6;
              ctx.beginPath();
              ctx.moveTo(bx + Math.cos(a) * br * 0.6, by + Math.sin(a) * br * 0.6);
              ctx.lineTo(bx + Math.cos(a) * br * 1.15, by + Math.sin(a) * br * 1.15);
              ctx.stroke();
            }
            ctx.restore();
          }

          // Launcher
          ctx.save();
          ctx.strokeStyle = '#5ec4ff';
          ctx.shadowColor = '#5ec4ff';
          ctx.shadowBlur = 10;
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(l.x - w * 0.05, l.y + h * 0.03);
          ctx.lineTo(l.x, l.y - h * 0.02);
          ctx.lineTo(l.x + w * 0.05, l.y + h * 0.03);
          ctx.stroke();
          ctx.restore();

          // Aim line + pulled-back ball (only when idle/aiming, not flying)
          if (phaseRef.current === 'playing' && !ballRef.current.flying) {
            const ap = aimPointRef.current;
            ctx.save();
            ctx.strokeStyle = 'rgba(255,255,255,0.35)';
            ctx.setLineDash([6, 5]);
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(ap.x, ap.y); ctx.stroke();
            ctx.setLineDash([]);

            const dirX = l.x - ap.x, dirY = l.y - ap.y;
            const dm = Math.hypot(dirX, dirY) || 1;
            ctx.strokeStyle = '#ffd23d';
            ctx.shadowColor = '#ffd23d';
            ctx.shadowBlur = 8;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(l.x, l.y);
            ctx.lineTo(l.x + (dirX / dm) * 30, l.y + (dirY / dm) * 30);
            ctx.stroke();
            ctx.restore();

            ctx.save();
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = '#fff';
            ctx.shadowBlur = 16;
            ctx.beginPath(); ctx.arc(ap.x, ap.y, w * 0.030, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
          } else if (phaseRef.current === 'playing' && ballRef.current.flying) {
            const ball = ballRef.current;
            ctx.save();
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = '#fff';
            ctx.shadowBlur = 16;
            ctx.beginPath(); ctx.arc(ball.x, ball.y, w * 0.030, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
          }

          for (const p of particlesRef.current) {
            const a = clamp(p.life / p.maxLife, 0, 1);
            ctx.save();
            ctx.globalAlpha = a;
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
          }
        }
      }
      rafRef.current = requestAnimationFrame(loop);
    };
    rafRef.current = requestAnimationFrame(loop);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [onTargetHit, onMineHit, onFlightEnd, launcherPos]);

  return (
    <div className="app">
      <div className="hud">
        <div className="hudBox">
          <div className="hudLabel">Score</div>
          <div className="hudValue" data-testid="score">{score}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Level</div>
          <div className="hudValue" data-testid="level">{level}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Orbs</div>
          <div className="hudValue lives" data-testid="lives">{lives}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Combo</div>
          <div className={"hudValue combo" + (comboPulse ? " pulse" : "")} data-testid="combo">x{combo}</div>
        </div>
      </div>

      {phase !== 'playing' && (
        <div style={{ marginTop: 10, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 12 }}>
          <div className="title">ORBIT SLINGER</div>
          <div className="subtitle">
            Drag anywhere in the field to pull the orb back, then release to launch it in the opposite direction — the further you pull, the harder it flies. Chain shots into the glowing rings for a rising combo and score, the gold ring pays out huge, and ricocheting off the walls can rack up multiple hits per shot. Watch out for spiked mines drifting among the rings — clip one and you lose one of three orbs. Every five clean hits levels you up, adding more rings, tightening gravity, and setting some rings adrift.
          </div>
        </div>
      )}

      <div
        className={"fieldOuter" + (shakeIt ? " shakeIt" : "")}
        data-testid="play-field"
        ref={fieldRef}
        onMouseDown={onPointerDownField}
        onMouseMove={onPointerMoveField}
        onMouseUp={onPointerUpField}
        onMouseLeave={onPointerUpField}
        onTouchStart={onPointerDownField}
        onTouchMove={onPointerMoveField}
        onTouchEnd={onPointerUpField}
        onTouchCancel={onPointerUpField}
      >
        <canvas
          className="gameCanvas"
          data-testid="canvas"
          ref={canvasRef}
        ></canvas>
        <div className={"flashOverlay" + (flashKind ? " " + flashKind : "")}></div>

        {phase === 'start' && (
          <div className="overlay">
            <div className="highscoreLine">High Score: {highScore}</div>
            <button className="btn" data-testid="start-btn" onClick={startGame}>START</button>
          </div>
        )}

        {phase === 'over' && (
          <div className="overlay">
            <div className="title" style={{ marginTop: 0, fontSize: 22 }}>OUT OF ORBS</div>
            <div className="hudValue" style={{ fontSize: 26 }}>{score}</div>
            <div className="highscoreLine">High Score: {highScore}</div>
            <button className="btn" data-testid="start-btn" onClick={startGame}>RETRY</button>
          </div>
        )}
      </div>

      {phase === 'playing' && (
        <div className="controlsRow">
          <button
            className="angleBtn"
            data-testid="angle-left-btn"
            onClick={() => nudgeAngle(-1)}
          >◀</button>
          <button
            className={"fireBtn" + (firePressed ? " pressed" : "")}
            data-testid="fire-btn"
            onMouseDown={startCharging}
            onMouseUp={releaseCharging}
            onMouseLeave={releaseCharging}
            onTouchStart={(e) => { e.preventDefault(); startCharging(); }}
            onTouchEnd={(e) => { e.preventDefault(); releaseCharging(); }}
            onTouchCancel={(e) => { e.preventDefault(); releaseCharging(); }}
          >HOLD TO FIRE</button>
          <button
            className="angleBtn"
            data-testid="angle-right-btn"
            onClick={() => nudgeAngle(1)}
          >▶</button>
        </div>
      )}

      <div className="status">{statusMsg}</div>
      <div className="footer">Neon Game Arcade</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
