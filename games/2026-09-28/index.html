<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Crate Shift</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05040c; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }
  #root { width: 100%; height: 100%; }

  .app {
    width: 100%; height: 100%; position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; overflow: hidden; gap: 4px; padding: 6px 0;
    background: radial-gradient(circle at 50% 0%, #0f2438 0%, #0a1220 50%, #05040c 100%);
  }

  .bgGlow {
    position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: 0.5;
    background: radial-gradient(circle at 20% 20%, rgba(255,210,61,0.10), transparent 40%),
                radial-gradient(circle at 80% 30%, rgba(77,232,196,0.14), transparent 40%),
                radial-gradient(circle at 50% 90%, rgba(56,189,248,0.14), transparent 45%);
  }

  .hud {
    display: flex; justify-content: space-around; width: 100%; max-width: 480px;
    padding: 4px 12px; z-index: 15; gap: 4px; position: relative;
  }
  .hudBox { text-align: center; }
  .hudLabel { font-size: 9px; letter-spacing: 2px; color: #6fd7ff; text-transform: uppercase; }
  .hudValue {
    font-size: 19px; font-weight: 800; color: #fff;
    text-shadow: 0 0 10px #6fd7ff, 0 0 20px #6fd7ff;
  }
  .hudValue.combo { color: #ffd23d; text-shadow: 0 0 10px #ffd23d, 0 0 22px #b3860a; }
  .hudValue.best { color: #4de8c4; text-shadow: 0 0 10px #4de8c4, 0 0 20px #1c7a63; }
  .hudValue.lives { color: #ff6ec7; text-shadow: 0 0 10px #ff6ec7, 0 0 20px #ff6ec7; }
  .hudValue.timer { color: #ffe066; text-shadow: 0 0 10px #ffe066, 0 0 20px #ffe066; }
  .hudValue.timer.low { color: #ff4d6d; text-shadow: 0 0 12px #ff4d6d, 0 0 24px #ff4d6d; }
  .hudValue.pulse { animation: hudPulse 0.4s ease; }
  @keyframes hudPulse { 0%,100% { opacity:1; transform: scale(1);} 50% { opacity:0.5; transform: scale(1.3);} }

  .title {
    font-size: clamp(18px, 5vw, 28px); font-weight: 900; letter-spacing: 3px; margin-top: 14px;
    background: linear-gradient(90deg, #6fd7ff, #4de8c4, #ffd23d);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(111,215,255,0.6));
    animation: titlePulse 2.4s ease-in-out infinite;
    text-align: center;
  }
  @keyframes titlePulse { 0%,100% { filter: drop-shadow(0 0 12px rgba(111,215,255,0.6)); } 50% { filter: drop-shadow(0 0 26px rgba(77,232,196,0.85)); } }

  .subtitle { color: #b8c8d8; font-size: 12px; letter-spacing: 0.5px; text-align: center; max-width: 440px; line-height: 1.5; padding: 0 12px; }

  .btn {
    padding: 14px 38px; font-size: 18px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(135deg, #6fd7ff, #4de8c4);
    border: none; border-radius: 50px; color: #04121a; cursor: pointer;
    box-shadow: 0 0 20px rgba(111,215,255,0.7), 0 0 50px rgba(77,232,196,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(111,215,255,0.9), 0 0 70px rgba(77,232,196,0.5); }
  .btn:active { transform: scale(0.96); }

  .highscoreLine { color: #4de8c4; font-size: 13px; text-shadow: 0 0 8px rgba(77,232,196,0.6); }

  .fieldOuter {
    position: relative; width: min(88vw, 440px); height: min(88vw, 440px); z-index: 5;
    border-radius: 16px; overflow: hidden; border: 2px solid rgba(111,215,255,0.3);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 0 30px rgba(111,215,255,0.14);
    background: #060912; touch-action: none;
    margin-top: 6px;
  }
  .fieldOuter.shakeIt { animation: shakeKf 0.3s ease; }
  @keyframes shakeKf {
    0%, 100% { transform: translate(0,0); }
    20% { transform: translate(-5px, 2px); }
    40% { transform: translate(5px, -2px); }
    60% { transform: translate(-4px, -2px); }
    80% { transform: translate(4px, 2px); }
  }

  .board {
    position: absolute; inset: 0; display: grid; z-index: 3; padding: 3%;
  }
  .cell {
    position: relative; display: flex; align-items: center; justify-content: center;
  }
  .tile { position: absolute; inset: 6%; border-radius: 5px; }
  .tile.wall {
    background: linear-gradient(135deg, #1c2a3a, #0c141e);
    border: 1px solid rgba(111,215,255,0.18);
    box-shadow: inset 0 0 6px rgba(0,0,0,0.6);
  }
  .tile.floor { background: rgba(255,255,255,0.025); border: 1px solid rgba(255,255,255,0.04); }
  .tile.pad {
    background: rgba(255,210,61,0.06); border: 2px dashed rgba(255,210,61,0.55);
    box-shadow: 0 0 10px rgba(255,210,61,0.25) inset;
    animation: padPulse 1.6s ease-in-out infinite;
  }
  @keyframes padPulse { 0%,100% { opacity: 0.65; } 50% { opacity: 1; } }

  .crate {
    position: absolute; inset: 12%; border-radius: 6px; z-index: 4;
    background: linear-gradient(135deg, #b98bff, #8a5cff);
    border: 2px solid rgba(255,255,255,0.35);
    box-shadow: 0 0 14px 2px rgba(185,139,255,0.6);
    transition: left 0.09s linear, top 0.09s linear;
    animation: popIn 0.18s cubic-bezier(.34,1.56,.64,1);
  }
  .crate.locked {
    background: linear-gradient(135deg, #4de8c4, #1fae8a);
    box-shadow: 0 0 18px 4px rgba(77,232,196,0.85), inset 0 0 10px rgba(255,255,255,0.4);
    border: 2px solid #d6fff2;
  }
  @keyframes popIn { 0% { transform: scale(0.6); opacity: 0.4; } 60% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }

  .player {
    position: absolute; inset: 16%; z-index: 5; border-radius: 4px;
    background: linear-gradient(135deg, #6fd7ff, #38bdf8);
    box-shadow: 0 0 14px 3px rgba(111,215,255,0.85);
    transform: rotate(0deg);
    transition: transform 0.12s ease;
  }
  .player.bump { animation: bumpKf 0.16s ease; }
  @keyframes bumpKf { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.6); } }

  canvas.gameCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 6; pointer-events: none; }

  .flashOverlay {
    position: absolute; inset: 0; z-index: 9; pointer-events: none; background: rgba(255,255,255,0);
  }
  .flashOverlay.good { animation: flashGoodKf 0.3s ease; }
  @keyframes flashGoodKf { 0% { background: rgba(77,232,196,0.2); } 100% { background: rgba(77,232,196,0); } }
  .flashOverlay.level { animation: flashLevelKf 0.5s ease; }
  @keyframes flashLevelKf { 0% { background: rgba(255,210,61,0.36); } 100% { background: rgba(255,210,61,0); } }
  .flashOverlay.bad { animation: flashBadKf 0.4s ease; }
  @keyframes flashBadKf { 0% { background: rgba(255,77,109,0.32); } 100% { background: rgba(255,77,109,0); } }

  .overlay {
    position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 14px;
    background: rgba(6, 9, 18, 0.94); backdrop-filter: blur(4px);
  }

  .dpad {
    display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(2, 48px);
    gap: 6px; z-index: 10; margin-top: 8px; justify-content: center;
  }
  .dpadBtn {
    border-radius: 10px; cursor: pointer;
    background: linear-gradient(135deg, rgba(111,215,255,0.22), rgba(77,232,196,0.14));
    border: 2px solid rgba(111,215,255,0.45); color: #eafcff; font-size: 20px; font-weight: 900;
    box-shadow: 0 0 14px rgba(111,215,255,0.3);
    transition: transform 0.1s ease, background 0.1s ease;
  }
  .dpadBtn:active { transform: scale(0.92); background: rgba(111,215,255,0.4); }
  .dpadUp { grid-column: 2; grid-row: 1; }
  .dpadLeft { grid-column: 1; grid-row: 2; }
  .dpadDown { grid-column: 2; grid-row: 2; }
  .dpadRight { grid-column: 3; grid-row: 2; }

  .status { color: #8fa4b8; font-size: 11px; letter-spacing: 0.5px; height: 14px; z-index: 10; text-align: center; margin-top: 4px; }
  .footer { position: relative; text-align: center; color: #0d0f14; font-size: 10px; z-index: 10; padding-bottom: 2px; }

  @media (max-width: 480px) {
    .hudValue { font-size: 14px; }
    .btn { padding: 12px 28px; font-size: 15px; }
    .subtitle { font-size: 11px; }
    .fieldOuter { width: min(90vw, 360px); height: min(90vw, 360px); }
    .dpad { grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(2, 44px); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const HS_KEY = 'crateShiftHighScore';
const COLS = 8, ROWS = 8;
const START_LIVES = 3;
const COMBO_WINDOW_MS = 4500;

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function key(x, y) { return x + ',' + y; }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function useAudio() {
  const ctxRef = useRef(null);
  const getCtx = () => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  };

  const tone = useCallback((freq, duration, type, gainScale, freqEnd) => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + duration);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(gainScale, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.05);
    } catch (e) {}
  }, []);

  const pushSound = useCallback(() => tone(220, 0.05, 'square', 0.06, 180), [tone]);
  const bumpSound = useCallback(() => tone(120, 0.05, 'square', 0.05, 90), [tone]);
  const lockSound = useCallback((combo) => {
    const base = 440 + Math.min(combo, 12) * 40;
    tone(base, 0.12, 'triangle', 0.16, base * 1.8);
  }, [tone]);
  const unlockSound = useCallback(() => tone(300, 0.12, 'sawtooth', 0.1, 140), [tone]);
  const levelSound = useCallback(() => {
    tone(520, 0.1, 'square', 0.12, 880);
    setTimeout(() => tone(760, 0.12, 'square', 0.12, 1180), 90);
    setTimeout(() => tone(1040, 0.14, 'square', 0.12, 1400), 180);
  }, [tone]);
  const lifeLostSound = useCallback(() => {
    tone(320, 0.2, 'sawtooth', 0.16, 160);
  }, [tone]);
  const overSound = useCallback(() => {
    tone(300, 0.25, 'sawtooth', 0.2, 200);
    setTimeout(() => tone(180, 0.35, 'sawtooth', 0.2, 80), 150);
  }, [tone]);

  return { pushSound, bumpSound, lockSound, unlockSound, levelSound, lifeLostSound, overSound };
}

function levelConfig(level) {
  return {
    crates: clamp(2 + Math.floor((level - 1) / 2), 2, 5),
    wallCount: clamp(2 + Math.floor((level - 1) / 3), 2, 9),
    pullSteps: clamp(14 + level * 3, 14, 70),
    timeLimit: clamp(48 - (level - 1) * 2, 22, 48),
  };
}

function floodLargest(freeCells, wallSet) {
  const freeSet = new Set(freeCells.map(c => key(c.x, c.y)));
  const visited = new Set();
  let best = [];
  for (const start of freeCells) {
    const sk = key(start.x, start.y);
    if (visited.has(sk)) continue;
    const comp = [];
    const stack = [start];
    visited.add(sk);
    while (stack.length) {
      const cur = stack.pop();
      comp.push(cur);
      const nbrs = [[1,0],[-1,0],[0,1],[0,-1]];
      for (const [dx, dy] of nbrs) {
        const nx = cur.x + dx, ny = cur.y + dy;
        const nk = key(nx, ny);
        if (!visited.has(nk) && freeSet.has(nk)) {
          visited.add(nk);
          stack.push({ x: nx, y: ny });
        }
      }
    }
    if (comp.length > best.length) best = comp;
  }
  return best;
}

function generateLevel(level) {
  for (let i = 0; i < 8; i++) {
    const data = generateLevelOnce(level);
    if (countLocked(data.crates, data.pads) < data.pads.length) return data;
  }
  return generateLevelOnce(level);
}

function generateLevelOnce(level) {
  const cfg = levelConfig(level);
  let connected = [];
  let walls;
  let attempt = 0;
  do {
    walls = new Set();
    for (let x = 0; x < COLS; x++) { walls.add(key(x, 0)); walls.add(key(x, ROWS - 1)); }
    for (let y = 0; y < ROWS; y++) { walls.add(key(0, y)); walls.add(key(COLS - 1, y)); }
    const interior = [];
    for (let x = 1; x < COLS - 1; x++) for (let y = 1; y < ROWS - 1; y++) interior.push({ x, y });
    const shuffled = shuffle(interior);
    for (let i = 0; i < cfg.wallCount && i < shuffled.length; i++) walls.add(key(shuffled[i].x, shuffled[i].y));
    const free = interior.filter(c => !walls.has(key(c.x, c.y)));
    connected = floodLargest(free, walls);
    attempt++;
  } while (connected.length < cfg.crates + 3 && attempt < 25);

  const pool = shuffle(connected);
  const pads = pool.slice(0, cfg.crates).map(p => ({ x: p.x, y: p.y }));
  const rest = pool.slice(cfg.crates);
  const playerStart = rest.length ? rest[0] : pool[cfg.crates % pool.length];

  let crates = pads.map(p => ({ x: p.x, y: p.y }));
  let player = { x: playerStart.x, y: playerStart.y };

  const dirs = [{ dx: 1, dy: 0 }, { dx: -1, dy: 0 }, { dx: 0, dy: 1 }, { dx: 0, dy: -1 }];
  const isFree = (x, y) => !walls.has(key(x, y)) && !crates.some(c => c.x === x && c.y === y);

  for (let s = 0; s < cfg.pullSteps; s++) {
    const order = shuffle(dirs);
    for (const d of order) {
      const crateAdj = crates.find(c => c.x === player.x + d.dx && c.y === player.y + d.dy);
      const wantPull = Math.random() < 0.7;
      if (wantPull && crateAdj) {
        const nx = player.x - d.dx, ny = player.y - d.dy;
        if (nx > 0 && nx < COLS - 1 && ny > 0 && ny < ROWS - 1 && isFree(nx, ny)) {
          crateAdj.x = player.x; crateAdj.y = player.y;
          player = { x: nx, y: ny };
          break;
        }
      } else if (!crateAdj) {
        const nx = player.x + d.dx, ny = player.y + d.dy;
        if (nx > 0 && nx < COLS - 1 && ny > 0 && ny < ROWS - 1 && isFree(nx, ny)) {
          player = { x: nx, y: ny };
          break;
        }
      }
    }
  }

  return { walls, pads, crates, player, timeLimit: cfg.timeLimit };
}

function countLocked(crates, pads) {
  let n = 0;
  for (const c of crates) if (pads.some(p => p.x === c.x && p.y === c.y)) n++;
  return n;
}

function spawnBurst(arr, x, y, color, count, speedMin, speedMax, sizeMin, sizeMax, lifeMs) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = speedMin + Math.random() * (speedMax - speedMin);
    arr.push({
      x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      life: lifeMs, maxLife: lifeMs, color,
      size: sizeMin + Math.random() * (sizeMax - sizeMin),
    });
  }
}

function App() {
  const [phase, setPhase] = useState('start');
  const [level, setLevelState] = useState(1);
  const [score, setScoreState] = useState(0);
  const [combo, setComboState] = useState(0);
  const [comboPulse, setComboPulse] = useState(false);
  const [lives, setLivesState] = useState(START_LIVES);
  const [best, setBest] = useState(() => parseInt(localStorage.getItem(HS_KEY) || '0', 10));
  const [flashKind, setFlashKind] = useState(null);
  const [shakeIt, setShakeIt] = useState(false);
  const [bumpPlayer, setBumpPlayer] = useState(false);
  const [rotDeg, setRotDeg] = useState(0);
  const [timeLeft, setTimeLeft] = useState(30);
  const [statusMsg, setStatusMsg] = useState('Push crates onto the glowing pads.');
  const [renderTick, setRenderTick] = useState(0);

  const levelDataRef = useRef(null);
  const scoreRef = useRef(0);
  const bestRef = useRef(best);
  const levelRef = useRef(1);
  const comboRef = useRef(0);
  const livesRef = useRef(START_LIVES);
  const lastLockTimeRef = useRef(0);
  const phaseRef = useRef('start');
  const deadlineRef = useRef(0);
  const moveCooldownRef = useRef(0);
  const timeLeftRef = useRef(30);

  const canvasRef = useRef(null);
  const fieldRef = useRef(null);
  const particlesRef = useRef([]);
  const dimsRef = useRef({ w: 300, h: 300 });
  const rafRef = useRef(null);

  const flashTimeoutRef = useRef(null);
  const shakeTimeoutRef = useRef(null);
  const comboPulseTimeoutRef = useRef(null);
  const bumpTimeoutRef = useRef(null);
  const timerIntervalRef = useRef(null);

  const { pushSound, bumpSound, lockSound, unlockSound, levelSound, lifeLostSound, overSound } = useAudio();

  useEffect(() => { phaseRef.current = phase; }, [phase]);

  const resizeCanvas = useCallback(() => {
    const canvas = canvasRef.current;
    const field = fieldRef.current;
    if (!canvas || !field) return;
    const rect = field.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dimsRef.current = { w: rect.width, h: rect.height };
  }, []);

  useEffect(() => {
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    return () => window.removeEventListener('resize', resizeCanvas);
  }, [resizeCanvas]);

  const triggerFlash = useCallback((kind, ms) => {
    setFlashKind(kind);
    clearTimeout(flashTimeoutRef.current);
    flashTimeoutRef.current = setTimeout(() => setFlashKind(null), ms);
  }, []);

  const cellCenter = useCallback((x, y) => {
    const { w, h } = dimsRef.current;
    const pad = 0.03;
    const cw = (w * (1 - pad * 2)) / COLS;
    const ch = (h * (1 - pad * 2)) / ROWS;
    return { x: w * pad + cw * (x + 0.5), y: h * pad + ch * (y + 0.5) };
  }, []);

  const loadLevel = useCallback((lvl, keepScore) => {
    const data = generateLevel(lvl);
    levelDataRef.current = data;
    deadlineRef.current = performance.now() + data.timeLimit * 1000;
    timeLeftRef.current = data.timeLimit;
    setTimeLeft(data.timeLimit);
    comboRef.current = 0;
    setComboState(0);
    if (!keepScore) {
      scoreRef.current = 0; setScoreState(0);
      livesRef.current = START_LIVES; setLivesState(START_LIVES);
    }
    setRenderTick(t => t + 1);
  }, []);

  const startGame = useCallback(() => {
    resizeCanvas();
    levelRef.current = 1;
    setLevelState(1);
    particlesRef.current = [];
    loadLevel(1, false);
    setStatusMsg('Push crates onto the glowing pads.');
    phaseRef.current = 'playing';
    setPhase('playing');
  }, [resizeCanvas, loadLevel]);

  const startGameRef = useRef(null);
  useEffect(() => { startGameRef.current = startGame; }, [startGame]);

  // Countdown timer
  useEffect(() => {
    timerIntervalRef.current = setInterval(() => {
      if (phaseRef.current !== 'playing') return;
      const remain = Math.max(0, Math.ceil((deadlineRef.current - performance.now()) / 1000));
      timeLeftRef.current = remain;
      setTimeLeft(remain);
      if (remain <= 0) {
        livesRef.current -= 1;
        setLivesState(livesRef.current);
        lifeLostSound();
        triggerFlash('bad', 400);
        if (livesRef.current <= 0) {
          phaseRef.current = 'over';
          setPhase('over');
          overSound();
          setStatusMsg('Out of time and out of lives!');
          if (scoreRef.current > bestRef.current) {
            bestRef.current = scoreRef.current;
            localStorage.setItem(HS_KEY, String(scoreRef.current));
            setBest(scoreRef.current);
          }
        } else {
          setStatusMsg('Time up! Lost a life — new layout.');
          loadLevel(levelRef.current, true);
        }
      }
    }, 250);
    return () => clearInterval(timerIntervalRef.current);
  }, [loadLevel, lifeLostSound, overSound, triggerFlash]);

  const applyMove = useCallback((dx, dy) => {
    if (phaseRef.current !== 'playing') return;
    const now = performance.now();
    if (now < moveCooldownRef.current) return;
    moveCooldownRef.current = now + 85;

    const data = levelDataRef.current;
    if (!data) return;
    const { player, crates, walls, pads } = data;
    const nx = player.x + dx, ny = player.y + dy;

    setRotDeg(dx === 1 ? 0 : dx === -1 ? 180 : dy === 1 ? 90 : dy === -1 ? -90 : 0);

    if (walls.has(key(nx, ny))) {
      bumpSound();
      setBumpPlayer(true);
      clearTimeout(bumpTimeoutRef.current);
      bumpTimeoutRef.current = setTimeout(() => setBumpPlayer(false), 160);
      setShakeIt(true);
      clearTimeout(shakeTimeoutRef.current);
      shakeTimeoutRef.current = setTimeout(() => setShakeIt(false), 300);
      setRenderTick(t => t + 1);
      return;
    }

    const crateIdx = crates.findIndex(c => c.x === nx && c.y === ny);
    const lockedBefore = countLocked(crates, pads);

    if (crateIdx >= 0) {
      const cx = nx + dx, cy = ny + dy;
      if (walls.has(key(cx, cy)) || crates.some(c => c.x === cx && c.y === cy)) {
        bumpSound();
        setBumpPlayer(true);
        clearTimeout(bumpTimeoutRef.current);
        bumpTimeoutRef.current = setTimeout(() => setBumpPlayer(false), 160);
        setRenderTick(t => t + 1);
        return;
      }
      crates[crateIdx] = { x: cx, y: cy };
      data.player = { x: nx, y: ny };
      const lockedAfter = countLocked(crates, pads);

      if (lockedAfter > lockedBefore) {
        const sinceLast = now - lastLockTimeRef.current;
        const nextCombo = sinceLast < COMBO_WINDOW_MS ? comboRef.current + 1 : 1;
        comboRef.current = nextCombo;
        lastLockTimeRef.current = now;
        setComboState(nextCombo);
        setComboPulse(true);
        clearTimeout(comboPulseTimeoutRef.current);
        comboPulseTimeoutRef.current = setTimeout(() => setComboPulse(false), 350);

        const gained = 100 * nextCombo;
        scoreRef.current += gained;
        setScoreState(scoreRef.current);
        lockSound(nextCombo);
        triggerFlash('good', 220);
        const { x: px, y: py } = cellCenter(cx, cy);
        spawnBurst(particlesRef.current, px, py, '#4de8c4', 16, 40, 150, 1.5, 3.5, 480);
        setStatusMsg(nextCombo > 1 ? `Locked! Combo x${nextCombo}  +${gained}` : `Locked! +${gained}`);
      } else if (lockedAfter < lockedBefore) {
        comboRef.current = 0;
        setComboState(0);
        unlockSound();
        setStatusMsg('Crate slid off its pad.');
      } else {
        pushSound();
        setStatusMsg('Pushing...');
      }

      if (lockedAfter === pads.length) {
        const bonus = 500 + Math.round(timeLeftRef.current * 10);
        scoreRef.current += bonus;
        setScoreState(scoreRef.current);
        if (scoreRef.current > bestRef.current) {
          bestRef.current = scoreRef.current;
          localStorage.setItem(HS_KEY, String(scoreRef.current));
          setBest(scoreRef.current);
        }
        levelSound();
        triggerFlash('level', 500);
        const nextLevel = levelRef.current + 1;
        levelRef.current = nextLevel;
        setLevelState(nextLevel);
        setStatusMsg(`Level ${nextLevel}! +${bonus} bonus`);
        loadLevel(nextLevel, true);
        return;
      }
    } else {
      data.player = { x: nx, y: ny };
    }

    setRenderTick(t => t + 1);
  }, [bumpSound, pushSound, lockSound, unlockSound, levelSound, triggerFlash, cellCenter, loadLevel]);

  useEffect(() => {
    const onKeyDown = (e) => {
      if (phaseRef.current !== 'playing') {
        if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); startGameRef.current && startGameRef.current(); }
        return;
      }
      let d = null;
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') d = [-1, 0];
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') d = [1, 0];
      else if (e.code === 'ArrowUp' || e.code === 'KeyW') d = [0, -1];
      else if (e.code === 'ArrowDown' || e.code === 'KeyS') d = [0, 1];
      if (d) { e.preventDefault(); applyMove(d[0], d[1]); }
    };
    window.addEventListener('keydown', onKeyDown);
    return () => window.removeEventListener('keydown', onKeyDown);
  }, [applyMove]);

  useEffect(() => () => {
    clearTimeout(flashTimeoutRef.current);
    clearTimeout(shakeTimeoutRef.current);
    clearTimeout(comboPulseTimeoutRef.current);
    clearTimeout(bumpTimeoutRef.current);
  }, []);

  // Particle render loop
  useEffect(() => {
    const loop = () => {
      const canvas = canvasRef.current;
      if (canvas) {
        const ctx = canvas.getContext('2d');
        const { w, h } = dimsRef.current;
        if (w > 5 && h > 5) {
          ctx.clearRect(0, 0, w, h);
          const particles = particlesRef.current;
          for (const p of particles) {
            p.x += p.vx * 0.016; p.y += p.vy * 0.016;
            p.vx *= 0.94; p.vy *= 0.94; p.life -= 16;
          }
          particlesRef.current = particles.filter(p => p.life > 0);
          for (const p of particlesRef.current) {
            const a = clamp(p.life / p.maxLife, 0, 1);
            ctx.save();
            ctx.globalAlpha = a;
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
          }
        }
      }
      rafRef.current = requestAnimationFrame(loop);
    };
    rafRef.current = requestAnimationFrame(loop);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, []);

  const data = levelDataRef.current;
  const timerLow = timeLeft <= 10;

  return (
    <div className="app">
      <div className="bgGlow"></div>
      <div className="hud">
        <div className="hudBox">
          <div className="hudLabel">Score</div>
          <div className="hudValue" data-testid="score">{score}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Level</div>
          <div className="hudValue" data-testid="level">{level}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Combo</div>
          <div className={"hudValue combo" + (comboPulse ? " pulse" : "")} data-testid="combo">x{combo}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Lives</div>
          <div className="hudValue lives" data-testid="lives">{lives}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Time</div>
          <div className={"hudValue timer" + (timerLow ? " low" : "")} data-testid="timer">{timeLeft}</div>
        </div>
      </div>

      {phase !== 'playing' && (
        <div style={{ marginTop: 4, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 10 }}>
          <div className="title">CRATE SHIFT</div>
          <div className="subtitle">
            Push glowing crates onto the dashed gold pads before the clock runs out. Use Arrow keys / WASD or the on-screen D-pad to walk into a crate and shove it one tile — chain fast locks into a rising combo multiplier for huge scores. Slide a crate back off a pad and your combo resets. Clear every pad to advance to a tighter, more crowded layout with less time on the clock. Run out of time three times and it's game over — how deep can you shift?
          </div>
        </div>
      )}

      <div className={"fieldOuter" + (shakeIt ? " shakeIt" : "")} data-testid="play-field" ref={fieldRef}>
        <div className="board" data-testid="board" style={{ gridTemplateColumns: `repeat(${COLS}, 1fr)`, gridTemplateRows: `repeat(${ROWS}, 1fr)` }}>
          {data && Array.from({ length: ROWS }).map((_, y) => Array.from({ length: COLS }).map((_, x) => {
            const isWall = data.walls.has(key(x, y));
            const isPad = data.pads.some(p => p.x === x && p.y === y);
            const crateHere = data.crates.find(c => c.x === x && c.y === y);
            const isPlayer = data.player.x === x && data.player.y === y;
            const tileClass = isWall ? 'wall' : isPad ? 'pad' : 'floor';
            return (
              <div className="cell" key={x + '-' + y}>
                <div className={"tile " + tileClass}></div>
                {crateHere && (
                  <div
                    className={"crate" + (isPad ? " locked" : "")}
                    data-testid="crate"
                  ></div>
                )}
                {isPlayer && (
                  <div
                    className={"player" + (bumpPlayer ? " bump" : "")}
                    data-testid="player"
                    style={{ transform: `rotate(${rotDeg}deg)` }}
                  ></div>
                )}
              </div>
            );
          }))}
        </div>

        <canvas className="gameCanvas" data-testid="canvas" ref={canvasRef}></canvas>
        <div className={"flashOverlay" + (flashKind ? " " + flashKind : "")}></div>

        {phase === 'start' && (
          <div className="overlay">
            <div className="highscoreLine">Best: {best}</div>
            <button className="btn" data-testid="start-btn" onClick={startGame}>START</button>
          </div>
        )}

        {phase === 'over' && (
          <div className="overlay">
            <div className="title" style={{ marginTop: 0, fontSize: 22 }}>TIME'S OUT</div>
            <div className="hudValue" style={{ fontSize: 26 }}>{score}</div>
            <div className="highscoreLine">Best: {best}</div>
            <button className="btn" data-testid="start-btn" onClick={startGame}>RETRY</button>
          </div>
        )}
      </div>

      {phase === 'playing' && (
        <div className="dpad">
          <button className="dpadBtn dpadUp" data-testid="up-btn" onClick={() => applyMove(0, -1)}>▲</button>
          <button className="dpadBtn dpadLeft" data-testid="left-btn" onClick={() => applyMove(-1, 0)}>◀</button>
          <button className="dpadBtn dpadDown" data-testid="down-btn" onClick={() => applyMove(0, 1)}>▼</button>
          <button className="dpadBtn dpadRight" data-testid="right-btn" onClick={() => applyMove(1, 0)}>▶</button>
        </div>
      )}

      <div className="status">{statusMsg}</div>
      <div className="footer">Neon Game Arcade</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
