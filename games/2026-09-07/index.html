<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Circuit Serpent</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; overflow: hidden; background: #05040c; }
  body {
    height: 100vh;
    width: 100vw;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #e8f6ff;
    user-select: none;
    touch-action: none;
  }
  #root { width: 100%; height: 100%; }

  .app {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    background: radial-gradient(ellipse at 50% 0%, #191033 0%, #05040c 65%);
    overflow: hidden;
  }

  .hud {
    width: 100%;
    max-width: 640px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    font-size: 15px;
    letter-spacing: 0.5px;
    z-index: 5;
    flex-shrink: 0;
  }
  .hud .stat { display: flex; flex-direction: column; align-items: center; min-width: 64px; }
  .hud .label { font-size: 10px; opacity: 0.55; text-transform: uppercase; letter-spacing: 1.5px; }
  .hud .value {
    font-size: 20px;
    font-weight: 700;
    color: #7cf9ff;
    text-shadow: 0 0 10px #24d5ffaa;
  }
  .hud .value.combo { color: #ff5fd8; text-shadow: 0 0 10px #ff5fd8aa; }
  .hud .value.lives { color: #ffce54; text-shadow: 0 0 10px #ffce54aa; }

  .stage-wrap {
    position: relative;
    flex: 1;
    width: 100%;
    max-width: 640px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    padding: 4px 8px 8px;
  }

  canvas[data-testid="arena"] {
    background: #0a0716;
    border-radius: 14px;
    box-shadow: 0 0 0 1.5px #2d2550, 0 0 34px #6a3dffaa inset, 0 0 26px #1c0f4088;
    max-width: 100%;
    max-height: 100%;
    touch-action: none;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(5, 4, 12, 0.72);
    border-radius: 14px;
    z-index: 10;
    text-align: center;
    padding: 20px;
  }
  .overlay h1 {
    font-size: clamp(26px, 6vw, 40px);
    margin: 0;
    background: linear-gradient(90deg, #7cf9ff, #ff5fd8, #7cf9ff);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 3.5s linear infinite;
    text-shadow: 0 0 30px #6a3dff88;
  }
  @keyframes shimmer { to { background-position: 200% center; } }
  .overlay p { margin: 0; opacity: 0.8; font-size: 14px; max-width: 380px; line-height: 1.5; }
  .overlay .big-score { font-size: 32px; font-weight: 800; color: #ffce54; text-shadow: 0 0 16px #ffce5488; }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    outline: none;
  }
  .btn {
    padding: 14px 34px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #05040c;
    background: linear-gradient(135deg, #7cf9ff, #ff5fd8);
    border-radius: 999px;
    box-shadow: 0 0 24px #7cf9ff77, 0 4px 0 #1c0f40;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    min-height: 48px;
  }
  .btn:active { transform: translateY(3px) scale(0.97); box-shadow: 0 0 16px #7cf9ff55, 0 1px 0 #1c0f40; }

  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(3, 56px);
    gap: 6px;
    margin: 6px 0 10px;
    flex-shrink: 0;
    z-index: 5;
  }
  .dpad button {
    background: rgba(124, 249, 255, 0.08);
    border: 1.5px solid #2d2550;
    border-radius: 12px;
    color: #7cf9ff;
    font-size: 22px;
    min-height: 40px;
    min-width: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 10px #7cf9ff22 inset;
  }
  .dpad button:active { background: rgba(124, 249, 255, 0.28); }
  .dpad .up { grid-column: 2; grid-row: 1; }
  .dpad .left { grid-column: 1; grid-row: 2; }
  .dpad .down { grid-column: 2; grid-row: 3; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  .dpad .mid { grid-column: 2; grid-row: 2; visibility: hidden; }

  .hint { font-size: 12px; opacity: 0.5; margin-top: -4px; margin-bottom: 4px; text-align: center; }

  @media (min-width: 700px) {
    .dpad { display: none; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

const HS_KEY = 'circuitSerpent_highScore';
const GRID = 22;
const BASE_TICK = 150; // ms per move at start

function useHighScore() {
  const [hs, setHs] = useState(() => {
    const v = parseInt(localStorage.getItem(HS_KEY) || '0', 10);
    return Number.isFinite(v) ? v : 0;
  });
  const commit = useCallback((score) => {
    setHs(prev => {
      if (score > prev) {
        localStorage.setItem(HS_KEY, String(score));
        return score;
      }
      localStorage.setItem(HS_KEY, String(prev));
      return prev;
    });
  }, []);
  return [hs, commit];
}

function randCell(exclude) {
  let cell;
  do {
    cell = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
  } while (exclude.some(s => s.x === cell.x && s.y === cell.y));
  return cell;
}

function makeAudio() {
  let ctx = null;
  const get = () => {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  const beep = (freq, dur, type, gain) => {
    try {
      const c = get();
      const osc = c.createOscillator();
      const g = c.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, c.currentTime);
      g.gain.setValueAtTime(gain || 0.1, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
      osc.connect(g);
      g.connect(c.destination);
      osc.start();
      osc.stop(c.currentTime + dur);
    } catch (e) { /* audio unsupported */ }
  };
  return {
    eat: () => beep(660, 0.14, 'triangle', 0.12),
    boost: () => beep(880, 0.2, 'sawtooth', 0.1),
    crash: () => beep(120, 0.4, 'square', 0.14),
    turn: () => beep(320, 0.05, 'sine', 0.04),
  };
}

function Particle(x, y, color) {
  const ang = Math.random() * Math.PI * 2;
  const spd = 1 + Math.random() * 2.5;
  return {
    x, y,
    vx: Math.cos(ang) * spd,
    vy: Math.sin(ang) * spd,
    life: 1,
    color,
    size: 2 + Math.random() * 2.5,
  };
}

function App() {
  const canvasRef = useRef(null);
  const wrapRef = useRef(null);
  const [phase, setPhase] = useState('idle'); // idle | playing | gameover
  const [score, setScore] = useState(0);
  const [combo, setCombo] = useState(0);
  const [lives, setLives] = useState(3);
  const [hs, commitHs] = useHighScore();
  const audioRef = useRef(null);

  const stateRef = useRef({
    snake: [{ x: 11, y: 11 }],
    dir: { x: 1, y: 0 },
    pendingDir: { x: 1, y: 0 },
    node: { x: 15, y: 11 },
    boost: null,
    particles: [],
    tick: BASE_TICK,
    acc: 0,
    last: 0,
    score: 0,
    combo: 0,
    lives: 3,
    invuln: 0,
    shake: 0,
    running: false,
  });

  useEffect(() => { audioRef.current = makeAudio(); }, []);

  const resetGame = useCallback(() => {
    const s = stateRef.current;
    s.snake = [{ x: 11, y: 11 }, { x: 10, y: 11 }, { x: 9, y: 11 }];
    s.dir = { x: 1, y: 0 };
    s.pendingDir = { x: 1, y: 0 };
    s.node = randCell(s.snake);
    s.boost = null;
    s.particles = [];
    s.tick = BASE_TICK;
    s.acc = 0;
    s.score = 0;
    s.combo = 0;
    s.lives = 3;
    s.invuln = 0;
    s.shake = 0;
    s.running = true;
    setScore(0);
    setCombo(0);
    setLives(3);
  }, []);

  const startGame = useCallback(() => {
    resetGame();
    setPhase('playing');
    const c = audioRef.current;
    if (c) c.boost();
  }, [resetGame]);

  const setDirection = useCallback((dx, dy) => {
    const s = stateRef.current;
    if (!s.running) return;
    // ignore reversal into itself
    if (s.snake.length > 1 && dx === -s.dir.x && dy === -s.dir.y) return;
    if (dx === s.pendingDir.x && dy === s.pendingDir.y) return;
    s.pendingDir = { x: dx, y: dy };
    if (audioRef.current) audioRef.current.turn();
  }, []);

  // keyboard
  useEffect(() => {
    const onKey = (e) => {
      const map = {
        ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
        w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
        W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0],
      };
      if (map[e.key]) {
        e.preventDefault();
        setDirection(map[e.key][0], map[e.key][1]);
      } else if (e.key === ' ') {
        e.preventDefault();
        if (phase !== 'playing') startGame();
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [setDirection, phase, startGame]);

  // swipe on canvas
  useEffect(() => {
    const el = canvasRef.current;
    if (!el) return;
    let sx = 0, sy = 0, active = false;
    const onStart = (e) => {
      const t = e.touches ? e.touches[0] : e;
      sx = t.clientX; sy = t.clientY; active = true;
    };
    const onEnd = (e) => {
      if (!active) return;
      active = false;
      const t = e.changedTouches ? e.changedTouches[0] : e;
      const dx = t.clientX - sx, dy = t.clientY - sy;
      if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
      if (Math.abs(dx) > Math.abs(dy)) setDirection(dx > 0 ? 1 : -1, 0);
      else setDirection(0, dy > 0 ? 1 : -1);
    };
    el.addEventListener('touchstart', onStart, { passive: true });
    el.addEventListener('touchend', onEnd, { passive: true });
    el.addEventListener('mousedown', onStart);
    el.addEventListener('mouseup', onEnd);
    return () => {
      el.removeEventListener('touchstart', onStart);
      el.removeEventListener('touchend', onEnd);
      el.removeEventListener('mousedown', onStart);
      el.removeEventListener('mouseup', onEnd);
    };
  }, [setDirection]);

  const spawnBurst = (s, cellX, cellY, color, count) => {
    const px = cellX;
    const py = cellY;
    for (let i = 0; i < count; i++) s.particles.push(Particle(px, py, color));
  };

  const step = useCallback(() => {
    const s = stateRef.current;
    s.dir = s.pendingDir;
    const head = s.snake[0];
    const nx = head.x + s.dir.x;
    const ny = head.y + s.dir.y;

    const hitWall = nx < 0 || ny < 0 || nx >= GRID || ny >= GRID;
    const hitSelf = s.snake.some((seg, i) => i > 0 && seg.x === nx && seg.y === ny);

    if ((hitWall || hitSelf) && s.invuln <= 0) {
      s.lives -= 1;
      s.shake = 12;
      if (audioRef.current) audioRef.current.crash();
      spawnBurst(s, head.x, head.y, '#ff5fd8', 22);
      setLives(s.lives);
      if (s.lives <= 0) {
        s.running = false;
        commitHs(s.score);
        setPhase('gameover');
        return;
      }
      // soft reset position, keep score/length
      s.snake = s.snake.map((seg, i) => ({ x: Math.max(1, Math.min(GRID - 2, 11 - i)), y: 11 }));
      s.dir = { x: 1, y: 0 };
      s.pendingDir = { x: 1, y: 0 };
      s.invuln = 26;
      s.node = randCell(s.snake);
      s.combo = 0;
      setCombo(0);
      return;
    }

    const newHead = { x: (nx + GRID) % GRID, y: (ny + GRID) % GRID };
    s.snake.unshift(newHead);

    let ate = false;
    if (s.node && newHead.x === s.node.x && newHead.y === s.node.y) {
      ate = true;
      s.combo += 1;
      const gain = 10 + s.combo * 2;
      s.score += gain;
      setScore(s.score);
      setCombo(s.combo);
      if (audioRef.current) audioRef.current.eat();
      spawnBurst(s, newHead.x, newHead.y, '#7cf9ff', 16);
      s.node = randCell(s.snake);
      s.tick = Math.max(70, BASE_TICK - s.snake.length * 2.2);
    }

    if (!ate) {
      s.snake.pop();
    }

    if (s.invuln > 0) s.invuln -= 1;
  }, [commitHs]);

  // main loop
  useEffect(() => {
    if (phase !== 'playing') return;
    const s = stateRef.current;
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    let raf;

    const render = (now) => {
      if (!s.last) s.last = now;
      const dt = now - s.last;
      s.last = now;
      s.acc += dt;
      while (s.acc >= s.tick) {
        s.acc -= s.tick;
        if (s.running) step();
      }

      // particles physics
      s.particles.forEach(p => {
        p.x += p.vx * 0.12;
        p.y += p.vy * 0.12;
        p.life -= 0.045;
      });
      s.particles = s.particles.filter(p => p.life > 0);
      if (s.shake > 0) s.shake -= 1;

      draw(ctx, canvas, s);
      raf = requestAnimationFrame(render);
    };
    raf = requestAnimationFrame(render);
    return () => cancelAnimationFrame(raf);
  }, [phase, step]);

  function draw(ctx, canvas, s) {
    const w = canvas.width, h = canvas.height;
    const cell = w / GRID;
    ctx.save();
    if (s.shake > 0) {
      ctx.translate((Math.random() - 0.5) * s.shake, (Math.random() - 0.5) * s.shake);
    }
    ctx.clearRect(-20, -20, w + 40, h + 40);
    ctx.fillStyle = '#0a0716';
    ctx.fillRect(-20, -20, w + 40, h + 40);

    // grid lines
    ctx.strokeStyle = 'rgba(124,249,255,0.05)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= GRID; i++) {
      ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * cell); ctx.lineTo(w, i * cell); ctx.stroke();
    }

    // node
    if (s.node) {
      const cx = s.node.x * cell + cell / 2, cy = s.node.y * cell + cell / 2;
      const pulse = 0.7 + 0.3 * Math.sin(performance.now() / 180);
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, cell * 0.9 * pulse);
      grad.addColorStop(0, '#ffe98c');
      grad.addColorStop(1, 'rgba(255,206,84,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(cx, cy, cell * 0.9 * pulse, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffce54';
      ctx.beginPath(); ctx.arc(cx, cy, cell * 0.28, 0, Math.PI * 2); ctx.fill();
    }

    // snake
    const flashOn = s.invuln > 0 && Math.floor(performance.now() / 90) % 2 === 0;
    s.snake.forEach((seg, i) => {
      if (flashOn) return;
      const x = seg.x * cell, y = seg.y * cell;
      const t = i === 0 ? 1 : Math.max(0.35, 1 - i * 0.03);
      ctx.fillStyle = i === 0 ? '#7cf9ff' : `rgba(124,249,255,${t})`;
      ctx.shadowColor = '#7cf9ff';
      ctx.shadowBlur = i === 0 ? 18 : 8;
      const pad = cell * 0.08;
      ctx.beginPath();
      const r = cell * 0.22;
      const rx = x + pad, ry = y + pad, rw = cell - pad * 2, rh = cell - pad * 2;
      if (ctx.roundRect) ctx.roundRect(rx, ry, rw, rh, r);
      else ctx.rect(rx, ry, rw, rh);
      ctx.fill();
      ctx.shadowBlur = 0;
    });

    // particles
    s.particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      const cx = p.x * cell + cell / 2, cy = p.y * cell + cell / 2;
      ctx.beginPath();
      ctx.arc(cx, cy, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    });

    ctx.restore();
  }

  // canvas sizing
  useEffect(() => {
    const canvas = canvasRef.current;
    const wrap = wrapRef.current;
    const resize = () => {
      const size = Math.floor(Math.min(wrap.clientWidth, wrap.clientHeight, 560));
      canvas.width = size;
      canvas.height = size;
      canvas.style.width = size + 'px';
      canvas.style.height = size + 'px';
      const ctx = canvas.getContext('2d');
      draw(ctx, canvas, stateRef.current);
    };
    resize();
    window.addEventListener('resize', resize);
    return () => window.removeEventListener('resize', resize);
  }, []);

  // draw idle frame once mounted
  useEffect(() => {
    const canvas = canvasRef.current;
    if (canvas && phase !== 'playing') {
      const ctx = canvas.getContext('2d');
      draw(ctx, canvas, stateRef.current);
    }
  }, [phase]);

  return (
    <div className="app">
      <div className="hud">
        <div className="stat">
          <span className="label">Score</span>
          <span className="value" data-testid="score">{score}</span>
        </div>
        <div className="stat">
          <span className="label">Combo</span>
          <span className="value combo" data-testid="combo">x{combo}</span>
        </div>
        <div className="stat">
          <span className="label">Best</span>
          <span className="value">{hs}</span>
        </div>
        <div className="stat">
          <span className="label">Lives</span>
          <span className="value lives" data-testid="lives">{'●'.repeat(Math.max(0, lives))}{'○'.repeat(Math.max(0, 3 - lives))}</span>
        </div>
      </div>

      <div className="stage-wrap" ref={wrapRef} data-testid="play-field">
        <canvas ref={canvasRef} data-testid="arena" width="560" height="560" />
        {phase !== 'playing' && (
          <div className="overlay">
            {phase === 'idle' && (
              <React.Fragment>
                <h1>Circuit Serpent</h1>
                <p>Steer the data-serpent through the neon grid. Devour glowing nodes to grow and chain combos. Crash and you lose a life &mdash; three strikes ends the run.</p>
                <button className="btn" data-testid="start-btn" onClick={startGame}>Start Run</button>
              </React.Fragment>
            )}
            {phase === 'gameover' && (
              <React.Fragment>
                <h1>Circuit Fried</h1>
                <div className="big-score">{score} pts</div>
                <p>Best: {hs}</p>
                <button className="btn" data-testid="start-btn" onClick={startGame}>Retry</button>
              </React.Fragment>
            )}
          </div>
        )}
      </div>

      <div className="hint">Arrow keys / WASD / swipe / D-pad to steer</div>
      <div className="dpad" data-testid="dpad">
        <button className="up" onClick={() => setDirection(0, -1)} aria-label="up">▲</button>
        <button className="left" onClick={() => setDirection(-1, 0)} aria-label="left">◀</button>
        <div className="mid" />
        <button className="right" onClick={() => setDirection(1, 0)} aria-label="right">▶</button>
        <button className="down" onClick={() => setDirection(0, 1)} aria-label="down">▼</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
