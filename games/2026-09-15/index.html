<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Circuit Echo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05030a; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }
  #root { width: 100%; height: 100%; }

  .app {
    width: 100%; height: 100%; position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; overflow: hidden; gap: 6px; padding: 6px 0;
    background: radial-gradient(circle at 50% 10%, #10071f 0%, #08050f 55%, #030308 100%);
  }

  .hud {
    position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-around;
    padding: 10px 12px; z-index: 15; pointer-events: none;
  }
  .hudBox { text-align: center; }
  .hudLabel { font-size: 10px; letter-spacing: 2px; color: #9d6bff; text-transform: uppercase; }
  .hudValue {
    font-size: 22px; font-weight: 800; color: #fff;
    text-shadow: 0 0 10px #9d6bff, 0 0 20px #9d6bff;
  }
  .hudValue.combo { color: #ffd23d; text-shadow: 0 0 10px #ffd23d, 0 0 22px #b3860a; }
  .hudValue.lives { color: #ff5ec4; text-shadow: 0 0 10px #ff5ec4, 0 0 22px #c9007f; }
  .hudValue.hurt { animation: hurtPulse 0.4s ease; }
  @keyframes hurtPulse { 0%,100% { opacity:1; transform: scale(1);} 50% { opacity:0.4; transform: scale(1.25);} }

  .title {
    font-size: clamp(18px, 5vw, 30px); font-weight: 900; letter-spacing: 3px; margin-top: 34px;
    background: linear-gradient(90deg, #3ddcff, #9d6bff, #ff5ec4);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(157,107,255,0.6));
    animation: titlePulse 2.4s ease-in-out infinite;
    text-align: center;
  }
  @keyframes titlePulse { 0%,100% { filter: drop-shadow(0 0 12px rgba(157,107,255,0.6)); } 50% { filter: drop-shadow(0 0 26px rgba(61,220,255,0.85)); } }

  .subtitle { color: #c4bcd8; font-size: 13px; letter-spacing: 0.5px; text-align: center; max-width: 460px; line-height: 1.55; }

  .btn {
    padding: 15px 40px; font-size: 19px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(135deg, #9d6bff, #3ddcff);
    border: none; border-radius: 50px; color: #0a0020; cursor: pointer;
    box-shadow: 0 0 20px rgba(157,107,255,0.7), 0 0 50px rgba(61,220,255,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(157,107,255,0.9), 0 0 70px rgba(61,220,255,0.5); }
  .btn:active { transform: scale(0.96); }

  .highscoreLine { color: #ffd23d; font-size: 14px; text-shadow: 0 0 8px rgba(255,210,61,0.6); }

  .arenaOuter {
    position: relative; width: min(90vw, 400px); height: min(58vh, 440px); z-index: 5;
    border-radius: 18px; overflow: hidden; border: 2px solid rgba(157,107,255,0.25);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 0 30px rgba(157,107,255,0.12);
    background: #07050f; touch-action: none; margin-top: 4px;
  }
  .arenaOuter.shakeIt { animation: shakeKf 0.3s ease; }
  @keyframes shakeKf {
    0%, 100% { transform: translate(0,0); }
    20% { transform: translate(-6px, 3px); }
    40% { transform: translate(6px, -3px); }
    60% { transform: translate(-5px, -2px); }
    80% { transform: translate(5px, 2px); }
  }

  canvas.gameCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .flashOverlay {
    position: absolute; inset: 0; z-index: 9; pointer-events: none; background: rgba(255,46,79,0);
  }
  .flashOverlay.on { animation: flashKf 0.3s ease; }
  @keyframes flashKf { 0% { background: rgba(255,46,79,0.35); } 100% { background: rgba(255,46,79,0); } }

  .overlay {
    position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 18px;
    background: rgba(8, 5, 16, 0.92); backdrop-filter: blur(4px);
  }

  .padBtn {
    position: absolute; border: 2px solid rgba(255,255,255,0.25); border-radius: 16px;
    background: radial-gradient(circle at 40% 35%, rgba(255,255,255,0.08), rgba(10,10,20,0.85));
    cursor: pointer; -webkit-appearance: none; appearance: none; z-index: 7;
    transition: transform 0.08s ease, box-shadow 0.15s ease, background 0.15s ease;
    box-shadow: 0 0 10px rgba(255,255,255,0.08);
  }
  .padBtn:active { transform: scale(0.94); }
  .padBtn.lit { box-shadow: 0 0 26px 6px var(--padglow), 0 0 50px var(--padglow); border-color: #fff; }
  .padBtn.wrongLit { box-shadow: 0 0 26px 6px #ff3a5e, 0 0 50px #ff3a5e; border-color: #fff; }

  .padUp { top: 4%; left: 37%; width: 26%; height: 22%; }
  .padDown { bottom: 4%; left: 37%; width: 26%; height: 22%; }
  .padLeft { left: 4%; top: 39%; width: 22%; height: 22%; }
  .padRight { right: 4%; top: 39%; width: 22%; height: 22%; }

  .status { color: #b3a8cc; font-size: 12px; letter-spacing: 0.5px; height: 15px; z-index: 10; text-align: center; }
  .footer { position: relative; text-align: center; color: #201a2c; font-size: 10px; z-index: 10; padding-bottom: 2px; }

  @media (max-width: 480px) {
    .hudValue { font-size: 17px; }
    .btn { padding: 13px 30px; font-size: 16px; }
    .subtitle { font-size: 12px; }
    .arenaOuter { height: min(50vh, 380px); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const HS_KEY = 'circuitEchoHighScore';
const LIVES_START = 3;

const PADS = [
  { id: 'up', color: '#3ddcff', freq: 392, pos: { x: 0.5, y: 0.15 } },
  { id: 'right', color: '#ff5ec4', freq: 494, pos: { x: 0.85, y: 0.5 } },
  { id: 'down', color: '#ffd23d', freq: 587, pos: { x: 0.5, y: 0.85 } },
  { id: 'left', color: '#7dffb0', freq: 330, pos: { x: 0.15, y: 0.5 } },
];
const PAD_BY_ID = Object.fromEntries(PADS.map((p) => [p.id, p]));

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

const highlightMs = (level) => clamp(560 - (level - 1) * 16, 230, 560);

function useAudio() {
  const ctxRef = useRef(null);
  const getCtx = () => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  };

  const tone = useCallback((freq, duration, type, gainScale, freqEnd) => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + duration);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(gainScale, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.05);
    } catch (e) {}
  }, []);

  const padSound = useCallback((freq) => tone(freq, 0.22, 'triangle', 0.14, freq * 0.9), [tone]);
  const wrongSound = useCallback(() => tone(180, 0.3, 'sawtooth', 0.2, 60), [tone]);
  const roundSound = useCallback(() => { tone(520, 0.1, 'sine', 0.16, 780); setTimeout(() => tone(700, 0.14, 'sine', 0.16, 1040), 100); }, [tone]);
  const overSound = useCallback(() => { tone(300, 0.25, 'sawtooth', 0.2, 200); setTimeout(() => tone(180, 0.35, 'sawtooth', 0.2, 80), 150); }, [tone]);

  return { padSound, wrongSound, roundSound, overSound };
}

function spawnBurst(arr, x, y, color, count, speedMin, speedMax, sizeMin, sizeMax, lifeMs) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = speedMin + Math.random() * (speedMax - speedMin);
    arr.push({
      x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      life: lifeMs, maxLife: lifeMs, color,
      size: sizeMin + Math.random() * (sizeMax - sizeMin),
    });
  }
}

function randomPadId() { return PADS[Math.floor(Math.random() * PADS.length)].id; }

function App() {
  const [phase, setPhase] = useState('start'); // start | watching | input | over
  const [score, setScore] = useState(0);
  const [lives, setLives] = useState(LIVES_START);
  const [combo, setCombo] = useState(0);
  const [level, setLevel] = useState(1);
  const [hurt, setHurt] = useState(false);
  const [shakeIt, setShakeIt] = useState(false);
  const [flashOn, setFlashOn] = useState(false);
  const [highScore, setHighScore] = useState(() => parseInt(localStorage.getItem(HS_KEY) || '0', 10));
  const [statusMsg, setStatusMsg] = useState('Watch the pattern, then echo it back.');
  const [litPad, setLitPad] = useState(null);
  const [wrongPad, setWrongPad] = useState(null);

  const canvasRef = useRef(null);
  const arenaRef = useRef(null);
  const particlesRef = useRef([]);
  const scoreRef = useRef(0);
  const comboRef = useRef(0);
  const livesRef = useRef(LIVES_START);
  const levelRef = useRef(1);
  const highScoreRef = useRef(highScore);
  const phaseRef = useRef('start');
  const dimsRef = useRef({ w: 300, h: 300 });
  const sequenceRef = useRef([]);
  const progressRef = useRef(0);
  const activePadRef = useRef(null);
  const flashPadRef = useRef(null);
  const timeoutsRef = useRef([]);
  const rafRef = useRef(null);
  const lastTsRef = useRef(null);
  const timeRef = useRef(0);

  const { padSound, wrongSound, roundSound, overSound } = useAudio();

  useEffect(() => { phaseRef.current = phase; }, [phase]);

  const resizeCanvas = useCallback(() => {
    const canvas = canvasRef.current;
    const arena = arenaRef.current;
    if (!canvas || !arena) return;
    const rect = arena.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dimsRef.current = { w: rect.width, h: rect.height };
  }, []);

  useEffect(() => {
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    return () => window.removeEventListener('resize', resizeCanvas);
  }, [resizeCanvas]);

  const clearTimeouts = useCallback(() => {
    timeoutsRef.current.forEach((id) => clearTimeout(id));
    timeoutsRef.current = [];
  }, []);

  const schedule = useCallback((fn, ms) => {
    const id = setTimeout(fn, ms);
    timeoutsRef.current.push(id);
    return id;
  }, []);

  const padCenter = useCallback((padId) => {
    const { w, h } = dimsRef.current;
    const p = PAD_BY_ID[padId];
    return { x: p.pos.x * w, y: p.pos.y * h };
  }, []);

  const endGame = useCallback(() => {
    clearTimeouts();
    phaseRef.current = 'over';
    setPhase('over');
    overSound();
    setStatusMsg('Circuit fried.');
  }, [overSound, clearTimeouts]);

  const playSequence = useCallback((seq, lvl) => {
    phaseRef.current = 'watching';
    setPhase('watching');
    setStatusMsg('Watch closely...');
    const step = highlightMs(lvl);
    const gap = step * 0.5;
    seq.forEach((padId, i) => {
      schedule(() => {
        activePadRef.current = padId;
        setLitPad(padId);
        padSound(PAD_BY_ID[padId].freq);
        const c = padCenter(padId);
        spawnBurst(particlesRef.current, c.x, c.y, PAD_BY_ID[padId].color, 6, 20, 70, 1, 3, 300);
        schedule(() => {
          activePadRef.current = null;
          setLitPad(null);
        }, step * 0.72);
      }, i * (step + gap));
    });
    schedule(() => {
      progressRef.current = 0;
      phaseRef.current = 'input';
      setPhase('input');
      setStatusMsg('Your turn — repeat it!');
    }, seq.length * (step + gap) + 200);
  }, [padSound, padCenter, schedule]);

  const nextRound = useCallback(() => {
    sequenceRef.current = [...sequenceRef.current, randomPadId()];
    levelRef.current = sequenceRef.current.length;
    setLevel(levelRef.current);
    schedule(() => playSequence(sequenceRef.current, levelRef.current), 650);
  }, [playSequence, schedule]);

  const resetGame = useCallback(() => {
    clearTimeouts();
    scoreRef.current = 0; setScore(0);
    comboRef.current = 0; setCombo(0);
    livesRef.current = LIVES_START; setLives(LIVES_START);
    levelRef.current = 1; setLevel(1);
    sequenceRef.current = [];
    progressRef.current = 0;
    particlesRef.current = [];
    activePadRef.current = null; setLitPad(null);
    flashPadRef.current = null; setWrongPad(null);
  }, [clearTimeouts]);

  const startGame = useCallback(() => {
    resizeCanvas();
    resetGame();
    sequenceRef.current = [randomPadId(), randomPadId()];
    levelRef.current = 2;
    setLevel(2);
    setStatusMsg('Watch the pattern, then echo it back.');
    schedule(() => playSequence(sequenceRef.current, levelRef.current), 500);
  }, [resizeCanvas, resetGame, playSequence, schedule]);

  const startGameRef = useRef(null);
  useEffect(() => { startGameRef.current = startGame; }, [startGame]);

  const pressPad = useCallback((padId) => {
    if (phaseRef.current !== 'input') return;
    const expected = sequenceRef.current[progressRef.current];
    const c = padCenter(padId);
    if (padId === expected) {
      padSound(PAD_BY_ID[padId].freq);
      spawnBurst(particlesRef.current, c.x, c.y, PAD_BY_ID[padId].color, 10, 30, 130, 1.5, 4, 380);
      progressRef.current += 1;
      if (progressRef.current >= sequenceRef.current.length) {
        comboRef.current += 1;
        setCombo(comboRef.current);
        const gained = 15 + comboRef.current * 5;
        scoreRef.current += gained;
        setScore(scoreRef.current);
        if (scoreRef.current > highScoreRef.current) {
          highScoreRef.current = scoreRef.current;
          localStorage.setItem(HS_KEY, String(scoreRef.current));
          setHighScore(scoreRef.current);
        }
        roundSound();
        phaseRef.current = 'watching';
        setPhase('watching');
        setStatusMsg(`Sequence locked! Round ${levelRef.current + 1} incoming...`);
        nextRound();
      }
    } else {
      comboRef.current = 0;
      setCombo(0);
      livesRef.current -= 1;
      setLives(livesRef.current);
      setHurt(true);
      schedule(() => setHurt(false), 400);
      setShakeIt(true);
      schedule(() => setShakeIt(false), 300);
      setFlashOn(true);
      schedule(() => setFlashOn(false), 300);
      flashPadRef.current = padId;
      setWrongPad(padId);
      schedule(() => { flashPadRef.current = null; setWrongPad(null); }, 350);
      wrongSound();
      spawnBurst(particlesRef.current, c.x, c.y, '#ff3a5e', 14, 40, 180, 2, 5, 420);
      if (livesRef.current <= 0) {
        setStatusMsg('Wrong pad!');
        endGame();
        return;
      }
      setStatusMsg('Wrong pad! Sequence shortened — stay sharp.');
      phaseRef.current = 'watching';
      setPhase('watching');
      const shrunk = Math.max(2, Math.floor(sequenceRef.current.length / 2));
      sequenceRef.current = Array.from({ length: shrunk }, randomPadId);
      levelRef.current = sequenceRef.current.length;
      setLevel(levelRef.current);
      schedule(() => playSequence(sequenceRef.current, levelRef.current), 750);
    }
  }, [padSound, padCenter, roundSound, wrongSound, nextRound, endGame, schedule, playSequence]);

  useEffect(() => {
    const onKeyDown = (e) => {
      if (phaseRef.current !== 'input' && phaseRef.current !== 'watching') {
        if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); startGameRef.current && startGameRef.current(); }
        return;
      }
      if (e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); pressPad('up'); }
      else if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); pressPad('down'); }
      else if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); pressPad('left'); }
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); pressPad('right'); }
    };
    window.addEventListener('keydown', onKeyDown);
    return () => window.removeEventListener('keydown', onKeyDown);
  }, [pressPad]);

  useEffect(() => () => clearTimeouts(), [clearTimeouts]);

  // Main render loop
  useEffect(() => {
    const loop = (ts) => {
      const canvas = canvasRef.current;
      if (canvas) {
        const ctx = canvas.getContext('2d');
        const { w, h } = dimsRef.current;

        if (lastTsRef.current == null) lastTsRef.current = ts;
        let dt = (ts - lastTsRef.current) / 1000;
        lastTsRef.current = ts;
        dt = clamp(dt, 0, 0.033);
        timeRef.current += dt;

        if (w > 10 && h > 10) {
          particlesRef.current = particlesRef.current.filter((p) => p.life > 0);
          for (const p of particlesRef.current) {
            p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; p.life -= dt * 1000;
          }

          ctx.clearRect(0, 0, w, h);
          ctx.fillStyle = '#07050f';
          ctx.fillRect(0, 0, w, h);

          ctx.strokeStyle = 'rgba(157,107,255,0.05)';
          ctx.lineWidth = 1;
          const gridStep = 30;
          for (let gx = 0; gx < w; gx += gridStep) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, h); ctx.stroke(); }
          for (let gy = 0; gy < h; gy += gridStep) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(w, gy); ctx.stroke(); }

          const cx = w / 2, cy = h / 2;

          // connecting spokes
          for (const p of PADS) {
            const px = p.pos.x * w, py = p.pos.y * h;
            const isActive = activePadRef.current === p.id;
            ctx.save();
            ctx.strokeStyle = isActive ? p.color : 'rgba(157,107,255,0.12)';
            ctx.lineWidth = isActive ? 3 : 1.5;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = isActive ? 18 : 0;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(px, py);
            ctx.stroke();
            ctx.restore();
          }

          // pulsing hub
          const pulse = 10 + Math.sin(timeRef.current * 3.2) * 3;
          const hubColor = phaseRef.current === 'input' ? '#3ddcff' : phaseRef.current === 'watching' ? '#ffffff' : '#9d6bff';
          ctx.save();
          ctx.shadowColor = hubColor;
          ctx.shadowBlur = 22;
          ctx.fillStyle = hubColor;
          ctx.globalAlpha = 0.85;
          ctx.beginPath();
          ctx.arc(cx, cy, pulse, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          for (const p of particlesRef.current) {
            const a = clamp(p.life / p.maxLife, 0, 1);
            ctx.save();
            ctx.globalAlpha = a;
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
          }
        }
      }
      rafRef.current = requestAnimationFrame(loop);
    };
    rafRef.current = requestAnimationFrame(loop);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, []);

  const padClass = (padId) => {
    let cls = 'padBtn pad' + padId.charAt(0).toUpperCase() + padId.slice(1);
    if (litPad === padId) cls += ' lit';
    if (wrongPad === padId) cls += ' wrongLit';
    return cls;
  };

  return (
    <div className="app">
      <div className="hud">
        <div className="hudBox">
          <div className="hudLabel">Score</div>
          <div className="hudValue" data-testid="score">{score}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Combo</div>
          <div className="hudValue combo" data-testid="combo">x{combo}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Round</div>
          <div className="hudValue" data-testid="level">{level}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Lives</div>
          <div className={"hudValue lives" + (hurt ? " hurt" : "")} data-testid="lives">{'♥'.repeat(Math.max(0, lives))}</div>
        </div>
      </div>

      {phase !== 'watching' && phase !== 'input' && (
        <div style={{ marginTop: 34, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 14 }}>
          <div className="title">CIRCUIT ECHO</div>
          <div className="subtitle">
            Four nodes glow in a growing sequence — watch it play, then echo it back in the same order. Click/tap a node, use Arrow keys or WASD, before the pattern outgrows your memory. A wrong echo costs a life and halves the sequence; a full replay levels you up and adds one more step.
          </div>
        </div>
      )}

      <div className={"arenaOuter" + (shakeIt ? " shakeIt" : "")} data-testid="play-field" ref={arenaRef}>
        <canvas className="gameCanvas" data-testid="canvas" ref={canvasRef}></canvas>
        <div className={"flashOverlay" + (flashOn ? " on" : "")}></div>

        {(phase === 'watching' || phase === 'input') && PADS.map((p) => (
          <button
            key={p.id}
            className={padClass(p.id)}
            data-testid={`pad-${p.id}-btn`}
            style={{ '--padglow': p.color, background: `radial-gradient(circle at 40% 35%, ${p.color}22, rgba(10,10,20,0.85))` }}
            onClick={() => pressPad(p.id)}
            onTouchStart={(e) => { e.preventDefault(); pressPad(p.id); }}
          />
        ))}

        {phase === 'start' && (
          <div className="overlay">
            <div className="highscoreLine">High Score: {highScore}</div>
            <button className="btn" data-testid="start-btn" onClick={startGame}>START</button>
          </div>
        )}

        {phase === 'over' && (
          <div className="overlay">
            <div className="title" style={{ marginTop: 0, fontSize: 26 }}>CIRCUIT FRIED</div>
            <div className="hudValue" style={{ fontSize: 30 }}>{score}</div>
            <div className="highscoreLine">High Score: {highScore}</div>
            <button className="btn" data-testid="start-btn" onClick={startGame}>RETRY</button>
          </div>
        )}
      </div>

      <div className="status">{statusMsg}</div>
      <div className="footer">Neon Game Arcade</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
