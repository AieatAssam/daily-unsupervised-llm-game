<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Flash Riposte</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #060208; overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
    touch-action: none;
    user-select: none;
  }
  #root { width: 100%; height: 100%; }
  .app {
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center;
    justify-content: flex-start;
    position: relative;
    background: radial-gradient(circle at 50% 8%, #221233 0%, #0a0412 55%, #040208 100%);
    overflow: hidden;
  }
  .bg-grad {
    position: absolute; inset: 0;
    background: linear-gradient(120deg, rgba(125,255,79,0.07), rgba(255,61,240,0.08), rgba(79,168,255,0.06));
    background-size: 400% 400%;
    animation: drift 16s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes drift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .hud {
    position: relative;
    width: 100%;
    max-width: 480px;
    display: flex;
    justify-content: space-around;
    padding: 8px 8px 2px;
    z-index: 5;
    gap: 4px;
  }
  .hud-item {
    flex: 1;
    text-align: center;
    color: #d9f7ff;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity: 0.85;
  }
  .hud-value {
    font-size: 18px;
    font-weight: 700;
    display: block;
    margin-top: 2px;
  }
  .score-val { color: #7dff4f; text-shadow: 0 0 10px #7dff4f; }
  .combo-val { color: #ff3df0; text-shadow: 0 0 10px #ff3df0; }
  .lives-val { color: #ffd84f; text-shadow: 0 0 10px #ffd84f; }
  .level-val { color: #4fa8ff; text-shadow: 0 0 10px #4fa8ff; }
  .field-wrap {
    position: relative;
    flex: 1;
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 2;
    min-height: 0;
    padding: 4px 10px;
    gap: 10px;
  }
  .combat-stage {
    position: relative;
    width: min(92vw, 420px);
    aspect-ratio: 5 / 6;
    max-height: 58%;
    border-radius: 14px;
    border: 1px solid rgba(125,255,79,0.22);
    box-shadow: inset 0 0 40px rgba(125,255,79,0.08), 0 0 30px rgba(255,61,240,0.12);
    overflow: hidden;
    touch-action: none;
  }
  canvas.game-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .enemy-hp-wrap {
    position: absolute;
    top: 8px;
    left: 12%;
    right: 12%;
    height: 8px;
    border-radius: 6px;
    background: rgba(255,255,255,0.1);
    overflow: hidden;
    z-index: 3;
  }
  .enemy-hp-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff3df0, #ff4f4f);
    box-shadow: 0 0 10px #ff3df0;
    transition: width 0.18s ease;
  }
  .stage-label {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(217,247,255,0.6);
    font-size: 11px;
    letter-spacing: 1px;
    z-index: 3;
    pointer-events: none;
  }
  .label-enemy { top: 20px; }
  .label-you { bottom: 10%; }
  .banner {
    position: absolute;
    bottom: 6px;
    left: 50%;
    transform: translateX(-50%);
    color: #ffd84f;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1px;
    text-shadow: 0 0 10px #ffd84f;
    z-index: 6;
    pointer-events: none;
    white-space: nowrap;
  }
  .dpad {
    position: relative;
    z-index: 5;
    display: grid;
    grid-template-columns: 56px 56px 56px;
    grid-template-rows: 48px 48px;
    gap: 6px;
    justify-content: center;
  }
  .dpad-btn {
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    min-height: 44px;
    min-width: 44px;
    color: #060208;
    background: linear-gradient(135deg, #7dff4f, #3aa82a);
    box-shadow: 0 0 16px rgba(125,255,79,0.5);
    transition: transform 0.1s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dpad-btn:active { transform: scale(0.9); }
  .dpad-up { grid-column: 2; grid-row: 1; }
  .dpad-left { grid-column: 1; grid-row: 2; }
  .dpad-right { grid-column: 3; grid-row: 2; }
  .dpad-down { grid-column: 2; grid-row: 2; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(4,2,8,0.92);
    z-index: 10;
    text-align: center;
    padding: 20px;
  }
  .title {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #fff;
    text-shadow: 0 0 20px #7dff4f, 0 0 40px #ff3df0;
    margin: 0;
  }
  .subtitle {
    color: #b7e8ff;
    font-size: 13px;
    max-width: 380px;
    line-height: 1.5;
    margin: 0;
  }
  button.start-btn {
    background: linear-gradient(135deg, #7dff4f, #ff3df0);
    border: none;
    color: #060208;
    font-weight: 800;
    font-size: 18px;
    letter-spacing: 1px;
    padding: 16px 40px;
    border-radius: 999px;
    cursor: pointer;
    min-height: 48px;
    min-width: 140px;
    box-shadow: 0 0 25px rgba(125,255,79,0.6), 0 0 45px rgba(255,61,240,0.4);
    transition: transform 0.12s ease;
  }
  button.start-btn:active { transform: scale(0.94); }
  .finalscore {
    color: #fff;
    font-size: 16px;
  }
  .finalscore b { color: #7dff4f; font-size: 22px; }
  .highscore-line {
    color: #ffd84f;
    font-size: 13px;
  }
  .hint {
    position: relative;
    z-index: 5;
    color: #8fc7d8;
    font-size: 10px;
    text-align: center;
    padding: 2px 10px 8px;
    opacity: 0.75;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useRef, useEffect, useState, useCallback, useMemo } = React;

const HIGH_SCORE_KEY = 'flashRiposteHighScore';
const START_LIVES = 3;
const RESOLVE_PAUSE_MS = 420;
const DIRS = ['up', 'down', 'left', 'right'];

const DIR_META = {
  up: { angle: -Math.PI / 2, color: '#7dff4f' },
  down: { angle: Math.PI / 2, color: '#4fa8ff' },
  left: { angle: Math.PI, color: '#ffd84f' },
  right: { angle: 0, color: '#ff3df0' },
};

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function drawArrow(ctx, cx, cy, s, angle, color, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.translate(cx, cy);
  ctx.rotate(angle);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(s, 0);
  ctx.lineTo(-s * 0.5, -s * 0.7);
  ctx.lineTo(-s * 0.15, 0);
  ctx.lineTo(-s * 0.5, s * 0.7);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawFeintMark(ctx, cx, cy, s, color, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(3, s * 0.22);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - s * 0.6, cy - s * 0.6);
  ctx.lineTo(cx + s * 0.6, cy + s * 0.6);
  ctx.moveTo(cx + s * 0.6, cy - s * 0.6);
  ctx.lineTo(cx - s * 0.6, cy + s * 0.6);
  ctx.stroke();
  ctx.restore();
}

function useAudio() {
  const ctxRef = useRef(null);
  const getCtx = useCallback(() => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  }, []);

  const beep = useCallback((freq, dur, type, vol, slideTo) => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      const now = ctx.currentTime;
      if (slideTo != null) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), now + dur);
      gain.gain.value = vol == null ? 0.08 : vol;
      osc.connect(gain);
      gain.connect(ctx.destination);
      gain.gain.setValueAtTime(gain.gain.value, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
      osc.start(now);
      osc.stop(now + dur);
    } catch (e) { /* audio unavailable */ }
  }, [getCtx]);

  return useMemo(() => ({
    hit: (combo) => beep(540 + Math.min(combo, 16) * 26, 0.1, 'triangle', 0.09, 920),
    dodge: () => beep(480, 0.08, 'sine', 0.07, 600),
    hurt: () => beep(160, 0.28, 'sawtooth', 0.12, 60),
    levelup: () => { beep(520, 0.1, 'triangle', 0.08); setTimeout(() => beep(780, 0.12, 'triangle', 0.08), 90); setTimeout(() => beep(1040, 0.16, 'triangle', 0.08), 180); },
    gameover: () => beep(90, 0.55, 'sawtooth', 0.12, 40),
  }), [beep]);
}

function levelParams(level) {
  const totalMs = clamp(1650 - (level - 1) * 95, 650, 1650);
  const feintChance = clamp(0.1 + (level - 1) * 0.035, 0.1, 0.42);
  const hitsToKill = clamp(3 + Math.floor((level - 1) / 2), 3, 8);
  return { totalMs, feintChance, hitsToKill };
}

function buildInitialGame() {
  return {
    dims: { w: 320, h: 380 },
    particles: [],
    flashColor: null,
    flashUntil: 0,
    bannerClearAt: 0,
    enemyHits: 0,
    enemyHitsToKill: 3,
    prompt: { phase: 'idle', type: null, timeLeft: 0, total: 1, resolved: false, nextAt: 0, lastOutcome: null },
  };
}

function App() {
  const wrapRef = useRef(null);
  const canvasRef = useRef(null);

  const initialHigh = (() => {
    const v = parseInt(localStorage.getItem(HIGH_SCORE_KEY) || '0', 10);
    return isNaN(v) ? 0 : v;
  })();

  const [ui, setUi] = useState({
    phase: 'idle', score: 0, combo: 0, lives: START_LIVES, level: 1,
    highScore: initialHigh, banner: '', enemyHp: 1,
  });
  const uiRef = useRef(ui);
  useEffect(() => { uiRef.current = ui; }, [ui]);

  const audio = useAudio();
  const gameRef = useRef(buildInitialGame());

  const spawnParticles = useCallback((cx, cy, color, count, spread) => {
    const parts = gameRef.current.particles;
    if (parts.length > 110) return;
    for (let i = 0; i < (count || 10); i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = (spread || 60) + Math.random() * (spread || 60);
      parts.push({
        x: cx, y: cy, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
        life: 380 + Math.random() * 280, maxLife: 660, color, size: 2 + Math.random() * 3,
      });
    }
  }, []);

  const startPrompt = useCallback((level) => {
    const g = gameRef.current;
    const lp = levelParams(level);
    const isFeint = Math.random() < lp.feintChance;
    g.prompt = {
      phase: 'telegraph',
      type: isFeint ? 'feint' : pick(DIRS),
      timeLeft: lp.totalMs, total: lp.totalMs,
      resolved: false, nextAt: 0, lastOutcome: null,
    };
  }, []);

  const resetGameplay = useCallback(() => {
    const g = gameRef.current;
    g.particles = [];
    g.flashColor = null;
    g.flashUntil = 0;
    g.bannerClearAt = 0;
    g.enemyHits = 0;
    g.enemyHitsToKill = levelParams(1).hitsToKill;
    startPrompt(1);
  }, [startPrompt]);

  const startGame = useCallback(() => {
    resetGameplay();
    setUi(prev => ({
      ...prev, phase: 'playing', score: 0, combo: 0, lives: START_LIVES,
      level: 1, banner: '', enemyHp: 1,
    }));
  }, [resetGameplay]);

  const endGame = useCallback(() => {
    const cur = uiRef.current;
    const newHigh = Math.max(cur.score, cur.highScore);
    localStorage.setItem(HIGH_SCORE_KEY, String(newHigh));
    audio.gameover();
    setUi(prev => ({ ...prev, phase: 'over', highScore: newHigh }));
  }, [audio]);

  const resolvePrompt = useCallback((pressedDir) => {
    const g = gameRef.current;
    const r = g.prompt;
    if (r.phase !== 'telegraph' || r.resolved) return;
    r.resolved = true;
    r.phase = 'resolve';
    r.nextAt = performance.now() + RESOLVE_PAUSE_MS;

    const cx = g.dims.w / 2, cy = g.dims.h / 2;
    const enemyY = g.dims.h * 0.3, playerY = g.dims.h * 0.76;

    let success;
    if (r.type === 'feint') {
      success = pressedDir == null;
    } else {
      success = pressedDir === r.type;
    }
    r.lastOutcome = success ? 'hit' : 'miss';

    if (success && r.type === 'feint') {
      audio.dodge();
      spawnParticles(cx, playerY, '#cfefff', 10, 50);
      setUi(prev => ({ ...prev, score: prev.score + 6 + prev.level * 2, banner: 'DODGED' }));
    } else if (success) {
      g.enemyHits += 1;
      g.flashColor = '#7dff4f';
      g.flashUntil = performance.now() + 220;
      audio.hit(uiRef.current.combo);
      spawnParticles(cx, enemyY, DIR_META[r.type].color, 20, 110);
      const killed = g.enemyHits >= g.enemyHitsToKill;
      setUi(prev => {
        const combo = prev.combo + 1;
        const gained = Math.round((16 + prev.level * 3) * (1 + combo * 0.12));
        const next = { ...prev, score: prev.score + gained, combo, banner: 'RIPOSTE!' };
        next.enemyHp = killed ? 0 : 1 - g.enemyHits / g.enemyHitsToKill;
        return next;
      });
      if (killed) {
        setTimeout(() => {
          const g2 = gameRef.current;
          g2.enemyHits = 0;
          const newLevel = uiRef.current.level + 1;
          g2.enemyHitsToKill = levelParams(newLevel).hitsToKill;
          audio.levelup();
          setUi(prev => ({ ...prev, level: newLevel, enemyHp: 1 }));
        }, RESOLVE_PAUSE_MS - 40);
      }
    } else {
      g.flashColor = '#ff4f4f';
      g.flashUntil = performance.now() + 260;
      audio.hurt();
      spawnParticles(cx, playerY, '#ff4f4f', 22, 120);
      setUi(prev => {
        const lives = prev.lives - 1;
        const banner = r.type === 'feint' ? 'FEINT!' : 'TOO SLOW';
        if (lives <= 0) {
          setTimeout(() => endGame(), 0);
          return { ...prev, lives: 0, combo: 0, banner };
        }
        return { ...prev, lives, combo: 0, banner };
      });
    }
    g.bannerClearAt = performance.now() + RESOLVE_PAUSE_MS + 60;
  }, [audio, spawnParticles, endGame]);

  const press = useCallback((dir) => {
    const cur = uiRef.current;
    const g = gameRef.current;
    if (cur.phase === 'idle' || cur.phase === 'over') { startGame(); return; }
    if (cur.phase !== 'playing') return;
    if (g.prompt.phase !== 'telegraph' || g.prompt.resolved) return;
    resolvePrompt(dir);
  }, [startGame, resolvePrompt]);

  useEffect(() => {
    function onKeyDown(e) {
      const cur = uiRef.current;
      if (cur.phase === 'idle' || cur.phase === 'over') {
        if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); startGame(); }
        return;
      }
      if (e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); press('up'); }
      else if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); press('down'); }
      else if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); press('left'); }
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); press('right'); }
    }
    window.addEventListener('keydown', onKeyDown);
    return () => window.removeEventListener('keydown', onKeyDown);
  }, [startGame, press]);

  useEffect(() => {
    function updateDims() {
      if (wrapRef.current) {
        const r = wrapRef.current.getBoundingClientRect();
        gameRef.current.dims = { w: r.width, h: r.height };
      }
    }
    updateDims();
    window.addEventListener('resize', updateDims);
    return () => window.removeEventListener('resize', updateDims);
  }, []);

  useEffect(() => {
    let raf;
    let last = performance.now();
    const loop = (t) => {
      const dt = Math.min(0.033, (t - last) / 1000);
      last = t;
      const cur = uiRef.current;
      const g = gameRef.current;
      const w = g.dims.w, h = g.dims.h;
      const now = performance.now();

      if (cur.phase === 'playing') {
        const r = g.prompt;
        if (r.phase === 'telegraph') {
          r.timeLeft -= dt * 1000;
          if (r.timeLeft <= 0 && !r.resolved) {
            r.timeLeft = 0;
            resolvePrompt(null);
          }
        } else if (r.phase === 'resolve') {
          if (now >= r.nextAt) {
            const cur2 = uiRef.current;
            if (cur2.lives > 0) startPrompt(cur2.level);
          }
        }

        if (g.bannerClearAt && now > g.bannerClearAt) {
          g.bannerClearAt = 0;
          setUi(prev => (prev.banner ? { ...prev, banner: '' } : prev));
        }
      }

      const parts = g.particles;
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.life -= dt * 1000;
        if (p.life <= 0) { parts.splice(i, 1); continue; }
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= 0.94;
        p.vy *= 0.94;
      }

      const canvas = canvasRef.current;
      if (canvas && w > 0 && h > 0) {
        const cw = Math.max(1, Math.round(w));
        const ch = Math.max(1, Math.round(h));
        if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, w, h);

        ctx.strokeStyle = 'rgba(125,255,79,0.07)';
        ctx.lineWidth = 1;
        for (let y = 0; y < h; y += Math.max(20, h / 8)) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
        }

        const cx = w / 2;
        const enemyY = h * 0.3, playerY = h * 0.76;
        const figR = Math.max(16, Math.min(w, h) * 0.08);

        if (cur.phase === 'playing') {
          ctx.beginPath();
          ctx.arc(cx, enemyY, figR, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,61,240,0.5)';
          ctx.fill();

          ctx.beginPath();
          ctx.arc(cx, playerY, figR, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(79,168,255,0.5)';
          ctx.fill();

          const r = g.prompt;
          if (r.phase === 'telegraph') {
            const frac = clamp(r.timeLeft / r.total, 0, 1);
            const ringR = Math.min(w, h) * 0.17;
            const midY = h * 0.52;
            ctx.beginPath();
            ctx.arc(cx, midY, ringR, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.12)';
            ctx.lineWidth = 6;
            ctx.stroke();
            const ringColor = r.type === 'feint' ? '#ff4f4f' : (frac < 0.25 ? '#ff4f4f' : '#7dff4f');
            ctx.beginPath();
            ctx.arc(cx, midY, ringR, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2);
            ctx.strokeStyle = ringColor;
            ctx.globalAlpha = 0.35;
            ctx.lineWidth = 11;
            ctx.stroke();
            ctx.globalAlpha = 1;
            ctx.lineWidth = 6;
            ctx.stroke();

            const iconS = ringR * 0.55;
            if (r.type === 'feint') {
              drawFeintMark(ctx, cx, midY, iconS, '#ff4f4f', 1);
            } else {
              drawArrow(ctx, cx, midY, iconS, DIR_META[r.type].angle, DIR_META[r.type].color, 1);
            }
          } else if (r.phase === 'resolve') {
            const midY = h * 0.52;
            ctx.font = '13px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = r.lastOutcome === 'hit' ? '#7dff4f' : '#ff4f4f';
            ctx.fillText(r.lastOutcome === 'hit' ? 'LANDED' : 'BLOWN', cx, midY);
          }
        }

        for (let i = parts.length - 1; i >= 0; i--) {
          const p = parts[i];
          const alpha = Math.max(0, p.life / p.maxLife);
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        if (g.flashColor && now < g.flashUntil) {
          ctx.fillStyle = g.flashColor;
          ctx.globalAlpha = 0.14;
          ctx.fillRect(0, 0, w, h);
          ctx.globalAlpha = 1;
        } else if (g.flashColor && now >= g.flashUntil) {
          g.flashColor = null;
        }
      }

      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, [resolvePrompt, startPrompt]);

  return (
    <div className="app">
      <div className="bg-grad"></div>
      <div className="hud">
        <div className="hud-item">Score<span className="hud-value score-val" data-testid="score">{ui.score}</span></div>
        <div className="hud-item">Combo<span className="hud-value combo-val" data-testid="combo">{ui.combo}</span></div>
        <div className="hud-item">Lives<span className="hud-value lives-val" data-testid="lives">{ui.lives}</span></div>
        <div className="hud-item">Level<span className="hud-value level-val" data-testid="level">{ui.level}</span></div>
      </div>

      <div className="field-wrap" data-testid="play-field">
        <div className="combat-stage" ref={wrapRef} data-testid="combat-stage">
          <canvas className="game-canvas" ref={canvasRef} data-testid="canvas"></canvas>
          {ui.phase === 'playing' && (
            <React.Fragment>
              <div className="enemy-hp-wrap">
                <div className="enemy-hp-fill" style={{ width: (ui.enemyHp * 100) + '%' }} data-testid="enemy-hp"></div>
              </div>
              <div className="stage-label label-enemy">RIVAL</div>
              <div className="stage-label label-you">YOU</div>
            </React.Fragment>
          )}
          <div className="banner" data-testid="banner">{ui.banner || ' '}</div>

          {ui.phase !== 'playing' && (
            <div className="overlay">
              {ui.phase === 'idle' && (
                <React.Fragment>
                  <h1 className="title">FLASH RIPOSTE</h1>
                  <p className="subtitle">A rival telegraphs a strike direction inside a burning ring. Tap the matching direction before it burns out to riposte and deal damage. Red crossed feints mean HOLD — press nothing and you'll dodge for free points, but flinch and you'll eat the hit. Chain ripostes for a rising combo; miss, mistime, or get baited and a life cracks.</p>
                  <button className="start-btn" data-testid="start-btn" onClick={startGame}>START</button>
                  <p className="highscore-line">High Score: {ui.highScore}</p>
                </React.Fragment>
              )}
              {ui.phase === 'over' && (
                <React.Fragment>
                  <h1 className="title">GUARD BROKEN</h1>
                  <p className="finalscore">Score: <b>{ui.score}</b></p>
                  <p className="highscore-line">High Score: {ui.highScore}</p>
                  <button className="start-btn" data-testid="start-btn" onClick={startGame}>FIGHT AGAIN</button>
                </React.Fragment>
              )}
            </div>
          )}
        </div>

        <div className="dpad">
          <button className="dpad-btn dpad-up" data-testid="up-btn" onPointerDown={(e) => { e.preventDefault(); press('up'); }}>▲</button>
          <button className="dpad-btn dpad-left" data-testid="left-btn" onPointerDown={(e) => { e.preventDefault(); press('left'); }}>◀</button>
          <button className="dpad-btn dpad-right" data-testid="right-btn" onPointerDown={(e) => { e.preventDefault(); press('right'); }}>▶</button>
          <button className="dpad-btn dpad-down" data-testid="down-btn" onPointerDown={(e) => { e.preventDefault(); press('down'); }}>▼</button>
        </div>
      </div>

      <div className="hint">Tap the direction (or press arrow keys / WASD) that matches the ring before it burns out. Red X means HOLD — don't press, just dodge.</div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
