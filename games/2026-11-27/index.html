<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Flicker Ledges</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #03040b; overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
    touch-action: none; user-select: none;
  }
  #root { position: fixed; inset: 0; }
  .stage {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(100vw, calc(100vh * 0.5625)); aspect-ratio: 9 / 16;
    overflow: hidden; background: #05060f; touch-action: none; cursor: pointer;
    box-shadow: 0 0 40px rgba(79,255,214,0.12);
  }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hit {
    position: absolute; display: none; touch-action: none; cursor: pointer;
    background: transparent; border-radius: 10px;
  }
  .hud {
    position: absolute; left: 0; right: 0; top: 0; padding: 10px 14px;
    display: flex; justify-content: space-between; align-items: flex-start;
    color: #e6f0ff; pointer-events: none; text-shadow: 0 0 8px rgba(79,255,214,0.6);
  }
  .hud b { display: block; font-size: 24px; line-height: 1.1; color: #fff; }
  .hud .right { text-align: right; }
  .hud .mid { text-align: center; min-width: 80px; }
  .hud .mult { font-size: 18px; font-weight: 700; color: #ffe45c; text-shadow: 0 0 10px rgba(255,228,92,0.8); }
  .lbl { font-size: 10px; letter-spacing: 1.5px; opacity: 0.65; text-transform: uppercase; }
  .hearts { font-size: 16px; color: #ff4d8d; letter-spacing: 3px; text-shadow: 0 0 8px rgba(255,77,141,0.9); }
  .overlay {
    position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center;
    padding: 16px; pointer-events: none; background: rgba(2,3,10,0.35);
  }
  .panel {
    pointer-events: auto; max-width: 320px; width: 100%;
    text-align: center; color: #e6f0ff; padding: 20px 18px 22px;
    background: rgba(6,10,26,0.9);
    border: 1px solid rgba(79,255,214,0.5); border-radius: 18px;
    box-shadow: 0 0 30px rgba(79,255,214,0.25), inset 0 0 24px rgba(90,170,255,0.12);
  }
  .kicker { font-size: 11px; letter-spacing: 2px; opacity: 0.6; text-transform: uppercase; }
  h1 {
    margin: 6px 0 8px; font-size: 34px; letter-spacing: 3px; line-height: 1.05;
    color: #4fffd6; text-shadow: 0 0 14px rgba(79,255,214,0.9), 0 0 36px rgba(255,92,200,0.5);
  }
  .panel p { font-size: 15px; line-height: 1.4; margin: 0 0 16px; opacity: 0.92; }
  .stats { display: flex; justify-content: space-around; margin: 0 0 18px; }
  .stats div { font-size: 11px; letter-spacing: 1px; opacity: 0.7; text-transform: uppercase; }
  .stats b { display: block; font-size: 26px; opacity: 1; color: #fff; letter-spacing: 0; }
  button {
    min-width: 200px; min-height: 48px; padding: 12px 32px;
    font-size: 18px; font-weight: 700; letter-spacing: 2px;
    color: #03040b; background: linear-gradient(90deg, #4fffd6, #ffc247);
    border: 0; border-radius: 999px; cursor: pointer;
    box-shadow: 0 0 22px rgba(79,255,214,0.6);
    touch-action: manipulation;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const ID = '2026-11-27';
const BEST_KEY = 'arcade.' + ID + '.best';

// Logical playfield (scaled to the stage). Units are arbitrary px.
const W = 360, H = 640, R = 9;
const G = 900;          // gravity
const BOUNCE = 560;     // upward speed after a ledge bounce
const LANES = [60, 180, 300];
const LANE_W = 96;
const HIT_H = 44;       // tap height (touch-friendly) around each ledge
const MAX_ROWS = 12;

// Difficulty ramps with run time t (seconds).
function params(t) {
  return {
    speed: Math.min(205, 115 + t * 1.3),     // ball horizontal speed
    scroll: Math.min(150, 58 + t * 1.2),     // ledges drift up at this rate
    gap: Math.max(72, 88 - t * 0.35),        // row spacing
    life: Math.max(1.5, 2.4 - t * 0.012),    // seconds a solid ledge stays solid
  };
}
const multOf = c => 1 + Math.min(3, Math.floor(c / 5));

let actx = null;
function ensureAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type = 'sine', vol = 0.08, slide = 0) {
  if (!actx || actx.state !== 'running') return;
  const now = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, now);
  if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, now + dur);
  g.gain.setValueAtTime(vol, now);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  o.connect(g).connect(actx.destination);
  o.start(now); o.stop(now + dur + 0.02);
}

function makeSim() {
  return {
    t: 0, ball: { x: 180, y: 300, vx: 115, vy: 0 }, trail: [],
    rows: Array.from({ length: MAX_ROWS }, () => ({ active: false, id: 0, y: 0, prev: 0, until: [0, 0, 0], flash: [-9, -9, -9] })),
    nextId: 1, score: 0, combo: 0, lives: 3, shake: 0,
    particles: [], pops: [], over: false,
  };
}
function spawnRow(sim, y) {
  const r = sim.rows.find(x => !x.active);
  if (!r) return null;
  r.active = true; r.id = sim.nextId++; r.y = y; r.prev = y;
  r.until = [0, 0, 0]; r.flash = [-9, -9, -9];
  return r;
}
function resetSim(sim) {
  const fresh = makeSim();
  Object.assign(sim, fresh);
  // Opening: a lit centre ledge under the ball so an idle start is never a death.
  spawnRow(sim, 596); spawnRow(sim, 508);
  const r = spawnRow(sim, 420);
  r.until[1] = 4.5;
}
function burst(sim, x, y, color, n) {
  for (let i = 0; i < n && sim.particles.length < 220; i++) {
    const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 160;
    sim.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: 0.5 + Math.random() * 0.4, color });
  }
}
function pop(sim, x, y, text, color) {
  sim.pops.push({ x, y, text, color, life: 0.9 });
}
function bounce(sim, r, l) {
  const b = sim.ball;
  b.y = r.y - R; b.vy = -BOUNCE;
  const perfect = Math.abs(b.x - LANES[l]) <= 16;
  sim.combo++;
  const pts = multOf(sim.combo) * (perfect ? 2 : 1);
  sim.score += pts;
  r.flash[l] = sim.t;
  burst(sim, b.x, r.y, perfect ? '#ffe45c' : '#4fffd6', perfect ? 18 : 8);
  pop(sim, b.x, r.y - 16, (perfect ? 'PERFECT +' : '+') + pts, perfect ? '#ffe45c' : '#e6f0ff');
  tone(perfect ? 880 : 520, 0.12, 'triangle', 0.09, 1.6);
}
function toggleLedge(sim, p, l) {
  const r = sim.rows[p];
  if (!r || !r.active || sim.over) return;
  if (r.until[l] > sim.t) { r.until[l] = 0; tone(260, 0.06, 'square', 0.03); }
  else { r.until[l] = sim.t + params(sim.t).life; tone(640, 0.07, 'square', 0.04, 1.4); }
}

function stepSim(sim, dt) {
  sim.t += dt;
  const P = params(sim.t);

  // Rows drift up; spawn new rows at the bottom on the gap.
  let lowest = -Infinity;
  for (const r of sim.rows) {
    if (!r.active) continue;
    r.prev = r.y;
    r.y -= P.scroll * dt;
    if (r.y < -40) { r.active = false; continue; }
    if (r.y > lowest) lowest = r.y;
  }
  while (lowest > -Infinity && lowest <= H + 30 - P.gap) {
    const nr = spawnRow(sim, lowest + P.gap);
    if (!nr) break;
    lowest += P.gap;
  }

  // Ball: gravity, constant horizontal speed bouncing off the walls.
  const b = sim.ball;
  b.vx = (b.vx >= 0 ? 1 : -1) * P.speed;
  const prevBottom = b.y + R;
  b.vy += G * dt; b.y += b.vy * dt; b.x += b.vx * dt;
  if (b.x < R) { b.x = R; b.vx = P.speed; }
  else if (b.x > W - R) { b.x = W - R; b.vx = -P.speed; }
  // Keep the ball on screen: a high bounce just drops back down from the top edge.
  if (b.y < R) { b.y = R; if (b.vy < 0) b.vy = 0; }

  // Land only from above on a solid ledge.
  if (b.vy > 0) {
    const bottom = b.y + R;
    search: for (const r of sim.rows) {
      if (!r.active) continue;
      if (!(prevBottom <= r.prev + 1 && bottom >= r.y)) continue;
      for (let l = 0; l < 3; l++) {
        if (r.until[l] <= sim.t) continue;
        if (Math.abs(b.x - LANES[l]) <= LANE_W / 2 + 3) { bounce(sim, r, l); break search; }
      }
    }
  }

  // Fell out of the bottom: lose a life and relaunch upward.
  if (b.y - R > H + 10) {
    sim.lives--; sim.combo = 0; sim.shake = 0.35;
    burst(sim, Math.min(W - 10, Math.max(10, b.x)), H - 6, '#ff4d8d', 26);
    pop(sim, Math.min(W - 40, Math.max(40, b.x)), H - 60, 'LOST A LIFE', '#ff4d8d');
    tone(180, 0.35, 'sawtooth', 0.1, 0.4);
    if (sim.lives <= 0) { sim.over = true; return; }
    b.x = 180; b.y = 330; b.vy = -520; b.vx = (Math.random() < 0.5 ? -1 : 1) * P.speed;
  }

  sim.trail.push({ x: b.x, y: b.y });
  if (sim.trail.length > 12) sim.trail.shift();

  for (const p of sim.particles) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; }
  sim.particles = sim.particles.filter(p => p.life > 0);
  for (const p of sim.pops) { p.life -= dt; p.y -= 40 * dt; }
  sim.pops = sim.pops.filter(p => p.life > 0);
  sim.shake = Math.max(0, sim.shake - dt);
}

function drawSim(ctx, sim, k, phase) {
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.save();
  if (sim.shake > 0) ctx.translate((Math.random() - 0.5) * 10 * sim.shake, (Math.random() - 0.5) * 10 * sim.shake);

  // Background
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0b0a2a'); bg.addColorStop(1, '#020309');
  ctx.fillStyle = bg; ctx.fillRect(-10, -10, W + 20, H + 20);
  // Scrolling grid
  const off = (sim.t * (phase === 'playing' ? params(sim.t).scroll : 0)) % 48;
  ctx.strokeStyle = 'rgba(90,170,255,0.07)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let y = H - off; y > -48; y -= 48) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  // Danger band at the bottom, brighter while the ball is falling
  const falling = sim.ball.vy > 0 ? 0.35 : 0.12;
  const dz = ctx.createLinearGradient(0, H - 90, 0, H);
  dz.addColorStop(0, 'rgba(255,70,120,0)'); dz.addColorStop(1, 'rgba(255,70,120,' + falling + ')');
  ctx.fillStyle = dz; ctx.fillRect(0, H - 90, W, 90);
  // Walls
  ctx.fillStyle = 'rgba(79,255,214,0.5)'; ctx.fillRect(0, 0, 2, H); ctx.fillRect(W - 2, 0, 2, H);

  // Ledges
  for (const r of sim.rows) {
    if (!r.active) continue;
    for (let l = 0; l < 3; l++) {
      const x = LANES[l] - LANE_W / 2, y = r.y;
      const rem = r.until[l] - sim.t;
      if (rem > 0) {
        ctx.globalAlpha = rem < 0.6 && Math.sin(sim.t * 40) > 0 ? 0.3 : 1;
        const g = ctx.createLinearGradient(x, 0, x + LANE_W, 0);
        g.addColorStop(0, '#4fffd6'); g.addColorStop(1, '#5aa8ff');
        ctx.fillStyle = g; ctx.shadowColor = '#4fffd6'; ctx.shadowBlur = 14;
        ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y - 4, LANE_W, 8, 4) : ctx.rect(x, y - 4, LANE_W, 8);
        ctx.fill(); ctx.shadowBlur = 0; ctx.globalAlpha = 1;
      } else {
        ctx.strokeStyle = 'rgba(255,92,200,0.45)'; ctx.lineWidth = 2; ctx.setLineDash([6, 5]);
        ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x + 1, y - 3, LANE_W - 2, 6, 3) : ctx.rect(x + 1, y - 3, LANE_W - 2, 6);
        ctx.stroke(); ctx.setLineDash([]);
      }
      const f = sim.t - r.flash[l];
      if (f < 0.25) {
        ctx.globalAlpha = 1 - f / 0.25; ctx.fillStyle = '#ffffff';
        ctx.fillRect(x + 6, y - 2, LANE_W - 12, 4); ctx.globalAlpha = 1;
      }
    }
  }

  // Ball trail + body
  const b = sim.ball;
  sim.trail.forEach((p, i) => {
    const a = (i + 1) / sim.trail.length;
    ctx.globalAlpha = a * 0.35; ctx.fillStyle = '#ffe45c';
    ctx.beginPath(); ctx.arc(p.x, p.y, R * (0.35 + 0.6 * a), 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalAlpha = 1;
  ctx.shadowColor = '#ffe45c'; ctx.shadowBlur = 18; ctx.fillStyle = '#ffe45c';
  ctx.beginPath(); ctx.arc(b.x, b.y, R, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = '#fffbe0';
  ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill();

  // Particles and pops
  for (const p of sim.particles) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2)); ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
  ctx.font = 'bold 15px Segoe UI, Arial, sans-serif'; ctx.textAlign = 'center';
  for (const p of sim.pops) {
    ctx.globalAlpha = Math.min(1, p.life * 2); ctx.fillStyle = p.color;
    ctx.shadowColor = p.color; ctx.shadowBlur = 8;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  ctx.restore();
}

function App() {
  const { useState, useEffect, useRef } = React;
  const stageRef = useRef(null), canvasRef = useRef(null);
  const hitRefs = useRef([]);
  const simRef = useRef(makeSim());
  const phaseRef = useRef('menu');
  const bestRef = useRef(Number(localStorage.getItem(BEST_KEY)) || 0);
  const [phase, setPhase] = useState('menu');
  const [best, setBest] = useState(bestRef.current);
  const [ui, setUi] = useState({ score: 0, lives: 3, combo: 0, mult: 1 });
  const uiRef = useRef(ui);

  const start = () => {
    ensureAudio();
    resetSim(simRef.current);
    phaseRef.current = 'playing';
    window.__game = { ...window.__game, phase: 'playing', score: 0 };
    setPhase('playing');
  };

  useEffect(() => {
    const stage = stageRef.current, canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    const resize = () => {
      const r = stage.getBoundingClientRect();
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = Math.max(1, Math.round(r.width * dpr));
      canvas.height = Math.max(1, Math.round(r.height * dpr));
    };
    resize();
    window.addEventListener('resize', resize);
    resetSim(simRef.current);
    window.__game = { phase: 'menu', score: 0 };

    let raf, last = performance.now();
    const frame = now => {
      const dt = Math.min(0.033, (now - last) / 1000); last = now;
      const sim = simRef.current;
      if (phaseRef.current === 'playing') {
        stepSim(sim, dt);
        if (sim.over) {
          phaseRef.current = 'over';
          const best = Math.max(bestRef.current, sim.score);
          bestRef.current = best;
          localStorage.setItem(BEST_KEY, String(best));
          setBest(best);
          setPhase('over');
        }
      }
      const cur = phaseRef.current;
      const rect = stage.getBoundingClientRect();
      const sc = rect.width / W;
      drawSim(ctx, sim, canvas.width / W, cur);

      // Tap targets follow the ledges (touch-sized, drawn invisible).
      const p = params(sim.t);
      const ledges = [];
      for (let pi = 0; pi < MAX_ROWS; pi++) {
        const r = sim.rows[pi];
        for (let l = 0; l < 3; l++) {
          const el = hitRefs.current[pi * 3 + l];
          if (!el) continue;
          const show = cur === 'playing' && r.active;
          const d = show ? 'block' : 'none';
          if (el.style.display !== d) el.style.display = d;
          if (show) {
            el.style.left = ((LANES[l] - LANE_W / 2) / W * 100) + '%';
            el.style.width = (LANE_W / W * 100) + '%';
            el.style.top = ((r.y - HIT_H / 2) / H * 100) + '%';
            el.style.height = (HIT_H / H * 100) + '%';
            el.dataset.row = r.id; el.dataset.lane = l;
            el.dataset.solid = r.until[l] > sim.t ? '1' : '0';
            ledges.push({ row: r.id, lane: l, solid: r.until[l] > sim.t,
              x: LANES[l] * sc, y: r.y * sc, w: LANE_W * sc });
          }
        }
      }

      // Read-only state for bots: stage-relative px.
      const b = sim.ball;
      window.__game = {
        phase: cur, score: sim.score, lives: sim.lives,
        ball: { x: b.x * sc, y: b.y * sc, vx: b.vx * sc, vy: b.vy * sc, r: R * sc },
        phys: { g: G * sc, bounce: BOUNCE * sc, width: W * sc, height: H * sc,
                scroll: p.scroll * sc, life: p.life, speed: p.speed * sc },
        ledges,
      };

      const combo = sim.combo, mult = multOf(combo);
      const u = uiRef.current;
      if (u.score !== sim.score || u.lives !== sim.lives || u.combo !== combo || u.mult !== mult) {
        const next = { score: sim.score, lives: sim.lives, combo, mult };
        uiRef.current = next; setUi(next);
      }
      raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
    return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', resize); };
  }, []);

  useEffect(() => {
    window.__game = { ...(window.__game || {}), phase };
  }, [phase]);

  const onPointerDown = e => {
    const el = e.target.closest && e.target.closest('[data-slot]');
    if (!el || phaseRef.current !== 'playing') return;
    e.preventDefault();
    ensureAudio();
    const i = Number(el.dataset.slot);
    toggleLedge(simRef.current, Math.floor(i / 3), i % 3);
  };

  const hearts = '♥'.repeat(Math.max(0, ui.lives)) || '—';

  return (
    <div className="stage" ref={stageRef} onPointerDown={onPointerDown}>
      <canvas ref={canvasRef} />
      {Array.from({ length: MAX_ROWS * 3 }, (_, i) => (
        <div key={i} className="hit" data-testid="ledge" data-slot={i}
             ref={el => { hitRefs.current[i] = el; }} />
      ))}
      <div className="hud">
        <div><div className="lbl">Score</div><b>{ui.score}</b></div>
        <div className="mid">
          <div className="mult">{ui.mult > 1 ? 'x' + ui.mult : ''}</div>
          <div className="lbl">combo {ui.combo}</div>
        </div>
        <div className="right"><div className="lbl">Best</div><b>{Math.max(best, ui.score)}</b><div className="hearts">{hearts}</div></div>
      </div>
      {phase === 'menu' && (
        <div className="overlay"><div className="panel">
          <div className="kicker">Arcade · {ID}</div>
          <h1>FLICKER<br />LEDGES</h1>
          <p>Tap ledges to make them solid. Keep the ball bouncing. Centre hits pay double.</p>
          <button data-testid="start-btn" onClick={start}>START</button>
        </div></div>
      )}
      {phase === 'over' && (
        <div className="overlay"><div className="panel">
          <div className="kicker">Run over</div>
          <h1>GAME<br />OVER</h1>
          <div className="stats">
            <div>Score<b>{ui.score}</b></div>
            <div>Best<b>{best}</b></div>
          </div>
          <button data-testid="start-btn" onClick={start}>PLAY AGAIN</button>
        </div></div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
