<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Neon Riptide</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #04060f; font-family: 'Segoe UI', system-ui, sans-serif; }
  #root { width: 100%; height: 100%; }

  .app {
    width: 100%; height: 100%; position: relative; overflow: hidden;
    background: radial-gradient(circle at 30% 15%, #0d1a3a 0%, #060a1c 55%, #020309 100%);
  }

  canvas#gameCanvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: none; }

  .hud {
    position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start;
    padding: 14px 20px; z-index: 10; pointer-events: none;
  }
  .hudBox { text-align: center; }
  .hudLabel { font-size: 11px; letter-spacing: 2px; color: #5ecbe0; text-transform: uppercase; }
  .hudValue {
    font-size: 26px; font-weight: 800; color: #fff;
    text-shadow: 0 0 10px #33e6ff, 0 0 20px #33e6ff;
  }
  .hudValue.combo { color: #ffe45e; text-shadow: 0 0 10px #ffe45e, 0 0 22px #ff9d00; }

  .title {
    font-size: clamp(32px, 8vw, 56px); font-weight: 900; letter-spacing: 4px;
    background: linear-gradient(90deg, #33e6ff, #4d7dff, #b845ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 40px rgba(60,150,255,0.5);
    filter: drop-shadow(0 0 12px rgba(60,180,255,0.6));
    animation: titlePulse 2.4s ease-in-out infinite;
    text-align: center;
  }
  @keyframes titlePulse { 0%,100% { filter: drop-shadow(0 0 12px rgba(60,180,255,0.6)); } 50% { filter: drop-shadow(0 0 26px rgba(60,220,255,0.95)); } }

  .subtitle { color: #8fb0d6; margin-top: 8px; font-size: 15px; letter-spacing: 1px; text-align: center; max-width: 440px; }

  .startScreen, .overScreen {
    position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    padding: 20px; text-align: center;
  }

  .btn {
    padding: 16px 42px; font-size: 20px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(135deg, #33b8ff, #4d5bff);
    border: none; border-radius: 50px; color: #fff; cursor: pointer;
    box-shadow: 0 0 20px rgba(70,150,255,0.7), 0 0 50px rgba(80,60,255,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(70,180,255,0.9), 0 0 70px rgba(80,60,255,0.5); }
  .btn:active { transform: scale(0.96); }

  .highscoreLine { color: #ffd35e; font-size: 15px; text-shadow: 0 0 8px rgba(255,200,50,0.6); }

  .shake { animation: shakeAnim 0.4s ease; }
  @keyframes shakeAnim {
    0%,100% { transform: translate(0,0); }
    20% { transform: translate(-10px, 4px); }
    40% { transform: translate(10px, -4px); }
    60% { transform: translate(-8px, -2px); }
    80% { transform: translate(8px, 2px); }
  }

  .footer { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; color: #4b5f8a; font-size: 12px; z-index: 10; pointer-events: none; }

  @media (max-width: 480px) {
    .hudValue { font-size: 20px; }
    .btn { padding: 14px 32px; font-size: 17px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const HS_KEY = 'neonRiptide_highScore';
const PLAYER_COLOR = { core: '#eaffff', glow: '#33e6ff', ring: '#a6f6ff' };

function useAudio() {
  const ctxRef = useRef(null);
  const getCtx = () => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  };

  const tone = useCallback((freq, duration = 0.2, type = 'sine', gainScale = 0.2) => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(gainScale, ctx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.05);
    } catch (e) {}
  }, []);

  const collectChime = useCallback((combo) => {
    tone(520 + Math.min(combo, 14) * 45, 0.16, 'triangle', 0.18);
  }, [tone]);

  const nearMiss = useCallback(() => tone(220, 0.08, 'square', 0.06), [tone]);

  const boom = useCallback(() => {
    try {
      const ctx = getCtx();
      const bufferSize = ctx.sampleRate * 0.6;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1200, ctx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.6);
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.5, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      noise.start();
      noise.stop(ctx.currentTime + 0.62);
      const osc = ctx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(120, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.5);
      const g2 = ctx.createGain();
      g2.gain.setValueAtTime(0.3, ctx.currentTime);
      g2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
      osc.connect(g2);
      g2.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.5);
    } catch (e) {}
  }, []);

  return { collectChime, nearMiss, boom };
}

function App() {
  const [phase, setPhase] = useState('start'); // start | playing | over
  const [score, setScore] = useState(0);
  const [combo, setCombo] = useState(0);
  const [highScore, setHighScore] = useState(() => parseInt(localStorage.getItem(HS_KEY) || '0', 10));
  const [shake, setShake] = useState(false);

  const canvasRef = useRef(null);
  const rafRef = useRef(null);
  const stateRef = useRef({
    w: 0, h: 0, dpr: 1,
    scrollX: 0, elapsed: 0, over: false,
    playerY: 0, targetY: 0, playerVY: 0,
    trail: [], particles: [], streaks: [],
    shards: [], hazards: [], nextShardX: 0, nextHazardX: 0,
    gap: 260, score: 0, combo: 0, comboTimer: 0,
  });
  const { collectChime, nearMiss, boom } = useAudio();
  const pointerActive = useRef(false);

  const endGame = useCallback(() => {
    const st = stateRef.current;
    if (st.over) return;
    st.over = true;
    const finalScore = Math.floor(st.score);
    setScore(finalScore);
    setHighScore(hs => {
      if (finalScore > hs) {
        localStorage.setItem(HS_KEY, String(finalScore));
        return finalScore;
      }
      return hs;
    });
    boom();
    setShake(true);
    setTimeout(() => setShake(false), 400);
    setTimeout(() => setPhase('over'), 350);
  }, [boom]);

  const resizeCanvas = useCallback(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth, h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    stateRef.current.w = w;
    stateRef.current.h = h;
    stateRef.current.dpr = dpr;
    if (stateRef.current.playerY === 0) {
      stateRef.current.playerY = h / 2;
      stateRef.current.targetY = h / 2;
    }
  }, []);

  useEffect(() => {
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    return () => window.removeEventListener('resize', resizeCanvas);
  }, [resizeCanvas]);

  const tunnelCenter = (st, worldX) => {
    const rampT = Math.min(st.elapsed / 20000, 1);
    const amp1 = st.h * (0.05 + rampT * 0.14);
    const amp2 = st.h * (0.02 + rampT * 0.07);
    return st.h / 2
      + Math.sin(worldX * 0.0021) * amp1
      + Math.sin(worldX * 0.0052 + 1.4) * amp2;
  };

  const setTarget = (clientY) => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    stateRef.current.targetY = clientY - rect.top;
  };

  const handlePointerMove = (e) => {
    if (stateRef.current.over) return;
    pointerActive.current = true;
    setTarget(e.clientY);
  };

  const handleTouchMove = (e) => {
    if (stateRef.current.over) return;
    if (e.touches && e.touches[0]) {
      pointerActive.current = true;
      setTarget(e.touches[0].clientY);
      e.preventDefault();
    }
  };

  const spawnParticles = useCallback((x, y, color, count = 16) => {
    const st = stateRef.current;
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1.5 + Math.random() * 5;
      st.particles.push({
        x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        life: 1, decay: 0.025 + Math.random() * 0.02, size: 2 + Math.random() * 3.5, color,
      });
    }
  }, []);

  const startGame = () => {
    const st = stateRef.current;
    st.scrollX = 0;
    st.elapsed = 0;
    st.over = false;
    st.playerY = st.h / 2;
    st.targetY = st.h / 2;
    st.playerVY = 0;
    st.trail = [];
    st.particles = [];
    st.streaks = [];
    st.shards = [];
    st.hazards = [];
    st.nextShardX = 400;
    st.nextHazardX = 700;
    st.gap = Math.min(st.h * 0.42, 300);
    st.score = 0;
    st.combo = 0;
    st.comboTimer = 0;
    setScore(0);
    setCombo(0);
    setPhase('playing');
  };

  useEffect(() => {
    if (phase !== 'playing') return;
    let last = performance.now();
    const playerScreenX = () => Math.max(120, stateRef.current.w * 0.24);

    const loop = (now) => {
      const dt = Math.min(now - last, 40);
      last = now;
      const st = stateRef.current;
      const canvas = canvasRef.current;
      if (!canvas || st.over) { rafRef.current = requestAnimationFrame(loop); return; }
      const ctx = canvas.getContext('2d');
      const w = st.w, h = st.h;
      const step = dt / 16.6;

      st.elapsed += dt;
      const speed = Math.min(3.4 + st.elapsed / 6000, 8.5) * step;
      st.scrollX += speed;
      st.gap = Math.max(h * 0.22, Math.min(h * 0.42, 300) - st.elapsed / 260);

      // player physics: spring toward target for a "current" feel
      const dy = st.targetY - st.playerY;
      st.playerVY += dy * 0.02 * step;
      st.playerVY *= Math.pow(0.86, step);
      st.playerY += st.playerVY * step;
      st.playerY = Math.max(14, Math.min(h - 14, st.playerY));

      const px = playerScreenX();

      // spawn shards
      if (st.scrollX + w > st.nextShardX) {
        const worldX = st.nextShardX;
        const center = tunnelCenter(st, worldX);
        const yy = center + (Math.random() - 0.5) * (st.gap * 0.6);
        st.shards.push({ x: worldX, y: yy, r: 11, collected: false, spin: 0 });
        st.nextShardX += 220 + Math.random() * 160;
      }
      // spawn hazards
      if (st.elapsed > 2200 && st.scrollX + w > st.nextHazardX) {
        const worldX = st.nextHazardX;
        const center = tunnelCenter(st, worldX);
        const maxOff = Math.max(20, st.gap * 0.5 - 30);
        const yy = center + (Math.random() - 0.5) * 2 * maxOff;
        st.hazards.push({ x: worldX, y: yy, r: 17, spin: 0 });
        const hazInterval = Math.max(520, 1400 - st.elapsed / 40);
        st.nextHazardX += hazInterval;
      }

      if (st.comboTimer > 0) {
        st.comboTimer -= step;
        if (st.comboTimer <= 0) { st.combo = 0; setCombo(0); }
      }

      st.score += speed * 0.35;

      // trail
      st.trail.push({ x: px, y: st.playerY, life: 1 });
      if (st.trail.length > 22) st.trail.shift();

      // background streaks
      if (Math.random() < 0.5) {
        st.streaks.push({ x: w + 10, y: Math.random() * h, len: 40 + Math.random() * 90, speed: speed * (0.6 + Math.random() * 0.8) });
      }

      ctx.clearRect(0, 0, w, h);

      // starfield / streaks
      ctx.save();
      for (let i = st.streaks.length - 1; i >= 0; i--) {
        const s = st.streaks[i];
        s.x -= s.speed;
        if (s.x + s.len < 0) { st.streaks.splice(i, 1); continue; }
        ctx.strokeStyle = 'rgba(90,180,255,0.18)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x + s.len, s.y);
        ctx.stroke();
      }
      ctx.restore();

      // tunnel walls
      ctx.save();
      const sampleStep = 14;
      const topPts = [];
      const botPts = [];
      for (let sx = 0; sx <= w + sampleStep; sx += sampleStep) {
        const worldX = st.scrollX + sx;
        const c = tunnelCenter(st, worldX);
        topPts.push({ x: sx, y: c - st.gap / 2 });
        botPts.push({ x: sx, y: c + st.gap / 2 });
      }
      // top wall fill
      ctx.fillStyle = 'rgba(15,25,60,0.9)';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      topPts.forEach(p => ctx.lineTo(p.x, p.y));
      ctx.lineTo(w, 0);
      ctx.closePath();
      ctx.fill();
      // bottom wall fill
      ctx.beginPath();
      ctx.moveTo(0, h);
      botPts.forEach(p => ctx.lineTo(p.x, p.y));
      ctx.lineTo(w, h);
      ctx.closePath();
      ctx.fill();
      // glow lines
      ctx.shadowBlur = 16;
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#33e6ff';
      ctx.shadowColor = '#33e6ff';
      ctx.beginPath();
      topPts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
      ctx.stroke();
      ctx.strokeStyle = '#b845ff';
      ctx.shadowColor = '#b845ff';
      ctx.beginPath();
      botPts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
      ctx.stroke();
      ctx.restore();

      // collision with walls at player x
      const centerAtPlayer = tunnelCenter(st, st.scrollX + px);
      const topAtPlayer = centerAtPlayer - st.gap / 2;
      const botAtPlayer = centerAtPlayer + st.gap / 2;
      if (st.elapsed > 500 && (st.playerY - 12 < topAtPlayer || st.playerY + 12 > botAtPlayer)) {
        spawnParticles(px, st.playerY, '#33e6ff', 30);
        endGame();
      }

      // shards
      for (let i = st.shards.length - 1; i >= 0; i--) {
        const sd = st.shards[i];
        sd.spin += 0.08 * step;
        const sx = sd.x - st.scrollX;
        if (sx < -30) { st.shards.splice(i, 1); continue; }
        if (!sd.collected) {
          const d = Math.hypot(sx - px, sd.y - st.playerY);
          if (d < sd.r + 13) {
            sd.collected = true;
            st.comboTimer = 240;
            st.combo += 1;
            const gained = 25 + st.combo * 6;
            st.score += gained;
            setCombo(st.combo);
            spawnParticles(sx, sd.y, '#ffe45e', 20);
            collectChime(st.combo);
            st.shards.splice(i, 1);
            continue;
          }
        }
        ctx.save();
        ctx.translate(sx, sd.y);
        ctx.rotate(sd.spin);
        ctx.shadowColor = '#ffe45e';
        ctx.shadowBlur = 18;
        ctx.fillStyle = '#ffe45e';
        ctx.beginPath();
        ctx.moveTo(0, -sd.r); ctx.lineTo(sd.r, 0); ctx.lineTo(0, sd.r); ctx.lineTo(-sd.r, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // hazards
      for (let i = st.hazards.length - 1; i >= 0; i--) {
        const hz = st.hazards[i];
        hz.spin += 0.05 * step;
        const hx = hz.x - st.scrollX;
        if (hx < -40) { st.hazards.splice(i, 1); continue; }
        const d = Math.hypot(hx - px, hz.y - st.playerY);
        if (d < hz.r + 12) {
          spawnParticles(hx, hz.y, '#ff3355', 34);
          endGame();
        }
        ctx.save();
        ctx.translate(hx, hz.y);
        ctx.rotate(hz.spin);
        ctx.shadowColor = '#ff3355';
        ctx.shadowBlur = 20;
        ctx.fillStyle = '#ff3355';
        ctx.beginPath();
        for (let k = 0; k < 8; k++) {
          const ang = (Math.PI * 2 * k) / 8;
          const rr = k % 2 === 0 ? hz.r : hz.r * 0.5;
          const px2 = Math.cos(ang) * rr, py2 = Math.sin(ang) * rr;
          if (k === 0) ctx.moveTo(px2, py2); else ctx.lineTo(px2, py2);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // particles
      for (let i = st.particles.length - 1; i >= 0; i--) {
        const p = st.particles[i];
        p.x += p.vx * step; p.y += p.vy * step; p.vy += 0.12 * step;
        p.life -= p.decay * step;
        if (p.life <= 0) { st.particles.splice(i, 1); continue; }
        ctx.save();
        ctx.globalAlpha = Math.max(p.life, 0);
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // trail
      if (st.trail.length > 1) {
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.shadowColor = PLAYER_COLOR.glow;
        ctx.shadowBlur = 18;
        for (let i = 1; i < st.trail.length; i++) {
          const a = st.trail[i - 1], b = st.trail[i];
          const alpha = i / st.trail.length;
          ctx.globalAlpha = alpha * 0.7;
          ctx.strokeStyle = PLAYER_COLOR.ring;
          ctx.lineWidth = 8 * alpha;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
        ctx.restore();
      }

      // player orb
      if (!st.over) {
        ctx.save();
        ctx.translate(px, st.playerY);
        const grad = ctx.createRadialGradient(0, 0, 2, 0, 0, 14);
        grad.addColorStop(0, PLAYER_COLOR.core);
        grad.addColorStop(0.5, PLAYER_COLOR.glow);
        grad.addColorStop(1, 'rgba(51,230,255,0.1)');
        ctx.shadowColor = PLAYER_COLOR.glow;
        ctx.shadowBlur = 28;
        ctx.beginPath();
        ctx.arc(0, 0, 12, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(0, 0, 5, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      setScore(Math.floor(st.score));

      rafRef.current = requestAnimationFrame(loop);
    };

    rafRef.current = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(rafRef.current);
  }, [phase, endGame, spawnParticles, collectChime]);

  return (
    <div className={`app ${shake ? 'shake' : ''}`} data-testid="game-canvas">
      <canvas
        ref={canvasRef}
        id="gameCanvas"
        onMouseMove={handlePointerMove}
        onTouchStart={handleTouchMove}
        onTouchMove={handleTouchMove}
        data-testid="riptide-canvas"
      />

      {phase === 'playing' && (
        <div className="hud">
          <div className="hudBox">
            <div className="hudLabel">Score</div>
            <div className="hudValue" data-testid="score">{score}</div>
          </div>
          <div className="hudBox">
            <div className="hudLabel">Combo</div>
            <div className="hudValue combo">x{combo}</div>
          </div>
        </div>
      )}

      {phase === 'start' && (
        <div className="startScreen">
          <div className="title">NEON RIPTIDE</div>
          <div className="subtitle">Move your mouse or drag your finger to ride the current through the glowing tunnel. Grab yellow shards for combo, avoid the crimson spikes and walls.</div>
          <div className="highscoreLine" data-testid="high-score">Best: {highScore}</div>
          <button className="btn" data-testid="start-btn" onClick={startGame}>START</button>
        </div>
      )}

      {phase === 'over' && (
        <div className="overScreen">
          <div className="title" style={{ fontSize: 'clamp(26px, 6vw, 40px)' }}>CURRENT LOST</div>
          <div className="hudValue" data-testid="final-score">Score: {score}</div>
          <div className="highscoreLine" data-testid="high-score-final">Best: {highScore}</div>
          <button className="btn" data-testid="restart-btn" onClick={startGame}>TRY AGAIN</button>
        </div>
      )}

      <div className="footer">Neon Riptide — move to steer the current, grab shards, avoid the walls</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
