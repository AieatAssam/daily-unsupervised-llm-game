<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Pulse Weaver</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --cyan: #3cf3ff;
    --magenta: #ff3cf0;
    --gold: #ffd93c;
    --bg0: #060414;
    --bg1: #0c0a26;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: var(--bg0);
    overflow-x: hidden;
    font-family: 'Segoe UI', 'Trebuchet MS', system-ui, sans-serif;
    color: #eafcff;
    touch-action: none;
  }
  #root { min-height: 100vh; }
  .app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 10px 18px;
    position: relative;
    background:
      radial-gradient(circle at 20% 10%, rgba(60,243,255,0.16), transparent 55%),
      radial-gradient(circle at 85% 85%, rgba(255,60,240,0.14), transparent 55%),
      linear-gradient(160deg, var(--bg0), var(--bg1) 60%, var(--bg0));
    background-size: 200% 200%;
    animation: drift 18s ease-in-out infinite alternate;
  }
  @keyframes drift {
    0% { background-position: 0% 0%; }
    100% { background-position: 100% 100%; }
  }
  h1.title {
    margin: 2px 0 10px;
    font-size: clamp(22px, 5vw, 32px);
    letter-spacing: 3px;
    text-transform: uppercase;
    background: linear-gradient(90deg, var(--cyan), var(--magenta), var(--gold));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 22px rgba(60,243,255,0.35);
  }
  .hud {
    width: min(520px, 92vw);
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .stat {
    flex: 1 1 70px;
    min-width: 68px;
    background: rgba(10, 10, 30, 0.55);
    border: 1px solid rgba(60,243,255,0.35);
    border-radius: 10px;
    padding: 6px 10px;
    text-align: center;
    box-shadow: 0 0 14px rgba(60,243,255,0.08) inset;
  }
  .stat .label {
    font-size: 10px;
    letter-spacing: 2px;
    opacity: 0.6;
    text-transform: uppercase;
  }
  .stat .value {
    font-size: 20px;
    font-weight: 700;
    color: var(--cyan);
    text-shadow: 0 0 10px rgba(60,243,255,0.6);
  }
  .stat.lives .value { color: #ff5a7a; text-shadow: 0 0 10px rgba(255,90,122,0.6); }
  .stat.combo .value { color: var(--gold); text-shadow: 0 0 10px rgba(255,217,60,0.6); }
  .stat.level .value { color: var(--magenta); text-shadow: 0 0 10px rgba(255,60,240,0.6); }

  .play-field {
    position: relative;
    width: min(460px, 90vw);
    height: min(300px, 40vh);
    min-height: 260px;
    border-radius: 16px;
    border: 1px solid rgba(60,243,255,0.4);
    box-shadow: 0 0 30px rgba(60,243,255,0.15), 0 0 60px rgba(255,60,240,0.08) inset;
    overflow: hidden;
    background: #04030c;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 16px;
    background: rgba(4,3,12,0.72);
    backdrop-filter: blur(2px);
  }
  .overlay h2 {
    margin: 0;
    font-size: clamp(18px, 4vw, 26px);
    color: var(--cyan);
    text-shadow: 0 0 14px rgba(60,243,255,0.6);
    letter-spacing: 2px;
  }
  .overlay p {
    margin: 0;
    max-width: 440px;
    font-size: 13px;
    opacity: 0.85;
    line-height: 1.5;
  }
  .overlay .score-line {
    font-size: 16px;
    color: var(--gold);
  }
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
  }
  .start-btn {
    margin-top: 6px;
    padding: 14px 34px;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #04030c;
    background: linear-gradient(90deg, var(--cyan), var(--gold));
    border-radius: 999px;
    box-shadow: 0 0 24px rgba(60,243,255,0.55);
    min-height: 48px;
    min-width: 160px;
    transition: transform 0.15s ease;
  }
  .start-btn:active { transform: scale(0.95); }

  .controls-row {
    width: min(520px, 92vw);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .hint {
    font-size: 11px;
    opacity: 0.6;
    max-width: 520px;
    line-height: 1.4;
  }
  .dash-btn {
    min-width: 96px;
    min-height: 52px;
    padding: 10px 20px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #04030c;
    background: linear-gradient(90deg, var(--magenta), var(--cyan));
    box-shadow: 0 0 20px rgba(255,60,240,0.45);
  }
  .dash-btn:disabled {
    opacity: 0.4;
    filter: grayscale(0.6);
    box-shadow: none;
  }
  .dash-btn:active:not(:disabled) { transform: scale(0.94); }

  @media (max-width: 480px) {
    .hud { gap: 6px; }
    .stat { padding: 5px 6px; min-width: 60px; }
    .stat .value { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

const FIELD_PAD = 16;
const HIGH_SCORE_KEY = "pulseWeaverHighScore";

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function dist(x1, y1, x2, y2) { return Math.hypot(x1 - x2, y1 - y2); }

function freshStats() {
  return { score: 0, combo: 0, comboMultiplier: 1, lives: 3, level: 1, pickupsCollected: 0 };
}

function App() {
  const [uiStats, setUiStats] = useState(freshStats());
  const [gameState, setGameState] = useState("idle"); // idle | playing | gameover
  const [highScore, setHighScore] = useState(() => {
    const v = parseInt(localStorage.getItem(HIGH_SCORE_KEY) || "0", 10);
    return Number.isFinite(v) ? v : 0;
  });
  const [dashReady, setDashReady] = useState(true);

  const fieldRef = useRef(null);
  const canvasRef = useRef(null);
  const ctxRef = useRef(null);
  const rafRef = useRef(null);
  const statsRef = useRef(freshStats());
  const gameStateRef = useRef("idle");
  const audioCtxRef = useRef(null);
  const starsRef = useRef([]);
  const glowSpritesRef = useRef(null);

  const getGlowSprites = () => {
    if (glowSpritesRef.current) return glowSpritesRef.current;
    const make = (color, size) => {
      const c = document.createElement("canvas");
      c.width = size; c.height = size;
      const cctx = c.getContext("2d");
      const grd = cctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      grd.addColorStop(0, `rgba(${color},0.95)`);
      grd.addColorStop(0.5, `rgba(${color},0.35)`);
      grd.addColorStop(1, `rgba(${color},0)`);
      cctx.fillStyle = grd;
      cctx.fillRect(0, 0, size, size);
      return c;
    };
    glowSpritesRef.current = {
      gold: make("255,217,60", 48),
      magenta: make("255,70,120", 44),
      cyan: make("150,240,255", 56),
    };
    return glowSpritesRef.current;
  };

  const gRef = useRef({
    bounds: { w: 900, h: 560 },
    orb: { x: 450, y: 280, r: 13 },
    pointerTarget: { x: 450, y: 280 },
    keys: {},
    hazards: [],
    pickups: [],
    particles: [],
    spawnTimer: 0.6,
    pickupSpawnTimer: 0.4,
    dashCooldown: 0,
    dashCooldownMax: 2.4,
    invulnTimer: 0,
    shake: 0,
    lastTime: 0,
  });

  const ensureAudio = useCallback(() => {
    if (!audioCtxRef.current) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      audioCtxRef.current = new Ctx();
    }
    if (audioCtxRef.current.state === "suspended") {
      audioCtxRef.current.resume().catch(() => {});
    }
    return audioCtxRef.current;
  }, []);

  const playTone = useCallback((freq, dur = 0.12, type = "sine", vol = 0.16) => {
    try {
      const ctx = ensureAudio();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      const now = ctx.currentTime;
      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + dur + 0.02);
    } catch (e) { /* audio unavailable */ }
  }, [ensureAudio]);

  const spawnParticles = (x, y, color, count = 10, speed = 90) => {
    const g = gRef.current;
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = speed * (0.4 + Math.random() * 0.9);
      g.particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: 0.5 + Math.random() * 0.4,
        maxLife: 0.9,
        size: 2 + Math.random() * 2.5,
        color,
      });
    }
  };

  const resizeCanvas = useCallback(() => {
    const field = fieldRef.current;
    const canvas = canvasRef.current;
    if (!field || !canvas) return;
    const rect = field.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    canvas.width = Math.max(1, Math.round(rect.width * dpr));
    canvas.height = Math.max(1, Math.round(rect.height * dpr));
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctxRef.current = ctx;
    gRef.current.bounds = { w: rect.width, h: rect.height };
    gRef.current.orb.x = clamp(gRef.current.orb.x, FIELD_PAD, rect.width - FIELD_PAD);
    gRef.current.orb.y = clamp(gRef.current.orb.y, FIELD_PAD, rect.height - FIELD_PAD);
    if (!starsRef.current.length) {
      const n = 16;
      for (let i = 0; i < n; i++) {
        starsRef.current.push({
          x: Math.random(), y: Math.random(),
          r: Math.random() * 1.6 + 0.4,
          tw: Math.random() * Math.PI * 2,
        });
      }
    }
  }, []);

  useEffect(() => {
    resizeCanvas();
    const onResize = () => resizeCanvas();
    window.addEventListener("resize", onResize);
    let ro;
    if (window.ResizeObserver && fieldRef.current) {
      ro = new ResizeObserver(onResize);
      ro.observe(fieldRef.current);
    }
    return () => {
      window.removeEventListener("resize", onResize);
      if (ro) ro.disconnect();
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const spawnHazard = () => {
    const g = gRef.current;
    const { w, h } = g.bounds;
    const level = statsRef.current.level;
    const edge = Math.floor(Math.random() * 4);
    let x, y;
    if (edge === 0) { x = Math.random() * w; y = -20; }
    else if (edge === 1) { x = w + 20; y = Math.random() * h; }
    else if (edge === 2) { x = Math.random() * w; y = h + 20; }
    else { x = -20; y = Math.random() * h; }
    const targetX = w / 2 + (Math.random() - 0.5) * w * 0.7;
    const targetY = h / 2 + (Math.random() - 0.5) * h * 0.7;
    const angle = Math.atan2(targetY - y, targetX - x);
    const speed = 70 + level * 11 + Math.random() * 30;
    g.hazards.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      r: 13 + Math.random() * 7,
      rot: Math.random() * Math.PI * 2,
      spin: (Math.random() - 0.5) * 4,
    });
  };

  const spawnPickup = () => {
    const g = gRef.current;
    const { w, h } = g.bounds;
    let x, y, tries = 0;
    do {
      x = FIELD_PAD + 20 + Math.random() * (w - FIELD_PAD * 2 - 40);
      y = FIELD_PAD + 20 + Math.random() * (h - FIELD_PAD * 2 - 40);
      tries++;
    } while (dist(x, y, g.orb.x, g.orb.y) < 70 && tries < 8);
    g.pickups.push({ x, y, r: 9, phase: Math.random() * Math.PI * 2 });
  };

  const commitStats = (mutator) => {
    mutator(statsRef.current);
    setUiStats({ ...statsRef.current });
  };

  const handleHit = () => {
    const g = gRef.current;
    g.invulnTimer = 0.9;
    g.shake = 10;
    playTone(120, 0.22, "sawtooth", 0.2);
    spawnParticles(g.orb.x, g.orb.y, "255,70,100", 16, 140);
    commitStats((s) => {
      s.lives -= 1;
      s.combo = 0;
      s.comboMultiplier = 1;
    });
    if (statsRef.current.lives <= 0) {
      gameStateRef.current = "gameover";
      setGameState("gameover");
      const finalScore = statsRef.current.score;
      if (finalScore > highScore) {
        localStorage.setItem(HIGH_SCORE_KEY, String(finalScore));
        setHighScore(finalScore);
      } else if (!localStorage.getItem(HIGH_SCORE_KEY)) {
        localStorage.setItem(HIGH_SCORE_KEY, String(highScore));
      }
      playTone(90, 0.4, "triangle", 0.2);
    }
  };

  const handlePickup = (p) => {
    const g = gRef.current;
    spawnParticles(p.x, p.y, "60,243,255", 12, 100);
    playTone(520 + Math.random() * 120, 0.12, "sine", 0.15);
    commitStats((s) => {
      s.score += 10 * s.comboMultiplier;
      s.combo += 1;
      if (s.combo % 5 === 0) s.comboMultiplier = Math.min(8, s.comboMultiplier + 1);
      s.pickupsCollected += 1;
      if (s.pickupsCollected % 6 === 0) {
        s.level = Math.min(12, s.level + 1);
        playTone(720, 0.18, "square", 0.12);
      }
    });
  };

  const doDash = useCallback(() => {
    const g = gRef.current;
    if (gameStateRef.current !== "playing") return;
    if (g.dashCooldown > 0) return;
    g.dashCooldown = Math.max(1.0, g.dashCooldownMax - statsRef.current.level * 0.08);
    setDashReady(false);
    g.shake = 6;
    playTone(300, 0.15, "square", 0.15);
    spawnParticles(g.orb.x, g.orb.y, "255,217,60", 20, 160);
    const radius = 110;
    let destroyed = 0;
    g.hazards = g.hazards.filter((hz) => {
      if (dist(hz.x, hz.y, g.orb.x, g.orb.y) < radius) {
        spawnParticles(hz.x, hz.y, "255,60,240", 8, 90);
        destroyed++;
        return false;
      }
      return true;
    });
    if (destroyed > 0) {
      commitStats((s) => { s.score += destroyed * 5 * s.comboMultiplier; });
    }
  }, [playTone]);

  // pointer / touch steering
  useEffect(() => {
    const field = fieldRef.current;
    if (!field) return;
    const toLocal = (clientX, clientY) => {
      const rect = field.getBoundingClientRect();
      return {
        x: clamp(clientX - rect.left, FIELD_PAD, rect.width - FIELD_PAD),
        y: clamp(clientY - rect.top, FIELD_PAD, rect.height - FIELD_PAD),
      };
    };
    const onMouseMove = (e) => {
      const p = toLocal(e.clientX, e.clientY);
      gRef.current.pointerTarget = p;
    };
    const onTouchMove = (e) => {
      if (!e.touches || !e.touches[0]) return;
      e.preventDefault();
      const t = e.touches[0];
      const p = toLocal(t.clientX, t.clientY);
      gRef.current.pointerTarget = p;
    };
    const onClick = () => doDash();
    const onTouchStart = (e) => {
      if (e.touches && e.touches[0]) {
        const t = e.touches[0];
        const p = toLocal(t.clientX, t.clientY);
        gRef.current.pointerTarget = p;
      }
    };
    field.addEventListener("mousemove", onMouseMove);
    field.addEventListener("touchmove", onTouchMove, { passive: false });
    field.addEventListener("touchstart", onTouchStart, { passive: false });
    field.addEventListener("click", onClick);
    return () => {
      field.removeEventListener("mousemove", onMouseMove);
      field.removeEventListener("touchmove", onTouchMove);
      field.removeEventListener("touchstart", onTouchStart);
      field.removeEventListener("click", onClick);
    };
  }, [doDash]);

  // keyboard steering + space dash
  useEffect(() => {
    const onKeyDown = (e) => {
      const k = e.key;
      if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "a", "A", "d", "D", "w", "W", "s", "S"].includes(k)) {
        gRef.current.keys[k.toLowerCase()] = true;
        e.preventDefault();
      }
      if (k === " " || k === "Spacebar") {
        e.preventDefault();
        doDash();
      }
    };
    const onKeyUp = (e) => {
      gRef.current.keys[e.key.toLowerCase()] = false;
    };
    window.addEventListener("keydown", onKeyDown);
    window.addEventListener("keyup", onKeyUp);
    return () => {
      window.removeEventListener("keydown", onKeyDown);
      window.removeEventListener("keyup", onKeyUp);
    };
  }, [doDash]);

  // main loop
  useEffect(() => {
    const step = (ts) => {
      const g = gRef.current;
      if (!g.lastTime) g.lastTime = ts;
      let dt = (ts - g.lastTime) / 1000;
      dt = Math.min(dt, 0.05);
      g.lastTime = ts;

      const { w, h } = g.bounds;
      const speed = 420;
      if (g.keys["arrowleft"] || g.keys["a"]) g.pointerTarget.x = clamp(g.pointerTarget.x - speed * dt, FIELD_PAD, w - FIELD_PAD);
      if (g.keys["arrowright"] || g.keys["d"]) g.pointerTarget.x = clamp(g.pointerTarget.x + speed * dt, FIELD_PAD, w - FIELD_PAD);
      if (g.keys["arrowup"] || g.keys["w"]) g.pointerTarget.y = clamp(g.pointerTarget.y - speed * dt, FIELD_PAD, h - FIELD_PAD);
      if (g.keys["arrowdown"] || g.keys["s"]) g.pointerTarget.y = clamp(g.pointerTarget.y + speed * dt, FIELD_PAD, h - FIELD_PAD);

      const chase = Math.min(1, 10 * dt);
      g.orb.x += (g.pointerTarget.x - g.orb.x) * chase;
      g.orb.y += (g.pointerTarget.y - g.orb.y) * chase;

      g.dashCooldown = Math.max(0, g.dashCooldown - dt);
      if (g.dashCooldown === 0) setDashReady((prev) => (prev ? prev : true));
      g.invulnTimer = Math.max(0, g.invulnTimer - dt);
      g.shake *= 0.9;
      if (g.shake < 0.05) g.shake = 0;

      if (gameStateRef.current === "playing") {
        g.spawnTimer -= dt;
        if (g.spawnTimer <= 0 && g.hazards.length < 7) {
          spawnHazard();
          g.spawnTimer = Math.max(0.42, 1.25 - statsRef.current.level * 0.08);
        }
        g.pickupSpawnTimer -= dt;
        if (g.pickupSpawnTimer <= 0 && g.pickups.length < 5) {
          spawnPickup();
          g.pickupSpawnTimer = 0.8 + Math.random() * 0.7;
        }

        for (const hz of g.hazards) {
          hz.x += hz.vx * dt;
          hz.y += hz.vy * dt;
          hz.rot += hz.spin * dt;
        }
        g.hazards = g.hazards.filter((hz) => hz.x > -60 && hz.x < w + 60 && hz.y > -60 && hz.y < h + 60);

        for (const p of g.pickups) p.phase += dt * 3;

        if (g.invulnTimer <= 0) {
          for (const hz of g.hazards) {
            if (dist(g.orb.x, g.orb.y, hz.x, hz.y) < g.orb.r + hz.r) {
              g.hazards = g.hazards.filter((h2) => h2 !== hz);
              handleHit();
              break;
            }
          }
        }
        for (const p of g.pickups.slice()) {
          if (dist(g.orb.x, g.orb.y, p.x, p.y) < g.orb.r + p.r) {
            g.pickups = g.pickups.filter((pp) => pp !== p);
            handlePickup(p);
          }
        }
      }

      g.particles.forEach((p) => {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= 0.96;
        p.vy *= 0.96;
        p.life -= dt;
      });
      g.particles = g.particles.filter((p) => p.life > 0);
      if (g.particles.length > 50) g.particles = g.particles.slice(-50);

      draw();
      rafRef.current = requestAnimationFrame(step);
    };

    const draw = () => {
      const ctx = ctxRef.current;
      const g = gRef.current;
      if (!ctx) return;
      const { w, h } = g.bounds;
      const t = performance.now() / 1000;

      const breathe = 4 + 3 * Math.sin(t * 0.9);
      ctx.fillStyle = `rgb(${5 + breathe * 0.5}, ${4 + breathe * 0.3}, ${14 + breathe})`;
      ctx.fillRect(0, 0, w, h);

      ctx.save();
      const shakeX = g.shake ? (Math.random() - 0.5) * g.shake : 0;
      const shakeY = g.shake ? (Math.random() - 0.5) * g.shake : 0;
      ctx.translate(shakeX, shakeY);

      starsRef.current.forEach((st) => {
        const a = 0.25 + 0.25 * Math.sin(t * 2 + st.tw);
        ctx.fillStyle = `rgba(150,220,255,${a})`;
        ctx.beginPath();
        ctx.arc(st.x * w, st.y * h, st.r, 0, Math.PI * 2);
        ctx.fill();
      });

      const glow = getGlowSprites();

      g.pickups.forEach((p) => {
        const pulse = 3 * Math.sin(p.phase);
        const gs = 44;
        ctx.drawImage(glow.gold, p.x - gs / 2, p.y - gs / 2, gs, gs);
        ctx.fillStyle = "rgba(255,227,120,0.95)";
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r + pulse, 0, Math.PI * 2);
        ctx.fill();
      });

      g.hazards.forEach((hz) => {
        const gs = hz.r * 2.6;
        ctx.drawImage(glow.magenta, hz.x - gs / 2, hz.y - gs / 2, gs, gs);
        ctx.save();
        ctx.translate(hz.x, hz.y);
        ctx.rotate(hz.rot);
        ctx.strokeStyle = "rgba(255,110,150,0.95)";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(0, -hz.r);
        ctx.lineTo(hz.r, 0);
        ctx.lineTo(0, hz.r);
        ctx.lineTo(-hz.r, 0);
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
      });

      g.particles.forEach((p) => {
        const alpha = Math.max(0, p.life / p.maxLife);
        ctx.fillStyle = `rgba(${p.color},${alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      if (gameStateRef.current === "playing" && g.dashCooldown <= 0) {
        ctx.save();
        ctx.strokeStyle = "rgba(255,217,60,0.5)";
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 5]);
        ctx.beginPath();
        ctx.arc(g.orb.x, g.orb.y, 30 + 3 * Math.sin(t * 4), 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      const blink = g.invulnTimer > 0 ? (Math.sin(t * 30) > 0 ? 1 : 0.3) : 1;
      ctx.save();
      ctx.globalAlpha = blink;
      const ogs = g.orb.r * 4.2;
      ctx.drawImage(glow.cyan, g.orb.x - ogs / 2, g.orb.y - ogs / 2, ogs, ogs);
      ctx.fillStyle = "rgba(230,255,255,0.95)";
      ctx.beginPath();
      ctx.arc(g.orb.x, g.orb.y, g.orb.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.restore();
    };

    rafRef.current = requestAnimationFrame(step);
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const startGame = () => {
    ensureAudio();
    const g = gRef.current;
    statsRef.current = freshStats();
    setUiStats(freshStats());
    g.orb.x = g.bounds.w / 2;
    g.orb.y = g.bounds.h / 2;
    g.pointerTarget = { x: g.orb.x, y: g.orb.y };
    g.hazards = [];
    g.pickups = [];
    g.particles = [];
    g.spawnTimer = 0.6;
    g.pickupSpawnTimer = 0.3;
    g.dashCooldown = 0;
    g.invulnTimer = 0;
    setDashReady(true);
    gameStateRef.current = "playing";
    setGameState("playing");
    playTone(440, 0.15, "triangle", 0.15);
  };

  const dashDisabled = gameState !== "playing" || !dashReady;

  return (
    <div className="app">
      <h1 className="title">Pulse Weaver</h1>
      <div className="hud">
        <div className="stat">
          <div className="label">Score</div>
          <div className="value" data-testid="score">{uiStats.score}</div>
        </div>
        <div className="stat combo">
          <div className="label">Combo</div>
          <div className="value" data-testid="combo">{uiStats.combo}</div>
        </div>
        <div className="stat lives">
          <div className="label">Lives</div>
          <div className="value" data-testid="lives">{uiStats.lives}</div>
        </div>
        <div className="stat level">
          <div className="label">Level</div>
          <div className="value" data-testid="level">{uiStats.level}</div>
        </div>
      </div>

      <div className="play-field" ref={fieldRef} data-testid="play-field">
        <canvas ref={canvasRef} data-testid="canvas" />
        {gameState !== "playing" && (
          <div className="overlay" data-testid="overlay">
            <h2>{gameState === "gameover" ? "Signal Lost" : "Pulse Weaver"}</h2>
            {gameState === "gameover" ? (
              <p className="score-line">
                Score: {uiStats.score} &nbsp;•&nbsp; Best: {Math.max(highScore, uiStats.score)}
              </p>
            ) : (
              <p>
                Steer the glowing orb with your mouse, finger, or arrow keys. Collect gold
                pulses for combo score and weave around the magenta shards. Click, tap, or
                press Space to fire a pulse dash that clears nearby threats.
              </p>
            )}
            <button className="start-btn" data-testid="start-btn" onClick={startGame}>
              {gameState === "gameover" ? "Play Again" : "Start Weaving"}
            </button>
          </div>
        )}
      </div>

      <div className="controls-row">
        <p className="hint">
          Move mouse / drag or touch the field to steer, or use Arrow keys / WASD. Click,
          tap the field, press Space, or hit DASH to pulse-clear nearby hazards.
        </p>
        <button
          className="dash-btn"
          data-testid="dash-btn"
          disabled={dashDisabled}
          onClick={doDash}
        >
          DASH
        </button>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
