<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Comet Courier</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #050a12; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }
  #root { width: 100%; height: 100%; }

  .app {
    width: 100%; height: 100%; position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; overflow: hidden; gap: 4px; padding: 6px 0;
    background: radial-gradient(circle at 50% 4%, #0f1a2e 0%, #081019 55%, #030509 100%);
  }

  .hud {
    display: flex; justify-content: space-around; width: 100%; max-width: 480px;
    padding: 4px 12px; z-index: 15; gap: 4px;
  }
  .hudBox { text-align: center; }
  .hudLabel { font-size: 9px; letter-spacing: 2px; color: #4de8c4; text-transform: uppercase; }
  .hudValue {
    font-size: 19px; font-weight: 800; color: #fff;
    text-shadow: 0 0 10px #4de8c4, 0 0 20px #4de8c4;
  }
  .hudValue.combo { color: #ffd23d; text-shadow: 0 0 10px #ffd23d, 0 0 22px #b3860a; }
  .hudValue.lives { color: #ff6ec7; text-shadow: 0 0 10px #ff6ec7, 0 0 20px #8a1a5a; }
  .hudValue.pulse { animation: hudPulse 0.4s ease; }
  @keyframes hudPulse { 0%,100% { opacity:1; transform: scale(1);} 50% { opacity:0.5; transform: scale(1.3);} }

  .title {
    font-size: clamp(18px, 5vw, 28px); font-weight: 900; letter-spacing: 3px; margin-top: 20px;
    background: linear-gradient(90deg, #4de8c4, #8a6bff, #ff6ec7);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(77,232,196,0.6));
    animation: titlePulse 2.4s ease-in-out infinite;
    text-align: center;
  }
  @keyframes titlePulse { 0%,100% { filter: drop-shadow(0 0 12px rgba(77,232,196,0.6)); } 50% { filter: drop-shadow(0 0 26px rgba(255,110,199,0.85)); } }

  .subtitle { color: #b8c8d0; font-size: 12px; letter-spacing: 0.5px; text-align: center; max-width: 440px; line-height: 1.5; padding: 0 12px; }

  .btn {
    padding: 14px 38px; font-size: 18px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(135deg, #4de8c4, #ff6ec7);
    border: none; border-radius: 50px; color: #071018; cursor: pointer;
    box-shadow: 0 0 20px rgba(77,232,196,0.7), 0 0 50px rgba(255,110,199,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(77,232,196,0.9), 0 0 70px rgba(255,110,199,0.5); }
  .btn:active { transform: scale(0.96); }

  .highscoreLine { color: #ffd23d; font-size: 13px; text-shadow: 0 0 8px rgba(255,210,61,0.6); }

  .fieldOuter {
    position: relative; height: min(64vh, 520px); z-index: 5;
    border-radius: 14px; overflow: hidden; border: 2px solid rgba(77,232,196,0.25);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 0 30px rgba(77,232,196,0.12);
    background: #050a12; touch-action: none; cursor: crosshair;
  }
  .fieldOuter.shakeIt { animation: shakeKf 0.3s ease; }
  @keyframes shakeKf {
    0%, 100% { transform: translate(0,0); }
    20% { transform: translate(-5px, 2px); }
    40% { transform: translate(5px, -2px); }
    60% { transform: translate(-4px, -2px); }
    80% { transform: translate(4px, 2px); }
  }

  canvas.gameCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .flashOverlay {
    position: absolute; inset: 0; z-index: 9; pointer-events: none; background: rgba(255,51,85,0);
  }
  .flashOverlay.bad { animation: flashBadKf 0.3s ease; }
  @keyframes flashBadKf { 0% { background: rgba(255,51,85,0.28); } 100% { background: rgba(255,51,85,0); } }
  .flashOverlay.good { animation: flashGoodKf 0.35s ease; }
  @keyframes flashGoodKf { 0% { background: rgba(77,232,196,0.26); } 100% { background: rgba(77,232,196,0); } }
  .flashOverlay.gold { animation: flashGoldKf 0.5s ease; }
  @keyframes flashGoldKf { 0% { background: rgba(255,210,61,0.38); } 100% { background: rgba(255,210,61,0); } }

  .overlay {
    position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 14px;
    background: rgba(5, 10, 18, 0.93); backdrop-filter: blur(4px);
  }

  .controlsRow {
    display: flex; gap: 8px; z-index: 10; margin-top: 4px; width: min(94vw, 420px); justify-content: center;
  }
  .dpadBtn {
    height: 56px; flex: 1; border-radius: 12px; cursor: pointer;
    background: linear-gradient(135deg, rgba(77,232,196,0.22), rgba(138,107,255,0.14));
    border: 2px solid rgba(77,232,196,0.45); color: #daffee; font-size: 20px; font-weight: 900;
    box-shadow: 0 0 14px rgba(77,232,196,0.3);
    transition: transform 0.1s ease, background 0.1s ease;
  }
  .dpadBtn:active { transform: scale(0.92); background: rgba(77,232,196,0.4); }

  .status { color: #9aa8b3; font-size: 11px; letter-spacing: 0.5px; height: 14px; z-index: 10; text-align: center; transition: color 0.15s ease; }
  .status.pulseTick { color: #4de8c4; }
  .footer { position: relative; text-align: center; color: #171d20; font-size: 10px; z-index: 10; padding-bottom: 2px; }

  @media (max-width: 480px) {
    .hudValue { font-size: 15px; }
    .btn { padding: 12px 28px; font-size: 15px; }
    .subtitle { font-size: 11px; }
    .fieldOuter { height: min(54vh, 440px); }
    .dpadBtn { height: 52px; font-size: 17px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const HS_KEY = 'cometCourierHighScore';
const ASPECT = 0.66;
const THRUST_ACCEL = 720;
const FRICTION = 2.0;
const MAX_SPEED_BASE = 250;
const MAX_SPEED_LEVEL_GAIN = 12;
const MINE_SPEED_BASE = 46;
const MINE_SPEED_LEVEL_GAIN = 7;
const TAP_IMPULSE = 130;
const DELIVERIES_PER_LEVEL = 3;
const CARGO_COLORS = ['#ffb347', '#8a6bff', '#4de8c4', '#ff8fd6'];
const GOLD_COLOR = '#ffe066';
const BEACON_COLOR = '#ff6ec7';
const MINE_COLOR = '#ff3355';
const SHIP_COLOR = '#4de8c4';

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }
function maxSpeedForLevel(level) { return MAX_SPEED_BASE + Math.min(level - 1, 8) * MAX_SPEED_LEVEL_GAIN; }
function mineSpeedForLevel(level) { return MINE_SPEED_BASE + Math.min(level - 1, 8) * MINE_SPEED_LEVEL_GAIN; }
function mineCountForLevel(level) { return Math.min(2 + Math.floor((level - 1) * 0.8), 7); }
function beaconRFactorForLevel(level) { return clamp(0.1 - (level - 1) * 0.004, 0.07, 0.1); }

function useAudio() {
  const ctxRef = useRef(null);
  const getCtx = () => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  };

  const tone = useCallback((freq, duration, type, gainScale, freqEnd) => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + duration);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(gainScale, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.05);
    } catch (e) {}
  }, []);

  const pickupSound = useCallback(() => { tone(420, 0.08, 'triangle', 0.12, 700); }, [tone]);
  const deliverSound = useCallback((combo) => {
    const base = 460 + Math.min(combo, 14) * 35;
    tone(base, 0.1, 'sine', 0.15, base * 1.8);
    setTimeout(() => tone(base * 1.5, 0.1, 'sine', 0.1, base * 2.2), 70);
  }, [tone]);
  const goldSound = useCallback(() => { tone(650, 0.14, 'triangle', 0.17, 1150); setTimeout(() => tone(950, 0.16, 'triangle', 0.14, 1450), 80); }, [tone]);
  const mineSound = useCallback(() => tone(260, 0.22, 'sawtooth', 0.18, 90), [tone]);
  const levelSound = useCallback(() => { tone(500, 0.1, 'square', 0.1, 900); setTimeout(() => tone(750, 0.12, 'square', 0.1, 1200), 90); }, [tone]);
  const overSound = useCallback(() => { tone(300, 0.25, 'sawtooth', 0.2, 200); setTimeout(() => tone(180, 0.35, 'sawtooth', 0.2, 80), 150); }, [tone]);

  return { pickupSound, deliverSound, goldSound, mineSound, levelSound, overSound };
}

function spawnBurst(arr, x, y, color, count, speedMin, speedMax, sizeMin, sizeMax, lifeMs) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = speedMin + Math.random() * (speedMax - speedMin);
    arr.push({
      x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      life: lifeMs, maxLife: lifeMs, color,
      size: sizeMin + Math.random() * (sizeMax - sizeMin),
    });
  }
}

function randPos(w, h, margin) {
  return { x: margin + Math.random() * (w - margin * 2), y: margin + Math.random() * (h - margin * 2) };
}

function spawnCargo(w, h, avoid) {
  const margin = w * 0.14;
  let p;
  let tries = 0;
  do {
    p = randPos(w, h, margin);
    tries++;
  } while (avoid && dist(p.x, p.y, avoid.x, avoid.y) < Math.min(w, h) * 0.32 && tries < 20);
  const gold = Math.random() < 0.16;
  return {
    x: p.x, y: p.y,
    color: gold ? GOLD_COLOR : CARGO_COLORS[Math.floor(Math.random() * CARGO_COLORS.length)],
    gold,
    bob: Math.random() * Math.PI * 2,
  };
}

function spawnBeacon(w, h, avoid) {
  const margin = w * 0.16;
  let p;
  let tries = 0;
  do {
    p = randPos(w, h, margin);
    tries++;
  } while (avoid && dist(p.x, p.y, avoid.x, avoid.y) < Math.min(w, h) * 0.32 && tries < 20);
  return { x: p.x, y: p.y };
}

function buildMines(level, w, h, avoid) {
  const count = mineCountForLevel(level);
  const speed = mineSpeedForLevel(level);
  const mines = [];
  for (let i = 0; i < count; i++) {
    let p;
    let tries = 0;
    do {
      p = randPos(w, h, w * 0.1);
      tries++;
    } while (avoid && dist(p.x, p.y, avoid.x, avoid.y) < Math.min(w, h) * 0.22 && tries < 20);
    const ang = Math.random() * Math.PI * 2;
    mines.push({ x: p.x, y: p.y, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed, cooldown: 0 });
  }
  return mines;
}

function buildStars(w, h) {
  const stars = [];
  const count = 70;
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * w, y: Math.random() * h,
      size: 0.6 + Math.random() * 1.6,
      twinkle: Math.random() * Math.PI * 2,
      depth: 0.3 + Math.random() * 0.7,
    });
  }
  return stars;
}

function App() {
  const [phase, setPhase] = useState('start'); // start | playing | over
  const [score, setScore] = useState(0);
  const [level, setLevel] = useState(1);
  const [lives, setLives] = useState(3);
  const [combo, setCombo] = useState(0);
  const [comboPulse, setComboPulse] = useState(false);
  const [shakeIt, setShakeIt] = useState(false);
  const [flashKind, setFlashKind] = useState(null);
  const [highScore, setHighScore] = useState(() => parseInt(localStorage.getItem(HS_KEY) || '0', 10));
  const [statusMsg, setStatusMsg] = useState('Fly to the glowing cargo pod.');
  const [enginePulse, setEnginePulse] = useState(false);

  const canvasRef = useRef(null);
  const fieldRef = useRef(null);
  const particlesRef = useRef([]);
  const starsRef = useRef([]);

  const shipRef = useRef({ x: 130, y: 210, vx: 0, vy: 0, angle: -Math.PI / 2 });
  const cargoRef = useRef(null);
  const beaconRef = useRef({ x: 0, y: 0 });
  const minesRef = useRef([]);
  const carryingRef = useRef(false);
  const carryingGoldRef = useRef(false);
  const heldRef = useRef({ up: false, down: false, left: false, right: false });
  const draggingRef = useRef(false);
  const dragPointRef = useRef({ x: 0, y: 0 });
  const thrustTimerRef = useRef(0);
  const timeRef = useRef(0);

  const scoreRef = useRef(0);
  const levelRef = useRef(1);
  const livesRef = useRef(3);
  const comboRef = useRef(0);
  const deliveriesRef = useRef(0);
  const highScoreRef = useRef(highScore);
  const phaseRef = useRef('start');
  const dimsRef = useRef({ w: 260, h: 420 });

  const rafRef = useRef(null);
  const lastTsRef = useRef(null);
  const flashTimeoutRef = useRef(null);
  const shakeTimeoutRef = useRef(null);
  const comboPulseTimeoutRef = useRef(null);

  const { pickupSound, deliverSound, goldSound, mineSound, levelSound, overSound } = useAudio();

  useEffect(() => { phaseRef.current = phase; }, [phase]);

  const checkHighScore = useCallback(() => {
    if (scoreRef.current > highScoreRef.current) {
      highScoreRef.current = scoreRef.current;
      localStorage.setItem(HS_KEY, String(scoreRef.current));
      setHighScore(scoreRef.current);
    }
  }, []);

  const resizeCanvas = useCallback(() => {
    const canvas = canvasRef.current;
    const field = fieldRef.current;
    if (!canvas || !field) return;
    const rect = field.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dimsRef.current = { w: rect.width, h: rect.height };
    starsRef.current = buildStars(rect.width, rect.height);
  }, []);

  useEffect(() => {
    resizeCanvas();
    const setFieldWidth = () => {
      const field = fieldRef.current;
      if (!field) return;
      const h = field.getBoundingClientRect().height;
      field.style.width = Math.round(h * ASPECT) + 'px';
      resizeCanvas();
    };
    setFieldWidth();
    window.addEventListener('resize', setFieldWidth);
    return () => window.removeEventListener('resize', setFieldWidth);
  }, [resizeCanvas]);

  const triggerFlash = useCallback((kind, ms) => {
    setFlashKind(kind);
    clearTimeout(flashTimeoutRef.current);
    flashTimeoutRef.current = setTimeout(() => setFlashKind(null), ms);
  }, []);

  const setupLevel = useCallback((lvl, w, h) => {
    const ship = shipRef.current;
    cargoRef.current = spawnCargo(w, h, ship);
    beaconRef.current = spawnBeacon(w, h, cargoRef.current);
    minesRef.current = buildMines(lvl, w, h, ship);
  }, []);

  const resetGame = useCallback(() => {
    const { w, h } = dimsRef.current;
    scoreRef.current = 0; setScore(0);
    levelRef.current = 1; setLevel(1);
    livesRef.current = 3; setLives(3);
    comboRef.current = 0; setCombo(0);
    deliveriesRef.current = 0;
    particlesRef.current = [];
    carryingRef.current = false;
    carryingGoldRef.current = false;
    heldRef.current = { up: false, down: false, left: false, right: false };
    draggingRef.current = false;
    shipRef.current = { x: w / 2, y: h / 2, vx: 0, vy: 0, angle: -Math.PI / 2 };
    setupLevel(1, w, h);
  }, [setupLevel]);

  const startGame = useCallback(() => {
    resizeCanvas();
    resetGame();
    setStatusMsg('Fly to the glowing cargo pod.');
    phaseRef.current = 'playing';
    setPhase('playing');
  }, [resizeCanvas, resetGame]);

  const startGameRef = useRef(null);
  useEffect(() => { startGameRef.current = startGame; }, [startGame]);

  const onPickup = useCallback(() => {
    carryingRef.current = true;
    carryingGoldRef.current = cargoRef.current.gold;
    const { w, h } = dimsRef.current;
    spawnBurst(particlesRef.current, cargoRef.current.x, cargoRef.current.y, cargoRef.current.color, 12, 60, 180, 1.5, 3.5, 450);
    cargoRef.current = null;
    pickupSound();
    setStatusMsg(carryingGoldRef.current ? 'Gold cargo locked! Rush it to the beacon.' : 'Cargo locked! Deliver to the beacon.');
  }, [pickupSound]);

  const onDeliver = useCallback(() => {
    comboRef.current += 1;
    setCombo(comboRef.current);
    setComboPulse(true);
    clearTimeout(comboPulseTimeoutRef.current);
    comboPulseTimeoutRef.current = setTimeout(() => setComboPulse(false), 350);

    const base = carryingGoldRef.current ? 320 : 110;
    const gained = base + (comboRef.current - 1) * 18;
    scoreRef.current += gained;
    setScore(scoreRef.current);
    checkHighScore();
    deliveriesRef.current += 1;

    const { w, h } = dimsRef.current;
    spawnBurst(particlesRef.current, beaconRef.current.x, beaconRef.current.y, carryingGoldRef.current ? GOLD_COLOR : BEACON_COLOR, carryingGoldRef.current ? 18 : 11, 70, 220, 1.5, 4, 500);

    if (carryingGoldRef.current) {
      goldSound();
      triggerFlash('gold', 450);
      setStatusMsg('JACKPOT DELIVERY!');
    } else {
      deliverSound(comboRef.current);
      triggerFlash('good', 250);
      setStatusMsg(comboRef.current > 4 ? `Combo x${comboRef.current}!` : 'Delivered!');
    }

    carryingRef.current = false;
    carryingGoldRef.current = false;

    const newLevel = Math.floor(deliveriesRef.current / DELIVERIES_PER_LEVEL) + 1;
    if (newLevel !== levelRef.current) {
      levelRef.current = newLevel;
      setLevel(newLevel);
      minesRef.current = buildMines(newLevel, w, h, shipRef.current);
      levelSound();
      setStatusMsg(`Level ${newLevel}! The drift field thickens.`);
    }

    cargoRef.current = spawnCargo(w, h, beaconRef.current);
    beaconRef.current = spawnBeacon(w, h, cargoRef.current);
  }, [checkHighScore, deliverSound, goldSound, levelSound, triggerFlash]);

  const onMineHit = useCallback(() => {
    livesRef.current -= 1;
    setLives(livesRef.current);
    comboRef.current = 0;
    setCombo(0);
    mineSound();
    triggerFlash('bad', 300);
    setShakeIt(true);
    clearTimeout(shakeTimeoutRef.current);
    shakeTimeoutRef.current = setTimeout(() => setShakeIt(false), 200);

    const ship = shipRef.current;
    spawnBurst(particlesRef.current, ship.x, ship.y, MINE_COLOR, 14, 80, 240, 1.5, 4, 500);

    if (carryingRef.current) {
      carryingRef.current = false;
      carryingGoldRef.current = false;
      const { w, h } = dimsRef.current;
      cargoRef.current = spawnCargo(w, h, ship);
      setStatusMsg('Hit a mine! Cargo lost.');
    } else {
      setStatusMsg('Hit a mine! Careful out there.');
    }

    if (livesRef.current <= 0) {
      phaseRef.current = 'over';
      setPhase('over');
      overSound();
      setStatusMsg('Out of hull integrity!');
      checkHighScore();
    }
  }, [mineSound, triggerFlash, overSound, checkHighScore]);

  const getLocalPoint = useCallback((e) => {
    const field = fieldRef.current;
    const rect = field.getBoundingClientRect();
    const cx = e.touches && e.touches.length ? e.touches[0].clientX : e.clientX;
    const cy = e.touches && e.touches.length ? e.touches[0].clientY : e.clientY;
    return { x: cx - rect.left, y: cy - rect.top };
  }, []);

  const onPointerDownField = useCallback((e) => {
    if (phaseRef.current !== 'playing') return;
    e.preventDefault();
    draggingRef.current = true;
    const pt = getLocalPoint(e);
    dragPointRef.current = pt;
    const ship = shipRef.current;
    const dx = pt.x - ship.x, dy = pt.y - ship.y;
    const d = Math.hypot(dx, dy);
    if (d > 2) {
      ship.vx += (dx / d) * TAP_IMPULSE;
      ship.vy += (dy / d) * TAP_IMPULSE;
    }
    setEnginePulse((p) => !p);
  }, [getLocalPoint]);

  const onPointerMoveField = useCallback((e) => {
    if (!draggingRef.current) return;
    e.preventDefault();
    dragPointRef.current = getLocalPoint(e);
  }, [getLocalPoint]);

  const onPointerUpField = useCallback(() => {
    draggingRef.current = false;
  }, []);

  const DIR_VECTORS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

  const applyDirImpulse = useCallback((dir) => {
    const [dx, dy] = DIR_VECTORS[dir];
    const ship = shipRef.current;
    ship.vx += dx * TAP_IMPULSE;
    ship.vy += dy * TAP_IMPULSE;
    setEnginePulse((p) => !p);
  }, []);

  const setHeld = useCallback((dir, val) => {
    heldRef.current[dir] = val;
    if (val && phaseRef.current === 'playing') applyDirImpulse(dir);
  }, [applyDirImpulse]);

  useEffect(() => {
    const onKeyDown = (e) => {
      if (phaseRef.current !== 'playing') {
        if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); startGameRef.current && startGameRef.current(); }
        return;
      }
      if (e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); if (!heldRef.current.up) applyDirImpulse('up'); heldRef.current.up = true; }
      else if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); if (!heldRef.current.down) applyDirImpulse('down'); heldRef.current.down = true; }
      else if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); if (!heldRef.current.left) applyDirImpulse('left'); heldRef.current.left = true; }
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); if (!heldRef.current.right) applyDirImpulse('right'); heldRef.current.right = true; }
    };
    const onKeyUp = (e) => {
      if (e.code === 'ArrowUp' || e.code === 'KeyW') heldRef.current.up = false;
      else if (e.code === 'ArrowDown' || e.code === 'KeyS') heldRef.current.down = false;
      else if (e.code === 'ArrowLeft' || e.code === 'KeyA') heldRef.current.left = false;
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') heldRef.current.right = false;
    };
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    return () => { window.removeEventListener('keydown', onKeyDown); window.removeEventListener('keyup', onKeyUp); };
  }, [applyDirImpulse]);

  useEffect(() => () => {
    clearTimeout(flashTimeoutRef.current);
    clearTimeout(shakeTimeoutRef.current);
    clearTimeout(comboPulseTimeoutRef.current);
  }, []);

  // Main physics + draw loop
  useEffect(() => {
    const onPickupRef = onPickup;
    const onDeliverRef = onDeliver;
    const onMineHitRef = onMineHit;

    const loop = (ts) => {
      const canvas = canvasRef.current;
      if (canvas) {
        const ctx = canvas.getContext('2d');
        const { w, h } = dimsRef.current;

        if (lastTsRef.current == null) lastTsRef.current = ts;
        let dt = (ts - lastTsRef.current) / 1000;
        lastTsRef.current = ts;
        dt = clamp(dt, 0, 0.033);
        timeRef.current += dt;

        if (w > 10 && h > 10) {
          const ship = shipRef.current;
          const shipR = w * 0.034;

          if (phaseRef.current === 'playing') {
            let ax = 0, ay = 0;
            const held = heldRef.current;
            if (held.left) ax -= 1;
            if (held.right) ax += 1;
            if (held.up) ay -= 1;
            if (held.down) ay += 1;

            let thrusting = false;
            if (ax !== 0 || ay !== 0) {
              const mag = Math.hypot(ax, ay) || 1;
              ax /= mag; ay /= mag;
              thrusting = true;
            } else if (draggingRef.current) {
              const dx = dragPointRef.current.x - ship.x;
              const dy = dragPointRef.current.y - ship.y;
              const d = Math.hypot(dx, dy);
              if (d > 4) {
                ax = dx / d; ay = dy / d;
                const scale = Math.min(1, d / 40);
                ax *= scale; ay *= scale;
                thrusting = true;
              }
            }

            if (thrusting) {
              ship.vx += ax * THRUST_ACCEL * dt;
              ship.vy += ay * THRUST_ACCEL * dt;
              ship.angle = Math.atan2(ay, ax);
              thrustTimerRef.current += dt;
              if (thrustTimerRef.current > 0.035) {
                thrustTimerRef.current = 0;
                const back = ship.angle + Math.PI;
                spawnBurst(particlesRef.current, ship.x + Math.cos(back) * shipR, ship.y + Math.sin(back) * shipR, SHIP_COLOR, 1, 30, 70, 1, 2.4, 320);
              }
            }

            const decay = Math.exp(-FRICTION * dt);
            ship.vx *= decay; ship.vy *= decay;
            const speed = Math.hypot(ship.vx, ship.vy);
            const maxSpeed = maxSpeedForLevel(levelRef.current);
            if (speed > maxSpeed) { ship.vx = (ship.vx / speed) * maxSpeed; ship.vy = (ship.vy / speed) * maxSpeed; }
            if (speed > 6) ship.angle = Math.atan2(ship.vy, ship.vx);

            ship.x += ship.vx * dt;
            ship.y += ship.vy * dt;

            const hullR = shipR * 1.3;
            if (ship.x - hullR < 0) { ship.x = hullR; ship.vx = -ship.vx * 0.6; }
            if (ship.x + hullR > w) { ship.x = w - hullR; ship.vx = -ship.vx * 0.6; }
            if (ship.y - hullR < 0) { ship.y = hullR; ship.vy = -ship.vy * 0.6; }
            if (ship.y + hullR > h) { ship.y = h - hullR; ship.vy = -ship.vy * 0.6; }

            // Mines: move, bounce off walls
            for (const mine of minesRef.current) {
              const mr = w * 0.042;
              mine.x += mine.vx * dt;
              mine.y += mine.vy * dt;
              if (mine.x - mr < 0) { mine.x = mr; mine.vx = -mine.vx; }
              if (mine.x + mr > w) { mine.x = w - mr; mine.vx = -mine.vx; }
              if (mine.y - mr < 0) { mine.y = mr; mine.vy = -mine.vy; }
              if (mine.y + mr > h) { mine.y = h - mr; mine.vy = -mine.vy; }
              if (mine.cooldown > 0) { mine.cooldown -= dt * 1000; continue; }
              if (dist(ship.x, ship.y, mine.x, mine.y) < shipR + mr) {
                mine.cooldown = 800;
                const nx = mine.x - ship.x, ny = mine.y - ship.y;
                const nd = Math.hypot(nx, ny) || 1;
                ship.vx = -(nx / nd) * 200;
                ship.vy = -(ny / nd) * 200;
                onMineHitRef();
              }
            }

            // Cargo pickup
            if (!carryingRef.current && cargoRef.current) {
              const cr = w * 0.05;
              if (dist(ship.x, ship.y, cargoRef.current.x, cargoRef.current.y) < shipR + cr) {
                onPickupRef();
              }
            }

            // Beacon delivery
            if (carryingRef.current) {
              const br = w * beaconRFactorForLevel(levelRef.current);
              if (dist(ship.x, ship.y, beaconRef.current.x, beaconRef.current.y) < shipR + br * 0.7) {
                onDeliverRef();
              }
            }
          }

          particlesRef.current = particlesRef.current.filter((p) => p.life > 0);
          for (const p of particlesRef.current) {
            p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; p.life -= dt * 1000;
          }

          ctx.clearRect(0, 0, w, h);
          ctx.fillStyle = '#050a12';
          ctx.fillRect(0, 0, w, h);

          // Starfield with light parallax drift opposite ship velocity
          for (const s of starsRef.current) {
            const px = (s.x - ship.vx * s.depth * 0.02 + w * 4) % w;
            const py = (s.y - ship.vy * s.depth * 0.02 + h * 4) % h;
            const tw = 0.5 + 0.5 * Math.sin(timeRef.current * 1.5 + s.twinkle);
            ctx.save();
            ctx.globalAlpha = 0.25 + tw * 0.5 * s.depth;
            ctx.fillStyle = '#bfe8ff';
            ctx.beginPath(); ctx.arc(px, py, s.size, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
          }

          // Beacon
          const beacon = beaconRef.current;
          const br = w * beaconRFactorForLevel(levelRef.current);
          const pulse = 0.85 + 0.15 * Math.sin(timeRef.current * (carryingRef.current ? 6 : 2.5));
          ctx.save();
          ctx.globalAlpha = carryingRef.current ? 1 : 0.45;
          ctx.strokeStyle = BEACON_COLOR;
          ctx.shadowColor = BEACON_COLOR;
          ctx.shadowBlur = carryingRef.current ? 22 : 10;
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(beacon.x, beacon.y, br * pulse, 0, Math.PI * 2); ctx.stroke();
          ctx.globalAlpha = carryingRef.current ? 0.22 : 0.08;
          ctx.fillStyle = BEACON_COLOR;
          ctx.beginPath(); ctx.arc(beacon.x, beacon.y, br * 0.6, 0, Math.PI * 2); ctx.fill();
          ctx.restore();

          // Cargo pod
          if (cargoRef.current && !carryingRef.current) {
            const c = cargoRef.current;
            const cr = w * 0.05;
            const bob = Math.sin(timeRef.current * 3 + c.bob) * cr * 0.15;
            ctx.save();
            ctx.strokeStyle = c.color;
            ctx.shadowColor = c.color;
            ctx.shadowBlur = c.gold ? 22 : 12;
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(c.x, c.y + bob, cr, 0, Math.PI * 2); ctx.stroke();
            ctx.fillStyle = c.color;
            ctx.globalAlpha = 0.35;
            ctx.beginPath(); ctx.arc(c.x, c.y + bob, cr * 0.55, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
          }

          // Mines
          for (const mine of minesRef.current) {
            const mr = w * 0.042;
            const cooling = mine.cooldown > 0;
            ctx.save();
            ctx.globalAlpha = cooling ? 0.3 : 0.95;
            ctx.fillStyle = MINE_COLOR;
            ctx.shadowColor = MINE_COLOR;
            ctx.shadowBlur = 14;
            ctx.beginPath(); ctx.arc(mine.x, mine.y, mr * 0.6, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#ffb0be';
            ctx.lineWidth = 2;
            const spikes = 8;
            for (let i = 0; i < spikes; i++) {
              const a = (i / spikes) * Math.PI * 2 + timeRef.current * 0.6;
              ctx.beginPath();
              ctx.moveTo(mine.x + Math.cos(a) * mr * 0.6, mine.y + Math.sin(a) * mr * 0.6);
              ctx.lineTo(mine.x + Math.cos(a) * mr * 1.15, mine.y + Math.sin(a) * mr * 1.15);
              ctx.stroke();
            }
            ctx.restore();
          }

          // Ship
          ctx.save();
          ctx.translate(ship.x, ship.y);
          ctx.rotate(ship.angle);
          ctx.strokeStyle = SHIP_COLOR;
          ctx.shadowColor = SHIP_COLOR;
          ctx.shadowBlur = 14;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(shipR * 1.3, 0);
          ctx.lineTo(-shipR * 0.9, shipR * 0.85);
          ctx.lineTo(-shipR * 0.4, 0);
          ctx.lineTo(-shipR * 0.9, -shipR * 0.85);
          ctx.closePath();
          ctx.stroke();
          ctx.fillStyle = SHIP_COLOR;
          ctx.globalAlpha = 0.25;
          ctx.fill();
          ctx.restore();

          if (carryingRef.current) {
            ctx.save();
            const glowColor = carryingGoldRef.current ? GOLD_COLOR : BEACON_COLOR;
            ctx.strokeStyle = glowColor;
            ctx.shadowColor = glowColor;
            ctx.shadowBlur = 16;
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.beginPath(); ctx.arc(ship.x, ship.y, shipR * 1.9, 0, Math.PI * 2); ctx.stroke();
            ctx.setLineDash([]);
            ctx.restore();
          }

          for (const p of particlesRef.current) {
            const a = clamp(p.life / p.maxLife, 0, 1);
            ctx.save();
            ctx.globalAlpha = a;
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
          }
        }
      }
      rafRef.current = requestAnimationFrame(loop);
    };
    rafRef.current = requestAnimationFrame(loop);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [onPickup, onDeliver, onMineHit]);

  return (
    <div className="app">
      <div className="hud">
        <div className="hudBox">
          <div className="hudLabel">Score</div>
          <div className="hudValue" data-testid="score">{score}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Level</div>
          <div className="hudValue" data-testid="level">{level}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Hull</div>
          <div className="hudValue lives" data-testid="lives">{lives}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Combo</div>
          <div className={"hudValue combo" + (comboPulse ? " pulse" : "")} data-testid="combo">x{combo}</div>
        </div>
      </div>

      {phase !== 'playing' && (
        <div style={{ marginTop: 10, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 12 }}>
          <div className="title">COMET COURIER</div>
          <div className="subtitle">
            Steer your glowing ship with drift inertia through a debris field, scoop up the pulsing cargo pod, then haul it to the beacon to deliver — chaining fast deliveries for a rising combo, with gold cargo paying out huge. Hold Arrow keys / WASD, tap-and-hold the on-screen thrusters, or drag anywhere in the field to thrust your ship toward your finger or cursor. Clip a drifting spiked mine and you lose one of three hull points, dropping any cargo you're carrying. Every three deliveries levels you up, adding faster mines and a tighter beacon to dock with.
          </div>
        </div>
      )}

      <div
        className={"fieldOuter" + (shakeIt ? " shakeIt" : "")}
        data-testid="play-field"
        ref={fieldRef}
        onMouseDown={onPointerDownField}
        onMouseMove={onPointerMoveField}
        onMouseUp={onPointerUpField}
        onMouseLeave={onPointerUpField}
        onTouchStart={onPointerDownField}
        onTouchMove={onPointerMoveField}
        onTouchEnd={onPointerUpField}
        onTouchCancel={onPointerUpField}
      >
        <canvas
          className="gameCanvas"
          data-testid="canvas"
          ref={canvasRef}
        ></canvas>
        <div className={"flashOverlay" + (flashKind ? " " + flashKind : "")}></div>

        {phase === 'start' && (
          <div className="overlay">
            <div className="highscoreLine">High Score: {highScore}</div>
            <button className="btn" data-testid="start-btn" onClick={startGame}>START</button>
          </div>
        )}

        {phase === 'over' && (
          <div className="overlay">
            <div className="title" style={{ marginTop: 0, fontSize: 22 }}>HULL BREACHED</div>
            <div className="hudValue" style={{ fontSize: 26 }}>{score}</div>
            <div className="highscoreLine">High Score: {highScore}</div>
            <button className="btn" data-testid="start-btn" onClick={startGame}>RETRY</button>
          </div>
        )}
      </div>

      {phase === 'playing' && (
        <div className="controlsRow">
          <button
            className="dpadBtn"
            data-testid="dpad-left-btn"
            onMouseDown={() => setHeld('left', true)}
            onMouseUp={() => setHeld('left', false)}
            onMouseLeave={() => setHeld('left', false)}
            onTouchStart={(e) => { e.preventDefault(); setHeld('left', true); }}
            onTouchEnd={(e) => { e.preventDefault(); setHeld('left', false); }}
            onTouchCancel={(e) => { e.preventDefault(); setHeld('left', false); }}
          >◀</button>
          <button
            className="dpadBtn"
            data-testid="dpad-up-btn"
            onMouseDown={() => setHeld('up', true)}
            onMouseUp={() => setHeld('up', false)}
            onMouseLeave={() => setHeld('up', false)}
            onTouchStart={(e) => { e.preventDefault(); setHeld('up', true); }}
            onTouchEnd={(e) => { e.preventDefault(); setHeld('up', false); }}
            onTouchCancel={(e) => { e.preventDefault(); setHeld('up', false); }}
          >▲</button>
          <button
            className="dpadBtn"
            data-testid="dpad-down-btn"
            onMouseDown={() => setHeld('down', true)}
            onMouseUp={() => setHeld('down', false)}
            onMouseLeave={() => setHeld('down', false)}
            onTouchStart={(e) => { e.preventDefault(); setHeld('down', true); }}
            onTouchEnd={(e) => { e.preventDefault(); setHeld('down', false); }}
            onTouchCancel={(e) => { e.preventDefault(); setHeld('down', false); }}
          >▼</button>
          <button
            className="dpadBtn"
            data-testid="dpad-right-btn"
            onMouseDown={() => setHeld('right', true)}
            onMouseUp={() => setHeld('right', false)}
            onMouseLeave={() => setHeld('right', false)}
            onTouchStart={(e) => { e.preventDefault(); setHeld('right', true); }}
            onTouchEnd={(e) => { e.preventDefault(); setHeld('right', false); }}
            onTouchCancel={(e) => { e.preventDefault(); setHeld('right', false); }}
          >▶</button>
        </div>
      )}

      <div className={"status" + (enginePulse ? " pulseTick" : "")}>{statusMsg}</div>
      <div className="footer">Neon Game Arcade</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
