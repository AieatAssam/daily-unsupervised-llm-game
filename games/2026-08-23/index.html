<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Nova Pilot</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05030d; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }
  #root { width: 100%; height: 100%; }

  .app {
    width: 100%; height: 100%; position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: center; overflow: hidden; gap: 8px;
    background: radial-gradient(circle at 50% 12%, #0f1a2e 0%, #0a0a18 55%, #030109 100%);
  }

  .hud {
    position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-around;
    padding: 10px 12px; z-index: 15; pointer-events: none;
  }
  .hudBox { text-align: center; }
  .hudLabel { font-size: 10px; letter-spacing: 2px; color: #5ecfff; text-transform: uppercase; }
  .hudValue {
    font-size: 22px; font-weight: 800; color: #fff;
    text-shadow: 0 0 10px #5ecfff, 0 0 20px #5ecfff;
  }
  .hudValue.combo { color: #ffe45e; text-shadow: 0 0 10px #ffe45e, 0 0 22px #ff9d00; }
  .hudValue.lives { color: #ff5ee0; text-shadow: 0 0 10px #ff5ee0, 0 0 22px #c300a0; }
  .hudValue.hurt { animation: hurtPulse 0.4s ease; }
  @keyframes hurtPulse { 0%,100% { opacity:1; transform: scale(1);} 50% { opacity:0.4; transform: scale(1.25);} }

  .title {
    font-size: clamp(20px, 6vw, 32px); font-weight: 900; letter-spacing: 3px;
    background: linear-gradient(90deg, #5ecfff, #9d6bff, #ff5ee0);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(94,207,255,0.6));
    animation: titlePulse 2.4s ease-in-out infinite;
    text-align: center;
  }
  @keyframes titlePulse { 0%,100% { filter: drop-shadow(0 0 12px rgba(94,207,255,0.6)); } 50% { filter: drop-shadow(0 0 26px rgba(94,207,255,0.95)); } }

  .subtitle { color: #cabde8; font-size: 14px; letter-spacing: 0.5px; text-align: center; max-width: 400px; line-height: 1.5; }

  .btn {
    padding: 15px 40px; font-size: 19px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(135deg, #2f7cff, #ff4ecb);
    border: none; border-radius: 50px; color: #fff; cursor: pointer;
    box-shadow: 0 0 20px rgba(47,124,255,0.7), 0 0 50px rgba(255,80,200,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(47,124,255,0.9), 0 0 70px rgba(255,80,200,0.5); }
  .btn:active { transform: scale(0.96); }

  .highscoreLine { color: #ffd35e; font-size: 14px; text-shadow: 0 0 8px rgba(255,200,50,0.6); }

  .arenaOuter {
    position: relative; width: min(94vw, 640px); height: min(60vh, 440px); z-index: 5;
    border-radius: 20px; overflow: hidden; border: 2px solid rgba(94,207,255,0.25);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 0 30px rgba(94,207,255,0.15);
    background: #08061a; cursor: pointer;
  }

  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .overlay {
    position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 20px;
    background: rgba(4, 6, 15, 0.85); backdrop-filter: blur(4px);
  }

  .status { color: #beb0e0; font-size: 13px; letter-spacing: 0.5px; height: 16px; z-index: 10; text-align: center; }

  .footer { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; color: #4a5a6a; font-size: 11px; z-index: 10; }

  .controls {
    position: absolute; bottom: 10px; left: 0; right: 0; z-index: 15;
    display: flex; justify-content: space-between; align-items: flex-end; padding: 0 12px;
    pointer-events: none;
  }
  .padCluster { display: flex; gap: 8px; pointer-events: auto; }
  .padBtn {
    width: 52px; height: 52px; border-radius: 14px; border: 1.5px solid rgba(94,207,255,0.4);
    background: rgba(15,20,40,0.7); color: #cfe8ff; font-size: 20px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; touch-action: none;
    box-shadow: 0 0 10px rgba(94,207,255,0.25);
  }
  .padBtn.active { background: rgba(94,207,255,0.35); box-shadow: 0 0 16px rgba(94,207,255,0.6); }
  .fireBtn {
    width: 64px; height: 64px; border-radius: 50%; border: 1.5px solid rgba(255,80,200,0.5);
    background: rgba(50,10,40,0.7); color: #ffd0f0; font-size: 13px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; touch-action: none;
    box-shadow: 0 0 12px rgba(255,80,200,0.3);
  }
  .fireBtn.active { background: rgba(255,80,200,0.4); box-shadow: 0 0 20px rgba(255,80,200,0.7); }

  @media (max-width: 480px) {
    .hudValue { font-size: 17px; }
    .btn { padding: 13px 30px; font-size: 16px; }
    .subtitle { font-size: 13px; }
    .arenaOuter { height: min(56vh, 440px); }
    .padBtn { width: 46px; height: 46px; }
    .fireBtn { width: 56px; height: 56px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const HS_KEY = 'novaPilot_highScore';
const LIVES_START = 3;
const INVULN_MS = 1500;
const COMBO_WINDOW_MS = 1800;
const ROT_SPEED = 3.6; // rad/s
const THRUST_ACCEL = 190;
const MAX_SPEED = 260;
const DRAG = 0.55;
const FIRE_COOLDOWN_MS = 220;
const BULLET_SPEED = 420;
const BULLET_LIFE_MS = 900;
const TIER = { large: { radius: 34, points: 20, speed: 26, next: 'medium' },
               medium: { radius: 20, points: 50, speed: 46, next: 'small' },
               small: { radius: 11, points: 100, speed: 74, next: null } };

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function dist2(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
function wrap(v, max) { if (v < 0) return v + max; if (v > max) return v - max; return v; }

function useAudio() {
  const ctxRef = useRef(null);
  const getCtx = () => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  };

  const tone = useCallback((freq, duration, type, gainScale, freqEnd) => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + duration);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(gainScale, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.05);
    } catch (e) {}
  }, []);

  const laserSound = useCallback(() => tone(880, 0.09, 'square', 0.08, 320), [tone]);
  const boomSound = useCallback((big) => tone(big ? 140 : 260, big ? 0.35 : 0.18, 'sawtooth', big ? 0.22 : 0.14, big ? 45 : 90), [tone]);
  const hitSound = useCallback(() => tone(130, 0.32, 'sawtooth', 0.24, 50), [tone]);
  const overSound = useCallback(() => {
    tone(320, 0.25, 'sawtooth', 0.2, 220);
    setTimeout(() => tone(200, 0.35, 'sawtooth', 0.2, 90), 150);
  }, [tone]);

  return { laserSound, boomSound, hitSound, overSound };
}

function makeGameState() {
  return {
    bounds: { w: 640, h: 440 },
    ship: { x: 320, y: 220, angle: -Math.PI / 2, vx: 0, vy: 0 },
    asteroids: [],
    bullets: [],
    particles: [],
    elapsed: 0,
    spawnTimer: 1200,
    invulnUntil: 900,
    lastShotAt: -9999,
    shake: 0,
    running: false,
  };
}

function makeAsteroidVerts(radius) {
  const n = 8 + Math.floor(Math.random() * 3);
  const verts = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    const r = radius * (0.75 + Math.random() * 0.45);
    verts.push({ a, r });
  }
  return verts;
}

function spawnAsteroid(state, tier, x, y) {
  const { w, h } = state.bounds;
  const cfg = TIER[tier];
  let px = x, py = y;
  if (px === undefined) {
    const edge = Math.floor(Math.random() * 4);
    if (edge === 0) { px = -cfg.radius; py = Math.random() * h; }
    else if (edge === 1) { px = w + cfg.radius; py = Math.random() * h; }
    else if (edge === 2) { px = Math.random() * w; py = -cfg.radius; }
    else { px = Math.random() * w; py = h + cfg.radius; }
  }
  const ang = Math.random() * Math.PI * 2;
  const spd = cfg.speed * (0.6 + Math.random() * 0.8);
  state.asteroids.push({
    x: px, y: py, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
    tier, radius: cfg.radius, rotAngle: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 1.4, verts: makeAsteroidVerts(cfg.radius),
  });
}

function spawnBurst(arr, x, y, color, count, speedMin, speedMax, sizeMin, sizeMax, lifeMs) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = speedMin + Math.random() * (speedMax - speedMin);
    arr.push({
      x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      life: lifeMs, maxLife: lifeMs, color,
      size: sizeMin + Math.random() * (sizeMax - sizeMin),
    });
  }
}

function App() {
  const [phase, setPhase] = useState('start'); // start | playing | over
  const [score, setScore] = useState(0);
  const [lives, setLives] = useState(LIVES_START);
  const [combo, setCombo] = useState(0);
  const [hurt, setHurt] = useState(false);
  const [highScore, setHighScore] = useState(() => parseInt(localStorage.getItem(HS_KEY) || '0', 10));
  const [statusMsg, setStatusMsg] = useState('Rotate & thrust to fly, fire to blast asteroids into smaller shards.');
  const [padState, setPadState] = useState({ left: false, right: false, thrust: false, fire: false });

  const canvasRef = useRef(null);
  const arenaRef = useRef(null);
  const gs = useRef(makeGameState());
  const rafRef = useRef(null);
  const lastTsRef = useRef(0);
  const scoreRef = useRef(0);
  const comboRef = useRef(0);
  const comboExpireRef = useRef(0);
  const livesRef = useRef(LIVES_START);
  const highScoreRef = useRef(highScore);
  const phaseRef = useRef('start');
  const heldRef = useRef({ left: false, right: false, thrust: false, fire: false });
  const { laserSound, boomSound, hitSound, overSound } = useAudio();

  useEffect(() => { phaseRef.current = phase; }, [phase]);

  const resizeCanvas = useCallback(() => {
    const canvas = canvasRef.current;
    const arena = arenaRef.current;
    if (!canvas || !arena) return;
    const rect = arena.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    gs.current.bounds = { w: rect.width, h: rect.height };
  }, []);

  useEffect(() => {
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    return () => window.removeEventListener('resize', resizeCanvas);
  }, [resizeCanvas]);

  const fireBullet = useCallback((state, ts) => {
    if (ts - state.lastShotAt < FIRE_COOLDOWN_MS) return;
    state.lastShotAt = ts;
    const ship = state.ship;
    const noseX = ship.x + Math.cos(ship.angle) * 16;
    const noseY = ship.y + Math.sin(ship.angle) * 16;
    state.bullets.push({
      x: noseX, y: noseY,
      vx: Math.cos(ship.angle) * BULLET_SPEED + ship.vx,
      vy: Math.sin(ship.angle) * BULLET_SPEED + ship.vy,
      life: BULLET_LIFE_MS,
    });
    laserSound();
  }, [laserSound]);

  // Keyboard controls: hold left/right/up to rotate & thrust, Space to fire.
  useEffect(() => {
    const down = (e) => {
      if (phaseRef.current !== 'playing') return;
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') { heldRef.current.left = true; e.preventDefault(); }
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') { heldRef.current.right = true; e.preventDefault(); }
      else if (e.code === 'ArrowUp' || e.code === 'KeyW') { heldRef.current.thrust = true; e.preventDefault(); }
      else if (e.code === 'Space') {
        heldRef.current.fire = true;
        fireBullet(gs.current, performance.now());
        e.preventDefault();
      }
    };
    const up = (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') heldRef.current.left = false;
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') heldRef.current.right = false;
      else if (e.code === 'ArrowUp' || e.code === 'KeyW') heldRef.current.thrust = false;
      else if (e.code === 'Space') heldRef.current.fire = false;
    };
    window.addEventListener('keydown', down, { passive: false });
    window.addEventListener('keyup', up);
    return () => {
      window.removeEventListener('keydown', down);
      window.removeEventListener('keyup', up);
    };
  }, [fireBullet]);

  const setPad = (key, val) => {
    heldRef.current[key] = val;
    setPadState(s => ({ ...s, [key]: val }));
    if (key === 'fire' && val && phaseRef.current === 'playing') {
      fireBullet(gs.current, performance.now());
    }
  };

  const endGame = useCallback(() => {
    gs.current.running = false;
    phaseRef.current = 'over';
    setPhase('over');
    overSound();
    setStatusMsg('Your ship was destroyed.');
  }, [overSound]);

  const tick = useCallback((ts) => {
    const state = gs.current;
    if (!state.running) return;
    if (!lastTsRef.current) lastTsRef.current = ts;
    let dt = (ts - lastTsRef.current) / 1000;
    dt = Math.min(dt, 0.05);
    lastTsRef.current = ts;
    state.elapsed += dt * 1000;

    const { w, h } = state.bounds;
    const ship = state.ship;
    const held = heldRef.current;

    if (comboRef.current > 0 && ts > comboExpireRef.current) {
      comboRef.current = 0;
      setCombo(0);
    }

    if (held.left) ship.angle -= ROT_SPEED * dt;
    if (held.right) ship.angle += ROT_SPEED * dt;
    if (held.thrust) {
      ship.vx += Math.cos(ship.angle) * THRUST_ACCEL * dt;
      ship.vy += Math.sin(ship.angle) * THRUST_ACCEL * dt;
      spawnBurst(state.particles, ship.x - Math.cos(ship.angle) * 14, ship.y - Math.sin(ship.angle) * 14,
        '#5ecfff', 1, 20, 60, 1.5, 3, 220);
    }
    if (held.fire) fireBullet(state, ts);

    const speed = Math.hypot(ship.vx, ship.vy);
    if (speed > MAX_SPEED) { ship.vx = (ship.vx / speed) * MAX_SPEED; ship.vy = (ship.vy / speed) * MAX_SPEED; }
    ship.vx *= (1 - DRAG * dt);
    ship.vy *= (1 - DRAG * dt);
    ship.x = wrap(ship.x + ship.vx * dt, w);
    ship.y = wrap(ship.y + ship.vy * dt, h);

    // spawn asteroids, ramps up over time
    state.spawnTimer -= dt * 1000;
    const targetCount = Math.min(10, 3 + Math.floor(state.elapsed / 9000));
    if (state.spawnTimer <= 0 && state.asteroids.length < targetCount) {
      spawnAsteroid(state, 'large');
      state.spawnTimer = Math.max(500, 2200 - (state.elapsed / 1000) * 8);
    }

    for (const b of state.bullets) {
      b.x += b.vx * dt; b.y += b.vy * dt;
      b.life -= dt * 1000;
    }
    state.bullets = state.bullets.filter(b => b.life > 0 && b.x > -20 && b.x < w + 20 && b.y > -20 && b.y < h + 20);

    let scoreDelta = 0;
    const newAsteroids = [];
    for (let i = state.asteroids.length - 1; i >= 0; i--) {
      const a = state.asteroids[i];
      a.x = wrap(a.x + a.vx * dt, w);
      a.y = wrap(a.y + a.vy * dt, h);
      a.rotAngle += a.rotSpeed * dt;

      let destroyed = false;
      for (let j = state.bullets.length - 1; j >= 0; j--) {
        const b = state.bullets[j];
        if (dist2(a.x, a.y, b.x, b.y) < a.radius * a.radius) {
          state.bullets.splice(j, 1);
          destroyed = true;
          break;
        }
      }

      if (destroyed) {
        state.asteroids.splice(i, 1);
        comboRef.current += 1;
        comboExpireRef.current = ts + COMBO_WINDOW_MS;
        setCombo(comboRef.current);
        const cfg = TIER[a.tier];
        const gained = Math.round(cfg.points * (1 + comboRef.current * 0.15));
        scoreDelta += gained;
        boomSound(a.tier === 'large');
        spawnBurst(state.particles, a.x, a.y, a.tier === 'large' ? '#5ecfff' : a.tier === 'medium' ? '#9d6bff' : '#ff5ee0',
          a.tier === 'large' ? 20 : 12, 40, 180, 2, 5, 500);
        if (cfg.next) {
          for (let k = 0; k < 2; k++) newAsteroids.push({ tier: cfg.next, x: a.x, y: a.y });
        }
        continue;
      }

      const rr = 12 + a.radius * 0.85;
      if (ts >= state.invulnUntil && dist2(a.x, a.y, ship.x, ship.y) < rr * rr) {
        state.invulnUntil = ts + INVULN_MS;
        state.shake = 14;
        comboRef.current = 0;
        setCombo(0);
        livesRef.current -= 1;
        setLives(livesRef.current);
        setHurt(true);
        setTimeout(() => setHurt(false), 400);
        hitSound();
        ship.vx *= 0.3; ship.vy *= 0.3;
        spawnBurst(state.particles, ship.x, ship.y, '#ff4d6d', 18, 60, 220, 2, 6, 550);
        if (livesRef.current <= 0) {
          if (scoreDelta) { scoreRef.current += scoreDelta; scoreDelta = 0; setScore(scoreRef.current); }
          endGame();
          return;
        }
      }
    }

    for (const spec of newAsteroids) spawnAsteroid(state, spec.tier, spec.x, spec.y);

    if (scoreDelta) {
      scoreRef.current += scoreDelta;
      if (scoreRef.current > highScoreRef.current) {
        highScoreRef.current = scoreRef.current;
        localStorage.setItem(HS_KEY, String(scoreRef.current));
        setHighScore(scoreRef.current);
      }
      setScore(scoreRef.current);
    }

    for (let i = state.particles.length - 1; i >= 0; i--) {
      const pt = state.particles[i];
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.vx *= 0.94; pt.vy *= 0.94;
      pt.life -= dt * 1000;
      if (pt.life <= 0) state.particles.splice(i, 1);
    }
    if (state.particles.length > 300) state.particles.splice(0, state.particles.length - 300);
    if (state.asteroids.length > 40) state.asteroids.splice(0, state.asteroids.length - 40);

    if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 40);

    draw(state, ts);
    rafRef.current = requestAnimationFrame(tick);
  }, [endGame, boomSound, hitSound, fireBullet]);

  const draw = (state, ts) => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const { w, h } = state.bounds;
    const ship = state.ship;

    ctx.save();
    if (state.shake > 0) {
      ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
    }

    ctx.fillStyle = 'rgba(6,6,20,0.42)';
    ctx.fillRect(-20, -20, w + 40, h + 40);

    const gridAlpha = 0.04 + Math.sin(state.elapsed / 480) * 0.02;
    ctx.strokeStyle = `rgba(94,207,255,${Math.max(0.012, gridAlpha)})`;
    ctx.lineWidth = 1;
    const gridSize = 44;
    for (let x = 0; x < w; x += gridSize) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
    for (let y = 0; y < h; y += gridSize) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }

    ctx.fillStyle = '#fff59d';
    ctx.shadowColor = '#fff59d';
    ctx.shadowBlur = 8;
    for (const b of state.bullets) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, 2.4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    for (const a of state.asteroids) {
      ctx.save();
      ctx.translate(a.x, a.y);
      ctx.rotate(a.rotAngle);
      ctx.beginPath();
      a.verts.forEach((v, i) => {
        const px = Math.cos(v.a) * v.r, py = Math.sin(v.a) * v.r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      });
      ctx.closePath();
      ctx.fillStyle = 'rgba(20,24,50,0.9)';
      ctx.fill();
      ctx.strokeStyle = a.tier === 'large' ? '#5ecfff' : a.tier === 'medium' ? '#9d6bff' : '#ff5ee0';
      ctx.lineWidth = 2;
      ctx.shadowColor = ctx.strokeStyle;
      ctx.shadowBlur = 10;
      ctx.stroke();
      ctx.restore();
    }
    ctx.shadowBlur = 0;

    for (const pt of state.particles) {
      ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    const invuln = ts < state.invulnUntil;
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.angle);
    if (invuln && Math.floor(ts / 90) % 2 === 0) ctx.globalAlpha = 0.4;
    ctx.beginPath();
    ctx.moveTo(16, 0);
    ctx.lineTo(-11, 9);
    ctx.lineTo(-6, 0);
    ctx.lineTo(-11, -9);
    ctx.closePath();
    const sgrad = ctx.createLinearGradient(-11, 0, 16, 0);
    sgrad.addColorStop(0, '#7a3cff');
    sgrad.addColorStop(1, '#ffffff');
    ctx.fillStyle = sgrad;
    ctx.shadowColor = '#5ecfff';
    ctx.shadowBlur = 18;
    ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    ctx.restore();
  };

  const startGame = () => {
    resizeCanvas();
    const state = makeGameState();
    state.bounds = gs.current.bounds;
    state.ship.x = state.bounds.w / 2;
    state.ship.y = state.bounds.h / 2;
    state.running = true;
    gs.current = state;
    scoreRef.current = 0;
    comboRef.current = 0;
    comboExpireRef.current = 0;
    livesRef.current = LIVES_START;
    lastTsRef.current = 0;
    heldRef.current = { left: false, right: false, thrust: false, fire: false };
    setPadState({ left: false, right: false, thrust: false, fire: false });
    setScore(0);
    setCombo(0);
    setLives(LIVES_START);
    setStatusMsg('Rotate & thrust to fly, fire to blast asteroids into smaller shards.');
    setPhase('playing');
    phaseRef.current = 'playing';
    cancelAnimationFrame(rafRef.current);
    rafRef.current = requestAnimationFrame(tick);
  };

  useEffect(() => () => cancelAnimationFrame(rafRef.current), []);

  const padHandlers = (key) => ({
    onPointerDown: (e) => { e.preventDefault(); setPad(key, true); },
    onPointerUp: (e) => { e.preventDefault(); setPad(key, false); },
    onPointerLeave: () => setPad(key, false),
    onPointerCancel: () => setPad(key, false),
  });

  return (
    <div className="app" data-testid="game-canvas">
      <div className="hud">
        <div className="hudBox">
          <div className="hudLabel">Score</div>
          <div className="hudValue" data-testid="score">{score}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Lives</div>
          <div className={`hudValue lives ${hurt ? 'hurt' : ''}`} data-testid="lives">{'❤'.repeat(Math.max(0, lives))}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Combo</div>
          <div className="hudValue combo" data-testid="combo">x{combo}</div>
        </div>
      </div>

      <div className="title" style={{ marginTop: 36 }}>NOVA PILOT</div>

      <div className="arenaOuter" ref={arenaRef} data-testid="play-field">
        <canvas ref={canvasRef} data-testid="arena" />

        {phase === 'playing' && (
          <div className="controls">
            <div className="padCluster">
              <button className={`padBtn ${padState.left ? 'active' : ''}`} data-testid="rotate-left-btn" {...padHandlers('left')}>◀</button>
              <button className={`padBtn ${padState.right ? 'active' : ''}`} data-testid="rotate-right-btn" {...padHandlers('right')}>▶</button>
              <button className={`padBtn ${padState.thrust ? 'active' : ''}`} data-testid="thrust-btn" {...padHandlers('thrust')}>▲</button>
            </div>
            <div className="padCluster">
              <button className={`fireBtn ${padState.fire ? 'active' : ''}`} data-testid="fire-btn" {...padHandlers('fire')}>FIRE</button>
            </div>
          </div>
        )}

        {phase === 'start' && (
          <div className="overlay">
            <div className="subtitle">Arrow keys / WASD to rotate and thrust (or use the on-screen pad). Space or the FIRE button blasts asteroids apart.<br />Large rocks split into smaller, faster shards — clear them before they clear you.<br />Chain kills fast for a rising combo multiplier!</div>
            <div className="highscoreLine" data-testid="high-score">Best: {highScore}</div>
            <button className="btn" data-testid="start-btn" onClick={startGame}>START</button>
          </div>
        )}

        {phase === 'over' && (
          <div className="overlay">
            <div className="title" style={{ fontSize: 'clamp(20px, 6vw, 30px)' }}>SHIP LOST</div>
            <div className="hudValue" data-testid="final-score">Score: {score}</div>
            <div className="highscoreLine" data-testid="high-score-final">Best: {highScore}</div>
            <button className="btn" data-testid="restart-btn" onClick={startGame}>PLAY AGAIN</button>
          </div>
        )}
      </div>

      <div className="status">{statusMsg}</div>
      <div className="footer">Nova Pilot — rotate, thrust and fire to clear the asteroid field</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
