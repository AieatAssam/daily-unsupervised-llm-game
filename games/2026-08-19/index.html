<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Cipher Cascade</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #020608; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }
  #root { width: 100%; height: 100%; }

  .app {
    width: 100%; height: 100%; position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; overflow: hidden; gap: 6px; padding: 6px 0;
    background: radial-gradient(circle at 50% 0%, #062430 0%, #041018 55%, #010305 100%);
  }

  .hud {
    position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-around;
    padding: 10px 12px; z-index: 15; pointer-events: none;
  }
  .hudBox { text-align: center; }
  .hudLabel { font-size: 10px; letter-spacing: 2px; color: #4de8ff; text-transform: uppercase; }
  .hudValue {
    font-size: 22px; font-weight: 800; color: #fff;
    text-shadow: 0 0 10px #4de8ff, 0 0 20px #4de8ff;
  }
  .hudValue.combo { color: #ffd35e; text-shadow: 0 0 10px #ffd35e, 0 0 22px #e8a800; }
  .hudValue.lives { color: #ff5e8a; text-shadow: 0 0 10px #ff5e8a, 0 0 22px #c9005a; }
  .hudValue.hurt { animation: hurtPulse 0.4s ease; }
  @keyframes hurtPulse { 0%,100% { opacity:1; transform: scale(1);} 50% { opacity:0.4; transform: scale(1.25);} }

  .title {
    font-size: clamp(18px, 5vw, 30px); font-weight: 900; letter-spacing: 3px; margin-top: 34px;
    background: linear-gradient(90deg, #4de8ff, #8affc4, #ffd35e);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(77,232,255,0.6));
    animation: titlePulse 2.4s ease-in-out infinite;
    text-align: center;
  }
  @keyframes titlePulse { 0%,100% { filter: drop-shadow(0 0 12px rgba(77,232,255,0.6)); } 50% { filter: drop-shadow(0 0 26px rgba(77,232,255,0.95)); } }

  .subtitle { color: #b8d8e0; font-size: 13px; letter-spacing: 0.5px; text-align: center; max-width: 380px; line-height: 1.55; }

  .btn {
    padding: 15px 40px; font-size: 19px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(135deg, #1fc9ff, #8affc4);
    border: none; border-radius: 50px; color: #041018; cursor: pointer;
    box-shadow: 0 0 20px rgba(31,201,255,0.7), 0 0 50px rgba(138,255,196,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(31,201,255,0.9), 0 0 70px rgba(138,255,196,0.5); }
  .btn:active { transform: scale(0.96); }

  .highscoreLine { color: #ffd35e; font-size: 14px; text-shadow: 0 0 8px rgba(255,211,94,0.6); }

  .arenaOuter {
    position: relative; width: min(94vw, 640px); height: min(48vh, 380px); z-index: 5;
    border-radius: 18px; overflow: hidden; border: 2px solid rgba(77,232,255,0.25);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 0 30px rgba(77,232,255,0.12);
    background: #041018;
  }

  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .overlay {
    position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 18px;
    background: rgba(2, 8, 12, 0.88); backdrop-filter: blur(4px);
  }

  .status { color: #9fc4d0; font-size: 12px; letter-spacing: 0.5px; height: 15px; z-index: 10; text-align: center; }

  .keypad {
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 7px;
    width: min(94vw, 500px); z-index: 10; padding: 2px 0;
  }
  .key {
    height: 46px; min-height: 44px; border-radius: 10px; border: 1px solid rgba(77,232,255,0.4);
    background: linear-gradient(160deg, rgba(77,232,255,0.16), rgba(4,16,24,0.6));
    color: #dffbff; font-size: 18px; font-weight: 800; letter-spacing: 1px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 0 8px rgba(77,232,255,0.15);
    transition: transform 0.08s ease, background 0.15s ease;
  }
  .key:active, .key.pressed { transform: scale(0.9); background: linear-gradient(160deg, rgba(77,232,255,0.5), rgba(4,16,24,0.6)); }

  .footer { position: relative; text-align: center; color: #35525c; font-size: 10px; z-index: 10; padding-bottom: 2px; }

  @media (max-width: 480px) {
    .hudValue { font-size: 17px; }
    .btn { padding: 13px 30px; font-size: 16px; }
    .subtitle { font-size: 12px; }
    .arenaOuter { height: min(42vh, 380px); }
    .key { height: 44px; font-size: 16px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const HS_KEY = 'cipherCascade_highScore';
const LIVES_START = 3;
const POOL = ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L', 'W'];
const GLYPH_R = 20;

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function useAudio() {
  const ctxRef = useRef(null);
  const getCtx = () => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  };

  const tone = useCallback((freq, duration, type, gainScale, freqEnd) => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + duration);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(gainScale, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.05);
    } catch (e) {}
  }, []);

  const hitSound = useCallback((combo) => tone(480 + combo * 34, 0.14, 'triangle', 0.2, 1100 + combo * 40), [tone]);
  const goldSound = useCallback(() => tone(680, 0.22, 'sine', 0.22, 1500), [tone]);
  const whiffSound = useCallback(() => tone(300, 0.08, 'square', 0.06, 220), [tone]);
  const breachSound = useCallback(() => tone(220, 0.3, 'sawtooth', 0.18, 60), [tone]);
  const overSound = useCallback(() => {
    tone(320, 0.25, 'sawtooth', 0.2, 220);
    setTimeout(() => tone(200, 0.35, 'sawtooth', 0.2, 90), 150);
  }, [tone]);

  return { hitSound, goldSound, whiffSound, breachSound, overSound };
}

function makeGameState() {
  return {
    bounds: { w: 640, h: 380 },
    dangerY: 320,
    glyphs: [],
    particles: [],
    spawnTimer: 400,
    elapsed: 0,
    shake: 0,
    running: false,
    nextId: 1,
  };
}

function spawnGlyph(state) {
  const { w } = state.bounds;
  const margin = GLYPH_R + 10;
  const gold = Math.random() < 0.12;
  const speedBase = 42 + Math.min(70, state.elapsed / 900);
  state.glyphs.push({
    id: state.nextId++,
    char: POOL[Math.floor(Math.random() * POOL.length)],
    x: margin + Math.random() * (w - margin * 2),
    y: -GLYPH_R,
    speed: speedBase + Math.random() * 24,
    gold,
    r: GLYPH_R,
    spin: Math.random() * Math.PI * 2,
  });
}

function spawnBurst(arr, x, y, color, count, speedMin, speedMax, sizeMin, sizeMax, lifeMs) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = speedMin + Math.random() * (speedMax - speedMin);
    arr.push({
      x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      life: lifeMs, maxLife: lifeMs, color,
      size: sizeMin + Math.random() * (sizeMax - sizeMin),
    });
  }
}

function App() {
  const [phase, setPhase] = useState('start'); // start | playing | over
  const [score, setScore] = useState(0);
  const [lives, setLives] = useState(LIVES_START);
  const [combo, setCombo] = useState(0);
  const [hurt, setHurt] = useState(false);
  const [pressedKey, setPressedKey] = useState(null);
  const [highScore, setHighScore] = useState(() => parseInt(localStorage.getItem(HS_KEY) || '0', 10));
  const [statusMsg, setStatusMsg] = useState('Type the falling glyphs before they hit the red line.');

  const canvasRef = useRef(null);
  const arenaRef = useRef(null);
  const gs = useRef(makeGameState());
  const rafRef = useRef(null);
  const lastTsRef = useRef(0);
  const scoreRef = useRef(0);
  const comboRef = useRef(0);
  const livesRef = useRef(LIVES_START);
  const hitsRef = useRef(0);
  const highScoreRef = useRef(highScore);
  const phaseRef = useRef('start');
  const { hitSound, goldSound, whiffSound, breachSound, overSound } = useAudio();

  useEffect(() => { phaseRef.current = phase; }, [phase]);

  const resizeCanvas = useCallback(() => {
    const canvas = canvasRef.current;
    const arena = arenaRef.current;
    if (!canvas || !arena) return;
    const rect = arena.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    gs.current.bounds = { w: rect.width, h: rect.height };
    gs.current.dangerY = rect.height * 0.84;
  }, []);

  useEffect(() => {
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    return () => window.removeEventListener('resize', resizeCanvas);
  }, [resizeCanvas]);

  const endGame = useCallback(() => {
    gs.current.running = false;
    phaseRef.current = 'over';
    setPhase('over');
    overSound();
    setStatusMsg('The cascade overwhelmed you.');
  }, [overSound]);

  const registerBreach = useCallback((state) => {
    comboRef.current = 0;
    setCombo(0);
    livesRef.current -= 1;
    setLives(livesRef.current);
    setHurt(true);
    setTimeout(() => setHurt(false), 400);
    state.shake = 9;
    breachSound();
    if (livesRef.current <= 0) { endGame(); return; }
    setStatusMsg('Glyph breached the line! Type faster.');
  }, [breachSound, endGame]);

  const registerHit = useCallback((state, glyph) => {
    hitsRef.current += 1;
    comboRef.current += 1;
    setCombo(comboRef.current);
    const gained = (glyph.gold ? 300 : 100) + (comboRef.current - 1) * 20;
    scoreRef.current += gained;
    setScore(scoreRef.current);
    if (scoreRef.current > highScoreRef.current) {
      highScoreRef.current = scoreRef.current;
      localStorage.setItem(HS_KEY, String(scoreRef.current));
      setHighScore(scoreRef.current);
    }
    if (glyph.gold) { goldSound(); spawnBurst(state.particles, glyph.x, glyph.y, '#ffd35e', 28, 50, 210, 2, 6, 620); }
    else { hitSound(comboRef.current); spawnBurst(state.particles, glyph.x, glyph.y, '#4de8ff', 20, 40, 180, 2, 5, 520); }
    setStatusMsg(`Combo x${comboRef.current}! Keep the cascade clear.`);
  }, [hitSound, goldSound]);

  const registerWhiff = useCallback(() => {
    if (comboRef.current > 0) { comboRef.current = 0; setCombo(0); }
    whiffSound();
  }, [whiffSound]);

  const handleChar = useCallback((rawChar) => {
    if (phaseRef.current !== 'playing') return;
    const char = String(rawChar || '').toUpperCase();
    if (!POOL.includes(char)) return;
    const state = gs.current;
    let best = null;
    for (const g of state.glyphs) {
      if (g.char === char && (!best || g.y > best.y)) best = g;
    }
    if (best) {
      state.glyphs = state.glyphs.filter(g => g.id !== best.id);
      registerHit(state, best);
    } else {
      registerWhiff();
    }
    setPressedKey(char);
    setTimeout(() => setPressedKey(c => (c === char ? null : c)), 140);
  }, [registerHit, registerWhiff]);

  useEffect(() => {
    const onKeyDown = (e) => {
      if (e.key && e.key.length === 1) handleChar(e.key);
    };
    window.addEventListener('keydown', onKeyDown);
    return () => window.removeEventListener('keydown', onKeyDown);
  }, [handleChar]);

  const tick = useCallback((ts) => {
    const state = gs.current;
    if (!lastTsRef.current) lastTsRef.current = ts;
    let dt = (ts - lastTsRef.current) / 1000;
    dt = Math.min(dt, 0.05);
    lastTsRef.current = ts;
    state.elapsed += dt * 1000;

    if (phaseRef.current === 'playing') {
      state.spawnTimer -= dt * 1000;
      const interval = Math.max(560 - state.elapsed / 60, 240);
      if (state.spawnTimer <= 0) {
        spawnGlyph(state);
        state.spawnTimer = interval + Math.random() * 200;
      }

      const survivors = [];
      for (const g of state.glyphs) {
        g.y += g.speed * dt;
        g.spin += dt * 1.4;
        if (g.y >= state.dangerY) {
          registerBreach(state);
        } else {
          survivors.push(g);
        }
      }
      state.glyphs = survivors;
    }

    for (let i = state.particles.length - 1; i >= 0; i--) {
      const pt = state.particles[i];
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.vx *= 0.94; pt.vy *= 0.94;
      pt.life -= dt * 1000;
      if (pt.life <= 0) state.particles.splice(i, 1);
    }
    if (state.particles.length > 260) state.particles.splice(0, state.particles.length - 260);

    if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 40);

    draw(state, ts);
    rafRef.current = requestAnimationFrame(tick);
  }, [registerBreach]);

  const draw = (state, ts) => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const { w, h } = state.bounds;

    ctx.save();
    if (state.shake > 0) {
      ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
    }

    ctx.fillStyle = 'rgba(2,8,12,0.34)';
    ctx.fillRect(-20, -20, w + 40, h + 40);

    const grad = ctx.createRadialGradient(w * 0.5, h * 0.1, 10, w * 0.5, h * 0.1, Math.max(w, h) * 0.8);
    grad.addColorStop(0, `hsla(${190 + Math.sin(ts / 3000) * 20}, 70%, 14%, 0.35)`);
    grad.addColorStop(1, 'rgba(1,3,5,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    // drifting data-rain backdrop
    ctx.fillStyle = 'rgba(120,220,255,0.35)';
    for (let i = 0; i < 34; i++) {
      const sx = (i * 91.7) % w;
      const sy = (i * 53.3 + (ts * 0.05)) % h;
      ctx.globalAlpha = 0.1 + 0.1 * Math.sin(ts / 500 + i);
      ctx.fillRect(sx, sy, 1.5, 6);
    }
    ctx.globalAlpha = 1;

    // danger line
    ctx.save();
    ctx.strokeStyle = `rgba(255,94,138,${0.55 + Math.sin(ts / 220) * 0.2})`;
    ctx.shadowColor = '#ff5e8a';
    ctx.shadowBlur = 12;
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 8]);
    ctx.beginPath();
    ctx.moveTo(0, state.dangerY);
    ctx.lineTo(w, state.dangerY);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    // glyphs
    for (const g of state.glyphs) {
      ctx.save();
      ctx.translate(g.x, g.y);
      ctx.rotate(Math.sin(g.spin) * 0.08);
      const hue = g.gold ? 42 : 190;
      const glow = g.gold ? '#ffd35e' : '#4de8ff';
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const ang = (Math.PI / 3) * i - Math.PI / 6;
        const px = Math.cos(ang) * g.r, py = Math.sin(ang) * g.r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      const fillGrad = ctx.createRadialGradient(0, 0, 1, 0, 0, g.r);
      fillGrad.addColorStop(0, `hsla(${hue}, 90%, 22%, 0.9)`);
      fillGrad.addColorStop(1, `hsla(${hue}, 90%, 45%, 0.55)`);
      ctx.fillStyle = fillGrad;
      ctx.strokeStyle = glow;
      ctx.shadowColor = glow;
      ctx.shadowBlur = g.gold ? 18 : 12;
      ctx.lineWidth = 2;
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.font = '800 18px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(g.char, 0, 1);
      ctx.restore();
    }

    // particles
    for (const pt of state.particles) {
      ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.restore();
  };

  const startGame = () => {
    resizeCanvas();
    const state = makeGameState();
    state.bounds = gs.current.bounds;
    state.dangerY = gs.current.dangerY;
    state.running = true;
    gs.current = state;
    scoreRef.current = 0;
    comboRef.current = 0;
    livesRef.current = LIVES_START;
    hitsRef.current = 0;
    lastTsRef.current = 0;
    setScore(0);
    setCombo(0);
    setLives(LIVES_START);
    setStatusMsg('Type the falling glyphs before they hit the red line.');
    setPhase('playing');
    phaseRef.current = 'playing';
    cancelAnimationFrame(rafRef.current);
    rafRef.current = requestAnimationFrame(tick);
  };

  useEffect(() => () => cancelAnimationFrame(rafRef.current), []);

  return (
    <div className="app" data-testid="game-canvas">
      <div className="hud">
        <div className="hudBox">
          <div className="hudLabel">Score</div>
          <div className="hudValue" data-testid="score">{score}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Lives</div>
          <div className={`hudValue lives ${hurt ? 'hurt' : ''}`} data-testid="lives">{'❤'.repeat(Math.max(0, lives))}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Combo</div>
          <div className="hudValue combo" data-testid="combo">x{combo}</div>
        </div>
      </div>

      <div className="title">CIPHER CASCADE</div>

      <div className="arenaOuter" ref={arenaRef} data-testid="play-field">
        <canvas ref={canvasRef} data-testid="arena" />

        {phase === 'start' && (
          <div className="overlay">
            <div className="subtitle">Neon glyphs fall from above. Type the matching letter on your keyboard&mdash;or tap it below&mdash;before it crosses the red line.<br />Gold glyphs are worth triple. Chain hits for a rising combo. Three breaches and the cascade wins.</div>
            <div className="highscoreLine" data-testid="high-score">Best: {highScore}</div>
            <button className="btn" data-testid="start-btn" onClick={startGame}>START</button>
          </div>
        )}

        {phase === 'over' && (
          <div className="overlay">
            <div className="title" style={{ fontSize: 'clamp(20px, 6vw, 30px)', marginTop: 0 }}>CASCADE FAILED</div>
            <div className="hudValue" data-testid="final-score">Score: {score}</div>
            <div className="highscoreLine" data-testid="high-score-final">Best: {highScore}</div>
            <button className="btn" data-testid="restart-btn" onClick={startGame}>PLAY AGAIN</button>
          </div>
        )}
      </div>

      {phase === 'playing' && (
        <div className="keypad" data-testid="keypad">
          {POOL.map((k) => (
            <button
              key={k}
              className={`key ${pressedKey === k ? 'pressed' : ''}`}
              data-testid={`key-${k}`}
              onClick={() => handleChar(k)}
            >
              {k}
            </button>
          ))}
        </div>
      )}

      <div className="status">{statusMsg}</div>
      <div className="footer">Cipher Cascade — type or tap the falling glyphs before they breach</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
