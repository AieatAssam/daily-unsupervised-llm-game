<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Wire Snap</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #04030a; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }
  #root { width: 100%; height: 100%; }

  .app {
    width: 100%; height: 100%; position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; overflow: hidden; gap: 6px; padding: 6px 0;
    background: radial-gradient(circle at 50% 8%, #0a1a1f 0%, #05080f 55%, #020207 100%);
  }

  .hud {
    position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-around;
    padding: 10px 12px; z-index: 15; pointer-events: none;
  }
  .hudBox { text-align: center; }
  .hudLabel { font-size: 10px; letter-spacing: 2px; color: #6dffe0; text-transform: uppercase; }
  .hudValue {
    font-size: 22px; font-weight: 800; color: #fff;
    text-shadow: 0 0 10px #6dffe0, 0 0 20px #6dffe0;
  }
  .hudValue.combo { color: #ffd23d; text-shadow: 0 0 10px #ffd23d, 0 0 22px #b3860a; }
  .hudValue.lives { color: #ff5e6c; text-shadow: 0 0 10px #ff5e6c, 0 0 22px #c90022; }
  .hudValue.hurt { animation: hurtPulse 0.4s ease; }
  @keyframes hurtPulse { 0%,100% { opacity:1; transform: scale(1);} 50% { opacity:0.4; transform: scale(1.25);} }

  .title {
    font-size: clamp(18px, 5vw, 30px); font-weight: 900; letter-spacing: 3px; margin-top: 34px;
    background: linear-gradient(90deg, #6dffe0, #4de8ff, #ffd23d);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(109,255,224,0.6));
    animation: titlePulse 2.4s ease-in-out infinite;
    text-align: center;
  }
  @keyframes titlePulse { 0%,100% { filter: drop-shadow(0 0 12px rgba(109,255,224,0.6)); } 50% { filter: drop-shadow(0 0 26px rgba(77,232,255,0.85)); } }

  .subtitle { color: #b8c8d0; font-size: 13px; letter-spacing: 0.5px; text-align: center; max-width: 460px; line-height: 1.55; }

  .btn {
    padding: 15px 40px; font-size: 19px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(135deg, #6dffe0, #4de8ff);
    border: none; border-radius: 50px; color: #021014; cursor: pointer;
    box-shadow: 0 0 20px rgba(109,255,224,0.7), 0 0 50px rgba(77,232,255,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(109,255,224,0.9), 0 0 70px rgba(77,232,255,0.5); }
  .btn:active { transform: scale(0.96); }

  .highscoreLine { color: #ffd23d; font-size: 14px; text-shadow: 0 0 8px rgba(255,210,61,0.6); }

  .instructionBar {
    display: flex; align-items: center; justify-content: center; z-index: 12;
    margin-top: 46px; min-height: 26px; padding: 0 12px;
  }
  .instructionLabel {
    font-size: 10px; letter-spacing: 2px; color: #7a92a0; text-transform: uppercase; margin-right: 6px;
  }
  .instructionText {
    font-size: 15px; font-weight: 800; letter-spacing: 1px; color: #fff;
    text-shadow: 0 0 8px #6dffe0, 0 0 16px rgba(109,255,224,0.5);
  }

  .boardOuter {
    position: relative; width: min(90vw, 420px); height: min(56vh, 420px); z-index: 5;
    border-radius: 18px; overflow: hidden; border: 2px solid rgba(109,255,224,0.25);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 0 30px rgba(109,255,224,0.12);
    background: #05080d; touch-action: none; margin-top: 4px;
  }
  .boardOuter.shakeIt { animation: shakeKf 0.3s ease; }
  @keyframes shakeKf {
    0%, 100% { transform: translate(0,0); }
    20% { transform: translate(-6px, 3px); }
    40% { transform: translate(6px, -3px); }
    60% { transform: translate(-5px, -2px); }
    80% { transform: translate(5px, 2px); }
  }

  canvas.gameCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .flashOverlay {
    position: absolute; inset: 0; z-index: 9; pointer-events: none; background: rgba(255,46,79,0);
  }
  .flashOverlay.on { animation: flashKf 0.3s ease; }
  @keyframes flashKf { 0% { background: rgba(255,46,79,0.35); } 100% { background: rgba(255,46,79,0); } }

  .cutOverlay {
    position: absolute; inset: 0; z-index: 9; pointer-events: none; background: rgba(255,255,255,0);
  }
  .cutOverlay.on { animation: cutKf 0.3s ease; }
  @keyframes cutKf { 0% { background: rgba(109,255,224,0.28); } 100% { background: rgba(109,255,224,0); } }

  .overlay {
    position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 18px;
    background: rgba(5, 8, 13, 0.92); backdrop-filter: blur(4px);
  }

  .wireBtnRow {
    position: absolute; inset: 0; display: flex; z-index: 7;
  }
  .wireBtn {
    flex: 1; height: 100%; border: none; background: transparent; cursor: pointer;
    -webkit-appearance: none; appearance: none; padding: 0;
  }
  .wireBtn:active { background: rgba(255,255,255,0.06); }

  .status { color: #9aa8b3; font-size: 12px; letter-spacing: 0.5px; height: 15px; z-index: 10; text-align: center; }
  .footer { position: relative; text-align: center; color: #171d20; font-size: 10px; z-index: 10; padding-bottom: 2px; }

  @media (max-width: 480px) {
    .hudValue { font-size: 17px; }
    .btn { padding: 13px 30px; font-size: 16px; }
    .subtitle { font-size: 12px; }
    .boardOuter { height: min(50vh, 380px); }
    .instructionBar { margin-top: 40px; }
    .instructionText { font-size: 13px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const HS_KEY = 'wireSnapHighScore';
const LIVES_START = 3;
const COLOR_KEYS = ['RED', 'BLU', 'GRN', 'YEL', 'PUR'];
const COLOR_HEX = { RED: '#ff3a5e', BLU: '#4de8ff', GRN: '#39ff88', YEL: '#ffd23d', PUR: '#c86bff' };
const COLOR_NAME = { RED: 'RED', BLU: 'BLUE', GRN: 'GREEN', YEL: 'YELLOW', PUR: 'PURPLE' };
const ORDINALS = ['1ST', '2ND', '3RD', '4TH'];

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function useAudio() {
  const ctxRef = useRef(null);
  const getCtx = () => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  };

  const tone = useCallback((freq, duration, type, gainScale, freqEnd) => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + duration);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(gainScale, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.05);
    } catch (e) {}
  }, []);

  const snipSound = useCallback(() => tone(680, 0.09, 'square', 0.13, 240), [tone]);
  const successSound = useCallback(() => { tone(660, 0.1, 'sine', 0.16, 990); setTimeout(() => tone(990, 0.14, 'sine', 0.14, 1400), 80); }, [tone]);
  const zapSound = useCallback(() => tone(140, 0.35, 'sawtooth', 0.22, 40), [tone]);
  const overSound = useCallback(() => { tone(300, 0.25, 'sawtooth', 0.2, 200); setTimeout(() => tone(180, 0.35, 'sawtooth', 0.2, 80), 150); }, [tone]);
  const levelSound = useCallback(() => { tone(500, 0.1, 'square', 0.1, 900); setTimeout(() => tone(750, 0.12, 'square', 0.1, 1200), 90); }, [tone]);

  return { snipSound, successSound, zapSound, overSound, levelSound };
}

function spawnBurst(arr, x, y, color, count, speedMin, speedMax, sizeMin, sizeMax, lifeMs) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = speedMin + Math.random() * (speedMax - speedMin);
    arr.push({
      x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      life: lifeMs, maxLife: lifeMs, color,
      size: sizeMin + Math.random() * (sizeMax - sizeMin),
    });
  }
}

function wireCount(level) { return clamp(4 + Math.floor(level / 2), 4, 7); }
function timeLimitMs(level) { return clamp(6200 - level * 280, 2400, 6200); }

function ruleTypesForLevel(level) {
  const types = ['color', 'position'];
  if (level >= 2) types.push('nth-color');
  if (level >= 3) types.push('odd-one-out');
  return types;
}

function generateRound(level) {
  const n = wireCount(level);
  const type = pick(ruleTypesForLevel(level));
  let wires = [];
  let targetIndex = 0;
  let instruction = '';

  if (type === 'color') {
    const targetColor = pick(COLOR_KEYS);
    targetIndex = Math.floor(Math.random() * n);
    for (let i = 0; i < n; i++) {
      if (i === targetIndex) { wires.push(targetColor); continue; }
      let c;
      do { c = pick(COLOR_KEYS); } while (c === targetColor);
      wires.push(c);
    }
    instruction = `CUT THE ${COLOR_NAME[targetColor]} WIRE`;
  } else if (type === 'position') {
    targetIndex = Math.floor(Math.random() * n);
    for (let i = 0; i < n; i++) wires.push(pick(COLOR_KEYS));
    instruction = `CUT WIRE #${targetIndex + 1}`;
  } else if (type === 'nth-color') {
    const targetColor = pick(COLOR_KEYS);
    const maxOccur = Math.min(3, n - 1);
    const occur = 1 + Math.floor(Math.random() * maxOccur);
    const nth = 1 + Math.floor(Math.random() * occur);
    const positions = Array.from({ length: n }, (_, i) => i).sort(() => Math.random() - 0.5).slice(0, occur).sort((a, b) => a - b);
    wires = Array.from({ length: n }, () => {
      let c;
      do { c = pick(COLOR_KEYS); } while (c === targetColor);
      return c;
    });
    positions.forEach((p) => { wires[p] = targetColor; });
    targetIndex = positions[nth - 1];
    instruction = `CUT THE ${ORDINALS[nth - 1] || nth + 'TH'} ${COLOR_NAME[targetColor]} WIRE`;
  } else {
    const commonColor = pick(COLOR_KEYS);
    let uniqueColor;
    do { uniqueColor = pick(COLOR_KEYS); } while (uniqueColor === commonColor);
    targetIndex = Math.floor(Math.random() * n);
    for (let i = 0; i < n; i++) wires.push(i === targetIndex ? uniqueColor : commonColor);
    instruction = 'CUT THE ODD WIRE OUT';
  }

  return { wires, targetIndex, instruction, timeLimit: timeLimitMs(level) };
}

function App() {
  const [phase, setPhase] = useState('start'); // start | playing | over
  const [score, setScore] = useState(0);
  const [lives, setLives] = useState(LIVES_START);
  const [combo, setCombo] = useState(0);
  const [level, setLevel] = useState(1);
  const [hurt, setHurt] = useState(false);
  const [shakeIt, setShakeIt] = useState(false);
  const [flashOn, setFlashOn] = useState(false);
  const [cutOn, setCutOn] = useState(false);
  const [instruction, setInstruction] = useState('');
  const [wireVisual, setWireVisual] = useState([]);
  const [highScore, setHighScore] = useState(() => parseInt(localStorage.getItem(HS_KEY) || '0', 10));
  const [statusMsg, setStatusMsg] = useState('Read the call. Snip fast.');

  const canvasRef = useRef(null);
  const boardRef = useRef(null);
  const particlesRef = useRef([]);
  const scoreRef = useRef(0);
  const comboRef = useRef(0);
  const livesRef = useRef(LIVES_START);
  const levelRef = useRef(1);
  const bankedCountRef = useRef(0);
  const highScoreRef = useRef(highScore);
  const phaseRef = useRef('start');
  const dimsRef = useRef({ w: 300, h: 300 });
  const roundRef = useRef({ wires: ['RED', 'BLU', 'GRN', 'YEL'], targetIndex: 0, instruction: '', timeLimit: 6000 });
  const roundStartRef = useRef(0);
  const cursorRef = useRef(0);
  const cutIndexRef = useRef(-1);
  const resolvingRef = useRef(false);
  const rafRef = useRef(null);
  const lastTsRef = useRef(null);
  const timeRef = useRef(0);
  const ambientTimeRef = useRef(0);
  const hurtTimeoutRef = useRef(null);
  const shakeTimeoutRef = useRef(null);
  const flashTimeoutRef = useRef(null);
  const cutTimeoutRef = useRef(null);
  const nextRoundTimeoutRef = useRef(null);

  const { snipSound, successSound, zapSound, overSound, levelSound } = useAudio();

  useEffect(() => { phaseRef.current = phase; }, [phase]);

  const resizeCanvas = useCallback(() => {
    const canvas = canvasRef.current;
    const board = boardRef.current;
    if (!canvas || !board) return;
    const rect = board.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dimsRef.current = { w: rect.width, h: rect.height };
  }, []);

  useEffect(() => {
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    return () => window.removeEventListener('resize', resizeCanvas);
  }, [resizeCanvas]);

  const endGame = useCallback(() => {
    phaseRef.current = 'over';
    setPhase('over');
    overSound();
    setStatusMsg('Board fried.');
  }, [overSound]);

  const triggerHit = useCallback(() => {
    setHurt(true);
    clearTimeout(hurtTimeoutRef.current);
    hurtTimeoutRef.current = setTimeout(() => setHurt(false), 400);
    setShakeIt(true);
    clearTimeout(shakeTimeoutRef.current);
    shakeTimeoutRef.current = setTimeout(() => setShakeIt(false), 300);
    setFlashOn(true);
    clearTimeout(flashTimeoutRef.current);
    flashTimeoutRef.current = setTimeout(() => setFlashOn(false), 300);
  }, []);

  const triggerCut = useCallback(() => {
    setCutOn(true);
    clearTimeout(cutTimeoutRef.current);
    cutTimeoutRef.current = setTimeout(() => setCutOn(false), 350);
  }, []);

  const startRound = useCallback((lvl) => {
    const r = generateRound(lvl);
    roundRef.current = r;
    roundStartRef.current = timeRef.current;
    cutIndexRef.current = -1;
    resolvingRef.current = false;
    cursorRef.current = 0;
    setInstruction(r.instruction);
    setWireVisual(r.wires.map((c) => ({ color: c, cut: false })));
  }, []);

  const resolveRound = useCallback((chosenIndex) => {
    if (phaseRef.current !== 'playing' || resolvingRef.current) return;
    resolvingRef.current = true;
    const r = roundRef.current;
    const { w, h } = dimsRef.current;
    const laneW = w / r.wires.length;
    const px = laneW * (chosenIndex + 0.5);
    const py = h * 0.5;
    cutIndexRef.current = chosenIndex;
    setWireVisual((prev) => prev.map((wv, i) => (i === chosenIndex ? { ...wv, cut: true } : wv)));

    if (chosenIndex === r.targetIndex) {
      comboRef.current += 1;
      setCombo(comboRef.current);
      const gained = 10 + comboRef.current * 3;
      scoreRef.current += gained;
      setScore(scoreRef.current);
      successSound();
      triggerCut();
      spawnBurst(particlesRef.current, px, py, '#6dffe0', 16, 40, 170, 1.8, 4.5, 460);
      if (scoreRef.current > highScoreRef.current) {
        highScoreRef.current = scoreRef.current;
        localStorage.setItem(HS_KEY, String(scoreRef.current));
        setHighScore(scoreRef.current);
      }
      bankedCountRef.current += 1;
      const newLevel = Math.floor(bankedCountRef.current / 5) + 1;
      if (newLevel !== levelRef.current) {
        levelRef.current = newLevel;
        setLevel(newLevel);
        levelSound();
        setStatusMsg(`Level ${newLevel}! More wires, less time.`);
      } else {
        setStatusMsg('Clean snip.');
      }
    } else {
      comboRef.current = 0;
      setCombo(0);
      livesRef.current -= 1;
      setLives(livesRef.current);
      triggerHit();
      zapSound();
      spawnBurst(particlesRef.current, px, py, '#ff3a5e', 20, 50, 200, 2, 5.5, 480);
      if (livesRef.current <= 0) {
        setStatusMsg('Wrong wire!');
        clearTimeout(nextRoundTimeoutRef.current);
        nextRoundTimeoutRef.current = setTimeout(() => endGame(), 400);
        return;
      } else {
        setStatusMsg('Wrong wire! Reset.');
      }
    }

    clearTimeout(nextRoundTimeoutRef.current);
    nextRoundTimeoutRef.current = setTimeout(() => {
      if (phaseRef.current === 'playing') startRound(levelRef.current);
    }, 500);
  }, [successSound, zapSound, triggerHit, triggerCut, endGame, levelSound, startRound]);

  const handleTimeout = useCallback(() => {
    if (phaseRef.current !== 'playing' || resolvingRef.current) return;
    resolvingRef.current = true;
    comboRef.current = 0;
    setCombo(0);
    livesRef.current -= 1;
    setLives(livesRef.current);
    triggerHit();
    zapSound();
    if (livesRef.current <= 0) {
      setStatusMsg('Out of time!');
      clearTimeout(nextRoundTimeoutRef.current);
      nextRoundTimeoutRef.current = setTimeout(() => endGame(), 300);
      return;
    } else {
      setStatusMsg('Out of time! Reset.');
    }
    clearTimeout(nextRoundTimeoutRef.current);
    nextRoundTimeoutRef.current = setTimeout(() => {
      if (phaseRef.current === 'playing') startRound(levelRef.current);
    }, 500);
  }, [triggerHit, zapSound, endGame, startRound]);

  const resetGame = useCallback(() => {
    scoreRef.current = 0; setScore(0);
    comboRef.current = 0; setCombo(0);
    livesRef.current = LIVES_START; setLives(LIVES_START);
    levelRef.current = 1; setLevel(1);
    bankedCountRef.current = 0;
    particlesRef.current = [];
    timeRef.current = 0;
    startRound(1);
  }, [startRound]);

  const startGame = useCallback(() => {
    resizeCanvas();
    resetGame();
    setStatusMsg('Read the call. Snip fast.');
    phaseRef.current = 'playing';
    setPhase('playing');
  }, [resizeCanvas, resetGame]);

  const startGameRef = useRef(null);
  useEffect(() => { startGameRef.current = startGame; }, [startGame]);

  const cutWire = useCallback((index) => {
    if (phaseRef.current !== 'playing') return;
    const r = roundRef.current;
    if (index < 0 || index >= r.wires.length) return;
    resolveRound(index);
  }, [resolveRound]);

  const moveCursor = useCallback((delta) => {
    if (phaseRef.current !== 'playing') return;
    const n = roundRef.current.wires.length;
    cursorRef.current = ((cursorRef.current + delta) % n + n) % n;
  }, []);

  useEffect(() => {
    const onKeyDown = (e) => {
      if (phaseRef.current !== 'playing') {
        if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); startGameRef.current && startGameRef.current(); }
        return;
      }
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); moveCursor(-1); }
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); moveCursor(1); }
      else if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); cutWire(cursorRef.current); }
      else if (/^Digit[1-9]$/.test(e.code)) { e.preventDefault(); cutWire(parseInt(e.code.slice(5), 10) - 1); }
    };
    window.addEventListener('keydown', onKeyDown);
    return () => window.removeEventListener('keydown', onKeyDown);
  }, [moveCursor, cutWire]);

  useEffect(() => () => {
    clearTimeout(hurtTimeoutRef.current);
    clearTimeout(shakeTimeoutRef.current);
    clearTimeout(flashTimeoutRef.current);
    clearTimeout(cutTimeoutRef.current);
    clearTimeout(nextRoundTimeoutRef.current);
  }, []);

  // Main loop: fuse countdown, particles, drawing
  useEffect(() => {
    const loop = (ts) => {
      const canvas = canvasRef.current;
      if (canvas) {
        const ctx = canvas.getContext('2d');
        const { w, h } = dimsRef.current;

        if (lastTsRef.current == null) lastTsRef.current = ts;
        let dt = (ts - lastTsRef.current) / 1000;
        lastTsRef.current = ts;
        dt = clamp(dt, 0, 0.033);

        if (phaseRef.current === 'playing') timeRef.current += dt * 1000;
        ambientTimeRef.current += dt * 1000;

        if (w > 10 && h > 10) {
          if (phaseRef.current === 'playing' && !resolvingRef.current) {
            const r = roundRef.current;
            const elapsed = timeRef.current - roundStartRef.current;
            if (elapsed >= r.timeLimit) handleTimeout();
          }

          particlesRef.current = particlesRef.current.filter((p) => p.life > 0);
          for (const p of particlesRef.current) {
            p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; p.life -= dt * 1000;
          }

          ctx.clearRect(0, 0, w, h);
          ctx.fillStyle = '#05080d';
          ctx.fillRect(0, 0, w, h);

          // ambient scanline sweep — keeps the board visibly alive even when idle
          const sweepY = ((ambientTimeRef.current / 6) % (h + 60)) - 30;
          const sweepGrad = ctx.createLinearGradient(0, sweepY - 30, 0, sweepY + 30);
          sweepGrad.addColorStop(0, 'rgba(109,255,224,0)');
          sweepGrad.addColorStop(0.5, 'rgba(109,255,224,0.06)');
          sweepGrad.addColorStop(1, 'rgba(109,255,224,0)');
          ctx.fillStyle = sweepGrad;
          ctx.fillRect(0, sweepY - 30, w, 60);

          const r = roundRef.current;
          const n = Math.max(1, r.wires.length);
          const laneW = w / n;
          const elapsed = clamp(timeRef.current - roundStartRef.current, 0, r.timeLimit);
          const remainFrac = 1 - elapsed / r.timeLimit;

          // fuse bar
          ctx.save();
          const fuseH = 8;
          ctx.fillStyle = 'rgba(255,255,255,0.08)';
          ctx.fillRect(0, 0, w, fuseH);
          const fuseColor = remainFrac < 0.25 ? '#ff3a5e' : (remainFrac < 0.5 ? '#ffd23d' : '#6dffe0');
          ctx.fillStyle = fuseColor;
          ctx.shadowColor = fuseColor;
          ctx.shadowBlur = 10;
          ctx.fillRect(0, 0, w * clamp(remainFrac, 0, 1), fuseH);
          ctx.restore();

          for (let i = 0; i < n; i++) {
            const cx = laneW * (i + 0.5);
            const color = COLOR_HEX[r.wires[i]];
            const isCut = cutIndexRef.current === i;
            const isCursor = phaseRef.current === 'playing' && cursorRef.current === i && !resolvingRef.current;
            const wireW = Math.min(laneW * 0.4, 26);

            ctx.save();
            if (isCursor) {
              ctx.strokeStyle = 'rgba(255,255,255,0.5)';
              ctx.lineWidth = 2;
              ctx.strokeRect(laneW * i + 3, fuseH + 6, laneW - 6, h - fuseH - 12);
            }

            ctx.strokeStyle = color;
            ctx.lineWidth = wireW;
            ctx.lineCap = 'round';
            ctx.shadowColor = color;
            ctx.shadowBlur = 14;

            const topY = fuseH + 26;
            const botY = h - 26;
            if (isCut) {
              const gap = 22;
              const midY = (topY + botY) / 2;
              ctx.beginPath(); ctx.moveTo(cx, topY); ctx.lineTo(cx, midY - gap); ctx.stroke();
              ctx.beginPath(); ctx.moveTo(cx, midY + gap); ctx.lineTo(cx, botY); ctx.stroke();
            } else {
              ctx.beginPath(); ctx.moveTo(cx, topY); ctx.lineTo(cx, botY); ctx.stroke();
              ctx.strokeStyle = 'rgba(255,255,255,0.5)';
              ctx.lineWidth = 1.5;
              ctx.shadowBlur = 0;
              for (let s = 0; s < 4; s++) {
                const sy = topY + ((botY - topY) / 5) * (s + 1);
                ctx.beginPath(); ctx.moveTo(cx - wireW * 0.4, sy); ctx.lineTo(cx + wireW * 0.4, sy); ctx.stroke();
              }
            }
            ctx.restore();

            ctx.save();
            ctx.font = '700 11px system-ui, sans-serif';
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.textAlign = 'center';
            ctx.fillText(String(i + 1), cx, h - 8);
            ctx.restore();
          }

          for (const p of particlesRef.current) {
            const a = clamp(p.life / p.maxLife, 0, 1);
            ctx.save();
            ctx.globalAlpha = a;
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
          }
        }
      }
      rafRef.current = requestAnimationFrame(loop);
    };
    rafRef.current = requestAnimationFrame(loop);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [handleTimeout]);

  const wires = wireVisual.length ? wireVisual : roundRef.current.wires.map((c) => ({ color: c, cut: false }));

  return (
    <div className="app">
      <div className="hud">
        <div className="hudBox">
          <div className="hudLabel">Score</div>
          <div className="hudValue" data-testid="score">{score}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Combo</div>
          <div className="hudValue combo" data-testid="combo">x{combo}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Level</div>
          <div className="hudValue" data-testid="level">{level}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Lives</div>
          <div className={"hudValue lives" + (hurt ? " hurt" : "")} data-testid="lives">{'♥'.repeat(Math.max(0, lives))}</div>
        </div>
      </div>

      {phase === 'playing' && (
        <div className="instructionBar" data-testid="instruction">
          <div className="instructionLabel">Call</div>
          <div className="instructionText">{instruction}</div>
        </div>
      )}

      {phase !== 'playing' && (
        <div style={{ marginTop: 34, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 14 }}>
          <div className="title">WIRE SNAP</div>
          <div className="subtitle">
            A call names one wire in the bundle &mdash; by color, position, or the odd one out. Click/tap the wire, use Arrow keys / A-D plus Space/Enter, or press number keys to snip it before the fuse bar burns out. Cut the wrong wire or run out of time and you lose a life and your combo. Every 5 clean snips levels you up with more wires and less time.
          </div>
        </div>
      )}

      <div
        className={"boardOuter" + (shakeIt ? " shakeIt" : "")}
        data-testid="play-field"
        ref={boardRef}
      >
        <canvas className="gameCanvas" data-testid="canvas" ref={canvasRef}></canvas>
        <div className={"flashOverlay" + (flashOn ? " on" : "")}></div>
        <div className={"cutOverlay" + (cutOn ? " on" : "")}></div>

        {phase === 'playing' && (
          <div className="wireBtnRow">
            {wires.map((wv, i) => (
              <button
                key={i}
                className="wireBtn"
                data-testid={`wire-btn-${i}`}
                onClick={() => cutWire(i)}
                onTouchStart={(e) => { e.preventDefault(); cutWire(i); }}
              ></button>
            ))}
          </div>
        )}

        {phase === 'start' && (
          <div className="overlay">
            <div className="highscoreLine">High Score: {highScore}</div>
            <button className="btn" data-testid="start-btn" onClick={startGame}>START</button>
          </div>
        )}

        {phase === 'over' && (
          <div className="overlay">
            <div className="title" style={{ marginTop: 0, fontSize: 26 }}>BOARD FRIED</div>
            <div className="hudValue" style={{ fontSize: 30 }}>{score}</div>
            <div className="highscoreLine">High Score: {highScore}</div>
            <button className="btn" data-testid="start-btn" onClick={startGame}>RETRY</button>
          </div>
        )}
      </div>

      <div className="status">{statusMsg}</div>
      <div className="footer">Neon Game Arcade</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
