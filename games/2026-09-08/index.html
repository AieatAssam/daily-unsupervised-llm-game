<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Ring Shift</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05030a; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }
  #root { width: 100%; height: 100%; }

  .app {
    width: 100%; height: 100%; position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; overflow: hidden; gap: 6px; padding: 6px 0;
    background: radial-gradient(circle at 50% 30%, #150a24 0%, #0a0616 55%, #030308 100%);
  }

  .hud {
    position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-around;
    padding: 10px 12px; z-index: 15; pointer-events: none;
  }
  .hudBox { text-align: center; }
  .hudLabel { font-size: 10px; letter-spacing: 2px; color: #8b5eff; text-transform: uppercase; }
  .hudValue {
    font-size: 22px; font-weight: 800; color: #fff;
    text-shadow: 0 0 10px #8b5eff, 0 0 20px #8b5eff;
  }
  .hudValue.combo { color: #5eeaff; text-shadow: 0 0 10px #5eeaff, 0 0 22px #00b3c9; }
  .hudValue.lives { color: #ff5ec4; text-shadow: 0 0 10px #ff5ec4, 0 0 22px #c9007f; }
  .hudValue.hurt { animation: hurtPulse 0.4s ease; }
  @keyframes hurtPulse { 0%,100% { opacity:1; transform: scale(1);} 50% { opacity:0.4; transform: scale(1.25);} }

  .title {
    font-size: clamp(18px, 5vw, 30px); font-weight: 900; letter-spacing: 3px; margin-top: 34px;
    background: linear-gradient(90deg, #8b5eff, #5eeaff, #ff5ec4);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(139,94,255,0.6));
    animation: titlePulse 2.4s ease-in-out infinite;
    text-align: center;
  }
  @keyframes titlePulse { 0%,100% { filter: drop-shadow(0 0 12px rgba(139,94,255,0.6)); } 50% { filter: drop-shadow(0 0 26px rgba(94,234,255,0.85)); } }

  .subtitle { color: #c8bcd8; font-size: 13px; letter-spacing: 0.5px; text-align: center; max-width: 420px; line-height: 1.55; }

  .btn {
    padding: 15px 40px; font-size: 19px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(135deg, #8b5eff, #5eeaff);
    border: none; border-radius: 50px; color: #0a0018; cursor: pointer;
    box-shadow: 0 0 20px rgba(139,94,255,0.7), 0 0 50px rgba(94,234,255,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(139,94,255,0.9), 0 0 70px rgba(94,234,255,0.5); }
  .btn:active { transform: scale(0.96); }

  .highscoreLine { color: #5eeaff; font-size: 14px; text-shadow: 0 0 8px rgba(94,234,255,0.6); }

  .arenaOuter {
    position: relative; width: min(94vw, 520px); height: min(50vh, 520px); z-index: 5;
    border-radius: 18px; overflow: hidden; border: 2px solid rgba(139,94,255,0.25);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 0 30px rgba(139,94,255,0.12);
    background: #0a0714; cursor: pointer;
  }

  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .ringControls {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 12;
    display: flex; gap: 14px;
  }
  .ringBtn {
    padding: 14px 30px; font-size: 20px; font-weight: 900; letter-spacing: 1px;
    background: linear-gradient(135deg, #ff5ec4, #8b5eff); border: none; border-radius: 50px;
    color: #1a0022; box-shadow: 0 0 18px rgba(255,94,196,0.7), 0 0 44px rgba(139,94,255,0.35);
    min-height: 48px; min-width: 64px;
  }
  .ringBtn:active { transform: scale(0.94); }

  .overlay {
    position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 18px;
    background: rgba(8, 5, 14, 0.9); backdrop-filter: blur(4px);
  }

  .status { color: #a898b8; font-size: 12px; letter-spacing: 0.5px; height: 15px; z-index: 10; text-align: center; }

  .footer { position: relative; text-align: center; color: #241f30; font-size: 10px; z-index: 10; padding-bottom: 2px; }

  @media (max-width: 480px) {
    .hudValue { font-size: 17px; }
    .btn { padding: 13px 30px; font-size: 16px; }
    .subtitle { font-size: 12px; }
    .arenaOuter { height: min(48vh, 480px); }
    .ringBtn { padding: 12px 24px; font-size: 17px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const HS_KEY = 'ringShift_highScore';
const LIVES_START = 3;
const PI = Math.PI;
const SHIP_ANGLE = -PI / 2;
const HALF_WIDTH = 0.16;
const RING_COUNT = 3;

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function useAudio() {
  const ctxRef = useRef(null);
  const getCtx = () => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  };

  const tone = useCallback((freq, duration, type, gainScale, freqEnd) => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + duration);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(gainScale, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.05);
    } catch (e) {}
  }, []);

  const shiftSound = useCallback(() => tone(420, 0.08, 'sine', 0.12, 600), [tone]);
  const dodgeSound = useCallback((combo) => tone(380 + combo * 22, 0.12, 'triangle', 0.16, 900 + combo * 26), [tone]);
  const hitSound = useCallback(() => tone(180, 0.3, 'sawtooth', 0.2, 60), [tone]);
  const levelUpSound = useCallback(() => {
    tone(500, 0.12, 'sine', 0.18, 800);
    setTimeout(() => tone(700, 0.16, 'sine', 0.18, 1100), 110);
  }, [tone]);
  const overSound = useCallback(() => {
    tone(300, 0.25, 'sawtooth', 0.2, 200);
    setTimeout(() => tone(180, 0.35, 'sawtooth', 0.2, 80), 150);
  }, [tone]);

  return { shiftSound, dodgeSound, hitSound, levelUpSound, overSound };
}

const RING_COLORS = ['#8b5eff', '#5eeaff', '#ff5ec4'];

function makeGameState() {
  return {
    bounds: { w: 400, h: 400 },
    center: { x: 200, y: 200 },
    ringRadii: [60, 105, 150],
    shipRing: 1,
    obstacles: [],
    particles: [],
    shake: 0,
    flash: 0,
    level: 1,
    time: 0,
    spawnTimer: 1.2,
    running: false,
  };
}

function spawnBurst(arr, x, y, color, count, speedMin, speedMax, sizeMin, sizeMax, lifeMs) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * PI * 2;
    const spd = speedMin + Math.random() * (speedMax - speedMin);
    arr.push({
      x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      life: lifeMs, maxLife: lifeMs, color,
      size: sizeMin + Math.random() * (sizeMax - sizeMin),
    });
  }
}

function spawnWave(state) {
  const level = state.level;
  const sweepDuration = clamp(3.6 - level * 0.22, 1.5, 3.6);
  const angularSpeed = (2 * PI) / sweepDuration;
  const multiChance = clamp(0.1 + level * 0.06, 0.1, 0.6);
  const rings = [0, 1, 2];
  let targetRings;
  if (level >= 2 && Math.random() < multiChance) {
    const shuffled = rings.slice().sort(() => Math.random() - 0.5);
    targetRings = shuffled.slice(0, 2);
  } else {
    targetRings = [rings[Math.floor(Math.random() * RING_COUNT)]];
  }
  targetRings.forEach((r) => {
    state.obstacles.push({
      ring: r,
      startAngle: SHIP_ANGLE - PI * 2,
      angularSpeed,
      spawnTime: state.time,
      resolved: false,
    });
  });
}

function App() {
  const [phase, setPhase] = useState('start'); // start | playing | over
  const [score, setScore] = useState(0);
  const [lives, setLives] = useState(LIVES_START);
  const [combo, setCombo] = useState(0);
  const [level, setLevel] = useState(1);
  const [hurt, setHurt] = useState(false);
  const [highScore, setHighScore] = useState(() => parseInt(localStorage.getItem(HS_KEY) || '0', 10));
  const [statusMsg, setStatusMsg] = useState('Watch the rings sweep in — shift to an open ring before they arrive at the top.');

  const canvasRef = useRef(null);
  const arenaRef = useRef(null);
  const gs = useRef(makeGameState());
  const rafRef = useRef(null);
  const lastTsRef = useRef(0);
  const scoreRef = useRef(0);
  const comboRef = useRef(0);
  const livesRef = useRef(LIVES_START);
  const levelRef = useRef(1);
  const dodgesRef = useRef(0);
  const highScoreRef = useRef(highScore);
  const phaseRef = useRef('start');
  const shipRingRef = useRef(1);
  const { shiftSound, dodgeSound, hitSound, levelUpSound, overSound } = useAudio();

  useEffect(() => { phaseRef.current = phase; }, [phase]);

  const resizeCanvas = useCallback(() => {
    const canvas = canvasRef.current;
    const arena = arenaRef.current;
    if (!canvas || !arena) return;
    const rect = arena.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const w = rect.width, h = rect.height;
    const R = Math.min(w, h);
    gs.current.bounds = { w, h };
    gs.current.center = { x: w / 2, y: h / 2 };
    gs.current.ringRadii = [R * 0.17, R * 0.30, R * 0.43];
  }, []);

  useEffect(() => {
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    return () => window.removeEventListener('resize', resizeCanvas);
  }, [resizeCanvas]);

  const endGame = useCallback(() => {
    gs.current.running = false;
    phaseRef.current = 'over';
    setPhase('over');
    overSound();
    setStatusMsg('Core breached.');
  }, [overSound]);

  const shipPos = (state) => {
    const r = state.ringRadii[shipRingRef.current];
    return {
      x: state.center.x + Math.cos(SHIP_ANGLE) * r,
      y: state.center.y + Math.sin(SHIP_ANGLE) * r,
    };
  };

  const resolveHit = useCallback(() => {
    const state = gs.current;
    const { x, y } = shipPos(state);
    comboRef.current = 0;
    setCombo(0);
    livesRef.current -= 1;
    setLives(livesRef.current);
    setHurt(true);
    setTimeout(() => setHurt(false), 400);
    state.shake = 9;
    state.flash = 1;
    hitSound();
    spawnBurst(state.particles, x, y, '#ff5ec4', 12, 40, 180, 2, 5, 450);
    if (livesRef.current <= 0) { endGame(); return; }
    setStatusMsg('Hit! Shift rings to find the gap.');
  }, [hitSound, endGame]);

  const resolveDodge = useCallback(() => {
    const state = gs.current;
    const { x, y } = shipPos(state);
    comboRef.current += 1;
    setCombo(comboRef.current);
    const gained = 10 + (comboRef.current - 1) * 3;
    scoreRef.current += gained;
    setScore(scoreRef.current);
    if (scoreRef.current > highScoreRef.current) {
      highScoreRef.current = scoreRef.current;
      localStorage.setItem(HS_KEY, String(scoreRef.current));
      setHighScore(scoreRef.current);
    }
    dodgeSound(comboRef.current);
    spawnBurst(state.particles, x, y, '#5eeaff', 8, 30, 130, 2, 4, 400);
    dodgesRef.current += 1;
    if (dodgesRef.current % 8 === 0) {
      levelRef.current += 1;
      setLevel(levelRef.current);
      levelUpSound();
      setStatusMsg(`Level ${levelRef.current}! Sweeps speed up, more rings block at once.`);
    }
  }, [dodgeSound, levelUpSound]);

  const setShipRing = useCallback((next) => {
    if (phaseRef.current !== 'playing') return;
    const clamped = clamp(next, 0, RING_COUNT - 1);
    if (clamped === shipRingRef.current) return;
    shipRingRef.current = clamped;
    shiftSound();
  }, [shiftSound]);

  const cycleShipRing = useCallback(() => {
    if (phaseRef.current !== 'playing') return;
    shipRingRef.current = (shipRingRef.current + 1) % RING_COUNT;
    shiftSound();
  }, [shiftSound]);

  useEffect(() => {
    const onKeyDown = (e) => {
      if (e.code === 'ArrowUp' || e.code === 'KeyW') {
        e.preventDefault();
        setShipRing(shipRingRef.current + 1);
      } else if (e.code === 'ArrowDown' || e.code === 'KeyS') {
        e.preventDefault();
        setShipRing(shipRingRef.current - 1);
      } else if (e.code === 'Space') {
        e.preventDefault();
        cycleShipRing();
      }
    };
    window.addEventListener('keydown', onKeyDown);
    return () => window.removeEventListener('keydown', onKeyDown);
  }, [setShipRing, cycleShipRing]);

  const handleArenaTap = useCallback((clientY) => {
    if (phaseRef.current !== 'playing') return;
    const arena = arenaRef.current;
    if (!arena) return;
    const rect = arena.getBoundingClientRect();
    const relY = clientY - rect.top;
    if (relY < rect.height / 2) setShipRing(shipRingRef.current + 1);
    else setShipRing(shipRingRef.current - 1);
  }, [setShipRing]);

  const tick = useCallback((ts) => {
    const state = gs.current;
    if (!lastTsRef.current) lastTsRef.current = ts;
    let dt = (ts - lastTsRef.current) / 1000;
    dt = Math.min(dt, 0.05);
    lastTsRef.current = ts;

    if (phaseRef.current === 'playing') {
      state.level = levelRef.current;
      state.time += dt;

      state.spawnTimer -= dt;
      if (state.spawnTimer <= 0) {
        spawnWave(state);
        state.spawnTimer = clamp(1.7 - state.level * 0.09, 0.7, 1.7);
      }

      for (let i = state.obstacles.length - 1; i >= 0; i--) {
        const obs = state.obstacles[i];
        const currentAngle = obs.startAngle + obs.angularSpeed * (state.time - obs.spawnTime);
        if (!obs.resolved && currentAngle >= SHIP_ANGLE) {
          obs.resolved = true;
          if (obs.ring === shipRingRef.current) resolveHit();
          else resolveDodge();
          state.obstacles.splice(i, 1);
        }
      }
    }

    for (let i = state.particles.length - 1; i >= 0; i--) {
      const pt = state.particles[i];
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.vx *= 0.94; pt.vy *= 0.94;
      pt.life -= dt * 1000;
      if (pt.life <= 0) state.particles.splice(i, 1);
    }
    if (state.particles.length > 140) state.particles.splice(0, state.particles.length - 140);

    if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 40);
    if (state.flash > 0) state.flash = Math.max(0, state.flash - dt * 3);

    draw(state, ts);
    rafRef.current = requestAnimationFrame(tick);
  }, [resolveHit, resolveDodge]);

  const draw = (state, ts) => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const { w, h } = state.bounds;
    const { x: cx, y: cy } = state.center;

    ctx.save();
    if (state.shake > 0) {
      ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
    }

    ctx.fillStyle = 'rgba(8,5,14,0.35)';
    ctx.fillRect(-20, -20, w + 40, h + 40);

    if (!state.bgGradient || state.bgGradientKey !== `${w}x${h}`) {
      const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, Math.max(w, h) * 0.8);
      grad.addColorStop(0, 'hsla(262, 60%, 16%, 1)');
      grad.addColorStop(1, 'rgba(5,3,10,0)');
      state.bgGradient = grad;
      state.bgGradientKey = `${w}x${h}`;
    }
    ctx.globalAlpha = 0.3 + Math.sin(ts / 3000) * 0.06;
    ctx.fillStyle = state.bgGradient;
    ctx.fillRect(0, 0, w, h);
    ctx.globalAlpha = 1;

    if (state.flash > 0) {
      ctx.fillStyle = `rgba(255,94,196,${state.flash * 0.18})`;
      ctx.fillRect(0, 0, w, h);
    }

    // ring guide tracks
    for (let r = 0; r < RING_COUNT; r++) {
      ctx.beginPath();
      ctx.arc(cx, cy, state.ringRadii[r], 0, PI * 2);
      ctx.strokeStyle = r === shipRingRef.current ? RING_COLORS[r] : 'rgba(200,180,220,0.14)';
      ctx.lineWidth = r === shipRingRef.current ? 3 : 2;
      if (r === shipRingRef.current) {
        ctx.shadowColor = RING_COLORS[r];
        ctx.shadowBlur = 10;
      } else {
        ctx.shadowBlur = 0;
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    // core
    ctx.fillStyle = 'rgba(20,12,30,0.9)';
    ctx.beginPath();
    ctx.arc(cx, cy, 14, 0, PI * 2);
    ctx.fill();

    // obstacles
    for (const obs of state.obstacles) {
      const a = obs.startAngle + obs.angularSpeed * (state.time - obs.spawnTime);
      const danger = obs.ring === shipRingRef.current && (SHIP_ANGLE - a) < 0.6;
      ctx.save();
      ctx.strokeStyle = danger ? '#ff2e4f' : '#ff8c3a';
      ctx.shadowColor = danger ? '#ff2e4f' : '#ff8c3a';
      ctx.shadowBlur = danger ? 16 : 9;
      ctx.lineWidth = 12;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(cx, cy, state.ringRadii[obs.ring], a - HALF_WIDTH, a + HALF_WIDTH);
      ctx.stroke();
      ctx.restore();
    }

    // ship
    const shipR = state.ringRadii[shipRingRef.current];
    const sx = cx + Math.cos(SHIP_ANGLE) * shipR;
    const sy = cy + Math.sin(SHIP_ANGLE) * shipR;
    ctx.save();
    ctx.fillStyle = '#eafcff';
    ctx.shadowColor = '#5eeaff';
    ctx.shadowBlur = 16;
    ctx.beginPath();
    ctx.moveTo(sx, sy - 11);
    ctx.lineTo(sx + 9, sy + 7);
    ctx.lineTo(sx - 9, sy + 7);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // particles
    for (const pt of state.particles) {
      ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.restore();
  };

  const startGame = () => {
    resizeCanvas();
    const state = makeGameState();
    state.bounds = gs.current.bounds;
    state.center = gs.current.center;
    state.ringRadii = gs.current.ringRadii;
    state.running = true;
    gs.current = state;
    shipRingRef.current = 1;
    scoreRef.current = 0;
    comboRef.current = 0;
    livesRef.current = LIVES_START;
    levelRef.current = 1;
    dodgesRef.current = 0;
    lastTsRef.current = 0;
    setScore(0);
    setCombo(0);
    setLives(LIVES_START);
    setLevel(1);
    setStatusMsg('Shift to the open ring before each sweep reaches the top.');
    setPhase('playing');
    phaseRef.current = 'playing';
    cancelAnimationFrame(rafRef.current);
    rafRef.current = requestAnimationFrame(tick);
  };

  const startGameRef = useRef(startGame);
  useEffect(() => { startGameRef.current = startGame; });

  useEffect(() => () => cancelAnimationFrame(rafRef.current), []);

  return (
    <div className="app" data-testid="game-canvas">
      <div className="hud">
        <div className="hudBox">
          <div className="hudLabel">Score</div>
          <div className="hudValue" data-testid="score">{score}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Lives</div>
          <div className={`hudValue lives ${hurt ? 'hurt' : ''}`} data-testid="lives">{'❤'.repeat(Math.max(0, lives))}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Combo</div>
          <div className="hudValue combo" data-testid="combo">x{combo}</div>
        </div>
      </div>

      <div className="title">RING SHIFT</div>

      <div
        className="arenaOuter"
        ref={arenaRef}
        data-testid="play-field"
        onClick={(e) => { if (phaseRef.current === 'over') { startGameRef.current(); return; } handleArenaTap(e.clientY); }}
        onTouchStart={(e) => { e.preventDefault(); if (phaseRef.current === 'over') { startGameRef.current(); return; } const t = e.touches[0]; if (t) handleArenaTap(t.clientY); }}
      >
        <canvas ref={canvasRef} data-testid="arena" />

        {phase === 'playing' && (
          <div className="ringControls">
            <button
              className="ringBtn"
              data-testid="ring-up-btn"
              onClick={(e) => { e.stopPropagation(); setShipRing(shipRingRef.current + 1); }}
              onTouchStart={(e) => { e.stopPropagation(); e.preventDefault(); setShipRing(shipRingRef.current + 1); }}
            >▲</button>
            <button
              className="ringBtn"
              data-testid="ring-down-btn"
              onClick={(e) => { e.stopPropagation(); setShipRing(shipRingRef.current - 1); }}
              onTouchStart={(e) => { e.stopPropagation(); e.preventDefault(); setShipRing(shipRingRef.current - 1); }}
            >▼</button>
          </div>
        )}

        {phase === 'start' && (
          <div className="overlay">
            <div className="subtitle">Three neon rings surround the core. Colored bands sweep a full lap and arrive at the top marker — shift your ship (arrows / W-S / tap upper-lower half / on-screen buttons) onto whichever ring is open when they land.<br />Dodge for a rising combo and score; get caught on the same ring as a sweep and you lose one of three lives. Sweeps speed up and more rings block at once as your level climbs.</div>
            <div className="highscoreLine" data-testid="high-score">Best: {highScore}</div>
            <button className="btn" data-testid="start-btn" onClick={(e) => { e.stopPropagation(); startGame(); }}>START</button>
          </div>
        )}

        {phase === 'over' && (
          <div className="overlay">
            <div className="title" style={{ fontSize: 'clamp(20px, 6vw, 30px)', marginTop: 0 }}>BREACHED</div>
            <div className="hudValue" data-testid="final-score">Score: {score}</div>
            <div className="highscoreLine" data-testid="high-score-final">Best: {highScore}</div>
            <button className="btn" data-testid="restart-btn" onClick={(e) => { e.stopPropagation(); startGame(); }}>PLAY AGAIN</button>
          </div>
        )}
      </div>

      <div className="status">{statusMsg}</div>
      <div className="footer">Ring Shift — Level {level} — shift rings to dodge the sweeping bands before they reach the top</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
