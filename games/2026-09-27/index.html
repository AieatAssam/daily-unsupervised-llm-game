<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Neon Fusion</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05040c; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }
  #root { width: 100%; height: 100%; }

  .app {
    width: 100%; height: 100%; position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; overflow: hidden; gap: 4px; padding: 6px 0;
    background: radial-gradient(circle at 50% 0%, #1a1035 0%, #0c081c 50%, #050308 100%);
  }

  .bgGlow {
    position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: 0.5;
    background: radial-gradient(circle at 20% 20%, rgba(255,110,199,0.12), transparent 40%),
                radial-gradient(circle at 80% 30%, rgba(77,232,196,0.12), transparent 40%),
                radial-gradient(circle at 50% 90%, rgba(138,107,255,0.14), transparent 45%);
  }

  .hud {
    display: flex; justify-content: space-around; width: 100%; max-width: 480px;
    padding: 4px 12px; z-index: 15; gap: 4px; position: relative;
  }
  .hudBox { text-align: center; }
  .hudLabel { font-size: 9px; letter-spacing: 2px; color: #b98bff; text-transform: uppercase; }
  .hudValue {
    font-size: 19px; font-weight: 800; color: #fff;
    text-shadow: 0 0 10px #b98bff, 0 0 20px #b98bff;
  }
  .hudValue.combo { color: #ffd23d; text-shadow: 0 0 10px #ffd23d, 0 0 22px #b3860a; }
  .hudValue.best { color: #4de8c4; text-shadow: 0 0 10px #4de8c4, 0 0 20px #1c7a63; }
  .hudValue.pulse { animation: hudPulse 0.4s ease; }
  @keyframes hudPulse { 0%,100% { opacity:1; transform: scale(1);} 50% { opacity:0.5; transform: scale(1.3);} }

  .title {
    font-size: clamp(18px, 5vw, 28px); font-weight: 900; letter-spacing: 3px; margin-top: 14px;
    background: linear-gradient(90deg, #ff6ec7, #b98bff, #4de8c4);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(185,139,255,0.6));
    animation: titlePulse 2.4s ease-in-out infinite;
    text-align: center;
  }
  @keyframes titlePulse { 0%,100% { filter: drop-shadow(0 0 12px rgba(185,139,255,0.6)); } 50% { filter: drop-shadow(0 0 26px rgba(255,110,199,0.85)); } }

  .subtitle { color: #c3b8d8; font-size: 12px; letter-spacing: 0.5px; text-align: center; max-width: 440px; line-height: 1.5; padding: 0 12px; }

  .btn {
    padding: 14px 38px; font-size: 18px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(135deg, #b98bff, #ff6ec7);
    border: none; border-radius: 50px; color: #0a0714; cursor: pointer;
    box-shadow: 0 0 20px rgba(185,139,255,0.7), 0 0 50px rgba(255,110,199,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(185,139,255,0.9), 0 0 70px rgba(255,110,199,0.5); }
  .btn:active { transform: scale(0.96); }

  .highscoreLine { color: #4de8c4; font-size: 13px; text-shadow: 0 0 8px rgba(77,232,196,0.6); }

  .fieldOuter {
    position: relative; width: min(88vw, 440px); height: min(88vw, 440px); z-index: 5;
    border-radius: 16px; overflow: hidden; border: 2px solid rgba(185,139,255,0.3);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 0 30px rgba(185,139,255,0.14);
    background: #0a0714; touch-action: none; cursor: grab;
    margin-top: 6px;
  }
  .fieldOuter.shakeIt { animation: shakeKf 0.3s ease; }
  @keyframes shakeKf {
    0%, 100% { transform: translate(0,0); }
    20% { transform: translate(-5px, 2px); }
    40% { transform: translate(5px, -2px); }
    60% { transform: translate(-4px, -2px); }
    80% { transform: translate(4px, 2px); }
  }

  .board {
    position: absolute; inset: 0; display: grid;
    grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr);
    gap: 6%; padding: 6%; z-index: 3;
  }
  .cell {
    position: relative; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
  }
  .cell.empty {}
  .cell.glitch {
    background: repeating-linear-gradient(45deg, rgba(255,51,85,0.18), rgba(255,51,85,0.18) 4px, rgba(20,4,8,0.6) 4px, rgba(20,4,8,0.6) 8px);
    border: 1px solid rgba(255,51,85,0.5); box-shadow: 0 0 12px rgba(255,51,85,0.35) inset;
  }
  .cell.num {
    font-weight: 900; color: #0a0714; animation: popIn 0.22s cubic-bezier(.34,1.56,.64,1);
  }
  .cell.num.gold {
    box-shadow: 0 0 18px 4px rgba(255,224,102,0.85), inset 0 0 14px rgba(255,255,255,0.4);
    border: 2px solid #fff6d0;
  }
  @keyframes popIn { 0% { transform: scale(0.55); opacity: 0.3; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

  .mergeFlash {
    position: absolute; border-radius: 10px; pointer-events: none; z-index: 4;
    background: radial-gradient(circle, rgba(255,255,255,0.85), rgba(255,255,255,0) 70%);
    animation: mergeFlashKf 0.35s ease-out forwards;
  }
  @keyframes mergeFlashKf { 0% { opacity: 0.9; transform: scale(0.7); } 100% { opacity: 0; transform: scale(1.5); } }

  canvas.gameCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 6; pointer-events: none; }

  .flashOverlay {
    position: absolute; inset: 0; z-index: 9; pointer-events: none; background: rgba(255,255,255,0);
  }
  .flashOverlay.good { animation: flashGoodKf 0.3s ease; }
  @keyframes flashGoodKf { 0% { background: rgba(77,232,196,0.2); } 100% { background: rgba(77,232,196,0); } }
  .flashOverlay.gold { animation: flashGoldKf 0.5s ease; }
  @keyframes flashGoldKf { 0% { background: rgba(255,210,61,0.36); } 100% { background: rgba(255,210,61,0); } }
  .flashOverlay.level { animation: flashLevelKf 0.5s ease; }
  @keyframes flashLevelKf { 0% { background: rgba(185,139,255,0.36); } 100% { background: rgba(185,139,255,0); } }

  .overlay {
    position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 14px;
    background: rgba(10, 7, 20, 0.94); backdrop-filter: blur(4px);
  }

  .dpad {
    display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(2, 48px);
    gap: 6px; z-index: 10; margin-top: 8px; justify-content: center;
  }
  .dpadBtn {
    border-radius: 10px; cursor: pointer;
    background: linear-gradient(135deg, rgba(185,139,255,0.22), rgba(77,232,196,0.14));
    border: 2px solid rgba(185,139,255,0.45); color: #eee0ff; font-size: 20px; font-weight: 900;
    box-shadow: 0 0 14px rgba(185,139,255,0.3);
    transition: transform 0.1s ease, background 0.1s ease;
  }
  .dpadBtn:active { transform: scale(0.92); background: rgba(185,139,255,0.4); }
  .dpadUp { grid-column: 2; grid-row: 1; }
  .dpadLeft { grid-column: 1; grid-row: 2; }
  .dpadDown { grid-column: 2; grid-row: 2; }
  .dpadRight { grid-column: 3; grid-row: 2; }

  .status { color: #9a8fb0; font-size: 11px; letter-spacing: 0.5px; height: 14px; z-index: 10; text-align: center; margin-top: 4px; }
  .footer { position: relative; text-align: center; color: #14101c; font-size: 10px; z-index: 10; padding-bottom: 2px; }

  @media (max-width: 480px) {
    .hudValue { font-size: 15px; }
    .btn { padding: 12px 28px; font-size: 15px; }
    .subtitle { font-size: 11px; }
    .fieldOuter { width: min(90vw, 360px); height: min(90vw, 360px); }
    .dpad { grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(2, 44px); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const HS_KEY = 'neonFusionHighScore';
const SIZE = 4;
const LEVEL_SCORE_STEP = 500;
const MAX_GLITCHES = 6;
const SWIPE_THRESHOLD = 24;

const TILE_COLORS = {
  2: '#4de8c4', 4: '#38bdf8', 8: '#8a6bff', 16: '#c084fc', 32: '#ff6ec7',
  64: '#ff4d6d', 128: '#ff9f43', 256: '#ffd23d', 512: '#ffe066',
  1024: '#7CFC9A', 2048: '#00ffe0', 4096: '#ffffff',
};
function tileColor(v) { return TILE_COLORS[v] || '#ffffff'; }
function tileFontSize(v) {
  const digits = String(v).length;
  if (digits <= 2) return '34%';
  if (digits === 3) return '28%';
  if (digits === 4) return '22%';
  return '18%';
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function useAudio() {
  const ctxRef = useRef(null);
  const getCtx = () => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  };

  const tone = useCallback((freq, duration, type, gainScale, freqEnd) => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + duration);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(gainScale, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.05);
    } catch (e) {}
  }, []);

  const mergeSound = useCallback((combo) => {
    const base = 300 + Math.min(combo, 14) * 34;
    tone(base, 0.08, 'sine', 0.14, base * 1.8);
  }, [tone]);
  const goldSound = useCallback(() => {
    tone(700, 0.14, 'triangle', 0.18, 1200);
    setTimeout(() => tone(1000, 0.14, 'triangle', 0.14, 1500), 80);
  }, [tone]);
  const levelSound = useCallback(() => {
    tone(520, 0.1, 'square', 0.1, 880);
    setTimeout(() => tone(760, 0.12, 'square', 0.1, 1180), 90);
  }, [tone]);
  const overSound = useCallback(() => {
    tone(300, 0.25, 'sawtooth', 0.2, 200);
    setTimeout(() => tone(180, 0.35, 'sawtooth', 0.2, 80), 150);
  }, [tone]);

  return { mergeSound, goldSound, levelSound, overSound };
}

function emptyBoard() {
  return Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
}

function emptyCells(board) {
  const res = [];
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (!board[r][c]) res.push([r, c]);
  return res;
}

function spawnTiles(board, count) {
  const b = board.map(row => row.slice());
  for (let i = 0; i < count; i++) {
    const empties = emptyCells(b);
    if (!empties.length) break;
    const [r, c] = empties[Math.floor(Math.random() * empties.length)];
    const gold = Math.random() < 0.06;
    const value = Math.random() < 0.1 ? 4 : 2;
    b[r][c] = { type: 'num', value, gold };
  }
  return b;
}

function addGlitch(board) {
  const empties = emptyCells(board);
  if (!empties.length) return null;
  const [r, c] = empties[Math.floor(Math.random() * empties.length)];
  const b = board.map(row => row.slice());
  b[r][c] = { type: 'glitch' };
  return { board: b, r, c };
}

function processLine(cells) {
  const n = cells.length;
  const outLine = new Array(n).fill(null);
  const mergeMarks = new Array(n).fill(false);
  const merges = [];
  let scoreGained = 0;
  let segStart = 0;

  const flushSegment = (start, end) => {
    const nums = [];
    for (let k = start; k < end; k++) if (cells[k] && cells[k].type === 'num') nums.push(cells[k]);
    const merged = [];
    const mergedFlagsSeg = [];
    let a = 0;
    while (a < nums.length) {
      if (a + 1 < nums.length && nums[a].value === nums[a + 1].value) {
        const newVal = nums[a].value * 2;
        const gold = !!(nums[a].gold || nums[a + 1].gold);
        merged.push({ type: 'num', value: newVal, gold: false });
        mergedFlagsSeg.push(true);
        scoreGained += newVal;
        merges.push({ value: newVal, gold });
        a += 2;
      } else {
        merged.push(nums[a]);
        mergedFlagsSeg.push(false);
        a += 1;
      }
    }
    for (let k = 0; k < end - start; k++) {
      outLine[start + k] = merged[k] || null;
      mergeMarks[start + k] = !!mergedFlagsSeg[k];
    }
  };

  for (let i = 0; i <= n; i++) {
    if (i === n || (cells[i] && cells[i].type === 'glitch')) {
      flushSegment(segStart, i);
      if (i < n) { outLine[i] = { type: 'glitch' }; mergeMarks[i] = false; }
      segStart = i + 1;
    }
  }

  return { outLine, mergeMarks, merges, scoreGained };
}

function lineChanged(oldCells, newCells) {
  for (let i = 0; i < oldCells.length; i++) {
    const a = oldCells[i], b = newCells[i];
    const an = a && a.type === 'num', bn = b && b.type === 'num';
    if (an !== bn) return true;
    if (an && bn && (a.value !== b.value || !!a.gold !== !!b.gold)) return true;
    const ag = a && a.type === 'glitch', bg = b && b.type === 'glitch';
    if (ag !== bg) return true;
  }
  return false;
}

function getLineCoords(dir) {
  const lines = [];
  if (dir === 'left') for (let r = 0; r < SIZE; r++) lines.push([[r, 0], [r, 1], [r, 2], [r, 3]]);
  else if (dir === 'right') for (let r = 0; r < SIZE; r++) lines.push([[r, 3], [r, 2], [r, 1], [r, 0]]);
  else if (dir === 'up') for (let c = 0; c < SIZE; c++) lines.push([[0, c], [1, c], [2, c], [3, c]]);
  else if (dir === 'down') for (let c = 0; c < SIZE; c++) lines.push([[3, c], [2, c], [1, c], [0, c]]);
  return lines;
}

function moveBoard(board, dir) {
  const lines = getLineCoords(dir);
  const newBoard = board.map(row => row.slice());
  let moved = false, totalScore = 0;
  const mergeCoords = [];
  const allMerges = [];
  for (const coords of lines) {
    const cells = coords.map(([r, c]) => board[r][c]);
    const { outLine, mergeMarks, merges, scoreGained } = processLine(cells);
    if (lineChanged(cells, outLine)) moved = true;
    totalScore += scoreGained;
    coords.forEach(([r, c], idx) => {
      newBoard[r][c] = outLine[idx];
      if (mergeMarks[idx]) mergeCoords.push([r, c]);
    });
    allMerges.push(...merges);
  }
  return { board: newBoard, moved, scoreGained: totalScore, mergeCoords, merges: allMerges };
}

function isGameOver(board) {
  return !['left', 'right', 'up', 'down'].some(dir => moveBoard(board, dir).moved);
}

function initBoard() {
  return spawnTiles(emptyBoard(), 2);
}

function spawnBurst(arr, x, y, color, count, speedMin, speedMax, sizeMin, sizeMax, lifeMs) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = speedMin + Math.random() * (speedMax - speedMin);
    arr.push({
      x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      life: lifeMs, maxLife: lifeMs, color,
      size: sizeMin + Math.random() * (sizeMax - sizeMin),
    });
  }
}

let flashId = 0;

function serializeCell(cell) {
  if (!cell) return 'e';
  if (cell.type === 'glitch') return 'g';
  return `n:${cell.value}:${cell.gold ? 1 : 0}`;
}

function App() {
  const [phase, setPhase] = useState('start');
  const [board, setBoard] = useState(() => emptyBoard());
  const [score, setScore] = useState(0);
  const [level, setLevel] = useState(1);
  const [combo, setCombo] = useState(0);
  const [comboPulse, setComboPulse] = useState(false);
  const [best, setBest] = useState(() => parseInt(localStorage.getItem(HS_KEY) || '0', 10));
  const [flashKind, setFlashKind] = useState(null);
  const [shakeIt, setShakeIt] = useState(false);
  const [cellVersions, setCellVersions] = useState(() => Array(SIZE * SIZE).fill(0));
  const [mergeFlashes, setMergeFlashes] = useState([]);
  const [statusMsg, setStatusMsg] = useState('Slide tiles together to fuse them.');

  const boardRef = useRef(board);
  const scoreRef = useRef(0);
  const bestRef = useRef(best);
  const levelRef = useRef(1);
  const comboRef = useRef(0);
  const glitchCountRef = useRef(0);
  const cellVersionsRef = useRef(Array(SIZE * SIZE).fill(0));
  const phaseRef = useRef('start');

  const canvasRef = useRef(null);
  const fieldRef = useRef(null);
  const particlesRef = useRef([]);
  const dimsRef = useRef({ w: 300, h: 300 });
  const rafRef = useRef(null);

  const flashTimeoutRef = useRef(null);
  const shakeTimeoutRef = useRef(null);
  const comboPulseTimeoutRef = useRef(null);
  const swipeStartRef = useRef(null);

  const { mergeSound, goldSound, levelSound, overSound } = useAudio();

  useEffect(() => { phaseRef.current = phase; }, [phase]);

  const resizeCanvas = useCallback(() => {
    const canvas = canvasRef.current;
    const field = fieldRef.current;
    if (!canvas || !field) return;
    const rect = field.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dimsRef.current = { w: rect.width, h: rect.height };
  }, []);

  useEffect(() => {
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    return () => window.removeEventListener('resize', resizeCanvas);
  }, [resizeCanvas]);

  const triggerFlash = useCallback((kind, ms) => {
    setFlashKind(kind);
    clearTimeout(flashTimeoutRef.current);
    flashTimeoutRef.current = setTimeout(() => setFlashKind(null), ms);
  }, []);

  const cellCenter = useCallback((r, c) => {
    const { w, h } = dimsRef.current;
    const pad = 0.06;
    const cw = (w * (1 - pad * 2)) / SIZE;
    const ch = (h * (1 - pad * 2)) / SIZE;
    return { x: w * pad + cw * (c + 0.5), y: h * pad + ch * (r + 0.5) };
  }, []);

  const resetGame = useCallback(() => {
    const b = initBoard();
    boardRef.current = b;
    setBoard(b);
    scoreRef.current = 0; setScore(0);
    levelRef.current = 1; setLevel(1);
    comboRef.current = 0; setCombo(0);
    glitchCountRef.current = 0;
    particlesRef.current = [];
    setMergeFlashes([]);
    cellVersionsRef.current = Array(SIZE * SIZE).fill(0);
    setCellVersions(cellVersionsRef.current);
  }, []);

  const startGame = useCallback(() => {
    resizeCanvas();
    resetGame();
    setStatusMsg('Slide tiles together to fuse them.');
    phaseRef.current = 'playing';
    setPhase('playing');
  }, [resizeCanvas, resetGame]);

  const startGameRef = useRef(null);
  useEffect(() => { startGameRef.current = startGame; }, [startGame]);

  const commitMove = useCallback((dir) => {
    if (phaseRef.current !== 'playing') return;
    const prevBoard = boardRef.current;
    const result = moveBoard(prevBoard, dir);
    if (!result.moved) return;

    const comboNext = result.merges.length > 0 ? comboRef.current + 1 : 0;
    const multiplier = 1 + Math.min(comboNext, 10) * 0.1;
    let goldBonus = 0;
    for (const m of result.merges) if (m.gold) goldBonus += 300;
    const gained = Math.round(result.scoreGained * multiplier) + goldBonus;

    const extraSpawn = (levelRef.current >= 4 && Math.random() < 0.25) ? 2 : 1;
    const spawned = spawnTiles(result.board, extraSpawn);

    boardRef.current = spawned;
    setBoard(spawned);

    const newVersions = cellVersionsRef.current.slice();
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (serializeCell(prevBoard[r][c]) !== serializeCell(spawned[r][c])) {
          newVersions[r * SIZE + c] += 1;
        }
      }
    }
    cellVersionsRef.current = newVersions;
    setCellVersions(newVersions);

    scoreRef.current += gained;
    setScore(scoreRef.current);

    comboRef.current = comboNext;
    setCombo(comboNext);
    if (comboNext > 0) {
      setComboPulse(true);
      clearTimeout(comboPulseTimeoutRef.current);
      comboPulseTimeoutRef.current = setTimeout(() => setComboPulse(false), 350);
    }

    if (result.merges.length) {
      mergeSound(comboNext);
      const flashes = result.mergeCoords.map(([r, c]) => ({ id: ++flashId, r, c }));
      setMergeFlashes(prev => [...prev, ...flashes]);
      setTimeout(() => {
        setMergeFlashes(prev => prev.filter(f => !flashes.includes(f)));
      }, 350);

      for (let i = 0; i < result.mergeCoords.length; i++) {
        const [r, c] = result.mergeCoords[i];
        const { x, y } = cellCenter(r, c);
        const m = result.merges[i];
        spawnBurst(particlesRef.current, x, y, m.gold ? '#ffe066' : tileColor(m.value), 14, 40, 140, 1.5, 3.5, 460);
      }
      if (result.merges.some(m => m.gold)) {
        goldSound();
        triggerFlash('gold', 450);
      } else {
        triggerFlash('good', 220);
      }
      setStatusMsg(comboNext > 2 ? `Combo x${comboNext}! +${gained}` : `Fused! +${gained}`);
    } else {
      setStatusMsg('Keep sliding...');
    }

    const newLevel = 1 + Math.floor(scoreRef.current / LEVEL_SCORE_STEP);
    if (newLevel !== levelRef.current) {
      levelRef.current = newLevel;
      setLevel(newLevel);
      if (glitchCountRef.current < MAX_GLITCHES) {
        const withGlitch = addGlitch(boardRef.current);
        if (withGlitch) {
          boardRef.current = withGlitch.board;
          setBoard(withGlitch.board);
          const vNext = cellVersionsRef.current.slice();
          vNext[withGlitch.r * SIZE + withGlitch.c] += 1;
          cellVersionsRef.current = vNext;
          setCellVersions(vNext);
          glitchCountRef.current += 1;
        }
      }
      levelSound();
      triggerFlash('level', 450);
      setStatusMsg(`Level ${newLevel}! Glitch cells spreading.`);
    }

    if (scoreRef.current > bestRef.current) {
      bestRef.current = scoreRef.current;
      localStorage.setItem(HS_KEY, String(scoreRef.current));
      setBest(scoreRef.current);
    }

    if (isGameOver(boardRef.current)) {
      phaseRef.current = 'over';
      setPhase('over');
      overSound();
      setStatusMsg('No more fusions possible!');
    }
  }, [mergeSound, goldSound, levelSound, overSound, triggerFlash, cellCenter]);

  useEffect(() => {
    const onKeyDown = (e) => {
      if (phaseRef.current !== 'playing') {
        if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); startGameRef.current && startGameRef.current(); }
        return;
      }
      let dir = null;
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') dir = 'left';
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') dir = 'right';
      else if (e.code === 'ArrowUp' || e.code === 'KeyW') dir = 'up';
      else if (e.code === 'ArrowDown' || e.code === 'KeyS') dir = 'down';
      if (dir) { e.preventDefault(); commitMove(dir); }
    };
    window.addEventListener('keydown', onKeyDown);
    return () => window.removeEventListener('keydown', onKeyDown);
  }, [commitMove]);

  useEffect(() => () => {
    clearTimeout(flashTimeoutRef.current);
    clearTimeout(shakeTimeoutRef.current);
    clearTimeout(comboPulseTimeoutRef.current);
  }, []);

  const getLocalPoint = useCallback((e) => {
    const t = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]);
    const cx = t ? t.clientX : e.clientX;
    const cy = t ? t.clientY : e.clientY;
    return { x: cx, y: cy };
  }, []);

  const onPointerDownField = useCallback((e) => {
    if (phaseRef.current !== 'playing') return;
    swipeStartRef.current = getLocalPoint(e);
  }, [getLocalPoint]);

  const onPointerUpField = useCallback((e) => {
    if (phaseRef.current !== 'playing' || !swipeStartRef.current) return;
    const start = swipeStartRef.current;
    const end = getLocalPoint(e);
    swipeStartRef.current = null;
    const dx = end.x - start.x, dy = end.y - start.y;
    if (Math.hypot(dx, dy) < SWIPE_THRESHOLD) return;
    if (Math.abs(dx) > Math.abs(dy)) commitMove(dx > 0 ? 'right' : 'left');
    else commitMove(dy > 0 ? 'down' : 'up');
  }, [getLocalPoint, commitMove]);

  // Particle render loop
  useEffect(() => {
    const loop = () => {
      const canvas = canvasRef.current;
      if (canvas) {
        const ctx = canvas.getContext('2d');
        const { w, h } = dimsRef.current;
        if (w > 5 && h > 5) {
          ctx.clearRect(0, 0, w, h);
          const particles = particlesRef.current;
          for (const p of particles) {
            p.x += p.vx * 0.016; p.y += p.vy * 0.016;
            p.vx *= 0.94; p.vy *= 0.94; p.life -= 16;
          }
          particlesRef.current = particles.filter(p => p.life > 0);
          for (const p of particlesRef.current) {
            const a = clamp(p.life / p.maxLife, 0, 1);
            ctx.save();
            ctx.globalAlpha = a;
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
          }
        }
      }
      rafRef.current = requestAnimationFrame(loop);
    };
    rafRef.current = requestAnimationFrame(loop);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, []);

  return (
    <div className="app">
      <div className="bgGlow"></div>
      <div className="hud">
        <div className="hudBox">
          <div className="hudLabel">Score</div>
          <div className="hudValue" data-testid="score">{score}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Level</div>
          <div className="hudValue" data-testid="level">{level}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Combo</div>
          <div className={"hudValue combo" + (comboPulse ? " pulse" : "")} data-testid="combo">x{combo}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Best</div>
          <div className="hudValue best" data-testid="best">{best}</div>
        </div>
      </div>

      {phase !== 'playing' && (
        <div style={{ marginTop: 4, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 10 }}>
          <div className="title">NEON FUSION</div>
          <div className="subtitle">
            Slide every glowing tile at once with Arrow keys / WASD, the on-screen D-pad, or a swipe/drag across the board. Matching tiles fuse into the next glowing value, chaining fast fusions into a rising combo multiplier. Gold tiles pay out a huge bonus when fused, but every level spawns a cracked glitch cell that blocks the grid and never moves. Run out of moves and it's game over — how high can you fuse?
          </div>
        </div>
      )}

      <div
        className={"fieldOuter" + (shakeIt ? " shakeIt" : "")}
        data-testid="play-field"
        ref={fieldRef}
        onMouseDown={onPointerDownField}
        onMouseUp={onPointerUpField}
        onTouchStart={onPointerDownField}
        onTouchEnd={onPointerUpField}
      >
        <div className="board" data-testid="board">
          {board.map((row, r) => row.map((cell, c) => {
            const key = `${r}-${c}-v${cellVersions[r * SIZE + c]}`;
            if (!cell) return <div key={key} className="cell empty" />;
            if (cell.type === 'glitch') return <div key={key} className="cell glitch" data-testid="glitch-cell" />;
            return (
              <div
                key={key}
                className={"cell num" + (cell.gold ? " gold" : "")}
                data-testid="num-cell"
                style={{
                  background: `radial-gradient(circle at 35% 30%, ${tileColor(cell.value)}, ${tileColor(cell.value)}cc)`,
                  boxShadow: `0 0 16px 2px ${tileColor(cell.value)}99`,
                  fontSize: tileFontSize(cell.value),
                }}
              >
                {cell.value}
              </div>
            );
          }))}
          {mergeFlashes.map(f => {
            const pct = 100 / SIZE;
            return (
              <div
                key={f.id}
                className="mergeFlash"
                style={{ left: `${f.c * pct}%`, top: `${f.r * pct}%`, width: `${pct}%`, height: `${pct}%` }}
              />
            );
          })}
        </div>

        <canvas className="gameCanvas" data-testid="canvas" ref={canvasRef}></canvas>
        <div className={"flashOverlay" + (flashKind ? " " + flashKind : "")}></div>

        {phase === 'start' && (
          <div className="overlay">
            <div className="highscoreLine">Best: {best}</div>
            <button className="btn" data-testid="start-btn" onClick={startGame}>START</button>
          </div>
        )}

        {phase === 'over' && (
          <div className="overlay">
            <div className="title" style={{ marginTop: 0, fontSize: 22 }}>GRID LOCKED</div>
            <div className="hudValue" style={{ fontSize: 26 }}>{score}</div>
            <div className="highscoreLine">Best: {best}</div>
            <button className="btn" data-testid="start-btn" onClick={startGame}>RETRY</button>
          </div>
        )}
      </div>

      {phase === 'playing' && (
        <div className="dpad">
          <button className="dpadBtn dpadUp" data-testid="up-btn" onClick={() => commitMove('up')}>▲</button>
          <button className="dpadBtn dpadLeft" data-testid="left-btn" onClick={() => commitMove('left')}>◀</button>
          <button className="dpadBtn dpadDown" data-testid="down-btn" onClick={() => commitMove('down')}>▼</button>
          <button className="dpadBtn dpadRight" data-testid="right-btn" onClick={() => commitMove('right')}>▶</button>
        </div>
      )}

      <div className="status">{statusMsg}</div>
      <div className="footer">Neon Game Arcade</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
