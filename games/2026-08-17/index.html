<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Photon Drift</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05030d; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }
  #root { width: 100%; height: 100%; }

  .app {
    width: 100%; height: 100%; position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: center; overflow: hidden; gap: 8px;
    background: radial-gradient(circle at 50% 15%, #0e1a30 0%, #0a0a18 55%, #030109 100%);
  }

  .hud {
    position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-around;
    padding: 10px 12px; z-index: 15; pointer-events: none;
  }
  .hudBox { text-align: center; }
  .hudLabel { font-size: 10px; letter-spacing: 2px; color: #5ecfff; text-transform: uppercase; }
  .hudValue {
    font-size: 22px; font-weight: 800; color: #fff;
    text-shadow: 0 0 10px #5ecfff, 0 0 20px #5ecfff;
  }
  .hudValue.combo { color: #ffe45e; text-shadow: 0 0 10px #ffe45e, 0 0 22px #ff9d00; }
  .hudValue.lives { color: #ff5ee0; text-shadow: 0 0 10px #ff5ee0, 0 0 22px #c300a0; }
  .hudValue.hurt { animation: hurtPulse 0.4s ease; }
  @keyframes hurtPulse { 0%,100% { opacity:1; transform: scale(1);} 50% { opacity:0.4; transform: scale(1.25);} }

  .title {
    font-size: clamp(22px, 6vw, 34px); font-weight: 900; letter-spacing: 3px;
    background: linear-gradient(90deg, #5ecfff, #6bb2ff, #ff5ee0);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(90,190,255,0.6));
    animation: titlePulse 2.4s ease-in-out infinite;
    text-align: center;
  }
  @keyframes titlePulse { 0%,100% { filter: drop-shadow(0 0 12px rgba(90,190,255,0.6)); } 50% { filter: drop-shadow(0 0 26px rgba(90,190,255,0.95)); } }

  .subtitle { color: #b8cbe8; font-size: 14px; letter-spacing: 0.5px; text-align: center; max-width: 360px; line-height: 1.5; }

  .btn {
    padding: 15px 40px; font-size: 19px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(135deg, #1c8fff, #ff4ecb);
    border: none; border-radius: 50px; color: #fff; cursor: pointer;
    box-shadow: 0 0 20px rgba(60,150,255,0.7), 0 0 50px rgba(255,80,200,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(60,150,255,0.9), 0 0 70px rgba(255,80,200,0.5); }
  .btn:active { transform: scale(0.96); }

  .highscoreLine { color: #ffd35e; font-size: 14px; text-shadow: 0 0 8px rgba(255,200,50,0.6); }

  .arenaOuter {
    position: relative; width: min(94vw, 640px); height: min(64vh, 440px); z-index: 5;
    border-radius: 20px; overflow: hidden; border: 2px solid rgba(90,190,255,0.25);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 0 30px rgba(90,190,255,0.15);
    background: #06081a; cursor: pointer;
  }

  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .overlay {
    position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 20px;
    background: rgba(4, 6, 15, 0.85); backdrop-filter: blur(4px);
  }

  .status { color: #aec0e8; font-size: 13px; letter-spacing: 0.5px; height: 16px; z-index: 10; text-align: center; }

  .footer { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; color: #4a5a6a; font-size: 11px; z-index: 10; }

  @media (max-width: 480px) {
    .hudValue { font-size: 17px; }
    .btn { padding: 13px 30px; font-size: 16px; }
    .subtitle { font-size: 13px; }
    .arenaOuter { height: min(58vh, 440px); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const HS_KEY = 'photonDrift_highScore';
const SLED_RADIUS = 15;
const LIVES_START = 3;
const INVULN_MS = 900;
const DRIFT_RATE = 7.5; // higher = snappier follow, lower = floatier drift

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function useAudio() {
  const ctxRef = useRef(null);
  const getCtx = () => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  };

  const tone = useCallback((freq, duration, type, gainScale, freqEnd) => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + duration);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(gainScale, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.05);
    } catch (e) {}
  }, []);

  const collectSound = useCallback(() => tone(720, 0.1, 'triangle', 0.14, 1200), [tone]);
  const bonusSound = useCallback(() => tone(880, 0.16, 'square', 0.14, 1600), [tone]);
  const hitSound = useCallback(() => tone(140, 0.3, 'sawtooth', 0.22, 55), [tone]);
  const overSound = useCallback(() => {
    tone(320, 0.25, 'sawtooth', 0.2, 220);
    setTimeout(() => tone(200, 0.35, 'sawtooth', 0.2, 90), 150);
  }, [tone]);

  return { collectSound, bonusSound, hitSound, overSound };
}

function makeGameState() {
  return {
    bounds: { w: 640, h: 440 },
    player: { x: 320, y: 0, targetX: 320 },
    photons: [],
    hazards: [],
    particles: [],
    photonTimer: 500,
    hazardTimer: 900,
    elapsed: 0,
    invulnUntil: 0,
    shake: 0,
    fallSpeed: 130,
    running: false,
  };
}

function App() {
  const [phase, setPhase] = useState('start'); // start | playing | over
  const [score, setScore] = useState(0);
  const [lives, setLives] = useState(LIVES_START);
  const [combo, setCombo] = useState(0);
  const [hurt, setHurt] = useState(false);
  const [highScore, setHighScore] = useState(() => parseInt(localStorage.getItem(HS_KEY) || '0', 10));
  const [statusMsg, setStatusMsg] = useState('Move your finger or mouse to drift the sled.');

  const canvasRef = useRef(null);
  const arenaRef = useRef(null);
  const gs = useRef(makeGameState());
  const rafRef = useRef(null);
  const lastTsRef = useRef(0);
  const scoreRef = useRef(0);
  const comboRef = useRef(0);
  const livesRef = useRef(LIVES_START);
  const highScoreRef = useRef(highScore);
  const phaseRef = useRef('start');
  const { collectSound, bonusSound, hitSound, overSound } = useAudio();

  useEffect(() => { phaseRef.current = phase; }, [phase]);

  const resizeCanvas = useCallback(() => {
    const canvas = canvasRef.current;
    const arena = arenaRef.current;
    if (!canvas || !arena) return;
    const rect = arena.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    gs.current.bounds = { w: rect.width, h: rect.height };
    gs.current.player.y = rect.height - 56;
  }, []);

  useEffect(() => {
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    return () => window.removeEventListener('resize', resizeCanvas);
  }, [resizeCanvas]);

  const setTargetFromClientX = useCallback((clientX) => {
    const arena = arenaRef.current;
    if (!arena) return;
    const rect = arena.getBoundingClientRect();
    const x = clamp(clientX - rect.left, SLED_RADIUS, rect.width - SLED_RADIUS);
    gs.current.player.targetX = x;
  }, []);

  // Pointer (mouse + touch) analog drift control
  useEffect(() => {
    const arena = arenaRef.current;
    if (!arena) return;
    const onMove = (e) => { setTargetFromClientX(e.clientX); };
    const onDown = (e) => { setTargetFromClientX(e.clientX); };
    arena.addEventListener('pointermove', onMove);
    arena.addEventListener('pointerdown', onDown);
    return () => {
      arena.removeEventListener('pointermove', onMove);
      arena.removeEventListener('pointerdown', onDown);
    };
  }, [setTargetFromClientX]);

  // Keyboard fallback (accessibility)
  useEffect(() => {
    const down = (e) => {
      if (phaseRef.current !== 'playing') return;
      const step = 46;
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
        e.preventDefault();
        gs.current.player.targetX = clamp(gs.current.player.targetX - step, SLED_RADIUS, gs.current.bounds.w - SLED_RADIUS);
      } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
        e.preventDefault();
        gs.current.player.targetX = clamp(gs.current.player.targetX + step, SLED_RADIUS, gs.current.bounds.w - SLED_RADIUS);
      }
    };
    window.addEventListener('keydown', down, { passive: false });
    return () => window.removeEventListener('keydown', down);
  }, []);

  const spawnBurst = (arr, x, y, color, count, speedMin, speedMax, sizeMin, sizeMax, lifeMs) => {
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = speedMin + Math.random() * (speedMax - speedMin);
      arr.push({
        x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
        life: lifeMs, maxLife: lifeMs, color,
        size: sizeMin + Math.random() * (sizeMax - sizeMin),
      });
    }
  };

  const spawnPhoton = (state) => {
    const { w } = state.bounds;
    const bonus = Math.random() < 0.15;
    state.photons.push({
      x: 20 + Math.random() * (w - 40), y: -20, bonus,
      spin: Math.random() * Math.PI * 2,
    });
  };

  const spawnHazard = (state) => {
    const { w } = state.bounds;
    state.hazards.push({
      x: 20 + Math.random() * (w - 40), y: -24,
      rot: Math.random() * Math.PI * 2, spin: (Math.random() - 0.5) * 4,
      size: 12 + Math.random() * 8,
    });
  };

  const endGame = useCallback(() => {
    gs.current.running = false;
    phaseRef.current = 'over';
    setPhase('over');
    overSound();
    setStatusMsg('Sled destabilized.');
  }, [overSound]);

  const tick = useCallback((ts) => {
    const state = gs.current;
    if (!state.running) return;
    if (!lastTsRef.current) lastTsRef.current = ts;
    let dt = (ts - lastTsRef.current) / 1000;
    dt = Math.min(dt, 0.05);
    lastTsRef.current = ts;
    state.elapsed += dt * 1000;

    const { w, h } = state.bounds;
    const player = state.player;

    // analog drift toward pointer target (inertia, not snap)
    player.x += (player.targetX - player.x) * Math.min(1, dt * DRIFT_RATE);

    // difficulty ramp
    state.fallSpeed = 130 + Math.min(220, (state.elapsed / 1000) * 6);

    // spawn photons
    state.photonTimer -= dt * 1000;
    if (state.photonTimer <= 0) {
      spawnPhoton(state);
      const interval = Math.max(320, 620 - (state.elapsed / 1000) * 5);
      state.photonTimer = interval * (0.7 + Math.random() * 0.6);
    }

    // spawn hazards
    state.hazardTimer -= dt * 1000;
    if (state.hazardTimer <= 0) {
      spawnHazard(state);
      const interval = Math.max(480, 1000 - (state.elapsed / 1000) * 6);
      state.hazardTimer = interval * (0.7 + Math.random() * 0.6);
    }

    let scoreDelta = 0;

    // update photons
    for (let i = state.photons.length - 1; i >= 0; i--) {
      const ph = state.photons[i];
      ph.y += state.fallSpeed * dt;
      ph.spin += dt * 4;
      if (ph.y > h + 20) { state.photons.splice(i, 1); continue; }
      const dx = ph.x - player.x, dy = ph.y - player.y;
      if (dx * dx + dy * dy < (SLED_RADIUS + 12) * (SLED_RADIUS + 12)) {
        state.photons.splice(i, 1);
        comboRef.current += 1;
        setCombo(comboRef.current);
        const gained = (ph.bonus ? 30 : 10) + comboRef.current * 2;
        scoreDelta += gained;
        if (ph.bonus) bonusSound(); else collectSound();
        spawnBurst(state.particles, ph.x, ph.y, ph.bonus ? '#ffe45e' : '#5ecfff', ph.bonus ? 20 : 12, 40, 160, 2, 5, 500);
      }
    }

    // update hazards
    for (let i = state.hazards.length - 1; i >= 0; i--) {
      const hz = state.hazards[i];
      hz.y += state.fallSpeed * dt * 1.05;
      hz.rot += hz.spin * dt;
      if (hz.y > h + 30) { state.hazards.splice(i, 1); continue; }
      const dx = hz.x - player.x, dy = hz.y - player.y;
      const rad = SLED_RADIUS + hz.size * 0.6;
      if (ts >= state.invulnUntil && dx * dx + dy * dy < rad * rad) {
        state.hazards.splice(i, 1);
        state.invulnUntil = ts + INVULN_MS;
        state.shake = 12;
        comboRef.current = 0;
        setCombo(0);
        livesRef.current -= 1;
        setLives(livesRef.current);
        setHurt(true);
        setTimeout(() => setHurt(false), 400);
        hitSound();
        spawnBurst(state.particles, player.x, player.y, '#ff4d6d', 18, 60, 220, 2, 6, 550);
        if (livesRef.current <= 0) {
          if (scoreDelta) { scoreRef.current += scoreDelta; scoreDelta = 0; setScore(scoreRef.current); }
          endGame();
          return;
        }
      }
    }

    if (scoreDelta) {
      scoreRef.current += scoreDelta;
      if (scoreRef.current > highScoreRef.current) {
        highScoreRef.current = scoreRef.current;
        localStorage.setItem(HS_KEY, String(scoreRef.current));
        setHighScore(scoreRef.current);
      }
      setScore(scoreRef.current);
    }

    // particles
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const pt = state.particles[i];
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.vx *= 0.94; pt.vy *= 0.94;
      pt.life -= dt * 1000;
      if (pt.life <= 0) state.particles.splice(i, 1);
    }
    if (state.particles.length > 300) state.particles.splice(0, state.particles.length - 300);

    if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 40);

    draw(state, ts);
    rafRef.current = requestAnimationFrame(tick);
  }, [endGame, collectSound, bonusSound, hitSound]);

  const draw = (state, ts) => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const { w, h } = state.bounds;
    const player = state.player;

    ctx.save();
    if (state.shake > 0) {
      ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
    }

    ctx.fillStyle = 'rgba(6,8,26,0.35)';
    ctx.fillRect(-20, -20, w + 40, h + 40);

    // scrolling starfield-ish grid
    ctx.strokeStyle = 'rgba(90,150,255,0.05)';
    ctx.lineWidth = 1;
    const gridSize = 40;
    const offset = (state.elapsed * state.fallSpeed / 1000) % gridSize;
    for (let y = -gridSize + offset; y < h; y += gridSize) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }

    // photons
    for (const ph of state.photons) {
      const pulse = 1 + Math.sin(ph.spin) * 0.2;
      ctx.save();
      ctx.translate(ph.x, ph.y);
      ctx.rotate(ph.spin);
      ctx.fillStyle = ph.bonus ? '#ffe45e' : '#5ecfff';
      ctx.shadowColor = ph.bonus ? '#ffe45e' : '#5ecfff';
      ctx.shadowBlur = ph.bonus ? 20 : 14;
      const r = (ph.bonus ? 10 : 8) * pulse;
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * Math.PI * 2;
        const px = Math.cos(a) * r, py = Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        const a2 = a + Math.PI / 5;
        ctx.lineTo(Math.cos(a2) * r * 0.45, Math.sin(a2) * r * 0.45);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.shadowBlur = 0;

    // hazards (jagged comet shards)
    for (const hz of state.hazards) {
      ctx.save();
      ctx.translate(hz.x, hz.y);
      ctx.rotate(hz.rot);
      ctx.fillStyle = '#ff4d6d';
      ctx.shadowColor = '#ff4d6d';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      const spikes = 6;
      for (let i = 0; i < spikes; i++) {
        const a = (i / spikes) * Math.PI * 2;
        const r = i % 2 === 0 ? hz.size : hz.size * 0.45;
        const px = Math.cos(a) * r, py = Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.shadowBlur = 0;

    // particles
    for (const pt of state.particles) {
      ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // player sled
    const invuln = ts < state.invulnUntil;
    ctx.save();
    ctx.translate(player.x, player.y);
    if (invuln && Math.floor(ts / 90) % 2 === 0) ctx.globalAlpha = 0.4;
    const grad = ctx.createRadialGradient(0, 0, 2, 0, 0, SLED_RADIUS + 8);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.45, '#5ecfff');
    grad.addColorStop(1, '#1c5fff');
    ctx.fillStyle = grad;
    ctx.shadowColor = '#5ecfff';
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.moveTo(0, -SLED_RADIUS * 1.3);
    ctx.lineTo(SLED_RADIUS, SLED_RADIUS * 0.9);
    ctx.lineTo(0, SLED_RADIUS * 0.4);
    ctx.lineTo(-SLED_RADIUS, SLED_RADIUS * 0.9);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    ctx.restore();
  };

  const startGame = () => {
    resizeCanvas();
    const state = makeGameState();
    state.bounds = gs.current.bounds;
    state.player.x = state.bounds.w / 2;
    state.player.targetX = state.bounds.w / 2;
    state.player.y = state.bounds.h - 56;
    state.running = true;
    gs.current = state;
    scoreRef.current = 0;
    comboRef.current = 0;
    livesRef.current = LIVES_START;
    lastTsRef.current = 0;
    setScore(0);
    setCombo(0);
    setLives(LIVES_START);
    setStatusMsg('Move your finger or mouse to drift the sled.');
    setPhase('playing');
    phaseRef.current = 'playing';
    cancelAnimationFrame(rafRef.current);
    rafRef.current = requestAnimationFrame(tick);
  };

  useEffect(() => () => cancelAnimationFrame(rafRef.current), []);

  return (
    <div className="app" data-testid="game-canvas">
      <div className="hud">
        <div className="hudBox">
          <div className="hudLabel">Score</div>
          <div className="hudValue" data-testid="score">{score}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Lives</div>
          <div className={`hudValue lives ${hurt ? 'hurt' : ''}`} data-testid="lives">{'❤'.repeat(Math.max(0, lives))}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Combo</div>
          <div className="hudValue combo" data-testid="combo">x{combo}</div>
        </div>
      </div>

      <div className="title" style={{ marginTop: 36 }}>PHOTON DRIFT</div>

      <div className="arenaOuter" ref={arenaRef} data-testid="play-field">
        <canvas ref={canvasRef} data-testid="arena" />

        {phase === 'start' && (
          <div className="overlay">
            <div className="subtitle">Your sled drifts smoothly toward your finger or cursor.<br />Weave to catch cyan photons and rare gold bonuses.<br />Dodge the crimson comet shards falling from above!</div>
            <div className="highscoreLine" data-testid="high-score">Best: {highScore}</div>
            <button className="btn" data-testid="start-btn" onClick={startGame}>START</button>
          </div>
        )}

        {phase === 'over' && (
          <div className="overlay">
            <div className="title" style={{ fontSize: 'clamp(20px, 6vw, 30px)' }}>SLED DESTABILIZED</div>
            <div className="hudValue" data-testid="final-score">Score: {score}</div>
            <div className="highscoreLine" data-testid="high-score-final">Best: {highScore}</div>
            <button className="btn" data-testid="restart-btn" onClick={startGame}>PLAY AGAIN</button>
          </div>
        )}
      </div>

      <div className="status">{statusMsg}</div>
      <div className="footer">Photon Drift — drift to collect photons, dodge comet shards</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
