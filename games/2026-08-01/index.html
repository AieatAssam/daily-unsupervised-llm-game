<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pulse Relay</title><script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><style>*{box-sizing:border-box}html,body,#root{margin:0;height:100%;overflow:hidden}body{font:16px system-ui;color:#effcff;background:radial-gradient(circle at 50% 25%,#402060,#070713 70%);user-select:none;touch-action:none}.app{height:100%;display:flex;flex-direction:column;padding:12px}.hud{display:flex;justify-content:space-around;text-align:center;color:#d1a7ff}.label{font-size:10px;letter-spacing:2px;opacity:.7}.value{font-size:22px;font-weight:800;text-shadow:0 0 12px #d16bff}.stage{position:relative;flex:1;min-height:0;border:1px solid #7f46a5;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 35px #c04dff33}.beam{width:min(72vw,420px);height:26px;border-radius:20px;margin:20px;box-shadow:0 0 30px currentColor;background:currentColor;transition:color .15s}.pads{display:grid;grid-template-columns:repeat(2,min(32vw,170px));gap:14px}.pad{height:min(28vw,140px);border-radius:22px;border:3px solid currentColor;background:#ffffff10;color:#fff;font-size:18px;font-weight:800;cursor:pointer;box-shadow:inset 0 0 30px #ffffff12,0 0 14px #ffffff22}.pad:active{transform:scale(.96)}.cyan{color:#00eaff}.pink{color:#ff55c7}.lime{color:#71ff85}.gold{color:#ffd34d}.overlay{position:absolute;inset:0;background:#070713e8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}.title{font-size:clamp(40px,11vw,76px);margin:0;color:#e68cff;text-shadow:0 0 22px #c34dff;letter-spacing:5px}.copy{max-width:520px;line-height:1.6;color:#e2c9ff}.btn{min-height:52px;padding:12px 38px;border:2px solid #e68cff;border-radius:30px;background:#d16bff18;color:#fff;font-size:20px;font-weight:800;letter-spacing:3px}</style></head><body><div id="root"></div><script type="text/babel">const{useState,useEffect}=React;const KEY='pulseRelayHighScore',colors=['cyan','pink','lime','gold'],labels=['CYAN','PINK','LIME','GOLD'];function App(){const[screen,setScreen]=useState('start'),[target,setTarget]=useState(0),[score,setScore]=useState(0),[best,setBest]=useState(()=>+localStorage.getItem(KEY)||0),[lives,setLives]=useState(3),[streak,setStreak]=useState(0),[flash,setFlash]=useState('');function start(){setScreen('play');setScore(0);setLives(3);setStreak(0);setTarget(Math.floor(Math.random()*4))}useEffect(()=>{if(screen!=='play')return;const id=setInterval(()=>setTarget(t=>{let n=Math.floor(Math.random()*4);while(n===t)n=Math.floor(Math.random()*4);return n}),Math.max(850,2200-streak*90));return()=>clearInterval(id)},[screen,streak]);function hit(i){if(screen!=='play')return;if(i===target){const s=score+10+streak*2;setScore(s);setBest(b=>Math.max(b,s));setStreak(x=>x+1);setFlash('PERFECT');setTarget(Math.floor(Math.random()*4))}else{setLives(x=>x-1);setStreak(0);setFlash('MISS');if(lives<=1)setScreen('over')}setTimeout(()=>setFlash(''),350)}useEffect(()=>{localStorage.setItem(KEY,String(best));const f=e=>{const k={'1':0,'2':1,'3':2,'4':3}[e.key];if(k!==undefined)hit(k)};addEventListener('keydown',f);return()=>removeEventListener('keydown',f)},[best,target,score,screen,lives,streak]);return <div className="app"><div className="hud"><div><div className="label">SCORE</div><div className="value">{score}</div></div><div><div className="label">STREAK</div><div className="value">{streak}</div></div><div><div className="label">LIVES</div><div className="value">{'♥'.repeat(lives)}{'♡'.repeat(3-lives)}</div></div><div><div className="label">BEST</div><div className="value">{best}</div></div></div><div className="stage"><div className={'beam '+colors[target]}></div><div className="pads">{colors.map((c,i)=><button key={c} className={'pad '+c} onClick={()=>hit(i)} data-testid={'pad-'+i}>{labels[i]}<br/><small>{i+1}</small></button>)}</div>{flash&&<div style={{position:'absolute',top:'20%',fontSize:30,fontWeight:900,color:flash==='MISS'?'#ff5577':'#fff'}}>{flash}</div>}{screen==='start'&&<div className="overlay"><h1 className="title">PULSE RELAY</h1><p className="copy">Match the incoming beam to its color pad. Correct relays build a streak; wrong transmissions burn a life. The relay speeds up as your streak grows.</p><button className="btn" data-testid="start-btn" onClick={start}>START</button><p>Click/tap a pad or press 1–4</p></div>}{screen==='over'&&<div className="overlay"><h1 className="title" style={{fontSize:42}}>SIGNAL LOST</h1><p className="copy">Final score: <b>{score}</b></p><button className="btn" data-testid="start-btn" onClick={start}>RECONNECT</button></div>}</div></div>}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
