<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Gridlock Glow</title><script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><style>*{box-sizing:border-box}html,body,#root{margin:0;height:100%;overflow:hidden}body{background:radial-gradient(circle,#18244c,#070912 75%);color:#effcff;font:16px system-ui;user-select:none;touch-action:none}.app{height:100%;display:flex;flex-direction:column;padding:12px}.hud{display:flex;justify-content:space-around;text-align:center;color:#8ceeff}.label{font-size:10px;letter-spacing:2px;opacity:.7}.value{font-size:22px;font-weight:800;text-shadow:0 0 12px #00eaff}.board{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;border:1px solid #285c8a;border-radius:18px;box-shadow:0 0 30px #00eaff33}.grid{display:grid;grid-template-columns:repeat(5,min(15vw,80px));gap:8px}.cell{aspect-ratio:1;border:1px solid #245374;border-radius:12px;background:#0d1830;color:#60dfff;font-size:22px;cursor:pointer}.cell.goal{background:#ffce3a;color:#211500;box-shadow:0 0 22px #ffce3a}.cell.player{background:#00c9ed;color:#04121e;box-shadow:0 0 20px #00eaff}.overlay{position:absolute;inset:0;background:#050713e8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}.title{font-size:clamp(36px,10vw,68px);margin:0;color:#7af4ff;text-shadow:0 0 20px #00eaff;letter-spacing:4px}.copy{max-width:520px;line-height:1.6;color:#b9d9ff}.btn{min-height:52px;padding:12px 38px;border:2px solid #00eaff;border-radius:30px;background:#00eaff18;color:white;font-size:20px;font-weight:800;letter-spacing:3px}.pad{display:flex;gap:8px;justify-content:center;margin:12px}.pad button{width:52px;height:52px;border:1px solid #55eaff;border-radius:12px;background:#0e2946;color:#bdf8ff;font-size:22px}</style></head><body><div id="root"></div><script type="text/babel">const{useState,useEffect}=React;const KEY='gridlockGlowHighScore';
function App(){const[start,setStart]=useState(false),[over,setOver]=useState(false),[pos,setPos]=useState([2,2]),[goal,setGoal]=useState([0,0]),[score,setScore]=useState(0),[best,setBest]=useState(()=>+localStorage.getItem(KEY)||0),[lives,setLives]=useState(3),[timeLeft,setTimeLeft]=useState(7000);const deadline=s=>Math.max(2800,7000-Math.floor(s/50)*500);function begin(){setStart(true);setOver(false);setPos([2,2]);setGoal([0,0]);setScore(0);setLives(3);setTimeLeft(7000)}function move(dr,dc){if(!start||over||Math.abs(dr)+Math.abs(dc)!==1)return;setPos(p=>{const n=[Math.max(0,Math.min(4,p[0]+dr)),Math.max(0,Math.min(4,p[1]+dc))];if(n[0]===goal[0]&&n[1]===goal[1]){const s=score+10;setScore(s);setBest(b=>Math.max(b,s));setTimeLeft(deadline(s));let g=[Math.floor(Math.random()*5),Math.floor(Math.random()*5)];while(g[0]===n[0]&&g[1]===n[1])g=[Math.floor(Math.random()*5),Math.floor(Math.random()*5)];setGoal(g)}return n})}useEffect(()=>{const f=e=>{const m={ArrowUp:[-1,0],w:[-1,0],ArrowDown:[1,0],s:[1,0],ArrowLeft:[0,-1],a:[0,-1],ArrowRight:[0,1],d:[0,1]}[e.key];if(m){e.preventDefault();move(...m)}};addEventListener('keydown',f);return()=>removeEventListener('keydown',f)},[start,over,goal,score]);useEffect(()=>{if(start&&!over){const id=setInterval(()=>setTimeLeft(t=>{if(t>250)return t-250;setLives(l=>{if(l<=1){setOver(true);return 0}return l-1});return deadline(score)}),250);return()=>clearInterval(id)}},[start,over,score]);return <div className="app"><div className="hud"><div><div className="label">SCORE</div><div className="value">{score}</div></div><div><div className="label">LIVES</div><div className="value">{'♥'.repeat(lives)}{'♡'.repeat(3-lives)}</div></div><div><div className="label">BEST</div><div className="value">{best}</div></div></div><div className="board"><div><div className="grid">{Array.from({length:25},(_,i)=>{const r=Math.floor(i/5),c=i%5;return <button key={i} className={'cell '+(pos[0]===r&&pos[1]===c?'player ':'')+(goal[0]===r&&goal[1]===c?'goal':'')} onClick={()=>move(r-pos[0],c-pos[1])}>{pos[0]===r&&pos[1]===c?'◆':goal[0]===r&&goal[1]===c?'✦':''}</button>})}</div><div className="pad"><button onClick={()=>move(-1,0)}>↑</button><button onClick={()=>move(0,-1)}>←</button><button onClick={()=>move(1,0)}>↓</button><button onClick={()=>move(0,1)}>→</button></div></div>{!start&&!over&&<div className="overlay"><h1 className="title">GRIDLOCK GLOW</h1><p className="copy">Navigate the neon courier across the grid. Reach the golden beacon before the reactor clock drains your lives.</p><button className="btn" data-testid="start-btn" onClick={begin}>START</button></div>}{over&&<div className="overlay"><h1 className="title" style={{fontSize:42}}>GRID LOCKED</h1><p className="copy">Final score: <b>{score}</b></p><button className="btn" data-testid="start-btn" onClick={begin}>TRY AGAIN</button></div>}</div></div>}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
<script>localStorage.setItem('gridlockGlowHighScore',localStorage.getItem('gridlockGlowHighScore')||'0');</script>
