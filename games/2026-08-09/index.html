<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Neon Bastion</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05030d; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }
  #root { width: 100%; height: 100%; }

  .app {
    width: 100%; height: 100%; position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: center; overflow: hidden; gap: 8px;
    background: radial-gradient(circle at 50% 30%, #131a2b 0%, #0a0a18 55%, #030109 100%);
  }

  .hud {
    position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-around;
    padding: 10px 12px; z-index: 15; pointer-events: none;
  }
  .hudBox { text-align: center; }
  .hudLabel { font-size: 10px; letter-spacing: 2px; color: #6bd0c9; text-transform: uppercase; }
  .hudValue {
    font-size: 22px; font-weight: 800; color: #fff;
    text-shadow: 0 0 10px #4dffe0, 0 0 20px #4dffe0;
  }
  .hudValue.combo { color: #ffe45e; text-shadow: 0 0 10px #ffe45e, 0 0 22px #ff9d00; }
  .hudValue.lives { color: #ff5e7d; text-shadow: 0 0 10px #ff5e7d, 0 0 22px #ff0033; }
  .hudValue.hurt { animation: hurtPulse 0.4s ease; }
  @keyframes hurtPulse { 0%,100% { opacity:1; transform: scale(1);} 50% { opacity:0.4; transform: scale(1.25);} }

  .title {
    font-size: clamp(24px, 6vw, 38px); font-weight: 900; letter-spacing: 3px;
    background: linear-gradient(90deg, #2be9ff, #4dff9e, #ffe45e);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(80,255,220,0.6));
    animation: titlePulse 2.4s ease-in-out infinite;
    text-align: center;
  }
  @keyframes titlePulse { 0%,100% { filter: drop-shadow(0 0 12px rgba(80,255,220,0.6)); } 50% { filter: drop-shadow(0 0 26px rgba(80,255,220,0.95)); } }

  .subtitle { color: #9fd6cf; font-size: 14px; letter-spacing: 0.5px; text-align: center; max-width: 340px; line-height: 1.5; }

  .btn {
    padding: 15px 40px; font-size: 19px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(135deg, #14d6b0, #2a6bff);
    border: none; border-radius: 50px; color: #fff; cursor: pointer;
    box-shadow: 0 0 20px rgba(30,210,180,0.7), 0 0 50px rgba(40,100,255,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(30,210,180,0.9), 0 0 70px rgba(40,100,255,0.5); }
  .btn:active { transform: scale(0.96); }

  .highscoreLine { color: #ffd35e; font-size: 14px; text-shadow: 0 0 8px rgba(255,200,50,0.6); }

  .arenaOuter {
    position: relative; width: min(94vw, 640px); height: min(64vh, 480px); z-index: 5;
    border-radius: 20px; overflow: hidden; border: 2px solid rgba(80,220,200,0.25);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 0 30px rgba(40,220,180,0.15);
    background: #060812;
  }

  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .overlay {
    position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 20px;
    background: rgba(5, 6, 13, 0.85); backdrop-filter: blur(4px);
  }

  .status { color: #9fe0d6; font-size: 13px; letter-spacing: 0.5px; height: 16px; z-index: 10; text-align: center; }

  .footer { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; color: #4a6a63; font-size: 11px; z-index: 10; }

  @media (max-width: 480px) {
    .hudValue { font-size: 17px; }
    .btn { padding: 13px 30px; font-size: 16px; }
    .subtitle { font-size: 13px; }
    .arenaOuter { height: min(58vh, 480px); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const HS_KEY = 'neonBastion_highScore';
const SHIP_RADIUS = 13;
const SHIP_MAX_SPEED = 250;
const SHIP_ACCEL = 1100;
const BULLET_SPEED = 520;
const BULLET_RADIUS = 4;
const ENEMY_RADIUS = 12;
const LIVES_START = 3;
const INVULN_MS = 1200;
const JOY_MAX_RADIUS = 55;

function dist(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function useAudio() {
  const ctxRef = useRef(null);
  const getCtx = () => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  };

  const tone = useCallback((freq, duration, type, gainScale, freqEnd) => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + duration);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(gainScale, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.05);
    } catch (e) {}
  }, []);

  const laserSound = useCallback(() => tone(720, 0.08, 'square', 0.06, 420), [tone]);
  const killSound = useCallback(() => tone(300, 0.18, 'sawtooth', 0.16, 90), [tone]);
  const hitSound = useCallback(() => tone(140, 0.3, 'sawtooth', 0.22, 60), [tone]);
  const pickupSound = useCallback(() => { tone(500, 0.12, 'triangle', 0.18, 900); }, [tone]);
  const overSound = useCallback(() => {
    tone(320, 0.25, 'sawtooth', 0.2, 220);
    setTimeout(() => tone(200, 0.35, 'sawtooth', 0.2, 90), 150);
  }, [tone]);

  return { laserSound, killSound, hitSound, pickupSound, overSound };
}

function makeGameState() {
  return {
    bounds: { w: 640, h: 480 },
    ship: { x: 320, y: 240, vx: 0, vy: 0, angle: 0 },
    bullets: [],
    enemies: [],
    particles: [],
    pickups: [],
    keys: {},
    joystick: { active: false, ox: 0, oy: 0, cx: 0, cy: 0, pointerId: null },
    lastFire: 0,
    spawnTimer: 0,
    pickupTimer: 6000,
    startTime: 0,
    invulnUntil: 0,
    rapidUntil: 0,
    shake: 0,
    wave: 1,
    running: false,
  };
}

function App() {
  const [phase, setPhase] = useState('start'); // start | playing | over
  const [score, setScore] = useState(0);
  const [lives, setLives] = useState(LIVES_START);
  const [combo, setCombo] = useState(0);
  const [wave, setWave] = useState(1);
  const [hurt, setHurt] = useState(false);
  const [highScore, setHighScore] = useState(() => parseInt(localStorage.getItem(HS_KEY) || '0', 10));
  const [statusMsg, setStatusMsg] = useState('Dodge the swarm. Auto-fire handles the rest.');

  const canvasRef = useRef(null);
  const arenaRef = useRef(null);
  const gs = useRef(makeGameState());
  const rafRef = useRef(null);
  const lastTsRef = useRef(0);
  const scoreRef = useRef(0);
  const comboRef = useRef(0);
  const livesRef = useRef(LIVES_START);
  const highScoreRef = useRef(highScore);
  const phaseRef = useRef('start');
  const { laserSound, killSound, hitSound, pickupSound, overSound } = useAudio();

  useEffect(() => { phaseRef.current = phase; }, [phase]);

  const resizeCanvas = useCallback(() => {
    const canvas = canvasRef.current;
    const arena = arenaRef.current;
    if (!canvas || !arena) return;
    const rect = arena.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    gs.current.bounds = { w: rect.width, h: rect.height };
  }, []);

  useEffect(() => {
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    return () => window.removeEventListener('resize', resizeCanvas);
  }, [resizeCanvas]);

  // Keyboard input
  useEffect(() => {
    const down = (e) => {
      if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyW','KeyA','KeyS','KeyD'].includes(e.code)) e.preventDefault();
      gs.current.keys[e.code] = true;
    };
    const up = (e) => { gs.current.keys[e.code] = false; };
    window.addEventListener('keydown', down, { passive: false });
    window.addEventListener('keyup', up);
    return () => { window.removeEventListener('keydown', down); window.removeEventListener('keyup', up); };
  }, []);

  // Pointer (mouse+touch) joystick
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const getLocal = (e) => {
      const rect = canvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    };
    const onDown = (e) => {
      const p = getLocal(e);
      gs.current.joystick = { active: true, ox: p.x, oy: p.y, cx: p.x, cy: p.y, pointerId: e.pointerId };
      canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
    };
    const onMove = (e) => {
      const j = gs.current.joystick;
      if (!j.active || e.pointerId !== j.pointerId) return;
      const p = getLocal(e);
      j.cx = p.x; j.cy = p.y;
    };
    const onUp = (e) => {
      const j = gs.current.joystick;
      if (j.pointerId === e.pointerId) gs.current.joystick = { active: false, ox: 0, oy: 0, cx: 0, cy: 0, pointerId: null };
    };
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('pointerleave', onUp);
    return () => {
      canvas.removeEventListener('pointerdown', onDown);
      canvas.removeEventListener('pointermove', onMove);
      canvas.removeEventListener('pointerup', onUp);
      canvas.removeEventListener('pointercancel', onUp);
      canvas.removeEventListener('pointerleave', onUp);
    };
  }, []);

  const spawnBurst = (arr, x, y, color, count, speedMin, speedMax, sizeMin, sizeMax, lifeMs) => {
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = speedMin + Math.random() * (speedMax - speedMin);
      arr.push({
        x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
        life: lifeMs, maxLife: lifeMs, color,
        size: sizeMin + Math.random() * (sizeMax - sizeMin),
      });
    }
  };

  const spawnEnemy = (state) => {
    const { w, h } = state.bounds;
    const edge = Math.floor(Math.random() * 4);
    let x, y;
    if (edge === 0) { x = -20; y = Math.random() * h; }
    else if (edge === 1) { x = w + 20; y = Math.random() * h; }
    else if (edge === 2) { x = Math.random() * w; y = -20; }
    else { x = Math.random() * w; y = h + 20; }
    const elapsedSec = (state.elapsed || 0) / 1000;
    const speed = 55 + Math.min(120, elapsedSec * 2.2) + Math.random() * 25;
    const ang = Math.atan2(state.ship.y - y, state.ship.x - x);
    state.enemies.push({
      x, y, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed,
      speed, hue: 320 + Math.random() * 60,
    });
  };

  const spawnPickup = (state) => {
    const { w, h } = state.bounds;
    const margin = 50;
    state.pickups.push({
      x: margin + Math.random() * (w - margin * 2),
      y: margin + Math.random() * (h - margin * 2),
      life: 8000, maxLife: 8000, pulse: 0,
    });
  };

  const endGame = useCallback(() => {
    gs.current.running = false;
    phaseRef.current = 'over';
    setPhase('over');
    overSound();
    setStatusMsg('Bastion breached.');
  }, [overSound]);

  const tick = useCallback((ts) => {
    const state = gs.current;
    if (!state.running) return;
    if (!lastTsRef.current) lastTsRef.current = ts;
    let dt = (ts - lastTsRef.current) / 1000;
    dt = Math.min(dt, 0.05);
    lastTsRef.current = ts;
    state.elapsed = (state.elapsed || 0) + dt * 1000;

    const { w, h } = state.bounds;
    const ship = state.ship;

    // --- movement input ---
    let dx = 0, dy = 0;
    const k = state.keys;
    if (k['ArrowLeft'] || k['KeyA']) dx -= 1;
    if (k['ArrowRight'] || k['KeyD']) dx += 1;
    if (k['ArrowUp'] || k['KeyW']) dy -= 1;
    if (k['ArrowDown'] || k['KeyS']) dy += 1;
    if (state.joystick.active) {
      const jx = state.joystick.cx - state.joystick.ox;
      const jy = state.joystick.cy - state.joystick.oy;
      const jd = Math.sqrt(jx * jx + jy * jy);
      if (jd > 4) {
        const clampD = Math.min(jd, JOY_MAX_RADIUS);
        dx = (jx / jd) * (clampD / JOY_MAX_RADIUS);
        dy = (jy / jd) * (clampD / JOY_MAX_RADIUS);
      } else { dx = 0; dy = 0; }
    } else {
      const len = Math.sqrt(dx * dx + dy * dy);
      if (len > 0) { dx /= len; dy /= len; }
    }

    ship.vx += dx * SHIP_ACCEL * dt;
    ship.vy += dy * SHIP_ACCEL * dt;
    const inputActive = dx !== 0 || dy !== 0;
    if (!inputActive) {
      const decay = Math.exp(-6 * dt);
      ship.vx *= decay; ship.vy *= decay;
    }
    const spd = Math.sqrt(ship.vx * ship.vx + ship.vy * ship.vy);
    if (spd > SHIP_MAX_SPEED) { ship.vx = (ship.vx / spd) * SHIP_MAX_SPEED; ship.vy = (ship.vy / spd) * SHIP_MAX_SPEED; }
    if (inputActive) ship.angle = Math.atan2(dy, dx);

    ship.x = clamp(ship.x + ship.vx * dt, SHIP_RADIUS, w - SHIP_RADIUS);
    ship.y = clamp(ship.y + ship.vy * dt, SHIP_RADIUS, h - SHIP_RADIUS);

    // --- wave / difficulty ---
    const waveNum = Math.floor(state.elapsed / 15000) + 1;
    if (waveNum !== state.wave) { state.wave = waveNum; setWave(waveNum); setStatusMsg(`Wave ${waveNum} incoming!`); }

    // --- spawn enemies ---
    state.spawnTimer -= dt * 1000;
    if (state.spawnTimer <= 0 && state.enemies.length < 90) {
      spawnEnemy(state);
      const interval = Math.max(320, 1300 - (state.elapsed / 1000) * 9);
      state.spawnTimer = interval * (0.7 + Math.random() * 0.6);
    }

    // --- spawn pickups ---
    state.pickupTimer -= dt * 1000;
    if (state.pickupTimer <= 0 && state.pickups.length < 2) {
      spawnPickup(state);
      state.pickupTimer = 7000 + Math.random() * 4000;
    }

    // --- auto-fire ---
    let fireInterval = Math.max(140, 360 - state.wave * 14);
    if (ts < state.rapidUntil) fireInterval *= 0.5;
    if (state.enemies.length > 0 && ts - state.lastFire >= fireInterval) {
      let nearest = null, nd = Infinity;
      for (const en of state.enemies) {
        const d = dist(ship.x, ship.y, en.x, en.y);
        if (d < nd) { nd = d; nearest = en; }
      }
      if (nearest) {
        const ang = Math.atan2(nearest.y - ship.y, nearest.x - ship.x);
        state.bullets.push({ x: ship.x, y: ship.y, vx: Math.cos(ang) * BULLET_SPEED, vy: Math.sin(ang) * BULLET_SPEED, life: 1400 });
        state.lastFire = ts;
        laserSound();
      }
    }
    if (state.bullets.length > 60) state.bullets.splice(0, state.bullets.length - 60);

    // --- update bullets ---
    for (let i = state.bullets.length - 1; i >= 0; i--) {
      const b = state.bullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt * 1000;
      if (b.life <= 0 || b.x < -30 || b.x > w + 30 || b.y < -30 || b.y > h + 30) { state.bullets.splice(i, 1); continue; }
    }

    // --- update enemies + collisions ---
    let scoreDelta = 0;
    for (let i = state.enemies.length - 1; i >= 0; i--) {
      const en = state.enemies[i];
      const toShipAng = Math.atan2(ship.y - en.y, ship.x - en.x);
      en.vx += (Math.cos(toShipAng) * en.speed - en.vx) * Math.min(1, dt * 1.2);
      en.vy += (Math.sin(toShipAng) * en.speed - en.vy) * Math.min(1, dt * 1.2);
      en.x += en.vx * dt; en.y += en.vy * dt;

      let hit = false;
      for (let j = state.bullets.length - 1; j >= 0; j--) {
        const b = state.bullets[j];
        if (dist(b.x, b.y, en.x, en.y) < ENEMY_RADIUS + BULLET_RADIUS) {
          state.bullets.splice(j, 1);
          hit = true;
          break;
        }
      }
      if (hit) {
        spawnBurst(state.particles, en.x, en.y, `hsl(${en.hue},100%,65%)`, 12, 40, 180, 2, 5, 500);
        state.enemies.splice(i, 1);
        comboRef.current += 1;
        setCombo(comboRef.current);
        const gained = Math.round((10 + comboRef.current * 3) * (1 + (state.wave - 1) * 0.06));
        scoreDelta += gained;
        killSound();
        continue;
      }

      if (ts >= state.invulnUntil && dist(ship.x, ship.y, en.x, en.y) < ENEMY_RADIUS + SHIP_RADIUS) {
        state.enemies.splice(i, 1);
        state.invulnUntil = ts + INVULN_MS;
        state.shake = 12;
        comboRef.current = 0;
        setCombo(0);
        livesRef.current -= 1;
        setLives(livesRef.current);
        setHurt(true);
        setTimeout(() => setHurt(false), 400);
        hitSound();
        spawnBurst(state.particles, ship.x, ship.y, '#ff4d6d', 18, 60, 220, 2, 6, 550);
        if (livesRef.current <= 0) {
          if (scoreDelta) { scoreRef.current += scoreDelta; scoreDelta = 0; setScore(scoreRef.current); }
          endGame();
          return;
        }
      }
    }
    if (scoreDelta) {
      scoreRef.current += scoreDelta;
      if (scoreRef.current > highScoreRef.current) {
        highScoreRef.current = scoreRef.current;
        localStorage.setItem(HS_KEY, String(scoreRef.current));
        setHighScore(scoreRef.current);
      }
      setScore(scoreRef.current);
    }

    // --- pickups ---
    for (let i = state.pickups.length - 1; i >= 0; i--) {
      const p = state.pickups[i];
      p.life -= dt * 1000;
      p.pulse += dt;
      if (p.life <= 0) { state.pickups.splice(i, 1); continue; }
      if (dist(ship.x, ship.y, p.x, p.y) < ENEMY_RADIUS + SHIP_RADIUS + 4) {
        state.pickups.splice(i, 1);
        state.rapidUntil = ts + 4500;
        scoreRef.current += 40;
        setScore(scoreRef.current);
        pickupSound();
        setStatusMsg('Overcharge! Rapid fire!');
        spawnBurst(state.particles, p.x, p.y, '#ffe45e', 16, 40, 160, 2, 5, 600);
      }
    }

    // --- particles ---
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const pt = state.particles[i];
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.vx *= 0.94; pt.vy *= 0.94;
      pt.life -= dt * 1000;
      if (pt.life <= 0) state.particles.splice(i, 1);
    }
    if (state.particles.length > 400) state.particles.splice(0, state.particles.length - 400);

    if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 40);

    draw(state, ts);
    rafRef.current = requestAnimationFrame(tick);
  }, [endGame, laserSound, killSound, hitSound, pickupSound]);

  const draw = (state, ts) => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const { w, h } = state.bounds;

    ctx.save();
    if (state.shake > 0) {
      ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
    }

    ctx.fillStyle = 'rgba(6,8,18,0.32)';
    ctx.fillRect(-20, -20, w + 40, h + 40);

    // faint grid
    ctx.strokeStyle = 'rgba(80,220,200,0.05)';
    ctx.lineWidth = 1;
    const gridSize = 40;
    for (let x = 0; x < w; x += gridSize) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
    for (let y = 0; y < h; y += gridSize) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }

    // pickups
    for (const p of state.pickups) {
      const pulse = 1 + Math.sin(p.pulse * 6) * 0.2;
      const alpha = p.life < 1500 ? Math.max(0.2, p.life / 1500) : 1;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#ffe45e';
      ctx.shadowColor = '#ffe45e';
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 9 * pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }

    // particles
    for (const pt of state.particles) {
      ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // bullets
    ctx.strokeStyle = '#7cf9ff';
    ctx.shadowColor = '#7cf9ff';
    ctx.shadowBlur = 10;
    ctx.lineWidth = 3;
    for (const b of state.bullets) {
      ctx.beginPath();
      ctx.moveTo(b.x - b.vx * 0.02, b.y - b.vy * 0.02);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;

    // enemies
    for (const en of state.enemies) {
      const ang = Math.atan2(en.vy, en.vx);
      ctx.save();
      ctx.translate(en.x, en.y);
      ctx.rotate(ang);
      ctx.fillStyle = `hsl(${en.hue},100%,60%)`;
      ctx.shadowColor = `hsl(${en.hue},100%,60%)`;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(ENEMY_RADIUS, 0);
      ctx.lineTo(-ENEMY_RADIUS * 0.8, ENEMY_RADIUS * 0.8);
      ctx.lineTo(-ENEMY_RADIUS * 0.4, 0);
      ctx.lineTo(-ENEMY_RADIUS * 0.8, -ENEMY_RADIUS * 0.8);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.shadowBlur = 0;

    // ship
    const ship = state.ship;
    const invuln = ts < state.invulnUntil;
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.angle);
    if (invuln && Math.floor(ts / 90) % 2 === 0) ctx.globalAlpha = 0.4;
    ctx.fillStyle = '#4dffe0';
    ctx.shadowColor = '#4dffe0';
    ctx.shadowBlur = 16;
    ctx.beginPath();
    ctx.moveTo(SHIP_RADIUS + 4, 0);
    ctx.lineTo(-SHIP_RADIUS, SHIP_RADIUS);
    ctx.lineTo(-SHIP_RADIUS * 0.4, 0);
    ctx.lineTo(-SHIP_RADIUS, -SHIP_RADIUS);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    if (ts < state.rapidUntil) {
      ctx.strokeStyle = 'rgba(255,228,94,0.7)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(ship.x, ship.y, SHIP_RADIUS + 8, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  };

  const startGame = () => {
    resizeCanvas();
    const state = makeGameState();
    state.bounds = gs.current.bounds;
    state.ship.x = state.bounds.w / 2;
    state.ship.y = state.bounds.h / 2;
    state.startTime = performance.now();
    state.running = true;
    gs.current = state;
    scoreRef.current = 0;
    comboRef.current = 0;
    livesRef.current = LIVES_START;
    lastTsRef.current = 0;
    setScore(0);
    setCombo(0);
    setLives(LIVES_START);
    setWave(1);
    setStatusMsg('Dodge the swarm. Auto-fire handles the rest.');
    setPhase('playing');
    phaseRef.current = 'playing';
    cancelAnimationFrame(rafRef.current);
    rafRef.current = requestAnimationFrame(tick);
  };

  useEffect(() => () => cancelAnimationFrame(rafRef.current), []);

  return (
    <div className="app" data-testid="game-canvas">
      <div className="hud">
        <div className="hudBox">
          <div className="hudLabel">Score</div>
          <div className="hudValue" data-testid="score">{score}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Wave</div>
          <div className="hudValue" data-testid="wave">{wave}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Lives</div>
          <div className={`hudValue lives ${hurt ? 'hurt' : ''}`} data-testid="lives">{'❤'.repeat(Math.max(0, lives))}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Combo</div>
          <div className="hudValue combo" data-testid="combo">x{combo}</div>
        </div>
      </div>

      <div className="title" style={{ marginTop: 36 }}>NEON BASTION</div>

      <div className="arenaOuter" ref={arenaRef}>
        <canvas ref={canvasRef} data-testid="arena" />

        {phase === 'start' && (
          <div className="overlay">
            <div className="subtitle">Arrow keys / WASD, or drag anywhere to steer your ship.<br />Auto-fire targets the nearest drone. Dodge the swarm, grab gold orbs for overcharge, survive the escalating waves!</div>
            <div className="highscoreLine" data-testid="high-score">Best: {highScore}</div>
            <button className="btn" data-testid="start-btn" onClick={startGame}>START</button>
          </div>
        )}

        {phase === 'over' && (
          <div className="overlay">
            <div className="title" style={{ fontSize: 'clamp(22px, 6vw, 32px)' }}>BASTION BREACHED</div>
            <div className="hudValue" data-testid="final-score">Score: {score}</div>
            <div className="highscoreLine" data-testid="high-score-final">Best: {highScore}</div>
            <button className="btn" data-testid="restart-btn" onClick={startGame}>PLAY AGAIN</button>
          </div>
        )}
      </div>

      <div className="status">{statusMsg}</div>
      <div className="footer">Neon Bastion — steer to dodge, auto-fire clears the swarm</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
