<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Keystrike Rain</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #030509; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }
  #root { width: 100%; height: 100%; }

  .app {
    width: 100%; height: 100%; position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; overflow: hidden; gap: 6px; padding: 6px 0;
    background: radial-gradient(circle at 50% 0%, #1a0a2e 0%, #0a0616 55%, #030308 100%);
  }

  .hud {
    position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-around;
    padding: 10px 12px; z-index: 15; pointer-events: none;
  }
  .hudBox { text-align: center; }
  .hudLabel { font-size: 10px; letter-spacing: 2px; color: #b678ff; text-transform: uppercase; }
  .hudValue {
    font-size: 22px; font-weight: 800; color: #fff;
    text-shadow: 0 0 10px #b678ff, 0 0 20px #b678ff;
  }
  .hudValue.combo { color: #ffd35e; text-shadow: 0 0 10px #ffd35e, 0 0 22px #e8a800; }
  .hudValue.lives { color: #ff5e8a; text-shadow: 0 0 10px #ff5e8a, 0 0 22px #c9005a; }
  .hudValue.hurt { animation: hurtPulse 0.4s ease; }
  @keyframes hurtPulse { 0%,100% { opacity:1; transform: scale(1);} 50% { opacity:0.4; transform: scale(1.25);} }

  .title {
    font-size: clamp(18px, 5vw, 30px); font-weight: 900; letter-spacing: 3px; margin-top: 34px;
    background: linear-gradient(90deg, #b678ff, #4de8ff, #ffd35e);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(182,120,255,0.6));
    animation: titlePulse 2.4s ease-in-out infinite;
    text-align: center;
  }
  @keyframes titlePulse { 0%,100% { filter: drop-shadow(0 0 12px rgba(182,120,255,0.6)); } 50% { filter: drop-shadow(0 0 26px rgba(182,120,255,0.95)); } }

  .subtitle { color: #cdb8e0; font-size: 13px; letter-spacing: 0.5px; text-align: center; max-width: 400px; line-height: 1.55; }

  .btn {
    padding: 15px 40px; font-size: 19px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(135deg, #b678ff, #4de8ff);
    border: none; border-radius: 50px; color: #0a0616; cursor: pointer;
    box-shadow: 0 0 20px rgba(182,120,255,0.7), 0 0 50px rgba(77,232,255,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(182,120,255,0.9), 0 0 70px rgba(77,232,255,0.5); }
  .btn:active { transform: scale(0.96); }

  .highscoreLine { color: #ffd35e; font-size: 14px; text-shadow: 0 0 8px rgba(255,211,94,0.6); }

  .arenaOuter {
    position: relative; width: min(94vw, 640px); height: min(46vh, 360px); z-index: 5;
    border-radius: 18px; overflow: hidden; border: 2px solid rgba(182,120,255,0.25);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 0 30px rgba(182,120,255,0.12);
    background: #0a0616;
  }

  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .overlay {
    position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 18px;
    background: rgba(10, 6, 22, 0.9); backdrop-filter: blur(4px);
  }

  .status { color: #b39fc4; font-size: 12px; letter-spacing: 0.5px; height: 15px; z-index: 10; text-align: center; }

  .keypad {
    display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px;
    width: min(94vw, 500px); z-index: 10; padding: 2px 0;
  }
  .key {
    height: 42px; min-height: 40px; min-width: 40px; border-radius: 8px; border: 1px solid rgba(182,120,255,0.4);
    background: linear-gradient(160deg, rgba(182,120,255,0.16), rgba(10,6,22,0.6));
    color: #f1e6ff; font-size: 15px; font-weight: 800; letter-spacing: 1px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 0 8px rgba(182,120,255,0.15);
    transition: transform 0.08s ease, background 0.15s ease;
  }
  .key:active, .key.pressed { transform: scale(0.9); background: linear-gradient(160deg, rgba(182,120,255,0.55), rgba(10,6,22,0.6)); }

  .footer { position: relative; text-align: center; color: #3a3050; font-size: 10px; z-index: 10; padding-bottom: 2px; }

  @media (max-width: 480px) {
    .hudValue { font-size: 17px; }
    .btn { padding: 13px 30px; font-size: 16px; }
    .subtitle { font-size: 12px; }
    .arenaOuter { height: min(40vh, 360px); }
    .key { height: 42px; font-size: 14px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const HS_KEY = 'keystrikeRain_highScore';
const LIVES_START = 3;
const KEYS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

const WORD_TIERS = [
  ['CAT', 'DOG', 'SUN', 'RUN', 'BAT', 'HAT', 'MAP', 'TOP', 'BIG', 'RED', 'LOG', 'JAM', 'FOX', 'OWL', 'BEE', 'ICE', 'RAT', 'NET', 'TEA', 'ARM'],
  ['LASER', 'NEONS', 'GLOWS', 'SPARK', 'PULSE', 'STORM', 'RIVER', 'TIGER', 'CRANE', 'BLAZE', 'FROST', 'GRAPE', 'HONEY', 'LEMON', 'MANGO', 'BRICK'],
  ['NEBULA', 'VOLTAGE', 'CIRCUIT', 'GALAXY', 'PHOTON', 'VORTEX', 'PLASMA', 'QUANTUM', 'COSMIC', 'THUNDER', 'CRYSTAL', 'METEOR', 'ORBITAL', 'REACTOR'],
];

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function wordPoolForLevel(level) {
  if (level <= 2) return WORD_TIERS[0];
  if (level <= 4) return WORD_TIERS[0].concat(WORD_TIERS[1]);
  return WORD_TIERS[1].concat(WORD_TIERS[2]);
}

function useAudio() {
  const ctxRef = useRef(null);
  const getCtx = () => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  };

  const tone = useCallback((freq, duration, type, gainScale, freqEnd) => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + duration);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(gainScale, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.05);
    } catch (e) {}
  }, []);

  const keySound = useCallback((progress) => tone(500 + progress * 40, 0.06, 'triangle', 0.12, 700 + progress * 40), [tone]);
  const wordSound = useCallback((combo) => tone(560 + combo * 24, 0.2, 'sine', 0.22, 1400 + combo * 30), [tone]);
  const whiffSound = useCallback(() => tone(260, 0.08, 'square', 0.06, 180), [tone]);
  const breachSound = useCallback(() => tone(210, 0.3, 'sawtooth', 0.18, 55), [tone]);
  const overSound = useCallback(() => {
    tone(320, 0.25, 'sawtooth', 0.2, 220);
    setTimeout(() => tone(200, 0.35, 'sawtooth', 0.2, 90), 150);
  }, [tone]);

  return { keySound, wordSound, whiffSound, breachSound, overSound };
}

function makeGameState() {
  return {
    bounds: { w: 640, h: 360 },
    dangerY: 300,
    words: [],
    particles: [],
    spawnTimer: 500,
    elapsed: 0,
    shake: 0,
    running: false,
    nextId: 1,
    activeId: null,
    level: 1,
  };
}

function maxConcurrent(level) { return clamp(2 + Math.floor(level / 2), 2, 5); }

function spawnWord(state) {
  const { w } = state.bounds;
  const pool = wordPoolForLevel(state.level);
  const onScreen = new Set(state.words.map(wd => wd.text));
  let text = pool[Math.floor(Math.random() * pool.length)];
  for (let tries = 0; tries < 6 && onScreen.has(text); tries++) {
    text = pool[Math.floor(Math.random() * pool.length)];
  }
  const estWidth = 22 + text.length * 15;
  const margin = estWidth / 2 + 10;
  const speedBase = 26 + Math.min(46, state.level * 4.5);
  state.words.push({
    id: state.nextId++,
    text,
    typed: 0,
    x: margin + Math.random() * Math.max(10, w - margin * 2),
    y: -20,
    speed: speedBase + Math.random() * 12,
    width: estWidth,
  });
}

function spawnBurst(arr, x, y, color, count, speedMin, speedMax, sizeMin, sizeMax, lifeMs) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = speedMin + Math.random() * (speedMax - speedMin);
    arr.push({
      x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      life: lifeMs, maxLife: lifeMs, color,
      size: sizeMin + Math.random() * (sizeMax - sizeMin),
    });
  }
}

function App() {
  const [phase, setPhase] = useState('start'); // start | playing | over
  const [score, setScore] = useState(0);
  const [lives, setLives] = useState(LIVES_START);
  const [combo, setCombo] = useState(0);
  const [level, setLevel] = useState(1);
  const [hurt, setHurt] = useState(false);
  const [pressedKey, setPressedKey] = useState(null);
  const [highScore, setHighScore] = useState(() => parseInt(localStorage.getItem(HS_KEY) || '0', 10));
  const [statusMsg, setStatusMsg] = useState('Type a word’s first letter to lock it, then spell it out.');

  const canvasRef = useRef(null);
  const arenaRef = useRef(null);
  const gs = useRef(makeGameState());
  const rafRef = useRef(null);
  const lastTsRef = useRef(0);
  const scoreRef = useRef(0);
  const comboRef = useRef(0);
  const livesRef = useRef(LIVES_START);
  const levelRef = useRef(1);
  const clearsRef = useRef(0);
  const highScoreRef = useRef(highScore);
  const phaseRef = useRef('start');
  const { keySound, wordSound, whiffSound, breachSound, overSound } = useAudio();

  useEffect(() => { phaseRef.current = phase; }, [phase]);

  const resizeCanvas = useCallback(() => {
    const canvas = canvasRef.current;
    const arena = arenaRef.current;
    if (!canvas || !arena) return;
    const rect = arena.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    gs.current.bounds = { w: rect.width, h: rect.height };
    gs.current.dangerY = rect.height * 0.86;
  }, []);

  useEffect(() => {
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    return () => window.removeEventListener('resize', resizeCanvas);
  }, [resizeCanvas]);

  const endGame = useCallback(() => {
    gs.current.running = false;
    phaseRef.current = 'over';
    setPhase('over');
    overSound();
    setStatusMsg('The downpour overwhelmed your keys.');
  }, [overSound]);

  const registerBreach = useCallback((state) => {
    comboRef.current = 0;
    setCombo(0);
    livesRef.current -= 1;
    setLives(livesRef.current);
    setHurt(true);
    setTimeout(() => setHurt(false), 400);
    state.shake = 9;
    breachSound();
    if (livesRef.current <= 0) { endGame(); return; }
    setStatusMsg('A word breached the line! Prioritize the low ones.');
  }, [breachSound, endGame]);

  const maybeLevelUp = useCallback(() => {
    clearsRef.current += 1;
    if (clearsRef.current % 5 === 0) {
      levelRef.current += 1;
      setLevel(levelRef.current);
    }
  }, []);

  const registerWordComplete = useCallback((state, word) => {
    comboRef.current += 1;
    setCombo(comboRef.current);
    const gained = word.text.length * 40 + (comboRef.current - 1) * 15;
    scoreRef.current += gained;
    setScore(scoreRef.current);
    if (scoreRef.current > highScoreRef.current) {
      highScoreRef.current = scoreRef.current;
      localStorage.setItem(HS_KEY, String(scoreRef.current));
      setHighScore(scoreRef.current);
    }
    wordSound(comboRef.current);
    spawnBurst(state.particles, word.x, word.y, '#4de8ff', 26, 50, 210, 2, 6, 620);
    maybeLevelUp();
    setStatusMsg(`"${word.text}" cleared! Combo x${comboRef.current}.`);
  }, [wordSound, maybeLevelUp]);

  const registerWhiff = useCallback(() => {
    if (comboRef.current > 0) { comboRef.current = 0; setCombo(0); }
    whiffSound();
  }, [whiffSound]);

  const handleChar = useCallback((rawChar) => {
    if (phaseRef.current !== 'playing') return;
    const char = String(rawChar || '').toUpperCase();
    if (!/^[A-Z]$/.test(char)) return;
    const state = gs.current;

    let word = state.activeId ? state.words.find(w => w.id === state.activeId) : null;

    if (!word) {
      let best = null;
      for (const w of state.words) {
        if (w.text[w.typed] === char && (!best || w.y > best.y)) best = w;
      }
      if (!best) { registerWhiff(); setPressedKey(char); setTimeout(() => setPressedKey(c => (c === char ? null : c)), 140); return; }
      word = best;
      state.activeId = word.id;
    }

    if (word.text[word.typed] === char) {
      word.typed += 1;
      keySound(word.typed);
      if (word.typed >= word.text.length) {
        state.words = state.words.filter(w => w.id !== word.id);
        state.activeId = null;
        registerWordComplete(state, word);
      }
    } else {
      registerWhiff();
    }

    setPressedKey(char);
    setTimeout(() => setPressedKey(c => (c === char ? null : c)), 140);
  }, [registerWordComplete, registerWhiff, keySound]);

  useEffect(() => {
    const onKeyDown = (e) => {
      if (e.key && e.key.length === 1) handleChar(e.key);
    };
    window.addEventListener('keydown', onKeyDown);
    return () => window.removeEventListener('keydown', onKeyDown);
  }, [handleChar]);

  const tick = useCallback((ts) => {
    const state = gs.current;
    if (!lastTsRef.current) lastTsRef.current = ts;
    let dt = (ts - lastTsRef.current) / 1000;
    dt = Math.min(dt, 0.05);
    lastTsRef.current = ts;
    state.elapsed += dt * 1000;

    if (phaseRef.current === 'playing') {
      state.level = levelRef.current;
      state.spawnTimer -= dt * 1000;
      const interval = Math.max(1100 - state.level * 80, 420);
      if (state.spawnTimer <= 0 && state.words.length < maxConcurrent(state.level)) {
        spawnWord(state);
        state.spawnTimer = interval + Math.random() * 250;
      }

      const survivors = [];
      for (const w of state.words) {
        w.y += w.speed * dt;
        if (w.y >= state.dangerY) {
          if (state.activeId === w.id) state.activeId = null;
          registerBreach(state);
        } else {
          survivors.push(w);
        }
      }
      state.words = survivors;
    }

    for (let i = state.particles.length - 1; i >= 0; i--) {
      const pt = state.particles[i];
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.vx *= 0.94; pt.vy *= 0.94;
      pt.life -= dt * 1000;
      if (pt.life <= 0) state.particles.splice(i, 1);
    }
    if (state.particles.length > 260) state.particles.splice(0, state.particles.length - 260);

    if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 40);

    draw(state, ts);
    rafRef.current = requestAnimationFrame(tick);
  }, [registerBreach]);

  const draw = (state, ts) => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const { w, h } = state.bounds;

    ctx.save();
    if (state.shake > 0) {
      ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
    }

    ctx.fillStyle = 'rgba(10,6,22,0.34)';
    ctx.fillRect(-20, -20, w + 40, h + 40);

    const grad = ctx.createRadialGradient(w * 0.5, h * 0.1, 10, w * 0.5, h * 0.1, Math.max(w, h) * 0.8);
    grad.addColorStop(0, `hsla(${270 + Math.sin(ts / 3000) * 20}, 70%, 16%, 0.35)`);
    grad.addColorStop(1, 'rgba(3,3,8,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    ctx.fillStyle = 'rgba(182,120,255,0.3)';
    for (let i = 0; i < 30; i++) {
      const sx = (i * 91.7) % w;
      const sy = (i * 53.3 + (ts * 0.05)) % h;
      ctx.globalAlpha = 0.08 + 0.1 * Math.sin(ts / 500 + i);
      ctx.fillRect(sx, sy, 1.5, 6);
    }
    ctx.globalAlpha = 1;

    ctx.save();
    ctx.strokeStyle = `rgba(255,94,138,${0.55 + Math.sin(ts / 220) * 0.2})`;
    ctx.shadowColor = '#ff5e8a';
    ctx.shadowBlur = 12;
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 8]);
    ctx.beginPath();
    ctx.moveTo(0, state.dangerY);
    ctx.lineTo(w, state.dangerY);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    for (const wd of state.words) {
      const active = wd.id === state.activeId;
      ctx.save();
      ctx.translate(wd.x, wd.y);

      const boxW = wd.width;
      const boxH = 26;
      ctx.beginPath();
      const r = 12;
      ctx.moveTo(-boxW / 2 + r, -boxH / 2);
      ctx.arcTo(boxW / 2, -boxH / 2, boxW / 2, boxH / 2, r);
      ctx.arcTo(boxW / 2, boxH / 2, -boxW / 2, boxH / 2, r);
      ctx.arcTo(-boxW / 2, boxH / 2, -boxW / 2, -boxH / 2, r);
      ctx.arcTo(-boxW / 2, -boxH / 2, boxW / 2, -boxH / 2, r);
      ctx.closePath();
      const glow = active ? '#ffd35e' : '#b678ff';
      const fillGrad = ctx.createLinearGradient(-boxW / 2, 0, boxW / 2, 0);
      fillGrad.addColorStop(0, active ? 'rgba(255,211,94,0.22)' : 'rgba(182,120,255,0.16)');
      fillGrad.addColorStop(1, active ? 'rgba(255,211,94,0.1)' : 'rgba(182,120,255,0.08)');
      ctx.fillStyle = fillGrad;
      ctx.strokeStyle = glow;
      ctx.shadowColor = glow;
      ctx.shadowBlur = active ? 16 : 8;
      ctx.lineWidth = active ? 2.4 : 1.4;
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;

      ctx.font = '800 15px system-ui, sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      const totalW = ctx.measureText(wd.text).width;
      let cx = -totalW / 2;
      for (let i = 0; i < wd.text.length; i++) {
        ctx.fillStyle = i < wd.typed ? '#ffd35e' : '#e8ecff';
        ctx.fillText(wd.text[i], cx, 1);
        cx += ctx.measureText(wd.text[i]).width;
      }
      ctx.restore();
    }

    for (const pt of state.particles) {
      ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.restore();
  };

  const startGame = () => {
    resizeCanvas();
    const state = makeGameState();
    state.bounds = gs.current.bounds;
    state.dangerY = gs.current.dangerY;
    state.running = true;
    gs.current = state;
    scoreRef.current = 0;
    comboRef.current = 0;
    livesRef.current = LIVES_START;
    levelRef.current = 1;
    clearsRef.current = 0;
    lastTsRef.current = 0;
    setScore(0);
    setCombo(0);
    setLives(LIVES_START);
    setLevel(1);
    setStatusMsg('Type a word’s first letter to lock it, then spell it out.');
    setPhase('playing');
    phaseRef.current = 'playing';
    cancelAnimationFrame(rafRef.current);
    rafRef.current = requestAnimationFrame(tick);
  };

  useEffect(() => () => cancelAnimationFrame(rafRef.current), []);

  return (
    <div className="app" data-testid="game-canvas">
      <div className="hud">
        <div className="hudBox">
          <div className="hudLabel">Score</div>
          <div className="hudValue" data-testid="score">{score}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Lives</div>
          <div className={`hudValue lives ${hurt ? 'hurt' : ''}`} data-testid="lives">{'❤'.repeat(Math.max(0, lives))}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Combo</div>
          <div className="hudValue combo" data-testid="combo">x{combo}</div>
        </div>
      </div>

      <div className="title">KEYSTRIKE RAIN</div>

      <div className="arenaOuter" ref={arenaRef} data-testid="play-field">
        <canvas ref={canvasRef} data-testid="arena" />

        {phase === 'start' && (
          <div className="overlay">
            <div className="subtitle">Neon words fall from above. Type a word&rsquo;s first letter to lock onto it&mdash;or tap it below&mdash;then spell it out before it crosses the red line.<br />Finishing a word chains your combo. Longer words score more. Three breaches and the rain wins.</div>
            <div className="highscoreLine" data-testid="high-score">Best: {highScore}</div>
            <button className="btn" data-testid="start-btn" onClick={startGame}>START</button>
          </div>
        )}

        {phase === 'over' && (
          <div className="overlay">
            <div className="title" style={{ fontSize: 'clamp(20px, 6vw, 30px)', marginTop: 0 }}>WASHED OUT</div>
            <div className="hudValue" data-testid="final-score">Score: {score}</div>
            <div className="highscoreLine" data-testid="high-score-final">Best: {highScore}</div>
            <button className="btn" data-testid="restart-btn" onClick={startGame}>PLAY AGAIN</button>
          </div>
        )}
      </div>

      {phase === 'playing' && (
        <div className="keypad" data-testid="keypad">
          {KEYS.map((k) => (
            <button
              key={k}
              className={`key ${pressedKey === k ? 'pressed' : ''}`}
              data-testid={`key-${k}`}
              onClick={() => handleChar(k)}
            >
              {k}
            </button>
          ))}
        </div>
      )}

      <div className="status">{statusMsg}</div>
      <div className="footer">Keystrike Rain — Level {level} — type or tap to spell falling words before they breach</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
