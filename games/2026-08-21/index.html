<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Circuit Breaker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05030d; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }
  #root { width: 100%; height: 100%; }

  .app {
    width: 100%; height: 100%; position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: center; overflow: hidden; gap: 6px;
    background: radial-gradient(circle at 50% 12%, #131a2e 0%, #0a0a18 55%, #030109 100%);
  }

  .hud {
    position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-around;
    padding: 10px 12px; z-index: 15; pointer-events: none;
  }
  .hudBox { text-align: center; }
  .hudLabel { font-size: 10px; letter-spacing: 2px; color: #6ce0ff; text-transform: uppercase; }
  .hudValue {
    font-size: 22px; font-weight: 800; color: #fff;
    text-shadow: 0 0 10px #5ef0ff, 0 0 20px #5ef0ff;
  }
  .hudValue.combo { color: #ffe45e; text-shadow: 0 0 10px #ffe45e, 0 0 22px #ff9d00; }
  .hudValue.lives { color: #ff5ee0; text-shadow: 0 0 10px #ff5ee0, 0 0 22px #c020ff; }
  .hudValue.hurt { animation: hurtPulse 0.4s ease; }
  @keyframes hurtPulse { 0%,100% { opacity:1; transform: scale(1);} 50% { opacity:0.4; transform: scale(1.25);} }

  .title {
    font-size: clamp(18px, 5.2vw, 30px); font-weight: 900; letter-spacing: 3px;
    background: linear-gradient(90deg, #5ef0ff, #7c6bff, #ff5ee0);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(110,180,255,0.6));
    animation: titlePulse 2.4s ease-in-out infinite;
    text-align: center;
  }
  @keyframes titlePulse { 0%,100% { filter: drop-shadow(0 0 12px rgba(110,180,255,0.6)); } 50% { filter: drop-shadow(0 0 26px rgba(150,200,255,0.95)); } }

  .subtitle { color: #b8cbe8; font-size: 13px; letter-spacing: 0.5px; text-align: center; max-width: 380px; line-height: 1.5; }

  .btn {
    padding: 15px 40px; font-size: 19px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(135deg, #2fa8ff, #ff4ecb);
    border: none; border-radius: 50px; color: #fff; cursor: pointer;
    box-shadow: 0 0 20px rgba(60,160,255,0.7), 0 0 50px rgba(255,80,200,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(60,160,255,0.9), 0 0 70px rgba(255,80,200,0.5); }
  .btn:active { transform: scale(0.96); }

  .highscoreLine { color: #ffd35e; font-size: 14px; text-shadow: 0 0 8px rgba(255,200,50,0.6); }

  .arenaOuter {
    position: relative; width: min(94vw, 460px); height: min(68vh, 560px); z-index: 5;
    border-radius: 20px; overflow: hidden; border: 2px solid rgba(100,180,255,0.25);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 0 30px rgba(80,160,255,0.15);
    background: #08061a; cursor: pointer;
  }

  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .overlay {
    position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 20px;
    background: rgba(6, 4, 15, 0.85); backdrop-filter: blur(4px);
  }

  .status { color: #a8bee8; font-size: 13px; letter-spacing: 0.5px; height: 16px; z-index: 10; text-align: center; }

  .footer { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; color: #5a4a6a; font-size: 11px; z-index: 10; }

  @media (max-width: 480px) {
    .hudValue { font-size: 17px; }
    .btn { padding: 13px 30px; font-size: 16px; }
    .subtitle { font-size: 12px; }
    .arenaOuter { height: min(62vh, 560px); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const HS_KEY = 'circuitBreakerHighScore';
const COLS = 5;
const ROWS = 6;
const LIVES_START = 3;
const TICK_START = 640;
const TICK_MIN = 240;
const TICK_DECAY = 0.94;
const BREAK_PAUSE_MS = 850;

const DIRS = ['N', 'E', 'S', 'W'];
const VEC = { N: { dc: 0, dr: -1 }, E: { dc: 1, dr: 0 }, S: { dc: 0, dr: 1 }, W: { dc: -1, dr: 0 } };
const OPP = { N: 'S', S: 'N', E: 'W', W: 'E' };
const BASE_DIRS = { I: ['N', 'S'], L: ['N', 'E'] };

function rotateDir(d, rot) {
  const idx = (DIRS.indexOf(d) + rot) % 4;
  return DIRS[idx];
}
function tileOpenDirs(tile) {
  return BASE_DIRS[tile.shape].map(d => rotateDir(d, tile.rot));
}
function randInt(lo, hi) { return lo + Math.floor(Math.random() * (hi - lo + 1)); }
function randTile() { return { shape: Math.random() < 0.5 ? 'I' : 'L', rot: randInt(0, 3) }; }

function buildGrid() {
  const g = [];
  for (let r = 0; r < ROWS; r++) {
    const row = [];
    for (let c = 0; c < COLS; c++) row.push(randTile());
    g.push(row);
  }
  return g;
}

function reshuffleGrid(grid, fraction) {
  const total = COLS * ROWS;
  const count = Math.ceil(total * fraction);
  for (let i = 0; i < count; i++) {
    const r = randInt(0, ROWS - 1), c = randInt(0, COLS - 1);
    grid[r][c] = randTile();
  }
}

function useAudio() {
  const ctxRef = useRef(null);
  const getCtx = () => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  };

  const tone = useCallback((freq, duration, type, gainScale, freqEnd) => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + duration);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(gainScale, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.05);
    } catch (e) {}
  }, []);

  const rotateSound = useCallback(() => tone(500, 0.06, 'square', 0.06, 700), [tone]);
  const successSound = useCallback(() => {
    tone(600, 0.1, 'triangle', 0.18, 900);
    setTimeout(() => tone(900, 0.14, 'triangle', 0.16, 1300), 90);
  }, [tone]);
  const breakSound = useCallback(() => tone(180, 0.28, 'sawtooth', 0.22, 60), [tone]);
  const overSound = useCallback(() => {
    tone(320, 0.25, 'sawtooth', 0.2, 220);
    setTimeout(() => tone(200, 0.35, 'sawtooth', 0.2, 90), 150);
  }, [tone]);

  return { rotateSound, successSound, breakSound, overSound };
}

function makeGameState() {
  const grid = buildGrid();
  const entryCol = randInt(0, COLS - 1);
  let exitCol = randInt(0, COLS - 1);
  return {
    bounds: { w: 460, h: 560 },
    grid,
    entryCol,
    exitCol,
    pulse: { row: 0, col: entryCol, moveDir: 'S' },
    anim: { fromRow: -1, fromCol: entryCol, toRow: 0, toCol: entryCol, tStart: 0 },
    tickInterval: TICK_START,
    tickAcc: 0,
    breakPause: 0,
    particles: [],
    flash: 0,
    flashColor: '#ff4d6d',
    shake: 0,
    running: false,
    cell: 60,
    originX: 0,
    originY: 60,
  };
}

function spawnBurst(arr, x, y, color, count, speedMin, speedMax, sizeMin, sizeMax, lifeMs) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = speedMin + Math.random() * (speedMax - speedMin);
    arr.push({
      x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 30,
      life: lifeMs, maxLife: lifeMs, color,
      size: sizeMin + Math.random() * (sizeMax - sizeMin), grav: 220,
    });
  }
}

function App() {
  const [phase, setPhase] = useState('start'); // start | playing | over
  const [score, setScore] = useState(0);
  const [lives, setLives] = useState(LIVES_START);
  const [combo, setCombo] = useState(0);
  const [hurt, setHurt] = useState(false);
  const [highScore, setHighScore] = useState(() => parseInt(localStorage.getItem(HS_KEY) || '0', 10));
  const [statusMsg, setStatusMsg] = useState('Tap tiles to rotate the pipes.');

  const canvasRef = useRef(null);
  const arenaRef = useRef(null);
  const gs = useRef(makeGameState());
  const rafRef = useRef(null);
  const lastTsRef = useRef(0);
  const scoreRef = useRef(0);
  const comboRef = useRef(0);
  const livesRef = useRef(LIVES_START);
  const highScoreRef = useRef(highScore);
  const phaseRef = useRef('start');
  const { rotateSound, successSound, breakSound, overSound } = useAudio();

  useEffect(() => { phaseRef.current = phase; }, [phase]);

  const layoutGrid = useCallback(() => {
    const state = gs.current;
    const { w, h } = state.bounds;
    const topPad = 44, bottomPad = 50, sidePad = 10;
    const cell = Math.max(20, Math.min((w - sidePad * 2) / COLS, (h - topPad - bottomPad) / ROWS));
    state.cell = cell;
    state.originX = (w - cell * COLS) / 2;
    state.originY = topPad;
  }, []);

  const resizeCanvas = useCallback(() => {
    const canvas = canvasRef.current;
    const arena = arenaRef.current;
    if (!canvas || !arena) return;
    const rect = arena.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    gs.current.bounds = { w: rect.width, h: rect.height };
    layoutGrid();
  }, [layoutGrid]);

  useEffect(() => {
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    return () => window.removeEventListener('resize', resizeCanvas);
  }, [resizeCanvas]);

  const endGame = useCallback(() => {
    gs.current.running = false;
    phaseRef.current = 'over';
    setPhase('over');
    overSound();
    setStatusMsg('Circuit overloaded.');
  }, [overSound]);

  const respawnPulse = useCallback(() => {
    const state = gs.current;
    state.pulse = { row: 0, col: state.entryCol, moveDir: 'S' };
    state.anim = { fromRow: -1, fromCol: state.entryCol, toRow: 0, toCol: state.entryCol, tStart: performance.now() };
    state.tickAcc = 0;
  }, []);

  const nextLevel = useCallback(() => {
    const state = gs.current;
    reshuffleGrid(state.grid, 0.35);
    state.entryCol = randInt(0, COLS - 1);
    state.exitCol = randInt(0, COLS - 1);
    state.tickInterval = Math.max(TICK_MIN, state.tickInterval * TICK_DECAY);
    respawnPulse();
  }, [respawnPulse]);

  const stepPulse = useCallback(() => {
    const state = gs.current;
    const { row, col, moveDir } = state.pulse;
    const tile = state.grid[row][col];
    const openDirs = tileOpenDirs(tile);
    const requiredEntry = OPP[moveDir];
    const cx = state.originX + col * state.cell + state.cell / 2;
    const cy = state.originY + row * state.cell + state.cell / 2;

    if (!openDirs.includes(requiredEntry)) {
      livesRef.current -= 1;
      setLives(livesRef.current);
      comboRef.current = 0;
      setCombo(0);
      state.shake = 9;
      state.flash = 1;
      state.flashColor = '#ff4d6d';
      setHurt(true);
      setTimeout(() => setHurt(false), 400);
      breakSound();
      spawnBurst(state.particles, cx, cy, '#ff4d6d', 14, 60, 220, 2, 5, 500);
      setStatusMsg('Circuit broke! Rotate the tiles.');
      if (livesRef.current <= 0) { endGame(); return; }
      state.breakPause = BREAK_PAUSE_MS;
      return;
    }

    const outDir = openDirs.find(d => d !== requiredEntry);
    const v = VEC[outDir];
    const nr = row + v.dr, nc = col + v.dc;
    const fromRow = row, fromCol = col;

    if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) {
      if (outDir === 'S' && row === ROWS - 1 && col === state.exitCol) {
        const ex = state.originX + col * state.cell + state.cell / 2;
        const ey = state.originY + ROWS * state.cell;
        comboRef.current += 1;
        setCombo(comboRef.current);
        const gained = 50 + comboRef.current * 10;
        scoreRef.current += gained;
        if (scoreRef.current > highScoreRef.current) {
          highScoreRef.current = scoreRef.current;
          localStorage.setItem(HS_KEY, String(scoreRef.current));
          setHighScore(scoreRef.current);
        }
        setScore(scoreRef.current);
        state.flash = 1;
        state.flashColor = '#5effa0';
        successSound();
        spawnBurst(state.particles, ex, ey, '#ffe45e', 16, 60, 220, 2, 5, 550);
        setStatusMsg('Routed! New target locked.');
        nextLevel();
        return;
      }
      livesRef.current -= 1;
      setLives(livesRef.current);
      comboRef.current = 0;
      setCombo(0);
      state.shake = 9;
      state.flash = 1;
      state.flashColor = '#ff4d6d';
      setHurt(true);
      setTimeout(() => setHurt(false), 400);
      breakSound();
      spawnBurst(state.particles, cx, cy, '#ff4d6d', 14, 60, 220, 2, 5, 500);
      setStatusMsg('Wrong exit! Rotate the tiles.');
      if (livesRef.current <= 0) { endGame(); return; }
      state.breakPause = BREAK_PAUSE_MS;
      return;
    }

    state.pulse = { row: nr, col: nc, moveDir: outDir };
    state.anim = { fromRow, fromCol, toRow: nr, toCol: nc, tStart: performance.now() };
  }, [breakSound, successSound, endGame, nextLevel]);

  const rotateTileAt = useCallback((row, col) => {
    const state = gs.current;
    if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return;
    const tile = state.grid[row][col];
    tile.rot = (tile.rot + 1) % 4;
    rotateSound();
    setStatusMsg(`Rotated tile (${row + 1}, ${col + 1}).`);
  }, [rotateSound]);

  useEffect(() => {
    const arena = arenaRef.current;
    if (!arena) return;
    const onDown = (e) => {
      e.preventDefault();
      if (phaseRef.current !== 'playing') return;
      const rect = arena.getBoundingClientRect();
      const lx = e.clientX - rect.left, ly = e.clientY - rect.top;
      const state = gs.current;
      const col = Math.floor((lx - state.originX) / state.cell);
      const row = Math.floor((ly - state.originY) / state.cell);
      rotateTileAt(row, col);
    };
    arena.addEventListener('pointerdown', onDown);
    return () => arena.removeEventListener('pointerdown', onDown);
  }, [rotateTileAt]);

  const tick = useCallback((ts) => {
    const state = gs.current;
    if (!state.running) return;
    if (!lastTsRef.current) lastTsRef.current = ts;
    let dt = (ts - lastTsRef.current) / 1000;
    dt = Math.min(dt, 0.05);
    lastTsRef.current = ts;

    if (state.breakPause > 0) {
      state.breakPause -= dt * 1000;
      if (state.breakPause <= 0) respawnPulse();
    } else {
      state.tickAcc += dt * 1000;
      if (state.tickAcc >= state.tickInterval) {
        state.tickAcc -= state.tickInterval;
        stepPulse();
      }
    }

    for (let i = state.particles.length - 1; i >= 0; i--) {
      const pt = state.particles[i];
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.vy += (pt.grav || 0) * dt;
      pt.vx *= 0.96;
      pt.life -= dt * 1000;
      if (pt.life <= 0) state.particles.splice(i, 1);
    }
    if (state.particles.length > 100) state.particles.splice(0, state.particles.length - 100);

    if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 40);
    if (state.flash > 0) state.flash = Math.max(0, state.flash - dt * 2.5);

    draw(state, ts);
    rafRef.current = requestAnimationFrame(tick);
  }, [stepPulse, respawnPulse]);

  const draw = (state, ts) => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const { w, h } = state.bounds;
    const { cell, originX, originY } = state;

    ctx.save();
    if (state.shake > 0) {
      ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
    }

    ctx.fillStyle = '#08061a';
    ctx.fillRect(-10, -10, w + 20, h + 20);

    // entry arrow
    const entryX = originX + state.entryCol * cell + cell / 2;
    ctx.save();
    ctx.translate(entryX, originY - 22);
    ctx.shadowBlur = 12; ctx.shadowColor = '#5ef0ff';
    ctx.fillStyle = '#5ef0ff';
    ctx.beginPath();
    ctx.moveTo(-9, -8); ctx.lineTo(9, -8); ctx.lineTo(0, 10); ctx.closePath();
    ctx.fill();
    ctx.restore();

    // grid cells
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const x = originX + c * cell, y = originY + r * cell;
        ctx.fillStyle = (r + c) % 2 === 0 ? 'rgba(110,150,255,0.05)' : 'rgba(110,150,255,0.02)';
        ctx.fillRect(x + 1, y + 1, cell - 2, cell - 2);
        ctx.strokeStyle = 'rgba(120,150,255,0.12)';
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 1, y + 1, cell - 2, cell - 2);

        const tile = state.grid[r][c];
        const dirs = tileOpenDirs(tile);
        const cx = x + cell / 2, cy = y + cell / 2;
        const hue = 195 + ((r * COLS + c) * 11) % 120;
        ctx.strokeStyle = `hsl(${hue},90%,62%)`;
        ctx.lineWidth = Math.max(3, cell * 0.14);
        ctx.lineCap = 'round';
        ctx.shadowBlur = 6;
        ctx.shadowColor = `hsl(${hue},95%,60%)`;
        ctx.beginPath();
        for (const d of dirs) {
          const v = VEC[d];
          ctx.moveTo(cx, cy);
          ctx.lineTo(cx + v.dc * cell / 2, cy + v.dr * cell / 2);
        }
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = `hsl(${hue},90%,75%)`;
        ctx.beginPath();
        ctx.arc(cx, cy, Math.max(2, cell * 0.06), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // exit target
    const exitX = originX + state.exitCol * cell + cell / 2;
    const exitY = originY + ROWS * cell + 20;
    const pulseScale = 1 + Math.sin(ts / 220) * 0.15;
    ctx.save();
    ctx.translate(exitX, exitY);
    ctx.rotate(Math.PI / 4);
    ctx.scale(pulseScale, pulseScale);
    ctx.shadowBlur = 14; ctx.shadowColor = '#ffd35e';
    ctx.fillStyle = '#ffd35e';
    ctx.fillRect(-8, -8, 16, 16);
    ctx.restore();

    // traveling pulse
    const { fromRow, fromCol, toRow, toCol, tStart } = state.anim;
    const t = state.breakPause > 0 ? 1 : Math.min(1, (performance.now() - tStart) / Math.max(1, state.tickInterval));
    const fx = originX + fromCol * cell + cell / 2;
    const fy = originY + fromRow * cell + cell / 2;
    const tx = originX + toCol * cell + cell / 2;
    const ty = originY + toRow * cell + cell / 2;
    const px = fx + (tx - fx) * t;
    const py = fy + (ty - fy) * t;
    ctx.shadowBlur = 20; ctx.shadowColor = '#ff5ee0';
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(px, py, Math.max(4, cell * 0.16), 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // particles
    for (const pt of state.particles) {
      ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
      ctx.fillStyle = pt.color;
      const s = pt.size * 2;
      ctx.fillRect(pt.x - pt.size, pt.y - pt.size, s, s);
    }
    ctx.globalAlpha = 1;

    if (state.flash > 0) {
      ctx.globalAlpha = state.flash * 0.35;
      ctx.fillStyle = state.flashColor;
      ctx.fillRect(-10, -10, w + 20, h + 20);
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  };

  const startGame = () => {
    resizeCanvas();
    const state = makeGameState();
    state.bounds = gs.current.bounds;
    gs.current = state;
    layoutGrid();
    state.running = true;
    scoreRef.current = 0;
    comboRef.current = 0;
    livesRef.current = LIVES_START;
    lastTsRef.current = 0;
    setScore(0);
    setCombo(0);
    setLives(LIVES_START);
    setStatusMsg('Tap tiles to rotate the pipes.');
    setPhase('playing');
    phaseRef.current = 'playing';
    cancelAnimationFrame(rafRef.current);
    rafRef.current = requestAnimationFrame(tick);
  };

  useEffect(() => () => cancelAnimationFrame(rafRef.current), []);

  return (
    <div className="app" data-testid="game-canvas">
      <div className="hud">
        <div className="hudBox">
          <div className="hudLabel">Score</div>
          <div className="hudValue" data-testid="score">{score}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Lives</div>
          <div className={`hudValue lives ${hurt ? 'hurt' : ''}`} data-testid="lives">{'♦'.repeat(Math.max(0, lives))}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Combo</div>
          <div className="hudValue combo" data-testid="combo">x{combo}</div>
        </div>
      </div>

      <div className="title" style={{ marginTop: 36 }}>CIRCUIT BREAKER</div>

      <div className="arenaOuter" ref={arenaRef} data-testid="drop-zone">
        <canvas ref={canvasRef} data-testid="arena" />

        {phase === 'start' && (
          <div className="overlay">
            <div className="subtitle">A pulse of energy races down the grid.<br />Tap tiles to rotate their pipes and route it from the cyan arrow to the gold target.<br />Miss the route and the circuit breaks — chain successful routes for combo!</div>
            <div className="highscoreLine" data-testid="high-score">Best: {highScore}</div>
            <button className="btn" data-testid="start-btn" onClick={startGame}>START</button>
          </div>
        )}

        {phase === 'over' && (
          <div className="overlay">
            <div className="title" style={{ fontSize: 'clamp(20px, 6vw, 30px)' }}>OVERLOADED</div>
            <div className="hudValue" data-testid="final-score">Score: {score}</div>
            <div className="highscoreLine" data-testid="high-score-final">Best: {highScore}</div>
            <button className="btn" data-testid="restart-btn" onClick={startGame}>PLAY AGAIN</button>
          </div>
        )}
      </div>

      <div className="status">{statusMsg}</div>
      <div className="footer">Circuit Breaker — rotate tiles, route the pulse, beat the clock</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
