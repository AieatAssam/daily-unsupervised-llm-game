<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Glitch Popper</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05030a; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }
  #root { width: 100%; height: 100%; }

  .app {
    width: 100%; height: 100%; position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; overflow: hidden; gap: 6px; padding: 6px 0;
    background: radial-gradient(circle at 50% 25%, #1a0a22 0%, #0a0812 55%, #030308 100%);
  }

  .hud {
    position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-around;
    padding: 10px 12px; z-index: 15; pointer-events: none;
  }
  .hudBox { text-align: center; }
  .hudLabel { font-size: 10px; letter-spacing: 2px; color: #ffd23d; text-transform: uppercase; }
  .hudValue {
    font-size: 22px; font-weight: 800; color: #fff;
    text-shadow: 0 0 10px #ffd23d, 0 0 20px #ffd23d;
  }
  .hudValue.combo { color: #5eeaff; text-shadow: 0 0 10px #5eeaff, 0 0 22px #00b3c9; }
  .hudValue.lives { color: #ff5ec4; text-shadow: 0 0 10px #ff5ec4, 0 0 22px #c9007f; }
  .hudValue.hurt { animation: hurtPulse 0.4s ease; }
  @keyframes hurtPulse { 0%,100% { opacity:1; transform: scale(1);} 50% { opacity:0.4; transform: scale(1.25);} }

  .title {
    font-size: clamp(18px, 5vw, 30px); font-weight: 900; letter-spacing: 3px; margin-top: 34px;
    background: linear-gradient(90deg, #ffd23d, #5eeaff, #ff5ec4);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(255,210,61,0.6));
    animation: titlePulse 2.4s ease-in-out infinite;
    text-align: center;
  }
  @keyframes titlePulse { 0%,100% { filter: drop-shadow(0 0 12px rgba(255,210,61,0.6)); } 50% { filter: drop-shadow(0 0 26px rgba(94,234,255,0.85)); } }

  .subtitle { color: #c8bcd8; font-size: 13px; letter-spacing: 0.5px; text-align: center; max-width: 440px; line-height: 1.55; }

  .btn {
    padding: 15px 40px; font-size: 19px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(135deg, #ffd23d, #5eeaff);
    border: none; border-radius: 50px; color: #1a1200; cursor: pointer;
    box-shadow: 0 0 20px rgba(255,210,61,0.7), 0 0 50px rgba(94,234,255,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(255,210,61,0.9), 0 0 70px rgba(94,234,255,0.5); }
  .btn:active { transform: scale(0.96); }

  .highscoreLine { color: #5eeaff; font-size: 14px; text-shadow: 0 0 8px rgba(94,234,255,0.6); }

  .arenaOuter {
    position: relative; width: min(94vw, 480px); height: min(70vh, 420px); z-index: 5;
    border-radius: 18px; overflow: hidden; border: 2px solid rgba(255,210,61,0.25);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 0 30px rgba(255,210,61,0.12);
    background: #0a0712;
  }
  .arenaOuter.shakeIt { animation: shakeKf 0.3s ease; }
  @keyframes shakeKf {
    0%, 100% { transform: translate(0,0); }
    20% { transform: translate(-6px, 3px); }
    40% { transform: translate(6px, -3px); }
    60% { transform: translate(-5px, -2px); }
    80% { transform: translate(5px, 2px); }
  }

  canvas.fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 8; }

  .flashOverlay {
    position: absolute; inset: 0; z-index: 9; pointer-events: none; background: rgba(255,46,79,0);
  }
  .flashOverlay.on { animation: flashKf 0.3s ease; }
  @keyframes flashKf { 0% { background: rgba(255,46,79,0.35); } 100% { background: rgba(255,46,79,0); } }

  .grid {
    position: relative; z-index: 5; display: grid;
    grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(4, 1fr);
    gap: 3vmin; width: 100%; height: 100%; padding: 3vmin;
  }

  .hole {
    position: relative; border: 2px solid rgba(255,210,61,0.18); border-radius: 16px;
    background: radial-gradient(circle at 50% 40%, rgba(94,234,255,0.06), rgba(10,10,18,0.9));
    cursor: pointer; min-height: 40px; min-width: 40px; -webkit-appearance: none; appearance: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .hole.cursor { border-color: #5eeaff; box-shadow: 0 0 14px rgba(94,234,255,0.55); }
  .hole .core {
    position: absolute; inset: 0; margin: auto; width: 34%; height: 34%; border-radius: 50%;
    opacity: 0; transform: scale(0.6); transition: opacity 0.12s ease, transform 0.12s ease;
  }
  .hole.active .core { opacity: 1; transform: scale(1); }
  .hole.kind-normal .core { background: #3dffb0; box-shadow: 0 0 14px #3dffb0, 0 0 26px #3dffb0; }
  .hole.kind-surge .core { background: #ffd23d; box-shadow: 0 0 16px #ffd23d, 0 0 30px #ffd23d; animation: surgePulse 0.5s ease-in-out infinite; }
  .hole.kind-hazard .core { background: #ff2e4f; box-shadow: 0 0 14px #ff2e4f, 0 0 26px #ff2e4f; }
  @keyframes surgePulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }

  .ring { position: absolute; inset: 10%; border-radius: 50%; border: 3px solid currentColor; opacity: 0.9; }
  .kind-normal .ring { color: #3dffb0; }
  .kind-surge .ring { color: #ffd23d; }
  .kind-hazard .ring { color: #ff2e4f; }
  .ring.shrink { animation: ringShrink linear forwards; animation-duration: var(--life); }
  @keyframes ringShrink { from { transform: scale(1); opacity: 0.95; } to { transform: scale(0.05); opacity: 0; } }

  .cellFlash { position: absolute; inset: 0; border-radius: 16px; pointer-events: none; }
  .cellFlash.good { animation: flashGood 0.35s ease forwards; }
  .cellFlash.surge { animation: flashSurge 0.4s ease forwards; }
  .cellFlash.bad { animation: flashBad 0.35s ease forwards; }
  @keyframes flashGood { 0% { background: rgba(61,255,176,0.55); } 100% { background: rgba(61,255,176,0); } }
  @keyframes flashSurge { 0% { background: rgba(255,210,61,0.6); } 100% { background: rgba(255,210,61,0); } }
  @keyframes flashBad { 0% { background: rgba(255,46,79,0.6); } 100% { background: rgba(255,46,79,0); } }

  .overlay {
    position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 18px;
    background: rgba(10, 8, 16, 0.9); backdrop-filter: blur(4px);
  }

  .status { color: #a898b8; font-size: 12px; letter-spacing: 0.5px; height: 15px; z-index: 10; text-align: center; }
  .footer { position: relative; text-align: center; color: #241f30; font-size: 10px; z-index: 10; padding-bottom: 2px; }

  @media (max-width: 480px) {
    .hudValue { font-size: 17px; }
    .btn { padding: 13px 30px; font-size: 16px; }
    .subtitle { font-size: 12px; }
    .arenaOuter { height: min(58vh, 380px); }
    .grid { gap: 2vmin; padding: 2vmin; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const HS_KEY = 'glitchPopper_highScore';
const LIVES_START = 3;
const COLS = 5, ROWS = 4, CELLS = COLS * ROWS;
const HITS_PER_LEVEL = 10;

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
const spawnDelay = (level) => clamp(820 - (level - 1) * 45, 380, 820);
const lifespanMs = (level) => clamp(1450 - (level - 1) * 70, 700, 1450);
const maxConcurrent = (level) => clamp(1 + Math.floor((level - 1) / 2), 1, 4);
const hazardChance = (level) => clamp(0.14 + (level - 1) * 0.015, 0.14, 0.34);

function useAudio() {
  const ctxRef = useRef(null);
  const getCtx = () => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  };

  const tone = useCallback((freq, duration, type, gainScale, freqEnd) => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + duration);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(gainScale, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.05);
    } catch (e) {}
  }, []);

  const hitSound = useCallback((combo) => tone(500 + combo * 16, 0.09, 'triangle', 0.15, 820 + combo * 20), [tone]);
  const surgeSound = useCallback(() => { tone(650, 0.1, 'sine', 0.18, 1050); setTimeout(() => tone(950, 0.14, 'sine', 0.16, 1350), 90); }, [tone]);
  const hazardSound = useCallback(() => tone(180, 0.3, 'sawtooth', 0.2, 60), [tone]);
  const missSound = useCallback(() => tone(260, 0.12, 'sine', 0.08, 140), [tone]);
  const moveSound = useCallback(() => tone(320, 0.03, 'sine', 0.04, 380), [tone]);
  const levelUpSound = useCallback(() => { tone(520, 0.12, 'sine', 0.18, 820); setTimeout(() => tone(760, 0.16, 'sine', 0.18, 1150), 110); }, [tone]);
  const overSound = useCallback(() => { tone(300, 0.25, 'sawtooth', 0.2, 200); setTimeout(() => tone(180, 0.35, 'sawtooth', 0.2, 80), 150); }, [tone]);

  return { hitSound, surgeSound, hazardSound, missSound, moveSound, levelUpSound, overSound };
}

function spawnBurst(arr, x, y, color, count, speedMin, speedMax, sizeMin, sizeMax, lifeMs) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = speedMin + Math.random() * (speedMax - speedMin);
    arr.push({
      x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      life: lifeMs, maxLife: lifeMs, color,
      size: sizeMin + Math.random() * (sizeMax - sizeMin),
    });
  }
}

function App() {
  const [phase, setPhase] = useState('start'); // start | playing | over
  const [score, setScore] = useState(0);
  const [lives, setLives] = useState(LIVES_START);
  const [combo, setCombo] = useState(0);
  const [level, setLevel] = useState(1);
  const [hurt, setHurt] = useState(false);
  const [shakeIt, setShakeIt] = useState(false);
  const [flashOn, setFlashOn] = useState(false);
  const [pops, setPops] = useState(() => Array(CELLS).fill(null));
  const [flashes, setFlashes] = useState({});
  const [cursor, setCursor] = useState(0);
  const [highScore, setHighScore] = useState(() => parseInt(localStorage.getItem(HS_KEY) || '0', 10));
  const [statusMsg, setStatusMsg] = useState('Pop the glowing nodes before they fade. Avoid the red glitches.');

  const canvasRef = useRef(null);
  const arenaRef = useRef(null);
  const cellRefs = useRef([]);
  const popsRef = useRef(Array(CELLS).fill(null));
  const cursorRef = useRef(0);
  const scoreRef = useRef(0);
  const comboRef = useRef(0);
  const livesRef = useRef(LIVES_START);
  const levelRef = useRef(1);
  const hitsRef = useRef(0);
  const idCounterRef = useRef(0);
  const highScoreRef = useRef(highScore);
  const phaseRef = useRef('start');
  const spawnTimeoutRef = useRef(null);
  const particlesRef = useRef([]);
  const rafRef = useRef(null);

  const { hitSound, surgeSound, hazardSound, missSound, moveSound, levelUpSound, overSound } = useAudio();

  useEffect(() => { phaseRef.current = phase; }, [phase]);
  useEffect(() => { cursorRef.current = cursor; }, [cursor]);

  const resizeCanvas = useCallback(() => {
    const canvas = canvasRef.current;
    const arena = arenaRef.current;
    if (!canvas || !arena) return;
    const rect = arena.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }, []);

  useEffect(() => {
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    return () => window.removeEventListener('resize', resizeCanvas);
  }, [resizeCanvas]);

  const triggerFlash = useCallback((i, kind) => {
    const id = ++idCounterRef.current;
    setFlashes(prev => ({ ...prev, [i]: { id, kind } }));
    setTimeout(() => {
      setFlashes(prev => {
        if (prev[i] && prev[i].id === id) {
          const next = { ...prev };
          delete next[i];
          return next;
        }
        return prev;
      });
    }, 400);
  }, []);

  const clearAllTimers = useCallback(() => {
    clearTimeout(spawnTimeoutRef.current);
    popsRef.current.forEach(p => { if (p) clearTimeout(p.timerId); });
  }, []);

  const endGame = useCallback(() => {
    phaseRef.current = 'over';
    clearAllTimers();
    setPhase('over');
    overSound();
    setStatusMsg('System overloaded.');
  }, [overSound, clearAllTimers]);

  const expirePop = useCallback((i, id) => {
    const pop = popsRef.current[i];
    if (!pop || pop.id !== id) return;
    popsRef.current[i] = null;
    setPops(prev => { const next = prev.slice(); next[i] = null; return next; });
    if (pop.kind !== 'hazard' && comboRef.current > 0) {
      comboRef.current = 0;
      setCombo(0);
      missSound();
    }
  }, [missSound]);

  const doSpawn = useCallback(() => {
    const activeCount = popsRef.current.filter(Boolean).length;
    if (activeCount >= maxConcurrent(levelRef.current)) return;
    const empties = [];
    for (let i = 0; i < CELLS; i++) if (!popsRef.current[i]) empties.push(i);
    if (!empties.length) return;
    const i = empties[Math.floor(Math.random() * empties.length)];
    const r = Math.random();
    const hz = hazardChance(levelRef.current);
    const kind = r < hz ? 'hazard' : r < hz + 0.16 ? 'surge' : 'normal';
    const life = lifespanMs(levelRef.current);
    const id = ++idCounterRef.current;
    const timerId = setTimeout(() => expirePop(i, id), life);
    const pop = { id, kind, life, timerId };
    popsRef.current[i] = pop;
    setPops(prev => { const next = prev.slice(); next[i] = pop; return next; });
  }, [expirePop]);

  const scheduleSpawn = useCallback(() => {
    spawnTimeoutRef.current = setTimeout(() => {
      if (phaseRef.current === 'playing') doSpawn();
      if (phaseRef.current === 'playing') scheduleSpawn();
    }, spawnDelay(levelRef.current));
  }, [doSpawn]);

  const cellCenterPx = (i) => {
    const el = cellRefs.current[i];
    const arena = arenaRef.current;
    if (!el || !arena) return { x: 0, y: 0 };
    const r = el.getBoundingClientRect();
    const a = arena.getBoundingClientRect();
    return { x: r.left + r.width / 2 - a.left, y: r.top + r.height / 2 - a.top };
  };

  const handleCellClick = useCallback((i) => {
    if (phaseRef.current !== 'playing') return;
    setCursor(i);
    const pop = popsRef.current[i];
    if (!pop) return;
    clearTimeout(pop.timerId);
    popsRef.current[i] = null;
    setPops(prev => { const next = prev.slice(); next[i] = null; return next; });
    const { x, y } = cellCenterPx(i);

    if (pop.kind === 'hazard') {
      comboRef.current = 0;
      setCombo(0);
      livesRef.current -= 1;
      setLives(livesRef.current);
      setHurt(true);
      setTimeout(() => setHurt(false), 400);
      setShakeIt(true);
      setTimeout(() => setShakeIt(false), 300);
      setFlashOn(true);
      setTimeout(() => setFlashOn(false), 300);
      triggerFlash(i, 'bad');
      hazardSound();
      spawnBurst(particlesRef.current, x, y, '#ff2e4f', 18, 50, 220, 2, 5, 500);
      if (livesRef.current <= 0) { endGame(); return; }
      setStatusMsg('Zapped by a glitch! Watch the red nodes.');
      return;
    }

    comboRef.current += 1;
    setCombo(comboRef.current);
    if (pop.kind === 'surge') {
      const gained = 40 + comboRef.current * 4;
      scoreRef.current += gained;
      surgeSound();
      triggerFlash(i, 'surge');
      spawnBurst(particlesRef.current, x, y, '#ffd23d', 16, 60, 220, 2, 6, 480);
    } else {
      const gained = 10 + comboRef.current * 2;
      scoreRef.current += gained;
      hitSound(comboRef.current);
      triggerFlash(i, 'good');
      spawnBurst(particlesRef.current, x, y, '#3dffb0', 10, 40, 160, 2, 4, 400);
    }
    setScore(scoreRef.current);
    if (scoreRef.current > highScoreRef.current) {
      highScoreRef.current = scoreRef.current;
      localStorage.setItem(HS_KEY, String(scoreRef.current));
      setHighScore(scoreRef.current);
    }
    hitsRef.current += 1;
    if (hitsRef.current % HITS_PER_LEVEL === 0) {
      levelRef.current += 1;
      setLevel(levelRef.current);
      levelUpSound();
      setStatusMsg(`Level ${levelRef.current}! Glitches spawn faster now.`);
    }
  }, [hitSound, surgeSound, hazardSound, levelUpSound, triggerFlash, endGame]);

  const moveCursor = useCallback((dx, dy) => {
    const cur = cursorRef.current;
    let row = Math.floor(cur / COLS), col = cur % COLS;
    row = clamp(row + dy, 0, ROWS - 1);
    col = clamp(col + dx, 0, COLS - 1);
    const next = row * COLS + col;
    cursorRef.current = next;
    setCursor(next);
    moveSound();
  }, [moveSound]);

  const startGameRef = useRef(null);

  useEffect(() => {
    const onKeyDown = (e) => {
      if (phaseRef.current !== 'playing') {
        if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); startGameRef.current && startGameRef.current(); }
        return;
      }
      if (e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); moveCursor(0, -1); }
      else if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); moveCursor(0, 1); }
      else if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); moveCursor(-1, 0); }
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); moveCursor(1, 0); }
      else if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); handleCellClick(cursorRef.current); }
    };
    window.addEventListener('keydown', onKeyDown);
    return () => window.removeEventListener('keydown', onKeyDown);
  }, [moveCursor, handleCellClick]);

  const tick = useCallback((ts) => {
    const particles = particlesRef.current;
    const canvas = canvasRef.current;
    if (canvas) {
      const ctx = canvas.getContext('2d');
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx * 0.016; pt.y += pt.vy * 0.016;
        pt.vx *= 0.93; pt.vy *= 0.93;
        pt.life -= 16;
        if (pt.life <= 0) { particles.splice(i, 1); continue; }
        ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    rafRef.current = requestAnimationFrame(tick);
  }, []);

  useEffect(() => {
    rafRef.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(rafRef.current);
  }, [tick]);

  const startGame = useCallback(() => {
    clearAllTimers();
    popsRef.current = Array(CELLS).fill(null);
    particlesRef.current = [];
    scoreRef.current = 0;
    comboRef.current = 0;
    livesRef.current = LIVES_START;
    levelRef.current = 1;
    hitsRef.current = 0;
    cursorRef.current = 0;
    setPops(Array(CELLS).fill(null));
    setFlashes({});
    setScore(0);
    setCombo(0);
    setLives(LIVES_START);
    setLevel(1);
    setCursor(0);
    setStatusMsg('Click, tap, or move with arrows + Space to pop nodes. Avoid red.');
    setPhase('playing');
    phaseRef.current = 'playing';
    resizeCanvas();
    scheduleSpawn();
  }, [clearAllTimers, scheduleSpawn, resizeCanvas]);

  useEffect(() => { startGameRef.current = startGame; }, [startGame]);
  useEffect(() => () => clearAllTimers(), [clearAllTimers]);

  return (
    <div className="app" data-testid="game-canvas">
      <div className="hud">
        <div className="hudBox">
          <div className="hudLabel">Score</div>
          <div className="hudValue" data-testid="score">{score}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Lives</div>
          <div className={`hudValue lives ${hurt ? 'hurt' : ''}`} data-testid="lives">{'❤'.repeat(Math.max(0, lives))}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Combo</div>
          <div className="hudValue combo" data-testid="combo">x{combo}</div>
        </div>
      </div>

      <div className="title">GLITCH POPPER</div>

      <div className={`arenaOuter ${shakeIt ? 'shakeIt' : ''}`} ref={arenaRef} data-testid="play-field">
        <canvas ref={canvasRef} className="fx" data-testid="fx-canvas" />
        <div className={`flashOverlay ${flashOn ? 'on' : ''}`} />

        <div className="grid" data-testid="grid">
          {pops.map((pop, i) => (
            <button
              key={i}
              ref={(el) => { cellRefs.current[i] = el; }}
              type="button"
              className={`hole ${pop ? `active kind-${pop.kind}` : ''} ${cursor === i ? 'cursor' : ''}`}
              data-testid={`cell-${i}`}
              onClick={() => handleCellClick(i)}
              onTouchStart={(e) => { e.preventDefault(); handleCellClick(i); }}
            >
              {pop && <span key={pop.id} className="ring shrink" style={{ '--life': `${pop.life}ms` }} />}
              <span className="core" />
              {flashes[i] && <span className={`cellFlash ${flashes[i].kind}`} />}
            </button>
          ))}
        </div>

        {phase === 'start' && (
          <div className="overlay">
            <div className="subtitle">Neon nodes flicker to life across the grid — click or tap a glowing cell before its ring collapses to score, chaining hits into a rising combo. Gold surge nodes are worth extra, but red glitch nodes cost one of three lives if you pop them, so read before you tap. Letting a good node expire resets your combo, and every 10 hits speeds up the swarm and adds more glitches at once. Prefer a keyboard? Move the cursor with arrow keys / WASD and pop with Space or Enter.</div>
            <div className="highscoreLine" data-testid="high-score">Best: {highScore}</div>
            <button className="btn" data-testid="start-btn" onClick={() => startGame()}>START</button>
          </div>
        )}

        {phase === 'over' && (
          <div className="overlay">
            <div className="title" style={{ fontSize: 'clamp(20px, 6vw, 30px)', marginTop: 0 }}>GRID FRIED</div>
            <div className="hudValue" data-testid="final-score">Score: {score}</div>
            <div className="highscoreLine" data-testid="high-score-final">Best: {highScore}</div>
            <button className="btn" data-testid="restart-btn" onClick={() => startGame()}>PLAY AGAIN</button>
          </div>
        )}
      </div>

      <div className="status">{statusMsg}</div>
      <div className="footer">Glitch Popper — Level {level} — pop the good, dodge the red</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
