<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Chroma Forge</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #04030a; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }
  #root { width: 100%; height: 100%; }

  .app {
    width: 100%; height: 100%; position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; overflow: hidden; gap: 6px; padding: 6px 0;
    background: radial-gradient(circle at 50% 8%, #14091f 0%, #08050f 55%, #020207 100%);
  }

  .hud {
    position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-around;
    padding: 10px 12px; z-index: 15; pointer-events: none;
  }
  .hudBox { text-align: center; }
  .hudLabel { font-size: 10px; letter-spacing: 2px; color: #ff9df0; text-transform: uppercase; }
  .hudValue {
    font-size: 22px; font-weight: 800; color: #fff;
    text-shadow: 0 0 10px #ff9df0, 0 0 20px #ff9df0;
  }
  .hudValue.combo { color: #ffd23d; text-shadow: 0 0 10px #ffd23d, 0 0 22px #b3860a; }
  .hudValue.lives { color: #ff5ec4; text-shadow: 0 0 10px #ff5ec4, 0 0 22px #c9007f; }
  .hudValue.hurt { animation: hurtPulse 0.4s ease; }
  @keyframes hurtPulse { 0%,100% { opacity:1; transform: scale(1);} 50% { opacity:0.4; transform: scale(1.25);} }

  .title {
    font-size: clamp(18px, 5vw, 30px); font-weight: 900; letter-spacing: 3px; margin-top: 34px;
    background: linear-gradient(90deg, #ff5ec4, #9d6bff, #4de8ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(255,94,196,0.6));
    animation: titlePulse 2.4s ease-in-out infinite;
    text-align: center;
  }
  @keyframes titlePulse { 0%,100% { filter: drop-shadow(0 0 12px rgba(255,94,196,0.6)); } 50% { filter: drop-shadow(0 0 26px rgba(157,107,255,0.85)); } }

  .subtitle { color: #c4bcd8; font-size: 13px; letter-spacing: 0.5px; text-align: center; max-width: 460px; line-height: 1.55; }

  .btn {
    padding: 15px 40px; font-size: 19px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(135deg, #ff5ec4, #9d6bff);
    border: none; border-radius: 50px; color: #050014; cursor: pointer;
    box-shadow: 0 0 20px rgba(255,94,196,0.7), 0 0 50px rgba(157,107,255,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(255,94,196,0.9), 0 0 70px rgba(157,107,255,0.5); }
  .btn:active { transform: scale(0.96); }

  .highscoreLine { color: #ffd23d; font-size: 14px; text-shadow: 0 0 8px rgba(255,210,61,0.6); }

  .recipeBar {
    display: flex; align-items: center; justify-content: center; gap: 8px; z-index: 12;
    margin-top: 46px; min-height: 26px;
  }
  .recipeLabel { font-size: 10px; letter-spacing: 2px; color: #8f86a8; text-transform: uppercase; margin-right: 4px; }
  .pip {
    width: 16px; height: 16px; border-radius: 4px; transform: rotate(45deg);
    border: 1.5px solid rgba(255,255,255,0.35);
  }
  .pip.filled { box-shadow: 0 0 8px currentColor; }
  .pip.empty { opacity: 0.22; }

  .arenaOuter {
    position: relative; width: min(90vw, 400px); height: min(58vh, 440px); z-index: 5;
    border-radius: 18px; overflow: hidden; border: 2px solid rgba(255,94,196,0.25);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 0 30px rgba(255,94,196,0.12);
    background: #06040d; touch-action: none; margin-top: 4px; cursor: pointer;
  }
  .arenaOuter.shakeIt { animation: shakeKf 0.3s ease; }
  @keyframes shakeKf {
    0%, 100% { transform: translate(0,0); }
    20% { transform: translate(-6px, 3px); }
    40% { transform: translate(6px, -3px); }
    60% { transform: translate(-5px, -2px); }
    80% { transform: translate(5px, 2px); }
  }

  canvas.gameCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .flashOverlay {
    position: absolute; inset: 0; z-index: 9; pointer-events: none; background: rgba(255,46,79,0);
  }
  .flashOverlay.on { animation: flashKf 0.3s ease; }
  @keyframes flashKf { 0% { background: rgba(255,46,79,0.35); } 100% { background: rgba(255,46,79,0); } }

  .bankOverlay {
    position: absolute; inset: 0; z-index: 9; pointer-events: none; background: rgba(255,255,255,0);
  }
  .bankOverlay.on { animation: bankKf 0.35s ease; }
  @keyframes bankKf { 0% { background: rgba(255,255,255,0.28); } 100% { background: rgba(255,255,255,0); } }

  .overlay {
    position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 18px;
    background: rgba(6, 4, 13, 0.92); backdrop-filter: blur(4px);
  }

  .laneBtn {
    position: absolute; bottom: 4%; border: 2px solid rgba(255,255,255,0.25); border-radius: 14px;
    background: radial-gradient(circle at 40% 35%, rgba(255,255,255,0.08), rgba(10,10,20,0.85));
    cursor: pointer; -webkit-appearance: none; appearance: none; z-index: 7;
    color: #ff9df0; font-size: 22px; font-weight: 900;
    transition: transform 0.08s ease, box-shadow 0.15s ease;
    box-shadow: 0 0 10px rgba(255,94,196,0.15);
    width: 17%; height: 15%; min-height: 44px;
  }
  .laneBtn:active { transform: scale(0.92); box-shadow: 0 0 22px 4px rgba(255,94,196,0.5); }
  .laneBtnLeft { left: 3%; }
  .laneBtnRight { right: 3%; }

  .status { color: #b3a8cc; font-size: 12px; letter-spacing: 0.5px; height: 15px; z-index: 10; text-align: center; }
  .footer { position: relative; text-align: center; color: #201a2c; font-size: 10px; z-index: 10; padding-bottom: 2px; }

  @media (max-width: 480px) {
    .hudValue { font-size: 17px; }
    .btn { padding: 13px 30px; font-size: 16px; }
    .subtitle { font-size: 12px; }
    .arenaOuter { height: min(50vh, 380px); }
    .recipeBar { margin-top: 40px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const HS_KEY = 'chromaForgeHighScore';
const LIVES_START = 3;
const LANES = 3;
const COLOR_KEYS = ['R', 'G', 'B'];
const COLOR_HEX = { R: '#ff3a5e', G: '#39ff88', B: '#4de8ff' };

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function useAudio() {
  const ctxRef = useRef(null);
  const getCtx = () => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  };

  const tone = useCallback((freq, duration, type, gainScale, freqEnd) => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + duration);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(gainScale, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.05);
    } catch (e) {}
  }, []);

  const catchSound = useCallback(() => tone(520, 0.13, 'triangle', 0.14, 760), [tone]);
  const bankSound = useCallback(() => { tone(660, 0.12, 'sine', 0.16, 990); setTimeout(() => tone(880, 0.16, 'sine', 0.16, 1320), 90); setTimeout(() => tone(1100, 0.18, 'sine', 0.14, 1500), 180); }, [tone]);
  const spillSound = useCallback(() => tone(180, 0.32, 'sawtooth', 0.2, 60), [tone]);
  const overSound = useCallback(() => { tone(300, 0.25, 'sawtooth', 0.2, 200); setTimeout(() => tone(180, 0.35, 'sawtooth', 0.2, 80), 150); }, [tone]);
  const levelSound = useCallback(() => { tone(500, 0.1, 'square', 0.1, 900); setTimeout(() => tone(750, 0.12, 'square', 0.1, 1200), 90); }, [tone]);

  return { catchSound, bankSound, spillSound, overSound, levelSound };
}

function spawnBurst(arr, x, y, color, count, speedMin, speedMax, sizeMin, sizeMax, lifeMs) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = speedMin + Math.random() * (speedMax - speedMin);
    arr.push({
      x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      life: lifeMs, maxLife: lifeMs, color,
      size: sizeMin + Math.random() * (sizeMax - sizeMin),
    });
  }
}

function fallSpeed(level) { return clamp(120 + level * 14, 120, 380); }
function spawnInterval(level) { return clamp(760 - level * 35, 320, 760); }

function makeRecipe(level) {
  const numColors = level < 2 ? 1 : (level < 4 ? 2 : (Math.random() < 0.5 ? 2 : 3));
  const shuffled = [...COLOR_KEYS].sort(() => Math.random() - 0.5).slice(0, numColors);
  const recipe = { R: 0, G: 0, B: 0 };
  const maxEach = level < 3 ? 2 : 3;
  shuffled.forEach((k) => { recipe[k] = 1 + Math.floor(Math.random() * maxEach); });
  return recipe;
}

function recipeDone(remaining) { return remaining.R === 0 && remaining.G === 0 && remaining.B === 0; }
function recipeTotal(recipe) { return recipe.R + recipe.G + recipe.B; }

function App() {
  const [phase, setPhase] = useState('start'); // start | playing | over
  const [score, setScore] = useState(0);
  const [lives, setLives] = useState(LIVES_START);
  const [combo, setCombo] = useState(0);
  const [level, setLevel] = useState(1);
  const [hurt, setHurt] = useState(false);
  const [shakeIt, setShakeIt] = useState(false);
  const [flashOn, setFlashOn] = useState(false);
  const [bankOn, setBankOn] = useState(false);
  const [recipe, setRecipe] = useState({ R: 1, G: 0, B: 0 });
  const [remaining, setRemaining] = useState({ R: 1, G: 0, B: 0 });
  const [highScore, setHighScore] = useState(() => parseInt(localStorage.getItem(HS_KEY) || '0', 10));
  const [statusMsg, setStatusMsg] = useState('Match the recipe. Don’t overfill.');

  const canvasRef = useRef(null);
  const arenaRef = useRef(null);
  const particlesRef = useRef([]);
  const starsRef = useRef([]);
  const itemsRef = useRef([]);
  const itemIdRef = useRef(1);
  const scoreRef = useRef(0);
  const comboRef = useRef(0);
  const livesRef = useRef(LIVES_START);
  const levelRef = useRef(1);
  const bankedCountRef = useRef(0);
  const highScoreRef = useRef(highScore);
  const phaseRef = useRef('start');
  const dimsRef = useRef({ w: 300, h: 300 });
  const playerLaneRef = useRef(1);
  const spawnAccRef = useRef(0);
  const recipeRef = useRef({ R: 1, G: 0, B: 0 });
  const remainingRef = useRef({ R: 1, G: 0, B: 0 });
  const rafRef = useRef(null);
  const lastTsRef = useRef(null);
  const timeRef = useRef(0);
  const hurtTimeoutRef = useRef(null);
  const shakeTimeoutRef = useRef(null);
  const flashTimeoutRef = useRef(null);
  const bankTimeoutRef = useRef(null);

  const { catchSound, bankSound, spillSound, overSound, levelSound } = useAudio();

  useEffect(() => { phaseRef.current = phase; }, [phase]);

  const resizeCanvas = useCallback(() => {
    const canvas = canvasRef.current;
    const arena = arenaRef.current;
    if (!canvas || !arena) return;
    const rect = arena.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dimsRef.current = { w: rect.width, h: rect.height };
  }, []);

  useEffect(() => {
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    return () => window.removeEventListener('resize', resizeCanvas);
  }, [resizeCanvas]);

  useEffect(() => {
    starsRef.current = Array.from({ length: 30 }, () => ({
      x: Math.random(), y: Math.random(), spd: 16 + Math.random() * 34, size: 0.6 + Math.random() * 1.4,
    }));
  }, []);

  const laneX = useCallback((lane) => {
    const { w } = dimsRef.current;
    const laneW = w / LANES;
    return laneW * (lane + 0.5);
  }, []);

  const endGame = useCallback(() => {
    phaseRef.current = 'over';
    setPhase('over');
    overSound();
    setStatusMsg('The forge went cold.');
  }, [overSound]);

  const triggerHit = useCallback(() => {
    setHurt(true);
    clearTimeout(hurtTimeoutRef.current);
    hurtTimeoutRef.current = setTimeout(() => setHurt(false), 400);
    setShakeIt(true);
    clearTimeout(shakeTimeoutRef.current);
    shakeTimeoutRef.current = setTimeout(() => setShakeIt(false), 300);
    setFlashOn(true);
    clearTimeout(flashTimeoutRef.current);
    flashTimeoutRef.current = setTimeout(() => setFlashOn(false), 300);
  }, []);

  const triggerBank = useCallback(() => {
    setBankOn(true);
    clearTimeout(bankTimeoutRef.current);
    bankTimeoutRef.current = setTimeout(() => setBankOn(false), 350);
  }, []);

  const assignNewRecipe = useCallback((lvl) => {
    const r = makeRecipe(lvl);
    recipeRef.current = r;
    remainingRef.current = { ...r };
    setRecipe(r);
    setRemaining({ ...r });
  }, []);

  const resolveItem = useCallback((item) => {
    const { h } = dimsRef.current;
    const px = laneX(item.lane);
    const py = h * 0.86;
    if (item.lane !== playerLaneRef.current) return;

    const color = item.color;
    const rem = remainingRef.current;

    if (rem[color] > 0) {
      rem[color] -= 1;
      remainingRef.current = { ...rem };
      setRemaining(remainingRef.current);
      comboRef.current += 1;
      setCombo(comboRef.current);
      const gained = 10 + comboRef.current * 2;
      scoreRef.current += gained;
      setScore(scoreRef.current);
      catchSound();
      spawnBurst(particlesRef.current, px, py, COLOR_HEX[color], 9, 30, 110, 1.5, 3.5, 400);

      if (recipeDone(remainingRef.current)) {
        const bonus = 50 + comboRef.current * 5;
        scoreRef.current += bonus;
        setScore(scoreRef.current);
        if (scoreRef.current > highScoreRef.current) {
          highScoreRef.current = scoreRef.current;
          localStorage.setItem(HS_KEY, String(scoreRef.current));
          setHighScore(scoreRef.current);
        }
        bankSound();
        triggerBank();
        spawnBurst(particlesRef.current, px, py, '#ffd23d', 22, 40, 190, 2, 5.5, 500);
        bankedCountRef.current += 1;
        const newLevel = Math.floor(bankedCountRef.current / 4) + 1;
        if (newLevel !== levelRef.current) {
          levelRef.current = newLevel;
          setLevel(newLevel);
          levelSound();
          setStatusMsg(`Level ${newLevel}! Recipes get trickier.`);
        } else {
          setStatusMsg('Batch forged!');
        }
        assignNewRecipe(levelRef.current);
      } else {
        setStatusMsg('Mix added.');
      }
    } else {
      comboRef.current = 0;
      setCombo(0);
      livesRef.current -= 1;
      setLives(livesRef.current);
      triggerHit();
      spillSound();
      spawnBurst(particlesRef.current, px, py, '#ff3a5e', 14, 50, 190, 2, 5, 420);
      remainingRef.current = { ...recipeRef.current };
      setRemaining(remainingRef.current);
      if (livesRef.current <= 0) {
        setStatusMsg('Vessel overflowed!');
        endGame();
      } else {
        setStatusMsg('Spilled! Batch reset.');
      }
    }
  }, [laneX, catchSound, bankSound, spillSound, triggerHit, triggerBank, endGame, levelSound, assignNewRecipe]);

  const resetGame = useCallback(() => {
    scoreRef.current = 0; setScore(0);
    comboRef.current = 0; setCombo(0);
    livesRef.current = LIVES_START; setLives(LIVES_START);
    levelRef.current = 1; setLevel(1);
    bankedCountRef.current = 0;
    itemsRef.current = [];
    particlesRef.current = [];
    playerLaneRef.current = 1;
    spawnAccRef.current = 0;
    timeRef.current = 0;
    assignNewRecipe(1);
  }, [assignNewRecipe]);

  const startGame = useCallback(() => {
    resizeCanvas();
    resetGame();
    setStatusMsg('Match the recipe. Don’t overfill.');
    phaseRef.current = 'playing';
    setPhase('playing');
  }, [resizeCanvas, resetGame]);

  const startGameRef = useRef(null);
  useEffect(() => { startGameRef.current = startGame; }, [startGame]);

  const moveLane = useCallback((delta) => {
    if (phaseRef.current !== 'playing') return;
    playerLaneRef.current = clamp(playerLaneRef.current + delta, 0, LANES - 1);
  }, []);

  const setLaneFromX = useCallback((clientX) => {
    if (phaseRef.current !== 'playing') return;
    const arena = arenaRef.current;
    if (!arena) return;
    const rect = arena.getBoundingClientRect();
    const relX = clamp(clientX - rect.left, 0, rect.width);
    const lane = clamp(Math.floor((relX / rect.width) * LANES), 0, LANES - 1);
    playerLaneRef.current = lane;
  }, []);

  const handleArenaClick = useCallback((e) => {
    if (phaseRef.current !== 'playing') return;
    setLaneFromX(e.clientX);
  }, [setLaneFromX]);

  const handleArenaTouch = useCallback((e) => {
    if (phaseRef.current !== 'playing') return;
    const t = e.touches && e.touches[0];
    if (t) { e.preventDefault(); setLaneFromX(t.clientX); }
  }, [setLaneFromX]);

  useEffect(() => {
    const onKeyDown = (e) => {
      if (phaseRef.current !== 'playing') {
        if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); startGameRef.current && startGameRef.current(); }
        return;
      }
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); moveLane(-1); }
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); moveLane(1); }
    };
    window.addEventListener('keydown', onKeyDown);
    return () => window.removeEventListener('keydown', onKeyDown);
  }, [moveLane]);

  useEffect(() => () => {
    clearTimeout(hurtTimeoutRef.current);
    clearTimeout(shakeTimeoutRef.current);
    clearTimeout(flashTimeoutRef.current);
    clearTimeout(bankTimeoutRef.current);
  }, []);

  // Main loop: physics, spawning, drawing
  useEffect(() => {
    const loop = (ts) => {
      const canvas = canvasRef.current;
      if (canvas) {
        const ctx = canvas.getContext('2d');
        const { w, h } = dimsRef.current;

        if (lastTsRef.current == null) lastTsRef.current = ts;
        let dt = (ts - lastTsRef.current) / 1000;
        lastTsRef.current = ts;
        dt = clamp(dt, 0, 0.033);

        if (phaseRef.current === 'playing') timeRef.current += dt * 1000;

        if (w > 10 && h > 10) {
          for (const s of starsRef.current) {
            s.y += (s.spd * dt) / h;
            if (s.y > 1) s.y -= 1;
          }

          if (phaseRef.current === 'playing') {
            const speed = fallSpeed(levelRef.current);
            for (const item of itemsRef.current) {
              item.y += speed * dt * (h / 420);
              if (!item.resolved && item.y >= h * 0.86) {
                item.resolved = true;
                resolveItem(item);
              }
            }
            itemsRef.current = itemsRef.current.filter((it) => it.y < h + 40);

            spawnAccRef.current += dt * 1000;
            const interval = spawnInterval(levelRef.current);
            if (spawnAccRef.current >= interval) {
              spawnAccRef.current = 0;
              const lane = Math.floor(Math.random() * LANES);
              const color = COLOR_KEYS[Math.floor(Math.random() * COLOR_KEYS.length)];
              itemsRef.current.push({ id: itemIdRef.current++, lane, y: -30, color, resolved: false });
            }
          }

          particlesRef.current = particlesRef.current.filter((p) => p.life > 0);
          for (const p of particlesRef.current) {
            p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; p.life -= dt * 1000;
          }

          ctx.clearRect(0, 0, w, h);
          ctx.fillStyle = '#06040d';
          ctx.fillRect(0, 0, w, h);

          for (const s of starsRef.current) {
            ctx.save();
            ctx.globalAlpha = 0.5;
            ctx.fillStyle = '#d8a8ff';
            ctx.beginPath();
            ctx.arc(s.x * w, s.y * h, s.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          const laneW = w / LANES;
          ctx.strokeStyle = 'rgba(255,94,196,0.08)';
          ctx.lineWidth = 1;
          for (let i = 1; i < LANES; i++) {
            ctx.beginPath();
            ctx.setLineDash([6, 10]);
            ctx.moveTo(i * laneW, 0);
            ctx.lineTo(i * laneW, h);
            ctx.stroke();
          }
          ctx.setLineDash([]);

          const playerY = h * 0.86;
          ctx.save();
          ctx.strokeStyle = 'rgba(255,255,255,0.06)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(0, playerY);
          ctx.lineTo(w, playerY);
          ctx.stroke();
          ctx.restore();

          for (const item of itemsRef.current) {
            const x = laneX(item.lane);
            const y = item.y;
            const r = Math.min(laneW * 0.24, 17);
            const pulse = 1 + Math.sin(timeRef.current / 150 + item.id) * 0.12;
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = COLOR_HEX[item.color];
            ctx.shadowColor = COLOR_HEX[item.color];
            ctx.shadowBlur = 18;
            ctx.beginPath();
            ctx.arc(0, 0, r * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          // player vessel
          if (phaseRef.current === 'playing' || phaseRef.current === 'over') {
            const px = laneX(playerLaneRef.current);
            const size = Math.min(laneW * 0.34, 24);
            ctx.save();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#9d6bff';
            ctx.shadowBlur = 16;
            ctx.beginPath();
            ctx.moveTo(px - size, playerY - size * 0.3);
            ctx.lineTo(px - size * 0.7, playerY + size * 0.6);
            ctx.quadraticCurveTo(px, playerY + size * 0.95, px + size * 0.7, playerY + size * 0.6);
            ctx.lineTo(px + size, playerY - size * 0.3);
            ctx.stroke();
            ctx.restore();
          }

          for (const p of particlesRef.current) {
            const a = clamp(p.life / p.maxLife, 0, 1);
            ctx.save();
            ctx.globalAlpha = a;
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
          }
        }
      }
      rafRef.current = requestAnimationFrame(loop);
    };
    rafRef.current = requestAnimationFrame(loop);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [laneX, resolveItem]);

  const pips = [];
  COLOR_KEYS.forEach((k) => {
    for (let i = 0; i < recipe[k]; i++) {
      const filled = i >= remaining[k];
      pips.push(
        <div
          key={k + i}
          className={"pip " + (filled ? "filled" : "empty")}
          style={{ background: COLOR_HEX[k], color: COLOR_HEX[k] }}
        />
      );
    }
  });

  return (
    <div className="app">
      <div className="hud">
        <div className="hudBox">
          <div className="hudLabel">Score</div>
          <div className="hudValue" data-testid="score">{score}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Combo</div>
          <div className="hudValue combo" data-testid="combo">x{combo}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Level</div>
          <div className="hudValue" data-testid="level">{level}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Lives</div>
          <div className={"hudValue lives" + (hurt ? " hurt" : "")} data-testid="lives">{'♥'.repeat(Math.max(0, lives))}</div>
        </div>
      </div>

      {phase === 'playing' && (
        <div className="recipeBar" data-testid="recipe">
          <div className="recipeLabel">Recipe</div>
          {pips}
        </div>
      )}

      {phase !== 'playing' && (
        <div style={{ marginTop: 34, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 14 }}>
          <div className="title">CHROMA FORGE</div>
          <div className="subtitle">
            Three color columns pour orbs into the forge. Move the vessel with Arrow keys / A-D, tap or click a column, or the side buttons. Catch exactly the colors the recipe asks for to bank a batch and grow your combo &mdash; but grab one color too many and the mix spills, costing a life and resetting the batch. Every 4 batches the recipes get harder.
          </div>
        </div>
      )}

      <div
        className={"arenaOuter" + (shakeIt ? " shakeIt" : "")}
        data-testid="play-field"
        ref={arenaRef}
        onClick={handleArenaClick}
        onTouchStart={handleArenaTouch}
      >
        <canvas className="gameCanvas" data-testid="canvas" ref={canvasRef}></canvas>
        <div className={"flashOverlay" + (flashOn ? " on" : "")}></div>
        <div className={"bankOverlay" + (bankOn ? " on" : "")}></div>

        {phase === 'playing' && (
          <React.Fragment>
            <button
              className="laneBtn laneBtnLeft"
              data-testid="lane-left-btn"
              onClick={(e) => { e.stopPropagation(); moveLane(-1); }}
              onTouchStart={(e) => { e.stopPropagation(); e.preventDefault(); moveLane(-1); }}
            >&#9664;</button>
            <button
              className="laneBtn laneBtnRight"
              data-testid="lane-right-btn"
              onClick={(e) => { e.stopPropagation(); moveLane(1); }}
              onTouchStart={(e) => { e.stopPropagation(); e.preventDefault(); moveLane(1); }}
            >&#9654;</button>
          </React.Fragment>
        )}

        {phase === 'start' && (
          <div className="overlay">
            <div className="highscoreLine">High Score: {highScore}</div>
            <button className="btn" data-testid="start-btn" onClick={startGame}>START</button>
          </div>
        )}

        {phase === 'over' && (
          <div className="overlay">
            <div className="title" style={{ marginTop: 0, fontSize: 26 }}>FORGE COLD</div>
            <div className="hudValue" style={{ fontSize: 30 }}>{score}</div>
            <div className="highscoreLine">High Score: {highScore}</div>
            <button className="btn" data-testid="start-btn" onClick={startGame}>RETRY</button>
          </div>
        )}
      </div>

      <div className="status">{statusMsg}</div>
      <div className="footer">Neon Game Arcade</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
