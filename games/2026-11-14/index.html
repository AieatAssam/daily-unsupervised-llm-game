<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Spark Grid</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #05040d; overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
    touch-action: none;
    user-select: none;
  }
  #root { width: 100%; height: 100%; }
  .app {
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center;
    justify-content: flex-start;
    position: relative;
    background: radial-gradient(circle at 50% 4%, #141026 0%, #0a0e20 55%, #040308 100%);
    overflow: hidden;
  }
  .bg-grad {
    position: absolute; inset: 0;
    background: linear-gradient(120deg, rgba(79,255,214,0.07), rgba(255,79,180,0.08), rgba(79,168,255,0.06));
    background-size: 400% 400%;
    animation: drift 20s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes drift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .hud {
    position: relative;
    width: 100%;
    max-width: 480px;
    display: flex;
    justify-content: space-around;
    padding: 8px 8px 0;
    z-index: 5;
    gap: 4px;
  }
  .hud-item {
    flex: 1;
    text-align: center;
    color: #e4ecff;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity: 0.85;
  }
  .hud-value {
    font-size: 18px;
    font-weight: 700;
    display: block;
    margin-top: 2px;
  }
  .score-val { color: #4fffd6; text-shadow: 0 0 10px #4fffd6; }
  .combo-val { color: #ff6cc4; text-shadow: 0 0 10px #ff6cc4; }
  .lives-val { color: #ffd84f; text-shadow: 0 0 10px #ffd84f; }
  .level-val { color: #4fa8ff; text-shadow: 0 0 10px #4fa8ff; }
  .field-wrap {
    position: relative;
    flex: 1;
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 2;
    min-height: 0;
    padding: 6px 10px;
    gap: 10px;
  }
  .grid-stage {
    position: relative;
    width: min(94vw, 400px);
    aspect-ratio: 1 / 1;
    max-height: 62%;
    border-radius: 18px;
    border: 1px solid rgba(79,255,214,0.25);
    box-shadow: inset 0 0 40px rgba(79,255,214,0.08), 0 0 30px rgba(255,79,180,0.1);
    overflow: hidden;
    touch-action: none;
    background: rgba(8,10,22,0.6);
    padding: 8px;
  }
  canvas.game-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
    z-index: 3;
  }
  .grid {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 6px;
  }
  .cell {
    position: relative;
    border-radius: 10px;
    border: 1px solid rgba(140,150,190,0.25);
    background: rgba(20,24,42,0.65);
    padding: 0;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
  }
  .cell:active { transform: scale(0.92); }
  .cell.cursor { box-shadow: 0 0 0 2px #e4ecff inset; }
  .cell.target {
    background: rgba(79,255,214,0.28);
    border-color: #4fffd6;
    box-shadow: 0 0 16px rgba(79,255,214,0.55);
  }
  .cell.bonus {
    background: rgba(255,216,79,0.3);
    border-color: #ffd84f;
    box-shadow: 0 0 18px rgba(255,216,79,0.6);
  }
  .cell.hazard {
    background: rgba(255,79,111,0.28);
    border-color: #ff4f6f;
    box-shadow: 0 0 16px rgba(255,79,111,0.55);
  }
  .banner {
    position: absolute;
    top: 4px;
    left: 50%;
    transform: translateX(-50%);
    color: #ffd84f;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1px;
    text-shadow: 0 0 10px #ffd84f;
    z-index: 6;
    pointer-events: none;
    white-space: nowrap;
  }
  .burst-row {
    position: relative;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    max-width: 380px;
  }
  .meter-wrap {
    flex: 1;
    height: 14px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    overflow: hidden;
  }
  .meter-fill {
    height: 100%;
    background: linear-gradient(90deg, #4fa8ff, #4fffd6);
    transition: width 0.1s linear;
  }
  button.burst-btn {
    min-height: 44px;
    min-width: 90px;
    border-radius: 12px;
    border: 1px solid rgba(255,216,79,0.5);
    background: linear-gradient(135deg, rgba(255,216,79,0.35), rgba(255,108,196,0.2));
    color: #fff4cf;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 1px;
    cursor: pointer;
  }
  button.burst-btn:disabled { opacity: 0.35; cursor: default; }
  button.burst-btn:not(:disabled):active { transform: scale(0.94); }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(5,4,12,0.94);
    border-radius: 18px;
    z-index: 10;
    text-align: center;
    padding: 14px 18px;
    overflow-y: auto;
  }
  .title {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #fff;
    text-shadow: 0 0 20px #4fffd6, 0 0 40px #ff6cc4;
    margin: 0;
  }
  .subtitle {
    color: #c7d6ff;
    font-size: 12px;
    max-width: 300px;
    line-height: 1.5;
    margin: 0;
  }
  button.start-btn {
    background: linear-gradient(135deg, #4fffd6, #ff6cc4);
    border: none;
    color: #05040c;
    font-weight: 800;
    font-size: 17px;
    letter-spacing: 1px;
    padding: 14px 34px;
    border-radius: 999px;
    cursor: pointer;
    min-height: 48px;
    min-width: 130px;
    box-shadow: 0 0 25px rgba(79,255,214,0.6), 0 0 45px rgba(255,108,196,0.4);
    transition: transform 0.12s ease;
  }
  button.start-btn:active { transform: scale(0.94); }
  .finalscore { color: #fff; font-size: 15px; }
  .finalscore b { color: #4fffd6; font-size: 20px; }
  .highscore-line { color: #ffd84f; font-size: 13px; }
  .hint {
    position: relative;
    z-index: 5;
    color: #b7c8e8;
    font-size: 10px;
    text-align: center;
    padding: 2px 10px 10px;
    opacity: 0.75;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useRef, useEffect, useState, useCallback, useMemo } = React;

const HIGH_SCORE_KEY = 'sparkGridHighScore';
const START_LIVES = 3;
const GRID_SIZE = 5;
const CELL_COUNT = GRID_SIZE * GRID_SIZE;
const HITS_PER_LEVEL = 10;
const BURST_METER_MAX = 100;
const BURST_METER_PER_HIT = 16;

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function spawnIntervalForLevel(level) { return clamp(880 - level * 55, 320, 880); }
function lifespanForLevel(level) { return clamp(1500 - level * 70, 650, 1500); }
function maxActiveForLevel(level) { return clamp(1 + Math.floor(level / 3), 1, 4); }
function hazardChanceForLevel(level) { return clamp(0.12 + level * 0.02, 0.12, 0.4); }

function useAudio() {
  const ctxRef = useRef(null);
  const getCtx = useCallback(() => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  }, []);

  const beep = useCallback((freq, dur, type, vol, slideTo) => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      const now = ctx.currentTime;
      if (slideTo != null) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), now + dur);
      gain.gain.value = vol == null ? 0.08 : vol;
      osc.connect(gain);
      gain.connect(ctx.destination);
      gain.gain.setValueAtTime(gain.gain.value, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
      osc.start(now);
      osc.stop(now + dur);
    } catch (e) { /* audio unavailable */ }
  }, [getCtx]);

  return useMemo(() => ({
    tick: () => beep(300, 0.04, 'sine', 0.03),
    hit: (combo) => beep(420 + Math.min(combo, 20) * 18, 0.08, 'triangle', 0.09, 760),
    bonus: () => {
      beep(620, 0.08, 'triangle', 0.1);
      setTimeout(() => beep(880, 0.12, 'triangle', 0.1), 70);
    },
    hazard: () => beep(160, 0.18, 'sawtooth', 0.12, 70),
    burst: () => {
      beep(300, 0.1, 'sawtooth', 0.08, 900);
      setTimeout(() => beep(900, 0.14, 'triangle', 0.09), 80);
    },
    levelup: () => {
      beep(500, 0.09, 'triangle', 0.08);
      setTimeout(() => beep(700, 0.12, 'triangle', 0.08), 90);
    },
    gameover: () => beep(90, 0.55, 'sawtooth', 0.12, 40),
  }), [beep]);
}

function buildGrid() {
  return Array.from({ length: CELL_COUNT }, () => ({ type: 'idle', expireAt: 0 }));
}

function App() {
  const stageRef = useRef(null);
  const canvasRef = useRef(null);

  const initialHigh = (() => {
    const v = parseInt(localStorage.getItem(HIGH_SCORE_KEY) || '0', 10);
    return isNaN(v) ? 0 : v;
  })();

  const [ui, setUi] = useState({
    phase: 'idle', score: 0, combo: 0, lives: START_LIVES, level: 1,
    highScore: initialHigh, banner: '', meter: 0,
  });
  const uiRef = useRef(ui);
  useEffect(() => { uiRef.current = ui; }, [ui]);

  const audio = useAudio();
  const gameRef = useRef({
    grid: buildGrid(),
    cursor: 12,
    particles: [],
    dims: { w: 320, h: 320 },
    spawnTimer: 0,
    hitsThisLevel: 0,
    flashColor: null, flashUntil: 0,
    bannerClearAt: 0,
  });
  const [cursor, setCursor] = useState(12);
  const [gridView, setGridView] = useState(() => buildGrid());

  const spawnParticles = useCallback((cx, cy, color, count, spread) => {
    const parts = gameRef.current.particles;
    if (parts.length > 220) return;
    for (let i = 0; i < (count || 10); i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = (spread || 50) + Math.random() * (spread || 50);
      parts.push({
        x: cx, y: cy, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
        life: 320 + Math.random() * 240, maxLife: 560, color, size: 2 + Math.random() * 3,
      });
    }
  }, []);

  const showBanner = useCallback((text) => {
    const g = gameRef.current;
    g.bannerClearAt = performance.now() + 900;
    setUi(prev => ({ ...prev, banner: text }));
  }, []);

  const cellCenter = useCallback((index) => {
    const g = gameRef.current;
    const w = g.dims.w, h = g.dims.h;
    const col = index % GRID_SIZE, row = Math.floor(index / GRID_SIZE);
    const cw = w / GRID_SIZE, ch = h / GRID_SIZE;
    return { x: cw * (col + 0.5), y: ch * (row + 0.5) };
  }, []);

  const endGame = useCallback(() => {
    const cur = uiRef.current;
    const newHigh = Math.max(cur.score, cur.highScore);
    localStorage.setItem(HIGH_SCORE_KEY, String(newHigh));
    audio.gameover();
    setUi(prev => ({ ...prev, phase: 'over', highScore: newHigh }));
  }, [audio]);

  const handleCellTap = useCallback((index) => {
    const cur = uiRef.current;
    if (cur.phase !== 'playing') return;
    const g = gameRef.current;
    const cell = g.grid[index];
    const { x, y } = cellCenter(index);

    if (cell.type === 'idle') {
      spawnParticles(x, y, '#8892b8', 4, 16);
      audio.tick();
      return;
    }

    if (cell.type === 'hazard') {
      cell.type = 'idle'; cell.expireAt = 0;
      g.flashColor = '#ff4f6f';
      g.flashUntil = performance.now() + 220;
      spawnParticles(x, y, '#ff4f6f', 20, 90);
      audio.hazard();
      showBanner('HAZARD!');
      setUi(prev => {
        const lives = prev.lives - 1;
        if (lives <= 0) {
          setTimeout(() => endGame(), 0);
          return { ...prev, lives: 0, combo: 0 };
        }
        return { ...prev, lives, combo: 0 };
      });
      return;
    }

    const isBonus = cell.type === 'bonus';
    cell.type = 'idle'; cell.expireAt = 0;
    spawnParticles(x, y, isBonus ? '#ffd84f' : '#4fffd6', isBonus ? 24 : 14, isBonus ? 100 : 70);
    (isBonus ? audio.bonus : audio.hit)(uiRef.current.combo);
    g.hitsThisLevel += 1;

    setUi(prev => {
      const nextCombo = prev.combo + (isBonus ? 2 : 1);
      const gained = Math.round((isBonus ? 40 : 10) * (1 + nextCombo * 0.1));
      let meter = Math.min(BURST_METER_MAX, prev.meter + BURST_METER_PER_HIT);
      let level = prev.level;
      let hitsThisLevel = g.hitsThisLevel;
      if (hitsThisLevel >= HITS_PER_LEVEL) {
        hitsThisLevel = 0;
        g.hitsThisLevel = 0;
        level += 1;
        setTimeout(() => { audio.levelup(); showBanner('LEVEL UP!'); }, 0);
      }
      return { ...prev, score: prev.score + gained, combo: nextCombo, meter, level };
    });
  }, [audio, spawnParticles, cellCenter, endGame, showBanner]);

  const handleBurst = useCallback(() => {
    const cur = uiRef.current;
    if (cur.phase !== 'playing' || cur.meter < BURST_METER_MAX) return;
    const g = gameRef.current;
    let cleared = 0;
    for (let i = 0; i < g.grid.length; i++) {
      const cell = g.grid[i];
      if (cell.type === 'target' || cell.type === 'bonus') {
        cleared += cell.type === 'bonus' ? 2 : 1;
        const { x, y } = cellCenter(i);
        spawnParticles(x, y, '#ffd84f', 16, 80);
      }
      cell.type = 'idle'; cell.expireAt = 0;
    }
    const { x, y } = cellCenter(12);
    spawnParticles(x, y, '#ff6cc4', 60, 160);
    audio.burst();
    showBanner('BURST!');
    setUi(prev => ({
      ...prev,
      score: prev.score + 20 + cleared * 18,
      combo: prev.combo + 1,
      meter: 0,
    }));
  }, [audio, spawnParticles, cellCenter, showBanner]);

  const moveCursor = useCallback((dx, dy) => {
    const g = gameRef.current;
    const col = g.cursor % GRID_SIZE, row = Math.floor(g.cursor / GRID_SIZE);
    const nc = (col + dx + GRID_SIZE) % GRID_SIZE;
    const nr = (row + dy + GRID_SIZE) % GRID_SIZE;
    const next = nr * GRID_SIZE + nc;
    g.cursor = next;
    setCursor(next);
  }, []);

  const startGame = useCallback(() => {
    const g = gameRef.current;
    g.grid = buildGrid();
    g.cursor = 12;
    g.particles = [];
    g.spawnTimer = 0;
    g.hitsThisLevel = 0;
    const rect = stageRef.current ? stageRef.current.getBoundingClientRect() : { width: 320, height: 320 };
    g.dims = { w: rect.width, h: rect.height };
    setCursor(12);
    setGridView(buildGrid());
    setUi(prev => ({
      ...prev, phase: 'playing', score: 0, combo: 0, lives: START_LIVES, level: 1,
      banner: '', meter: 0,
    }));
  }, []);

  const press = useCallback(() => {
    const cur = uiRef.current;
    if (cur.phase === 'idle' || cur.phase === 'over') startGame();
  }, [startGame]);

  useEffect(() => {
    function onKeyDown(e) {
      const cur = uiRef.current;
      if (cur.phase === 'idle' || cur.phase === 'over') {
        if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); startGame(); }
        return;
      }
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); moveCursor(-1, 0); }
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); moveCursor(1, 0); }
      else if (e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); moveCursor(0, -1); }
      else if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); moveCursor(0, 1); }
      else if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); handleCellTap(gameRef.current.cursor); }
      else if (e.code === 'KeyB') { e.preventDefault(); handleBurst(); }
    }
    window.addEventListener('keydown', onKeyDown);
    return () => window.removeEventListener('keydown', onKeyDown);
  }, [startGame, moveCursor, handleCellTap, handleBurst]);

  useEffect(() => {
    function updateDims() {
      if (stageRef.current) {
        const r = stageRef.current.getBoundingClientRect();
        gameRef.current.dims = { w: r.width, h: r.height };
      }
    }
    updateDims();
    window.addEventListener('resize', updateDims);
    return () => window.removeEventListener('resize', updateDims);
  }, []);

  useEffect(() => {
    let raf;
    let last = performance.now();
    let viewTimer = 0;
    const loop = (t) => {
      const dt = Math.min(0.033, (t - last) / 1000);
      last = t;
      const cur = uiRef.current;
      const g = gameRef.current;
      const now = performance.now();

      if (cur.phase === 'playing') {
        g.spawnTimer += dt * 1000;
        const interval = spawnIntervalForLevel(cur.level);
        if (g.spawnTimer >= interval) {
          g.spawnTimer = 0;
          const activeCount = g.grid.reduce((n, c) => n + (c.type !== 'idle' ? 1 : 0), 0);
          if (activeCount < maxActiveForLevel(cur.level)) {
            const idleIdx = [];
            for (let i = 0; i < g.grid.length; i++) if (g.grid[i].type === 'idle') idleIdx.push(i);
            if (idleIdx.length) {
              const idx = idleIdx[Math.floor(Math.random() * idleIdx.length)];
              const roll = Math.random();
              let type = 'target';
              if (roll < 0.08) type = 'bonus';
              else if (roll < 0.08 + hazardChanceForLevel(cur.level)) type = 'hazard';
              g.grid[idx] = { type, expireAt: now + lifespanForLevel(cur.level) };
            }
          }
        }

        for (let i = 0; i < g.grid.length; i++) {
          const cell = g.grid[i];
          if (cell.type !== 'idle' && now > cell.expireAt) {
            const wasMiss = cell.type === 'target' || cell.type === 'bonus';
            cell.type = 'idle'; cell.expireAt = 0;
            if (wasMiss) {
              setUi(prev => (prev.combo !== 0 ? { ...prev, combo: 0 } : prev));
            }
          }
        }

        if (g.bannerClearAt && now > g.bannerClearAt) {
          g.bannerClearAt = 0;
          setUi(prev => (prev.banner ? { ...prev, banner: '' } : prev));
        }

        viewTimer += dt * 1000;
        if (viewTimer > 70) {
          viewTimer = 0;
          setGridView(g.grid.map(c => ({ type: c.type })));
        }
      }

      const parts = g.particles;
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.life -= dt * 1000;
        if (p.life <= 0) { parts.splice(i, 1); continue; }
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.vx *= 0.94; p.vy *= 0.94;
      }

      const canvas = canvasRef.current;
      const w = g.dims.w, h = g.dims.h;
      if (canvas && w > 0 && h > 0) {
        const cw = Math.max(1, Math.round(w));
        const ch = Math.max(1, Math.round(h));
        if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, w, h);

        for (let i = parts.length - 1; i >= 0; i--) {
          const p = parts[i];
          const alpha = Math.max(0, p.life / p.maxLife);
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        if (g.flashColor && now < g.flashUntil) {
          ctx.fillStyle = g.flashColor;
          ctx.globalAlpha = 0.18;
          ctx.fillRect(0, 0, w, h);
          ctx.globalAlpha = 1;
        } else if (g.flashColor && now >= g.flashUntil) {
          g.flashColor = null;
        }
      }

      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, []);

  const meterFull = ui.meter >= BURST_METER_MAX;

  return (
    <div className="app">
      <div className="bg-grad"></div>
      <div className="hud">
        <div className="hud-item">Score<span className="hud-value score-val" data-testid="score">{ui.score}</span></div>
        <div className="hud-item">Combo<span className="hud-value combo-val" data-testid="combo">{ui.combo}</span></div>
        <div className="hud-item">Lives<span className="hud-value lives-val" data-testid="lives">{ui.lives}</span></div>
        <div className="hud-item">Level<span className="hud-value level-val" data-testid="level">{ui.level}</span></div>
      </div>

      <div className="field-wrap" data-testid="play-field">
        <div className="grid-stage" ref={stageRef} data-testid="arena-stage">
          <canvas className="game-canvas" ref={canvasRef} data-testid="canvas"></canvas>
          <div className="banner" data-testid="banner">{ui.banner || ' '}</div>
          <div className="grid">
            {gridView.map((cell, i) => (
              <button
                key={i}
                className={'cell ' + cell.type + (cursor === i ? ' cursor' : '')}
                data-testid={'cell-' + i}
                onPointerDown={(e) => { e.preventDefault(); handleCellTap(i); }}
              ></button>
            ))}
          </div>

          {ui.phase !== 'playing' && (
            <div className="overlay">
              {ui.phase === 'idle' && (
                <React.Fragment>
                  <h1 className="title">SPARK GRID</h1>
                  <p className="subtitle">Teal cells flash across the grid — tap or click them before they fade to score and build your combo. Gold cells pay out big. Red hazard cells cost a life if touched, so let them burn out instead. Move the cursor with Arrow keys or WASD and confirm with Space/Enter, or just tap directly. Fill the meter and press B or BURST to clear the board safely. Miss a target and your combo breaks. Lose three lives and the grid goes dark.</p>
                  <button className="start-btn" data-testid="start-btn" onClick={press}>START</button>
                  <p className="highscore-line">High Score: {ui.highScore}</p>
                </React.Fragment>
              )}
              {ui.phase === 'over' && (
                <React.Fragment>
                  <h1 className="title">GRID DARK</h1>
                  <p className="finalscore">Score: <b>{ui.score}</b></p>
                  <p className="highscore-line">High Score: {ui.highScore}</p>
                  <button className="start-btn" data-testid="start-btn" onClick={press}>RETRY</button>
                </React.Fragment>
              )}
            </div>
          )}
        </div>

        <div className="burst-row">
          <div className="meter-wrap">
            <div className="meter-fill" style={{ width: ui.meter + '%' }} data-testid="meter"></div>
          </div>
          <button
            className="burst-btn"
            data-testid="burst-btn"
            disabled={!meterFull}
            onPointerDown={(e) => { e.preventDefault(); handleBurst(); }}
          >BURST</button>
        </div>
      </div>

      <div className="hint">Tap glowing cells, dodge red hazards. Arrows/WASD + Space to play by keyboard. B to Burst.</div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
