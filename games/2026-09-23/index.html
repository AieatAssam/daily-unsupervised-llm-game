<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Flipper Surge</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #06030a; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }
  #root { width: 100%; height: 100%; }

  .app {
    width: 100%; height: 100%; position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; overflow: hidden; gap: 4px; padding: 6px 0;
    background: radial-gradient(circle at 50% 4%, #1a0f2a 0%, #0a0714 55%, #030208 100%);
  }

  .hud {
    display: flex; justify-content: space-around; width: 100%; max-width: 480px;
    padding: 4px 12px; z-index: 15; gap: 4px;
  }
  .hudBox { text-align: center; }
  .hudLabel { font-size: 9px; letter-spacing: 2px; color: #ff5ec4; text-transform: uppercase; }
  .hudValue {
    font-size: 19px; font-weight: 800; color: #fff;
    text-shadow: 0 0 10px #ff5ec4, 0 0 20px #ff5ec4;
  }
  .hudValue.combo { color: #ffd23d; text-shadow: 0 0 10px #ffd23d, 0 0 22px #b3860a; }
  .hudValue.lives { color: #4de8ff; text-shadow: 0 0 10px #4de8ff, 0 0 20px #1a5a8a; }
  .hudValue.pulse { animation: hudPulse 0.4s ease; }
  @keyframes hudPulse { 0%,100% { opacity:1; transform: scale(1);} 50% { opacity:0.5; transform: scale(1.3);} }

  .title {
    font-size: clamp(18px, 5vw, 28px); font-weight: 900; letter-spacing: 3px; margin-top: 20px;
    background: linear-gradient(90deg, #ff5ec4, #4de8ff, #ffd23d);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(255,94,196,0.6));
    animation: titlePulse 2.4s ease-in-out infinite;
    text-align: center;
  }
  @keyframes titlePulse { 0%,100% { filter: drop-shadow(0 0 12px rgba(255,94,196,0.6)); } 50% { filter: drop-shadow(0 0 26px rgba(77,232,255,0.85)); } }

  .subtitle { color: #b8c8d0; font-size: 12px; letter-spacing: 0.5px; text-align: center; max-width: 440px; line-height: 1.5; padding: 0 12px; }

  .btn {
    padding: 14px 38px; font-size: 18px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(135deg, #ff5ec4, #4de8ff);
    border: none; border-radius: 50px; color: #12061a; cursor: pointer;
    box-shadow: 0 0 20px rgba(255,94,196,0.7), 0 0 50px rgba(77,232,255,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(255,94,196,0.9), 0 0 70px rgba(77,232,255,0.5); }
  .btn:active { transform: scale(0.96); }

  .highscoreLine { color: #ffd23d; font-size: 13px; text-shadow: 0 0 8px rgba(255,210,61,0.6); }

  .fieldOuter {
    position: relative; height: min(64vh, 520px); z-index: 5;
    border-radius: 14px; overflow: hidden; border: 2px solid rgba(255,94,196,0.25);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 0 30px rgba(255,94,196,0.12);
    background: #08050c; touch-action: none;
  }
  .fieldOuter.shakeIt { animation: shakeKf 0.3s ease; }
  @keyframes shakeKf {
    0%, 100% { transform: translate(0,0); }
    20% { transform: translate(-5px, 2px); }
    40% { transform: translate(5px, -2px); }
    60% { transform: translate(-4px, -2px); }
    80% { transform: translate(4px, 2px); }
  }

  canvas.gameCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .flashOverlay {
    position: absolute; inset: 0; z-index: 9; pointer-events: none; background: rgba(255,46,79,0);
  }
  .flashOverlay.bad { animation: flashBadKf 0.3s ease; }
  @keyframes flashBadKf { 0% { background: rgba(255,46,79,0.28); } 100% { background: rgba(255,46,79,0); } }
  .flashOverlay.good { animation: flashGoodKf 0.35s ease; }
  @keyframes flashGoodKf { 0% { background: rgba(77,232,255,0.26); } 100% { background: rgba(77,232,255,0); } }
  .flashOverlay.gold { animation: flashGoldKf 0.5s ease; }
  @keyframes flashGoldKf { 0% { background: rgba(255,210,61,0.38); } 100% { background: rgba(255,210,61,0); } }

  .overlay {
    position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 14px;
    background: rgba(8, 5, 12, 0.93); backdrop-filter: blur(4px);
  }

  .controlsRow {
    display: flex; gap: 10px; z-index: 10; margin-top: 4px; width: min(94vw, 420px); justify-content: center;
  }
  .flipBtn {
    height: 58px; flex: 1; border-radius: 12px; cursor: pointer;
    background: linear-gradient(135deg, rgba(255,94,196,0.22), rgba(77,232,255,0.14));
    border: 2px solid rgba(255,94,196,0.45); color: #ffe3f6; font-size: 15px; font-weight: 900;
    letter-spacing: 1px;
    box-shadow: 0 0 14px rgba(255,94,196,0.3);
    transition: transform 0.1s ease, background 0.1s ease;
  }
  .flipBtn.pressed { transform: scale(0.94); background: rgba(255,94,196,0.4); }

  .status { color: #9aa8b3; font-size: 11px; letter-spacing: 0.5px; height: 14px; z-index: 10; text-align: center; }
  .footer { position: relative; text-align: center; color: #171d20; font-size: 10px; z-index: 10; padding-bottom: 2px; }

  @media (max-width: 480px) {
    .hudValue { font-size: 15px; }
    .btn { padding: 12px 28px; font-size: 15px; }
    .subtitle { font-size: 11px; }
    .fieldOuter { height: min(54vh, 440px); }
    .flipBtn { height: 52px; font-size: 13px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const HS_KEY = 'flipperSurgeHighScore';
const ASPECT = 0.62; // width / height

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }

function useAudio() {
  const ctxRef = useRef(null);
  const getCtx = () => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  };

  const tone = useCallback((freq, duration, type, gainScale, freqEnd) => {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + duration);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(gainScale, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.05);
    } catch (e) {}
  }, []);

  const flipSound = useCallback(() => tone(180, 0.05, 'square', 0.08, 320), [tone]);
  const bumperSound = useCallback((combo) => {
    const base = 380 + Math.min(combo, 14) * 40;
    tone(base, 0.09, 'sine', 0.14, base * 1.7);
  }, [tone]);
  const goldSound = useCallback(() => { tone(600, 0.14, 'triangle', 0.16, 1100); setTimeout(() => tone(900, 0.16, 'triangle', 0.14, 1400), 80); }, [tone]);
  const loseSound = useCallback(() => { tone(260, 0.22, 'sawtooth', 0.18, 100); }, [tone]);
  const levelSound = useCallback(() => { tone(500, 0.1, 'square', 0.1, 900); setTimeout(() => tone(750, 0.12, 'square', 0.1, 1200), 90); }, [tone]);
  const overSound = useCallback(() => { tone(300, 0.25, 'sawtooth', 0.2, 200); setTimeout(() => tone(180, 0.35, 'sawtooth', 0.2, 80), 150); }, [tone]);

  return { flipSound, bumperSound, goldSound, loseSound, levelSound, overSound };
}

function spawnBurst(arr, x, y, color, count, speedMin, speedMax, sizeMin, sizeMax, lifeMs) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = speedMin + Math.random() * (speedMax - speedMin);
    arr.push({
      x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      life: lifeMs, maxLife: lifeMs, color,
      size: sizeMin + Math.random() * (sizeMax - sizeMin),
    });
  }
}

const BUMPERS_BASE = [
  { xPct: 0.28, yPct: 0.26, rPct: 0.078, color: '#4de8ff' },
  { xPct: 0.72, yPct: 0.26, rPct: 0.078, color: '#ff5ec4' },
  { xPct: 0.50, yPct: 0.40, rPct: 0.088, color: '#ffd23d', gold: true },
  { xPct: 0.20, yPct: 0.56, rPct: 0.062, color: '#b76dff' },
  { xPct: 0.80, yPct: 0.56, rPct: 0.062, color: '#3dffa0' },
];

const LEFT_REST = 37 * Math.PI / 180;
const LEFT_ACTIVE = -55 * Math.PI / 180;
const RIGHT_REST = Math.PI - LEFT_REST;
const RIGHT_ACTIVE = Math.PI - LEFT_ACTIVE;
const ANGULAR_SPEED = 20;
const FLIP_POWER = 640;
const MAX_SPEED = 920;
const BUMPER_KICK = 330;

function gravityForLevel(level) { return 1 + Math.min(level - 1, 8) * 0.07; }

function App() {
  const [phase, setPhase] = useState('start'); // start | playing | over
  const [score, setScore] = useState(0);
  const [level, setLevel] = useState(1);
  const [lives, setLives] = useState(3);
  const [combo, setCombo] = useState(0);
  const [comboPulse, setComboPulse] = useState(false);
  const [shakeIt, setShakeIt] = useState(false);
  const [flashKind, setFlashKind] = useState(null);
  const [highScore, setHighScore] = useState(() => parseInt(localStorage.getItem(HS_KEY) || '0', 10));
  const [statusMsg, setStatusMsg] = useState('Hold a flipper to launch the ball into the bumpers.');
  const [leftPressed, setLeftPressed] = useState(false);
  const [rightPressed, setRightPressed] = useState(false);

  const canvasRef = useRef(null);
  const fieldRef = useRef(null);
  const particlesRef = useRef([]);

  const ballRef = useRef({ x: 100, y: 100, vx: 0, vy: 0 });
  const bumpersRef = useRef([]);
  const leftAngleRef = useRef(LEFT_REST);
  const rightAngleRef = useRef(RIGHT_REST);
  const leftActiveRef = useRef(false);
  const rightActiveRef = useRef(false);

  const scoreRef = useRef(0);
  const levelRef = useRef(1);
  const livesRef = useRef(3);
  const comboRef = useRef(0);
  const highScoreRef = useRef(highScore);
  const phaseRef = useRef('start');
  const dimsRef = useRef({ w: 260, h: 420 });

  const rafRef = useRef(null);
  const lastTsRef = useRef(null);
  const flashTimeoutRef = useRef(null);
  const shakeTimeoutRef = useRef(null);
  const comboPulseTimeoutRef = useRef(null);

  const { flipSound, bumperSound, goldSound, loseSound, levelSound, overSound } = useAudio();

  useEffect(() => { phaseRef.current = phase; }, [phase]);

  const checkHighScore = useCallback(() => {
    if (scoreRef.current > highScoreRef.current) {
      highScoreRef.current = scoreRef.current;
      localStorage.setItem(HS_KEY, String(scoreRef.current));
      setHighScore(scoreRef.current);
    }
  }, []);

  const resizeCanvas = useCallback(() => {
    const canvas = canvasRef.current;
    const field = fieldRef.current;
    if (!canvas || !field) return;
    const rect = field.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dimsRef.current = { w: rect.width, h: rect.height };
    bumpersRef.current = BUMPERS_BASE.map((b) => ({ ...b }));
  }, []);

  useEffect(() => {
    resizeCanvas();
    const setFieldWidth = () => {
      const field = fieldRef.current;
      if (!field) return;
      const h = field.getBoundingClientRect().height;
      field.style.width = Math.round(h * ASPECT) + 'px';
      resizeCanvas();
    };
    setFieldWidth();
    window.addEventListener('resize', setFieldWidth);
    return () => window.removeEventListener('resize', setFieldWidth);
  }, [resizeCanvas]);

  const spawnBall = useCallback(() => {
    const { w } = dimsRef.current;
    ballRef.current = { x: w / 2 + (Math.random() - 0.5) * w * 0.2, y: 14, vx: (Math.random() - 0.5) * 80, vy: 60 };
  }, []);

  const triggerFlash = useCallback((kind, ms) => {
    setFlashKind(kind);
    clearTimeout(flashTimeoutRef.current);
    flashTimeoutRef.current = setTimeout(() => setFlashKind(null), ms);
  }, []);

  const onBumperHit = useCallback((bumper) => {
    comboRef.current += 1;
    setCombo(comboRef.current);
    setComboPulse(true);
    clearTimeout(comboPulseTimeoutRef.current);
    comboPulseTimeoutRef.current = setTimeout(() => setComboPulse(false), 350);

    const base = bumper.gold ? 300 : 75;
    const gained = base + (comboRef.current - 1) * 15;
    scoreRef.current += gained;
    setScore(scoreRef.current);
    checkHighScore();

    const { w, h } = dimsRef.current;
    spawnBurst(particlesRef.current, bumper.xPct * w, bumper.yPct * h, bumper.color, bumper.gold ? 16 : 9, 60, 220, 1.5, 4, 500);

    if (bumper.gold) {
      goldSound();
      triggerFlash('gold', 450);
      setStatusMsg('JACKPOT BUMPER!');
    } else {
      bumperSound(comboRef.current);
      triggerFlash('good', 250);
      setStatusMsg(comboRef.current > 4 ? `Combo x${comboRef.current}!` : 'Nice hit!');
    }

    const newLevel = Math.floor(scoreRef.current / 1200) + 1;
    if (newLevel !== levelRef.current) {
      levelRef.current = newLevel;
      setLevel(newLevel);
      levelSound();
      setStatusMsg(`Level ${newLevel}! Gravity rising.`);
    }
  }, [checkHighScore, bumperSound, goldSound, levelSound, triggerFlash]);

  const onFlipperHit = useCallback(() => {
    flipSound();
  }, [flipSound]);

  const onLifeLost = useCallback(() => {
    livesRef.current -= 1;
    setLives(livesRef.current);
    comboRef.current = 0;
    setCombo(0);
    loseSound();
    triggerFlash('bad', 300);
    setShakeIt(true);
    clearTimeout(shakeTimeoutRef.current);
    shakeTimeoutRef.current = setTimeout(() => setShakeIt(false), 200);

    if (livesRef.current <= 0) {
      phaseRef.current = 'over';
      setPhase('over');
      overSound();
      setStatusMsg('Out of balls!');
      checkHighScore();
    } else {
      setStatusMsg('Ball lost! Next ball incoming.');
      spawnBall();
    }
  }, [loseSound, triggerFlash, overSound, checkHighScore, spawnBall]);

  const resetGame = useCallback(() => {
    scoreRef.current = 0; setScore(0);
    levelRef.current = 1; setLevel(1);
    livesRef.current = 3; setLives(3);
    comboRef.current = 0; setCombo(0);
    particlesRef.current = [];
    leftAngleRef.current = LEFT_REST;
    rightAngleRef.current = RIGHT_REST;
    leftActiveRef.current = false;
    rightActiveRef.current = false;
    setLeftPressed(false);
    setRightPressed(false);
    spawnBall();
  }, [spawnBall]);

  const startGame = useCallback(() => {
    resizeCanvas();
    resetGame();
    setStatusMsg('Hold a flipper to launch the ball into the bumpers.');
    phaseRef.current = 'playing';
    setPhase('playing');
  }, [resizeCanvas, resetGame]);

  const startGameRef = useRef(null);
  useEffect(() => { startGameRef.current = startGame; }, [startGame]);

  const setLeftActive = useCallback((active) => {
    if (leftActiveRef.current === active) return;
    leftActiveRef.current = active;
    setLeftPressed(active);
    if (active && phaseRef.current === 'playing') flipSound();
  }, [flipSound]);

  const setRightActive = useCallback((active) => {
    if (rightActiveRef.current === active) return;
    rightActiveRef.current = active;
    setRightPressed(active);
    if (active && phaseRef.current === 'playing') flipSound();
  }, [flipSound]);

  useEffect(() => {
    const onKeyDown = (e) => {
      if (phaseRef.current !== 'playing') {
        if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); startGameRef.current && startGameRef.current(); }
        return;
      }
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); setLeftActive(true); }
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); setRightActive(true); }
      else if (e.code === 'Space') { e.preventDefault(); setLeftActive(true); setRightActive(true); }
    };
    const onKeyUp = (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') { setLeftActive(false); }
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') { setRightActive(false); }
      else if (e.code === 'Space') { setLeftActive(false); setRightActive(false); }
    };
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    return () => { window.removeEventListener('keydown', onKeyDown); window.removeEventListener('keyup', onKeyUp); };
  }, [setLeftActive, setRightActive]);

  useEffect(() => () => {
    clearTimeout(flashTimeoutRef.current);
    clearTimeout(shakeTimeoutRef.current);
    clearTimeout(comboPulseTimeoutRef.current);
  }, []);

  // Main physics + draw loop
  useEffect(() => {
    const onBumperHitRef = onBumperHit;
    const onFlipperHitRef = onFlipperHit;
    const onLifeLostRef = onLifeLost;

    const loop = (ts) => {
      const canvas = canvasRef.current;
      if (canvas) {
        const ctx = canvas.getContext('2d');
        const { w, h } = dimsRef.current;

        if (lastTsRef.current == null) lastTsRef.current = ts;
        let dt = (ts - lastTsRef.current) / 1000;
        lastTsRef.current = ts;
        dt = clamp(dt, 0, 0.033);

        if (w > 10 && h > 10) {
          const leftTarget = leftActiveRef.current ? LEFT_ACTIVE : LEFT_REST;
          const rightTarget = rightActiveRef.current ? RIGHT_ACTIVE : RIGHT_REST;
          leftAngleRef.current += (leftTarget - leftAngleRef.current) * Math.min(1, dt * ANGULAR_SPEED);
          rightAngleRef.current += (rightTarget - rightAngleRef.current) * Math.min(1, dt * ANGULAR_SPEED);

          const leftPivot = { x: w * 0.16, y: h * 0.88 };
          const rightPivot = { x: w * 0.84, y: h * 0.88 };
          const flipperLen = w * 0.30;
          const flipperThick = w * 0.05;
          const leftTip = { x: leftPivot.x + Math.cos(leftAngleRef.current) * flipperLen, y: leftPivot.y + Math.sin(leftAngleRef.current) * flipperLen };
          const rightTip = { x: rightPivot.x + Math.cos(rightAngleRef.current) * flipperLen, y: rightPivot.y + Math.sin(rightAngleRef.current) * flipperLen };

          if (phaseRef.current === 'playing') {
            const ball = ballRef.current;
            const r = w * 0.028;

            ball.vy += 620 * gravityForLevel(levelRef.current) * dt;
            const speed = Math.hypot(ball.vx, ball.vy);
            if (speed > MAX_SPEED) { ball.vx = (ball.vx / speed) * MAX_SPEED; ball.vy = (ball.vy / speed) * MAX_SPEED; }

            ball.x += ball.vx * dt;
            ball.y += ball.vy * dt;

            if (ball.x - r < 0) { ball.x = r; ball.vx = -ball.vx * 0.85; }
            if (ball.x + r > w) { ball.x = w - r; ball.vx = -ball.vx * 0.85; }
            if (ball.y - r < 0) { ball.y = r; ball.vy = -ball.vy * 0.85; }

            for (const bumper of bumpersRef.current) {
              const bx = bumper.xPct * w, by = bumper.yPct * h, br = bumper.rPct * w;
              const d = dist(ball.x, ball.y, bx, by);
              if (d < r + br && d > 0.001) {
                const nx = (ball.x - bx) / d, ny = (ball.y - by) / d;
                const overlap = r + br - d;
                ball.x += nx * overlap; ball.y += ny * overlap;
                const kick = Math.max(Math.hypot(ball.vx, ball.vy), BUMPER_KICK);
                ball.vx = nx * kick; ball.vy = ny * kick;
                onBumperHitRef(bumper);
              }
            }

            [{ pivot: leftPivot, tip: leftTip, active: leftActiveRef.current }, { pivot: rightPivot, tip: rightTip, active: rightActiveRef.current }].forEach((fl) => {
              const dx = fl.tip.x - fl.pivot.x, dy = fl.tip.y - fl.pivot.y;
              const lenSq = dx * dx + dy * dy || 1;
              let t = ((ball.x - fl.pivot.x) * dx + (ball.y - fl.pivot.y) * dy) / lenSq;
              t = clamp(t, 0, 1);
              const px = fl.pivot.x + dx * t, py = fl.pivot.y + dy * t;
              const d = dist(ball.x, ball.y, px, py);
              const minDist = r + flipperThick / 2;
              if (d < minDist && d > 0.001) {
                const nx = (ball.x - px) / d, ny = (ball.y - py) / d;
                const overlap = minDist - d;
                ball.x += nx * overlap; ball.y += ny * overlap;
                if (fl.active) {
                  ball.vx = nx * FLIP_POWER;
                  ball.vy = ny * FLIP_POWER - 140;
                  onFlipperHitRef();
                } else {
                  const vdot = ball.vx * nx + ball.vy * ny;
                  ball.vx = (ball.vx - 2 * vdot * nx) * 0.5;
                  ball.vy = (ball.vy - 2 * vdot * ny) * 0.5;
                }
              }
            });

            if (ball.y - r > h + 4) {
              onLifeLostRef();
            }
          }

          particlesRef.current = particlesRef.current.filter((p) => p.life > 0);
          for (const p of particlesRef.current) {
            p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; p.life -= dt * 1000;
          }

          ctx.clearRect(0, 0, w, h);
          ctx.fillStyle = '#08050c';
          ctx.fillRect(0, 0, w, h);

          for (const bumper of bumpersRef.current) {
            const bx = bumper.xPct * w, by = bumper.yPct * h, br = bumper.rPct * w;
            ctx.save();
            ctx.fillStyle = bumper.color;
            ctx.shadowColor = bumper.color;
            ctx.shadowBlur = bumper.gold ? 22 : 14;
            ctx.globalAlpha = 0.92;
            ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();
            ctx.globalAlpha = 1;
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(bx, by, br * 0.55, 0, Math.PI * 2); ctx.stroke();
            ctx.restore();
          }

          [{ pivot: leftPivot, tip: leftTip, color: '#4de8ff' }, { pivot: rightPivot, tip: rightTip, color: '#ff5ec4' }].forEach((fl) => {
            ctx.save();
            ctx.strokeStyle = fl.color;
            ctx.shadowColor = fl.color;
            ctx.shadowBlur = 12;
            ctx.lineWidth = flipperThick;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(fl.pivot.x, fl.pivot.y);
            ctx.lineTo(fl.tip.x, fl.tip.y);
            ctx.stroke();
            ctx.restore();
          });

          if (phaseRef.current === 'playing') {
            const ball = ballRef.current;
            const r = w * 0.028;
            ctx.save();
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = '#fff';
            ctx.shadowBlur = 16;
            ctx.beginPath(); ctx.arc(ball.x, ball.y, r, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
          }

          for (const p of particlesRef.current) {
            const a = clamp(p.life / p.maxLife, 0, 1);
            ctx.save();
            ctx.globalAlpha = a;
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
          }
        }
      }
      rafRef.current = requestAnimationFrame(loop);
    };
    rafRef.current = requestAnimationFrame(loop);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [onBumperHit, onFlipperHit, onLifeLost]);

  return (
    <div className="app">
      <div className="hud">
        <div className="hudBox">
          <div className="hudLabel">Score</div>
          <div className="hudValue" data-testid="score">{score}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Level</div>
          <div className="hudValue" data-testid="level">{level}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Balls</div>
          <div className="hudValue lives" data-testid="lives">{lives}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Combo</div>
          <div className={"hudValue combo" + (comboPulse ? " pulse" : "")} data-testid="combo">x{combo}</div>
        </div>
      </div>

      {phase !== 'playing' && (
        <div style={{ marginTop: 10, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 12 }}>
          <div className="title">FLIPPER SURGE</div>
          <div className="subtitle">
            A neon ball drops through a glowing arena of bumpers. Hold the left or right flipper to swing it up and launch the ball back into play — catch it early for a strong flip, or let it droop and the ball dribbles off. Every bumper you smack builds a rising combo and score, the gold bumper pays out huge, and gravity gets stronger as your score climbs. Let the ball drain past both flippers and you lose one of three balls — how long can you keep the surge alive?
          </div>
        </div>
      )}

      <div
        className={"fieldOuter" + (shakeIt ? " shakeIt" : "")}
        data-testid="play-field"
        ref={fieldRef}
      >
        <canvas
          className="gameCanvas"
          data-testid="canvas"
          ref={canvasRef}
        ></canvas>
        <div className={"flashOverlay" + (flashKind ? " " + flashKind : "")}></div>

        {phase === 'start' && (
          <div className="overlay">
            <div className="highscoreLine">High Score: {highScore}</div>
            <button className="btn" data-testid="start-btn" onClick={startGame}>START</button>
          </div>
        )}

        {phase === 'over' && (
          <div className="overlay">
            <div className="title" style={{ marginTop: 0, fontSize: 22 }}>OUT OF BALLS</div>
            <div className="hudValue" style={{ fontSize: 26 }}>{score}</div>
            <div className="highscoreLine">High Score: {highScore}</div>
            <button className="btn" data-testid="start-btn" onClick={startGame}>RETRY</button>
          </div>
        )}
      </div>

      {phase === 'playing' && (
        <div className="controlsRow">
          <button
            className={"flipBtn" + (leftPressed ? " pressed" : "")}
            data-testid="left-flip-btn"
            onMouseDown={() => setLeftActive(true)}
            onMouseUp={() => setLeftActive(false)}
            onMouseLeave={() => setLeftActive(false)}
            onTouchStart={(e) => { e.preventDefault(); setLeftActive(true); }}
            onTouchEnd={(e) => { e.preventDefault(); setLeftActive(false); }}
            onTouchCancel={(e) => { e.preventDefault(); setLeftActive(false); }}
          >◀ LEFT FLIP</button>
          <button
            className={"flipBtn" + (rightPressed ? " pressed" : "")}
            data-testid="right-flip-btn"
            onMouseDown={() => setRightActive(true)}
            onMouseUp={() => setRightActive(false)}
            onMouseLeave={() => setRightActive(false)}
            onTouchStart={(e) => { e.preventDefault(); setRightActive(true); }}
            onTouchEnd={(e) => { e.preventDefault(); setRightActive(false); }}
            onTouchCancel={(e) => { e.preventDefault(); setRightActive(false); }}
          >RIGHT FLIP ▶</button>
        </div>
      )}

      <div className="status">{statusMsg}</div>
      <div className="footer">Neon Game Arcade</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
