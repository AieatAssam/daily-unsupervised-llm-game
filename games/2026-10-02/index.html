<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Ion Siege</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #050410; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }
  #root { width: 100%; height: 100%; }

  .app {
    width: 100%; height: 100%; position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; overflow: hidden; gap: 4px; padding: 6px 0;
    background: radial-gradient(circle at 50% 0%, #0f1a34 0%, #090b1a 50%, #050410 100%);
  }

  .bgGlow {
    position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: 0.55;
    background: radial-gradient(circle at 12% 15%, rgba(79,255,176,0.14), transparent 40%),
                radial-gradient(circle at 88% 20%, rgba(123,90,255,0.16), transparent 40%),
                radial-gradient(circle at 50% 95%, rgba(61,209,255,0.12), transparent 45%);
  }

  .hud {
    display: flex; justify-content: space-around; width: 100%; max-width: 460px;
    padding: 4px 8px; z-index: 15; gap: 2px; position: relative; flex-wrap: wrap;
  }
  .hudBox { text-align: center; min-width: 44px; }
  .hudLabel { font-size: 8px; letter-spacing: 1.5px; color: #8fd9ff; text-transform: uppercase; }
  .hudValue {
    font-size: 17px; font-weight: 800; color: #fff;
    text-shadow: 0 0 10px #3dd1ff, 0 0 20px #3dd1ff;
  }
  .hudValue.combo { color: #ffd23d; text-shadow: 0 0 10px #ffd23d, 0 0 22px #b3860a; }
  .hudValue.best { color: #7b5aff; text-shadow: 0 0 10px #7b5aff, 0 0 20px #7b5aff; }
  .hudValue.hp { color: #4fffb0; text-shadow: 0 0 10px #4fffb0, 0 0 20px #4fffb0; }
  .hudValue.pulse { animation: hudPulse 0.4s ease; }
  @keyframes hudPulse { 0%,100% { opacity:1; transform: scale(1);} 50% { opacity:0.5; transform: scale(1.3);} }

  .title {
    font-size: clamp(18px, 5vw, 28px); font-weight: 900; letter-spacing: 3px; margin-top: 8px;
    background: linear-gradient(90deg, #3dd1ff, #7b5aff, #4fffb0);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(61,209,255,0.6));
    animation: titlePulse 2.4s ease-in-out infinite;
    text-align: center;
  }
  @keyframes titlePulse { 0%,100% { filter: drop-shadow(0 0 12px rgba(61,209,255,0.6)); } 50% { filter: drop-shadow(0 0 26px rgba(123,90,255,0.85)); } }

  .subtitle { color: #c8d4e8; font-size: 12px; letter-spacing: 0.5px; text-align: center; max-width: 440px; line-height: 1.5; padding: 0 12px; }

  .btn {
    padding: 14px 38px; font-size: 18px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(135deg, #3dd1ff, #7b5aff);
    border: none; border-radius: 50px; color: #060616; cursor: pointer;
    box-shadow: 0 0 20px rgba(61,209,255,0.7), 0 0 50px rgba(123,90,255,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(61,209,255,0.9), 0 0 70px rgba(123,90,255,0.5); }
  .btn:active { transform: scale(0.96); }

  .highscoreLine { color: #7b5aff; font-size: 13px; text-shadow: 0 0 8px rgba(123,90,255,0.6); }

  .fieldOuter {
    position: relative; width: min(92vw, 400px); height: min(64vh, 500px); z-index: 5;
    border-radius: 16px; overflow: hidden; border: 2px solid rgba(61,209,255,0.3);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 0 30px rgba(61,209,255,0.14);
    background: #04030c; touch-action: none;
    margin-top: 4px;
  }
  .fieldOuter.shakeIt { animation: shakeKf 0.3s ease; }
  @keyframes shakeKf {
    0%, 100% { transform: translate(0,0); }
    20% { transform: translate(-5px, 2px); }
    40% { transform: translate(5px, -2px); }
    60% { transform: translate(-4px, -2px); }
    80% { transform: translate(4px, 2px); }
  }

  .gameCanvas { width: 100%; height: 100%; display: block; }

  .flashOverlay {
    position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.08s ease;
  }
  .flashOverlay.good { opacity: 0.2; background: #4fffb0; }
  .flashOverlay.bad { opacity: 0.3; background: #ff3355; }
  .flashOverlay.level { opacity: 0.32; background: #7b5aff; }

  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; background: rgba(4,3,12,0.75); z-index: 20; text-align: center; padding: 20px;
  }

  .controlsRow {
    display: flex; gap: 10px; width: min(92vw, 400px); margin-top: 6px; z-index: 15; justify-content: center;
  }
  .fireBtn {
    min-width: 120px; min-height: 52px; border-radius: 26px; border: 2px solid rgba(255,255,255,0.3);
    background: linear-gradient(135deg, #ff4d6a, #ff8f3d); color: #1a0608; font-size: 16px; font-weight: 900;
    letter-spacing: 2px; cursor: pointer; box-shadow: 0 0 16px rgba(255,77,106,0.6);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .fireBtn:active { transform: scale(0.92); }
  .hintRow { font-size: 10px; color: #7389a8; text-align: center; padding: 0 10px; }

  .status { font-size: 12px; color: #b8c8d8; min-height: 16px; text-align: center; padding: 0 10px; z-index: 15; }
  .footer { font-size: 9px; color: #4a5a68; letter-spacing: 1px; padding-bottom: 2px; z-index: 15; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useRef, useCallback, useEffect } = React;

const HS_KEY = 'ionSiegeHighScore';
const START_HP = 5;
const PLAYER_RADIUS = 11;
const BULLET_SPEED = 420;
const BASE_FIRE_COOLDOWN = 280;
const MIN_FIRE_COOLDOWN = 140;
const COMBO_WINDOW_MS = 1500;
const MAX_MULT = 4;
const LEVEL_SCORE_STEP = 300;

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }

function spawnBurst(list, x, y, color, count, speed, minSize, maxSize, life) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const sp = speed * (0.4 + Math.random() * 0.8);
    list.push({
      x, y,
      vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
      size: minSize + Math.random() * (maxSize - minSize),
      color, life, maxLife: life,
    });
  }
}

function useAudio() {
  const ctxRef = useRef(null);
  const noiseBufRef = useRef(null);

  const ensure = useCallback(() => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
      const ctx = ctxRef.current;
      const buf = ctx.createBuffer(1, ctx.sampleRate * 0.25, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
      noiseBufRef.current = buf;
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  }, []);

  const tone = useCallback((freq, dur, type, gainVal, when, freqEnd) => {
    const ctx = ctxRef.current;
    if (!ctx) return;
    const t0 = ctx.currentTime + (when || 0);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(gainVal, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }, []);

  const noise = useCallback((dur, gainVal) => {
    const ctx = ctxRef.current;
    if (!ctx || !noiseBufRef.current) return;
    const src = ctx.createBufferSource();
    src.buffer = noiseBufRef.current;
    const gain = ctx.createGain();
    const t0 = ctx.currentTime;
    gain.gain.setValueAtTime(gainVal, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(gain).connect(ctx.destination);
    src.start(t0);
    src.stop(t0 + dur);
  }, []);

  return {
    ensure,
    shootSound: () => tone(720, 0.06, 'square', 0.1, 0, 480),
    killSound: (mult) => { tone(440 + mult * 60, 0.08, 'sine', 0.2, 0); tone(880 + mult * 60, 0.1, 'sine', 0.14, 0.03); },
    hitSound: () => { noise(0.18, 0.28); tone(130, 0.2, 'sawtooth', 0.14, 0, 55); },
    levelSound: () => { tone(523, 0.09, 'sine', 0.2, 0); tone(659, 0.09, 'sine', 0.2, 0.08); tone(784, 0.16, 'sine', 0.2, 0.16); },
    overSound: () => { tone(392, 0.2, 'sawtooth', 0.18, 0, 196); },
  };
}

function App() {
  const [phase, setPhase] = useState('start');
  const [score, setScoreState] = useState(0);
  const [level, setLevelState] = useState(1);
  const [combo, setComboState] = useState(0);
  const [hp, setHpState] = useState(START_HP);
  const [best, setBest] = useState(() => parseInt(localStorage.getItem(HS_KEY) || '0', 10));
  const [comboPulse, setComboPulse] = useState(false);
  const [flashKind, setFlashKind] = useState(null);
  const [shakeIt, setShakeIt] = useState(false);
  const [statusMsg, setStatusMsg] = useState('Survive the ion swarm.');

  const phaseRef = useRef('start');
  const scoreRef = useRef(0);
  const levelRef = useRef(1);
  const comboRef = useRef(1);
  const comboLastKillRef = useRef(0);
  const hpRef = useRef(START_HP);
  const bestRef = useRef(best);

  const playerRef = useRef({ x: 0, y: 0, vx: 0, vy: 0, angle: -Math.PI / 2 });
  const keysRef = useRef({ up: false, down: false, left: false, right: false });
  const dragRef = useRef({ active: false, x: 0, y: 0 });
  const bulletsRef = useRef([]);
  const enemiesRef = useRef([]);
  const particlesRef = useRef([]);
  const lastFireRef = useRef(0);
  const nextSpawnRef = useRef(0);
  const startTimeRef = useRef(0);
  const rafRef = useRef(null);
  const canvasRef = useRef(null);
  const fieldRef = useRef(null);
  const dimsRef = useRef({ w: 0, h: 0 });
  const flashTimeoutRef = useRef(null);
  const shakeTimeoutRef = useRef(null);
  const comboPulseTimeoutRef = useRef(null);

  const audio = useAudio();

  useEffect(() => { phaseRef.current = phase; }, [phase]);

  const resizeCanvas = useCallback(() => {
    const canvas = canvasRef.current;
    const field = fieldRef.current;
    if (!canvas || !field) return;
    const rect = field.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dimsRef.current = { w: rect.width, h: rect.height };
  }, []);

  useEffect(() => {
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    return () => window.removeEventListener('resize', resizeCanvas);
  }, [resizeCanvas]);

  const triggerFlash = useCallback((kind, ms) => {
    setFlashKind(kind);
    clearTimeout(flashTimeoutRef.current);
    flashTimeoutRef.current = setTimeout(() => setFlashKind(null), ms);
  }, []);

  const startGame = useCallback(() => {
    audio.ensure();
    resizeCanvas();
    const { w, h } = dimsRef.current;
    levelRef.current = 1; setLevelState(1);
    scoreRef.current = 0; setScoreState(0);
    comboRef.current = 1; setComboState(1);
    comboLastKillRef.current = 0;
    hpRef.current = START_HP; setHpState(START_HP);
    playerRef.current = { x: w / 2 || 150, y: h / 2 || 200, vx: 0, vy: 0, angle: -Math.PI / 2 };
    bulletsRef.current = [];
    enemiesRef.current = [];
    particlesRef.current = [];
    lastFireRef.current = 0;
    nextSpawnRef.current = performance.now() + 500;
    startTimeRef.current = performance.now();
    setStatusMsg('Survive the ion swarm.');
    phaseRef.current = 'playing';
    setPhase('playing');
  }, [audio, resizeCanvas]);

  const startGameRef = useRef(null);
  useEffect(() => { startGameRef.current = startGame; }, [startGame]);

  const endGame = useCallback(() => {
    phaseRef.current = 'over';
    setPhase('over');
    audio.overSound();
    setStatusMsg('Siege broken.');
    if (scoreRef.current > bestRef.current) {
      bestRef.current = scoreRef.current;
      localStorage.setItem(HS_KEY, String(scoreRef.current));
      setBest(scoreRef.current);
    }
  }, [audio]);

  const takeDamage = useCallback(() => {
    hpRef.current -= 1;
    setHpState(hpRef.current);
    comboRef.current = 1; setComboState(1);
    comboLastKillRef.current = 0;
    audio.hitSound();
    triggerFlash('bad', 260);
    setShakeIt(true);
    clearTimeout(shakeTimeoutRef.current);
    shakeTimeoutRef.current = setTimeout(() => setShakeIt(false), 300);
    setStatusMsg('Hit! Combo lost.');
    if (hpRef.current <= 0) endGame();
  }, [audio, triggerFlash, endGame]);

  const registerKill = useCallback((ex, ey, now) => {
    if (now - comboLastKillRef.current < COMBO_WINDOW_MS) {
      comboRef.current = clamp(comboRef.current + 0.5, 1, MAX_MULT);
    } else {
      comboRef.current = 1.5;
    }
    comboLastKillRef.current = now;
    setComboState(comboRef.current);
    setComboPulse(true);
    clearTimeout(comboPulseTimeoutRef.current);
    comboPulseTimeoutRef.current = setTimeout(() => setComboPulse(false), 300);

    const gained = Math.round(20 * comboRef.current);
    scoreRef.current += gained;
    setScoreState(scoreRef.current);
    audio.killSound(comboRef.current);
    spawnBurst(particlesRef.current, ex, ey, '#4fffb0', 14, 90, 1.5, 3.5, 420);
    setStatusMsg(`+${gained} x${comboRef.current.toFixed(1)}`);

    const newLevel = Math.floor(scoreRef.current / LEVEL_SCORE_STEP) + 1;
    if (newLevel > levelRef.current) {
      levelRef.current = newLevel;
      setLevelState(newLevel);
      audio.levelSound();
      triggerFlash('level', 400);
      setStatusMsg(`Level ${newLevel}! Swarm intensifies.`);
    }
  }, [audio, triggerFlash]);

  const fire = useCallback((now) => {
    if (phaseRef.current !== 'playing') return;
    const cooldown = Math.max(MIN_FIRE_COOLDOWN, BASE_FIRE_COOLDOWN - levelRef.current * 12);
    if (now - lastFireRef.current < cooldown) return;
    lastFireRef.current = now;
    const p = playerRef.current;
    let angle = p.angle;
    let nearest = null, nearestD = Infinity;
    for (const e of enemiesRef.current) {
      const d = dist(p.x, p.y, e.x, e.y);
      if (d < nearestD) { nearestD = d; nearest = e; }
    }
    if (nearest) angle = Math.atan2(nearest.y - p.y, nearest.x - p.x);
    p.angle = angle;
    bulletsRef.current.push({
      x: p.x + Math.cos(angle) * (PLAYER_RADIUS + 4),
      y: p.y + Math.sin(angle) * (PLAYER_RADIUS + 4),
      vx: Math.cos(angle) * BULLET_SPEED,
      vy: Math.sin(angle) * BULLET_SPEED,
      life: 900,
    });
    audio.shootSound();
  }, [audio]);

  useEffect(() => {
    const onKeyDown = (e) => {
      if (phaseRef.current !== 'playing') {
        if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); startGameRef.current && startGameRef.current(); }
        return;
      }
      const k = keysRef.current;
      if (e.code === 'ArrowUp' || e.code === 'KeyW') k.up = true;
      else if (e.code === 'ArrowDown' || e.code === 'KeyS') k.down = true;
      else if (e.code === 'ArrowLeft' || e.code === 'KeyA') k.left = true;
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') k.right = true;
      else if (e.code === 'Space') { e.preventDefault(); fire(performance.now()); }
      else return;
      e.preventDefault();
    };
    const onKeyUp = (e) => {
      const k = keysRef.current;
      if (e.code === 'ArrowUp' || e.code === 'KeyW') k.up = false;
      else if (e.code === 'ArrowDown' || e.code === 'KeyS') k.down = false;
      else if (e.code === 'ArrowLeft' || e.code === 'KeyA') k.left = false;
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') k.right = false;
    };
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    return () => {
      window.removeEventListener('keydown', onKeyDown);
      window.removeEventListener('keyup', onKeyUp);
    };
  }, [fire]);

  useEffect(() => () => {
    clearTimeout(flashTimeoutRef.current);
    clearTimeout(shakeTimeoutRef.current);
    clearTimeout(comboPulseTimeoutRef.current);
  }, []);

  const spawnParams = useCallback((lvl, elapsedMs) => ({
    spawnInterval: Math.max(260, 1100 - lvl * 60 - elapsedMs * 0.01),
    enemySpeed: Math.min(170, 55 + lvl * 9),
  }), []);

  useEffect(() => {
    const draw = (now) => {
      const canvas = canvasRef.current;
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const { w, h } = dimsRef.current;
      if (w < 5 || h < 5) return;
      ctx.fillStyle = '#04030c';
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = 'rgba(61,209,255,0.05)';
      ctx.lineWidth = 1;
      const grid = 28;
      for (let x = 0; x < w; x += grid) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
      for (let y = 0; y < h; y += grid) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }

      const p = playerRef.current;

      if (phaseRef.current === 'playing') {
        const k = keysRef.current;
        let dx = 0, dy = 0;
        if (k.up) dy -= 1;
        if (k.down) dy += 1;
        if (k.left) dx -= 1;
        if (k.right) dx += 1;

        const maxSpeed = 220;
        if (dx !== 0 || dy !== 0) {
          const len = Math.hypot(dx, dy) || 1;
          p.vx += (dx / len) * maxSpeed * 0.18;
          p.vy += (dy / len) * maxSpeed * 0.18;
          p.angle = Math.atan2(dy, dx);
        }
        if (dragRef.current.active) {
          const tx = dragRef.current.x, ty = dragRef.current.y;
          p.x += (tx - p.x) * 0.22;
          p.y += (ty - p.y) * 0.22;
          p.vx *= 0.5; p.vy *= 0.5;
          const ddx = tx - p.x, ddy = ty - p.y;
          if (Math.hypot(ddx, ddy) > 2) p.angle = Math.atan2(ddy, ddx);
        }

        p.vx *= 0.88; p.vy *= 0.88;
        const speed = Math.hypot(p.vx, p.vy);
        if (speed > maxSpeed) { p.vx = (p.vx / speed) * maxSpeed; p.vy = (p.vy / speed) * maxSpeed; }
        p.x += p.vx * 0.016;
        p.y += p.vy * 0.016;
        p.x = clamp(p.x, PLAYER_RADIUS, w - PLAYER_RADIUS);
        p.y = clamp(p.y, PLAYER_RADIUS, h - PLAYER_RADIUS);

        const elapsed = now - startTimeRef.current;
        if (now >= nextSpawnRef.current) {
          const { spawnInterval, enemySpeed } = spawnParams(levelRef.current, elapsed);
          const edge = Math.floor(Math.random() * 4);
          let ex, ey;
          if (edge === 0) { ex = Math.random() * w; ey = -14; }
          else if (edge === 1) { ex = w + 14; ey = Math.random() * h; }
          else if (edge === 2) { ex = Math.random() * w; ey = h + 14; }
          else { ex = -14; ey = Math.random() * h; }
          enemiesRef.current.push({ x: ex, y: ey, speed: enemySpeed, hp: 1, r: 9 });
          nextSpawnRef.current = now + spawnInterval;
        }

        for (const e of enemiesRef.current) {
          const ang = Math.atan2(p.y - e.y, p.x - e.x);
          e.x += Math.cos(ang) * e.speed * 0.016;
          e.y += Math.sin(ang) * e.speed * 0.016;
        }

        for (const b of bulletsRef.current) {
          b.x += b.vx * 0.016; b.y += b.vy * 0.016; b.life -= 16;
        }
        bulletsRef.current = bulletsRef.current.filter(b => b.life > 0 && b.x > -20 && b.x < w + 20 && b.y > -20 && b.y < h + 20);

        const deadEnemies = new Set();
        for (const b of bulletsRef.current) {
          for (const e of enemiesRef.current) {
            if (deadEnemies.has(e)) continue;
            if (dist(b.x, b.y, e.x, e.y) < e.r + 4) {
              deadEnemies.add(e);
              b.life = 0;
              registerKill(e.x, e.y, now);
            }
          }
        }
        if (deadEnemies.size) {
          enemiesRef.current = enemiesRef.current.filter(e => !deadEnemies.has(e));
          bulletsRef.current = bulletsRef.current.filter(b => b.life > 0);
        }

        const hitEnemies = new Set();
        for (const e of enemiesRef.current) {
          if (dist(p.x, p.y, e.x, e.y) < e.r + PLAYER_RADIUS) hitEnemies.add(e);
        }
        if (hitEnemies.size) {
          enemiesRef.current = enemiesRef.current.filter(e => !hitEnemies.has(e));
          takeDamage();
        }
      }

      const particles = particlesRef.current;
      for (const pt of particles) {
        pt.x += pt.vx * 0.016; pt.y += pt.vy * 0.016;
        pt.vx *= 0.94; pt.vy *= 0.94; pt.life -= 16;
      }
      particlesRef.current = particles.filter(pt => pt.life > 0);

      for (const e of enemiesRef.current) {
        ctx.save();
        ctx.fillStyle = '#ff5577';
        ctx.shadowColor = '#ff5577';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      for (const b of bulletsRef.current) {
        ctx.save();
        ctx.fillStyle = '#ffd23d';
        ctx.shadowColor = '#ffd23d';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(b.x, b.y, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      for (const pt of particlesRef.current) {
        const a = clamp(pt.life / pt.maxLife, 0, 1);
        ctx.save();
        ctx.globalAlpha = a;
        ctx.fillStyle = pt.color;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      if (phaseRef.current === 'playing' || phaseRef.current === 'over') {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.fillStyle = '#3dd1ff';
        ctx.shadowColor = '#3dd1ff';
        ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.moveTo(PLAYER_RADIUS + 4, 0);
        ctx.lineTo(-PLAYER_RADIUS, PLAYER_RADIUS * 0.8);
        ctx.lineTo(-PLAYER_RADIUS * 0.4, 0);
        ctx.lineTo(-PLAYER_RADIUS, -PLAYER_RADIUS * 0.8);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    };

    const tick = (now) => {
      draw(now);
      rafRef.current = requestAnimationFrame(tick);
    };
    rafRef.current = requestAnimationFrame(tick);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [spawnParams, registerKill, takeDamage]);

  const fieldPointToLocal = useCallback((clientX, clientY) => {
    const field = fieldRef.current;
    if (!field) return { x: 0, y: 0 };
    const rect = field.getBoundingClientRect();
    return { x: clamp(clientX - rect.left, 0, rect.width), y: clamp(clientY - rect.top, 0, rect.height) };
  }, []);

  const onFieldMouseMove = useCallback((e) => {
    if (phaseRef.current !== 'playing') return;
    const pt = fieldPointToLocal(e.clientX, e.clientY);
    const p = playerRef.current;
    p.angle = Math.atan2(pt.y - p.y, pt.x - p.x);
  }, [fieldPointToLocal]);

  const onFieldMouseDown = useCallback((e) => {
    if (phaseRef.current !== 'playing') return;
    fire(performance.now());
  }, [fire]);

  const onFieldTouchStart = useCallback((e) => {
    if (phaseRef.current !== 'playing') return;
    const t = e.touches[0];
    const pt = fieldPointToLocal(t.clientX, t.clientY);
    dragRef.current = { active: true, x: pt.x, y: pt.y };
  }, [fieldPointToLocal]);

  const onFieldTouchMove = useCallback((e) => {
    if (phaseRef.current !== 'playing') return;
    const t = e.touches[0];
    const pt = fieldPointToLocal(t.clientX, t.clientY);
    dragRef.current.x = pt.x; dragRef.current.y = pt.y;
  }, [fieldPointToLocal]);

  const onFieldTouchEnd = useCallback(() => {
    dragRef.current.active = false;
  }, []);

  const onFireBtn = useCallback((e) => {
    e.stopPropagation();
    if (phaseRef.current !== 'playing') return;
    fire(performance.now());
  }, [fire]);

  return (
    <div className="app">
      <div className="bgGlow"></div>
      <div className="hud">
        <div className="hudBox">
          <div className="hudLabel">Score</div>
          <div className="hudValue" data-testid="score">{score}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Level</div>
          <div className="hudValue" data-testid="level">{level}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Combo</div>
          <div className={"hudValue combo" + (comboPulse ? " pulse" : "")} data-testid="combo">x{combo.toFixed(1)}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">HP</div>
          <div className="hudValue hp" data-testid="hp">{hp}</div>
        </div>
        <div className="hudBox">
          <div className="hudLabel">Best</div>
          <div className="hudValue best" data-testid="best">{best}</div>
        </div>
      </div>

      {phase !== 'playing' && (
        <div style={{ marginTop: 2, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 10 }}>
          <div className="title">ION SIEGE</div>
          <div className="subtitle">
            Hostile drones swarm in from every edge of the arena. Move with Arrow keys / WASD, or drag anywhere in the field on touch, to dodge the siege. Press Space, click the field, or tap FIRE to snap a shot at the nearest drone — chain kills quickly to build a rising combo multiplier, but every hit you take resets it and costs a life. Survive as long as you can as the swarm thickens each level.
          </div>
        </div>
      )}

      <div
        className={"fieldOuter" + (shakeIt ? " shakeIt" : "")}
        data-testid="play-field"
        ref={fieldRef}
        onMouseMove={onFieldMouseMove}
        onMouseDown={onFieldMouseDown}
        onTouchStart={onFieldTouchStart}
        onTouchMove={onFieldTouchMove}
        onTouchEnd={onFieldTouchEnd}
      >
        <canvas className="gameCanvas" data-testid="canvas" ref={canvasRef}></canvas>
        <div className={"flashOverlay" + (flashKind ? " " + flashKind : "")}></div>

        {phase === 'start' && (
          <div className="overlay">
            <div className="highscoreLine">Best: {best}</div>
            <button className="btn" data-testid="start-btn" onClick={startGame}>START</button>
          </div>
        )}

        {phase === 'over' && (
          <div className="overlay">
            <div className="title" style={{ marginTop: 0, fontSize: 22 }}>SIEGE BROKEN</div>
            <div className="hudValue" style={{ fontSize: 26 }}>{score}</div>
            <div className="highscoreLine">Best: {best}</div>
            <button className="btn" data-testid="start-btn" onClick={startGame}>RETRY</button>
          </div>
        )}
      </div>

      {phase === 'playing' && (
        <div className="controlsRow">
          <button
            className="fireBtn"
            data-testid="fire-btn"
            onClick={onFireBtn}
            onTouchStart={onFireBtn}
          >FIRE</button>
        </div>
      )}

      <div className="status">{statusMsg}</div>
      <div className="hintRow">Arrows/WASD or drag to move · Space/click/FIRE to shoot</div>
      <div className="footer">Neon Game Arcade</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
